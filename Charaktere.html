// ── HELPERS ──────────────────────────────────────────────
function hexPoints(s) {
  const cx = s/2, cy = s/2, r = s/2;
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = (Math.PI/180)*(60*i - 30);
    pts.push(`${cx + r*Math.cos(a)},${cy + r*Math.sin(a)}`);
  }
  return pts.join(' ');
}

function FloatingHexField({ mouseX, mouseY }) {
  return (
    <div style={{ position:'fixed', inset:0, pointerEvents:'none', zIndex:1, overflow:'hidden', clipPath:'inset(212px 0 0 0)' }}>
      {HEX_DEFS.map((h, i) => {
        const px = hexPoints(h.size);
        const parallaxX = (mouseX - 0.5) * (i % 3 === 0 ? -12 : i % 3 === 1 ? -6 : -18);
        const parallaxY = (mouseY - 0.5) * (i % 3 === 0 ? -8  : i % 3 === 1 ? -4 : -14);
        return (
          <div key={i} style={{ position:'absolute', left:h.x, top:h.y, animation:`${h.anim} ${h.dur} ease-in-out infinite`, animationDelay:`${i*0.7}s`, transform:`translate(${parallaxX}px,${parallaxY}px)`, transition:'transform 0.4s ease-out', willChange:'transform' }}>

            </svg>

// ── PARTICLES ────────────────────────────────────────────
function ParticleField({ mouseX, mouseY }) {
  const canvasRef = useRef(null);
  const animRef = useRef(null);
  const particles = useRef([]);
  const mouse = useRef({ x:0.5, y:0.5 });
  useEffect(() => { mouse.current = { x: mouseX, y: mouseY }; }, [mouseX, mouseY]);
  useEffect(() => {
    const canvas = canvasRef.current; if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const resize = () => { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; };
    resize(); window.addEventListener('resize', resize);
    particles.current = Array.from({length:55}, () => ({
      x: Math.random(), y: Math.random(),
      r: Math.random()*1.6+0.5,
      vx:(Math.random()-0.5)*0.05, vy:(Math.random()-0.5)*0.05,
      alpha: Math.random()*0.2+0.05,
    }));
    const tick = () => {
      const w = canvas.width, h = canvas.height;
      const shiftX = (mouse.current.x - 0.5)*-14, shiftY = (mouse.current.y - 0.5)*-14;
      ctx.clearRect(0,0,w,h);
      particles.current.forEach(p => {
        p.x += p.vx/w*60; p.y += p.vy/h*60;
        if(p.x<0)p.x=1; if(p.x>1)p.x=0; if(p.y<0)p.y=1; if(p.y>1)p.y=0;
        ctx.beginPath(); ctx.arc(p.x*w+shiftX, p.y*h+shiftY, p.r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(160,140,255,${p.alpha})`; ctx.fill();
      });
      animRef.current = requestAnimationFrame(tick);
    };
    tick();
    return () => { cancelAnimationFrame(animRef.current); window.removeEventListener('resize', resize); };
  }, []);
  return <canvas ref={canvasRef} style={{ position:'fixed', inset:0, width:'100%', height:'100%', pointerEvents:'none', zIndex:0, clipPath:'inset(212px 0 0 0)' }} />;
}

// ── SCROLL REVEAL ────────────────────────────────────────
function useScrollReveal() {
  useEffect(() => {
    const revealed = new WeakSet();
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting || revealed.has(entry.target)) return;
        revealed.add(entry.target);
        observer.unobserve(entry.target);
        entry.target.classList.add('visible');
      });
    }, { threshold: 0.05, rootMargin: '0px 0px -20px 0px' });
    const t = setTimeout(() => {
      document.querySelectorAll('.reveal-up').forEach(el => observer.observe(el));
    }, 100);
    return () => { clearTimeout(t); observer.disconnect(); };
  }, []);
}

                  color: hov ? `${acc}dd` : `${acc}88`,
                  padding:'3px 8px',
                  border: `1px solid ${hov ? acc + '55' : acc + '28'}`,
                  borderRadius:'2px',
                  background: hov ? `${acc}10` : 'transparent',
                  transition:'all 0.3s',
                }}>{t}</span>
              ))}
            </div>
          </div>

          {/* CTA COLUMN */}
          <div style={{ position:'relative', zIndex:2, display:'flex', flexDirection:'column', alignItems:'flex-end', justifyContent:'center', gap:'10px', padding:'0 4px 0 20px', minWidth:'110px' }}>
            <div style={{ fontFamily:'var(--font-display)', fontSize:'9.5px', letterSpacing:'0.32em', textTransform:'uppercase',
              color: hov ? '#f0eeff' : 'rgba(200,190,240,0.55)',
              textShadow: hov ? `0 0 12px ${acc}88` : 'none',
              transition:'color 0.3s, text-shadow 0.3s' }}>
              Öffnen
            </div>
            <div style={{ display:'flex', alignItems:'center', gap:'6px' }}>
              <div style={{ height:'1px', width: hov ? '32px' : '18px', background:`linear-gradient(90deg, transparent, ${hov ? acc : acc + '55'})`,
                transition:'width 0.3s, background 0.3s' }} />
              <span style={{ fontFamily:'var(--font-mono)', fontSize:'16px',
                color: hov ? '#f0eeff' : `${acc}aa`,
                textShadow: hov ? `0 0 10px ${acc}cc` : 'none',
                transition:'color 0.3s, text-shadow 0.3s' }}>→</span>
            </div>
          </div>

        </div>
      </a>
    </div>
  );
}

// ── SECTION DIVIDER (between Meine Charaktere and the rest) ───
function SectionDivider({ label, delay }) {
  const acc = '#7c4dff';
  return (
    <div className="reveal-up" style={{ transitionDelay:`${delay}s`, position:'relative', padding:'10px 0 8px', margin:'2px 0' }}>
      {/* Gap-spanning faint hex column marker on the left, aligned with the ribbon-card icon spine (168px / 2 = 84px) */}
      <div style={{ position:'absolute', left:'84px', top:'0', bottom:'0', display:'flex', alignItems:'center', justifyContent:'center', pointerEvents:'none' }}>
        <svg width="14" height="14" viewBox="0 0 14 14" style={{ display:'block', filter:`drop-shadow(0 0 6px ${acc}99)` }}>
          <polygon points={hexPoints(14)} fill="rgba(5,4,15,1)" stroke={acc} strokeWidth="0.9"/>
          <polygon points={hexPoints(8)} transform="translate(3 3)" fill={`${acc}88`} stroke="none"/>
        </svg>
      </div>

      <div style={{ display:'flex', alignItems:'center', gap:'14px', paddingLeft:'180px', paddingRight:'8px' }}>
        <span style={{ fontFamily:'var(--font-mono)', fontSize:'8.5px', letterSpacing:'0.32em', color:`${acc}aa`, textTransform:'uppercase', whiteSpace:'nowrap' }}>
          ◇ {label}
        </span>
        <div style={{ flex:1, position:'relative', height:'1px' }}>
          {/* Layered divider: solid base + dashed accent + mid-glow */}
          <div style={{ position:'absolute', inset:0, background:`linear-gradient(90deg, ${acc}55 0%, ${acc}33 50%, transparent 100%)` }} />
          <div style={{ position:'absolute', inset:0, borderTop:`1px dashed ${acc}40` }} />
          <div style={{ position:'absolute', left:'30%', top:'-2px', width:'120px', height:'4px', background:`radial-gradient(ellipse, ${acc}55, transparent 70%)`, filter:'blur(2px)' }} />
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:'6px' }}>
          <svg width="6" height="6" viewBox="0 0 6 6"><polygon points={hexPoints(6)} fill={`${acc}77`} stroke={`${acc}aa`} strokeWidth="0.5"/></svg>
          <svg width="9" height="9" viewBox="0 0 9 9"><polygon points={hexPoints(9)} fill="none" stroke={`${acc}aa`} strokeWidth="0.7"/></svg>
          <svg width="6" height="6" viewBox="0 0 6 6"><polygon points={hexPoints(6)} fill={`${acc}77`} stroke={`${acc}aa`} strokeWidth="0.5"/></svg>
        </div>
      </div>
    </div>
  );
}

// ── APP ──────────────────────────────────────────────────
function App() {
  const [mouse, setMouse] = useState({ x:0.5, y:0.5 });
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const handleMouseMove = useCallback(e => { setMouse({ x: e.clientX/window.innerWidth, y: e.clientY/window.innerHeight }); }, []);
  useScrollReveal();

  // Annotate spine-break flags: the card after a divider should not draw a top spine.
  const sectionsAnnotated = SECTIONS.map((s, i) => ({
    ...s,
    spineBreakAbove: i > 0 && SECTIONS[i-1].dividerAfter === true,
  }));

  return (
    <div onMouseMove={handleMouseMove} style={{ position:'relative', minHeight:'100vh' }}>
      {tweaks.showParticles && <ParticleField mouseX={mouse.x} mouseY={mouse.y} />}
      {tweaks.showHexes && <FloatingHexField mouseX={mouse.x} mouseY={mouse.y} />}

      {/* ── HEADER IMAGE ── */}
      <div style={{ position:'relative', zIndex:10, width:'100%', height:'160px',
        background:'linear-gradient(180deg, rgba(20,10,50,0.95) 0%, rgba(10,8,30,0.98) 100%)',
        borderBottom:'1px solid rgba(160,140,255,0.15)', overflow:'hidden',
        display:'flex', alignItems:'center', justifyContent:'center' }}>
        <div style={{ position:'absolute', inset:0,
          background:`radial-gradient(ellipse at 20% 50%, rgba(124,77,255,0.18) 0%, transparent 50%), radial-gradient(ellipse at 80% 50%, rgba(45,125,255,0.14) 0%, transparent 50%), repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(160,140,255,0.04) 60px, rgba(160,140,255,0.04) 61px)`,
          pointerEvents:'none' }} />
        <div style={{ position:'absolute', inset:0,
          backgroundImage:`repeating-linear-gradient(135deg, transparent, transparent 18px, rgba(124,77,255,0.03) 18px, rgba(124,77,255,0.03) 19px)`,
          pointerEvents:'none' }} />
        <div style={{ fontFamily:'var(--font-mono)', fontSize:'9px', color:'rgba(160,140,255,0.3)', letterSpacing:'0.3em', textTransform:'uppercase', position:'relative', zIndex:1 }}>
          Kopfbild — Artwork hier ablegen
        </div>
      </div>

      <SiteNav rightLabel="CHARAKTER-REGISTER" />

      {/* ── MAIN ── */}
      <div style={{ position:'relative', zIndex:5, maxWidth:'1180px', margin:'0 auto', padding:'52px 40px 80px' }}>

        {/* Page hero */}
        <div className="reveal-up" style={{ marginBottom:'48px', textAlign:'center', position:'relative' }}>
          <div style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.32em', color:'rgba(160,140,255,0.45)', textTransform:'uppercase', marginBottom:'14px' }}>
            Meruria · Register
          </div>
          <h1 style={{ fontFamily:'var(--font-display)', fontSize:'clamp(30px,4vw,50px)', fontWeight:'300', letterSpacing:'0.22em', color:'#f0eeff', textShadow:'0 0 50px rgba(124,77,255,0.4)', marginBottom:'18px', lineHeight:1.15, textTransform:'uppercase' }}>
            Charaktere
          </h1>
          <div style={{ display:'flex', alignItems:'center', gap:'12px', justifyContent:'center', marginBottom:'22px' }}>
            <div style={{ width:'60px', height:'1px', background:'linear-gradient(270deg, rgba(124,77,255,0.6), transparent)' }} />
            <svg width="8" height="8" viewBox="0 0 8 8"><polygon points={hexPoints(8)} fill="rgba(124,77,255,0.35)" stroke="rgba(160,140,255,0.6)" strokeWidth="0.8" /></svg>
            <div style={{ width:'8px', height:'1px', background:'rgba(124,77,255,0.4)', animation:'pulse-glow 2s infinite' }} />
            <svg width="5" height="5" viewBox="0 0 5 5"><polygon points={hexPoints(5)} fill="rgba(160,140,255,0.2)" stroke="rgba(160,140,255,0.4)" strokeWidth="0.6" /></svg>
            <div style={{ width:'8px', height:'1px', background:'rgba(124,77,255,0.4)', animation:'pulse-glow 2s infinite 0.4s' }} />
            <svg width="8" height="8" viewBox="0 0 8 8"><polygon points={hexPoints(8)} fill="rgba(124,77,255,0.35)" stroke="rgba(160,140,255,0.6)" strokeWidth="0.8" /></svg>
            <div style={{ width:'60px', height:'1px', background:'linear-gradient(90deg, rgba(124,77,255,0.6), transparent)' }} />
          </div>
          <p style={{ fontFamily:'var(--font-body)', fontWeight:'300', fontSize:'13px', lineHeight:1.9, color:'rgba(220,210,255,0.5)', letterSpacing:'0.05em', maxWidth:'580px', margin:'0 auto', textWrap:'pretty' }}>
            Jede Figur, die einen Platz in Meruria gefunden hat — eigene Helden, die Charaktere der Mitspielenden und alle Gesichter, die der Spielleiter führt.
          </p>
        </div>

        {/* Codex header strip */}
        <div className="reveal-up" style={{ transitionDelay:'0.04s', display:'flex', alignItems:'center', gap:'14px', marginBottom:'22px' }}>
          <div style={{ display:'flex', alignItems:'center', gap:'10px' }}>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:'9px', letterSpacing:'0.28em', color:'rgba(160,140,255,0.7)', textTransform:'uppercase' }}>Bereiche</span>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:'9px', letterSpacing:'0.18em', color:'rgba(160,140,255,0.4)' }}>·</span>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:'9px', letterSpacing:'0.18em', color:'rgba(160,140,255,0.45)' }}>{`${SECTIONS.length.toString().padStart(2,'0')} Register`}</span>
          </div>
          <div style={{ flex:1, height:'1px', background:'linear-gradient(90deg, rgba(160,140,255,0.25) 0%, transparent 100%)' }}/>
          <div style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.3em', color:'rgba(160,140,255,0.35)', textTransform:'uppercase' }}>
            Charaktere
          </div>
        </div>

        {/* Ribbon stack with vertical spine + section divider after the first card */}
        <div style={{ display:'flex', flexDirection:'column', gap:'14px', position:'relative' }}>
          {sectionsAnnotated.map((sec, i) => (
            <React.Fragment key={sec.id}>
              <RibbonCard
                sec={sec}
                index={i}
                isFirst={i === 0}
                isLast={i === sectionsAnnotated.length - 1}
                delay={0.06 + i * 0.08}
              />
              {sec.dividerAfter && (
                <SectionDivider label="Mitspielende & Spielleitung" delay={0.06 + i * 0.08 + 0.04} />
              )}
            </React.Fragment>
          ))}
        </div>

        {/* Closing flourish */}
        <div className="reveal-up" style={{ transitionDelay:'0.4s', display:'flex', alignItems:'center', gap:'14px', marginTop:'34px', justifyContent:'center' }}>
          <div style={{ width:'80px', height:'1px', background:'linear-gradient(270deg, rgba(124,77,255,0.5), transparent)' }} />
          <svg width="6" height="6" viewBox="0 0 6 6"><polygon points={hexPoints(6)} fill="rgba(124,77,255,0.4)" stroke="rgba(160,140,255,0.5)" strokeWidth="0.5" /></svg>
          <div style={{ width:'80px', height:'1px', background:'linear-gradient(90deg, rgba(124,77,255,0.5), transparent)' }} />
        </div>

      </div>

      {/* ── FOOTER ── */}
      <div style={{ position:'relative', zIndex:10, padding:'10px 32px', borderTop:'1px solid rgba(160,140,255,0.07)', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
        <div style={{ fontFamily:'var(--font-mono)', fontSize:'7px', color:'rgba(160,140,255,0.22)', letterSpacing:'0.2em' }}>◈ REGISTER-STATUS: NOMINAL ◈ EPOCHE: UNBEKANNT</div>
        <div style={{ fontFamily:'var(--font-mono)', fontSize:'7px', color:'rgba(160,140,255,0.22)', letterSpacing:'0.2em' }}>MERURIA // CHARAKTER-REGISTER</div>
      </div>

      <TweaksPanel>
        <TweakSection label="Atmosphäre"/>
        <TweakToggle id="showParticles" label="Partikel"/>
        <TweakToggle id="showHexes" label="Hexagone"/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<SiteGate><App/></SiteGate>);
</script>


</body></html>
