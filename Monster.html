// Stable hash matching Kollektikon's _monsterKolId
function _monsterKolId(name) {
  let h = 5381;
  for (let i = 0; i < name.length; i++) h = (Math.imul(h, 33) ^ name.charCodeAt(i)) >>> 0;

}
