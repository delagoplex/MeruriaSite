<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg:#05040f; --white:#f0eeff; --silver:#c8c0e8;
    --font-display:'Cinzel',serif; --font-body:'Raleway',sans-serif; --font-mono:'Share Tech Mono',monospace;
    --nav-h:52px; --sidebar-w:200px;
  }
  html,body { width:100%; min-height:100%; background:var(--bg); color:var(--white); font-family:var(--font-body); overflow-x:hidden; }
  #root { width:100%; min-height:100vh; }

  body::after { content:''; position:fixed; inset:0; pointer-events:none; z-index:9999; background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px); }

  @keyframes flicker-mid { 0%,80%,100%{opacity:1} 82%{opacity:0.55} 84%{opacity:1} 87%{opacity:0.7} 89%{opacity:1} 91%{opacity:0.4} 93%{opacity:1} }
  @keyframes slideDown { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
  @keyframes dissolveIn  { 0%{opacity:0;filter:blur(10px) brightness(1.8);transform:scale(1.03)} 100%{opacity:1;filter:blur(0) brightness(1);transform:scale(1)} }
  @keyframes dissolveOut { 0%{opacity:1} 100%{opacity:0;filter:blur(10px) brightness(0.4)} }
  @keyframes floatSymbol { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-7px) rotate(2deg)} }
  @keyframes pulse-glow  { 0%,100%{opacity:0.5} 50%{opacity:1} }
  @keyframes glitch-clip  { 0%{clip-path:inset(40% 0 61% 0);transform:translate(-3px,0)} 25%{clip-path:inset(92% 0 1% 0);transform:translate(3px,0)} 50%{clip-path:inset(25% 0 58% 0);transform:translate(-2px,0)} 75%{clip-path:inset(54% 0 7% 0);transform:translate(2px,0)} 100%{clip-path:inset(43% 0 40% 0);transform:translate(-1px,0)} }
  @keyframes glitch-clip2 { 0%{clip-path:inset(20% 0 70% 0);transform:translate(3px,0) skewX(0.3deg)} 33%{clip-path:inset(60% 0 10% 0);transform:translate(-3px,0) skewX(-0.3deg)} 66%{clip-path:inset(10% 0 50% 0);transform:translate(2px,0)} 100%{clip-path:inset(80% 0 5% 0);transform:translate(-2px,0)} }
  @keyframes neu-bg-glitch {
    0%  { opacity:0; clip-path:inset(50% 0 50% 0); background:transparent; }
    5%  { opacity:1; clip-path:inset(0% 0 72% 0);  transform:translateX(-8px);  background:rgba(124,77,255,0.45); }
    15% { clip-path:inset(55% 0 8% 0);             transform:translateX(10px);  background:rgba(180,140,255,0.50); }

    35% { clip-path:inset(68% 0 4% 0);             transform:translateX(8px);   background:rgba(180,140,255,0.45); }
    45% { clip-path:inset(8% 0 62% 0);             transform:translateX(-5px);  background:rgba(124,77,255,0.35); }
    55% { clip-path:inset(40% 0 20% 0);            transform:translateX(6px);   background:rgba(80,50,200,0.30); }
    70% { opacity:0.4; }
    100%{ opacity:0; }
  }

    0%  { opacity:0; clip-path:inset(50% 0 50% 0); background:transparent; }

// pts = polygon points for a flat-top regular hexagon inscribed in a square of `size`
function hexPoints(s) {
  const cx = s / 2, cy = s / 2, r = s / 2;
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const angle = (Math.PI / 180) * (60 * i - 30); // pointy-top
    pts.push(`${cx + r * Math.cos(angle)},${cy + r * Math.sin(angle)}`);
  }
  return pts.join(' ');
}
function OctSvg({ size = 24, color = 'currentColor', fill = 'none', strokeWidth = 1, opacity = 1, style = {} }) {
  const pts = hexPoints(size);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ display:'block', flexShrink:0, ...style }}>
      <polygon points={pts} fill={fill} stroke={color} strokeWidth={strokeWidth} opacity={opacity} />
    </svg>
  );
}

// ── SCROLL REVEAL ──────────────────────────────────────
// Cards in the same grid row (same top offset) fade in together.
// Rows appear sequentially as they scroll into view.
function useScrollReveal() {
  useEffect(() => {
    // Remove any .visible classes left from a previous render cycle
    document.querySelectorAll('.reveal-up.visible, .reveal-left.visible').forEach((el) => {
      el.classList.remove('visible');
    });

    let observer;
    const revealedEls = new WeakSet();

    const revealEl = (el, delay) => {
      if (revealedEls.has(el)) return;
      revealedEls.add(el);
      setTimeout(() => el.classList.add('visible'), delay);
    };

    const init = () => {
      observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          const el = entry.target;
          observer.unobserve(el);

          if (el.classList.contains('reveal-left')) {
            revealEl(el, 0);
            return;
          }

          // Group grid siblings by row (same rounded top)
          const parent = el.parentElement;
          if (!parent) { revealEl(el, 0); return; }

          const siblings = Array.from(parent.querySelectorAll('.reveal-up'));
          const rowMap = new Map();
          siblings.forEach((sib) => {
            const top = Math.round(sib.getBoundingClientRect().top);
            if (!rowMap.has(top)) rowMap.set(top, []);
            rowMap.get(top).push(sib);
          });
          const sortedTops = Array.from(rowMap.keys()).sort((a, b) => a - b);

          const elTop = Math.round(el.getBoundingClientRect().top);
          const rowIndex = sortedTops.indexOf(elTop);
          const rowDelay = Math.max(0, rowIndex) * 80;

          const rowEls = rowMap.get(elTop) || [el];
          rowEls.forEach((rowEl) => {
            observer.unobserve(rowEl);
            revealEl(rowEl, rowDelay);
          });
        });
      }, { threshold: 0.06, rootMargin: '0px 0px -24px 0px' });

      document.querySelectorAll('.reveal-up, .reveal-left').forEach((el) => {
        // Ensure starting state is invisible
        el.classList.remove('visible');
        observer.observe(el);
      });
    };

    const t = setTimeout(init, 120);
    return () => { clearTimeout(t); observer && observer.disconnect(); };
  }, []); // run once on mount only
}

// ── PARTICLES (bg only, very slow) ────────────────────
function ParticleField({ mouseX, mouseY }) {
  const canvasRef = useRef(null);
  const animRef = useRef(null);
  const particles = useRef([]);
  const mouse = useRef({ x: 0.5, y: 0.5 });

  useEffect(() => {mouse.current = { x: mouseX, y: mouseY };}, [mouseX, mouseY]);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const resize = () => {canvas.width = canvas.offsetWidth;canvas.height = canvas.offsetHeight;};
    resize();window.addEventListener('resize', resize);

    particles.current = Array.from({ length: 50 }, () => ({
      x: Math.random(), y: Math.random(),
      r: Math.random() * 2.2 + 1.0,
      vx: (Math.random() - 0.5) * 0.03, vy: (Math.random() - 0.5) * 0.03,
      alpha: Math.random() * 0.22 + 0.05
    }));

    const tick = () => {
      const w = canvas.width,h = canvas.height;
      const shiftX = (mouse.current.x - 0.5) * -14;
      const shiftY = (mouse.current.y - 0.5) * -14;
      ctx.clearRect(0, 0, w, h);
      particles.current.forEach((p) => {
        p.x += p.vx / w * 60;p.y += p.vy / h * 60;
        if (p.x < 0) p.x = 1;if (p.x > 1) p.x = 0;
        if (p.y < 0) p.y = 1;if (p.y > 1) p.y = 0;
        ctx.beginPath();
        ctx.arc(p.x * w + shiftX, p.y * h + shiftY, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(160,140,255,${p.alpha})`;
        ctx.fill();
      });
      animRef.current = requestAnimationFrame(tick);
    };
    tick();
    return () => {cancelAnimationFrame(animRef.current);window.removeEventListener('resize', resize);};
  }, []);

  return <canvas ref={canvasRef} style={{ position: 'fixed', inset: 0, width: '100%', height: '100%', pointerEvents: 'none', zIndex: 0 }} />;
}

// ── TOC SIDEBAR ────────────────────────────────────────
function TOCSidebar({ headerBottom, navHeight, cols }) {
  const [topOffset, setTopOffset] = React.useState(navHeight);

  useEffect(() => {
    const update = () => {
      const ideal = (headerBottom || 0) - window.scrollY;
      setTopOffset(Math.max(navHeight, ideal));
    };
    update();
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update, { passive: true });
    return () => { window.removeEventListener('scroll', update); window.removeEventListener('resize', update); };
  }, [headerBottom, navHeight]);

  const scrollTo = (id) => {
    const el = document.getElementById(id);
    if (el) {
      const y = el.getBoundingClientRect().top + window.scrollY - navHeight - 8;
      window.scrollTo({ top: y, behavior: 'smooth' });
    }
  };

  // Build TOC: section headers + entity name rows (grouped by cols)
  const buildEntries = () => {
    const entries = [];
    const sections = [
      { id: 'merurisches-pantheon', label: 'Merurisches Pantheon', subsections: [
        { entities: gods.filter(g => ['aurelia','elysarion','sienna','avalaste','cecillia','lorelei','vindeah','ferys'].includes(g.id)) },
        { entities: gods.filter(g => ['daramur','eiritha','hadir','selunara','aetherius','serenith','hydea','melion'].includes(g.id)) },
        { entities: gods.filter(g => ['ophelis','thraxis','maledor'].includes(g.id)) },
      ]},
      { id: 'daemonen', label: 'Dämonen', subsections: [{ entities: demons }] },
      { id: 'naturgeister', label: 'Naturgeister', subsections: [{ entities: naturgeister }] },
    ];

    sections.forEach(sec => {
      entries.push({ id: sec.id, label: sec.label, isSection: true });
      let globalRowIdx = 0;
      (sec.subsections || []).forEach(sub => {
        const ents = sub.entities || [];
        for (let i = 0; i < ents.length; i += cols) {
          const row = ents.slice(i, i + cols);
          const rowId = `${sec.id}-row-${globalRowIdx}`;
          entries.push({ id: rowId, label: row.map(e => e.name).join(' ● '), isSection: false });
          globalRowIdx++;
        }
      });
    });
    return entries;
  };

  const tocEntries = buildEntries();

  return (
    <aside style={{ width:'var(--sidebar-w)', flexShrink:0, position:'fixed', top:`${topOffset}px`, left:0, height:`calc(100vh - ${topOffset}px)`, borderRight:'1px solid rgba(160,140,255,0.1)', padding:'28px 0', background:'rgba(5,4,15,0.85)', backdropFilter:'blur(12px)', zIndex:50, overflowY:'auto', transition:'top 0.05s linear, height 0.05s linear' }}>
      <div style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.25em', color:'rgba(160,140,255,0.4)', textTransform:'uppercase', padding:'0 20px', marginBottom:'4px' }}>Gottheiten</div>
      {tocEntries.map(entry => (
        <button key={entry.id} onClick={() => scrollTo(entry.id)}
          style={{ display:'flex', alignItems:'flex-start', gap:'8px', width:'100%', textAlign:'left', padding:'7px 20px', background:'transparent', border:'none', cursor:'pointer', fontFamily:'var(--font-body)', fontWeight:'400', fontSize:'11px', letterSpacing:'0.1em', fontVariant:'small-caps', color: entry.isSection ? 'rgba(200,190,240,0.75)' : 'rgba(200,190,240,0.6)', borderLeft:'2px solid transparent', transition:'all 0.15s', lineHeight:1.55 }}
          onMouseEnter={e=>{ e.currentTarget.style.color='#f0eeff'; e.currentTarget.style.borderLeftColor='rgba(124,77,255,0.6)'; e.currentTarget.style.background='rgba(124,77,255,0.06)'; }}
          onMouseLeave={e=>{ e.currentTarget.style.color=entry.isSection?'rgba(200,190,240,0.75)':'rgba(200,190,240,0.6)'; e.currentTarget.style.borderLeftColor='transparent'; e.currentTarget.style.background='transparent'; }}>
          <OctSvg size={entry.isSection ? 6 : 4} color={entry.isSection ? 'rgba(124,77,255,0.6)' : 'rgba(124,77,255,0.3)'} fill={entry.isSection ? 'rgba(124,77,255,0.3)' : 'transparent'} strokeWidth={1} style={{ flexShrink:0, marginTop:'3px' }} />
          <span style={{ display:'block', minWidth:0, wordBreak:'normal', overflowWrap:'anywhere', fontWeight: entry.isSection ? '500' : '400' }}>{entry.label}</span>
        </button>
      ))}
    </aside>
  );
}

      </div>

      {/* FOOTER */}
      <div style={{ position: 'relative', zIndex: 10, padding: '10px 32px', borderTop: '1px solid rgba(160,140,255,0.07)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div style={{ fontFamily: 'var(--font-mono)', fontSize: '7px', color: 'rgba(160,140,255,0.22)', letterSpacing: '0.2em' }}>◈ ARCHIV-STATUS: NOMINAL ◈ EPOCHE: UNBEKANNT</div>
        <div style={{ fontFamily: 'var(--font-mono)', fontSize: '7px', color: 'rgba(160,140,255,0.22)', letterSpacing: '0.2em' }}>MERURIA // DIE VERWOBENEN REICHE</div>
      </div>

      {/* DETAIL OVERLAY */}
      {selectedEntity && <EntityDetail entity={selectedEntity} onBack={handleBack} typeLabel={selectedType} />}

      <TweaksPanel>
        <TweakSection label="Layout" />
        <TweakSlider id="columns" label="Spalten" min={2} max={4} step={1} />
        <TweakSlider id="headerHeight" label="Kopfzeile Höhe" min={80} max={320} step={10} />
        <TweakSection label="Darstellung" />
        <TweakToggle id="showParticles" label="Partikel" />
      </TweaksPanel>
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>


</body></html>
