// ── HEXAGON SVG helper ─────────────────────────────────
// pts = polygon points for a flat-top regular hexagon inscribed in a square of `size`
function hexPoints(s) {
  const cx = s / 2, cy = s / 2, r = s / 2;
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const angle = (Math.PI / 180) * (60 * i - 30); // pointy-top
    pts.push(`${cx + r * Math.cos(angle)},${cy + r * Math.sin(angle)}`);
  }
  return pts.join(' ');
}
function OctSvg({ size = 24, color = 'currentColor', fill = 'none', strokeWidth = 1, opacity = 1, style = {} }) {
  const pts = hexPoints(size);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ display:'block', flexShrink:0, ...style }}>
      <polygon points={pts} fill={fill} stroke={color} strokeWidth={strokeWidth} opacity={opacity} />
    </svg>
  );
}
function parseRich(text, accent = 'rgba(160,140,255,0.9)') {
  if (!text || !text.includes('**')) return text;
  return text.split(/(\*\*.*?\*\*)/g).map((part, i) =>
    part.startsWith('**') && part.endsWith('**')
      ? <strong key={i} style={{color: accent, fontWeight:'500',fontStyle:'normal'}}>{part.slice(2,-2)}</strong>
      : part
  );
}

// ── SCROLL REVEAL ──────────────────────────────────────
// Cards in the same grid row (same top offset) fade in together.
// Rows appear sequentially as they scroll into view.
function useScrollReveal() {
  useEffect(() => {
    // Remove any .visible classes left from a previous render cycle
    document.querySelectorAll('.reveal-up.visible, .reveal-left.visible').forEach((el) => {
      el.classList.remove('visible');
    });

    let observer;
    const revealedEls = new WeakSet();

    const revealEl = (el, delay) => {
      if (revealedEls.has(el)) return;
      revealedEls.add(el);
      setTimeout(() => el.classList.add('visible'), delay);
    };

    const init = () => {
      observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          const el = entry.target;
          observer.unobserve(el);

          if (el.classList.contains('reveal-left')) {
            revealEl(el, 0);
            return;
          }

          // Group grid siblings by row (same rounded top)
          const parent = el.parentElement;
          if (!parent) { revealEl(el, 0); return; }

          const siblings = Array.from(parent.querySelectorAll('.reveal-up'));
          const rowMap = new Map();
          siblings.forEach((sib) => {
            const top = Math.round(sib.getBoundingClientRect().top);
            if (!rowMap.has(top)) rowMap.set(top, []);
            rowMap.get(top).push(sib);
          });
          const sortedTops = Array.from(rowMap.keys()).sort((a, b) => a - b);

          const elTop = Math.round(el.getBoundingClientRect().top);
          const rowIndex = sortedTops.indexOf(elTop);
          const rowDelay = Math.max(0, rowIndex) * 80;

          const rowEls = rowMap.get(elTop) || [el];
          rowEls.forEach((rowEl) => {
            observer.unobserve(rowEl);
            revealEl(rowEl, rowDelay);
          });
        });
      }, { threshold: 0.06, rootMargin: '0px 0px -24px 0px' });

      document.querySelectorAll('.reveal-up, .reveal-left').forEach((el) => {
        // Ensure starting state is invisible
        el.classList.remove('visible');
        observer.observe(el);
      });
    };

    const t = setTimeout(init, 120);
    return () => { clearTimeout(t); observer && observer.disconnect(); };
  }, []); // run once on mount only
}

                    <div style={{ width: '18px', height: '18px', borderRadius: '2px', background: hex, boxShadow: copiedIndex === i ? `0 0 12px ${hex}` : `0 0 6px ${hex}88`, transition: 'box-shadow 0.2s' }} />
                    <span style={{ fontFamily: 'var(--font-mono)', fontSize: '6px', color: copiedIndex === i ? hex : pal[2] + '88', letterSpacing: '0.05em', transition: 'color 0.2s', width: '34px', minHeight: '9px', textAlign: 'center', display: 'block' }}>{copiedIndex === i ? '✓' : hex}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      </div>

      {onPrev && (
        <div style={{ position:'absolute', left:'14px', top:'50%', transform:'translateY(-50%)', zIndex:10 }}>
          <button className="entity-nav-arrow" onClick={onPrev} style={{ width:'40px', height:'80px', background:`${pal[2]}10`, border:`1px solid ${pal[2]}28`, borderRadius:'4px', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', color:pal[3] }}>
            <svg width="14" height="22" viewBox="0 0 14 22" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><polyline points="10,2 3,11 10,20"/></svg>
          </button>
        </div>
      )}
      {onNext && (
        <div style={{ position:'absolute', right:'14px', top:'50%', transform:'translateY(-50%)', zIndex:10 }}>
          <button className="entity-nav-arrow" onClick={onNext} style={{ width:'40px', height:'80px', background:`${pal[2]}10`, border:`1px solid ${pal[2]}28`, borderRadius:'4px', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', color:pal[3] }}>
            <svg width="14" height="22" viewBox="0 0 14 22" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><polyline points="4,2 11,11 4,20"/></svg>
          </button>
        </div>
      )}
    </div>);

}

// ── SECTION BANNER ─────────────────────────────────────

  const col = accentColor || '#7c4dff';
  return (
    <div style={{
      width: '100%',
      height: '160px',
      marginBottom: '20px',
      borderRadius: '4px',
      border: `1px dashed ${col}44`,
      background: `repeating-linear-gradient(-45deg, transparent, transparent 8px, ${col}07 8px, ${col}07 9px), linear-gradient(135deg, ${col}0a 0%, transparent 100%)`,
      display: 'flex',
      alignItems: 'center',
      justifyContent: 'center',
      overflow: 'hidden',
      position: 'relative',
    }}>
      <div style={{ position: 'absolute', inset: 0, background: `radial-gradient(ellipse at 50% 50%, ${col}12 0%, transparent 70%)`, pointerEvents: 'none' }} />
      <div style={{ display:'flex', alignItems:'center', gap:'10px', position:'relative', zIndex:1 }}>
        <OctSvg size={28} color={col + '33'} strokeWidth={1} />
        <span style={{ fontFamily: 'var(--font-mono)', fontSize: '8px', letterSpacing: '0.25em', color: col + '44', textTransform: 'uppercase' }}>Kopfbild hier ablegen</span>
        <OctSvg size={28} color={col + '33'} strokeWidth={1} />
      </div>
    </div>
  );
}

// ── SECTION HEADING ────────────────────────────────────
function SectionHeading({ title, subtitle, accentColor }) {
  const col = accentColor || '#7c4dff';
  return (
    <div className="reveal-left" style={{ marginBottom: '8px' }}>
      {subtitle &&
      <div style={{ fontFamily: 'var(--font-mono)', fontSize: '8px', letterSpacing: '0.25em', color: col + '77', textTransform: 'uppercase', marginBottom: '6px' }}>{subtitle}</div>
      }
      <div style={{ display:'flex', alignItems:'center', gap:'12px' }}>
        <OctSvg size={8} color={col+'66'} fill={col+'22'} strokeWidth={1} />
        <h2 style={{ fontFamily: 'var(--font-display)', fontSize: '22px', fontWeight: '300', letterSpacing: '0.18em', color: 'var(--white)', textShadow: `0 0 24px ${col}44` }}>{title}</h2>
      </div>
      <div style={{ width: '50px', height: '1px', background: `linear-gradient(90deg,${col}99,transparent)`, marginTop: '10px', animation: 'pulse-glow 3s infinite' }} />
    </div>);

}

// ── TOC SIDEBAR ────────────────────────────────────────
function TOCSidebar({ headerBottom, navHeight, cols }) {
  const asideRef = React.useRef(null);
  const [collapsed, setCollapsed] = useState({});

  useEffect(() => {
    const update = () => {
      const ideal = (headerBottom || 0) - window.scrollY;
      const val = Math.max(navHeight, ideal);
      if (asideRef.current) { asideRef.current.style.top = val + 'px'; asideRef.current.style.height = `calc(100vh - ${val}px)`; }
    };
    update();
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update, { passive: true });
    return () => { window.removeEventListener('scroll', update); window.removeEventListener('resize', update); };
  }, [headerBottom, navHeight]);

  const scrollTo = (id) => {
    const el = document.getElementById(id);
    if (el) {
      const y = el.getBoundingClientRect().top + window.scrollY - navHeight - 8;
      window.scrollTo({ top: y, behavior: 'smooth' });
    }
  };

  const toggleSection = (id) => setCollapsed(c => ({ ...c, [id]: !c[id] }));

  // Build TOC: section headers + entity name rows (grouped by cols)
  const buildEntries = () => {
    const entries = [];
    const sections = [
      { id: 'merurisches-pantheon', label: 'Merurisches Pantheon', subsections: [
        { entities: gods.filter(g => ['aurelia','elysarion','sienna','avalaste','cecillia','lorelei','vindeah','ferys'].includes(g.id)) },
        { entities: gods.filter(g => ['daramur','eiritha','hadir','selunara','aetherius','serenith','hydea','melion'].includes(g.id)) },
        { entities: gods.filter(g => ['ophelis','thraxis','maledor'].includes(g.id)) },
      ]},
      { id: 'daemonen', label: 'Dämonen', subsections: [{ entities: demons }] },
      { id: 'naturgeister', label: 'Naturgeister', subsections: [{ entities: naturgeister }] },
    ];

    sections.forEach(sec => {
      entries.push({ id: sec.id, label: sec.label, isSection: true });
      if (!collapsed[sec.id]) {
        let globalRowIdx = 0;
        (sec.subsections || []).forEach(sub => {
          const ents = sub.entities || [];
          for (let i = 0; i < ents.length; i += cols) {
            const row = ents.slice(i, i + cols);
            const rowId = `${sec.id}-row-${globalRowIdx}`;
            entries.push({ id: rowId, label: row.map(e => e.name).join(' ● '), isSection: false });
            globalRowIdx++;
          }
        });
      }
    });
    return entries;
  };

  const tocEntries = buildEntries();

  return (
    <aside ref={asideRef} style={{ width:'var(--sidebar-w)', flexShrink:0, position:'fixed', top:`${navHeight}px`, left:0, height:`calc(100vh - ${navHeight}px)`, borderRight:'1px solid rgba(var(--accent-rgb),0.1)', padding:'28px 0', background:'rgba(var(--bg-rgb),0.85)', backdropFilter:'blur(12px)', zIndex:50, overflowY:'auto' }}>
      <div style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.25em', color:'rgba(var(--accent-rgb),0.4)', textTransform:'uppercase', padding:'0 20px', marginBottom:'4px' }}>Gottheiten</div>
      {tocEntries.map(entry => (
        <button key={entry.id}
          onClick={() => entry.isSection ? toggleSection(entry.id) : scrollTo(entry.id)}
          style={{ display:'flex', alignItems:'flex-start', gap:'8px', width:'100%', textAlign:'left', padding:'7px 20px', background:'transparent', border:'none', cursor:'pointer', fontFamily:'var(--font-body)', fontWeight:'400', fontSize:'11px', letterSpacing:'0.1em', fontVariant:'small-caps', color: entry.isSection ? 'rgba(var(--text-rgb),0.75)' : 'rgba(var(--text-rgb),0.6)', borderLeft:'2px solid transparent', transition:'all 0.15s', lineHeight:1.55 }}
          onMouseEnter={e=>{ e.currentTarget.style.color='var(--white)'; e.currentTarget.style.borderLeftColor='rgba(124,77,255,0.6)'; e.currentTarget.style.background='rgba(124,77,255,0.06)'; }}
          onMouseLeave={e=>{ e.currentTarget.style.color=entry.isSection?'rgba(var(--text-rgb),0.75)':'rgba(var(--text-rgb),0.6)'; e.currentTarget.style.borderLeftColor='transparent'; e.currentTarget.style.background='transparent'; }}>
          {entry.isSection ? (
            <svg width="8" height="8" viewBox="0 0 8 8" style={{ flexShrink:0, marginTop:'3px', transition:'transform 0.18s', transform: collapsed[entry.id] ? 'rotate(0deg)' : 'rotate(90deg)', opacity:0.5 }}>
              <polygon points="1,1 7,4 1,7" fill="rgba(var(--accent-rgb),1)" />
            </svg>
          ) : (
            <OctSvg size={4} color="rgba(124,77,255,0.3)" fill="transparent" strokeWidth={1} style={{ flexShrink:0, marginTop:'3px' }} />
          )}
          <span style={{ display:'block', minWidth:0, wordBreak:'normal', overflowWrap:'anywhere', fontWeight: entry.isSection ? '500' : '400' }}>{entry.label}</span>
        </button>
      ))}
    </aside>
  );
}

// ── APP ────────────────────────────────────────────────
function App() {
  const [selectedEntity, setSelectedEntity] = useState(null);
  const [selectedType, setSelectedType] = useState(null);
  const [mouse, setMouse] = useState({ x: 0.5, y: 0.5 });
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [headerBottom, setHeaderBottom] = useState(0);
  const NAV_H = 52;

  const headerRef = useRef(null);
  const pageTitleRef = useRef(null);

  const handleMouseMove = useCallback((e) => {setMouse({ x: e.clientX / window.innerWidth, y: e.clientY / window.innerHeight });}, []);

  const handleEntityClick = (entity, type) => {setSelectedEntity(entity);setSelectedType(type || null);};
  const handleBack = () => {setSelectedEntity(null);setSelectedType(null);};

  const allEntities = useMemo(() => {
    const gutIds = ['aurelia','elysarion','sienna','avalaste','cecillia','lorelei','vindeah','ferys'];
    const neutralIds = ['daramur','eiritha','hadir','selunara','aetherius','serenith','hydea','melion'];
    const boeseIds = ['ophelis','thraxis','maledor'];
    const byId = Object.fromEntries(gods.map(g => [g.id, g]));
    return [
      ...gutIds.map(id => byId[id]).filter(Boolean).map(e => ({ entity: e, type: null })),
      ...neutralIds.map(id => byId[id]).filter(Boolean).map(e => ({ entity: e, type: null })),
      ...boeseIds.map(id => byId[id]).filter(Boolean).map(e => ({ entity: e, type: null })),
      ...demons.map(e => ({ entity: e, type: 'Dämon' })),
      ...naturgeister.map(e => ({ entity: e, type: 'Naturgeist' })),
    ];
  }, []);
  const selIdx = allEntities.findIndex(item => item.entity.id === selectedEntity?.id);
  const onEntityPrev = selIdx > 0 ? () => { const p = allEntities[selIdx - 1]; setSelectedEntity(p.entity); setSelectedType(p.type); } : null;
  const onEntityNext = selIdx < allEntities.length - 1 ? () => { const n = allEntities[selIdx + 1]; setSelectedEntity(n.entity); setSelectedType(n.type); } : null;

  // Measure the absolute document bottom of the page-title block
  useEffect(() => {
    const measure = () => {
      if (pageTitleRef.current) {
        const rect = pageTitleRef.current.getBoundingClientRect();
        setHeaderBottom(rect.bottom + window.scrollY - 10);
      }
    };
    measure();
    window.addEventListener('resize', measure, { passive: true });
    return () => window.removeEventListener('resize', measure);
  }, [tweaks.headerHeight]);

  useScrollReveal();



  return (
    <div onMouseMove={handleMouseMove} className="page-root">
      {tweaks.showParticles && <ParticleField mouseX={mouse.x} mouseY={mouse.y} />}
      <FloatingHexField mouseX={mouse.x} mouseY={mouse.y} />

      {/* HEADER */}
      <PageHeader height={tweaks.headerHeight} />

      {/* NAV */}
      <SiteNav rightLabel="PANTHEON-ARCHIV v2.7" />

      {/* BODY: sidebar + content */}
      <div className="page-body">
        <TOCSidebar headerBottom={headerBottom} navHeight={NAV_H} cols={tweaks.columns || 3} />

        {/* MAIN CONTENT */}
        <div style={{ flex: 1, padding: '32px 28px 64px', minWidth: 0 }}>

          {/* Page title — aligned with card grid */}
          <div style={{ marginBottom: '32px' }}>
            <div ref={pageTitleRef} style={{ fontFamily: 'var(--font-mono)', fontSize: '8px', letterSpacing: '0.25em', color: 'rgba(var(--accent-rgb),0.4)', textTransform: 'uppercase', marginBottom: '6px' }}>Welt Enzyklopädie</div>
            <h1 className="reveal-left" style={{ fontFamily: 'var(--font-display)', fontSize: '42px', fontWeight: '300', letterSpacing: '0.18em', color: 'var(--white)', textShadow: '0 0 30px rgba(124,77,255,0.35)' }}>Gottheiten</h1>
            <div style={{ display:'flex', alignItems:'center', gap:'8px', marginTop:'12px' }}>
              <div style={{ width: '50px', height: '1px', background: 'linear-gradient(90deg,rgba(124,77,255,0.8),transparent)', animation: 'pulse-glow 3s infinite' }} />
              <OctSvg size={8} color="rgba(124,77,255,0.5)" fill="rgba(124,77,255,0.2)" strokeWidth={1} />
            </div>
          </div>

          {/* ── MERURISCHES PANTHEON ── */}
          {(() => {
            const cols = tweaks.columns || 3;
            const gutIds = ['aurelia','elysarion','sienna','avalaste','cecillia','lorelei','vindeah','ferys'];
            const neutralIds = ['daramur','eiritha','hadir','selunara','aetherius','serenith','hydea','melion'];
            const boeseIds = ['ophelis','thraxis','maledor'];
            const byId = Object.fromEntries(gods.map(g => [g.id, g]));
            const gut = gutIds.map(id => byId[id]).filter(Boolean);
            const neutral = neutralIds.map(id => byId[id]).filter(Boolean);
            const boese = boeseIds.map(id => byId[id]).filter(Boolean);

            const groupLabel = (label, color) =>
              <div style={{ display:'flex', alignItems:'center', gap:'10px', marginBottom:'10px', marginTop:'24px' }}>
                <OctSvg size={9} color={color} fill={color+'44'} strokeWidth={1} />
                <div style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.28em', color:color+'bb', textTransform:'uppercase' }}>{label}</div>
                <div style={{ flex:1, height:'1px', background:`linear-gradient(90deg,${color}44,transparent)` }} />
              </div>;

            const renderGrid = (entities, secId, offset=0) => {
              const rows = [];
              for (let i = 0; i < entities.length; i += cols) {
                const row = entities.slice(i, i + cols);
                const rowId = `${secId}-row-${offset + Math.floor(i / cols)}`;
                rows.push(
                  <div key={rowId} id={rowId} style={{ display:'grid', gridTemplateColumns:`repeat(${cols},1fr)`, gap:'16px', marginBottom:'16px', scrollMarginTop:`${NAV_H+8}px`, overflow:'visible' }}>
                    {row.map(god => <EntityCard key={god.id} entity={god} onClick={e => handleEntityClick(e)} accentLabel={god.alignment} />)}
                  </div>
                );
              }
              return rows;
            };

            return (
              <div id="merurisches-pantheon" style={{ marginBottom:'48px', scrollMarginTop:`${NAV_H+8}px` }}>
                <SectionBanner accentColor="#7c4dff" />
                <SectionHeading title="Merurisches Pantheon" subtitle="Gottheiten" accentColor="#7c4dff" />
                {groupLabel('Gut', '#60d080')}
                {renderGrid(gut, 'merurisches-pantheon', 0)}
                {groupLabel('Neutral', '#a0a0d0')}
                {renderGrid(neutral, 'merurisches-pantheon', Math.ceil(gut.length/cols))}
                {groupLabel('Böse', '#d05050')}
                {renderGrid(boese, 'merurisches-pantheon', Math.ceil(gut.length/cols)+Math.ceil(neutral.length/cols))}
              </div>
            );
          })()}

          {/* ── DÄMONEN ── */}
          {(() => {
            const cols = tweaks.columns || 3;
            return (
              <div id="daemonen" style={{ marginBottom:'48px', scrollMarginTop:`${NAV_H+8}px` }}>
                <SectionBanner accentColor="#c03000" />
                <SectionHeading title="Dämonen" subtitle="Infernalische Wesenheiten" accentColor="#c03000" />
                <div style={{ marginTop:'20px', overflow:'visible' }}>
                  {demons.map((d, i) => i % cols === 0 ? (
                    <div key={`daemonen-row-${Math.floor(i/cols)}`} id={`daemonen-row-${Math.floor(i/cols)}`} style={{ display:'grid', gridTemplateColumns:`repeat(${cols},1fr)`, gap:'16px', marginBottom:'16px', scrollMarginTop:`${NAV_H+8}px`, overflow:'visible' }}>
                      {demons.slice(i, i+cols).map(d2 => <EntityCard key={d2.id} entity={d2} onClick={e => handleEntityClick(e,'Dämon')} accentLabel="Dämon" />)}
                    </div>
                  ) : null)}
                </div>
              </div>
            );
          })()}

          {/* ── NATURGEISTER ── */}
          {(() => {
            const cols = tweaks.columns || 3;
            return (
              <div id="naturgeister" style={{ marginBottom:'48px', scrollMarginTop:`${NAV_H+8}px` }}>
                <SectionBanner accentColor="#40a040" />
                <SectionHeading title="Naturgeister" subtitle="Geister der Urkräfte" accentColor="#40a040" />
                <div style={{ marginTop:'20px', overflow:'visible' }}>
                  {naturgeister.map((n, i) => i % cols === 0 ? (
                    <div key={`naturgeister-row-${Math.floor(i/cols)}`} id={`naturgeister-row-${Math.floor(i/cols)}`} style={{ display:'grid', gridTemplateColumns:`repeat(${cols},1fr)`, gap:'16px', marginBottom:'16px', scrollMarginTop:`${NAV_H+8}px`, overflow:'visible' }}>
                      {naturgeister.slice(i, i+cols).map(n2 => <EntityCard key={n2.id} entity={n2} onClick={e => handleEntityClick(e,'Naturgeist')} accentLabel="Naturgeist" />)}
                    </div>
                  ) : null)}
                </div>
              </div>
            );
          })()}

        </div>
      </div>

      {/* FOOTER */}
      <SiteFooter />

      {/* DETAIL OVERLAY */}
      {selectedEntity && <EntityDetail entity={selectedEntity} onBack={handleBack} typeLabel={selectedType} onPrev={onEntityPrev} onNext={onEntityNext} />}

      <FloatNav />
      <TweaksPanel>
        <TweakSection label="Layout" />
        <TweakSlider id="columns" label="Spalten" min={2} max={4} step={1} />
        <TweakSlider id="headerHeight" label="Kopfzeile Höhe" min={80} max={320} step={10} />
        <TweakSection label="Darstellung" />
        <TweakToggle id="showParticles" label="Partikel" />
      </TweaksPanel>
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<SiteGate><App /></SiteGate>);
</script>


</body></html>
