// ── HOOKS ─────────────────────────────────────────────────
function useScrollReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal,.reveal-left,.reveal-right');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
    }, { threshold: 0.06, rootMargin: '0px 0px -20px 0px' });
    els.forEach(el => observer.observe(el));
    return () => observer.disconnect();
  }, []);
}

function useParallax() {
  useEffect(() => {
    const hero = document.getElementById('hero-bg');
    if (!hero) return;
    const onScroll = () => { hero.style.transform = `translateY(${window.scrollY * 0.35}px)`; };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
}

// ── DICE ROLLER ───────────────────────────────────────────
function DiceRoller() {
  const [result, setResult] = useState(null);
  const [rolling, setRolling] = useState(false);
  const [roll, setRoll] = useState(null);
  const [showList, setShowList] = useState(false);

  const rollDice = () => {
    if (rolling) return;
    setRolling(true); setResult(null);
    let count = 0;
    const iv = setInterval(() => {
      setResult(NAMES[Math.floor(Math.random()*100)]);
      count++;
      if (count > 14) {
        clearInterval(iv);
        const idx = Math.floor(Math.random()*100);
        setRoll(idx+1); setResult(NAMES[idx]); setRolling(false);
      }
    }, 55);
  };

  return (
    <div className="reveal">
      <p className="body-text" style={{ marginBottom:'24px' }}>
        Würfle dir hier einen Namen für deinen Aarakocra-Charakter aus — oder sieh dir alle 100 Namen an und wähle deinen Favoriten.
      </p>

      {/* Würfeln Button */}
      <button className="dice-btn" onClick={rollDice} style={{ marginBottom:'24px' }}>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="1.5" style={{ animation:rolling?'dice-spin 0.4s linear infinite':'none', transformOrigin:'center' }}>
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/>
          <circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"/>
          <circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"/>
          <circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/>
          <circle cx="12" cy="12" r="1.2" fill="currentColor"/>
        </svg>
        Würfeln
      </button>

      {/* Ergebnis unter Button, groß */}
      <div style={{ minHeight:'90px', marginBottom:'20px', textAlign:'center' }}>
        {result ? (
          <div style={{ animation:rolling?'none':'result-pop 0.4s cubic-bezier(0.23,1,0.32,1) forwards' }}>
            <div style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.25em', color:'rgba(26,184,160,0.45)', textTransform:'uppercase', marginBottom:'6px' }}>
              {roll && !rolling ? `Ergebnis: ${roll}` : '— — —'}
            </div>
            <div style={{ fontFamily:'var(--font-display)', fontSize:'42px', fontWeight:'300', letterSpacing:'0.12em', color:'var(--white)', textShadow:'0 0 40px rgba(26,184,160,0.5)', marginBottom:'4px' }}>{result}</div>
            <div style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.2em', color:'rgba(26,184,160,0.35)', textTransform:'uppercase' }}>aarakocra · name</div>
          </div>
        ) : (
          <div style={{ paddingTop:'24px', fontFamily:'var(--font-mono)', fontSize:'9px', letterSpacing:'0.3em', color:'rgba(26,184,160,0.2)', textTransform:'uppercase' }}>— Noch kein Wurf —</div>
        )}
      </div>

      {/* Aufklappbare Liste */}
      <button onClick={() => setShowList(s=>!s)} style={{ display:'inline-flex', alignItems:'center', gap:'8px', background:'none', border:'none', cursor:'pointer', fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.22em', color:'rgba(26,184,160,0.5)', textTransform:'uppercase', padding:'0', marginBottom: showList ? '14px' : '0', transition:'color 0.2s' }}
        onMouseEnter={e=>e.currentTarget.style.color='rgba(168,124,255,0.85)'}
        onMouseLeave={e=>e.currentTarget.style.color='rgba(26,184,160,0.5)'}>
        <svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" strokeWidth="1.5" style={{ transform:showList?'rotate(180deg)':'rotate(0deg)', transition:'transform 0.2s' }}>
          <path d="M2 4l4 4 4-4"/>
        </svg>
        {showList ? 'Liste ausblenden' : 'Alle 100 Namen anzeigen'}
      </button>

      {showList && (
        <div style={{ animation:'slideDown 0.2s ease forwards', border:'1px solid rgba(26,184,160,0.14)', borderRadius:'4px', overflow:'hidden', background:'rgba(var(--bg2-rgb),0.7)' }}>
          <div className="name-grid">
            {NAMES.map((n, i) => (
              <div key={i} className="name-cell" onClick={() => { setResult(n); setRoll(i+1); setShowList(false); }}>

            ))}

// ── CHARACTER GENERATOR ───────────────────────────────────
function CharacterGenerator() {
  const [chars, setChars] = useState(null);
  const [rolling, setRolling] = useState(false);
  const rollD = (n) => Math.floor(Math.random()*n)+1;

  const generate = () => {
    if (rolling) return;
    setRolling(true);
    setTimeout(() => {
      const hoehe = Math.round(137 + rollD(6)*2.5);
      const gewicht = Math.round(45 + rollD(6)*rollD(6));
      const augen = ['blau','rot','braun','grau'][Math.floor(Math.random()*4)];
      const gefieder = ['rot','orange','gelb','braun','grau'][Math.floor(Math.random()*5)];
      const sekundaer = ['weiß','schwarz','gold','dunkelbraun','cremeweiß'][Math.floor(Math.random()*5)];
      const alter = Math.floor(Math.random()*60)+3;
      const geschlecht = Math.random() < 0.5 ? 'männlich' : 'weiblich';
      setChars({ hoehe, gewicht, augen, gefieder, sekundaer, alter, geschlecht });
      setRolling(false);
    }, 350);
  };

  const fields = chars ? [
    ['Geschlecht', chars.geschlecht],
    ['Alter', `${chars.alter} Jahre`],
    ['Größe', `${chars.hoehe} cm`],
    ['Gewicht', `${chars.gewicht} Pfund`],
    ['Augenfarbe', chars.augen],
    ['Hauptgefieder', chars.gefieder],
    ['Akzentgefieder', chars.sekundaer],
  ] : [];

  return (
    <div className="reveal">
      <p className="body-text" style={{ marginBottom:'20px' }}>
        Lass dir die körperlichen Merkmale deines Charakters auswürfeln — Größe, Gewicht, Augen- und Gefiederfarbe sowie Alter.
      </p>
      <button className="dice-btn" onClick={generate} style={{ marginBottom:'20px' }}>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="1.5" style={{ animation:rolling?'dice-spin 0.5s linear infinite':'none', transformOrigin:'center' }}>
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
        Charakter würfeln
      </button>
      {chars && (
        <div style={{ animation:'result-pop 0.35s cubic-bezier(0.23,1,0.32,1) forwards', display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(140px,1fr))', gap:'10px' }}>
          {fields.map(([k,v]) => (
            <div key={k} style={{ padding:'12px 14px', background:'rgba(26,184,160,0.07)', border:'1px solid rgba(26,184,160,0.14)', borderRadius:'4px' }}>
              <div style={{ fontFamily:'var(--font-mono)', fontSize:'7px', letterSpacing:'0.2em', color:'rgba(26,184,160,0.5)', textTransform:'uppercase', marginBottom:'5px' }}>{k}</div>
              <div style={{ fontFamily:'var(--font-display)', fontSize:'14px', fontWeight:'300', letterSpacing:'0.06em', color:'var(--white)' }}>{v}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── RASSEN RADAR ──────────────────────────────────────────
function RassenRadar() {
  const traits = [
    { label: 'Mobilität',   val: 95 },
    { label: 'Kampf',       val: 62 },
    { label: 'Magie',       val: 55 },
    { label: 'Soziales',    val: 48 },
    { label: 'Überleben',   val: 70 },
    { label: 'Weisheit',    val: 72 },
  ];
  const cx = 155, cy = 155, r = 100;
  const n = traits.length;
  const angle = (i) => (Math.PI * 2 * i) / n - Math.PI / 2;
  const pt = (i, radius) => ({ x: cx + radius * Math.cos(angle(i)), y: cy + radius * Math.sin(angle(i)) });
  const rings = [0.25, 0.5, 0.75, 1.0];
  const ringPts = (s) => traits.map((_, i) => pt(i, r * s)).map(p => `${p.x},${p.y}`).join(' ');
  const valuePts = traits.map((t, i) => pt(i, r * (t.val / 100))).map(p => `${p.x},${p.y}`).join(' ');
  const labelPt = (i) => {
    const p = pt(i, r + 26);
    // Überleben (index 4) und Weisheit (index 5) sind links — etwas mehr Abstand
    if (i === 4 || i === 5) return pt(i, r + 32);
    return p;
  };

  return (
    <Section label="Charaktererstellung" title="Merkmals-Profil">
      <div className="reveal" style={{ display:'grid', gridTemplateColumns:'310px 1fr', gap:'40px', alignItems:'center' }}>
        <div style={{ display:'flex', justifyContent:'center' }}>
          <svg viewBox="-10 0 330 320" width="320" height="310">
            {rings.map((s, ri) => <polygon key={ri} points={ringPts(s)} fill="none" stroke={`rgba(26,184,160,${0.07 + ri * 0.06})`} strokeWidth="1"/>)}
            {traits.map((_, i) => { const p = pt(i, r); return <line key={i} x1={cx} y1={cy} x2={p.x} y2={p.y} stroke="rgba(26,184,160,0.14)" strokeWidth="1"/>; })}
            <polygon points={valuePts} fill="rgba(26,184,160,0.14)" stroke="rgba(168,124,255,0.65)" strokeWidth="1.5"/>
            {traits.map((t, i) => { const p = pt(i, r * (t.val / 100)); return <circle key={i} cx={p.x} cy={p.y} r="3.5" fill="#5ee8d0" stroke="rgba(var(--bg-rgb),0.8)" strokeWidth="1.5"/>; })}
            {traits.map((t, i) => { const p = labelPt(i); const anchor = p.x < cx - 5 ? 'end' : p.x > cx + 5 ? 'start' : 'middle'; return <text key={i} x={p.x} y={p.y + 4} textAnchor={anchor} fontSize="9" fill="rgba(var(--text2-rgb),0.6)" fontFamily="'Share Tech Mono', monospace" letterSpacing="0.1em">{t.label.toUpperCase()}</text>; })}
            <circle cx={cx} cy={cy} r="3" fill="rgba(26,184,160,0.5)"/>
          </svg>
        </div>
        <div style={{ display:'flex', flexDirection:'column', gap:'14px' }}>
          <p className="body-text" style={{ marginBottom:'8px' }}>
            Das Merkmals-Profil zeigt die natürlichen Stärken der Aarakocra im Vergleich zu anderen Rassen — basierend auf ihren Rassenmerkmalen und ihrer Kultur.
          </p>
          {traits.map((t) => (
            <div key={t.label}>
              <div style={{ display:'flex', justifyContent:'space-between', marginBottom:'5px' }}>
                <span style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.18em', color:'rgba(var(--text2-rgb),0.5)', textTransform:'uppercase' }}>{t.label}</span>
                <span style={{ fontFamily:'var(--font-mono)', fontSize:'8px', color:'rgba(26,184,160,0.7)' }}>{t.val}</span>
              </div>
              <div style={{ height:'3px', background:'rgba(26,184,160,0.1)', borderRadius:'2px', overflow:'hidden' }}>
                <div style={{ height:'100%', width:`${t.val}%`, background:'linear-gradient(90deg,rgba(26,184,160,0.5),rgba(168,124,255,0.85))', borderRadius:'2px' }}/>
              </div>
            </div>
          ))}
        </div>
      </div>
    </Section>
  );
}

function CharakterQuiz() {
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState([]);
  const [result, setResult] = useState(null);
  const [selected, setSelected] = useState(null);

  const choose = (opt) => {
    setSelected(opt);
    setTimeout(() => {
      const newAnswers = [...answers, ...opt.tags];
      if (step < QUIZ_STEPS.length - 1) {
        setAnswers(newAnswers); setStep(s => s + 1); setSelected(null);
      } else {
        const count = {};
        newAnswers.forEach(t => { count[t] = (count[t] || 0) + 1; });
        const sorted = Object.entries(count).sort((a,b) => b[1]-a[1]);
        setResult(sorted[0][0]);
      }
    }, 280);
  };
  const reset = () => { setStep(0); setAnswers([]); setResult(null); setSelected(null); };

  return (
    <Section label="Charaktererstellung" title="Kenne deinen Charakter">
      <p className="body-text reveal" style={{ marginBottom:'28px' }}>
        Vier kurze Fragen — und du bekommst eine Klassenempfehlung, die zu deinem Aarakocra passt.
      </p>
      <div className="reveal" style={{ maxWidth:'560px' }}>
        {!result ? (
          <div>
            <div style={{ display:'flex', gap:'6px', marginBottom:'24px' }}>
              {QUIZ_STEPS.map((_, i) => <div key={i} style={{ flex:1, height:'2px', borderRadius:'1px', background: i <= step ? 'rgba(26,184,160,0.7)' : 'rgba(26,184,160,0.14)', transition:'background 0.3s' }}/>)}
            </div>
            <div style={{ fontFamily:'var(--font-display)', fontSize:'15px', fontWeight:'300', letterSpacing:'0.1em', color:'var(--white)', marginBottom:'20px', lineHeight:'1.5' }}>
              {QUIZ_STEPS[step].frage}
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:'10px' }}>
              {QUIZ_STEPS[step].optionen.map((opt, i) => (
                <button key={i} onClick={() => choose(opt)}
                  style={{ textAlign:'left', padding:'14px 18px', background: selected===opt ? 'rgba(26,184,160,0.2)' : 'rgba(26,184,160,0.06)', border:`1px solid ${selected===opt ? 'rgba(26,184,160,0.6)' : 'rgba(26,184,160,0.18)'}`, borderRadius:'4px', color: selected===opt ? 'var(--white)' : 'rgba(var(--text2-rgb),0.7)', fontFamily:'var(--font-body)', fontWeight:'300', fontSize:'12px', lineHeight:'1.5', letterSpacing:'0.04em', cursor:'pointer', transition:'all 0.15s' }}
                  onMouseEnter={e=>{ if(selected!==opt){ e.currentTarget.style.background='rgba(26,184,160,0.1)'; e.currentTarget.style.borderColor='rgba(26,184,160,0.35)'; e.currentTarget.style.color='var(--white)'; }}}
                  onMouseLeave={e=>{ if(selected!==opt){ e.currentTarget.style.background='rgba(26,184,160,0.06)'; e.currentTarget.style.borderColor='rgba(26,184,160,0.18)'; e.currentTarget.style.color='rgba(var(--text2-rgb),0.7)'; }}}>
                  {opt.text}
                </button>
              ))}
            </div>
            <div style={{ marginTop:'14px', fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.2em', color:'rgba(26,184,160,0.28)', textTransform:'uppercase' }}>Frage {step+1} / {QUIZ_STEPS.length}</div>
          </div>
        ) : (
          <div style={{ animation:'result-pop 0.4s cubic-bezier(0.23,1,0.32,1) forwards' }}>
            <div style={{ padding:'28px', border:'1px solid rgba(26,184,160,0.28)', borderRadius:'6px', background:'linear-gradient(135deg,rgba(26,184,160,0.09) 0%,rgba(var(--panel-rgb),0.92) 100%)' }}>
              <div style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.28em', color:'rgba(26,184,160,0.5)', textTransform:'uppercase', marginBottom:'10px' }}>Empfohlene Klasse</div>
              <div style={{ fontFamily:'var(--font-display)', fontSize:'30px', fontWeight:'300', letterSpacing:'0.14em', color:'var(--white)', textTransform:'uppercase', marginBottom:'12px', textShadow:'0 0 28px rgba(26,184,160,0.4)' }}>{result}</div>
              <div style={{ width:'36px', height:'1px', background:'linear-gradient(90deg,rgba(26,184,160,0.8),transparent)', marginBottom:'16px' }}/>
              <p style={{ fontFamily:'var(--font-body)', fontWeight:'300', fontSize:'13px', lineHeight:'1.8', color:'rgba(var(--text2-rgb),0.65)' }}>
                {KLASSEN_DESC[result] || 'Eine starke Wahl für einen Aarakocra-Charakter.'}
              </p>
            </div>
            <button onClick={reset} style={{ marginTop:'16px', display:'inline-flex', alignItems:'center', gap:'8px', background:'none', border:'none', cursor:'pointer', fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.22em', color:'rgba(26,184,160,0.5)', textTransform:'uppercase', padding:'0', transition:'color 0.2s' }}
              onMouseEnter={e=>e.currentTarget.style.color='rgba(168,124,255,0.85)'}
              onMouseLeave={e=>e.currentTarget.style.color='rgba(26,184,160,0.5)'}>

              Nochmal spielen
            </button>
          </div>
        )}
      </div>
    </Section>

}

              Die Bindung an die Windherzöge ist nicht vergessen, auch wenn sie schwächer geworden ist. Viele Aarakocra praktizieren noch immer Rituale zu Ehren der alten Luftgeister, singen bei Sonnenaufgang und veranstalten kunstvolle Flugzeremonieen bei bedeutenden Ereignissen — Geburten, Todesfällen, dem Beginn einer langen Reise.
            </p>
            <p className="body-text reveal">
              Namen bei den Aarakocra sind Klänge — kurze, scharfe Silben oder lang gezogene Rufe, die in der Luft tragen. Ein Name ist kein Etikett; er ist eine Melodie, die andere erkennen sollen, noch bevor sie die Figur sehen.
            </p>
          </div>
        </Section>

        {/* Körperliche Merkmale */}
        <Section label="Charaktererstellung" title="Körperliche Merkmale">
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'32px', alignItems:'start' }}>
            {/* Links: feste Werte */}
            <div className="reveal">
              <table style={{ width:'100%', borderCollapse:'collapse', marginBottom:'18px' }}>
                <tbody>
                  {[['Bewegungsrate','9 m'],['Volljährigkeit','3 Jahre'],['Lebenserwartung','65 Jahre'],['Größe','mittelgroß\n142 cm – 167 cm']].map(([k,v]) => (
                    <tr key={k} style={{ borderBottom:'1px solid rgba(26,184,160,0.08)' }}>
                      <td style={{ padding:'10px 14px', fontFamily:'var(--font-mono)', fontSize:'9px', letterSpacing:'0.1em', color:'rgba(26,184,160,0.5)', textTransform:'uppercase', width:'44%' }}>{k}</td>
                      <td style={{ padding:'10px 14px', fontFamily:'var(--font-body)', fontWeight:'300', fontSize:'12px', color:'rgba(var(--text-rgb),0.85)', whiteSpace:'pre-line' }}>{v}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              {[
                { label:'Größe (zufällig)', text:<>137 cm + <span style={{ background:'rgba(200,60,60,0.22)', border:'1px solid rgba(200,60,60,0.35)', borderRadius:'3px', padding:'1px 6px', fontFamily:'var(--font-mono)', fontSize:'10px', color:'#ff8888' }}>2d6</span> · 2,5 cm</> },
                { label:'Gewicht (zufällig)', text:<>45 Pfund + <span style={{ background:'rgba(200,60,60,0.22)', border:'1px solid rgba(200,60,60,0.35)', borderRadius:'3px', padding:'1px 6px', fontFamily:'var(--font-mono)', fontSize:'10px', color:'#ff8888' }}>1d6</span> · Wurf von Größe</> },
              ].map(({label,text}) => (
                <div key={label} style={{ padding:'12px 14px', background:'rgba(26,184,160,0.06)', border:'1px solid rgba(26,184,160,0.13)', borderRadius:'4px', marginBottom:'10px' }}>
                  <div style={{ fontFamily:'var(--font-mono)', fontSize:'7px', letterSpacing:'0.2em', color:'rgba(26,184,160,0.45)', textTransform:'uppercase', marginBottom:'6px' }}>{label}</div>
                  <div style={{ fontFamily:'var(--font-body)', fontSize:'13px', color:'rgba(var(--text-rgb),0.8)' }}>{text}</div>
                </div>
              ))}
              <div style={{ marginTop:'12px' }}>
                {[['Augenfarbe','meistens blau, rot, braun oder grau'],['Gefiederfarbe','meistens rot, orange, gelb, braun oder grau']].map(([k,v]) => (
                  <div key={k} style={{ display:'flex', justifyContent:'space-between', gap:'16px', padding:'9px 14px', borderBottom:'1px solid rgba(26,184,160,0.07)' }}>
                    <span style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.1em', color:'rgba(26,184,160,0.45)', textTransform:'uppercase', flexShrink:0 }}>{k}</span>
                    <span style={{ fontFamily:'var(--font-body)', fontWeight:'300', fontSize:'11px', color:'rgba(var(--text-rgb),0.75)', textAlign:'right' }}>{v}</span>
                  </div>
                ))}
              </div>
            </div>
            {/* Rechts: Charakter-Generator */}
            <CharacterGenerator />
          </div>
        </Section>

        {/* Lebensraum Map */}
        <Section label="Lore · Meruria" title="Lebensraum">
          <p className="body-text reveal" style={{ marginBottom:'24px' }}>
            Die Aarakocra siedeln vorwiegend in hochgelegenen, windreichen Regionen — Bergkämme, Klippen und die Ausläufer der Elementarebene der Luft. Ziehe ein Kartenbild in den Bereich unten, um den Lebensraum der Aarakocra in Meruria zu markieren.
          </p>
          <div className="reveal" style={{ position:'relative', width:'100%', aspectRatio:'16/9', border:'1px dashed rgba(26,184,160,0.25)', borderRadius:'4px', overflow:'hidden', background:'repeating-linear-gradient(-45deg,transparent,transparent 10px,rgba(26,184,160,0.04) 10px,rgba(26,184,160,0.04) 11px), linear-gradient(160deg,rgba(12,8,32,0.97) 0%,rgba(var(--bg-rgb),0.99) 100%)' }}>
            <image-slot slot-id="aarakocra-map" placeholder="Karte des Lebensraums hier ablegen" shape="rect" style={{ display:'block', width:'100%', height:'100%' }} />
            {/* Overlay Label wenn leer */}
            <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'14px', pointerEvents:'none', zIndex:0 }}>
              <svg viewBox="0 0 48 48" width="40" height="40" fill="none" style={{ opacity:0.2 }}>
                <path d="M6 38L18 14l8 16 6-8 10 16" stroke="#5ee8d0" strokeWidth="1.4" strokeLinejoin="round"/>
                <circle cx="36" cy="12" r="4" stroke="#5ee8d0" strokeWidth="1.2"/>
                <rect x="3" y="3" width="42" height="42" rx="3" stroke="#5ee8d0" strokeWidth="1"/>
              </svg>
              <span style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.28em', color:'rgba(26,184,160,0.3)', textTransform:'uppercase', textAlign:'center' }}>Karte des Lebensraums</span>
              <span style={{ fontFamily:'var(--font-body)', fontWeight:'300', fontSize:'11px', color:'rgba(26,184,160,0.2)', letterSpacing:'0.06em' }}>Bild hierher ziehen</span>
            </div>
          </div>
        </Section>

        {/* Beziehungen */}
        <Section label="Lore · Meruria" title="Beziehungen zu anderen Gesellschaften">
          <p className="body-text reveal" style={{ marginBottom:'24px' }}>
            Aarakocra sind in Meruria selten und werden oft mit Staunen betrachtet. Ihre Andersartigkeit — sowohl körperlich als auch in ihrer Weltanschauung — schafft Distanz, aber auch Faszination.
          </p>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))', gap:'14px' }}>
            {[
              { volk:'Menschen', relation:'Neugier', text:'Menschen fasziniert alles Fremde — und Aarakocra sind das Fremdeste, was viele je gesehen haben. Die Beziehung ist herzlich, aber von gegenseitigem Unverständnis geprägt.' },
              { volk:'Elfen', relation:'Respekt', text:'Elfen sehen in den Aarakocra alte Seelen, die den Wind ebenso gut kennen wie sie die Bäume. Es gibt eine stille gegenseitige Anerkennung.' },
              { volk:'Zwerge', relation:'Skepsis', text:'Für Zwerge, die tief in der Erde leben, sind die Vogelleute unbegreiflich. Zu leicht, zu frei, zu unbeständig. Sie respektieren ihre Klauenkämpfe, aber verstehen sie nicht.' },
              { volk:'Gnome', relation:'Begeisterung', text:'Gnome sind begeistert von der Mechanik des Flugs. Aarakocra finden diese Neugier amüsant, manchmal lästig.' },
              { volk:'Tieflinge', relation:'Solidarität', text:'Auch Tieflinge kennen das Gefühl, aufgrund ihres Äußeren bewertet zu werden. Es gibt eine unausgesprochene Solidarität zwischen diesen beiden Außenseitern.' },
              { volk:'Halblinge', relation:'Wärme', text:'Halblinge sehen in Aarakocra abenteuerlustige Seelen, die Geschichten mitbringen. Diese Begegnungen enden oft mit stundenlangen Erzählungen.' },
            ].map((r,i) => (
              <div key={i} className="reveal insp-card">
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'10px' }}>
                  <div style={{ fontFamily:'var(--font-display)', fontSize:'12px', fontWeight:'400', letterSpacing:'0.14em', color:'var(--white)', textTransform:'uppercase' }}>{r.volk}</div>
                  <span className="relation-pill">{r.relation}</span>
                </div>
                <p style={{ fontFamily:'var(--font-body)', fontWeight:'300', fontSize:'12px', lineHeight:'1.7', color:'var(--muted)' }}>{r.text}</p>
              </div>
            ))}
          </div>
        </Section>

        {/* Bekannte Aarakocra + Herrscher */}
        <BekannteSection />

        {/* Namen */}
        <Section label="Charaktererstellung" title="Namen der Aarakocra">
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'40px', alignItems:'start' }}>
            <DiceRoller />
            <div className="reveal" style={{ padding:'20px', border:'1px solid rgba(26,184,160,0.14)', borderRadius:'4px', background:'rgba(var(--panel-rgb),0.6)' }}>
              <div style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.25em', color:'rgba(26,184,160,0.5)', textTransform:'uppercase', marginBottom:'14px' }}>Über Aarakocra-Namen</div>
              <p style={{ fontFamily:'var(--font-body)', fontWeight:'300', fontSize:'12px', lineHeight:'1.8', color:'var(--muted)' }}>
                Namen der Aarakocra sind phonetisch geprägt von scharfen Konsonanten und kurzen Vokalen — Klänge, die sich in der Luft tragen. Sie bestehen oft nur aus einer oder zwei Silben und werden in unterschiedlichen Tonhöhen ausgesprochen, was ihre Bedeutung verändern kann.
              </p>
              <p style={{ fontFamily:'var(--font-body)', fontWeight:'300', fontSize:'12px', lineHeight:'1.8', color:'var(--muted)', marginTop:'12px' }}>
                Es gibt kein Geschlecht in Aarakocra-Namen — alle Namen gelten für alle. Ein Charakter kann sich auch einen längeren Rufnamen geben, der von anderen Völkern leichter ausgesprochen werden kann.
              </p>
            </div>
          </div>
        </Section>

        {/* Merkmals-Vergleich */}
        <RassenRadar />

        {/* Charakter-Quiz */}
        <CharakterQuiz />

        {/* Statblock */}
        <Section id="statblock" label="Regelwerk · PHB" title="Statblock">
          <div className="reveal"><StatBlock /></div>
        </Section>

        {/* Footer */}
        <div style={{ borderTop:'1px solid rgba(26,184,160,0.1)', paddingTop:'28px', display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:'14px' }}>
          <div style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.2em', color:'rgba(26,184,160,0.25)', textTransform:'uppercase' }}>Meruria · Charaktererstellung · Rassen · Aarakocra</div>

        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<SiteGate><App /></SiteGate>);
</script>
