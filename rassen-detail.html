<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/images/favicon/favicon-m.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/images/favicon/favicon-m-180.png">
<title>Meruria — Rassendetails</title>
<script src="assets/scripts/theme-init.js"></script>
<link rel="stylesheet" href="assets/styles/global/fonts.css">
<link rel="stylesheet" href="assets/styles/global/base.css">
<link rel="stylesheet" href="assets/styles/pages/RassenDetail.css">
<script src="assets/scripts/vendor/react.production.min.js"></script>
<script src="assets/scripts/vendor/react-dom.production.min.js"></script>
<script type="module" src="/src/pages/rassen-detail.jsx"></script>
<script src="assets/scripts/vendor/supabase.min.js"></script>
<script src="assets/scripts/supabase-client.js"></script>
<script src="assets/scripts/data/rassen-data.js"></script>
<script src="assets/scripts/data/rassen-detail-data.js"></script>
<script src="assets/scripts/data/talente-data.js"></script>
<script src="assets/scripts/data/gebaeude-data.js"></script>
<script>
(function() {
  var rasse = new URLSearchParams(location.search).get('rasse') || '';
  var data  = (window.RASSEN_DETAIL_DATA || {})[rasse];
  var hex   = (data && data.accent) ? data.accent : '#7c4dff';
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  var root = document.documentElement;
  root.style.setProperty('--accent',     hex);
  root.style.setProperty('--accent-rgb', r+','+g+','+b);
  if (data) document.title = 'Meruria — ' + data.name;
})();
</script>
</head>
<body>
<div id="root"></div>
</body>
</html>
