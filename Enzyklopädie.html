// ── HELPERS ──────────────────────────────────────────────
function hexPoints(s) {
  const cx = s/2, cy = s/2, r = s/2;
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = (Math.PI/180)*(60*i - 30);
    pts.push(`${cx + r*Math.cos(a)},${cy + r*Math.sin(a)}`);
  }
  return pts.join(' ');
}

function FloatingHexField({ mouseX, mouseY }) {
  return (
    <div style={{ position:'fixed', inset:0, pointerEvents:'none', zIndex:1, overflow:'hidden', clipPath:'inset(232px 0 0 0)' }}>
      {HEX_DEFS.map((h, i) => {
        const px = hexPoints(h.size);
        const parallaxX = (mouseX - 0.5) * (i % 3 === 0 ? -12 : i % 3 === 1 ? -6 : -18);
        const parallaxY = (mouseY - 0.5) * (i % 3 === 0 ? -8  : i % 3 === 1 ? -4 : -14);
        return (
          <div key={i} style={{ position:'absolute', left:h.x, top:h.y, animation:`${h.anim} ${h.dur} ease-in-out infinite`, animationDelay:`${i*0.7}s`, transform:`translate(${parallaxX}px,${parallaxY}px)`, transition:'transform 0.4s ease-out', willChange:'transform' }}>
            <svg width={h.size} height={h.size} viewBox={`0 0 ${h.size} ${h.size}`} style={{ display:'block', opacity:h.opacity, filter:`drop-shadow(0 0 ${h.size*0.06}px ${h.stroke})` }}>

}

// ── PARTICLES ─────────────────────────────────────────────
function ParticleField({ mouseX, mouseY }) {
  const canvasRef = useRef(null);
  const animRef = useRef(null);
  const particles = useRef([]);
  const mouse = useRef({ x:0.5, y:0.5 });
  useEffect(() => { mouse.current = { x: mouseX, y: mouseY }; }, [mouseX, mouseY]);
  useEffect(() => {
    const canvas = canvasRef.current; if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const resize = () => { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; };
    resize(); window.addEventListener('resize', resize);
    particles.current = Array.from({length:55}, () => ({
      x: Math.random(), y: Math.random(),
      r: Math.random()*1.6+0.5,
      vx:(Math.random()-0.5)*0.05, vy:(Math.random()-0.5)*0.05,
      alpha: Math.random()*0.2+0.05,
    }));
    const tick = () => {
      const w = canvas.width, h = canvas.height;
      const shiftX = (mouse.current.x - 0.5)*-14, shiftY = (mouse.current.y - 0.5)*-14;
      ctx.clearRect(0,0,w,h);
      particles.current.forEach(p => {
        p.x += p.vx/w*60; p.y += p.vy/h*60;
        if(p.x<0)p.x=1; if(p.x>1)p.x=0; if(p.y<0)p.y=1; if(p.y>1)p.y=0;
        ctx.beginPath(); ctx.arc(p.x*w+shiftX, p.y*h+shiftY, p.r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(160,140,255,${p.alpha})`; ctx.fill();
      });
      animRef.current = requestAnimationFrame(tick);
    };
    tick();
    return () => { cancelAnimationFrame(animRef.current); window.removeEventListener('resize', resize); };
  }, []);
  return <canvas ref={canvasRef} style={{ position:'fixed', inset:0, width:'100%', height:'100%', pointerEvents:'none', zIndex:0, clipPath:'inset(232px 0 0 0)' }} />;
}

// ── SCROLL REVEAL ─────────────────────────────────────────
function useScrollReveal() {
  useEffect(() => {
    const revealed = new WeakSet();
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting || revealed.has(entry.target)) return;
        revealed.add(entry.target);
        observer.unobserve(entry.target);
        entry.target.classList.add('visible');
      });
    }, { threshold: 0.05, rootMargin: '0px 0px -20px 0px' });
    const t = setTimeout(() => {
      document.querySelectorAll('.reveal-up').forEach(el => observer.observe(el));
    }, 100);
    return () => { clearTimeout(t); observer.disconnect(); };
  }, []);
}

// ── ASTROLABE GEOMETRY ─────────────────────────────────
const ASTRO = {
  size: 720,
  center: 360,
  radius: 280,
  hex: 120,
  plate: 320,
};

// Reading-order angle mapping for indexes 0..7 (matches the screenshot order):
//  0 oben · 1 NW · 2 NE · 3 W · 4 E · 5 SW · 6 SE · 7 unten
const ENTRY_ANGLES = [-90, -135, -45, 180, 0, 135, 45, 90];

function entryPosition(i) {
  const angle = ENTRY_ANGLES[i] ?? -90;
  const rad = (angle * Math.PI) / 180;
  return {
    angle,
    rad,
    x: ASTRO.center + ASTRO.radius * Math.cos(rad),
    y: ASTRO.center + ASTRO.radius * Math.sin(rad),
  };
}

// Translate hexPoints so the hex is centered around (cx, cy) instead of (s/2, s/2)
function hexAt(size, cx, cy) {
  const off = size / 2;
  return hexPoints(size).split(' ').map(p => {
    const [px, py] = p.split(',').map(Number);
    return `${px - off + cx},${py - off + cy}`;
  }).join(' ');
}

// ── ASTROLABE BACKDROP ─────────────────────────────────

  return (

          <stop offset="50%" stopColor="rgba(124,77,255,0.04)"/>
          <stop offset="100%" stopColor="rgba(124,77,255,0)"/>
        </radialGradient>
      </defs>

      {/* Faint vignette */}
      <circle cx={c} cy={c} r={ASTRO.radius + 60} fill="url(#astroVignette)" />

      {/* Concentric astrolabe rings */}
      {[ASTRO.radius - 80, ASTRO.radius - 30, ASTRO.radius + 20, ASTRO.radius + 60].map((r, i) => (
        <circle key={i} cx={c} cy={c} r={r} fill="none"
          stroke="rgba(160,140,255,0.10)" strokeWidth="0.7"
          strokeDasharray={i === 1 ? '2 6' : i === 3 ? '1 4' : 'none'} />
      ))}

      {/* 8 radial tick spokes (very faint) — evenly spaced around the circle */}
      {Array.from({ length: 8 }).map((_, i) => {
        const ang = -90 + i * 45;
        const rad = (ang * Math.PI) / 180;
        const x1 = c + (ASTRO.radius - 100) * Math.cos(rad);
        const y1 = c + (ASTRO.radius - 100) * Math.sin(rad);
        const x2 = c + (ASTRO.radius + 60) * Math.cos(rad);
        const y2 = c + (ASTRO.radius + 60) * Math.sin(rad);
        return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2}
          stroke="rgba(160,140,255,0.12)" strokeWidth="0.6" strokeDasharray="2 5" />;
      })}

      {/* 24 small minor tick marks on outermost ring */}
      {Array.from({ length: 48 }).map((_, i) => {
        const a = (i / 48) * Math.PI * 2;
        const r1 = ASTRO.radius + 56, r2 = ASTRO.radius + 64;
        const x1 = c + r1 * Math.cos(a), y1 = c + r1 * Math.sin(a);
        const x2 = c + r2 * Math.cos(a), y2 = c + r2 * Math.sin(a);
        return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2}
          stroke="rgba(160,140,255,0.18)" strokeWidth={i % 6 === 0 ? 0.9 : 0.5} />;
      })}

      {/* Outermost decorative hex outline */}
      <polygon points={hexAt(ASTRO.radius * 2 + 130, c, c)}
        fill="none" stroke="rgba(160,140,255,0.08)" strokeWidth="0.8" />
    </svg>
  );
}

// ── ACTIVE SPOKE (beam from center to selected hex) ───
function ActiveSpoke({ index, accent }) {
  if (index === null || index === undefined) return null;
  const { rad } = entryPosition(index);
  const c = ASTRO.center;
  const x1 = c + (ASTRO.plate / 2 + 12) * Math.cos(rad);
  const y1 = c + (ASTRO.plate / 2 + 12) * Math.sin(rad);
  const x2 = c + (ASTRO.radius - ASTRO.hex / 2 - 4) * Math.cos(rad);
  const y2 = c + (ASTRO.radius - ASTRO.hex / 2 - 4) * Math.sin(rad);
  return (
    <svg width="100%" viewBox={`0 0 ${ASTRO.size} ${ASTRO.size}`}
         style={{ position:'absolute', inset:0, pointerEvents:'none', zIndex:3 }}>
      <line x1={x1} y1={y1} x2={x2} y2={y2}
        stroke={accent} strokeWidth="1.2" strokeDasharray="3 5"
        opacity="0.85" style={{ filter:`drop-shadow(0 0 6px ${accent}aa)` }} />
      <circle cx={x1} cy={y1} r="3" fill={accent} opacity="0.9" />
      <circle cx={x2} cy={y2} r="3" fill={accent} opacity="0.9" />
    </svg>
  );
}

// ── ENTRY HEX (one chamber positioned around the plate) ─
function EntryHex({ entry, index, active, onEnter, onLeave }) {
  const { x, y } = entryPosition(index);
  const acc = entry.accent;
  const locked = entry.locked;
  const interactive = !locked && entry.href && entry.href !== '#';
  const size = ASTRO.hex;

  const handleClick = (e) => {
    if (!interactive) { e.preventDefault(); return; }
  };

  return (
    <a href={interactive ? entry.href : '#'} onClick={handleClick}
       onMouseEnter={onEnter} onMouseLeave={onLeave}
       style={{
         position:'absolute', left: x - size/2, top: y - size/2,
         width: size, height: size,
         display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
         textDecoration:'none',
         cursor: interactive ? 'pointer' : (locked ? 'not-allowed' : 'default'),
         transform: active ? 'scale(1.08)' : 'scale(1)',
         transition:'transform 0.3s ease',
         zIndex: active ? 4 : 2,
       }}>
      {/* Hex SVG */}
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}
           style={{ position:'absolute', inset:0,
                    filter: active ? `drop-shadow(0 0 14px ${acc}cc)` : `drop-shadow(0 0 6px ${acc}33)`,
                    transition:'filter 0.3s' }}>
        {/* outer faint ring */}
        <polygon points={hexAt(size, size/2, size/2)}
          fill="rgba(8,6,22,0.85)"
          stroke={active ? acc : `${acc}55`} strokeWidth={active ? 1.5 : 1}
          style={{ transition:'all 0.3s' }} />
        {/* inner trim */}
        <polygon points={hexAt(size - 14, size/2, size/2)}
          fill={active ? `${acc}18` : `${acc}08`}
          stroke={`${acc}33`} strokeWidth="0.5"
          style={{ transition:'fill 0.3s' }} />
        {/* locked stripe overlay */}
        {locked && (
          <pattern id={`lp-${index}`} patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
            <rect width="3" height="8" fill={`${acc}25`} />
          </pattern>
        )}
        {locked && <polygon points={hexAt(size - 14, size/2, size/2)} fill={`url(#lp-${index})`} />}
      </svg>

      {/* Glyph */}
      <div style={{ position:'relative', zIndex:1, fontFamily:'var(--font-display)', fontSize:'30px', color: active ? '#f0eeff' : acc, lineHeight:1, marginBottom:'4px', textShadow: active ? `0 0 14px ${acc}` : 'none', transition:'color 0.3s, text-shadow 0.3s', opacity: locked ? 0.7 : 1 }}>
        {entry.glyph}
      </div>
      {/* Name */}
      <div style={{ position:'relative', zIndex:1, fontFamily:'var(--font-display)', fontSize:'10px', fontWeight:'400', letterSpacing:'0.16em', color: active ? '#f0eeff' : 'rgba(240,238,255,0.78)', textTransform:'uppercase', textShadow: active ? `0 0 10px ${acc}aa` : 'none', transition:'color 0.3s', textAlign:'center', padding:'0 6px', display:'flex', alignItems:'center', gap:'4px' }}>
        {entry.name}
        {locked && <span style={{ fontSize:'8px', opacity:0.7 }}>🔒</span>}
      </div>
      {/* Kuerzel mono badge */}
      <div style={{ position:'relative', zIndex:1, fontFamily:'var(--font-mono)', fontSize:'6.5px', letterSpacing:'0.24em', color: `${acc}99`, textTransform:'uppercase', marginTop:'3px' }}>
        {entry.kuerzel}
      </div>
    </a>
  );
}

// ── APP ────────────────────────────────────────────────────
function App() {
  const [mouse, setMouse] = useState({ x:0.5, y:0.5 });
  const [selectedIdx, setSelectedIdx] = useState(null);
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const handleMouseMove = useCallback(e => { setMouse({ x: e.clientX/window.innerWidth, y: e.clientY/window.innerHeight }); }, []);
  useScrollReveal();

  const selected = selectedIdx !== null ? ENTRIES[selectedIdx] : null;
  const activeAccent = selected?.accent;

  const total = ENTRIES.length;
  const verfuegbar = ENTRIES.filter(e => e.href && e.href !== '#' && !e.locked).length;
  const offen = ENTRIES.filter(e => (!e.href || e.href === '#') && !e.locked).length;
  const gesperrt = ENTRIES.filter(e => e.locked).length;

  return (
    <div onMouseMove={handleMouseMove} style={{ position:'relative', minHeight:'100vh' }}>
      {tweaks.showParticles && <ParticleField mouseX={mouse.x} mouseY={mouse.y} />}
      <FloatingHexField mouseX={mouse.x} mouseY={mouse.y} />

      {/* ── HEADER IMAGE ── */}
      <div style={{ position:'relative', zIndex:10, width:'100%', height:'180px',
        background:'linear-gradient(180deg, rgba(20,10,50,0.95) 0%, rgba(10,8,30,0.98) 100%)',
        borderBottom:'1px solid rgba(160,140,255,0.15)', overflow:'hidden',
        display:'flex', alignItems:'center', justifyContent:'center' }}>
        <div style={{ position:'absolute', inset:0,
          background:`radial-gradient(ellipse at 20% 50%, rgba(124,77,255,0.18) 0%, transparent 50%), radial-gradient(ellipse at 80% 50%, rgba(45,125,255,0.14) 0%, transparent 50%), repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(160,140,255,0.04) 60px, rgba(160,140,255,0.04) 61px)`,
          pointerEvents:'none' }} />
        <div style={{ position:'absolute', inset:0,
          backgroundImage:`repeating-linear-gradient(135deg, transparent, transparent 18px, rgba(124,77,255,0.03) 18px, rgba(124,77,255,0.03) 19px)`,
          pointerEvents:'none' }} />
        <div style={{ fontFamily:'var(--font-mono)', fontSize:'9px', color:'rgba(160,140,255,0.3)', letterSpacing:'0.3em', textTransform:'uppercase', position:'relative', zIndex:1 }}>
          Kopfbild — Artwork hier ablegen
        </div>
      </div>

      <SiteNav rightLabel="ENZYKLOPÄDIE-ARCHIV" />

      {/* ── MAIN ── */}
      <div style={{ position:'relative', zIndex:5, maxWidth:'1180px', margin:'0 auto', padding:'40px 40px 60px' }}>

        {/* Top label strip */}
        <div className="reveal-up" style={{ display:'flex', alignItems:'center', gap:'14px', marginBottom:'12px' }}>
          <div style={{ flex:1, height:'1px', background:'linear-gradient(90deg, transparent, rgba(160,140,255,0.25), transparent)' }} />
          <div style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.4em', color:'rgba(160,140,255,0.55)', textTransform:'uppercase' }}>
            ◈ Astrolabium des Wissens ◈
          </div>
          <div style={{ flex:1, height:'1px', background:'linear-gradient(90deg, transparent, rgba(160,140,255,0.25), transparent)' }} />
        </div>

        {/* Astrolabe */}
        <div className="reveal-up"
          style={{ transitionDelay:'0.05s',
            position:'relative', width:'100%', maxWidth: `${ASTRO.size}px`,
            aspectRatio: '1 / 1', margin:'0 auto 30px' }}
          onMouseLeave={() => setSelectedIdx(null)}>
          <AstrolabeBackdrop activeAccent={activeAccent} />
          <ActiveSpoke index={selectedIdx} accent={activeAccent || '#9b86ff'} />
          <CenterPlate selected={selected} />
          {ENTRIES.map((entry, i) => (
            <EntryHex key={entry.kuerzel} entry={entry} index={i}
              active={selectedIdx === i}
              onEnter={() => setSelectedIdx(i)}
              onLeave={() => {}} />
          ))}
        </div>

      </div>

      <SiteFooter />

      <TweaksPanel>
        <TweakSection label="Darstellung" />
        <TweakToggle id="showParticles" label="Partikel" />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<SiteGate><App /></SiteGate>);
</script>


</body></html>
