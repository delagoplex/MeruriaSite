// ─── KATEGORIEN ───────────────────────────────────────────────────────────────

  Suche:     { color: 'var(--suche)',     glyph: '⬡', label: 'SUCHE' },
  Gespraech: { color: 'var(--gespraech)', glyph: '◇', label: 'GESPRÄCH' },

// ─── PARTICLES ────────────────────────────────────────────────────────────────
function ParticleField() {
  const canvasRef = useRef(null);
  const animRef = useRef(null);
  useEffect(() => {
    const c = canvasRef.current; if (!c) return;
    const ctx = c.getContext('2d');
    const resize = () => { c.width = c.offsetWidth; c.height = c.offsetHeight; };
    resize(); window.addEventListener('resize', resize);
    const pts = Array.from({length: 32}, () => ({
      x: Math.random(), y: Math.random(),
      r: Math.random()*1.3 + 0.5,
      vx: (Math.random()-0.5)*0.018, vy: (Math.random()-0.5)*0.018,
      a: Math.random()*0.18 + 0.04
    }));
    const tick = () => {
      const w = c.width, h = c.height;
      ctx.clearRect(0,0,w,h);
      pts.forEach(p => {
        p.x += p.vx/w*60; p.y += p.vy/h*60;
        if (p.x<0) p.x=1; if (p.x>1) p.x=0;
        if (p.y<0) p.y=1; if (p.y>1) p.y=0;
        ctx.beginPath(); ctx.arc(p.x*w, p.y*h, p.r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(160,140,255,${p.a})`;
        ctx.fill();
      });
      animRef.current = requestAnimationFrame(tick);
    };
    tick();
    return () => { cancelAnimationFrame(animRef.current); window.removeEventListener('resize', resize); };
  }, []);
  return <canvas ref={canvasRef} style={{ position:'fixed', inset:0, width:'100%', height:'100%', pointerEvents:'none', zIndex:0 }} />;
}



// ─── SCHWIERIGKEIT (Hex pips) ────────────────────────────────────────────────
function SchwierigkeitsAnzeige({ level, max = 5 }) {
  return (
    <div style={{ display:'flex', alignItems:'center', gap:'3px' }}>
      {Array.from({ length: max }).map((_, i) => {
        const filled = i < level;
        return (
          <svg key={i} width="9" height="10" viewBox="0 0 9 10" style={{ flexShrink:0 }}>
            <polygon points="4.5,0.6 8.3,2.8 8.3,7.2 4.5,9.4 0.7,7.2 0.7,2.8"
              fill={filled ? 'var(--purple)' : 'transparent'}
              stroke={filled ? 'var(--purple-bright)' : 'rgba(160,140,255,0.22)'}
              strokeWidth="1"/>
          </svg>
        );
      })}
    </div>
  );
}

// ─── KATEGORIE TAG ───────────────────────────────────────────────────────────
function KategorieTag({ k }) {

      <span style={{ fontSize:'10px', lineHeight:1 }}>{meta.glyph}</span>

  );
}

      cursor:'pointer',

            padding:'2px 6px', background:'rgba(255,141,181,0.18)',
            border:'1px solid rgba(255,141,181,0.45)', borderRadius:'2px',
            color:'#ffb3ce', textTransform:'uppercase', flexShrink:0

        )}

          fontFamily:'var(--font-body)', fontWeight: active ? 400 : 300,
          fontSize:'13.5px', color: active ? '#f0eeff' : 'rgba(220,210,250,0.85)',

// ─── FILTER CHIPS ─────────────────────────────────────────────────────────────

      color: active ? '#f0eeff' : (color || 'var(--muted)'),
      cursor:'pointer', borderRadius:'2px',
      textTransform:'uppercase', whiteSpace:'nowrap', flexShrink:0,
      display:'inline-flex', alignItems:'center', gap:'7px', transition:'all 0.15s'
    }}
      onMouseEnter={e=>{ if (!active) { e.currentTarget.style.borderColor = 'rgba(160,140,255,0.4)'; e.currentTarget.style.color = '#f0eeff'; } }}
      onMouseLeave={e=>{ if (!active) { e.currentTarget.style.borderColor = 'rgba(160,140,255,0.15)'; e.currentTarget.style.color = color || 'var(--muted)'; } }}
    >
      {label}
      <span style={{ opacity:0.55, fontSize:'9px' }}>{count}</span>
    </button>
  );
}

// ─── AUFTRAGGEBER SIGIL ──────────────────────────────────────────────────────
function AuftraggeberSigil({ name }) {
  // hash name to a hue offset for variety
  const hash = name.split('').reduce((a,c)=>a + c.charCodeAt(0), 0);
  const initials = name.replace(/^Die\s+/, '').split(/\s+/).map(w=>w[0]).slice(0,2).join('');
  return (
    <div style={{
      position:'relative', width:'46px', height:'52px',
      display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0
    }}>
      <svg width="46" height="52" viewBox="0 0 46 52" style={{ position:'absolute', inset:0 }}>
        <polygon points="23,2 43,13 43,39 23,50 3,39 3,13"
          fill="rgba(124,77,255,0.12)" stroke="rgba(167,139,255,0.6)" strokeWidth="1.2"/>
        <polygon points="23,7 38,15.5 38,36.5 23,45 8,36.5 8,15.5"
          fill="none" stroke="rgba(167,139,255,0.18)" strokeWidth="0.8"/>
      </svg>
      <span style={{
        position:'relative', zIndex:1,
        fontFamily:'var(--font-display)', fontSize:'14px', fontWeight:500,
        letterSpacing:'0.05em', color:'#e8e0ff'
      }}>{initials}</span>
    </div>
  );
}

}

        </div>
        <div style={{ textAlign:'right' }}>
          <div style={{
            fontFamily:'var(--font-mono)', fontSize:'8px', color:'var(--muted-dim)',
            letterSpacing:'0.2em', textTransform:'uppercase', marginBottom:'4px'
          }}>SCHWIERIGKEIT</div>
          <SchwierigkeitsAnzeige level={q.sw}/>
        </div>
      </div>

      {/* Body */}
      <div style={{
        flex:1, minHeight:0, overflowY:'auto', padding:'20px 22px',

              icon={<svg width="14" height="14" viewBox="0 0 14 14"><polygon points="7,1 13,5 11,12 3,12 1,5" fill="none" stroke="currentColor" strokeWidth="1.2"/></svg>}

                  >

                      color: done ? 'rgba(200,190,240,0.6)' : 'rgba(220,210,250,0.88)',

                          flex:1, height:'3px', background:'rgba(160,140,255,0.1)',

                            height:'100%', width: `${(n/step.max)*100}%`,

                            boxShadow:'0 0 8px rgba(167,139,255,0.6)',
                            transition:'width 0.25s ease'
                          }}/>
                        </div>
                        <span style={{
                          fontFamily:'var(--font-mono)', fontSize:'11px',
                          color: done ? 'var(--purple-bright)' : '#f0eeff',
                          letterSpacing:'0.1em'

            })}

            <div style={{
              marginTop:'24px', padding:'12px 14px',
              background:'rgba(45,125,255,0.05)',
              border:'1px dashed rgba(127,184,255,0.25)',

            }}>
              <div style={{
                fontFamily:'var(--font-mono)', fontSize:'8.5px', letterSpacing:'0.22em',
                color:'rgba(127,184,255,0.7)', textTransform:'uppercase', marginBottom:'5px'
              }}>◈ Hinweis</div>
              <div style={{
                fontFamily:'var(--font-body)', fontWeight:300, fontStyle:'italic',
                fontSize:'11.5px', color:'rgba(200,210,240,0.7)', lineHeight:1.6
              }}>
                Tippe auf die Sechsecke, um Schritte abzuhaken — bei Sammelaufträgen erhöht jeder Klick den Zähler. Sprich mit deinem Auftraggeber, sobald alle Anweisungen erfüllt sind.
              </div>
            </div>
          </div>
        )}
      </div>

      {/* Accept bar */}
      <div style={{
        padding:'12px 22px',
        borderTop:'1px solid rgba(160,140,255,0.18)',

            }}
              onMouseEnter={e=>{ e.currentTarget.style.borderColor='rgba(200,60,60,0.6)'; e.currentTarget.style.color='rgba(255,120,120,0.9)'; }}
              onMouseLeave={e=>{ e.currentTarget.style.borderColor='rgba(200,60,60,0.35)'; e.currentTarget.style.color='rgba(255,120,120,0.6)'; }}
            >Zurückziehen</button>
          )}
          <button
            onClick={!accepted ? onAccept : undefined}
            disabled={accepted}
            style={{
              fontFamily:'var(--font-display)', fontSize:'11px',
              letterSpacing:'0.28em', padding:'9px 28px',
              background: accepted ? 'rgba(124,77,255,0.08)' : 'rgba(124,77,255,0.22)',
              border:`1px solid ${accepted ? 'rgba(160,140,255,0.3)' : 'rgba(167,139,255,0.7)'}`,
              color: accepted ? 'var(--purple-bright)' : '#f0eeff',
              cursor: accepted ? 'default' : 'pointer', borderRadius:'2px',
              textTransform:'uppercase', transition:'all 0.2s',
              display:'inline-flex', alignItems:'center', gap:'10px',
              boxShadow: accepted ? 'none' : '0 0 20px rgba(124,77,255,0.25)'
            }}
            onMouseEnter={e=>{ if (!accepted) { e.currentTarget.style.background='rgba(124,77,255,0.35)'; e.currentTarget.style.borderColor='#a78bff'; } }}
            onMouseLeave={e=>{ if (!accepted) { e.currentTarget.style.background='rgba(124,77,255,0.22)'; e.currentTarget.style.borderColor='rgba(167,139,255,0.7)'; } }}
          >
            <span style={{
              display:'inline-flex', width:'18px', height:'18px',
              border:'1px solid currentColor', borderRadius:'50%',
              alignItems:'center', justifyContent:'center', fontSize:'10px'
            }}>↵</span>
            {accepted ? 'Beworben' : 'Akzeptieren'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── PANEL WRAPPER ───────────────────────────────────────────────────────────
function Panel({ children, style }) {
  return (
    <div style={{
      position:'relative',
      background:'linear-gradient(180deg, rgba(15,10,40,0.7) 0%, rgba(8,6,22,0.85) 100%)',
      border:'1px solid rgba(160,140,255,0.18)',
      borderRadius:'3px',
      backdropFilter:'blur(8px)',
      display:'flex', flexDirection:'column', minHeight:0, overflow:'hidden',
      boxShadow:'0 8px 40px rgba(0,0,0,0.5), inset 0 0 60px rgba(124,77,255,0.04)',
      ...style
    }}>
      <div className="panel-corner tl"/>
      <div className="panel-corner tr"/>
      <div className="panel-corner bl"/>
      <div className="panel-corner br"/>
      {children}
    </div>
  );
}

// ─── CHAR PICKER MODAL ───────────────────────────────────────────────────────
function CharPickerModal({ mission, myChars, onConfirm, onClose, busy }) {
  const [pickedId, setPickedId] = useState(myChars.length === 1 ? myChars[0].id : null);

  useEffect(() => {
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, []);

  return ReactDOM.createPortal(
    <div onClick={e=>{ if(e.target===e.currentTarget) onClose(); }} style={{
      position:'fixed', inset:0, zIndex:9999,
      background:'rgba(5,4,15,0.85)', backdropFilter:'blur(8px)',
      display:'flex', alignItems:'center', justifyContent:'center'
    }}>
      <div style={{ width:'100%', maxWidth:420, margin:'0 16px',
        background:'rgba(10,7,28,0.98)', border:'1px solid rgba(124,77,255,0.4)',
        borderRadius:6, overflow:'hidden' }}>

        {/* Header */}
        <div style={{ padding:'20px 22px 16px',
          borderBottom:'1px solid rgba(124,77,255,0.15)',
          background:'linear-gradient(180deg,rgba(124,77,255,0.1)0%,transparent 100%)' }}>
          <div style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'.28em',
            color:'rgba(124,77,255,0.5)', textTransform:'uppercase', marginBottom:'4px' }}>
            Bewerbung · {mission.name}
          </div>
          <div style={{ fontFamily:'var(--font-display)', fontSize:'16px', letterSpacing:'.15em',
            color:'#f0eeff', textTransform:'uppercase' }}>
            Charakter wählen
          </div>
        </div>

        {/* Char list */}
        <div style={{ padding:'12px 22px', maxHeight:'280px', overflowY:'auto' }}>
          {myChars.length === 0 && (
            <div style={{ padding:'20px 0', textAlign:'center',
              fontFamily:'var(--font-body)', fontSize:'12px', fontWeight:300,
              color:'rgba(160,140,255,0.5)', fontStyle:'italic' }}>
              Keine Spielercharaktere vorhanden.{' '}
              <a href="Neuer_Charakter.html" style={{ color:'rgba(124,77,255,0.7)' }}>
                Charakter erstellen →
              </a>
            </div>
          )}
          {myChars.map(ch => (
            <div key={ch.id} onClick={()=>setPickedId(ch.id)} style={{
              display:'flex', alignItems:'center', gap:'12px',
              padding:'10px 12px', marginBottom:'6px', cursor:'pointer',
              background: pickedId===ch.id ? 'rgba(124,77,255,0.2)' : 'rgba(124,77,255,0.05)',
              border: `1px solid ${pickedId===ch.id ? 'rgba(167,139,255,0.6)' : 'rgba(124,77,255,0.15)'}`,
              borderRadius:'3px', transition:'all .15s'
            }}>
              <div style={{ width:34, height:34, borderRadius:'50%', flexShrink:0,
                background:'rgba(124,77,255,0.15)', border:'1px solid rgba(124,77,255,0.3)',
                display:'flex', alignItems:'center', justifyContent:'center',
                fontFamily:'var(--font-display)', fontSize:'14px', color:'rgba(167,139,255,0.8)' }}>
                {(ch.name||'?')[0]}
              </div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontFamily:'var(--font-body)', fontSize:'13px', fontWeight:400,
                  color:'#f0eeff', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
                  {ch.name}
                </div>
                <div style={{ fontFamily:'var(--font-body)', fontSize:'11px', fontWeight:300,
                  color:'rgba(160,140,255,0.55)', marginTop:'1px' }}>
                  {[ch.race, ch.class, ch.division].filter(Boolean).join(' · ') || '—'}
                </div>
              </div>
              {pickedId===ch.id && (
                <span style={{ color:'rgba(167,139,255,0.8)', fontSize:'16px', flexShrink:0 }}>✓</span>
              )}
            </div>
          ))}
        </div>

        {/* Footer */}
        <div style={{ padding:'14px 22px', borderTop:'1px solid rgba(124,77,255,0.12)',
          display:'flex', gap:'10px' }}>
          <button
            onClick={()=>{ if(pickedId) onConfirm(pickedId); }}
            disabled={!pickedId || busy}
            style={{
              flex:1, fontFamily:'var(--font-display)', fontSize:'11px',
              letterSpacing:'.18em', textTransform:'uppercase', padding:'10px',
              background: (!pickedId||busy) ? 'rgba(124,77,255,0.08)' : 'rgba(124,77,255,0.22)',
              border:`1px solid ${(!pickedId||busy) ? 'rgba(124,77,255,0.2)' : 'rgba(167,139,255,0.6)'}`,
              color: (!pickedId||busy) ? 'rgba(160,140,255,0.4)' : '#f0eeff',
              cursor: (!pickedId||busy) ? 'not-allowed' : 'pointer',
              borderRadius:'3px', transition:'all .15s'
            }}>
            {busy ? 'Bewerben…' : 'Bewerben'}
          </button>
          <button onClick={onClose} style={{
            fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'.18em',
            textTransform:'uppercase', padding:'10px 16px',
            background:'transparent', border:'1px solid rgba(124,77,255,0.2)',
            borderRadius:'3px', color:'rgba(124,77,255,0.5)', cursor:'pointer'
          }}>Abbrechen</button>
        </div>
      </div>
    </div>,
    document.body
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [quests, setQuests] = useState([]);
  const [loading, setLoading] = useState(true);
  const [myApplications, setMyApplications] = useState({}); // mission_id → app row
  const [myChars, setMyChars] = useState([]);

  const [filter, setFilter] = useState('alle');
  const [search, setSearch] = useState('');
  const [selectedId, setSelectedId] = useState(null);
  const [view, setView] = useState('details');
  const [progress, setProgress] = useState({});
  const [pickerMission, setPickerMission] = useState(null);
  const [applyBusy, setApplyBusy] = useState(false);

  useEffect(() => {
    async function load() {
      const uid = window.SITE_USER?.id;

      const [{ data: mdata }, { data: adata }, { data: cdata }] = await Promise.all([
        window._sb.from('missions').select('*').neq('status','archiviert').order('created_at', { ascending: false }),
        uid ? window._sb.from('mission_applications').select('*').eq('player_id', uid) : { data: [] },
        uid ? window._sb.from('characters').select('id,name,race,class,division').eq('owner_id', uid).eq('type','spieler') : { data: [] },
      ]);

      const mapped = (mdata || []).map(m => ({ ...m, desc: m.beschreibung }));
      setQuests(mapped);
      if (mapped.length) setSelectedId(mapped[0].id);

      const appMap = {};
      (adata || []).forEach(a => { appMap[a.mission_id] = a; });
      setMyApplications(appMap);

      setMyChars(cdata || []);

      const initProgress = {};
      mapped.forEach(q => { initProgress[q.id] = (q.anweisungen || []).map(s => s.n || 0); });
      setProgress(initProgress);

      setLoading(false);
    }
    load();
  }, []);

  const stepClick = (questId, stepIdx, max) => {
    setProgress(prev => {
      const cur = prev[questId] ? [...prev[questId]] : [];
      const n = cur[stepIdx] ?? 0;
      if (max <= 1) cur[stepIdx] = n >= 1 ? 0 : 1;
      else cur[stepIdx] = n >= max ? 0 : n + 1;
      return { ...prev, [questId]: cur };
    });
  };

  const counts = useMemo(() => ({
    alle: quests.length,
    Suche: quests.filter(q=>q.kategorie==='Suche').length,
    Gespraech: quests.filter(q=>q.kategorie==='Gespraech').length,
    Jagd: quests.filter(q=>q.kategorie==='Jagd').length,
  }), [quests]);

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    return quests.filter(x => {
      if (filter !== 'alle' && x.kategorie !== filter) return false;
      if (q && !(x.name.toLowerCase().includes(q) || x.auftraggeber.toLowerCase().includes(q))) return false;
      return true;
    });
  }, [quests, filter, search]);

  useEffect(() => {
    if (filtered.length && !filtered.find(q => q.id === selectedId)) {
      setSelectedId(filtered[0].id);
    }
  }, [filtered, selectedId]);

  const selected = quests.find(q => q.id === selectedId) || quests[0];
  const myApp = selected ? myApplications[selected.id] : null;

  async function handleConfirmApply(charId) {
    if (!selected || !charId) return;
    setApplyBusy(true);
    const uid = window.SITE_USER?.id;
    const { data, error } = await window._sb.from('mission_applications').insert({
      mission_id: selected.id,
      player_id: uid,
      character_id: charId,
    }).select().single();
    setApplyBusy(false);
    if (!error && data) {
      setMyApplications(prev => ({ ...prev, [selected.id]: data }));
    }
    setPickerMission(null);
  }

  async function handleWithdraw() {
    if (!myApp) return;
    await window._sb.from('mission_applications').delete().eq('id', myApp.id);
    setMyApplications(prev => { const n = { ...prev }; delete n[selected.id]; return n; });
  }

  const appliedCount = Object.keys(myApplications).length;

  return (
    <>
      {tweaks.showParticles && <ParticleField/>}
      {tweaks.showScanline && (
        <div style={{
          position:'fixed', left:0, right:0, top:0, height:'2px',
          background:'linear-gradient(180deg, rgba(167,139,255,0.45) 0%, transparent 100%)',
          animation:'scanline-x 14s linear infinite', pointerEvents:'none', zIndex:9998
        }}/>
      )}

      <SiteNav rightLabel="MISSIONSTERMINAL" />

      {/* ── PAGE HEADER ── */}
      <div style={{
        position:'relative', zIndex:5,
        padding:'22px 32px 14px 32px',
        display:'flex', alignItems:'flex-end', justifyContent:'space-between', gap:'24px',
        borderBottom:'1px solid rgba(160,140,255,0.08)',
        flexShrink:0
      }}>
        <div>
          <div style={{
            fontFamily:'var(--font-mono)', fontSize:'9px',
            color:'rgba(167,139,255,0.6)', letterSpacing:'0.3em',
            textTransform:'uppercase', marginBottom:'8px'
          }}>◈ Divisionsterminal · Auftrags-Knoten 03</div>
          <h1 style={{
            fontFamily:'var(--font-display)', fontSize:'28px', fontWeight:400,
            letterSpacing:'0.28em', color:'#f0eeff',
            textShadow:'0 0 28px rgba(124,77,255,0.45)',
            animation:'flicker-mid 11s infinite', textTransform:'uppercase'
          }}>Missionsterminal</h1>
        </div>
        <div style={{
          display:'flex', alignItems:'center', gap:'14px',
          fontFamily:'var(--font-mono)', fontSize:'10px',
          color:'var(--muted)', letterSpacing:'0.15em'
        }}>
          <div style={{ display:'flex', alignItems:'center', gap:'7px' }}>
            <span style={{
              width:'7px', height:'7px', borderRadius:'50%',
              background: loading ? 'rgba(160,140,255,0.4)' : '#7fb8ff',
              boxShadow: loading ? 'none' : '0 0 8px #7fb8ff',
              animation: loading ? 'none' : 'pulse-glow 2s ease infinite'
            }}/>
            {loading ? 'VERBINDE…' : 'VERBINDUNG · STABIL'}
          </div>
          <div style={{ width:'1px', height:'16px', background:'var(--border)' }}/>
          <div>{filtered.length} / {quests.length} AUFTRÄGE</div>
        </div>
      </div>

      {/* ── MAIN GRID ── */}
      <div style={{
        position:'relative', zIndex:5, flex:1, minHeight:0,
        display:'grid', gridTemplateColumns: '1fr 1fr',
        gap:'20px', padding:'20px 32px 16px 32px'
      }}>
        {/* ═══ LEFT: QUEST LIST ═══════════════════════════════════════ */}
        <Panel>
          <PanelHeader>Nebenjobs</PanelHeader>

          {/* Filter bar */}
          <div style={{
            padding:'12px 18px', display:'flex', alignItems:'center', gap:'8px',
            borderBottom:'1px solid rgba(160,140,255,0.1)',
            background:'rgba(8,6,22,0.4)'
          }}>
            <FilterChip label="Alle" count={counts.alle} active={filter==='alle'} onClick={()=>setFilter('alle')}/>
            <FilterChip label="Suche" count={counts.Suche} color="var(--suche)" active={filter==='Suche'} onClick={()=>setFilter('Suche')}/>
            <FilterChip label="Gespräch" count={counts.Gespraech} color="var(--gespraech)" active={filter==='Gespraech'} onClick={()=>setFilter('Gespraech')}/>
            <FilterChip label="Jagd" count={counts.Jagd} color="var(--jagd)" active={filter==='Jagd'} onClick={()=>setFilter('Jagd')}/>
            <div style={{ flex:1 }}/>
            <div style={{
              display:'flex', alignItems:'center', gap:'6px',
              padding:'4px 9px', height:'22px',
              border:'1px solid rgba(160,140,255,0.18)', borderRadius:'2px',
              background:'rgba(5,4,15,0.5)'
            }}>
              <svg width="11" height="11" viewBox="0 0 12 12" style={{ opacity:0.5 }}>
                <circle cx="5" cy="5" r="3.5" fill="none" stroke="#a78bff" strokeWidth="1.2"/>
                <line x1="7.5" y1="7.5" x2="10" y2="10" stroke="#a78bff" strokeWidth="1.2" strokeLinecap="round"/>
              </svg>
              <input
                value={search}
                onChange={e => setSearch(e.target.value)}
                placeholder="suchen…"
                style={{
                  background:'transparent', border:'none', outline:'none',
                  fontFamily:'var(--font-mono)', fontSize:'10px',
                  color:'#f0eeff', letterSpacing:'0.08em', width:'90px'
                }}
              />
            </div>
          </div>

          {/* Column headers */}
          <div style={{
            display:'grid', gridTemplateColumns:'1fr 110px 90px',
            gap:'12px', padding:'9px 16px',
            borderBottom:'1px solid rgba(160,140,255,0.12)',
            background:'rgba(124,77,255,0.04)',
            fontFamily:'var(--font-mono)', fontSize:'8.5px',
            color:'var(--muted-dim)', letterSpacing:'0.22em', textTransform:'uppercase'
          }}>
            <div>Auftrag</div>
            <div>Kategorie</div>
            <div>Schwierigkeit</div>
          </div>

          {/* List */}
          <div style={{ flex:1, minHeight:0, overflowY:'auto' }}>
            {loading && (
              <div style={{ padding:'40px 20px', textAlign:'center',
                fontFamily:'var(--font-mono)', fontSize:'9px',
                color:'rgba(160,140,255,0.4)', letterSpacing:'.2em' }}>LADE…</div>
            )}
            {!loading && filtered.length === 0 && (
              <div style={{
                padding:'40px 20px', textAlign:'center',
                fontFamily:'var(--font-body)', fontStyle:'italic',
                fontSize:'12px', color:'var(--muted-dim)'
              }}>
                {quests.length === 0 ? 'Keine Aufträge verfügbar.' : 'Keine Aufträge im Filter.'}
              </div>
            )}
            {filtered.map(q => (
              <QuestRow
                key={q.id}
                q={q}
                active={q.id === selectedId}
                onClick={()=>setSelectedId(q.id)}
                dense={tweaks.density === 'compact'}
              />
            ))}
          </div>

          {/* Foot */}
          <div style={{
            padding:'8px 18px',
            borderTop:'1px solid rgba(160,140,255,0.12)',
            display:'flex', alignItems:'center', justifyContent:'space-between',
            fontFamily:'var(--font-mono)', fontSize:'8.5px',
            color:'var(--muted-dim)', letterSpacing:'0.2em', textTransform:'uppercase',
            background:'rgba(5,4,15,0.5)'
          }}>
            <span>◈ Live · Supabase</span>
            <span>Beworben · {appliedCount}</span>
          </div>
        </Panel>

        {/* ═══ RIGHT: DETAIL CARD ═════════════════════════════════════ */}
        <Panel>
          {!selected && !loading ? (
            <div style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center',
              fontFamily:'var(--font-mono)', fontSize:'9px', letterSpacing:'.2em',
              color:'rgba(160,140,255,0.3)', textTransform:'uppercase' }}>
              Keine Mission ausgewählt
            </div>
          ) : selected && (
            <>
              <PanelHeader
                right={
                  <div style={{ display:'flex', alignItems:'center', gap:'10px' }}>
                    <button onClick={()=>setView('details')} style={{
                      fontFamily:'var(--font-mono)', fontSize:'9px', letterSpacing:'0.18em',
                      padding:'4px 10px', height:'22px',
                      background: view==='details' ? 'rgba(124,77,255,0.25)' : 'transparent',
                      border:`1px solid ${view==='details' ? 'rgba(167,139,255,0.6)' : 'rgba(160,140,255,0.15)'}`,
                      color: view==='details' ? '#f0eeff' : 'var(--muted)',
                      cursor:'pointer', borderRadius:'2px', textTransform:'uppercase',
                      transition:'all 0.15s'
                    }}>Details</button>
                    <button onClick={()=>setView('anweisungen')} style={{
                      fontFamily:'var(--font-mono)', fontSize:'9px', letterSpacing:'0.18em',
                      padding:'4px 10px', height:'22px',
                      background: view==='anweisungen' ? 'rgba(124,77,255,0.25)' : 'transparent',
                      border:`1px solid ${view==='anweisungen' ? 'rgba(167,139,255,0.6)' : 'rgba(160,140,255,0.15)'}`,
                      color: view==='anweisungen' ? '#f0eeff' : 'var(--muted)',
                      cursor:'pointer', borderRadius:'2px', textTransform:'uppercase',
                      transition:'all 0.15s'
                    }}>Anweisungen</button>
                    <div style={{ display:'flex', alignItems:'center', gap:'4px', marginLeft:'4px' }}>
                      <span style={{
                        width:'6px', height:'6px', borderRadius:'50%',
                        background: view==='details' ? 'var(--purple-bright)' : 'rgba(160,140,255,0.25)',
                        boxShadow: view==='details' ? '0 0 6px var(--purple-bright)' : 'none'
                      }}/>
                      <span style={{
                        width:'6px', height:'6px', borderRadius:'50%',
                        background: view==='anweisungen' ? 'var(--purple-bright)' : 'rgba(160,140,255,0.25)',
                        boxShadow: view==='anweisungen' ? '0 0 6px var(--purple-bright)' : 'none'
                      }}/>
                    </div>
                  </div>
                }
              >
                Auftrag
              </PanelHeader>
              <DetailCard
                key={selected.id + view}
                q={selected}
                view={view}
                myApp={myApp}
                onAccept={()=>setPickerMission(selected)}
                onWithdraw={handleWithdraw}
                progress={progress[selected.id] || []}
                onStepClick={(stepIdx, max) => stepClick(selected.id, stepIdx, max)}
              />
            </>
          )}
        </Panel>
      </div>

      {/* ── FOOTER ── */}
      <div style={{
        position:'relative', zIndex:5,
        padding:'8px 32px',
        borderTop:'1px solid rgba(160,140,255,0.08)',
        display:'flex', justifyContent:'space-between', alignItems:'center',
        flexShrink:0
      }}>
        <div style={{
          fontFamily:'var(--font-mono)', fontSize:'8px',
          color:'rgba(160,140,255,0.35)', letterSpacing:'0.22em'
        }}>
          ◈ KONTEXT-TIPPS · [TAB] WECHSELT ANSICHT · [↵] AKZEPTIEREN
        </div>
        <div style={{
          fontFamily:'var(--font-mono)', fontSize:'8px',
          color:'rgba(160,140,255,0.35)', letterSpacing:'0.22em'
        }}>
          MERURIA // MISSIONSTERMINAL v4.0
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Atmosphäre"/>
        <TweakToggle id="showParticles" label="Partikel"/>
        <TweakToggle id="showScanline" label="Scanline"/>
        <TweakSection label="Listendichte"/>
        <TweakRadio id="density" label="Zeilenhöhe" options={['comfortable','compact']}/>
      </TweaksPanel>

      {pickerMission && (
        <CharPickerModal
          mission={pickerMission}
          myChars={myChars}
          onConfirm={handleConfirmApply}
          onClose={()=>setPickerMission(null)}
          busy={applyBusy}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<SiteGate><App/></SiteGate>);
</script>


</body></html>
