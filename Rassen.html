// ── HEX POINTS ──────────────────────────────────────────
function hexPoints(s) {
  const cx = s/2, cy = s/2, r = s/2;
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = (Math.PI / 180) * (60*i - 30);
    pts.push(`${cx + r*Math.cos(a)},${cy + r*Math.sin(a)}`);
  }
  return pts.join(' ');
}
function OctSvg({ size=24, color='currentColor', fill='none', strokeWidth=1, opacity=1, style={} }) {
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ display:'block', flexShrink:0, ...style }}>
      <polygon points={hexPoints(size)} fill={fill} stroke={color} strokeWidth={strokeWidth} opacity={opacity} />
    </svg>
  );
}


// ── SCROLL REVEAL ────────────────────────────────────────
function useScrollReveal() {
  useEffect(()=>{
    document.querySelectorAll('.reveal-up.visible,.reveal-left.visible').forEach(el=>el.classList.remove('visible'));
    let observer;
    const revealed=new WeakSet();
    const revealEl=(el,delay)=>{ if(revealed.has(el))return; revealed.add(el); setTimeout(()=>el.classList.add('visible'),delay); };
    const init=()=>{
      observer=new IntersectionObserver(entries=>{
        entries.forEach(entry=>{
          if(!entry.isIntersecting)return;
          const el=entry.target; observer.unobserve(el);
          if(el.classList.contains('reveal-left')){ revealEl(el,0); return; }
          const parent=el.parentElement;
          if(!parent){ revealEl(el,0); return; }
          const siblings=Array.from(parent.querySelectorAll('.reveal-up'));
          const rowMap=new Map();
          siblings.forEach(sib=>{ const top=Math.round(sib.getBoundingClientRect().top); if(!rowMap.has(top))rowMap.set(top,[]); rowMap.get(top).push(sib); });
          const sortedTops=Array.from(rowMap.keys()).sort((a,b)=>a-b);
          const elTop=Math.round(el.getBoundingClientRect().top);
          const rowIndex=sortedTops.indexOf(elTop);
          const rowDelay=Math.max(0,rowIndex)*80;
          const rowEls=rowMap.get(elTop)||[el];
          rowEls.forEach(rowEl=>{ observer.unobserve(rowEl); revealEl(rowEl,rowDelay); });
        });
      },{ threshold:0.06, rootMargin:'0px 0px -24px 0px' });
      document.querySelectorAll('.reveal-up,.reveal-left').forEach(el=>{ el.classList.remove('visible'); observer.observe(el); });
    };
    const t=setTimeout(init,120);
    return()=>{ clearTimeout(t); observer&&observer.disconnect(); };
  },[]);
}

// ── RACE CARD ─────────────────────────────────────────────
function RaceCard({ name, id, subtitle, tags, accent, onSelect, insigniaSrc }) {
  const cardRef = useRef(null);
  const [tilt, setTilt] = useState({ rx:0, ry:0 });
  const [hov, setHov] = useState(false);
  const frameRef = useRef(null);

  const handleMouseMove = useCallback((e) => {
    const el = cardRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    cancelAnimationFrame(frameRef.current);
    frameRef.current = requestAnimationFrame(() => setTilt({ rx:(y-0.5)*-16, ry:(x-0.5)*16 }));
  }, []);

  const handleMouseLeave = () => { setHov(false); cancelAnimationFrame(frameRef.current); setTilt({ rx:0, ry:0 }); };

  return <CardInner name={name} subtitle={subtitle} tags={tags} accent={accent} hov={hov} tilt={tilt} cardRef={cardRef}
    onMouseMove={handleMouseMove} onMouseEnter={()=>setHov(true)} onMouseLeave={handleMouseLeave}
    href={`${id}.html`} onClick={(e)=>{ e.preventDefault(); onSelect({ id, name, accent }); }}
    insigniaSrc={insigniaSrc} />;
}

// ── BUILD TOC ENTRIES ─────────────────────────────────────
// Returns a flat list of { id, label, isGroup } for the sidebar,
// mirroring exactly the visual order: batches of standalone races
// (one entry per batch, joined with " ● ") and group sections.
function buildTocEntries(cols) {
  const entries = [];
  let batch = [];
  let batchIdx = 0;

  const flushBatch = () => {
    if (batch.length === 0) return;
    // Split the batch into rows of `cols` each
    for (let i = 0; i < batch.length; i += cols) {
      const row = batch.slice(i, i + cols);
      const id = `race-batch-${batchIdx}-row-${Math.floor(i / cols)}`;
      entries.push({ id, label: row.map(r => r.name).join(' ● '), isGroup: false });
    }
    batchIdx++;
    batch = [];
  };

  ENTRIES.forEach(entry => {
    if (entry.type === 'race') {
      batch.push(entry);
    } else {
      flushBatch();
      entries.push({ id: entry.id, label: entry.name, isGroup: true });
    }
  });
  flushBatch();
  return entries;
}

// ── TOC SIDEBAR ──────────────────────────────────────────
function TOCSidebar({ headerBottom, navHeight, cols }) {
  const asideRef = React.useRef(null);

  useEffect(() => {
    const update = () => {
      const ideal = (headerBottom || 0) - window.scrollY;
      const val = Math.max(navHeight, ideal);
      if (asideRef.current) { asideRef.current.style.top = val + 'px'; asideRef.current.style.height = `calc(100vh - ${val}px)`; }
    };
    update();
    window.addEventListener('scroll', update, { passive:true });
    window.addEventListener('resize', update, { passive:true });
    return () => { window.removeEventListener('scroll', update); window.removeEventListener('resize', update); };
  }, [headerBottom, navHeight]);

  const scrollTo = (id) => {
    const el = document.getElementById(id);
    if (el) { const y = el.getBoundingClientRect().top + window.scrollY - navHeight - 8; window.scrollTo({ top:y, behavior:'smooth' }); }
  };

  const tocEntries = buildTocEntries(cols);

  return (
    <aside ref={asideRef} style={{ width:'var(--sidebar-w)', flexShrink:0, position:'fixed', top:`${navHeight}px`, left:0, height:`calc(100vh - ${navHeight}px)`, borderRight:'1px solid rgba(160,140,255,0.1)', padding:'28px 0', background:'rgba(5,4,15,0.85)', backdropFilter:'blur(12px)', zIndex:50, overflowY:'auto' }}>
      <div style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.25em', color:'rgba(160,140,255,0.4)', textTransform:'uppercase', padding:'0 20px', marginBottom:'4px' }}>Rassen</div>
      {tocEntries.map(entry => (
        <button key={entry.id} onClick={()=>scrollTo(entry.id)}
          style={{ display:'flex', alignItems:'flex-start', gap:'8px', width:'100%', textAlign:'left', padding:'7px 20px', background:'transparent', border:'none', cursor:'pointer', fontFamily:'var(--font-body)', fontWeight:'400', fontSize:'11px', letterSpacing:'0.1em', fontVariant:'small-caps', color:'rgba(200,190,240,0.6)', borderLeft:'2px solid transparent', transition:'all 0.15s', lineHeight:1.55 }}
          onMouseEnter={e=>{e.currentTarget.style.color='#f0eeff';e.currentTarget.style.borderLeftColor='rgba(124,77,255,0.6)';e.currentTarget.style.background='rgba(124,77,255,0.06)';}}
          onMouseLeave={e=>{e.currentTarget.style.color='rgba(200,190,240,0.6)';e.currentTarget.style.borderLeftColor='transparent';e.currentTarget.style.background='transparent';}}>
          <OctSvg size={6} color="rgba(124,77,255,0.5)" fill="rgba(124,77,255,0.25)" strokeWidth={1} style={{ flexShrink:0, marginTop:'3px' }} />
          <span style={{ display:'block', minWidth:0, textIndent:0, paddingLeft:0, wordBreak:'normal', overflowWrap:'anywhere' }}>{entry.label}</span>
        </button>
      ))}
    </aside>
  );
}

// ── APP ──────────────────────────────────────────────────
function App() {
  const [mouse, setMouse] = useState({ x:0.5, y:0.5 });
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [headerBottom, setHeaderBottom] = useState(0);
  const [selectedRace, setSelectedRace] = useState(null);
  const NAV_H = 52;

  const handleSelect = useCallback((race) => setSelectedRace(race), []);

  const pageTitleRef = useRef(null);

  const handleMouseMove = useCallback(e=>{ setMouse({ x:e.clientX/window.innerWidth, y:e.clientY/window.innerHeight }); },[]);
  useScrollReveal();

  // Measure absolute document bottom of the page-title block
  useEffect(() => {
    const measure = () => {
      if (pageTitleRef.current) {
        const rect = pageTitleRef.current.getBoundingClientRect();
        setHeaderBottom(rect.bottom + window.scrollY - 10);
      }
    };
    measure();
    window.addEventListener('resize', measure, { passive:true });
    return () => window.removeEventListener('resize', measure);
  }, [tweaks.headerHeight]);

  const accent = tweaks.cardAccent || '#7c4dff';

  return (
    <div onMouseMove={handleMouseMove} className="page-root">
      {tweaks.showParticles && <ParticleField mouseX={mouse.x} mouseY={mouse.y} />}
      <FloatingHexField mouseX={mouse.x} mouseY={mouse.y} />

      {/* HEADER */}
      <PageHeader height={tweaks.headerHeight} />

      {/* NAV */}
      <SiteNav rightLabel="RASSEN-ARCHIV v1.0" />

      {/* BODY */}
      <div className="page-body">
        <TOCSidebar headerBottom={headerBottom} navHeight={NAV_H} cols={tweaks.columns || 3} />

        <div style={{ flex:1, padding:'32px 28px 64px', minWidth:0 }}>

          {/* Page title */}
          <div style={{ marginBottom:'32px' }}>
            <div ref={pageTitleRef} style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.25em', color:'rgba(160,140,255,0.4)', textTransform:'uppercase', marginBottom:'6px' }}>Charaktererstellung</div>
            <h1 className="reveal-left" style={{ fontFamily:'var(--font-display)', fontSize:'42px', fontWeight:'300', letterSpacing:'0.18em', color:'#f0eeff', textShadow:'0 0 30px rgba(124,77,255,0.35)' }}>Rassen</h1>
            <div style={{ display:'flex', alignItems:'center', gap:'8px', marginTop:'12px' }}>
              <div style={{ width:'50px', height:'1px', background:'linear-gradient(90deg,rgba(124,77,255,0.8),transparent)', animation:'pulse-glow 3s infinite' }} />
              <OctSvg size={8} color="rgba(124,77,255,0.5)" fill="rgba(124,77,255,0.2)" strokeWidth={1} />
            </div>
          </div>

          {/* Flat ordered list — races and groups in original order */}
          {(() => {
            const cols = tweaks.columns || 3;
            const output = [];
            let batch = [];
            let batchIdx = 0;

            const flushBatch = () => {
              if (batch.length === 0) return;
              const b = batch.slice();
              batch = [];
              // Split into rows of `cols`, each row gets its own anchor id
              for (let i = 0; i < b.length; i += cols) {
                const row = b.slice(i, i + cols);
                const rowId = `race-batch-${batchIdx}-row-${Math.floor(i / cols)}`;
                output.push(
                  <div key={rowId} id={rowId} style={{ display:'grid', gridTemplateColumns:`repeat(${cols}, 1fr)`, gap:'16px', marginBottom:'16px', scrollMarginTop:`${NAV_H + 8}px`, overflow:'visible' }}>
                    {row.map(r => <RaceCard key={r.id} id={r.id} name={r.name} subtitle={r.subtitle} tags={r.tags} accent={accent} onSelect={handleSelect} insigniaSrc={r.insigniaSrc} />)}
                  </div>
                );
              }
              // Add bottom margin after the whole batch block
              output.push(<div key={`batch-spacer-${batchIdx}`} style={{ marginBottom:'16px' }} />);
              batchIdx++;
            };

            ENTRIES.forEach((entry) => {
              if (entry.type === 'race') {
                batch.push(entry);
              } else {
                flushBatch();
                output.push(
                  <GroupSection key={entry.id} entry={entry} accent={accent} cols={cols} navHeight={NAV_H} onSelect={handleSelect} />
                );
              }
            });
            flushBatch();
            return output;
          })()}

        </div>
      </div>

      <SiteFooter />

      {selectedRace && <DetailOverlay race={selectedRace} onClose={() => setSelectedRace(null)} />}

      {/* TWEAKS */}
      {!selectedRace && <FloatNav />}
      <TweaksPanel>
        <TweakSection label="Layout" />
        <TweakSlider id="columns" label="Spalten" min={2} max={4} step={1} />
        <TweakSlider id="headerHeight" label="Kopfzeile Höhe" min={80} max={320} step={10} />
        <TweakSection label="Darstellung" />
        <TweakColor id="cardAccent" label="Akzentfarbe" />
        <TweakToggle id="showParticles" label="Partikel" />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<SiteGate><App /></SiteGate>);
</script>


</body></html>
