// ── SCROLL REVEAL ────────────────────────────────────────
function useScrollReveal() {
  useEffect(() => {
    document.querySelectorAll('.reveal-up.visible,.reveal-left.visible').forEach(el => el.classList.remove('visible'));
    let observer;
    const revealed = new WeakSet();
    const revealEl = (el, delay) => {
      if (revealed.has(el)) return;
      revealed.add(el);
      setTimeout(() => el.classList.add('visible'), delay);
    };
    const init = () => {
      observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          const el = entry.target;
          observer.unobserve(el);
          if (el.classList.contains('reveal-left')) {
            revealEl(el, 0);
            return;
          }
          const parent = el.parentElement;
          if (!parent) {
            revealEl(el, 0);
            return;
          }
          const siblings = Array.from(parent.querySelectorAll('.reveal-up'));
          const rowMap = new Map();
          siblings.forEach(sib => {
            const top = Math.round(sib.getBoundingClientRect().top);
            if (!rowMap.has(top)) rowMap.set(top, []);
            rowMap.get(top).push(sib);
          });
          const sortedTops = Array.from(rowMap.keys()).sort((a, b) => a - b);
          const elTop = Math.round(el.getBoundingClientRect().top);
          const rowIndex = sortedTops.indexOf(elTop);
          const rowDelay = Math.max(0, rowIndex) * 80;
          const rowEls = rowMap.get(elTop) || [el];
          rowEls.forEach(rowEl => {
            observer.unobserve(rowEl);
            revealEl(rowEl, rowDelay);
          });
        });
      }, {
        threshold: 0.06,
        rootMargin: '0px 0px -24px 0px'
      });
      document.querySelectorAll('.reveal-up,.reveal-left').forEach(el => {
        el.classList.remove('visible');
        observer.observe(el);
      });
    };
    const t = setTimeout(init, 120);
    return () => {
      clearTimeout(t);
      observer && observer.disconnect();
    };
  }, []);
}
