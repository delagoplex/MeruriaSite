<!-- ═══════════════════════════════════════════
     SCRIPT 1 — Utilities · ImageSlot · Atome
     ═══════════════════════════════════════════ -->
<script type="text/babel">
const { useState, useRef } = React;

/* ── Utilities ───────────────────────────── */
function mod(v)         { return Math.floor((v-10)/2); }
function fmtMod(n)      { return (n>=0?"+":"")+n; }
function attrKey(a)     { return {Stä:"str",Ges:"dex",Kon:"con",Int:"int",Wei:"wis",Cha:"cha"}[a]||"str"; }
function skillBonus(s,stats,pb) { return mod(stats[attrKey(s.attr)])+s.prof*pb; }

/* ── ImageSlot — Meruria-Stil, localStorage ─ */
function ImageSlot({ slotId, label, height, hue, portrait }) {
  const [src, setSrc] = useState(() => {
    try { return localStorage.getItem(`mimg-${slotId}`)||null; } catch(e) { return null; }
  });
  const [drag, setDrag] = useState(false);
  const inp = useRef(null);
  function load(file) {
    if (!file||!file.type.startsWith("image/")) return;
    const r = new FileReader();
    r.onload = ev => { setSrc(ev.target.result); try { localStorage.setItem(`mimg-${slotId}`,ev.target.result); } catch(e){} };
    r.readAsDataURL(file);
  }
  const h   = hue||270;
  const ac  = `oklch(0.65 0.18 ${h})`;
  const str = `oklch(0.65 0.18 ${h} / 0.12)`;
  const dsh = `oklch(0.65 0.18 ${h} / ${drag?0.85:0.45})`;
  const base = { width:"100%", height, borderRadius:3, overflow:"hidden", position:"relative",
    border:`1px dashed ${dsh}`, cursor:"pointer", transition:"border-color .2s", flexShrink:0 };
  const ev = { onClick:()=>inp.current.click(),
    onDragOver:e=>{e.preventDefault();setDrag(true);},
    onDragLeave:()=>setDrag(false),
    onDrop:e=>{e.preventDefault();setDrag(false);load(e.dataTransfer.files[0]);} };
  if (src) return (
    <div style={base} {...ev}>
      <img src={src} style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}} alt={label} />
      <div style={{position:"absolute",bottom:5,right:7,fontFamily:"var(--font-mono)",fontSize:6.5,
        color:"rgba(255,255,255,0.3)",background:"rgba(0,0,0,0.6)",padding:"1px 5px",borderRadius:2,letterSpacing:".12em"}}>ersetzen</div>
      <input ref={inp} type="file" accept="image/*" style={{display:"none"}} onChange={e=>load(e.target.files[0])} />
    </div>
  );
  return (
    <div style={{...base,
      background:`repeating-linear-gradient(-45deg,transparent,transparent 8px,${str} 8px,${str} 9px),linear-gradient(160deg,rgba(28,16,62,0.97),rgba(14,9,36,0.98))`,
      display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:8}} {...ev}>
      <div style={{position:"absolute",inset:0,background:`radial-gradient(ellipse at 50% 45%,oklch(0.65 0.18 ${h} / 0.17) 0%,transparent 62%)`}} />
      {portrait
        ? <svg viewBox="0 0 32 40" width="22" height="27" fill="none" style={{opacity:0.5,zIndex:1}}>
            <rect x="1" y="1" width="30" height="38" rx="3" stroke={ac} strokeWidth="1.2"/>
            <circle cx="16" cy="15" r="7" stroke={ac} strokeWidth="1" opacity="0.8"/>
            <path d="M2 37 Q16 26 30 37" stroke={ac} strokeWidth="1" opacity="0.7"/>
          </svg>
        : <svg viewBox="0 0 40 30" width="26" height="20" fill="none" style={{opacity:0.5,zIndex:1}}>
            <rect x="1" y="1" width="38" height="28" rx="2" stroke={ac} strokeWidth="1.2"/>
            <circle cx="12" cy="11" r="4" stroke={ac} strokeWidth="1" opacity="0.8"/>
            <path d="M1 22 L10 15 L18 20 L26 13 L39 22" stroke={ac} strokeWidth="1.1" opacity="0.8"/>
          </svg>}
      <span style={{fontFamily:"var(--font-mono)",fontSize:7.5,letterSpacing:".22em",zIndex:1,
        color:`oklch(0.65 0.18 ${h} / 0.58)`,textTransform:"uppercase",textAlign:"center",padding:"0 10px"}}>
        {(label||"artwork").toLowerCase()}</span>
      <span style={{fontFamily:"var(--font-mono)",fontSize:6.5,letterSpacing:".1em",zIndex:1,
        color:`oklch(0.65 0.18 ${h} / ${drag?0.9:0.28})`,transition:"color .2s"}}>
        {drag?"▼ loslassen":"klicken · ziehen"}</span>
      <input ref={inp} type="file" accept="image/*" style={{display:"none"}} onChange={e=>load(e.target.files[0])} />
    </div>
  );
}

/* ── Atome ───────────────────────────────── */
function SecTitle({ label }) {
  return (
    <div style={{marginBottom:10}}>
      <span style={{fontFamily:"var(--font-mono)",fontSize:8,letterSpacing:".28em",color:"rgba(124,77,255,0.5)",textTransform:"uppercase"}}>{label}</span>
      <div style={{width:24,height:1,background:"linear-gradient(90deg,rgba(124,77,255,0.65),transparent)",marginTop:4}} />
    </div>
  );
}
function Card({children,style}) {
  return <div style={{background:"var(--card-bg)",border:"1px solid rgba(124,77,255,0.2)",borderRadius:4,padding:"13px 14px",position:"relative",...style}}>{children}</div>;
}
function Corners({op=0.4,sz=14}) {
  const b=`1.5px solid rgba(124,77,255,${op})`;
  return (<>
    <div style={{position:"absolute",top:0,left:0,  width:sz,height:sz,borderTop:b,borderLeft:b,  pointerEvents:"none"}}/>
    <div style={{position:"absolute",top:0,right:0, width:sz,height:sz,borderTop:b,borderRight:b, pointerEvents:"none"}}/>
    <div style={{position:"absolute",bottom:0,left:0,  width:sz,height:sz,borderBottom:b,borderLeft:b,  pointerEvents:"none"}}/>
    <div style={{position:"absolute",bottom:0,right:0, width:sz,height:sz,borderBottom:b,borderRight:b, pointerEvents:"none"}}/>
  </>);
}
function IRow({label,value,bright}) {
  return (
    <div style={{display:"flex",alignItems:"baseline",gap:6,padding:"3.5px 0",borderBottom:"1px solid rgba(124,77,255,0.06)"}}>
      <span style={{fontFamily:"var(--font-mono)",fontSize:7.5,letterSpacing:".12em",color:"rgba(124,77,255,0.4)",textTransform:"uppercase",flex:"0 0 80px"}}>{label}</span>
      <span style={{fontFamily:"var(--font-body)",fontSize:11.5,fontWeight:bright?400:300,color:bright?"var(--white)":"var(--silver)",flex:1}}>{value}</span>
    </div>
  );
}

Object.assign(window, { mod, fmtMod, attrKey, skillBonus, ImageSlot, SecTitle, Card, Corners, IRow });
</script>


<!-- ═══════════════════════════════════════════
     SCRIPT 2 — Sektions-Komponenten (extern)

<script src="assets/components/steckbrief-components.jsx" type="text/babel"></script>


<!-- ═══════════════════════════════════════════
     SCRIPT 3 — Haupt-App
     ═══════════════════════════════════════════ -->
<script type="text/babel">
const { useState: useApp, useRef } = React;
const { ImageSlot, SecTitle, Card, Corners, IRow,
  DivisionRank, DeityCard, CombatCompact, AttributeGrid,
  SkillPills, PersonalitySection, QuestCard, CompanionCard, FbCard, KontakteTablet,
  buildChar } = window;
const { useTweaks, TweaksPanel, TweakSection, TweakToggle } = window;
const { SiteNav, SiteGate } = window;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{"showCompanions":true,"showQuests":true,"showKontakte":true,"showWissenswertes":true,"showZauber":true}/*EDITMODE-END*/;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

const KLASSEN_SPELL = ['Barbar','Barde','Druide','Hexenmeister','Kämpfer','Kleriker','Magier','Magieschmied','Mönch','Paladin','Schurke','Waldläufer','Zauberer'];

function extractHealingDice(beschreibung) {
  const text = (beschreibung || []).filter(b => typeof b === 'string').join(' ');
  const m1 = text.match(/höhe\s+von\s+(\d+[Ww]\d+(?:[+-]\d+)?)/i);
  if (m1) return m1[1];
  const m2 = text.match(/(\d+[Ww]\d+(?:[+-]\d+)?)\s+trefferpunkte[n]?\s+wieder\s+her/i);
  if (m2) return m2[1];
  return null;
}
function isHealingSpell(z) {
  const text = (z.beschreibung || []).filter(b => typeof b === 'string').join(' ');
  return /trefferpunkte[n]?\s+zurück\s+in\s+höhe/i.test(text)
      || /\d+[Ww]\d+\s+trefferpunkte[n]?\s+wieder\s+her/i.test(text)
      || /stellt\s+\d+\s+trefferpunkt/i.test(text);
}

const TYPE_COLORS_SPELL = {
  Feuer:'#f97316', Blitz:'#a78bfa', Kälte:'#38bdf8', Eis:'#7dd3fc',
  Gift:'#4ade80', Säure:'#84cc16', Nekrotisch:'#818cf8', Psychisch:'#e879f9',
  Energie:'#fbbf24', Schall:'#fb923c', Strahlung:'#fde68a', Gleißend:'#fef08a',
  Heilig:'#fcd34d', Wucht:'#94a3b8', Stich:'#94a3b8', Hieb:'#94a3b8',
  Variabel:'#c084fc', Strahlend:'#fde68a',
};

/* ── SpellPicker Modal ──────────────────────────────────────────── */
function SpellPicker({ onAdd, onClose }) {
  const [q, setQ] = useApp('');
  const [filterKlasse, setFilterKlasse] = useApp('');
  const [mode, setMode] = useApp('alle');

  const allZauber = window.ZAUBER_DATA || [];

  const allDmg = React.useMemo(() => allZauber
    .filter(z => z.schaden && (z.rettungswurfAttribut || z.istAngriff))
    .sort((a, b) => a.name.localeCompare(b.name, 'de')), []);
  const allHeal = React.useMemo(() => allZauber
    .filter(z => isHealingSpell(z))
    .map(z => ({ ...z, _heilungsDice: extractHealingDice(z.beschreibung) }))
    .filter(z => z._heilungsDice)
    .sort((a, b) => a.name.localeCompare(b.name, 'de')), []);
  const allAll = React.useMemo(() => [...allZauber].sort((a, b) => a.name.localeCompare(b.name, 'de')), []);

  const base = mode === 'schaden' ? allDmg : mode === 'heilung' ? allHeal : allAll;

  const results = React.useMemo(() => {
    let list = base;
    if (filterKlasse) list = list.filter(z => z.klassen?.includes(filterKlasse));
    if (q.trim()) { const low = q.toLowerCase(); list = list.filter(z => z.name.toLowerCase().includes(low)); }
    return list.slice(0, 150);
  }, [q, filterKlasse, base, mode]);

  function handleAdd(z) {
    if (mode === 'heilung') {
      onAdd({ id: uid(), name: z.name, grad: z.grad, schule: z.schule,
        istHeilung: true, heilung: z._heilungsDice });
    } else if (mode === 'schaden') {
      onAdd({ id: uid(), name: z.name, grad: z.grad, schule: z.schule,
        istKampfzauber: true, schaden: z.schaden, schadenTyp: z.schadenTyp,
        istAngriff: z.istAngriff, rettungswurfAttribut: z.rettungswurfAttribut, halbiert: z.halbiert });
    } else {
      onAdd({ id: uid(), name: z.name, grad: z.grad, schule: z.schule });
    }
    onClose();
  }

  const overlayStyle = {
    position:'fixed',inset:0,zIndex:9000,background:'rgba(3,2,10,0.82)',
    display:'flex',alignItems:'center',justifyContent:'center',padding:16,backdropFilter:'blur(4px)',
  };
  const modalStyle = {
    background:'rgba(8,6,22,0.98)',border:'1px solid rgba(124,77,255,0.28)',borderRadius:6,
    width:'100%',maxWidth:560,maxHeight:'80vh',display:'flex',flexDirection:'column',boxShadow:'0 8px 40px rgba(0,0,0,0.7)',
  };
  const tabBtn = active => ({
    fontFamily:'var(--font-mono)',fontSize:9,letterSpacing:'.16em',textTransform:'uppercase',
    padding:'7px 14px',background:active?'rgba(124,77,255,0.18)':'transparent',
    border:'none',borderBottom:active?'2px solid rgba(124,77,255,0.7)':'2px solid transparent',
    cursor:'pointer',color:active?'rgba(200,190,240,0.9)':'rgba(160,140,255,0.4)',transition:'all .15s',
  });
  const rowStyle = {
    display:'flex',alignItems:'center',gap:10,padding:'8px 12px',cursor:'pointer',
    borderBottom:'1px solid rgba(124,77,255,0.06)',transition:'background .12s',
  };

  return (
    <div style={overlayStyle} onClick={e => e.target === e.currentTarget && onClose()}>
      <div style={modalStyle}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 16px',borderBottom:'1px solid rgba(124,77,255,0.12)'}}>
          <span style={{fontFamily:'var(--font-display)',fontSize:13,letterSpacing:'.2em',color:'var(--white)',textTransform:'uppercase'}}>Zauber hinzufügen</span>
          <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',color:'rgba(160,140,255,0.5)',fontSize:16}}>✕</button>
        </div>
        <div style={{display:'flex',borderBottom:'1px solid rgba(124,77,255,0.1)'}}>
          {[['alle','Alle'],['schaden','Schaden'],['heilung','Heilung']].map(([m,l]) => (
            <button key={m} style={tabBtn(mode===m)} onClick={()=>setMode(m)}>{l}</button>
          ))}
        </div>
        <div style={{padding:'10px 12px',display:'flex',gap:8}}>
          <input value={q} onChange={e=>setQ(e.target.value)} autoFocus
            placeholder="Zauber suchen…"
            style={{flex:1,fontFamily:'var(--font-body)',fontSize:12,background:'rgba(124,77,255,0.05)',
              border:'1px solid rgba(124,77,255,0.2)',borderRadius:3,padding:'6px 10px',
              color:'var(--white)',outline:'none'}} />
          <select value={filterKlasse} onChange={e=>setFilterKlasse(e.target.value)}
            style={{fontFamily:'var(--font-mono)',fontSize:9,background:'rgba(124,77,255,0.07)',
              border:'1px solid rgba(124,77,255,0.2)',borderRadius:3,padding:'6px 8px',
              color:'rgba(200,190,240,0.8)',outline:'none',flexShrink:0,width:130}}>
            <option value="">Alle Klassen</option>
            {KLASSEN_SPELL.map(k => <option key={k} value={k}>{k}</option>)}
          </select>
        </div>
        <div style={{fontSize:'0.65rem',color:'rgba(160,140,255,0.3)',padding:'0 12px 6px',fontFamily:'var(--font-mono)'}}>
          {results.length} Zauber
        </div>
        <div style={{overflowY:'auto',flex:1}}>
          {results.map(z => (
            <div key={z.name+z.grad} style={rowStyle}
              onMouseEnter={e=>e.currentTarget.style.background='rgba(124,77,255,0.07)'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}
              onClick={() => handleAdd(z)}>
              {mode === 'heilung'
                ? <div style={{width:26,height:26,borderRadius:'50%',background:'rgba(80,200,120,0.08)',border:'1px solid rgba(80,200,120,0.2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'0.7rem',flexShrink:0}}>💚</div>
                : <div style={{width:26,height:26,borderRadius:'50%',background:'rgba(160,140,255,0.06)',border:'1px solid rgba(160,140,255,0.12)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'0.58rem',color:TYPE_COLORS_SPELL[z.schadenTyp]||'rgba(160,140,255,0.4)',flexShrink:0,fontWeight:700}}>
                    {mode==='schaden' ? (z.schadenTyp||'?').substring(0,2) : (z.schule||'?').substring(0,2)}
                  </div>
              }
              <span style={{fontFamily:'var(--font-body)',fontSize:12.5,color:'var(--white)',flex:1}}>{z.name}</span>
              <span style={{fontFamily:'var(--font-mono)',fontSize:8.5,color:'rgba(160,140,255,0.4)',whiteSpace:'nowrap'}}>
                {mode==='heilung' ? `Grad ${z.grad} · ${z._heilungsDice} TP`
                  : mode==='schaden' ? `Grad ${z.grad} · ${z.schaden} · ${z.schadenTyp||'?'}`
                  : `Grad ${z.grad} · ${z.schule||'?'}`}
              </span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ── Zauber-Vorschau Modal ──────────────────────────────────────── */
function ZauberPreview({ zauberEntry, onClose }) {
  const fullSpell = React.useMemo(() => {
    const all = window.ZAUBER_DATA || [];
    return all.find(z => z.name === zauberEntry.name) || zauberEntry;
  }, [zauberEntry.name]);

  const gradLabels = ['Zaubertrick','1. Grad','2. Grad','3. Grad','4. Grad','5. Grad','6. Grad','7. Grad','8. Grad','9. Grad'];
  const gradLabel = gradLabels[fullSpell.grad] || `${fullSpell.grad}. Grad`;
  const kompMap = { V: 'Verbal', G: 'Gestisch', M: 'Material' };
  const komps = (fullSpell.komponenten || []).map(k => kompMap[k] || k).join(', ');

  const isHeil = zauberEntry.istHeilung;
  const typeColor = TYPE_COLORS_SPELL[fullSpell.schadenTyp] || 'rgba(160,140,255,0.6)';

  const metaItems = [
    { label: 'Zeitaufwand',   value: fullSpell.zeitaufwand },
    { label: 'Wirkungsdauer', value: fullSpell.wirkungsdauer },
    { label: 'Reichweite',    value: fullSpell.reichweite },
    { label: 'Komponenten',   value: komps || null },
  ].filter(x => x.value);

  return (
    <div style={{position:'fixed',inset:0,zIndex:9100,background:'rgba(3,2,10,0.85)',
      display:'flex',alignItems:'center',justifyContent:'center',padding:16,backdropFilter:'blur(4px)'}}
      onClick={e => e.target === e.currentTarget && onClose()}>
      <div style={{background:'rgba(8,6,22,0.98)',border:'1px solid rgba(124,77,255,0.28)',borderRadius:6,
        width:'100%',maxWidth:520,maxHeight:'85vh',display:'flex',flexDirection:'column',
        boxShadow:'0 8px 40px rgba(0,0,0,0.7)'}}>

        {/* Kopf */}
        <div style={{padding:'16px 18px 14px',borderBottom:'1px solid rgba(124,77,255,0.12)',flexShrink:0,
          display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12}}>
          <div>
            <div style={{fontFamily:'var(--font-display)',fontSize:16,letterSpacing:'.18em',
              color:'var(--white)',textTransform:'uppercase',marginBottom:5}}>{fullSpell.name}</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
              <span style={{fontFamily:'var(--font-mono)',fontSize:8,letterSpacing:'.12em',
                padding:'2px 8px',background:'rgba(124,77,255,0.08)',border:'1px solid rgba(124,77,255,0.18)',
                borderRadius:2,color:'rgba(160,140,255,0.65)'}}>{gradLabel}</span>
              {fullSpell.schule && (
                <span style={{fontFamily:'var(--font-mono)',fontSize:8,letterSpacing:'.12em',
                  padding:'2px 8px',background:'rgba(124,77,255,0.08)',border:'1px solid rgba(124,77,255,0.18)',
                  borderRadius:2,color:'rgba(160,140,255,0.65)'}}>{fullSpell.schule}</span>
              )}
              {fullSpell.ritual && (
                <span style={{fontFamily:'var(--font-mono)',fontSize:8,letterSpacing:'.12em',
                  padding:'2px 8px',background:'rgba(94,232,208,0.06)',border:'1px solid rgba(94,232,208,0.2)',
                  borderRadius:2,color:'rgba(94,232,208,0.6)'}}>Ritual</span>
              )}
              {fullSpell.konzentration && (
                <span style={{fontFamily:'var(--font-mono)',fontSize:8,letterSpacing:'.12em',
                  padding:'2px 8px',background:'rgba(251,191,36,0.06)',border:'1px solid rgba(251,191,36,0.2)',
                  borderRadius:2,color:'rgba(251,191,36,0.6)'}}>Konzentration</span>
              )}
            </div>
          </div>
          <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',
            color:'rgba(160,140,255,0.4)',fontSize:16,flexShrink:0,padding:'2px 4px',lineHeight:1,
            transition:'color .12s'}}
            onMouseEnter={e=>e.currentTarget.style.color='rgba(200,190,240,0.8)'}
            onMouseLeave={e=>e.currentTarget.style.color='rgba(160,140,255,0.4)'}>✕</button>
        </div>

        {/* Body */}
        <div style={{overflowY:'auto',flex:1,padding:'14px 18px'}}>

          {/* Meta-Grid */}
          {metaItems.length > 0 && (
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginBottom:14}}>
              {metaItems.map(({label, value}) => (
                <div key={label} style={{background:'rgba(124,77,255,0.04)',border:'1px solid rgba(124,77,255,0.1)',
                  borderRadius:3,padding:'8px 10px'}}>
                  <div style={{fontFamily:'var(--font-mono)',fontSize:7.5,letterSpacing:'.2em',
                    color:'rgba(124,77,255,0.4)',textTransform:'uppercase',marginBottom:3}}>{label}</div>
                  <div style={{fontFamily:'var(--font-body)',fontSize:11.5,color:'var(--white)',fontWeight:300}}>{value}</div>
                </div>
              ))}
            </div>
          )}

          {/* Material */}
          {fullSpell.material && (
            <div style={{fontFamily:'var(--font-mono)',fontSize:8.5,color:'rgba(160,140,255,0.4)',
              marginBottom:12,fontStyle:'italic'}}>Material: {fullSpell.material}</div>
          )}

          {/* Kampfinfo-Chips */}
          {(fullSpell.schaden || fullSpell.rettungswurfAttribut || fullSpell.istAngriff) && (
            <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap'}}>
              {fullSpell.schaden && (
                <span style={{fontFamily:'var(--font-mono)',fontSize:9,letterSpacing:'.1em',padding:'4px 10px',
                  background:'rgba(249,115,22,0.07)',border:'1px solid rgba(249,115,22,0.22)',
                  borderRadius:3,color:typeColor}}>{fullSpell.schaden} {fullSpell.schadenTyp||'Schaden'}</span>
              )}
              {fullSpell.rettungswurfAttribut && (
                <span style={{fontFamily:'var(--font-mono)',fontSize:9,letterSpacing:'.1em',padding:'4px 10px',

async function loadCharacters() {
  const { data } = await window._sb.from('characters').select('*').order('created_at');
  return (data || []).map(row => ({
    id: row.id,
    name: row.name,
    race: row.race,
    class: row.class,
    division: row.division,
    type: row.type || 'spieler',
    _char: row.char_data && Object.keys(row.char_data).length > 0 ? row.char_data : null,
  }));
}

function charFromEntry(entry) {
  const d = entry._char;
  // If fully built (has 'hp'), use directly; draft or missing → build from fields
  if (d && d.hp !== undefined) return { ...d };
  return buildChar(d || entry);
}

let _saveTimer = null;
function saveCharToDB(id, char) {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(async () => {
    try {
      await window._sb.from('characters').update({
        name: char.name || 'Unbenannt',
        race: char.race || null,
        class: char.class || null,
        division: char.division || null,
        char_data: char,
      }).eq('id', id);
    } catch(e) { console.error('saveCharToDB failed:', e); }
  }, 500);
}

async function deleteChar(id) {
  await window._sb.from('characters').delete().eq('id', id);
}

function exportChars(chars, filename) {
  const blob = new Blob([JSON.stringify(chars, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename || 'meruria-charaktere.json';
  a.click();
  URL.revokeObjectURL(url);
}

async function importCharsFromFile(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = async e => {
      try {
        const data = JSON.parse(e.target.result);
        if (!Array.isArray(data)) { resolve(); return; }
        const inserts = data.map(c => {
          const char = c._char || c;
          return {
            name: char.name || c.name || 'Importiert',
            race: char.race || c.race || null,
            class: char.class || c.class || null,
            division: char.division || c.division || null,
            char_data: char,
          };
        });
        await window._sb.from('characters').insert(inserts);
        resolve();
      } catch(err) { console.error(err); resolve(); }
    };
    reader.readAsText(file);
  });
}

}

/* ── Editable Personality ────────────────── */
function EditablePersonality({ char, upd, taStyle }) {
  const items = [{l:"Merkmale",f:"personality"},{l:"Ideale",f:"ideals"},{l:"Bindungen",f:"bonds"},{l:"Makel",f:"flaws"}];
  return (
    <Card>
      <SecTitle label="Persönlichkeit" />
      {items.map(({l,f})=>(
        <div key={f} style={{marginBottom:10}}>
          <div style={{fontFamily:"var(--font-mono)",fontSize:7.5,letterSpacing:".22em",color:"rgba(124,77,255,0.5)",textTransform:"uppercase",marginBottom:4}}>{l}</div>
          <textarea value={char[f]||''} onChange={e=>upd({[f]:e.target.value})} style={taStyle} />
        </div>
      ))}
    </Card>
  );
}

/* ── Steckbrief-Ansicht ────────────────────── */
function SteckbriefView({ entry, onBack, hasMultiple }) {
  const [char, setChar] = useApp(() => charFromEntry(entry));
  const [editing, setEditing] = useApp(false);
  const [tweaks,setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [zauber, setZauber] = useApp(() => (entry._char && Array.isArray(entry._char.zauber)) ? entry._char.zauber : []);
  const charRef = useRef(char);
  charRef.current = char;
  const zauberRef = useRef(zauber);
  zauberRef.current = zauber;

  function upd(updates) {
    const next = { ...charRef.current, ...updates };
    setChar(next);
    saveCharToDB(entry.id, { ...next, zauber: zauberRef.current });
  }

  function updZauber(newZauber) {
    setZauber(newZauber);
    saveCharToDB(entry.id, { ...charRef.current, zauber: newZauber });
  }
  function updStat(key, val) {
    const v = Math.max(1, Math.min(30, parseInt(val)||1));
    upd({ stats: { ...char.stats, [key]: v } });
  }
  function updFb(i, antwort) {
    upd({ freundebuch: char.freundebuch.map((x,j)=>j===i?{...x,antwort}:x) });
  }

  const taStyle = {
    fontFamily:"var(--font-body)",fontSize:12,fontWeight:300,color:"var(--silver)",lineHeight:1.75,
    background:"rgba(124,77,255,0.04)",border:"1px solid rgba(124,77,255,0.2)",borderRadius:2,
    padding:"7px 9px",width:"100%",resize:"vertical",outline:"none",minHeight:58,boxSizing:"border-box",
  };

  const E = editing;

  return (
    <div style={{minHeight:"100vh",paddingTop:"var(--nav-h)"}}>
      <SiteNav />
      <TweaksPanel tweaks={tweaks} setTweak={setTweak}>
        <TweakSection label="Sektionen">
          <TweakToggle id="showZauber"      label="Zauber anzeigen" />
          <TweakToggle id="showCompanions"  label="Begleiter anzeigen" />
          <TweakToggle id="showQuests"      label="Quests anzeigen" />
          <TweakToggle id="showKontakte"    label="Kontakte anzeigen" />
          <TweakToggle id="showWissenswertes" label="Wissenswertes anzeigen" />
        </TweakSection>
      </TweaksPanel>

      {/* ── Seiten-Kopf ────────────────────── */}
      <div style={{padding:"18px 28px 15px",borderBottom:"1px solid rgba(124,77,255,0.1)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            {hasMultiple && (
              <button onClick={onBack} style={{fontFamily:"var(--font-mono)",fontSize:8,letterSpacing:".18em",
                color:"rgba(124,77,255,0.5)",background:"transparent",border:"none",cursor:"pointer",padding:0,
                textTransform:"uppercase",transition:"color .15s"}}
                onMouseEnter={e=>e.currentTarget.style.color="rgba(160,140,255,0.85)"}
                onMouseLeave={e=>e.currentTarget.style.color="rgba(124,77,255,0.5)"}>
                ← Auswahl
              </button>
            )}
            <div style={{fontFamily:"var(--font-mono)",fontSize:9,letterSpacing:".3em",color:"rgba(124,77,255,0.5)",textTransform:"uppercase"}}>
              Meruria · Charaktere
            </div>
          </div>
          <button onClick={()=>setEditing(!E)}
            style={{fontFamily:"var(--font-mono)",fontSize:8,letterSpacing:".18em",textTransform:"uppercase",
              padding:"5px 14px",background:E?"rgba(124,77,255,0.22)":"transparent",
              border:`1px solid rgba(124,77,255,${E?0.6:0.3})`,borderRadius:3,cursor:"pointer",
              color:E?"rgba(200,190,240,0.95)":"rgba(124,77,255,0.55)",transition:"all .18s"}}
            onMouseEnter={e=>{e.currentTarget.style.borderColor="rgba(124,77,255,0.7)";e.currentTarget.style.color="rgba(200,190,240,0.9)";}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor=E?"rgba(124,77,255,0.6)":"rgba(124,77,255,0.3)";e.currentTarget.style.color=E?"rgba(200,190,240,0.95)":"rgba(124,77,255,0.55)";}}>
            {E ? "✓ Fertig" : "✎ Bearbeiten"}
          </button>
        </div>
        <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
          <div style={{flex:1}}>
            {E
              ? <input value={char.name||''} onChange={e=>upd({name:e.target.value})}
                  style={{fontFamily:"var(--font-display)",fontWeight:400,fontSize:28,letterSpacing:".22em",
                    color:"var(--white)",textTransform:"uppercase",background:"transparent",border:"none",
                    borderBottom:"1px solid rgba(124,77,255,0.4)",outline:"none",padding:"0 4px",width:"100%"}} />
              : <h1 style={{fontFamily:"var(--font-display)",fontWeight:400,fontSize:28,letterSpacing:".22em",
                    color:"var(--white)",textTransform:"uppercase",textShadow:"0 0 32px rgba(124,77,255,0.2)"}}>{char.name}</h1>
            }
            <div style={{display:"flex",gap:6,marginTop:8,flexWrap:"wrap"}}>
              {[`${char.class} · ${char.subclass}`,`Stufe ${char.level}`,char.race,char.background,`${char.division} · ${char.rank} ${["I","II","III","IV","V"][char.rankLevel-1]}`]
                .map((t,i)=>(
                  <span key={i} style={{fontFamily:"var(--font-mono)",fontSize:8.5,padding:"2px 9px",
                    background:"rgba(124,77,255,0.1)",border:"1px solid rgba(124,77,255,0.28)",borderRadius:2,
                    color:"rgba(200,190,240,0.82)",letterSpacing:".1em"}}>{t}</span>
                ))}
            </div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontFamily:"var(--font-mono)",fontSize:7.5,letterSpacing:".2em",color:"rgba(124,77,255,0.35)",textTransform:"uppercase",marginBottom:2}}>Erfahrungspunkte</div>
            <div style={{fontFamily:"var(--font-mono)",fontSize:22,color:"rgba(124,77,255,0.65)"}}>{char.xp.toLocaleString("de-DE")}</div>
          </div>
        </div>
        <div style={{marginTop:10,width:36,height:1,background:"rgba(124,77,255,0.55)"}} />
      </div>

      {/* ── 3-Spalten-Grid ────────────────── */}
      <div style={{display:"grid",gridTemplateColumns:"220px 1fr 290px",gap:14,padding:"16px 22px 0",alignItems:"start"}}>

        {/* LINKS */}
        <div style={{display:"flex",flexDirection:"column",gap:11}}>
          <Card>
            <SecTitle label="Identität" />
            {E ? <>
              <ERow label="Volk"        field="race"        char={char} upd={upd} bright />
              <ERow label="Klasse"      field="class"       char={char} upd={upd} bright />
              <ERow label="Subklasse"   field="subclass"    char={char} upd={upd} />
              <ERow label="Hintergrund" field="background"  char={char} upd={upd} />
              <ERow label="Gesinnung"   field="alignment"   char={char} upd={upd} bright />
              <ERow label="Geschlecht"  field="gender"      char={char} upd={upd} />
              <ERow label="Herkunft"    field="birthplace"  char={char} upd={upd} />
            </> : <>
              <IRow label="Volk"        value={char.race}        bright />
              <IRow label="Klasse"      value={char.class}       bright />
              <IRow label="Subklasse"   value={char.subclass} />
              <IRow label="Hintergrund" value={char.background} />
              <IRow label="Gesinnung"   value={char.alignment}   bright />
              <IRow label="Geschlecht"  value={char.gender} />
              <IRow label="Herkunft"    value={char.birthplace} />
            </>}
          </Card>
          <Card>
            <SecTitle label="Persönliche Daten" />
            {E ? <>
              <ERow label="Geburtstag"   field="birthday"    char={char} upd={upd} />
              <ERow label="Sternzeichen" field="zodiac"      char={char} upd={upd} bright />
              <ERow label="Alter"        field="age"         char={char} upd={upd} />
              <ERow label="Größe"        field="height"      char={char} upd={upd} />
              <ERow label="Gewicht"      field="weight"      char={char} upd={upd} />
              <ERow label="Augen"        field="eyes"        char={char} upd={upd} />
              <ERow label="Haare"        field="hair"        char={char} upd={upd} />
              <ERow label="Haut"         field="skin"        char={char} upd={upd} />
            </> : <>
              <IRow label="Geburtstag"   value={char.birthday} />
              <IRow label="Sternzeichen" value={char.zodiac}  bright />
              <IRow label="Alter"        value={`${char.age} Jahre`} />
              <IRow label="Größe"        value={char.height} />
              <IRow label="Gewicht"      value={char.weight} />
              <IRow label="Augen"        value={char.eyes} />
              <IRow label="Haare"        value={char.hair} />
              <IRow label="Haut"         value={char.skin} />
            </>}
          </Card>
          <DivisionRank char={char} />
          <DeityCard     char={char} />
          <CombatCompact char={char} />
        </div>

        {/* MITTE */}
        <div style={{display:"flex",flexDirection:"column",gap:11}}>
          <Card style={{position:"relative"}}>
            <Corners op={0.28} />
            <SecTitle label="Über mich" />
            {E
              ? <textarea value={char.story||''} onChange={e=>upd({story:e.target.value})} style={{...taStyle,minHeight:120,fontStyle:"normal"}} />
              : <p style={{fontFamily:"var(--font-body)",fontSize:13,fontWeight:300,color:"var(--silver)",lineHeight:1.9,textWrap:"pretty"}}>{char.story}</p>
            }
          </Card>
          <div style={{background:"var(--card-bg)",borderLeft:"2px solid rgba(124,77,255,0.5)",
            border:"1px solid rgba(124,77,255,0.2)",borderLeftWidth:3,
            borderRadius:"0 4px 4px 0",padding:"13px 14px",position:"relative"}}>
            <SecTitle label="Meine ersten Tage auf Meruria" />
            {E
              ? <textarea value={char.ersteTage||''} onChange={e=>upd({ersteTage:e.target.value})} style={{...taStyle,fontStyle:"italic"}} />
              : <p style={{fontFamily:"var(--font-body)",fontSize:12.5,fontWeight:300,color:"var(--silver)",lineHeight:1.88,textWrap:"pretty",fontStyle:"italic"}}>„{char.ersteTage}"</p>
            }
          </div>
          {E ? <EditableStatsGrid char={char} updStat={updStat} /> : <AttributeGrid char={char} />}
          <SkillPills char={char} />
          {tweaks.showCompanions && char.companions && char.companions.length > 0 && (
            <div>
              <div style={{fontFamily:"var(--font-mono)",fontSize:8,letterSpacing:".28em",color:"rgba(124,77,255,0.45)",textTransform:"uppercase",marginBottom:8}}>Begleiter</div>
              <div style={{width:24,height:1,background:"linear-gradient(90deg,rgba(124,77,255,0.65),transparent)",marginBottom:10}} />
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {char.companions.map(comp=><CompanionCard key={comp.id} comp={comp}/>)}
              </div>
            </div>
          )}
        </div>

        {/* RECHTS */}
        <div style={{display:"flex",flexDirection:"column",gap:11}}>
          <div style={{position:"relative",borderRadius:4,overflow:"hidden",border:"1px solid rgba(124,77,255,0.38)"}}>
            <Corners op={0.58} sz={18} />
            <ImageSlot slotId={`${entry.id}-portrait`} label="Charakter-Portrait" height={310} hue={270} portrait />
          </div>
          {E ? <EditablePersonality char={char} upd={upd} taStyle={taStyle} /> : <PersonalitySection char={char} />}
        </div>
      </div>

      {/* ── Zauber ──────────────────────────── */}
      {tweaks.showZauber && (
        <div style={{padding:"22px 22px 8px"}}>
          <ZauberSection zauber={zauber} updZauber={updZauber} editing={E} />
        </div>
      )}

      {/* ── Quests ──────────────────────────── */}
      {tweaks.showQuests && char.quests && char.quests.length > 0 && (
        <div style={{padding:"22px 22px 8px"}}>
          <Divider label="Erledigte Quests" />
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:12}}>
            {char.quests.map((q,i)=><QuestCard key={i} quest={q}/>)}
          </div>
        </div>
      )}

      {/* ── Kontakte ────────────────────────── */}
      {tweaks.showKontakte && char.contacts && char.contacts.length > 0 && (
        <div style={{padding:"22px 22px 8px"}}>
          <Divider label="Kontakte" />
          <KontakteTablet char={char} />
        </div>
      )}

      {/* ── Wissenswertes ───────────────────── */}
      {tweaks.showWissenswertes && char.freundebuch && char.freundebuch.length > 0 && (
        <div style={{padding:"22px 22px 24px"}}>
          <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",gap:20,marginBottom:20,flexWrap:"wrap"}}>
            <div>
              <div style={{fontFamily:"var(--font-mono)",fontSize:9,letterSpacing:".28em",color:"rgba(124,77,255,0.45)",textTransform:"uppercase",marginBottom:4}}>Wissenswertes</div>
              <div style={{width:28,height:1,background:"linear-gradient(90deg,rgba(124,77,255,0.65),transparent)"}} />
            </div>
            <p style={{fontFamily:"var(--font-body)",fontSize:12,fontWeight:300,fontStyle:"italic",
              color:"rgba(190,182,225,0.45)",flex:1,minWidth:220,textAlign:"right"}}>
              Was mich ausmacht — in meinen eigenen Worten.
            </p>
          </div>
          {E
            ? <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:8}}>
                {char.freundebuch.map((item,i)=>(
                  <div key={i} style={{background:"var(--card-bg)",border:"1px solid rgba(124,77,255,0.2)",borderRadius:4,padding:"14px 16px"}}>
                    <div style={{fontFamily:"var(--font-mono)",fontSize:8,letterSpacing:".2em",color:"rgba(124,77,255,0.5)",textTransform:"uppercase",marginBottom:8}}>{item.frage}</div>
                    <input value={item.antwort||''} onChange={e=>updFb(i,e.target.value)}
                      style={{fontFamily:"var(--font-body)",fontSize:12.5,fontWeight:300,color:"var(--white)",
                        background:"transparent",border:"none",borderBottom:"1px solid rgba(124,77,255,0.28)",
                        padding:"2px 4px",width:"100%",outline:"none"}} />
                  </div>
                ))}
              </div>
            : <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:12}}>
                {char.freundebuch.map((item,i)=><FbCard key={i} item={item} index={i}/>)}
              </div>
          }
        </div>
      )}

      {/* ── Footer ──────────────────────────── */}
      <div style={{borderTop:"1px solid rgba(124,77,255,0.07)",margin:"22px 0 0",padding:"13px 28px",display:"flex",justifyContent:"space-between"}}>
        <span style={{fontFamily:"var(--font-mono)",fontSize:9,color:"rgba(124,77,255,0.26)",letterSpacing:".1em"}}>Meruria — Mein Charakter</span>
        <span style={{fontFamily:"var(--font-mono)",fontSize:8,color:"rgba(124,77,255,0.2)"}}>D&amp;D 5e · {char.race} {char.class} Stufe {char.level}</span>
      </div>
    </div>
  );
}

/* ── Haupt-App ─────────────────────────────── */
function App() {
  const [chars, setChars] = useApp([]);
  const [loading, setLoading] = useApp(true);
  const [entry, setEntry] = useApp(null);

  async function reload() {
    setLoading(true);
    const list = await loadCharacters();
    setChars(list);
    setLoading(false);
  }

  React.useEffect(() => { reload(); }, []);

  async function handleBack() {
    setEntry(null);
    await reload();
  }

  if (loading) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <span style={{fontFamily:"var(--font-mono)",fontSize:9,letterSpacing:".3em",color:"rgba(124,77,255,0.4)",textTransform:"uppercase"}}>
        Lade Charaktere…
      </span>
    </div>
  );
  if (chars.length === 0) return <EmptyState />;
  if (entry) return <SteckbriefView entry={entry} onBack={handleBack} hasMultiple={chars.length > 1} />;

  return (
    <CharSelection
      chars={chars}
      onSelect={e => setEntry(e)}
      onNew={() => { window.location.href = 'Neuer_Charakter.html'; }}
      onReload={reload}
    />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <SiteGate><App /></SiteGate>
);
</script>
