function hexPts(s){const c=s/2,pts=[];for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);pts.push(`${c+c*Math.cos(a)},${c+c*Math.sin(a)}`);}return pts.join(' ');}
function Oct({size=8,color='rgba(124,77,255,0.6)',fill='rgba(124,77,255,0.2)',sw=1,style={}}){return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:'block',flexShrink:0,...style}}><polygon points={hexPts(size)} fill={fill} stroke={color} strokeWidth={sw}/></svg>;}

function useReveal(dep){
  useEffect(()=>{
    const obs=new IntersectionObserver(entries=>{
      entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target);}});
    },{threshold:0.08});
    document.querySelectorAll('.reveal-up,.reveal-left').forEach(el=>{el.classList.remove('visible');obs.observe(el);});
    return ()=>obs.disconnect();
  },[dep]);
}

function HungerCalc(){
  const[str,setStr]=useState(10),[kon,setKon]=useState(10),[size,setSize]=useState('m'),[cond,setCond]=useState('n'),[ex,setEx]=useState(1);
  const sm={k:0.5,m:1,g:4};
  let cm=1;if(cond==='h')cm=2;else if(cond==='v')cm=-1;else if(cond==='e')cm=1+0.1125*ex;
  const res=Math.round((str+kon)*sm[size]*cm),neg=res<0;
  const inp={background:'rgba(124,77,255,0.07)',border:'1px solid rgba(124,77,255,0.22)',borderRadius:'3px',color:'var(--white)',fontFamily:'var(--font-mono)',fontSize:'14px',padding:'5px 8px',width:'62px',textAlign:'center',outline:'none'};

  const lbl={fontFamily:'var(--font-mono)',fontSize:'8px',letterSpacing:'0.18em',color:'rgba(124,77,255,0.55)',textTransform:'uppercase',display:'block',marginBottom:'4px'};
  return(
    <div  style={{border:'1px solid rgba(124,77,255,0.2)',borderRadius:'3px',padding:'18px 20px',background:'rgba(10,8,28,0.7)',marginTop:'14px'}}>
      <div style={{fontFamily:'var(--font-mono)',fontSize:'8px',letterSpacing:'0.26em',color:'rgba(124,77,255,0.45)',textTransform:'uppercase',marginBottom:'13px'}}>Interaktiver Hunger-Rechner</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(100px,1fr))',gap:'12px',marginBottom:'15px'}}>
        <div><label style={lbl}>Stärke</label><input type="number" min="1" max="30" value={str} onChange={e=>setStr(+e.target.value)} style={inp}/></div>
        <div><label style={lbl}>Konstitution</label><input type="number" min="1" max="30" value={kon} onChange={e=>setKon(+e.target.value)} style={inp}/></div>
        <div><label style={lbl}>Größe</label><select value={size} onChange={e=>setSize(e.target.value)} style={sel}><option value="k">Klein ×0,5</option><option value="m">Mittelgroß ×1</option><option value="g">Groß ×4</option></select></div>
        <div><label style={lbl}>Zustand</label><select value={cond} onChange={e=>setCond(e.target.value)} style={sel}><option value="n">Normal</option><option value="h">Ext. Kälte ×2</option><option value="v">Vergiftet −1</option><option value="e">Erschöpft</option></select></div>
        {cond==='e'&&<div><label style={lbl}>Erschöpf.-Stufe</label><input type="number" min="1" max="6" value={ex} onChange={e=>setEx(+e.target.value)} style={inp}/></div>}
      </div>
      <div style={{borderTop:'1px solid rgba(124,77,255,0.12)',paddingTop:'13px',display:'flex',alignItems:'center',gap:'18px',flexWrap:'wrap'}}>
        <div>
          <div style={{fontFamily:'var(--font-mono)',fontSize:'8px',letterSpacing:'0.22em',color:'rgba(124,77,255,0.45)',textTransform:'uppercase',marginBottom:'3px'}}>Hunger-Wert</div>
          <div style={{fontFamily:'var(--font-display)',fontSize:'32px',fontWeight:'300',color:neg?'rgba(255,100,100,0.85)':'var(--white)',textShadow:neg?'none':'0 0 24px rgba(124,77,255,0.35)'}}>{res}</div>
        </div>
        <div style={{fontFamily:'var(--font-body)',fontWeight:'300',fontSize:'11px',color:'rgba(200,190,240,0.3)',fontStyle:'italic'}}>= ({str}+{kon}) × {sm[size]}{cond==='h'?' × 2':cond==='v'?' × (−1)':cond==='e'?` × ${(1+0.1125*ex).toFixed(3)}`:''}</div>

  );
}

// ── COIN FLIP ─────────────────────────────────────────────────────────────────

function CoinFlip(){
  const [result, setResult] = useState(null);
  const [flipping, setFlipping] = useState(false);
  const [angle, setAngle] = useState(0);
  const baseAngle = useRef(0);

  const flip = () => {
    if (flipping) return;
    setFlipping(true);
    setResult(null);
    const r = Math.random() < 0.5 ? 'kopf' : 'zahl';
    const spins = (6 + Math.floor(Math.random() * 4)) * 360;
    const landing = r === 'kopf' ? 0 : 180;
    const currentMod = ((baseAngle.current % 360) + 360) % 360;
    const diff = ((landing - currentMod) + 360) % 360;
    const newAngle = baseAngle.current + spins + diff;
    baseAngle.current = newAngle;
    setAngle(newAngle);
    setTimeout(() => { setResult(r); setFlipping(false); }, 1500);
  };

  const ticks = Array.from({length:48}).map((_,i) => {
    const a = (i/48)*Math.PI*2 - Math.PI/2;
    return <line key={i} x1={100+87*Math.cos(a)} y1={100+87*Math.sin(a)} x2={100+93*Math.cos(a)} y2={100+93*Math.sin(a)} stroke="rgba(80,52,0,0.55)" strokeWidth="1.5"/>;
  });

  return (
    <div style={{background:'rgba(210,160,20,0.07)',border:'1px solid rgba(210,160,20,0.22)',borderRadius:'8px',padding:'28px 20px 24px',marginBottom:'24px',textAlign:'center'}}>
      <div style={{fontFamily:'var(--font-mono)',fontSize:'8px',letterSpacing:'0.3em',color:'rgba(210,160,40,0.55)',textTransform:'uppercase',marginBottom:'22px'}}>Wirf eine Münze</div>

      {/* 3D Coin */}
      <div style={{perspective:'800px',width:'200px',height:'200px',margin:'0 auto 20px'}}>
        <div style={{
          width:'100%', height:'100%', position:'relative',
          transformStyle:'preserve-3d',
          transform:`rotateY(${angle}deg)`,
          transition: flipping ? 'transform 1.5s cubic-bezier(0.2,0.75,0.45,1.0)' : 'none',
          filter:'drop-shadow(0 6px 20px rgba(200,150,10,0.45))'
        }}>
          {/* KOPF */}
          <div style={{position:'absolute',inset:0,backfaceVisibility:'hidden',WebkitBackfaceVisibility:'hidden'}}>
            <svg viewBox="0 0 200 200" style={{width:'100%',height:'100%'}}>
              <defs>
                <radialGradient id="cgk" cx="38%" cy="32%">
                  <stop offset="0%" stopColor="#f8d870"/>
                  <stop offset="55%" stopColor="#d4a018"/>
                  <stop offset="100%" stopColor="#8a6008"/>
                </radialGradient>
              </defs>
              <circle cx="100" cy="100" r="98" fill="#6a4806"/>
              <circle cx="100" cy="100" r="94" fill="url(#cgk)"/>
              {ticks}
              <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(80,52,0,0.35)" strokeWidth="1"/>
              {/* Head silhouette */}
              <ellipse cx="108" cy="76" rx="23" ry="28" fill="rgba(80,50,5,0.75)"/>
              <ellipse cx="100" cy="108" rx="15" ry="9" fill="rgba(80,50,5,0.75)"/>
              <rect x="79" y="108" width="34" height="12" rx="5" fill="rgba(80,50,5,0.75)"/>

// ── MUNITION ROLLER ───────────────────────────────────────────────────────────

function MunitionRoller(){
  const[roll,setRoll]=useState(null),[rolling,setRolling]=useState(false),[disp,setDisp]=useState(null);
  const doRoll=()=>{
    if(rolling)return;
    setRolling(true);setRoll(null);setDisp(null);
    let c=0;const iv=setInterval(()=>{setDisp(Math.floor(Math.random()*20)+1);c++;if(c>12){clearInterval(iv);const r=Math.floor(Math.random()*20)+1;setRoll(r);setDisp(r);setRolling(false);}},55);
  };
  const active=roll?MUNI_RANGES.find(r=>roll>=r.min&&roll<=r.max):null;
  return(
    <div>
      <div style={{display:'flex',alignItems:'center',gap:'14px',marginBottom:'14px',flexWrap:'wrap'}}>
        <button onClick={doRoll} disabled={rolling} style={{display:'inline-flex',alignItems:'center',gap:'9px',padding:'9px 18px',background:'rgba(124,77,255,0.14)',border:'1px solid rgba(124,77,255,0.4)',borderRadius:'3px',color:'rgba(160,140,255,0.9)',fontFamily:'var(--font-display)',fontSize:'11px',letterSpacing:'0.14em',textTransform:'uppercase',cursor:rolling?'wait':'pointer',transition:'all 0.2s'}}
          onMouseEnter={e=>{if(!rolling){e.currentTarget.style.background='rgba(124,77,255,0.24)';e.currentTarget.style.color='#f0eeff';}}} onMouseLeave={e=>{e.currentTarget.style.background='rgba(124,77,255,0.14)';e.currentTarget.style.color='rgba(160,140,255,0.9)';}}>
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="1.5" style={{animation:rolling?'diceRoll 0.3s linear infinite':'none',transformOrigin:'center'}}>
            <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/>
          </svg>
          1W20 Würfeln
        </button>
        {disp&&(
          <div style={{display:'flex',alignItems:'center',gap:'10px',animation:roll&&!rolling?'resultPop 0.3s ease forwards':'none'}}>
            <span style={{fontFamily:'var(--font-mono)',fontSize:'8px',color:'rgba(124,77,255,0.5)',letterSpacing:'0.2em'}}>ERGEBNIS</span>
            <span style={{fontFamily:'var(--font-display)',fontSize:'24px',fontWeight:'300',color:'var(--white)',textShadow:'0 0 20px rgba(124,77,255,0.5)'}}>{disp}</span>
            {active&&!rolling&&<span style={{fontFamily:'var(--font-body)',fontWeight:'300',fontSize:'12px',color:'rgba(160,140,255,0.85)'}}>{active.pct}% Munition</span>}
          </div>
        )}
      </div>
      <TW>
        <table className="eq-table">
          <thead><tr><th>1W20</th><th>Menge der Munition (abgerundet)</th></tr></thead>
          <tbody>
            {MUNI_RANGES.map(row=>(
              <tr key={row.range} style={{background:active&&active.min===row.min?'rgba(124,77,255,0.18)':'transparent',transition:'background 0.3s'}}>
                <td style={{fontFamily:'var(--font-mono)',fontSize:'11px',color:active&&active.min===row.min?'#f0eeff':'rgba(180,165,255,0.85)'}}>{row.range}</td>
                <td style={{color:active&&active.min===row.min?'rgba(220,210,255,0.95)':undefined}}>{row.label}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </TW>
    </div>
  );
}

  <div>
    <SH mono="Regelwerk" title="Furcht & Stress"/>
    <div ><div className="ref">Van Richtens Ratgeber zu Ravenloft, S. 195</div></div>
    <Txt c="Die Auswirkungen grausiger Erlebnisse reichen von unmittelbaren Schocks bis zu dauerhaften traumatischen Echos."/>
    <SubH>Samen der Furcht</SubH>
    <Txt c={<>Spieler können bei der Charaktererstellung bis zu <Acc c="zwei Samen der Furcht"/> wählen. Diese können sich im Spielverlauf verändern.</>}/>
    <div ><CoinFlip/></div>
    <div  style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'5px',margin:'16px 0 24px'}}>
      {FEAR_SEEDS.map((s,i)=>(
        <div key={i} style={{display:'flex',gap:'9px',padding:'8px 12px',background:'rgba(124,77,255,0.04)',border:'1px solid rgba(124,77,255,0.1)',borderRadius:'3px',transition:'border-color 0.15s',alignItems:'flex-start'}} onMouseEnter={e=>e.currentTarget.style.borderColor='rgba(124,77,255,0.32)'} onMouseLeave={e=>e.currentTarget.style.borderColor='rgba(124,77,255,0.1)'}>
          <span style={{fontFamily:'var(--font-mono)',fontSize:'8px',color:'rgba(124,77,255,0.42)',minWidth:'17px',paddingTop:'2px',flexShrink:0}}>{i+1}</span>
          <span style={{fontFamily:'var(--font-body)',fontWeight:'300',fontSize:'11px',fontStyle:'italic',color:'rgba(200,190,240,0.6)',lineHeight:'1.5'}}>{s}</span>
        </div>
      ))}
    </div>
    <SubH>Furcht</SubH>
    <Txt c={<><Acc c="WEI-Rettungswürfe gegen Verängstigung"/> können ausgelöst werden durch:</>}/>
    {['Den eigenen Samen der Furcht zu begegnen.','Einen Gegner, der immun gegen alle Angriffe und Zauber des Charakters ist.','Einen Gegner, der zeigt, dass er die TP des Charakters mit einem Hieb auf 0 bringen kann.','Eine Kreatur, die so fremd oder monströs ist, dass der Charakter sie sich nicht hätte vorstellen können.','Ein Objekt, das das Realitätsverständnis des Charakters beeinträchtigt.',].map(t=><div key={t} className="feat reveal-up" style={{marginBottom:'6px'}}><div className="feat-text">{t}</div></div>)}
    <SubH>Stress</SubH>
    <Txt c={<>Stress wird als nummerischer <Acc c="Stresswert"/> verfolgt und bei Würfen als <Bad c="Malus"/> abgezogen. Ein ganzer Ruhetag senkt den Stresswert um <Acc c="1"/>. Stress steigt durch:</>}/>
    {['Aufreibende, dramatische Augenblicke (besonders bei Samen der Furcht).','Jede 24 Stunden ohne lange Rast.','Mitansehen des Todes einer geliebten Person.','Wirklichkeit werdende Albträume oder Urängste.','Beeinträchtigung des Realitätsverständnisses.','Mitansehen einer Verwandlung in eine grauenhafte Kreatur.',].map(t=><div key={t} className="feat reveal-up" style={{marginBottom:'6px'}}><div className="feat-text">{t}</div></div>)}
    <SubH>Wahnsinn</SubH>
    <div ><div className="ref">Dungeon Master's Guide, S. 258–259</div></div>
    <Txt c={<>Magische Effekte können zu Wahnsinn führen: <Acc c="kurzfristig"/> (Minuten), <Acc c="langfristig"/> oder <Acc c="permanent"/>. Schrecklichere oder mehrfache Auswirkungen können dauerhaften Wahnsinn verursachen.</>}/>
  </div>
);}

function AbenteuerContent(){
  const[expanded,setExpanded]=useState(null);
  return(
    <div>
      <SH mono="Regelwerk" title="Zwischen den Abenteuern"/>
      <SubH>Lebensstile und Lebenserhaltungskosten</SubH>
      <Txt c="Dein Charakter kann sich auswählen, wie er zwischen den Abenteuern lebt. Die folgende Tabelle zeigt die verschiedenen Lebensstile mit den verbundenen Kosten. Klicke auf einen Eintrag für mehr Details."/>
      <div >
        <TW>
          <table className="eq-table">
            <thead><tr><th>Lebensstil</th><th>Kosten pro Tag</th></tr></thead>
            <tbody>
              {LEBENSSTILE.map((ls,i)=>(
                <React.Fragment key={ls.name}>
                  <tr style={{cursor:'pointer'}} onClick={()=>setExpanded(expanded===i?null:i)}>
                    <td style={{display:'flex',alignItems:'center',gap:'7px',color:'rgba(220,210,255,0.9)',fontWeight:'400'}}>
                      <span style={{display:'inline-block',width:'14px',height:'14px',lineHeight:'14px',textAlign:'center',borderRadius:'50%',border:'1px solid rgba(124,77,255,0.44)',fontSize:'9px',color:'rgba(160,140,255,0.8)',flexShrink:0,fontFamily:'var(--font-mono)',transition:'transform 0.15s',transform:expanded===i?'rotate(45deg)':'none'}}>+</span>
                      {ls.name}
                    </td>
                    <td style={{color:ls.kosten==='—'?'rgba(200,190,240,0.35)':'rgba(160,140,255,0.85)',fontFamily:'var(--font-mono)',fontSize:'11px'}}>{ls.kosten}</td>
                  </tr>
                  {expanded===i&&(
                    <tr>
                      <td colSpan={2} style={{padding:'0 14px 12px 34px',background:'rgba(124,77,255,0.08)',borderBottom:'1px solid rgba(124,77,255,0.1)'}}>
                        <p style={{fontFamily:'var(--font-body)',fontSize:'12px',fontWeight:'300',lineHeight:'1.8',color:'rgba(190,180,240,0.65)',letterSpacing:'0.02em',animation:'fadeInUp 0.2s ease forwards'}}>{ls.desc}</p>
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              ))}
            </tbody>
          </table>
        </TW>
      </div>
      <Txt c={<>Diese Ausgaben decken Unterkunft, Essen und Trinken sowie sonstige Bedürfnisse ab. Die Kosten sind am <Hl c="Anfang jeder Woche oder jeden Monats"/> zu bezahlen.</>}/>
      <Txt c="Die Wahl dieses Lebensstils hat Konsequenzen. Einen wohlhabenden Lebensstil zu unterhalten könnte dir helfen, Kontakte mit den Reichen und Mächtigen zu knüpfen. Umgekehrt bewahrt dich ein ärmlicher Lebensstil vor den Blicken der Diebe."/>
      <SubH>Schlaf</SubH>
      <div ><div className="ref">Xanathars Ratgeber für Alles, S. 77</div></div>
      <SubH>Materialkomponenten</SubH>
      <div className="feat reveal-up"><div className="feat-text">Steht bei einer Materialkomponente ein <strong style={{color:'rgba(200,190,240,0.85)'}}>Preis</strong>, muss das Material gekauft und mitgetragen werden. Es wird nicht verbraucht, es sei denn, der Zauber erwähnt es explizit. Materialien ohne Preis können durch einen Materialkomponentenbeutel oder Fokus ersetzt werden.</div></div>
      <SubH>Munition</SubH>
      <Txt c="Der Schütze zählt seine verbrauchte Munition. Bei einem Patzer geht die Ladung sofort kaputt oder ist unauffindbar. Nach dem Kampf würfelt der SL, wie viele Exemplare wieder eingesammelt werden können."/>
      <div ><MunitionRoller/></div>
    </div>
  );
}

// ── APP ────────────────────────────────────────────────────────────────────────

function App(){
  const[active,setActive]=useState('zeit');
  useReveal(active);
  const handleSelect=(id)=>{setActive(id);window.scrollTo({top:0});};
  const CONTENT={zeit:<ZeitContent/>,hunger:<HungerContent/>,durst:<DurstContent/>,traglast:<TraglastContent/>,reisen:<ReisenContent/>,erschoepfung:<ErschoepfungContent/>,verletzungen:<VerletzungenContent/>,furcht:<FurchtContent/>,abenteuer:<AbenteuerContent/>};

  return(
    <div style={{position:'relative',minHeight:'100vh'}}>

      {/* NAV */}
      <SiteNav rightLabel="REGELWERK v1.0" />

      {/* HERO HEADER */}
      <div style={{position:'relative',overflow:'hidden',borderBottom:'1px solid rgba(160,140,255,0.1)',background:'linear-gradient(135deg,rgba(124,77,255,0.1) 0%,transparent 55%),linear-gradient(225deg,rgba(60,20,180,0.12) 0%,transparent 50%)'}}>
        <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',opacity:0.04,pointerEvents:'none'}} viewBox="0 0 1200 180" preserveAspectRatio="xMidYMid slice">
          {Array.from({length:13}).map((_,i)=><line key={i} x1={i*100} y1="0" x2={i*100} y2="180" stroke="rgba(124,77,255,1)" strokeWidth="1"/>)}
          {Array.from({length:3}).map((_,i)=><line key={i} x1="0" y1={i*90} x2="1200" y2={i*90} stroke="rgba(124,77,255,1)" strokeWidth="1"/>)}
        </svg>
        {Array.from({length:40}).map((_,i)=>(
          <div key={i} style={{position:'absolute',width:i%7===0?2:1,height:i%7===0?2:1,borderRadius:'50%',background:'rgba(200,192,232,0.5)',left:`${(i*41+13)%100}%`,top:`${(i*67+5)%100}%`,opacity:0.08+i%5*0.04,pointerEvents:'none'}}/>
        ))}
        <div style={{position:'relative',zIndex:2,padding:'36px 40px 32px',display:'flex',alignItems:'flex-end',justifyContent:'space-between',flexWrap:'wrap',gap:'16px'}}>
          <div>
            <div style={{fontFamily:'var(--font-mono)',fontSize:'8px',letterSpacing:'0.35em',color:'rgba(124,77,255,0.6)',textTransform:'uppercase',marginBottom:'10px'}}>Spielerhandbuch · Regelwerk</div>
            <h1 style={{fontFamily:'var(--font-display)',fontSize:'clamp(36px,5vw,58px)',fontWeight:'300',letterSpacing:'0.18em',color:'#f0eeff',textShadow:'0 0 40px rgba(124,77,255,0.4)',lineHeight:'1',marginBottom:'10px'}}>Realismus</h1>
            <p style={{fontFamily:'var(--font-body)',fontWeight:'300',fontStyle:'italic',fontSize:'13px',color:'rgba(200,190,240,0.42)',letterSpacing:'0.06em',maxWidth:'480px',lineHeight:'1.6'}}>Zeit, Hunger, Durst, Reisen, Erschöpfung und mehr — alle Regeln zur natürlichen und lebendigen Darstellung der Welt.</p>
          </div>
          <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
            {CATEGORIES.map(cat=>{
              const on=cat.id===active;
              return(
                <button key={cat.id} onClick={()=>handleSelect(cat.id)} style={{padding:'5px 13px',fontFamily:'var(--font-body)',fontSize:'11px',fontWeight:on?'500':'300',letterSpacing:'0.06em',background:on?'rgba(124,77,255,0.22)':'transparent',border:`1px solid ${on?'rgba(124,77,255,0.66)':'rgba(124,77,255,0.2)'}`,color:on?'#f0eeff':'rgba(200,190,240,0.5)',borderRadius:'2px',cursor:'pointer',transition:'all 0.15s'}}
                  onMouseEnter={e=>{if(!on){e.currentTarget.style.color='rgba(220,210,255,0.8)';e.currentTarget.style.borderColor='rgba(124,77,255,0.4)';}}} onMouseLeave={e=>{if(!on){e.currentTarget.style.color='rgba(200,190,240,0.5)';e.currentTarget.style.borderColor='rgba(124,77,255,0.2)';}}}>{cat.label}</button>
              );
            })}
          </div>
        </div>
        <div style={{position:'absolute',bottom:0,left:0,right:0,height:'40px',background:'linear-gradient(transparent,rgba(5,4,15,0.6))',pointerEvents:'none'}}/>
      </div>

      {/* BODY */}
      <div style={{display:'flex',alignItems:'flex-start',minHeight:'calc(100vh - 52px)'}}>
        <Sidebar active={active} onSelect={handleSelect}/>
        <div style={{flex:1,padding:'32px 36px 80px',minWidth:0,maxWidth:'960px'}}>
          {CONTENT[active]}
        </div>
      </div>

      {/* FOOTER */}
      <div style={{padding:'10px 32px',borderTop:'1px solid rgba(160,140,255,0.07)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div style={{fontFamily:'var(--font-mono)',fontSize:'7px',color:'rgba(160,140,255,0.22)',letterSpacing:'0.2em'}}>◈ REGELWERK-STATUS: NOMINAL ◈ EPOCHE: UNBEKANNT</div>
        <div style={{fontFamily:'var(--font-mono)',fontSize:'7px',color:'rgba(160,140,255,0.22)',letterSpacing:'0.2em'}}>MERURIA // DIE VERWOBENEN REICHE</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>


</body></html>
