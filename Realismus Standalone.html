function hexPts(s){const c=s/2,pts=[];for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);pts.push(`${c+c*Math.cos(a)},${c+c*Math.sin(a)}`);}return pts.join(' ');}
function Oct({size=8,color='rgba(124,77,255,0.6)',fill='rgba(124,77,255,0.2)',sw=1,style={}}){return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:'block',flexShrink:0,...style}}><polygon points={hexPts(size)} fill={fill} stroke={color} strokeWidth={sw}/></svg>;}

function useReveal(dep){
  useEffect(()=>{
    const obs=new IntersectionObserver(entries=>{
      entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target);}});
    },{threshold:0.08});
    document.querySelectorAll('.reveal-up,.reveal-left').forEach(el=>{el.classList.remove('visible');obs.observe(el);});
    return ()=>obs.disconnect();
  },[dep]);
}

function scrollToSection(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const top = el.getBoundingClientRect().top + window.scrollY - 70;
  window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
}

const PAGE_HEADER_H = 180 + 52; // PageHeader(180) + nav(52)

function Sidebar({ active, onSelect, accent }) {
  const asideRef = useRef(null);
  useEffect(() => {
    const update = () => {
      const ideal = PAGE_HEADER_H - window.scrollY;
      const val = Math.max(52, ideal);
      if (asideRef.current) {
        asideRef.current.style.top = val + 'px';
        asideRef.current.style.height = `calc(100vh - ${val}px)`;
      }
    };
    update();
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update, { passive: true });
    return () => { window.removeEventListener('scroll', update); window.removeEventListener('resize', update); };
  }, []);

  return (
    <aside ref={asideRef} style={{ width: 'var(--sidebar-w)', flexShrink: 0, position: 'fixed', left: 0, top: `${PAGE_HEADER_H}px`, height: `calc(100vh - ${PAGE_HEADER_H}px)`, borderRight: `1px solid ${accent}18`, padding: '24px 0', background: 'rgba(5,4,15,0.85)', backdropFilter: 'blur(12px)', zIndex: 50, overflowY: 'auto' }}>
      <div style={{ fontFamily: 'var(--font-mono)', fontSize: '8px', letterSpacing: '0.25em', color: `${accent}66`, textTransform: 'uppercase', padding: '0 20px', marginBottom: '14px' }}>Regelwerk</div>
      {CATEGORIES.map(cat => {
        const on = cat.id === active;
        const subs = SECTION_ANCHORS[cat.id] || [];
        return (
          <React.Fragment key={cat.id}>
            <button onClick={() => onSelect(cat.id)}
              style={{ display: 'flex', alignItems: 'center', gap: '9px', width: '100%', textAlign: 'left', padding: '8px 20px', background: on ? `${accent}12` : 'transparent', border: 'none', borderLeft: on ? `2px solid ${accent}` : '2px solid transparent', cursor: 'pointer', fontFamily: 'var(--font-body)', fontWeight: on ? '500' : '300', fontSize: '12px', letterSpacing: '0.06em', color: on ? '#f0eeff' : 'rgba(200,190,240,0.6)', transition: 'all 0.15s' }}
              onMouseEnter={e => { if (!on) { e.currentTarget.style.color = '#f0eeff'; e.currentTarget.style.borderLeftColor = `${accent}55`; e.currentTarget.style.background = `${accent}08`; } }}

              <Oct size={6} color={on ? accent : `${accent}55`} fill={on ? `${accent}44` : `${accent}12`} />

              <button key={sub.id} onClick={() => scrollToSection(sub.id)}
                style={{ display: 'block', width: '100%', textAlign: 'left', padding: '5px 20px 5px 35px', background: 'transparent', border: 'none', borderLeft: `2px solid ${accent}22`, cursor: 'pointer', fontFamily: 'var(--font-body)', fontWeight: '300', fontSize: '11px', letterSpacing: '0.04em', color: 'rgba(200,190,240,0.45)', transition: 'all 0.12s' }}

                onMouseLeave={e => { e.currentTarget.style.color = 'rgba(200,190,240,0.45)'; e.currentTarget.style.borderLeftColor = `${accent}22`; }}>
                {sub.label}
              </button>
            ))}

// ── HUNGER CALCULATOR ─────────────────────────────────────────────────────────

function HungerCalc(){
  const[str,setStr]=useState(10),[kon,setKon]=useState(10),[size,setSize]=useState('m'),[cond,setCond]=useState('n'),[ex,setEx]=useState(1);
  const sm={k:0.5,m:1,g:4};
  let cm=1;if(cond==='h')cm=2;else if(cond==='v')cm=-1;else if(cond==='e')cm=1+0.1125*ex;
  const res=Math.round((str+kon)*sm[size]*cm),neg=res<0;
  const inp={background:'rgba(124,77,255,0.07)',border:'1px solid rgba(124,77,255,0.22)',borderRadius:'3px',color:'var(--white)',fontFamily:'var(--font-mono)',fontSize:'14px',padding:'5px 8px',width:'62px',textAlign:'center',outline:'none'};
  const sel={background:'rgba(8,6,22,0.9)',border:'1px solid rgba(124,77,255,0.22)',borderRadius:'3px',color:'var(--white)',fontFamily:'var(--font-mono)',fontSize:'10px',padding:'5px 8px',outline:'none',cursor:'pointer'};
  const lbl={fontFamily:'var(--font-mono)',fontSize:'8px',letterSpacing:'0.18em',color:'rgba(124,77,255,0.55)',textTransform:'uppercase',display:'block',marginBottom:'4px'};
  return(
    <div  style={{border:'1px solid rgba(124,77,255,0.2)',borderRadius:'3px',padding:'18px 20px',background:'rgba(10,8,28,0.7)',marginTop:'14px'}}>
      <div style={{fontFamily:'var(--font-mono)',fontSize:'8px',letterSpacing:'0.26em',color:'rgba(124,77,255,0.45)',textTransform:'uppercase',marginBottom:'13px'}}>Interaktiver Hunger-Rechner</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(100px,1fr))',gap:'12px',marginBottom:'15px'}}>
        <div><label style={lbl}>Stärke</label><input type="number" min="1" max="30" value={str} onChange={e=>setStr(+e.target.value)} style={inp}/></div>
        <div><label style={lbl}>Konstitution</label><input type="number" min="1" max="30" value={kon} onChange={e=>setKon(+e.target.value)} style={inp}/></div>
        <div><label style={lbl}>Größe</label><select value={size} onChange={e=>setSize(e.target.value)} style={sel}><option value="k">Klein ×0,5</option><option value="m">Mittelgroß ×1</option><option value="g">Groß ×4</option></select></div>
        <div><label style={lbl}>Zustand</label><select value={cond} onChange={e=>setCond(e.target.value)} style={sel}><option value="n">Normal</option><option value="h">Ext. Kälte ×2</option><option value="v">Vergiftet −1</option><option value="e">Erschöpft</option></select></div>
        {cond==='e'&&<div><label style={lbl}>Erschöpf.-Stufe</label><input type="number" min="1" max="6" value={ex} onChange={e=>setEx(+e.target.value)} style={inp}/></div>}
      </div>
      <div style={{borderTop:'1px solid rgba(124,77,255,0.12)',paddingTop:'13px',display:'flex',alignItems:'center',gap:'18px',flexWrap:'wrap'}}>
        <div>
          <div style={{fontFamily:'var(--font-mono)',fontSize:'8px',letterSpacing:'0.22em',color:'rgba(124,77,255,0.45)',textTransform:'uppercase',marginBottom:'3px'}}>Hunger-Wert</div>
          <div style={{fontFamily:'var(--font-display)',fontSize:'32px',fontWeight:'300',color:neg?'rgba(255,100,100,0.85)':'var(--white)',textShadow:neg?'none':'0 0 24px rgba(124,77,255,0.35)'}}>{res}</div>
        </div>
        <div style={{fontFamily:'var(--font-body)',fontWeight:'300',fontSize:'11px',color:'rgba(200,190,240,0.3)',fontStyle:'italic'}}>= ({str}+{kon}) × {sm[size]}{cond==='h'?' × 2':cond==='v'?' × (−1)':cond==='e'?` × ${(1+0.1125*ex).toFixed(3)}`:''}</div>
        {neg&&<div style={{padding:'8px 12px',background:'rgba(200,50,50,0.1)',border:'1px solid rgba(200,50,50,0.22)',borderRadius:'3px',fontFamily:'var(--font-body)',fontWeight:'300',fontSize:'11px',color:'rgba(255,150,150,0.7)'}}>Vergiftet/krank — kann nicht gesättigt werden</div>}
      </div>
    </div>
  );
}

// ── COIN FLIP ─────────────────────────────────────────────────────────────────

function CoinFlip(){
  const [result, setResult] = useState(null);
  const [flipping, setFlipping] = useState(false);
  const [angle, setAngle] = useState(0);
  const baseAngle = useRef(0);

  const flip = () => {
    if (flipping) return;
    setFlipping(true);
    setResult(null);
    const r = Math.random() < 0.5 ? 'kopf' : 'zahl';
    const spins = (6 + Math.floor(Math.random() * 4)) * 360;
    const landing = r === 'kopf' ? 0 : 180;
    const currentMod = ((baseAngle.current % 360) + 360) % 360;
    const diff = ((landing - currentMod) + 360) % 360;
    const newAngle = baseAngle.current + spins + diff;
    baseAngle.current = newAngle;
    setAngle(newAngle);
    setTimeout(() => { setResult(r); setFlipping(false); }, 1500);
  };

  const ticks = Array.from({length:48}).map((_,i) => {
    const a = (i/48)*Math.PI*2 - Math.PI/2;
    return <line key={i} x1={100+87*Math.cos(a)} y1={100+87*Math.sin(a)} x2={100+93*Math.cos(a)} y2={100+93*Math.sin(a)} stroke="rgba(80,52,0,0.55)" strokeWidth="1.5"/>;
  });

  return (
    <div style={{background:'rgba(210,160,20,0.07)',border:'1px solid rgba(210,160,20,0.22)',borderRadius:'8px',padding:'28px 20px 24px',marginBottom:'24px',textAlign:'center'}}>
      <div style={{fontFamily:'var(--font-mono)',fontSize:'8px',letterSpacing:'0.3em',color:'rgba(210,160,40,0.55)',textTransform:'uppercase',marginBottom:'22px'}}>Wirf eine Münze</div>

      {/* 3D Coin */}
      <div style={{perspective:'800px',width:'200px',height:'200px',margin:'0 auto 20px'}}>
        <div style={{
          width:'100%', height:'100%', position:'relative',
          transformStyle:'preserve-3d',
          transform:`rotateY(${angle}deg)`,
          transition: flipping ? 'transform 1.5s cubic-bezier(0.2,0.75,0.45,1.0)' : 'none',
          filter:'drop-shadow(0 6px 20px rgba(200,150,10,0.45))'
        }}>
          {/* KOPF */}
          <div style={{position:'absolute',inset:0,backfaceVisibility:'hidden',WebkitBackfaceVisibility:'hidden'}}>
            <svg viewBox="0 0 200 200" style={{width:'100%',height:'100%'}}>
              <defs>
                <radialGradient id="cgk" cx="38%" cy="32%">
                  <stop offset="0%" stopColor="#f8d870"/>
                  <stop offset="55%" stopColor="#d4a018"/>
                  <stop offset="100%" stopColor="#8a6008"/>
                </radialGradient>
              </defs>
              <circle cx="100" cy="100" r="98" fill="#6a4806"/>
              <circle cx="100" cy="100" r="94" fill="url(#cgk)"/>
              {ticks}
              <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(80,52,0,0.35)" strokeWidth="1"/>
              {/* Head silhouette */}
              <ellipse cx="108" cy="76" rx="23" ry="28" fill="rgba(80,50,5,0.75)"/>
              <ellipse cx="100" cy="108" rx="15" ry="9" fill="rgba(80,50,5,0.75)"/>
              <rect x="79" y="108" width="34" height="12" rx="5" fill="rgba(80,50,5,0.75)"/>
              <circle cx="116" cy="69" r="3.5" fill="rgba(80,50,5,0.6)"/>
              <path d="M 126 83 Q 130 89 127 94" stroke="rgba(80,50,5,0.55)" strokeWidth="2" fill="none" strokeLinecap="round"/>
              {/* Laurel leaves */}
              <path d="M 86 54 Q 80 44 74 48 Q 70 54 76 58" fill="rgba(100,80,10,0.7)"/>
              <path d="M 81 46 Q 75 36 69 40 Q 65 46 71 50" fill="rgba(100,80,10,0.6)"/>
              <path d="M 76 40 Q 70 30 64 34 Q 60 40 66 44" fill="rgba(100,80,10,0.5)"/>
              <text x="100" y="157" textAnchor="middle" fontFamily="Georgia,serif" fontSize="15" fontWeight="bold" fill="rgba(70,44,4,0.85)" letterSpacing="4">KOPF</text>
            </svg>
          </div>
          {/* ZAHL */}
          <div style={{position:'absolute',inset:0,backfaceVisibility:'hidden',WebkitBackfaceVisibility:'hidden',transform:'rotateY(180deg)'}}>
            <svg viewBox="0 0 200 200" style={{width:'100%',height:'100%'}}>
              <defs>
                <radialGradient id="cgz" cx="38%" cy="32%">
                  <stop offset="0%" stopColor="#f0cc58"/>
                  <stop offset="55%" stopColor="#c89018"/>
                  <stop offset="100%" stopColor="#886008"/>
                </radialGradient>
              </defs>
              <circle cx="100" cy="100" r="98" fill="#6a4806"/>
              <circle cx="100" cy="100" r="94" fill="url(#cgz)"/>
              {ticks}
              <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(80,52,0,0.35)" strokeWidth="1"/>
              <circle cx="100" cy="94" r="36" fill="none" stroke="rgba(70,44,4,0.45)" strokeWidth="2"/>
              <text x="100" y="118" textAnchor="middle" fontFamily="Georgia,serif" fontSize="64" fontWeight="bold" fill="rgba(70,44,4,0.8)">I</text>
              <text x="100" y="157" textAnchor="middle" fontFamily="Georgia,serif" fontSize="15" fontWeight="bold" fill="rgba(70,44,4,0.85)" letterSpacing="4">ZAHL</text>
            </svg>
          </div>

      {/* Status */}
      <div style={{fontFamily:'var(--font-display)',fontSize:'22px',fontWeight:'300',letterSpacing:'0.14em',color:flipping?'rgba(200,190,240,0.35)':'var(--white)',minHeight:'30px',marginBottom:'8px',transition:'color 0.3s'}}>
        {flipping ? 'Münze wird geworfen...' : result === 'kopf' ? 'Kopf' : result === 'zahl' ? 'Zahl' : '—'}
      </div>
      <div style={{fontFamily:'var(--font-body)',fontWeight:'300',fontSize:'13px',color:'rgba(210,170,60,0.8)',minHeight:'22px',marginBottom:'20px'}}>
        {!flipping && result === 'kopf' && '— Zwei Samen der Furcht'}
        {!flipping && result === 'zahl' && '— Ein Samen der Furcht'}
        {!flipping && !result && <span style={{color:'rgba(200,190,240,0.3)',fontStyle:'italic',fontSize:'12px'}}>Noch kein Wurf</span>}
      </div>

      {/* Button */}
      <button onClick={flip} disabled={flipping} style={{background:'transparent',border:'1px solid rgba(210,160,20,0.45)',borderRadius:'3px',color:'rgba(210,170,50,0.85)',fontFamily:'var(--font-display)',fontSize:'11px',letterSpacing:'0.2em',textTransform:'uppercase',padding:'10px 28px',cursor:flipping?'wait':'pointer',transition:'all 0.2s',opacity:flipping?0.4:1}}
        onMouseEnter={e=>{if(!flipping){e.currentTarget.style.background='rgba(210,160,20,0.15)';e.currentTarget.style.color='#f8d860';}}}
        onMouseLeave={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.color='rgba(210,170,50,0.85)';}}>
        {result && !flipping ? 'Noch einmal werfen' : 'Münze werfen'}
      </button>
    </div>
  );
}

function MunitionRoller(){
  const[roll,setRoll]=useState(null),[rolling,setRolling]=useState(false),[disp,setDisp]=useState(null);
  const doRoll=()=>{
    if(rolling)return;
    setRolling(true);setRoll(null);setDisp(null);
    let c=0;const iv=setInterval(()=>{setDisp(Math.floor(Math.random()*20)+1);c++;if(c>12){clearInterval(iv);const r=Math.floor(Math.random()*20)+1;setRoll(r);setDisp(r);setRolling(false);}},55);
  };
  const active=roll?MUNI_RANGES.find(r=>roll>=r.min&&roll<=r.max):null;
  return(
    <div style={{marginTop:'14px',border:'1px solid rgba(124,77,255,0.18)',borderRadius:'3px',overflow:'hidden'}}>
      <div style={{padding:'12px 16px',background:'rgba(124,77,255,0.07)',borderBottom:'1px solid rgba(124,77,255,0.14)',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'10px'}}>
        <div>
          <div style={{fontFamily:'var(--font-display)',fontSize:'11px',letterSpacing:'0.16em',color:'rgba(200,190,240,0.9)',textTransform:'uppercase'}}>Munitionsrückgewinnung</div>
          <div style={{fontFamily:'var(--font-mono)',fontSize:'8px',letterSpacing:'0.14em',color:'rgba(124,77,255,0.5)',marginTop:'3px'}}>nach dem Kampf würfeln</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:'12px',flexWrap:'wrap'}}>
          <button onClick={doRoll} disabled={rolling} style={{display:'inline-flex',alignItems:'center',gap:'8px',padding:'7px 15px',background:'rgba(124,77,255,0.14)',border:'1px solid rgba(124,77,255,0.4)',borderRadius:'3px',color:'rgba(160,140,255,0.9)',fontFamily:'var(--font-display)',fontSize:'10px',letterSpacing:'0.14em',textTransform:'uppercase',cursor:rolling?'wait':'pointer',transition:'all 0.2s'}}
            onMouseEnter={e=>{if(!rolling){e.currentTarget.style.background='rgba(124,77,255,0.24)';e.currentTarget.style.color='#f0eeff';}}} onMouseLeave={e=>{e.currentTarget.style.background='rgba(124,77,255,0.14)';e.currentTarget.style.color='rgba(160,140,255,0.9)';}}>
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" strokeWidth="1.5" style={{animation:rolling?'diceRoll 0.3s linear infinite':'none',transformOrigin:'center'}}>
              <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/>
            </svg>
            1W20 Würfeln
          </button>
          {disp&&(
            <div style={{display:'flex',alignItems:'center',gap:'8px',animation:roll&&!rolling?'resultPop 0.3s ease forwards':'none'}}>
              <span style={{fontFamily:'var(--font-mono)',fontSize:'8px',color:'rgba(124,77,255,0.5)',letterSpacing:'0.2em'}}>ERGEBNIS</span>
              <span style={{fontFamily:'var(--font-display)',fontSize:'22px',fontWeight:'300',color:'var(--white)',textShadow:'0 0 20px rgba(124,77,255,0.5)'}}>{disp}</span>
            </div>
          )}
        </div>
      </div>
      {active&&!rolling&&(
        <div style={{padding:'13px 16px',background:'rgba(124,77,255,0.1)',borderBottom:'1px solid rgba(124,77,255,0.18)',borderLeft:'3px solid rgba(124,77,255,0.9)',animation:'fadeInUp 0.18s ease both'}}>
          <div style={{fontFamily:'var(--font-body)',fontWeight:'300',fontSize:'12px',lineHeight:'1.75',color:'rgba(220,210,255,0.85)'}}>{active.pct}% der Munition kann wieder eingesammelt werden.</div>
        </div>
      )}
      <TW>
        <table className="eq-table">
          <thead><tr><th>1W20</th><th>Menge der Munition (abgerundet)</th></tr></thead>
          <tbody>
            {MUNI_RANGES.map(row=>(
              <tr key={row.range} style={{background:active&&active.min===row.min?'rgba(124,77,255,0.18)':'transparent',transition:'background 0.3s'}}>

                <td style={{color:active&&active.min===row.min?'rgba(220,210,255,0.95)':undefined}}>{row.label}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </TW>
    </div>
  );
}

function TraglastCalc(){
  const [str,setStr]=useState(10),[size,setSize]=useState('m'),[carried,setCarried]=useState('');
  const sm={k:0.5,m:1,g:2,r:4,gi:8};
  const mult=sm[size];
  const belastet   =Math.round(str*5 *mult);
  const sehrBelastet=Math.round(str*10*mult);
  const ueberlastet =Math.round(str*15*mult);
  const w=carried===''?null:+carried;
  let status='Unbelastet',tag='ok',statusDesc='Keine Einschränkungen.';
  if(w!==null){
    if(w>ueberlastet){status='Überlastet';tag='bad';statusDesc='Bewegungsunfähigkeit. Nachteil auf STR-, GES- und KON-Würfe.';}
    else if(w>sehrBelastet){status='Sehr belastet';tag='warn';statusDesc='Bewegungsrate −6 m. Nachteil auf STR-, GES- und KON-Würfe.';}
    else if(w>belastet){status='Belastet';tag='warn';statusDesc='Bewegungsrate −3 m.';}
  }
  const inp={background:'rgba(124,77,255,0.07)',border:'1px solid rgba(124,77,255,0.22)',borderRadius:'3px',color:'var(--white)',fontFamily:'var(--font-mono)',fontSize:'14px',padding:'5px 8px',width:'62px',textAlign:'center',outline:'none'};
  const sel={background:'rgba(8,6,22,0.9)',border:'1px solid rgba(124,77,255,0.22)',borderRadius:'3px',color:'var(--white)',fontFamily:'var(--font-mono)',fontSize:'10px',padding:'5px 8px',outline:'none',cursor:'pointer'};
  const lbl={fontFamily:'var(--font-mono)',fontSize:'8px',letterSpacing:'0.18em',color:'rgba(124,77,255,0.55)',textTransform:'uppercase',display:'block',marginBottom:'4px'};
  const barColor=(val,max)=>{const p=Math.min(val/max,1);if(p>0.9)return'rgba(200,50,50,0.7)';if(p>0.6)return'rgba(240,160,60,0.7)';return'rgba(94,232,208,0.6)';};
  return(
    <div style={{border:'1px solid rgba(124,77,255,0.2)',borderRadius:'3px',padding:'18px 20px',background:'rgba(10,8,28,0.7)',marginTop:'14px'}}>
      <div style={{fontFamily:'var(--font-mono)',fontSize:'8px',letterSpacing:'0.26em',color:'rgba(124,77,255,0.45)',textTransform:'uppercase',marginBottom:'13px'}}>Interaktiver Traglast-Rechner</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(110px,1fr))',gap:'12px',marginBottom:'15px'}}>
        <div><label style={lbl}>Stärke</label><input type="number" min="1" max="30" value={str} onChange={e=>setStr(+e.target.value)} style={inp}/></div>
        <div><label style={lbl}>Größe</label>
          <select value={size} onChange={e=>setSize(e.target.value)} style={sel}>
            <option value="k">Klein ×0,5</option>
            <option value="m">Mittelgroß ×1</option>
            <option value="g">Groß ×2</option>
            <option value="r">Riesig ×4</option>
            <option value="gi">Gigantisch ×8</option>
          </select>
        </div>
        <div><label style={lbl}>Getragenes Gewicht (kg)</label><input type="number" min="0" placeholder="—" value={carried} onChange={e=>setCarried(e.target.value)} style={{...inp,width:'72px'}}/></div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'8px',marginBottom:w!==null?'14px':'0'}}>
        {[['Belastet',belastet,'warn'],['Sehr belastet',sehrBelastet,'warn'],['Überlastet',ueberlastet,'bad']].map(([label,val,t])=>{
          const active=w!==null&&(t==='bad'?w>ueberlastet:t==='warn'&&label==='Belastet'?w>belastet&&w<=sehrBelastet:w>sehrBelastet&&w<=ueberlastet);
          return(
          <div key={label} style={{padding:'12px 13px',background: active?'rgba(124,77,255,0.13)':'rgba(124,77,255,0.05)',border:'1px solid rgba(124,77,255,0.14)',borderTop:`2px solid ${active?'rgba(124,77,255,0.9)':'rgba(124,77,255,0.35)'}`,borderRadius:'0 0 3px 3px',transition:'all 0.2s'}}>
            <div style={{fontFamily:'var(--font-mono)',fontSize:'7px',letterSpacing:'0.18em',color:'rgba(124,77,255,0.5)',textTransform:'uppercase',marginBottom:'4px'}}>{label}</div>
            <div style={{fontFamily:'var(--font-display)',fontSize:'20px',fontWeight:'300',color:'var(--white)'}}>{val} <span style={{fontSize:'10px',color:'rgba(200,190,240,0.4)',fontFamily:'var(--font-mono)'}}>kg</span></div>
          </div>
          );
        })}
      </div>
      {w!==null&&(
        <div style={{borderTop:'1px solid rgba(124,77,255,0.12)',paddingTop:'13px',display:'flex',alignItems:'center',gap:'16px',flexWrap:'wrap'}}>
          <div>
            <div style={{fontFamily:'var(--font-mono)',fontSize:'8px',letterSpacing:'0.22em',color:'rgba(124,77,255,0.45)',textTransform:'uppercase',marginBottom:'3px'}}>Aktueller Zustand</div>
            <span className={`tag-${tag}`} style={{fontSize:'10px',padding:'3px 10px'}}>{status}</span>
          </div>
          <div style={{flex:1,minWidth:'140px'}}>
            <div style={{height:'5px',background:'rgba(124,77,255,0.1)',borderRadius:'3px',overflow:'hidden',marginBottom:'4px'}}>
              <div style={{height:'100%',width:`${Math.min(w/ueberlastet*100,100)}%`,background:barColor(w,ueberlastet),borderRadius:'3px',transition:'width 0.3s, background 0.3s'}}/>
            </div>
            <div style={{fontFamily:'var(--font-body)',fontWeight:'300',fontSize:'10px',color:'rgba(200,190,240,0.35)',fontStyle:'italic'}}>{statusDesc}</div>
          </div>
        </div>
      )}
    </div>
  );
}

function VerletzungsRoller(){
  const[roll,setRoll]=useState(null),[rolling,setRolling]=useState(false),[disp,setDisp]=useState(null);
  const doRoll=()=>{
    if(rolling)return;
    setRolling(true);setRoll(null);setDisp(null);
    let c=0;const iv=setInterval(()=>{setDisp(Math.floor(Math.random()*20)+1);c++;if(c>12){clearInterval(iv);const r=Math.floor(Math.random()*20)+1;setRoll(r);setDisp(r);setRolling(false);}},55);
  };
  const active=roll?VERLETZUNGEN.find(v=>roll>=v.min&&roll<=v.max):null;
  return(
    <div>
      <div style={{display:'flex',alignItems:'center',gap:'14px',marginBottom:'14px',flexWrap:'wrap'}}>
        <button onClick={doRoll} disabled={rolling} style={{display:'inline-flex',alignItems:'center',gap:'9px',padding:'9px 18px',background:'rgba(124,77,255,0.14)',border:'1px solid rgba(124,77,255,0.4)',borderRadius:'3px',color:'rgba(160,140,255,0.9)',fontFamily:'var(--font-display)',fontSize:'11px',letterSpacing:'0.14em',textTransform:'uppercase',cursor:rolling?'wait':'pointer',transition:'all 0.2s'}}
          onMouseEnter={e=>{if(!rolling){e.currentTarget.style.background='rgba(124,77,255,0.24)';e.currentTarget.style.color='#f0eeff';}}} onMouseLeave={e=>{e.currentTarget.style.background='rgba(124,77,255,0.14)';e.currentTarget.style.color='rgba(160,140,255,0.9)';}}>
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="1.5" style={{animation:rolling?'diceRoll 0.3s linear infinite':'none',transformOrigin:'center'}}>
            <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/>
          </svg>
          1W20 Würfeln
        </button>
        {disp&&(
          <div style={{display:'flex',alignItems:'center',gap:'10px',animation:roll&&!rolling?'resultPop 0.3s ease forwards':'none'}}>
            <span style={{fontFamily:'var(--font-mono)',fontSize:'8px',color:'rgba(124,77,255,0.5)',letterSpacing:'0.2em'}}>ERGEBNIS</span>
            <span style={{fontFamily:'var(--font-display)',fontSize:'24px',fontWeight:'300',color:'var(--white)',textShadow:'0 0 20px rgba(124,77,255,0.5)'}}>{disp}</span>
            {active&&!rolling&&<span style={{fontFamily:'var(--font-body)',fontWeight:'300',fontSize:'12px',color:'rgba(160,140,255,0.85)'}}>{active.name}</span>}
          </div>
        )}
      </div>
      {active&&!rolling&&(

function WahnsinnRoller({data, title, duration, col}){
  const[roll,setRoll]=useState(null),[rolling,setRolling]=useState(false),[disp,setDisp]=useState(null);
  const doRoll=()=>{
    if(rolling)return;
    setRolling(true);setRoll(null);setDisp(null);
    let c=0;const iv=setInterval(()=>{setDisp(Math.floor(Math.random()*100)+1);c++;if(c>12){clearInterval(iv);const r=Math.floor(Math.random()*100)+1;setRoll(r);setDisp(r);setRolling(false);}},55);
  };
  const fmt=n=>n===100?'00':String(n).padStart(2,'0');
  const active=roll?data.find(v=>roll>=v.min&&roll<=v.max):null;
  return(
    <div style={{marginTop:'18px',border:'1px solid rgba(124,77,255,0.18)',borderRadius:'3px',overflow:'hidden'}}>
      <div style={{padding:'12px 16px',background:'rgba(124,77,255,0.07)',borderBottom:'1px solid rgba(124,77,255,0.14)',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'10px'}}>
        <div>
          <div style={{fontFamily:'var(--font-display)',fontSize:'11px',letterSpacing:'0.16em',color:'rgba(200,190,240,0.9)',textTransform:'uppercase'}}>{title}</div>
          <div style={{fontFamily:'var(--font-mono)',fontSize:'8px',letterSpacing:'0.14em',color:'rgba(124,77,255,0.5)',marginTop:'3px'}}>{duration}</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:'12px',flexWrap:'wrap'}}>
          <button onClick={doRoll} disabled={rolling} style={{display:'inline-flex',alignItems:'center',gap:'8px',padding:'7px 15px',background:'rgba(124,77,255,0.14)',border:'1px solid rgba(124,77,255,0.4)',borderRadius:'3px',color:'rgba(160,140,255,0.9)',fontFamily:'var(--font-display)',fontSize:'10px',letterSpacing:'0.14em',textTransform:'uppercase',cursor:rolling?'wait':'pointer',transition:'all 0.2s'}}
            onMouseEnter={e=>{if(!rolling){e.currentTarget.style.background='rgba(124,77,255,0.24)';e.currentTarget.style.color='#f0eeff';}}} onMouseLeave={e=>{e.currentTarget.style.background='rgba(124,77,255,0.14)';e.currentTarget.style.color='rgba(160,140,255,0.9)';}}>
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" strokeWidth="1.5" style={{animation:rolling?'diceRoll 0.3s linear infinite':'none',transformOrigin:'center'}}>
              <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/>
            </svg>
            1W100 Würfeln
          </button>
          {disp&&(
            <div style={{display:'flex',alignItems:'center',gap:'8px',animation:roll&&!rolling?'resultPop 0.3s ease forwards':'none'}}>
              <span style={{fontFamily:'var(--font-mono)',fontSize:'8px',color:'rgba(124,77,255,0.5)',letterSpacing:'0.2em'}}>ERGEBNIS</span>
              <span style={{fontFamily:'var(--font-display)',fontSize:'22px',fontWeight:'300',color:'var(--white)',textShadow:'0 0 20px rgba(124,77,255,0.5)'}}>{fmt(disp)}</span>
            </div>
          )}
        </div>
      </div>
      {active&&!rolling&&(
        <div style={{padding:'13px 16px',background:'rgba(124,77,255,0.1)',borderBottom:'1px solid rgba(124,77,255,0.18)',borderLeft:'3px solid rgba(124,77,255,0.9)',animation:'fadeInUp 0.18s ease both'}}>
          <div style={{fontFamily:'var(--font-body)',fontWeight:'300',fontSize:'12px',lineHeight:'1.75',color:'rgba(220,210,255,0.85)'}}>{active.desc}</div>
        </div>
      )}
      <TW>
        <table className="eq-table">
          <thead><tr><th>1W100</th><th>{col}</th></tr></thead>
          <tbody>
            {data.map(row=>(
              <tr key={row.range} style={{background:active&&active.min===row.min?'rgba(124,77,255,0.18)':'transparent',transition:'background 0.3s'}}>
                <td style={{fontFamily:'var(--font-mono)',fontSize:'11px',color:active&&active.min===row.min?'#f0eeff':'rgba(180,165,255,0.85)',whiteSpace:'nowrap'}}>{row.range}</td>
                <td style={{color:active&&active.min===row.min?'rgba(220,210,255,0.9)':undefined}}>{row.desc}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </TW>
    </div>
  );
}

      <SubH id="sec-munition">Munition</SubH>
      <Txt c="Der Schütze zählt seine verbrauchte Munition. Bei einem Patzer geht die Ladung sofort kaputt oder ist unauffindbar. Nach dem Kampf würfelt der SL, wie viele Exemplare wieder eingesammelt werden können."/>
      <div ><MunitionRoller/></div>
    </div>
  );
}

// ── APP ────────────────────────────────────────────────────────────────────────

function App() {
  const [mouse, setMouse] = useState({ x: 0.5, y: 0.5 });
  const [active, setActive] = useState('zeit');
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const accent = tweaks.accentColor || '#7c4dff';
  const handleMouseMove = useCallback((e) => { setMouse({ x: e.clientX / window.innerWidth, y: e.clientY / window.innerHeight }); }, []);
  useReveal(active);

  const handleSelect = (id) => {
    setActive(id);
    window.scrollTo({ top: 0 });
  };

  const CONTENT = { zeit: <ZeitContent/>, kommunikation: <KommunikationContent/>, hunger: <HungerContent/>, durst: <DurstContent/>, traglast: <TraglastContent/>, reisen: <ReisenContent/>, erschoepfung: <ErschoepfungContent/>, verletzungen: <VerletzungenContent/>, furcht: <FurchtContent/>, abenteuer: <AbenteuerContent/> };

  return (
    <SiteGate>
      <div onMouseMove={handleMouseMove} className="page-root">
        {tweaks.showParticles && <ParticleField mouseX={mouse.x} mouseY={mouse.y} accent={accent} />}

        <PageHeader />
        <SiteNav rightLabel="REGELWERK v1.0" />

        <div className="page-body" style={{ position: 'relative', zIndex: 5 }}>
          <Sidebar active={active} onSelect={handleSelect} accent={accent} />

          <div style={{ flex: 1, padding: '32px 36px 64px', minWidth: 0, maxWidth: 'clamp(600px, 85vw, 1400px)' }}>
            {/* Page title */}
            <div style={{ marginBottom: '36px' }}>
              <h1 className="reveal-left visible" style={{ fontFamily: 'var(--font-display)', fontSize: '42px', fontWeight: '300', letterSpacing: '0.18em', color: 'var(--white)', textShadow: `0 0 30px ${accent}55` }}>Realismus</h1>
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginTop: '12px' }}>
                <div style={{ width: '50px', height: '1px', background: `linear-gradient(90deg,${accent}cc,transparent)`, animation: 'pulse-glow 3s infinite' }} />
                <Oct size={8} color={`${accent}88`} fill={`${accent}33`} sw={1} />
              </div>
            </div>

            {/* Category tabs */}
            <div style={{ display: 'flex', gap: '6px', flexWrap: 'nowrap', overflowX: 'auto', marginBottom: '32px', paddingBottom: '4px' }}>
              {CATEGORIES.map(cat => {
                const isActive = cat.id === active;
                return (
                  <button key={cat.id} onClick={() => handleSelect(cat.id)}
                    style={{ padding: '5px 14px', fontFamily: 'var(--font-body)', fontSize: '11px', fontWeight: isActive ? '500' : '300', letterSpacing: '0.08em', background: isActive ? `${accent}22` : 'transparent', border: `1px solid ${isActive ? accent + '66' : 'rgba(124,77,255,0.2)'}`, color: isActive ? 'var(--white)' : 'rgba(var(--text-rgb),0.5)', borderRadius: '2px', cursor: 'pointer', transition: 'all 0.15s' }}
                    onMouseEnter={e => { if (!isActive) { e.currentTarget.style.color = 'rgba(var(--text-rgb),0.8)'; e.currentTarget.style.borderColor = `${accent}44`; } }}
                    onMouseLeave={e => { if (!isActive) { e.currentTarget.style.color = 'rgba(var(--text-rgb),0.5)'; e.currentTarget.style.borderColor = 'rgba(124,77,255,0.2)'; } }}>
                    {cat.label}
                  </button>
                );
              })}
            </div>

            {/* Content */}
            <div id="rl-content">
              {CONTENT[active]}
            </div>
          </div>
        </div>

        <SiteFooter accent={accent} />

        <TweaksPanel tweaks={tweaks} setTweak={setTweak}>
          <TweakSection label="Darstellung">
            <TweakToggle id="showParticles" label="Partikel" />
            <TweakColor id="accentColor" label="Akzentfarbe" />
          </TweakSection>
        </TweaksPanel>

        <FloatNav />
      </div>
    </SiteGate>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>


</body></html>
