      <style>{`:root { --lager-h: ${lagerOpen ? 138 : 0}px; }`}</style>

      {/* Top bar with breadcrumb */}
      <header className="mk-topbar">
        <a className="mk-back" href="index.html">◂ Meruria</a>
        <span className="mk-title">KARTENMANAGEMENT</span>
        {/* Breadcrumb */}
        {(mapStack.length > 0 || true) && (
          <div style={{
            display:'flex', alignItems:'center', gap:6, marginLeft:14,
            fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.18em',
            textTransform:'uppercase',
          }}>
            {mapStack.map((m, i) => (
              <React.Fragment key={m.id}>
                <button
                  onClick={() => navigateUp(i)}
                  style={{
                    background:'transparent', border:'none', cursor:'pointer',
                    fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.18em',
                    color:'rgba(124,77,255,0.6)', textTransform:'uppercase', padding:'2px 4px',
                    transition:'color 0.15s',
                  }}
                  onMouseEnter={e => e.currentTarget.style.color='rgba(200,190,240,0.9)'}
                  onMouseLeave={e => e.currentTarget.style.color='rgba(124,77,255,0.6)'}
                >{m.name || 'Karte'}</button>
                <span style={{ color:'rgba(124,77,255,0.3)' }}>›</span>
              </React.Fragment>
            ))}
            <span style={{ color:'rgba(160,140,255,0.7)' }}>{currentMapName}</span>
          </div>
        )}
        {/* Ebene ergibt sich aus der festen Hierarchie (Welt → Region → Gebiet → Ort) */}
        <span style={{
          marginLeft:14, padding:'3px 9px', borderRadius:3,
          background: isImageMap ? 'rgba(217,176,107,0.08)' : 'rgba(124,77,255,0.08)',
          border: `1px solid ${isImageMap ? 'rgba(217,176,107,0.35)' : 'rgba(124,77,255,0.3)'}`,
          fontFamily:'var(--font-mono)', fontSize:8.5, letterSpacing:'0.18em', textTransform:'uppercase',
          color: isImageMap ? 'rgba(240,220,170,0.85)' : 'rgba(160,140,255,0.8)',
        }}>
          {isImageMap ? '▦' : '⬡'} {depthEbene(mapStack.length)}
        </span>
        <div style={{ flex: 1 }}/>
        <span style={{
          fontFamily:'var(--font-mono)', fontSize:'9px', letterSpacing:'0.28em',
          color:'rgba(160,140,255,0.55)', textTransform:'uppercase',
        }}>
          {isLoading ? '◈ lade …'
            : isImageMap ? `${floorAreas.length} Flächen · Ebene ${floors.length ? floorIdx + 1 : 0}/${floors.length}`
            : `${hexList.length} ${hexList.length === 1 ? 'Hex' : 'Hexe'} · ${stash.length} im Lager`}
        </span>
      </header>

      {/* Stage */}
      <div
        ref={stageRef}
        className={`mk-stage${isDragging ? ' is-dragging' : ''}${dragInfo ? ' is-drop-active' : ''}${bgAlignMode ? ' bg-align-mode' : ''}`}
        style={{ top: 56, cursor: (tool || drawMode) ? 'crosshair' : undefined }}
        onPointerDown={(e) => {
          if (isImageMap && tool && e.button === 0) {
            const p = screenToWorld(e);
            setShapeStart(p); setShapeCur(p);
          }
        }}
        onClick={(e) => {
          if (suppressClickRef.current) { suppressClickRef.current = false; return; }
          if (isImageMap && drawMode) {
            setDrawPts(pts => [...pts, screenToWorld(e)]);
            return;
          }
          if (editing && !bgAlignMode) closeDrawer();
        }}
        onDragOver={mapEmpty && !isImageMap && dragInfo?.fromStash ? (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; } : undefined}
        onDrop={mapEmpty && !isImageMap && dragInfo?.fromStash ? (e) => { e.preventDefault(); dropOnEmptyMap(); } : undefined}
      >
        {!isLoading && !isImageMap && (
          <div ref={worldRef} className={`mk-world${bgUrl ? ' has-bg' : ''}`} style={{ transform: worldTx, '--zoom': camera.zoom, '--label-scale': 1 / Math.pow(camera.zoom, 0.25) }}>
            {bgUrl && (
              <img
                src={bgUrl}
                style={{
                  position:'absolute', left:0, top:0,
                  transform:`translate(${bgTransform.x}px,${bgTransform.y}px) scale(${bgTransform.scale}) translate(-50%,-50%)`,
                  transformOrigin:'0 0',
                  maxWidth:'none', zIndex:0, pointerEvents:'none', userSelect:'none', opacity:0.9,
                }}
                alt=""
                draggable={false}
              />
            )}
            {hexList.map((h) => (
              <HexTile
                key={hexKey(h.q, h.r)}
                hex={h}
                selected={hexKey(h.q, h.r) === selectedKey}
                hovered={hexKey(h.q, h.r) === hoveredKey}
                editing={editing && hexKey(h.q, h.r) === selectedKey}
                onSelect={onHexClick}
                onHoverChange={onHexHover}
                onGripDragStart={onHexGripDragStart}
                onGripDragEnd={onHexGripDragEnd}
                gripDragging={dragInfo?.fromMap && dragInfo.id === h.id}
              />
            ))}
            {labelsVisible && (
              <div className="mk-labels-layer">
                {hexList.map((h) => <HexLabel key={`lbl-${h.id}`} hex={h}/>)}
              </div>
            )}
            {ghosts.map((g) => (
              <HexGhost
                key={g.key}
                parentQ={g.parentQ} parentR={g.parentR}
                dir={g.dir}
                onAdd={addHex}
                onDropHex={dropOnGhost}
                isDropActive={!!dragInfo}
                onParentHover={onGhostParentHover}
              />
            ))}
          </div>
        )}

        {/* ── Bild-Karte ── */}
        {!isLoading && isImageMap && floor && (
          <div ref={worldRef} className="mk-world" style={{ transform: worldTx, '--zoom': camera.zoom, '--label-scale': 1 / Math.pow(camera.zoom, 0.25) }}>
            <img
              src={floor.bg}
              style={{ position:'absolute', left:0, top:0, width:floor.w, height:floor.h, maxWidth:'none', pointerEvents:'none', userSelect:'none', opacity:0.95 }}
              alt="" draggable={false}
            />
            <svg
              width={floor.w} height={floor.h} viewBox={`0 0 ${floor.w} ${floor.h}`}
              style={{ position:'absolute', left:0, top:0, overflow:'visible' }}
            >
              {/* Flächen */}
              {floorAreas.map(a => {
                const sel = a.id === selectedAreaId;
                return (
                  <polygon
                    key={a.id}
                    points={a.points.map(p => p.join(',')).join(' ')}
                    style={{
                      fill: sel ? 'rgba(160,140,255,0.34)' : (a.visible ? 'rgba(124,77,255,0.10)' : 'rgba(220,80,120,0.10)'),
                      stroke: sel ? 'rgba(220,210,255,0.95)' : (a.visible ? 'rgba(160,140,255,0.75)' : 'rgba(220,80,120,0.6)'),
                      strokeWidth: 2 / Math.max(camera.zoom, 0.01),
                      strokeDasharray: a.visible ? '14 8' : '5 7',
                      cursor: sel ? 'move' : 'pointer',
                    }}
                    onClick={(e) => { e.stopPropagation(); if (drawMode || tool) return; if (!sel) selectArea(a); }}
                    onPointerDown={(e) => {
                      if (!sel || drawMode || tool || e.button !== 0) return;
                      e.stopPropagation();
                      startGizmo({ mode: 'move', areaId: a.id, start: screenToWorld(e), startPts: a.points.map(q => [...q]) });
                    }}
                  />
                );
              })}

              {/* Zeichen-Vorschau (Polygon) */}
              {drawMode && drawPts.length > 0 && (
                <React.Fragment>
                  <polyline
                    points={drawPts.map(p => p.join(',')).join(' ')}
                    style={{ fill:'rgba(217,176,107,0.12)', stroke:'rgba(217,176,107,0.9)', strokeWidth: 2 / Math.max(camera.zoom, 0.01), strokeDasharray:'6 5' }}
                  />
                  {drawPts.map((p, i) => (
                    <circle key={i} cx={p[0]} cy={p[1]} r={5 / Math.max(camera.zoom, 0.01)} style={{ fill:'rgba(217,176,107,0.95)' }}/>
                  ))}
                </React.Fragment>
              )}

              {/* Form-Vorschau (Rechteck/Ellipse/Hexagon) */}
              {shapeStart && shapeCur && (
                <polygon
                  points={shapeGeom(tool, shapeStart, shapeCur).map(p => p.join(',')).join(' ')}
                  style={{ fill:'rgba(217,176,107,0.14)', stroke:'rgba(217,176,107,0.9)', strokeWidth: 2 / Math.max(camera.zoom, 0.01), strokeDasharray:'6 5' }}
                />
              )}

              {/* Gizmo */}
              {selectedArea && !tool && !drawMode && (() => {
                const xs = selectedArea.points.map(p => p[0]), ys = selectedArea.points.map(p => p[1]);
                const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
                const z = Math.max(camera.zoom, 0.01);
                const c = areaCentroid(selectedArea.points);
                const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
                const grabScale = (anchor, axis) => (e) => {
                  if (e.button !== 0) return;
                  e.stopPropagation();
                  startGizmo({ mode: 'scale', areaId: selectedArea.id, anchor, axis, start: screenToWorld(e), startPts: selectedArea.points.map(q => [...q]) });
                };
                const handles = [
                  { x: x0, y: y0, cursor: 'nwse-resize', down: grabScale([x1, y1], 'xy') },
                  { x: x1, y: y0, cursor: 'nesw-resize', down: grabScale([x0, y1], 'xy') },
                  { x: x0, y: y1, cursor: 'nesw-resize', down: grabScale([x1, y0], 'xy') },
                  { x: x1, y: y1, cursor: 'nwse-resize', down: grabScale([x0, y0], 'xy') },
                  { x: mx, y: y0, cursor: 'ns-resize', down: grabScale([mx, y1], 'y') },
                  { x: mx, y: y1, cursor: 'ns-resize', down: grabScale([mx, y0], 'y') },
                  { x: x0, y: my, cursor: 'ew-resize', down: grabScale([x1, my], 'x') },
                  { x: x1, y: my, cursor: 'ew-resize', down: grabScale([x0, my], 'x') },
                ];
                const ang = (selectedArea.rot || 0) - Math.PI / 2;
                const rBox = Math.hypot((x1 - x0) / 2, (y1 - y0) / 2);
                const rHandle = rBox + 40 / z;
                const rotX = c[0] + Math.cos(ang) * rHandle, rotY = c[1] + Math.sin(ang) * rHandle;
                return (
                  <React.Fragment>
                    <polygon points={`${x0},${y0} ${x1},${y0} ${x1},${y1} ${x0},${y1}`} style={{ fill:'none', stroke:'rgba(220,210,255,0.55)', strokeWidth: 2 / z, strokeDasharray:`${8/z} ${6/z}`, pointerEvents:'none' }}/>
                    <line x1={c[0] + Math.cos(ang) * rBox * 0.6} y1={c[1] + Math.sin(ang) * rBox * 0.6} x2={rotX} y2={rotY} style={{ stroke:'rgba(220,210,255,0.4)', strokeWidth: 2 / z, pointerEvents:'none' }}/>
                    <circle
                      cx={rotX} cy={rotY} r={9 / z}
                      style={{ fill:'rgba(8,6,22,0.9)', stroke:'rgba(217,176,107,0.95)', strokeWidth: 2 / z, cursor:'grab' }}
                      onPointerDown={(e) => {
                        if (e.button !== 0) return;
                        e.stopPropagation();
                        startGizmo({ mode: 'rotate', areaId: selectedArea.id, c, startRot: selectedArea.rot || 0, start: screenToWorld(e), startPts: selectedArea.points.map(q => [...q]) });
                      }}
                    />
                    {handles.map((h, i) => (
                      <circle key={i} cx={h.x} cy={h.y} r={9 / z} style={{ fill:'rgba(8,6,22,0.9)', stroke:'rgba(220,210,255,0.95)', strokeWidth: 2 / z, cursor: h.cursor }} onPointerDown={h.down}/>
                    ))}
                  </React.Fragment>
                );
              })()}
            </svg>

            {/* Flächen-Labels */}
            {labelsVisible && (
              <div className="mk-labels-layer">
                {floorAreas.map(a => {
                  const c = areaCentroid(a.points);
                  return (
                    <div
                      key={`albl-${a.id}`}
                      className="mk-hex-label-floating"
                      style={{ left: c[0], top: c[1], opacity: a.visible ? 1 : 0.6, '--hex-color': a.visible ? (a.typ === 'eingang' ? 'oklch(0.78 0.1 80)' : 'oklch(0.7 0.15 285)') : 'oklch(0.6 0.15 0)' }}
                    >
                      <div className="mk-hex-label-terr" style={{ color: a.visible ? (a.typ === 'eingang' ? 'rgba(217,176,107,0.85)' : 'rgba(160,140,255,0.8)') : 'rgba(220,80,120,0.8)' }}>
                        {a.visible ? (a.typ === 'eingang' ? '⬡ Betretbar' : '◈ POI') : '✕ Verborgen'}
                      </div>
                      {a.name ? <div className="mk-hex-label-name">{a.name}</div> : null}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {/* Bild-Karte ohne Etagen */}
        {!isLoading && isImageMap && !floor && (
          <div className="mk-empty-map-hint">
            <div className="h">Bild-Karte ohne Grundriss</div>
            <div className="s">lade ein Hintergrundbild als erste Ebene hoch</div>
            <button className="mk-empty-create" onClick={(e) => { e.stopPropagation(); floorFileRef.current?.click(); }} disabled={floorUploading}>
              {floorUploading ? '… lädt hoch' : '+ Grundriss hochladen'}
            </button>
          </div>
        )}

        {/* Zeichenmodus-Banner */}
        {isImageMap && (drawMode || tool) && (
          <div style={{
            position:'absolute', top:16, left:'50%', transform:'translateX(-50%)',
            zIndex:60, display:'flex', alignItems:'center', gap:12,
            background:'rgba(217,176,107,0.16)', border:'1px solid rgba(217,176,107,0.5)',
            borderRadius:3, padding:'6px 14px',
            fontFamily:'var(--font-mono)', fontSize:'9.5px', letterSpacing:'0.18em',
            textTransform:'uppercase', color:'rgba(240,220,170,0.95)',
          }}>
            {drawMode
              ? <React.Fragment>
                  <span>✎ Polygon · Klick = Punkt setzen ({drawPts.length})</span>
                  <button
                    onClick={(e) => { e.stopPropagation(); finishDraw(); }}
                    disabled={drawPts.length < 3}
                    style={{ opacity: drawPts.length < 3 ? 0.4 : 1, padding:'2px 10px', fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.12em', textTransform:'uppercase', color:'rgba(240,220,170,0.95)', background:'rgba(217,176,107,0.2)', border:'1px solid rgba(217,176,107,0.6)', borderRadius:3, cursor:'pointer' }}
                  >✓ Fertig (Enter)</button>
                  <button
                    onClick={(e) => { e.stopPropagation(); setDrawMode(false); setDrawPts([]); }}
                    style={{ padding:'2px 10px', fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.12em', textTransform:'uppercase', color:'rgba(220,140,160,0.9)', background:'transparent', border:'1px solid rgba(220,80,120,0.4)', borderRadius:3, cursor:'pointer' }}
                  >✕ Abbrechen (Esc)</button>
                </React.Fragment>
              : <span>{tool === 'rect' ? '▭ Rechteck' : tool === 'circle' ? '◯ Kreis / Ellipse' : '⬡ Hexagon'} · Aufziehen mit gedrückter Maustaste</span>}
          </div>
        )}

        {/* Etagen-Umschalter */}
        {isImageMap && floors.length > 1 && (
          <div style={{
            position:'absolute', top:16, right: editing ? DRAWER_W + 16 : 16, zIndex:55,
            display:'flex', alignItems:'center', gap:8,
            background:'rgba(8,6,22,0.9)', border:'1px solid rgba(124,77,255,0.3)',
            borderRadius:4, padding:'6px 10px',
          }}>
            <button className="mk-tool-btn" style={{ width:26, height:26, opacity: floorIdx >= floors.length - 1 ? 0.35 : 1 }} disabled={floorIdx >= floors.length - 1} onClick={() => switchFloor(1)} title="Etage höher">▲</button>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.14em', color:'rgba(160,140,255,0.8)', textTransform:'uppercase' }}>
              Ebene {floorIdx + 1}/{floors.length} · {floor?.label || ''}
            </span>
            <button className="mk-tool-btn" style={{ width:26, height:26, opacity: floorIdx <= 0 ? 0.35 : 1 }} disabled={floorIdx <= 0} onClick={() => switchFloor(-1)} title="Etage tiefer">▼</button>
          </div>
        )}

        {/* BG align mode — overlay captures pointer events so hexes can't be clicked */}
        {bgAlignMode && bgUrl && (
          <div style={{
            position:'absolute', inset:0, zIndex:10,
            cursor: isDragging ? 'grabbing' : 'grab',
          }}/>
        )}

        {/* BG align mode banner */}
        {bgAlignMode && (
          <div style={{
            position:'absolute', top:16, left:'50%', transform:'translateX(-50%)',
            zIndex:60, pointerEvents:'none',
            background:'rgba(124,77,255,0.22)', border:'1px solid rgba(200,180,255,0.45)',
            borderRadius:3, padding:'6px 18px',
            fontFamily:'var(--font-mono)', fontSize:'9.5px', letterSpacing:'0.22em',
            textTransform:'uppercase', color:'rgba(220,210,255,0.9)',
          }}>
            Hintergrund-Modus · Ziehen = verschieben · Scrollen = Größe
          </div>
        )}

        {/* Empty-map hint (nur Hex-Karten) */}
        {!isLoading && !isImageMap && mapEmpty && (
          <div className={`mk-empty-map-hint${dragInfo?.fromStash ? ' is-drop-active' : ''}`}>
            <div className="h">Leere Karte</div>
            <div className="s">
              {dragInfo?.fromStash ? '↓ hier ablegen'
                : stash.length > 0 ? 'ziehe ein Hex aus dem Lager hierher'
                : 'beginne die Karte mit einem ersten Hex'}
            </div>
            {!dragInfo && (
              <button className="mk-empty-create" onClick={(e) => { e.stopPropagation(); addHex(0, 0); }}>
                + Erstes Hex erstellen
              </button>
            )}
          </div>
        )}
      </div>

      {/* HUD */}
      <div className="mk-hud">
        <div className="mk-hud-row"><span>◇ Zoom</span><span>{(camera.zoom * 100).toFixed(0)}%</span></div>
        <div className="mk-hud-row" style={{ marginTop:4, paddingTop:8, borderTop:'1px solid rgba(124,77,255,0.18)', color:'rgba(160,140,255,0.55)' }}>
          <span>◇ Mittel-Maustaste</span><span>Karte ziehen</span>
        </div>
        <div className="mk-hud-row" style={{ color:'rgba(160,140,255,0.55)' }}>
          <span>◇ Mausrad</span><span>Zoom</span>
        </div>
        <div className="mk-hud-row" style={{ color:'rgba(160,140,255,0.55)' }}>
          <span>◇ Klick</span><span>Bearbeiten</span>
        </div>
        <div className="mk-hud-row" style={{ color:'rgba(160,140,255,0.55)' }}>
          <span>◇ Grip ziehen</span><span>Ins Lager</span>
        </div>
      </div>

      {/* Bottom-right tools */}
      <div className="mk-tools">
        {isImageMap && (<React.Fragment>
          <button
            className={`mk-tool-btn${drawMode ? ' is-active' : ''}`}
            title="Polygon zeichnen (Klick für Punkte, Enter zum Abschließen)"
            onClick={() => { setDrawMode(v => !v); setDrawPts([]); setTool(null); setShapeStart(null); setShapeCur(null); setSelAreaId(null); setEditing(false); }}
          >✎</button>
          <button
            className={`mk-tool-btn${tool === 'rect' ? ' is-active' : ''}`}
            title="Rechteck aufziehen"
            onClick={() => { setTool(t => t === 'rect' ? null : 'rect'); setDrawMode(false); setDrawPts([]); setShapeStart(null); setShapeCur(null); setSelAreaId(null); setEditing(false); }}
          >▭</button>
          <button
            className={`mk-tool-btn${tool === 'circle' ? ' is-active' : ''}`}
            title="Kreis / Ellipse aufziehen"
            onClick={() => { setTool(t => t === 'circle' ? null : 'circle'); setDrawMode(false); setDrawPts([]); setShapeStart(null); setShapeCur(null); setSelAreaId(null); setEditing(false); }}
          >◯</button>
          <button
            className={`mk-tool-btn${tool === 'hex' ? ' is-active' : ''}`}
            title="Hexagon aufziehen"
            onClick={() => { setTool(t => t === 'hex' ? null : 'hex'); setDrawMode(false); setDrawPts([]); setShapeStart(null); setShapeCur(null); setSelAreaId(null); setEditing(false); }}
          >⬡</button>
          <button
            className={`mk-tool-btn${floorsPanelOpen ? ' is-active' : ''}`}
            title="Etagen verwalten"
            onClick={() => setFloorsPanelOpen(v => !v)}
          >▤</button>
          <input ref={floorFileRef} type="file" accept="image/*" style={{ display:'none' }} onChange={e => { addFloor(e.target.files[0]); e.target.value = ''; }}/>
        </React.Fragment>)}
        {!isImageMap && (<React.Fragment>
        <button
          className={`mk-tool-btn${bgUrl ? ' is-active' : ''}`}
          title={bgUrl ? 'Kartenhintergrund ersetzen' : 'Kartenhintergrund wählen'}
          onClick={() => bgFileRef.current?.click()}
          disabled={bgUploading}
        >
          {bgUploading
            ? <span style={{ fontSize: 10 }}>…</span>
            : <svg width="18" height="16" viewBox="0 0 18 16" fill="none" stroke="currentColor" strokeWidth="1.4">
                <rect x="1" y="3" width="16" height="11" rx="1"/>
                <circle cx="6" cy="8.5" r="2"/>
                <path d="M10 11 L13 7 L16 11"/>
              </svg>
          }
        </button>
        <input ref={bgFileRef} type="file" accept="image/*" style={{ display:'none' }} onChange={e => uploadBg(e.target.files[0])}/>
        {bgUrl && (
          <button
            className={`mk-tool-btn${bgAlignMode ? ' is-active' : ''}`}
            title={bgAlignMode ? 'Hintergrund sperren' : 'Hintergrund ausrichten'}
            onClick={() => setBgAlignMode(v => !v)}
          >
            {bgAlignMode
              ? <svg width="16" height="18" viewBox="0 0 16 18" fill="none" stroke="currentColor" strokeWidth="1.5">
                  <rect x="2" y="8" width="12" height="9" rx="1.5"/>
                  <path d="M5 8V5a3 3 0 0 1 6 0v3"/>
                  <line x1="8" y1="12" x2="8" y2="14"/>
                </svg>
              : <svg width="16" height="18" viewBox="0 0 16 18" fill="none" stroke="currentColor" strokeWidth="1.5">
                  <rect x="2" y="8" width="12" height="9" rx="1.5"/>
                  <path d="M5 8V5a3 3 0 0 1 6 0" strokeDasharray="2 1.5"/>
                  <line x1="8" y1="12" x2="8" y2="14"/>
                </svg>
            }
          </button>
        )}
        </React.Fragment>)}
        <button className="mk-tool-btn" title="Vergrößern" onClick={() => zoomBy(1.25)}>+</button>
        <button className="mk-tool-btn" title="Verkleinern" onClick={() => zoomBy(0.8)}>−</button>
        <button className="mk-tool-btn" title="Ansicht zurücksetzen" onClick={resetView}>
          <span className="lbl">⌖</span>
        </button>
        {!isImageMap && (
        <button
          className={`mk-tool-btn${history.length === 0 ? ' is-disabled' : ''}`}
          title={history.length === 0 ? 'Nichts rückgängig' : 'Rückgängig'}
          onClick={history.length === 0 ? undefined : undo}
          disabled={history.length === 0}
        >
          <span className="lbl" style={{ fontSize:13 }}>↺</span>
        </button>
        )}
        <button
          className={`mk-tool-btn${!labelsVisible ? ' is-active' : ''}`}
          title={labelsVisible ? 'Beschriftungen ausblenden' : 'Beschriftungen einblenden'}
          onClick={() => setLabelsVisible((v) => !v)}
        >
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="1.4" style={{display:'block'}}>
            <rect x="2" y="5" width="14" height="8" rx="1.5"/>
            <line x1="5" y1="9" x2="13" y2="9" strokeWidth="1.8"/>
            <line x1="5" y1="12" x2="10" y2="12"/>
            {!labelsVisible && <line x1="1" y1="17" x2="17" y2="1" strokeWidth="1.6" stroke="currentColor"/>}
          </svg>
        </button>
        {!isImageMap && (
        <button
          className={`mk-tool-btn${lagerOpen ? ' is-active' : ''}`}
          title={`${lagerOpen ? 'Lager schließen' : 'Lager öffnen'} (${stash.length})`}
          onClick={() => setLagerOpen((v) => !v)}
        >
          <svg width="22" height="20" viewBox="0 0 22 20" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round" style={{display:'block'}}>
            <path d="M2.5 9 Q2.5 3 11 3 Q19.5 3 19.5 9"/>
            <rect x="2.5" y="9" width="17" height="8.5" rx="0.5"/>
            <line x1="2.5" y1="12" x2="19.5" y2="12"/>
            <line x1="11" y1="3" x2="11" y2="9"/>
            <rect x="9.3" y="10.3" width="3.4" height="3.4" fill="currentColor" fillOpacity="0.55"/>
            <circle cx="11" cy="12" r="0.6" fill="#05040f"/>
          </svg>
          {stash.length > 0 && (
            <span style={{
              position:'absolute', top:-6, right:-6, minWidth:16, height:16, padding:'0 4px',
              borderRadius:8, background:'rgba(124,77,255,0.95)', color:'#fff',
              fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.05em',
              display:'flex', alignItems:'center', justifyContent:'center',
              boxShadow:'0 0 8px rgba(160,140,255,0.7)',
            }}>{stash.length}</span>
          )}
        </button>
        )}
      </div>

      {/* Etagen-Panel */}
      {isImageMap && floorsPanelOpen && (
        <div style={{
          position:'fixed', right:16, bottom:76, zIndex:120, width:280,
          background:'rgba(10,7,28,0.97)', border:'1px solid rgba(124,77,255,0.35)',
          borderRadius:6, padding:'12px 14px', boxShadow:'0 8px 32px rgba(0,0,0,0.5)',
        }}>
          <div style={{ fontFamily:'var(--font-mono)', fontSize:8.5, letterSpacing:'0.2em', textTransform:'uppercase', color:'rgba(160,140,255,0.7)', marginBottom:10 }}>▤ Etagen</div>
          {floors.length === 0 && (
            <div style={{ fontFamily:'var(--font-body)', fontSize:11.5, fontWeight:300, color:'rgba(200,190,240,0.5)', marginBottom:10 }}>Noch keine Etagen.</div>
          )}
          {floors.map((f, i) => (
            <div key={f.id || i} style={{ display:'flex', alignItems:'center', gap:6, marginBottom:6 }}>
              <button
                className={`mk-tool-btn${i === floorIdx ? ' is-active' : ''}`}
                style={{ width:26, height:26, flexShrink:0, fontSize:10 }}
                title="Zu dieser Etage wechseln"
                onClick={() => { setFloorIdx(i); setSelAreaId(null); setEditing(false); }}
              >{i + 1}</button>
              <input
                className="mk-input"
                style={{ flex:1, fontSize:11, padding:'5px 8px' }}
                value={f.label || ''}
                placeholder={`Ebene ${i + 1}`}
                onChange={e => renameFloor(i, e.target.value)}
              />
              <button
                title="Etage löschen (inkl. Flächen)"
                onClick={() => setConfirm({
                  title: 'Etage löschen?',
                  message: `„${f.label || `Ebene ${i + 1}`}" wird mit allen Flächen endgültig gelöscht.`,
                  onYes: () => { deleteFloor(i); setConfirm(null); },
                })}
                style={{ width:26, height:26, flexShrink:0, fontFamily:'var(--font-mono)', fontSize:10, color:'rgba(200,80,80,0.7)', background:'rgba(200,80,80,0.07)', border:'1px solid rgba(200,80,80,0.2)', borderRadius:4, cursor:'pointer' }}
              >✕</button>
            </div>
          ))}
          <button
            onClick={() => floorFileRef.current?.click()}
            disabled={floorUploading}
            style={{ width:'100%', marginTop:4, padding:'7px 10px', fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.14em', textTransform:'uppercase', color:'rgba(160,140,255,0.8)', background:'rgba(124,77,255,0.08)', border:'1px dashed rgba(124,77,255,0.4)', borderRadius:4, cursor:'pointer' }}
          >{floorUploading ? '… lädt hoch' : '+ Etage hinzufügen (Bild)'}</button>
        </div>
      )}

      {/* Lager sidebar */}
      {!isImageMap && lagerOpen && (
        <div
          className={`mk-lager${dragInfo?.fromMap ? ' is-drop-active' : ''}`}
          onDragOver={dragInfo?.fromMap ? (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; } : undefined}
          onDrop={dragInfo?.fromMap ? (e) => { e.preventDefault(); dropOnLager(); } : undefined}
        >
          {/* Header mit inline Ordner-Tabs */}
          <div className="mk-lager-header">
            <span className="mk-lager-title">◈ Lager</span>
            <div className="mk-lager-tabs">
              <button
                className={`mk-lager-folder-tab${activeLagerFolder === '__all__' ? ' is-active' : ''}`}
                onClick={() => setActiveLagerFolder('__all__')}
              >
                Alle <span className="tab-count">{stash.length}</span>
              </button>
              {stashFolders.map(f => (
                renamingFolder === f ? (
                  <input
                    key={f}
                    className="mk-lager-folder-input"
                    autoFocus
                    value={renameFolderVal}
                    onChange={(e) => setRenameFolderVal(e.target.value)}
                    onKeyDown={(e) => { if (e.key === 'Enter') renameFolder(f); if (e.key === 'Escape') setRenamingFolder(null); }}
                    onBlur={() => renameFolder(f)}
                  />
                ) : (
                  <button
                    key={f}
                    className={`mk-lager-folder-tab${activeLagerFolder === f ? ' is-active' : ''}`}
                    onClick={() => setActiveLagerFolder(f)}
                    onDoubleClick={() => { setRenamingFolder(f); setRenameFolderVal(f); }}
                    title={`${f} — Doppelklick zum Umbenennen`}
                  >
                    {f} <span className="tab-count">{stash.filter(s => s.folder === f).length}</span>
                  </button>
                )
              ))}
              {addingFolder ? (
                <input
                  className="mk-lager-folder-input"
                  autoFocus
                  value={newFolderVal}
                  placeholder="Name …"
                  onChange={(e) => setNewFolderVal(e.target.value)}
                  onKeyDown={(e) => { if (e.key === 'Enter') createFolder(); if (e.key === 'Escape') { setAddingFolder(false); setNewFolderVal(''); } }}
                  onBlur={createFolder}
                />
              ) : (
                <button className="mk-lager-folder-add" onClick={() => setAddingFolder(true)} title="Neuen Ordner erstellen">+</button>
              )}
            </div>
            <span className="mk-lager-count">{stash.length === 0 ? 'leer' : `${stash.length} Hex${stash.length === 1 ? '' : 'e'}`}</span>
            <button className="mk-lager-toggle" onClick={() => setLagerOpen(false)} title="Lager schließen">×</button>
          </div>

          {/* Cards */}
          <div className="mk-lager-body">
            {stash.length === 0 ? (
              <div className="mk-lager-empty">
                {dragInfo?.fromMap ? '↓ hier ablegen, um zu lagern' : '— Hex am Grip greifen und hier ablegen —'}
              </div>
            ) : displayedStash.length === 0 ? (
              <div className="mk-lager-empty">— Keine Hexe in diesem Ordner —</div>
            ) : (
              displayedStash.map((h) => (
                <StashCard
                  key={h.id} hex={h}
                  onDragStart={onStashDragStart} onDragEnd={onStashDragEnd}
                  isDragging={dragInfo?.fromStash && dragInfo.id === h.id}
                  onFolderChange={onFolderChange}
                />
              ))
            )}
          </div>
        </div>
      )}

      {/* Editor drawer */}
      {editing && selectedNode && (
        <EditorDrawer
          key={selectedNode.id}
          node={selectedNode}
          nodeType={selectedArea ? 'area' : 'hex'}
          onChange={selectedArea ? updateArea : updateHex}
          onClose={closeDrawer}
          onDelete={selectedArea ? deleteSelectedArea : deleteSelected}
          onNavigateInto={navigateInto}
          onCreateSubmap={createSubmap}
          isSubmap={mapStack.length > 0}
          objectives={nodeObjectives}
          onObjAdd={addObjective}
          onObjUpdate={updateObjective}
          onObjDelete={deleteObjective}
          lastObjId={lastObjId}
          poolRows={nodePoolRows}
          onPoolOpen={(cat) => setPoolModal({ cat })}
          childEbene={selectedArea ? 'Ort' : depthEbene(mapStack.length + 1)}
          kollCounts={kollCounts}
        />
      )}

      {/* Pool-Modal */}
      {poolModal && selectedNode && (
        <PoolModal
          cat={poolModal.cat}
          anchorLabel={selectedNode.name || (selectedArea ? 'Fläche' : `Hex ${selectedNode.q}·${-selectedNode.r}`)}
          poolSet={new Set(nodePoolRows.filter(r => r.cat === poolModal.cat).map(r => String(r.resource_id)))}
          caughtCounts={kollCounts}
          onToggle={poolToggle(poolModal.cat)}
          onRandomAdd={poolRandomAdd(poolModal.cat)}
          onClose={() => setPoolModal(null)}
        />
      )}

      {/* Confirm dialog */}
      {confirm && (
        <div className="mk-confirm-bg" onClick={() => setConfirm(null)}>
          <div className="mk-confirm" onClick={(e) => e.stopPropagation()}>
            <h3>{confirm.title}</h3>
            <p>{confirm.message}</p>
            <div className="mk-confirm-row">
              <button className="mk-btn-danger" onClick={() => setConfirm(null)}>Abbrechen</button>
              <button className="mk-btn-primary" onClick={confirm.onYes}>Bestätigen</button>
            </div>
          </div>
        </div>
      )}

      {/* localStorage migration banner */}
      {migrationBanner && (
        <div style={{
          position:'fixed', bottom:24, left:'50%', transform:'translateX(-50%)',
          background:'rgba(10,7,28,0.97)', border:'1px solid rgba(124,77,255,0.4)',
          borderRadius:6, padding:'18px 24px', zIndex:500,
          fontFamily:'var(--font-body)', fontSize:13, fontWeight:300,
          color:'rgba(200,190,240,0.85)', maxWidth:420, textAlign:'center',
          boxShadow:'0 8px 32px rgba(0,0,0,0.5)',
        }}>
          <div style={{ fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.22em', color:'rgba(124,77,255,0.6)', textTransform:'uppercase', marginBottom:10 }}>
            Lokale Daten gefunden
          </div>
          <p style={{ margin:'0 0 14px', lineHeight:1.5 }}>
            Es gibt eine gespeicherte Karte aus dem alten Karte-Tool. Soll sie in die Cloud migriert werden?
          </p>
          <div style={{ fontSize:10, color:'rgba(124,77,255,0.45)', marginBottom:16 }}>
            Hinweis: Bilder müssen danach neu hochgeladen werden.
          </div>
          <div style={{ display:'flex', gap:10, justifyContent:'center' }}>
            <button
              onClick={handleMigrate}
              style={{
                fontFamily:'var(--font-display)', fontSize:10, letterSpacing:'0.18em',
                textTransform:'uppercase', padding:'9px 20px', cursor:'pointer',
                background:'rgba(124,77,255,0.18)', border:'1px solid rgba(124,77,255,0.5)',
                borderRadius:3, color:'rgba(200,190,240,0.9)', transition:'all .2s',
              }}
            >Migrieren</button>
            <button
              onClick={() => setMigrationBanner(false)}
              style={{
                fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.18em',
                textTransform:'uppercase', padding:'9px 16px', cursor:'pointer',
                background:'transparent', border:'1px solid rgba(124,77,255,0.2)',
                borderRadius:3, color:'rgba(124,77,255,0.5)', transition:'all .2s',
              }}
            >Überspringen</button>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<MerMap/>);
</script>


</body></html>
