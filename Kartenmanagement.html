<!-- ═══════════════════════════════════════════════════
     Script 1 — Hex math + Supabase persistence
     ═══════════════════════════════════════════════════ -->
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ── Hex constants (pointy-top axial) ─────────────────────────
const HEX_SIZE = 96;
const HEX_W    = Math.sqrt(3) * HEX_SIZE;
const HEX_H    = 2 * HEX_SIZE;

const NEIGHBORS = [
  { dq:  1, dr:  0, ang:   0, label: 'O'  },
  { dq:  1, dr: -1, ang:  60, label: 'NO' },
  { dq:  0, dr: -1, ang: 120, label: 'NW' },
  { dq: -1, dr:  0, ang: 180, label: 'W'  },
  { dq: -1, dr:  1, ang: 240, label: 'SW' },
  { dq:  0, dr:  1, ang: 300, label: 'SO' },
];

const APOTHEM = (Math.sqrt(3) / 2) * HEX_SIZE;

function axialToPixel(q, r) {
  return {
    x: HEX_SIZE * Math.sqrt(3) * (q + r / 2),
    y: HEX_SIZE * 1.5 * r,
  };
}
function hexKey(q, r) { return `${q},${r}`; }

// ── Terrain choices ─────────────────────────────────────────
const TERRAINS = [
  '', 'Ebene', 'Wald', 'Hügelland', 'Gebirge', 'Wüste',
  'Sumpf', 'Tundra', 'Vulkan', 'See', 'Küste', 'Ozean',
  'Hochland', 'Kolonie', 'Höhle', 'Sonstiges',
];

const TERRAIN_COLORS = {
  'Ebene':      'oklch(0.84 0.14 140)',
  'Wald':       'oklch(0.52 0.13 155)',
  'Sumpf':      'oklch(0.42 0.06 110)',
  'Hügelland':  'oklch(0.72 0.11 105)',
  'Wüste':      'oklch(0.88 0.13 90)',
  'Kolonie':    'oklch(0.73 0.15 65)',
  'Vulkan':     'oklch(0.58 0.22 28)',
  'Tundra':     'oklch(0.92 0.04 230)',
  'Küste':      'oklch(0.80 0.12 195)',
  'See':        'oklch(0.65 0.15 230)',
  'Ozean':      'oklch(0.40 0.17 255)',
  'Gebirge':    'oklch(0.62 0.04 65)',
  'Hochland':   'oklch(0.72 0.06 285)',
  'Höhle':      'oklch(0.58 0.13 335)',
  'Sonstiges':  'oklch(0.65 0.18 295)',
};
const DEFAULT_HEX_COLOR = 'oklch(0.70 0.15 285)';
function terrainColor(t) { return TERRAIN_COLORS[t] || DEFAULT_HEX_COLOR; }

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

// ── Supabase helpers ─────────────────────────────────────────
async function loadOrCreateRootMap() {
  const sb = window._sb;
  let { data } = await sb.from('karte_maps')
    .select('id, name, bg_url, bg_transform')
    .is('parent_hex_id', null)
    .order('created_at', { ascending: true })
    .limit(1)
    .maybeSingle();
  if (!data) {
    const res = await sb.from('karte_maps')
      .insert({ name: 'Meruria' })
      .select('id, name, bg_url, bg_transform')
      .single();
    // If the unique index fires (concurrent insert), fall back to fetching
    if (res.error) {
      const fallback = await sb.from('karte_maps')
        .select('id, name, bg_url, bg_transform')
        .is('parent_hex_id', null)
        .order('created_at', { ascending: true })
        .limit(1)
        .single();
      data = fallback.data;
    } else {
      data = res.data;
    }
  }
  return data;
}

async function loadMap(mapId) {
  const { data } = await window._sb
    .from('karte_maps')
    .select('id, name, parent_hex_id, bg_url, bg_transform')
    .eq('id', mapId)
    .single();
  return data;
}

function rowToHex(h) {
  return {
    id: h.id, q: h.q, r: h.r,
    name: h.name || '', terrain: h.terrain || '',
    features: h.features || '', beschreibung: h.beschreibung || '',
    bild_url: h.bild_url || '', bild_pos: h.bild_pos || null, visible: !!h.visible,
    has_submap: !!h.has_submap, submap_id: h.submap_id || null,
  };
}

async function loadHexes(mapId) {
  const { data } = await window._sb
    .from('karte_hexes').select('*').eq('map_id', mapId);
  return Object.fromEntries(
    (data || []).map(h => [hexKey(h.q, h.r), rowToHex(h)])
  );
}

async function loadStash() {
  const { data } = await window._sb
    .from('karte_stash').select('*').order('sort_order');
  return (data || []).map(s => ({
    id: s.id, name: s.name || '', terrain: s.terrain || '',
    features: s.features || '', beschreibung: s.beschreibung || '',
    bild_url: s.bild_url || '',
  }));
}

async function sbUpsertHex(mapId, hex) {
  const { error } = await window._sb.from('karte_hexes').upsert({
    id: hex.id, map_id: mapId, q: hex.q, r: hex.r,
    name: hex.name || '', terrain: hex.terrain || '',
    features: hex.features || '', beschreibung: hex.beschreibung || '',
    bild_url: hex.bild_url || '', bild_pos: hex.bild_pos || null, visible: !!hex.visible,
    has_submap: !!hex.has_submap, submap_id: hex.submap_id || null,
    updated_at: new Date().toISOString(),
  }, { onConflict: 'id' });
  if (error) console.error('sbUpsertHex:', error);
}

async function sbDeleteHex(hexId) {
  const { error } = await window._sb.from('karte_hexes').delete().eq('id', hexId);
  if (error) console.error('sbDeleteHex:', error);
}

async function sbDeleteSubmap(mapId) {
  // Cascades to karte_hexes via ON DELETE CASCADE
  const { error } = await window._sb.from('karte_maps').delete().eq('id', mapId);
  if (error) console.error('sbDeleteSubmap:', error);
}

async function sbUpsertStash(item) {
  const { error } = await window._sb.from('karte_stash').upsert({
    id: item.id, name: item.name || '', terrain: item.terrain || '',
    features: item.features || '', beschreibung: item.beschreibung || '',
    bild_url: item.bild_url || '', folder: item.folder || null, sort_order: Date.now(),
  }, { onConflict: 'id' });
  if (error) console.error('sbUpsertStash:', error);
}

async function sbDeleteStash(itemId) {
  const { error } = await window._sb.from('karte_stash').delete().eq('id', itemId);
  if (error) console.error('sbDeleteStash:', error);
}

// Migration: read localStorage data from the old Karte.html
const LS_KEY = 'meruria-map-v1';
function getLocalData() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    return (d && d.hexes) ? d : null;
  } catch { return null; }
}

Object.assign(window, {
  HEX_SIZE, HEX_W, HEX_H, NEIGHBORS, APOTHEM,
  axialToPixel, hexKey, TERRAINS, TERRAIN_COLORS, terrainColor,
  DEFAULT_HEX_COLOR, easeInOutCubic,
  loadOrCreateRootMap, loadMap, loadHexes, loadStash,
  sbUpsertHex, sbDeleteHex, sbDeleteSubmap, sbUpsertStash, sbDeleteStash,
  rowToHex, getLocalData,
});
</script>


<!-- ═══════════════════════════════════════════════════
     Script 2 — Hex tile components
     ═══════════════════════════════════════════════════ -->
<script type="text/babel">
const { useState: uS2, useRef: uR2 } = React;

function HexBorder({ selected, hovered, color = DEFAULT_HEX_COLOR }) {
  const w = HEX_W, h = HEX_H;
  const points = `${w/2},0 ${w},${h/4} ${w},${h*3/4} ${w/2},${h} 0,${h*3/4} 0,${h/4}`;
  const strokeColor = selected
    ? `color-mix(in oklch, white 40%, ${color})`
    : (hovered ? `color-mix(in oklch, white 18%, ${color})` : color);
  const opacity = selected ? 1 : (hovered ? 0.9 : 0.6);
  const sw = selected ? 2.2 : 1.4;
  return (
    <svg className="mk-hex-border" viewBox={`0 0 ${w} ${h}`} width={w} height={h} preserveAspectRatio="none" style={{ overflow: 'visible' }}>
      <polygon points={points} fill="none" style={{ stroke: strokeColor, strokeOpacity: opacity }} strokeWidth={sw} strokeLinejoin="miter"/>
      <polygon
        points={`${w/2},6 ${w-5},${h/4+2} ${w-5},${h*3/4-2} ${w/2},${h-6} 5,${h*3/4-2} 5,${h/4+2}`}
        fill="none" style={{ stroke: strokeColor }} strokeWidth="0.5" strokeOpacity={selected ? 0.45 : 0.2}
      />
    </svg>
  );
}

function HexTile({ hex, selected, hovered, editing, onSelect, onHoverChange, onGripDragStart, onGripDragEnd, gripDragging }) {
  const { x, y } = axialToPixel(hex.q, hex.r);
  const tcolor = terrainColor(hex.terrain);

  const style = {
    width: HEX_W, height: HEX_H,
    left: x - HEX_W/2, top: y - HEX_H/2,
    pointerEvents: 'auto',
    zIndex: selected ? 12 : (hovered ? 8 : 1),
    opacity: gripDragging ? 0.35 : 1,
    transition: 'opacity 0.15s',
    '--hex-color': tcolor,
  };

  return (
    <div
      className={`mk-hex${selected ? ' is-selected' : ''}${hovered && !selected ? ' is-hovered' : ''}`}
      style={style}
      onMouseEnter={() => onHoverChange(hexKey(hex.q, hex.r), true)}
      onMouseLeave={() => onHoverChange(hexKey(hex.q, hex.r), false)}
    >
      <div className="mk-hex-inner">
        <div className="mk-hex-clip"/>

        {/* Hex image */}
        <div className="mk-slot-clip mk-slot-clip-canvas">
          {hex.bild_url ? (
            <img src={hex.bild_url} style={{ width:'100%', height:'100%', objectFit:'cover', objectPosition: hex.bild_pos ? `${hex.bild_pos.x}% ${hex.bild_pos.y}%` : '50% 50%', display:'block' }} alt=""/>
          ) : null}
        </div>

        <HexBorder selected={selected} hovered={hovered} color={tcolor}/>

        {(hovered || selected) ? (
          <div className="mk-hex-coord">{hex.q} · {-hex.r}</div>
        ) : null}

        <div
          className="mk-hex-grip"
          draggable={true}
          onDragStart={(e) => onGripDragStart(e, hex)}
          onDragEnd={onGripDragEnd}
          onMouseDown={(e) => e.stopPropagation()}
          onClick={(e) => e.stopPropagation()}
          title="Hex ins Lager ziehen"
        >
          <svg width="14" height="10" viewBox="0 0 14 10" fill="none">
            <circle cx="3"  cy="3" r="1.2" fill="currentColor"/>
            <circle cx="7"  cy="3" r="1.2" fill="currentColor"/>
            <circle cx="11" cy="3" r="1.2" fill="currentColor"/>
            <circle cx="3"  cy="7" r="1.2" fill="currentColor"/>
            <circle cx="7"  cy="7" r="1.2" fill="currentColor"/>
            <circle cx="11" cy="7" r="1.2" fill="currentColor"/>
          </svg>
        </div>

        {!editing && (
          <div
            className="mk-hex-overlay"
            onMouseDown={(e) => e.stopPropagation()}
            onClick={(e) => { e.stopPropagation(); onSelect(hex.q, hex.r); }}
          />
        )}
      </div>
    </div>
  );
}

function HexGhost({ parentQ, parentR, dir, onAdd, onDropHex, isDropActive, onParentHover }) {
  const parent = axialToPixel(parentQ, parentR);
  const rad = (dir.ang * Math.PI) / 180;
  const px = parent.x + Math.cos(rad) * APOTHEM;
  const py = parent.y - Math.sin(rad) * APOTHEM;
  const [hover, setHover] = uS2(false);
  const isHot = isDropActive && hover;
  return (
    <button
      className="mk-ghost"
      title={`Neues Hexagon (${dir.label})`}
      style={{
        left: px, top: py,
        width:  isDropActive ? 56 : 42, height: isDropActive ? 56 : 42,
        marginLeft: isDropActive ? -28 : -21, marginTop: isDropActive ? -28 : -21,
        background: isHot ? 'rgba(160,140,255,0.45)' : undefined,
        borderColor: isHot ? 'rgba(220,210,255,0.95)' : undefined,
        boxShadow: isHot ? '0 0 24px rgba(160,140,255,0.8), 0 4px 14px rgba(0,0,0,0.5)' : undefined,
        color: isHot ? '#ffffff' : undefined,
        transform: isHot ? 'scale(1.18)' : undefined,
      }}
      onMouseDown={(e) => e.stopPropagation()}
      onClick={(e) => { e.stopPropagation(); onAdd(parentQ + dir.dq, parentR + dir.dr); }}
      onMouseEnter={() => { setHover(true); if (onParentHover) onParentHover(parentQ, parentR, true); }}
      onMouseLeave={() => { setHover(false); if (onParentHover) onParentHover(parentQ, parentR, false); }}
      onDragEnter={() => setHover(true)}
      onDragOver={(e) => { if (isDropActive) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; } }}
      onDragLeave={() => setHover(false)}
      onDrop={(e) => { e.preventDefault(); e.stopPropagation(); setHover(false); if (onDropHex) onDropHex(parentQ + dir.dq, parentR + dir.dr); }}
    >+</button>
  );
}

// Stash card — image from bild_url instead of image-slot
function StashCard({ hex, onDragStart, onDragEnd, isDragging, onFolderChange }) {
  const tcolor = terrainColor(hex.terrain);
  const [editFolder, setEditFolder] = uS2(false);
  const [folderVal, setFolderVal]   = uS2('');

  const startEdit = (e) => { e.stopPropagation(); setFolderVal(hex.folder || ''); setEditFolder(true); };
  const commitEdit = () => {
    const v = folderVal.trim();
    if (v !== (hex.folder || '')) onFolderChange(hex.id, v || null);
    setEditFolder(false);
  };

  return (
    <div
      className={`mk-stash-card${isDragging ? ' is-dragging' : ''}`}
      draggable={!editFolder}
      onDragStart={(e) => { if (!editFolder) onDragStart(e, hex); }}
      onDragEnd={onDragEnd}
      title={hex.name ? `${hex.name}${hex.terrain ? ' · ' + hex.terrain : ''}` : 'Unbenanntes Hex'}
      style={{ '--hex-color': tcolor }}
    >
      <div className="mk-stash-card-clip">
        {hex.bild_url ? (
          <img
            src={hex.bild_url}
            style={{ width:'100%', height:'100%', objectFit:'cover', objectPosition: hex.bild_pos ? `${hex.bild_pos.x}% ${hex.bild_pos.y}%` : '50% 50%', display:'block',
              clipPath:'polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%)' }}
            alt=""
          />
        ) : null}
      </div>
      <svg viewBox="0 0 84 88" width={84} height={88} style={{ position:'absolute', inset:0, overflow:'visible', pointerEvents:'none' }} preserveAspectRatio="none">
        <polygon points="42,1 83,22.5 83,65.5 42,87 1,65.5 1,22.5" fill="none" style={{ stroke: tcolor, strokeOpacity: 0.7 }} strokeWidth="1.2"/>
      </svg>
      <div className="mk-stash-card-label">
        {hex.terrain ? <div className="mk-stash-card-terr" style={{ color: tcolor }}>{hex.terrain}</div> : null}
        <div className="mk-stash-card-name">{hex.name || '— ohne Name —'}</div>
      </div>
      <div className="mk-stash-folder-badge">
        {editFolder ? (
          <input
            className="mk-stash-folder-input"
            autoFocus
            value={folderVal}
            placeholder="Ordner …"
            onChange={(e) => setFolderVal(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter') commitEdit(); if (e.key === 'Escape') setEditFolder(false); }}
            onBlur={commitEdit}
            onMouseDown={(e) => e.stopPropagation()}
          />
        ) : (
          <button className="mk-stash-folder-btn" onClick={startEdit} onMouseDown={(e) => e.stopPropagation()}>
            {hex.folder ? `⊞ ${hex.folder}` : '⊞'}
          </button>
        )}
      </div>
    </div>
  );
}

Object.assign(window, { HexBorder, HexTile, HexGhost, StashCard });
</script>


<!-- ═══════════════════════════════════════════════════
     Script 3 — Camera, pan/zoom, animation
     ═══════════════════════════════════════════════════ -->
<script type="text/babel">
const { useState: uS3, useEffect: uE3, useRef: uR3, useCallback: uC3 } = React;

function useCameraAnimator(camera, setCamera) {
  const animRef = uR3(null);

  const animateTo = uC3((target, duration = 650) => {
    if (animRef.current) cancelAnimationFrame(animRef.current.raf);
    const start = { ...camera };
    const t0 = performance.now();
    const tick = (now) => {
      const k = Math.min(1, (now - t0) / duration);
      const e = easeInOutCubic(k);
      const next = {
        x:    start.x    + (target.x    - start.x)    * e,
        y:    start.y    + (target.y    - start.y)    * e,
        zoom: start.zoom + (target.zoom - start.zoom) * e,
      };
      setCamera(next);
      if (k < 1) { animRef.current.raf = requestAnimationFrame(tick); }
      else { animRef.current = null; }
    };
    animRef.current = { raf: requestAnimationFrame(tick) };
  }, [camera, setCamera]);

  const cancelAnim = uC3(() => {
    if (animRef.current) { cancelAnimationFrame(animRef.current.raf); animRef.current = null; }
  }, []);

  uE3(() => () => cancelAnim(), [cancelAnim]);
  return { animateTo, cancelAnim };
}

Object.assign(window, { useCameraAnimator });
</script>


<!-- ═══════════════════════════════════════════════════
     Script 4 — Editor drawer
     ═══════════════════════════════════════════════════ -->
<script type="text/babel">
const { useState: uS4, useRef: uR4, useCallback: uC4 } = React;
const ImageUpload = window.ImageUpload;

function BildPosPad({ pos, onChange }) {
  const padRef = uR4(null);
  const dragging = uR4(false);

  const applyPos = (e) => {
    const rect = padRef.current.getBoundingClientRect();
    const x = Math.round(Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100)));
    const y = Math.round(Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100)));
    onChange({ x, y });
  };

  const p = pos || { x: 50, y: 50 };

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        <label style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.18em', textTransform:'uppercase', color:'rgba(160,140,255,0.6)' }}>Bildposition</label>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontFamily:'var(--font-mono)', fontSize:9, color:'rgba(160,140,255,0.4)' }}>{p.x}% · {p.y}%</span>
          <button
            onClick={() => onChange({ x: 50, y: 50 })}
            title="Bildposition zurücksetzen"
            style={{ fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.12em', textTransform:'uppercase', color:'rgba(160,140,255,0.6)', background:'rgba(124,77,255,0.08)', border:'1px solid rgba(124,77,255,0.22)', borderRadius:3, cursor:'pointer', padding:'2px 7px', lineHeight:1.6, transition:'all 0.15s' }}
            onMouseEnter={e => { e.currentTarget.style.background='rgba(124,77,255,0.18)'; e.currentTarget.style.borderColor='rgba(124,77,255,0.5)'; e.currentTarget.style.color='rgba(200,190,240,0.9)'; }}
            onMouseLeave={e => { e.currentTarget.style.background='rgba(124,77,255,0.08)'; e.currentTarget.style.borderColor='rgba(124,77,255,0.22)'; e.currentTarget.style.color='rgba(160,140,255,0.6)'; }}
          >↺ Reset</button>
        </div>
      </div>
      <div
        ref={padRef}
        style={{ width:'100%', height:72, background:'rgba(8,6,22,0.7)', border:'1px solid rgba(124,77,255,0.25)', borderRadius:3, position:'relative', cursor:'crosshair', userSelect:'none', flexShrink:0 }}
        onPointerDown={(e) => { dragging.current = true; e.currentTarget.setPointerCapture(e.pointerId); applyPos(e); }}
        onPointerMove={(e) => { if (dragging.current) applyPos(e); }}
        onPointerUp={() => { dragging.current = false; }}
      >
        {/* Grid lines */}
        <div style={{ position:'absolute', inset:0, backgroundImage:'linear-gradient(rgba(124,77,255,0.08) 1px,transparent 1px),linear-gradient(90deg,rgba(124,77,255,0.08) 1px,transparent 1px)', backgroundSize:'25% 33.33%', pointerEvents:'none' }}/>
        {/* Center crosshair */}
        <div style={{ position:'absolute', left:'50%', top:0, bottom:0, width:1, background:'rgba(124,77,255,0.15)', pointerEvents:'none' }}/>
        <div style={{ position:'absolute', top:'50%', left:0, right:0, height:1, background:'rgba(124,77,255,0.15)', pointerEvents:'none' }}/>
        {/* Focal dot */}
        <div style={{ position:'absolute', left:`${p.x}%`, top:`${p.y}%`, transform:'translate(-50%,-50%)', width:10, height:10, borderRadius:'50%', background:'rgba(200,180,255,0.95)', boxShadow:'0 0 8px rgba(124,77,255,0.9)', border:'1.5px solid rgba(255,255,255,0.6)', pointerEvents:'none' }}/>
      </div>
    </div>
  );
}

function EditorDrawer({ hex, onChange, onClose, onDelete, onNavigateInto, onCreateSubmap }) {
  if (!hex) return null;

  const updateDraft = (key, val) => onChange({ ...hex, [key]: val });

  const handleSubmapAction = () => {
    if (hex.has_submap) {
      onNavigateInto(hex);
      onClose();
    } else {
      onCreateSubmap(hex);
    }
  };

  return (
    <React.Fragment>
      <div className="mk-drawer-backdrop"/>
      <aside className="mk-drawer" onMouseDown={(e) => e.stopPropagation()}>
        <header className="mk-drawer-head">
          <div>
            <div className="mk-drawer-eyebrow">Hexagon · DM-Editor</div>
            <div className="mk-drawer-title">{hex.name || 'Unbenannt'}</div>
            <div className="mk-drawer-coords">X {hex.q} · Y {-hex.r}</div>
          </div>
          <button className="mk-drawer-close" onClick={onClose} title="Schließen (Esc)">×</button>
        </header>

        <div className="mk-drawer-body">
          <ImageUpload
            shape="hex"
            imageUrl={hex.bild_url}
            onUploaded={(url) => updateDraft('bild_url', url)}

              title={hex.has_submap ? 'Subkarte öffnen' : 'Subkarte anlegen'}

              <span style={{ fontSize: 14 }}>⬡</span>
              <span>{hex.has_submap ? 'Subkarte →' : 'Subkarte anlegen'}</span>
            </button>

              className={`mk-tool-btn${hex.visible ? ' is-active' : ''}`}
              style={{ width:'calc(50% - 4px)', justifyContent:'center', gap:6, fontSize:11, letterSpacing:'0.12em' }}
              onClick={() => updateDraft('visible', !hex.visible)}
              title="Spieler-Sichtbarkeit umschalten"
            >
              {hex.visible
                ? <React.Fragment><span style={{color:'rgba(80,200,140,0.9)'}}>◆</span> Sichtbar</React.Fragment>
                : <React.Fragment><span style={{color:'rgba(124,77,255,0.4)'}}>○</span> Verborgen</React.Fragment>
              }
            </button>
          </div>

          {/* Name */}
          <div className="mk-field">
            <label htmlFor="mk-name">Name</label>
            <input
              id="mk-name" className="mk-input" type="text"
              placeholder="z. B. Sturmkrone, Aschewüste …"
              value={hex.name || ''}
              onChange={(e) => updateDraft('name', e.target.value)}
            />
          </div>

          {/* Terrain */}
          <div className="mk-field">
            <label htmlFor="mk-terrain">Gelände</label>
            <select
              id="mk-terrain" className="mk-select"
              value={hex.terrain || ''}
              onChange={(e) => updateDraft('terrain', e.target.value)}
            >
              {TERRAINS.map((t) => (
                <option key={t} value={t}>{t || '— bitte wählen —'}</option>
              ))}
            </select>
          </div>

          {/* Features */}
          <div className="mk-field">
            <label htmlFor="mk-features">Besonderheiten</label>
            <textarea
              id="mk-features" className="mk-textarea"
              placeholder="Heilige Quelle, Ruinen, Drachenhort …"
              value={hex.features || ''}
              onChange={(e) => updateDraft('features', e.target.value)}
            />
          </div>

          {/* Beschreibung */}
          <div className="mk-field">
            <label htmlFor="mk-desc">Beschreibung</label>
            <textarea
              id="mk-desc" className="mk-textarea"
              placeholder="Stimmung, Geschichte, Bewohner …"
              value={hex.beschreibung || ''}
              onChange={(e) => updateDraft('beschreibung', e.target.value)}

          </div>

        </div>

        <footer className="mk-drawer-foot">
          <button className="mk-btn-danger" onClick={onDelete}>✕ Hex löschen</button>
          <button className="mk-btn-primary" onClick={onClose}>✓ Übernehmen</button>
        </footer>
      </aside>
    </React.Fragment>
  );
}

Object.assign(window, { EditorDrawer });

<script type="text/babel">

    </div>
  );
}

function MerMap() {
  // ─── Auth state ────────────────────────────────────────
  const [authState, setAuthState] = uS5('loading'); // 'loading' | 'ok' | 'denied'

  // ─── Map navigation state ──────────────────────────────

  // ─── Map data state ────────────────────────────────────
  const [hexes, setHexes]     = uS5({});
  const [stash, setStash]     = uS5([]);
  const [camera, setCamera]   = uS5({ x: 0, y: 0, zoom: 1 });
  const [selectedKey, setSel] = uS5(null);
  const [hoveredKey, setHov]  = uS5(null);
  const [editing, setEditing] = uS5(false);
  const [confirm, setConfirm] = uS5(null);
  const [lagerOpen, setLagerOpen] = uS5(false);
  const [activeLagerFolder, setActiveLagerFolder] = uS5('__all__');
  const [extraFolders, setExtraFolders]   = uS5([]);
  const [addingFolder, setAddingFolder]   = uS5(false);
  const [newFolderVal, setNewFolderVal]   = uS5('');
  const [renamingFolder, setRenamingFolder] = uS5(null);
  const [renameFolderVal, setRenameFolderVal] = uS5('');
  const [isLoading, setIsLoading] = uS5(true);
  const [migrationBanner, setMigrationBanner] = uS5(false);

  const [dragInfo, setDragInfo]   = uS5(null);
  const stageRef = uR5(null);
  const [vp, setVp]               = uS5({ w: window.innerWidth, h: window.innerHeight });
  const drag                      = uR5({ active: false, lx: 0, ly: 0 });
  const [isDragging, setIsDragging] = uS5(false);
  const worldRef = uR5(null);
  const willChangeTimer = uR5(null);
  const setWorldAnimating = (on) => {
    clearTimeout(willChangeTimer.current);

      worldRef.current?.classList.add('is-animating');

      willChangeTimer.current = setTimeout(() => worldRef.current?.classList.remove('is-animating'), 150);
    }
  };
  const [bgUrl, setBgUrl]           = uS5(null);
  const [bgUploading, setBgUploading] = uS5(false);
  const bgFileRef = uR5(null);
  const [bgTransform, setBgTransform] = uS5({ x: 0, y: 0, scale: 1 });
  const [bgAlignMode, setBgAlignMode] = uS5(false);
  const bgAlignModeRef = uR5(false);
  const cameraRef = uR5({ x: 0, y: 0, zoom: 1 });

  // Ref so debounced saves always have current mapId
  const currentMapIdRef = uR5(null);
  uE5(() => { currentMapIdRef.current = currentMapId; }, [currentMapId]);
  uE5(() => { bgAlignModeRef.current = bgAlignMode; }, [bgAlignMode]);
  uE5(() => { cameraRef.current = camera; }, [camera]);

  // ─── Undo history ──────────────────────────────────────
  const [history, setHistory] = uS5([]);
  const stateRef = uR5({ hexes: {}, stash: [] });

  const pushHistory = uC5(() => {
    setHistory((h) => {
      const snap = {
        hexes: JSON.parse(JSON.stringify(stateRef.current.hexes)),
        stash: JSON.parse(JSON.stringify(stateRef.current.stash)),
      };
      const next = [...h, snap];
      return next.length > 30 ? next.slice(next.length - 30) : next;
    });
  }, []);

  const undo = uC5(() => {
    setHistory((h) => {
      if (h.length === 0) return h;
      const last = h[h.length - 1];
      setHexes(last.hexes);
      setStash(last.stash);
      setSel(null); setEditing(false);

  }, []);

  // ─── Auth check & initial load ─────────────────────────
  uE5(() => {
    async function init() {
      // Auth check
      const { data: { user } } = await window._sb.auth.getUser();

      const { data: profile } = await window._sb.from('profiles')
        .select('role').eq('id', user.id).single();
      if (profile?.role !== 'dm') { setAuthState('denied'); setIsLoading(false); return; }
      setAuthState('ok');

      // Load or create root map
      const rootMap = await loadOrCreateRootMap();
      setCurrentMapId(rootMap.id);
      setCurrentMapName(rootMap.name || 'Meruria');
      setBgUrl(rootMap.bg_url || null);
      setBgTransform(rootMap.bg_transform || { x: 0, y: 0, scale: 1 });
      currentMapIdRef.current = rootMap.id;

      // Load hexes + stash
      const [sbHexes, sbStash] = await Promise.all([
        loadHexes(rootMap.id),
        loadStash(),
      ]);
      setHexes(sbHexes);
      setStash(sbStash);

      // Check for localStorage migration offer
      if (Object.keys(sbHexes).length === 0) {
        const localData = getLocalData();
        if (localData && Object.keys(localData.hexes || {}).length > 0) {
          setMigrationBanner(true);
        }
      }

      setIsLoading(false);
    }

  }, []);

  // ─── Reload hexes when map changes ────────────────────
  const [hexesMapId, setHexesMapId] = uS5(null);
  uE5(() => {
    if (!currentMapId || currentMapId === hexesMapId) return;

    setIsLoading(true);
    setSel(null); setEditing(false);
    loadHexes(currentMapId).then(h => {
      setHexes(h);
      setIsLoading(false);
    });
  }, [currentMapId, hexesMapId]);

  // ─── Auto-open Lager on drag ───────────────────────────
  uE5(() => { if (dragInfo?.fromMap) setLagerOpen(true); }, [dragInfo]);

  // ─── Viewport ─────────────────────────────────────────
  uE5(() => {
    const onResize = () => setVp({ w: window.innerWidth, h: window.innerHeight });
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  // ─── Camera animator ──────────────────────────────────
  const { animateTo, cancelAnim } = useCameraAnimator(camera, setCamera);

  // ─── Pan (middle mouse) / BG drag (left mouse in align mode) ────────────
  uE5(() => {
    const onDown = (e) => {
      const isMid = e.button === 1;
      const isBgDrag = e.button === 0 && bgAlignModeRef.current;
      if (!isMid && !isBgDrag) return;
      if (!stageRef.current?.contains(e.target)) return;
      e.preventDefault();
      drag.current.active = true; drag.current.lx = e.clientX; drag.current.ly = e.clientY;
      setIsDragging(true); cancelAnim(); setWorldAnimating(true);
    };
    const onMove = (e) => {
      if (!drag.current.active) return;
      const dx = e.clientX - drag.current.lx, dy = e.clientY - drag.current.ly;
      drag.current.lx = e.clientX; drag.current.ly = e.clientY;
      if (bgAlignModeRef.current) {
        const z = cameraRef.current.zoom;
        setBgTransform((t) => ({ ...t, x: t.x + dx / z, y: t.y + dy / z }));
      } else {
        setCamera((c) => ({ ...c, x: c.x - dx / c.zoom, y: c.y - dy / c.zoom }));
      }
    };
    const onUp = () => { drag.current.active = false; setIsDragging(false); setWorldAnimating(false); };
    window.addEventListener('pointerdown', onDown, { capture: true, passive: false });
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    return () => {
      window.removeEventListener('pointerdown', onDown, true);
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
    };
  }, [cancelAnim]);

  // ─── Zoom / BG scale ──────────────────────────────────
  const onWheel = (e) => {
    e.preventDefault(); cancelAnim(); setWorldAnimating(true); setWorldAnimating(false);
    const factor = Math.exp(-e.deltaY * 0.0015);
    if (bgAlignModeRef.current) {
      setBgTransform((t) => ({ ...t, scale: Math.max(0.05, Math.min(20, t.scale * factor)) }));
    } else {
      setCamera((c) => {
        const nextZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, c.zoom * factor));
        const rect = stageRef.current.getBoundingClientRect();
        const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
        const cx = editing ? (rect.width - DRAWER_W) / 2 : rect.width / 2;
        const cy = rect.height / 2;
        const wx = c.x + (sx - cx) / c.zoom, wy = c.y + (sy - cy) / c.zoom;
        return { x: wx - (sx - cx) / nextZoom, y: wy - (sy - cy) / nextZoom, zoom: nextZoom };

  };
  uE5(() => {
    const el = stageRef.current; if (!el) return;
    const handler = (e) => onWheel(e);
    el.addEventListener('wheel', handler, { passive: false });
    return () => el.removeEventListener('wheel', handler);
  }, [editing, camera]);

  }, [animateTo, camera.zoom]);

  const onHexClick = uC5((q, r) => { focusHex(q, r, true); setLagerOpen(false); }, [focusHex]);
  const onHexHover = uC5((k, isEnter) => {
    setHov((cur) => isEnter ? k : (cur === k ? null : cur));
  }, []);
  const onGhostParentHover = uC5((q, r, isEnter) => onHexHover(hexKey(q, r), isEnter), [onHexHover]);

  // ─── Add hex ──────────────────────────────────────────
  const addHex = uC5(async (q, r) => {
    const k = hexKey(q, r);
    if (hexes[k]) return;

    const newId = crypto.randomUUID();

    setHexes((h) => ({ ...h, [k]: newHex }));

    const { x, y } = axialToPixel(q, r);
    animateTo({ x, y, zoom: camera.zoom }, 450);

  }, [hexes, pushHistory, animateTo, camera.zoom]);

  // ─── Debounced update hex ─────────────────────────────
  const saveDebounce = uR5({});
  const updateHex = uC5((next) => {
    const k = hexKey(next.q, next.r);

  const onHexGripDragEnd = uC5(() => setDragInfo(null), []);

  const onStashDragStart = uC5((e, h) => {
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', h.id); } catch(_) {}
    setDragInfo({ id: h.id, fromStash: true });
  }, []);
  const onStashDragEnd = uC5(() => setDragInfo(null), []);

  const dropOnGhost = uC5((toQ, toR) => {
    if (!dragInfo) return;

    const tk = hexKey(toQ, toR);
    if (info.fromMap) {
      const oldKey = hexKey(info.fromQ, info.fromR);
      const h = hexes[oldKey]; if (!h) return;
      pushHistory();
      setHexes((prev) => {
        const out = { ...prev }; delete out[oldKey];

  uE5(() => {
    if (!currentMapId) return;
    clearTimeout(bgTransformSaveTimer.current);
    bgTransformSaveTimer.current = setTimeout(() => {
      window._sb.from('karte_maps')
        .update({ bg_transform: bgTransform })
        .eq('id', currentMapIdRef.current)
        .then(({ error }) => { if (error) console.error('bg_transform save:', error); });

  const deleteSelected = () => {
    if (!selectedKey) return;
    const h = hexes[selectedKey]; if (!h) return;
    const hasSubmap = h.has_submap && h.submap_id;

      title: 'Hexagon entfernen?',
      message: hasSubmap
        ? `„${h.name || `Hex ${h.q}·${-h.r}`}" hat eine Subkarte. Beides wird endgültig gelöscht.`
        : `„${h.name || `Hex ${h.q}·${-h.r}`}" wird endgültig aus der Karte gelöscht.`,
      onYes: async () => {
        pushHistory();

        setSel(null); setEditing(false); setConfirm(null);

        sbDeleteHex(h.id);
      },
    });

    setCurrentMapName(hex.name || subMap?.name || 'Subkarte');
    setBgUrl(subMap?.bg_url || null);
    setBgTransform(subMap?.bg_transform || { x: 0, y: 0, scale: 1 });
    setBgAlignMode(false);

    const target = mapStack[i];

    setMapStack((s) => s.slice(0, i));
    setCurrentMapId(target.id);
    setCurrentMapName(target.name);
    setBgUrl(target.bgUrl || null);

    const k = hexKey(hex.q, hex.r);
    await sbUpsertHex(currentMapIdRef.current, hex);
    const { data: newMap, error } = await window._sb.from('karte_maps')
      .insert({ name: hex.name || 'Subkarte', parent_hex_id: hex.id })
      .select('id, name')
      .single();
    if (error) { console.error('createSubmap:', error); return; }
    const updatedHex = { ...hex, has_submap: true, submap_id: newMap.id };
    setHexes((h) => ({ ...h, [k]: updatedHex }));
    sbUpsertHex(currentMapIdRef.current, updatedHex);
    setMapStack((s) => [...s, { id: currentMapId, name: currentMapName, bgUrl, bgTransform }]);
    setCurrentMapId(newMap.id);
    setCurrentMapName(hex.name || newMap.name);
    setBgUrl(null);
    setBgTransform({ x: 0, y: 0, scale: 1 });
    setBgAlignMode(false);
    setEditing(false); setSel(null);
  }, [currentMapId, currentMapName, bgUrl, bgTransform]);

  // ─── Migration from localStorage ──────────────────────
  const handleMigrate = uC5(async () => {
    const localData = getLocalData();
    if (!localData) { setMigrationBanner(false); return; }
    const hexEntries = Object.values(localData.hexes || {});
    // Insert hexes
    for (const h of hexEntries) {
      const newId = crypto.randomUUID();
      await window._sb.from('karte_hexes').insert({
        id: newId, map_id: currentMapIdRef.current, q: h.q, r: h.r,
        name: h.name || '', terrain: h.terrain || '', features: h.features || '',
        beschreibung: h.desc || '', bild_url: '', visible: false, has_submap: false,
      });
    }
    // Insert stash
    for (const s of localData.stash || []) {
      await window._sb.from('karte_stash').insert({
        id: crypto.randomUUID(), name: s.name || '', terrain: s.terrain || '',
        features: s.features || '', beschreibung: s.desc || '', bild_url: '',
      });
    }
    // Reload
    const [newHexes, newStash] = await Promise.all([
      loadHexes(currentMapIdRef.current),
      loadStash(),
    ]);
    setHexes(newHexes);
    setStash(newStash);
    setMigrationBanner(false);
  }, []);

  // ─── Camera controls ──────────────────────────────────
  const resetView = () => animateTo({ x: 0, y: 0, zoom: 1 }, 550);
  const zoomBy = (factor) => {
    cancelAnim();
    setCamera((c) => ({ ...c, zoom: Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, c.zoom * factor)) }));
  };

  // ─── Close drawer ─────────────────────────────────────
  const closeDrawer = uC5(() => { setEditing(false); setSel(null); }, []);

  // Esc key
  uE5(() => {
    const onKey = (e) => {
      if (e.key === 'Escape') {
        if (confirm) setConfirm(null);
        else if (editing) closeDrawer();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [confirm, editing, closeDrawer]);

  // ─── Ghost buttons ────────────────────────────────────
  const ghosts = uM5(() => {
    const sources = [];
    if (dragInfo) {
      for (const k in hexes) sources.push(hexes[k]);
    } else {
      if (selectedKey && hexes[selectedKey]) sources.push(hexes[selectedKey]);
      if (hoveredKey && hoveredKey !== selectedKey && hexes[hoveredKey]) sources.push(hexes[hoveredKey]);
    }
    const out = [], seen = new Set();
    for (const src of sources) {
      for (const n of NEIGHBORS) {
        const nk = hexKey(src.q + n.dq, src.r + n.dr);
        if (hexes[nk]) continue;
        if (dragInfo?.fromMap && dragInfo.fromQ === src.q + n.dq && dragInfo.fromR === src.r + n.dr) continue;
        if (seen.has(nk)) continue;
        seen.add(nk);
        out.push({ key: `g-${src.q}-${src.r}-${n.label}`, parentQ: src.q, parentR: src.r, dir: n });
      }
    }
    return out;
  }, [hexes, selectedKey, hoveredKey, dragInfo]);

  // ─── World transform ──────────────────────────────────
  const centerX = editing ? (vp.w - DRAWER_W) / 2 : vp.w / 2;
  const centerY = (vp.h - 56) / 2;
  const worldTx = `translate(${centerX}px, ${centerY}px) scale(${camera.zoom}) translate(${-camera.x}px, ${-camera.y}px)`;

  const hexList = Object.values(hexes);
  const selectedHex = selectedKey ? hexes[selectedKey] : null;
  const mapEmpty = hexList.length === 0;

  const stashFolders = uM5(() => {
    const fromStash = stash.map(s => s.folder).filter(Boolean);
    return [...new Set([...extraFolders, ...fromStash])].sort();
  }, [stash, extraFolders]);

  const displayedStash = uM5(() =>
    activeLagerFolder === '__all__' ? stash : stash.filter(s => s.folder === activeLagerFolder)
  , [stash, activeLagerFolder]);

  // Auto-reset folder tab when active folder disappears entirely
  uE5(() => {
    if (activeLagerFolder !== '__all__'
      && !stash.some(s => s.folder === activeLagerFolder)
      && !extraFolders.includes(activeLagerFolder))
      setActiveLagerFolder('__all__');
  }, [stash, activeLagerFolder, extraFolders]);

  const createFolder = uC5(() => {
    const name = newFolderVal.trim();
    if (name && !stashFolders.includes(name)) {
      setExtraFolders(prev => [...prev, name]);
      setActiveLagerFolder(name);
    }
    setAddingFolder(false); setNewFolderVal('');
  }, [newFolderVal, stashFolders]);

  const renameFolder = uC5((oldName) => {
    const newName = renameFolderVal.trim();
    setRenamingFolder(null);
    if (!newName || newName === oldName) return;
    const affected = stash.filter(s => s.folder === oldName);
    setStash(prev => prev.map(s => s.folder === oldName ? { ...s, folder: newName } : s));
    affected.forEach(s => sbUpsertStash({ ...s, folder: newName }));
    setExtraFolders(prev => prev.map(f => f === oldName ? newName : f));
    if (activeLagerFolder === oldName) setActiveLagerFolder(newName);
  }, [renameFolderVal, stash, activeLagerFolder]);

  // ─── Auth gates ───────────────────────────────────────
  if (authState === 'loading' || (authState === 'ok' && isLoading && !currentMapId)) {
    return (
      <div style={{
        position:'fixed', inset:0, display:'flex', alignItems:'center', justifyContent:'center',
        background:'#05040f', fontFamily:'var(--font-mono)', fontSize:10,
        letterSpacing:'0.28em', color:'rgba(124,77,255,0.6)', textTransform:'uppercase',
      }}>
        ◈ Lade Karte …
      </div>
    );
  }

  if (authState === 'denied') {
    return (
      <div style={{
        position:'fixed', inset:0, display:'flex', alignItems:'center', justifyContent:'center',
        flexDirection:'column', gap:16, background:'#05040f',
        fontFamily:'var(--font-mono)', letterSpacing:'0.18em', textTransform:'uppercase',
      }}>
        <div style={{ fontSize:10, color:'rgba(200,100,100,0.7)' }}>◈ Kein Zugriff</div>
        <div style={{ fontSize:8, color:'rgba(124,77,255,0.4)' }}>DM-Konto erforderlich</div>
        <a href="index.html" style={{ marginTop:8, fontSize:8, color:'rgba(124,77,255,0.5)', textDecoration:'none' }}>◂ zurück</a>
      </div>
    );
  }

  return (
    <React.Fragment>
      <style>{`:root { --lager-h: ${lagerOpen ? 138 : 0}px; }`}</style>

      {/* Top bar with breadcrumb */}
      <header className="mk-topbar">
        <a className="mk-back" href="index.html">◂ Meruria</a>
        <span className="mk-title">KARTENMANAGEMENT</span>
        {/* Breadcrumb */}
        {(mapStack.length > 0 || true) && (
          <div style={{
            display:'flex', alignItems:'center', gap:6, marginLeft:14,
            fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.18em',
            textTransform:'uppercase',
          }}>
            {mapStack.map((m, i) => (
              <React.Fragment key={m.id}>
                <button
                  onClick={() => navigateUp(i)}
                  style={{
                    background:'transparent', border:'none', cursor:'pointer',
                    fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.18em',
                    color:'rgba(124,77,255,0.6)', textTransform:'uppercase', padding:'2px 4px',
                    transition:'color 0.15s',
                  }}
                  onMouseEnter={e => e.currentTarget.style.color='rgba(200,190,240,0.9)'}
                  onMouseLeave={e => e.currentTarget.style.color='rgba(124,77,255,0.6)'}
                >{m.name || 'Karte'}</button>
                <span style={{ color:'rgba(124,77,255,0.3)' }}>›</span>
              </React.Fragment>
            ))}
            <span style={{ color:'rgba(160,140,255,0.7)' }}>{currentMapName}</span>
          </div>
        )}
        <div style={{ flex: 1 }}/>
        <span style={{
          fontFamily:'var(--font-mono)', fontSize:'9px', letterSpacing:'0.28em',
          color:'rgba(160,140,255,0.55)', textTransform:'uppercase',
        }}>
          {isLoading ? '◈ lade …' : `${hexList.length} ${hexList.length === 1 ? 'Hex' : 'Hexe'} · ${stash.length} im Lager`}
        </span>
      </header>

      {/* Stage */}
      <div
        ref={stageRef}
        className={`mk-stage${isDragging ? ' is-dragging' : ''}${dragInfo ? ' is-drop-active' : ''}${bgAlignMode ? ' bg-align-mode' : ''}`}
        style={{ top: 56 }}
        onClick={() => { if (editing && !bgAlignMode) closeDrawer(); }}
        onDragOver={mapEmpty && dragInfo?.fromStash ? (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; } : undefined}
        onDrop={mapEmpty && dragInfo?.fromStash ? (e) => { e.preventDefault(); dropOnEmptyMap(); } : undefined}
      >
        {!isLoading && (
          <div ref={worldRef} className={`mk-world${bgUrl ? ' has-bg' : ''}`} style={{ transform: worldTx, '--zoom': camera.zoom, '--label-scale': 1 / Math.sqrt(camera.zoom) }}>
            {bgUrl && (
              <img
                src={bgUrl}
                style={{
                  position:'absolute', left:0, top:0,
                  transform:`translate(${bgTransform.x}px,${bgTransform.y}px) scale(${bgTransform.scale}) translate(-50%,-50%)`,
                  transformOrigin:'0 0',
                  maxWidth:'none', zIndex:0, pointerEvents:'none', userSelect:'none', opacity:0.9,
                }}
                alt=""
                draggable={false}
              />
            )}
            {hexList.map((h) => (
              <HexTile
                key={hexKey(h.q, h.r)}
                hex={h}
                selected={hexKey(h.q, h.r) === selectedKey}
                hovered={hexKey(h.q, h.r) === hoveredKey}
                editing={editing && hexKey(h.q, h.r) === selectedKey}
                onSelect={onHexClick}
                onHoverChange={onHexHover}
                onGripDragStart={onHexGripDragStart}
                onGripDragEnd={onHexGripDragEnd}
                gripDragging={dragInfo?.fromMap && dragInfo.id === h.id}
              />
            ))}
            <div className="mk-labels-layer">
              {hexList.map((h) => <HexLabel key={`lbl-${h.id}`} hex={h}/>)}
            </div>
            {ghosts.map((g) => (
              <HexGhost
                key={g.key}
                parentQ={g.parentQ} parentR={g.parentR}
                dir={g.dir}
                onAdd={addHex}
                onDropHex={dropOnGhost}
                isDropActive={!!dragInfo}
                onParentHover={onGhostParentHover}
              />
            ))}
          </div>
        )}

        {/* BG align mode — overlay captures pointer events so hexes can't be clicked */}
        {bgAlignMode && bgUrl && (
          <div style={{
            position:'absolute', inset:0, zIndex:10,
            cursor: isDragging ? 'grabbing' : 'grab',
          }}/>
        )}

        {/* BG align mode banner */}
        {bgAlignMode && (
          <div style={{
            position:'absolute', top:16, left:'50%', transform:'translateX(-50%)',
            zIndex:60, pointerEvents:'none',
            background:'rgba(124,77,255,0.22)', border:'1px solid rgba(200,180,255,0.45)',
            borderRadius:3, padding:'6px 18px',
            fontFamily:'var(--font-mono)', fontSize:'9.5px', letterSpacing:'0.22em',
            textTransform:'uppercase', color:'rgba(220,210,255,0.9)',
          }}>
            Hintergrund-Modus · Ziehen = verschieben · Scrollen = Größe
          </div>
        )}

        {/* Empty-map hint */}
        {!isLoading && mapEmpty && (
          <div className={`mk-empty-map-hint${dragInfo?.fromStash ? ' is-drop-active' : ''}`}>
            <div className="h">Leere Karte</div>
            <div className="s">
              {dragInfo?.fromStash ? '↓ hier ablegen'
                : stash.length > 0 ? 'ziehe ein Hex aus dem Lager hierher'
                : 'beginne die Karte mit einem ersten Hex'}
            </div>
            {!dragInfo && (
              <button className="mk-empty-create" onClick={(e) => { e.stopPropagation(); addHex(0, 0); }}>
                + Erstes Hex erstellen
              </button>
            )}
          </div>
        )}
      </div>

      {/* HUD */}
      <div className="mk-hud">
        <div className="mk-hud-row"><span>◇ Zoom</span><span>{(camera.zoom * 100).toFixed(0)}%</span></div>
        <div className="mk-hud-row" style={{ marginTop:4, paddingTop:8, borderTop:'1px solid rgba(124,77,255,0.18)', color:'rgba(160,140,255,0.55)' }}>
          <span>◇ Mittel-Maustaste</span><span>Karte ziehen</span>
        </div>
        <div className="mk-hud-row" style={{ color:'rgba(160,140,255,0.55)' }}>
          <span>◇ Mausrad</span><span>Zoom</span>
        </div>
        <div className="mk-hud-row" style={{ color:'rgba(160,140,255,0.55)' }}>
          <span>◇ Klick</span><span>Bearbeiten</span>
        </div>
        <div className="mk-hud-row" style={{ color:'rgba(160,140,255,0.55)' }}>
          <span>◇ Grip ziehen</span><span>Ins Lager</span>
        </div>
      </div>

      {/* Bottom-right tools */}
      <div className="mk-tools">
        <button
          className={`mk-tool-btn${bgUrl ? ' is-active' : ''}`}
          title={bgUrl ? 'Kartenhintergrund ersetzen' : 'Kartenhintergrund wählen'}
          onClick={() => bgFileRef.current?.click()}
          disabled={bgUploading}
        >
          {bgUploading
            ? <span style={{ fontSize: 10 }}>…</span>
            : <svg width="18" height="16" viewBox="0 0 18 16" fill="none" stroke="currentColor" strokeWidth="1.4">
                <rect x="1" y="3" width="16" height="11" rx="1"/>
                <circle cx="6" cy="8.5" r="2"/>
                <path d="M10 11 L13 7 L16 11"/>
              </svg>
          }
        </button>
        <input ref={bgFileRef} type="file" accept="image/*" style={{ display:'none' }} onChange={e => uploadBg(e.target.files[0])}/>
        {bgUrl && (
          <button
            className={`mk-tool-btn${bgAlignMode ? ' is-active' : ''}`}
            title={bgAlignMode ? 'Hintergrund sperren' : 'Hintergrund ausrichten'}
            onClick={() => setBgAlignMode(v => !v)}
          >
            {bgAlignMode
              ? <svg width="16" height="18" viewBox="0 0 16 18" fill="none" stroke="currentColor" strokeWidth="1.5">
                  <rect x="2" y="8" width="12" height="9" rx="1.5"/>
                  <path d="M5 8V5a3 3 0 0 1 6 0v3"/>
                  <line x1="8" y1="12" x2="8" y2="14"/>
                </svg>
              : <svg width="16" height="18" viewBox="0 0 16 18" fill="none" stroke="currentColor" strokeWidth="1.5">
                  <rect x="2" y="8" width="12" height="9" rx="1.5"/>
                  <path d="M5 8V5a3 3 0 0 1 6 0" strokeDasharray="2 1.5"/>
                  <line x1="8" y1="12" x2="8" y2="14"/>
                </svg>
            }
          </button>
        )}
        <button className="mk-tool-btn" title="Vergrößern" onClick={() => zoomBy(1.25)}>+</button>
        <button className="mk-tool-btn" title="Verkleinern" onClick={() => zoomBy(0.8)}>−</button>
        <button className="mk-tool-btn" title="Ansicht zurücksetzen" onClick={resetView}>
          <span className="lbl">⌖</span>
        </button>
        <button
          className={`mk-tool-btn${history.length === 0 ? ' is-disabled' : ''}`}
          title={history.length === 0 ? 'Nichts rückgängig' : 'Rückgängig'}
          onClick={history.length === 0 ? undefined : undo}
          disabled={history.length === 0}
        >
          <span className="lbl" style={{ fontSize:13 }}>↺</span>
        </button>
        <button
          className={`mk-tool-btn${lagerOpen ? ' is-active' : ''}`}
          title={`${lagerOpen ? 'Lager schließen' : 'Lager öffnen'} (${stash.length})`}
          onClick={() => setLagerOpen((v) => !v)}
        >
          <svg width="22" height="20" viewBox="0 0 22 20" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round" style={{display:'block'}}>
            <path d="M2.5 9 Q2.5 3 11 3 Q19.5 3 19.5 9"/>
            <rect x="2.5" y="9" width="17" height="8.5" rx="0.5"/>
            <line x1="2.5" y1="12" x2="19.5" y2="12"/>
            <line x1="11" y1="3" x2="11" y2="9"/>
            <rect x="9.3" y="10.3" width="3.4" height="3.4" fill="currentColor" fillOpacity="0.55"/>
            <circle cx="11" cy="12" r="0.6" fill="#05040f"/>
          </svg>
          {stash.length > 0 && (
            <span style={{
              position:'absolute', top:-6, right:-6, minWidth:16, height:16, padding:'0 4px',
              borderRadius:8, background:'rgba(124,77,255,0.95)', color:'#fff',
              fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.05em',
              display:'flex', alignItems:'center', justifyContent:'center',
              boxShadow:'0 0 8px rgba(160,140,255,0.7)',
            }}>{stash.length}</span>
          )}
        </button>
      </div>

      {/* Lager sidebar */}
      {lagerOpen && (
        <div
          className={`mk-lager${dragInfo?.fromMap ? ' is-drop-active' : ''}`}
          onDragOver={dragInfo?.fromMap ? (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; } : undefined}
          onDrop={dragInfo?.fromMap ? (e) => { e.preventDefault(); dropOnLager(); } : undefined}
        >
          {/* Header mit inline Ordner-Tabs */}
          <div className="mk-lager-header">
            <span className="mk-lager-title">◈ Lager</span>
            <div className="mk-lager-tabs">
              <button
                className={`mk-lager-folder-tab${activeLagerFolder === '__all__' ? ' is-active' : ''}`}
                onClick={() => setActiveLagerFolder('__all__')}
              >
                Alle <span className="tab-count">{stash.length}</span>
              </button>
              {stashFolders.map(f => (
                renamingFolder === f ? (
                  <input
                    key={f}
                    className="mk-lager-folder-input"
                    autoFocus
                    value={renameFolderVal}
                    onChange={(e) => setRenameFolderVal(e.target.value)}
                    onKeyDown={(e) => { if (e.key === 'Enter') renameFolder(f); if (e.key === 'Escape') setRenamingFolder(null); }}
                    onBlur={() => renameFolder(f)}
                  />
                ) : (
                  <button
                    key={f}
                    className={`mk-lager-folder-tab${activeLagerFolder === f ? ' is-active' : ''}`}
                    onClick={() => setActiveLagerFolder(f)}
                    onDoubleClick={() => { setRenamingFolder(f); setRenameFolderVal(f); }}
                    title={`${f} — Doppelklick zum Umbenennen`}
                  >
                    {f} <span className="tab-count">{stash.filter(s => s.folder === f).length}</span>
                  </button>
                )
              ))}
              {addingFolder ? (
                <input
                  className="mk-lager-folder-input"
                  autoFocus
                  value={newFolderVal}
                  placeholder="Name …"
                  onChange={(e) => setNewFolderVal(e.target.value)}
                  onKeyDown={(e) => { if (e.key === 'Enter') createFolder(); if (e.key === 'Escape') { setAddingFolder(false); setNewFolderVal(''); } }}
                  onBlur={createFolder}
                />
              ) : (
                <button className="mk-lager-folder-add" onClick={() => setAddingFolder(true)} title="Neuen Ordner erstellen">+</button>
              )}
            </div>
            <span className="mk-lager-count">{stash.length === 0 ? 'leer' : `${stash.length} Hex${stash.length === 1 ? '' : 'e'}`}</span>
            <button className="mk-lager-toggle" onClick={() => setLagerOpen(false)} title="Lager schließen">×</button>
          </div>

          {/* Cards */}
          <div className="mk-lager-body">
            {stash.length === 0 ? (
              <div className="mk-lager-empty">
                {dragInfo?.fromMap ? '↓ hier ablegen, um zu lagern' : '— Hex am Grip greifen und hier ablegen —'}
              </div>
            ) : displayedStash.length === 0 ? (
              <div className="mk-lager-empty">— Keine Hexe in diesem Ordner —</div>
            ) : (
              displayedStash.map((h) => (
                <StashCard
                  key={h.id} hex={h}
                  onDragStart={onStashDragStart} onDragEnd={onStashDragEnd}
                  isDragging={dragInfo?.fromStash && dragInfo.id === h.id}
                  onFolderChange={onFolderChange}
                />
              ))
            )}
          </div>
        </div>
      )}

      {/* Editor drawer */}
      {editing && selectedHex && (
        <EditorDrawer
          hex={selectedHex}
          onChange={updateHex}
          onClose={closeDrawer}
          onDelete={deleteSelected}
          onNavigateInto={navigateInto}
          onCreateSubmap={createSubmap}
        />
      )}

      {/* Confirm dialog */}
      {confirm && (
        <div className="mk-confirm-bg" onClick={() => setConfirm(null)}>
          <div className="mk-confirm" onClick={(e) => e.stopPropagation()}>
            <h3>{confirm.title}</h3>
            <p>{confirm.message}</p>
            <div className="mk-confirm-row">
              <button className="mk-btn-danger" onClick={() => setConfirm(null)}>Abbrechen</button>
              <button className="mk-btn-primary" onClick={confirm.onYes}>Bestätigen</button>
            </div>
          </div>
        </div>
      )}

      {/* localStorage migration banner */}
      {migrationBanner && (
        <div style={{
          position:'fixed', bottom:24, left:'50%', transform:'translateX(-50%)',
          background:'rgba(10,7,28,0.97)', border:'1px solid rgba(124,77,255,0.4)',
          borderRadius:6, padding:'18px 24px', zIndex:500,
          fontFamily:'var(--font-body)', fontSize:13, fontWeight:300,
          color:'rgba(200,190,240,0.85)', maxWidth:420, textAlign:'center',
          boxShadow:'0 8px 32px rgba(0,0,0,0.5)',
        }}>
          <div style={{ fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.22em', color:'rgba(124,77,255,0.6)', textTransform:'uppercase', marginBottom:10 }}>
            Lokale Daten gefunden
          </div>
          <p style={{ margin:'0 0 14px', lineHeight:1.5 }}>
            Es gibt eine gespeicherte Karte aus dem alten Karte-Tool. Soll sie in die Cloud migriert werden?
          </p>
          <div style={{ fontSize:10, color:'rgba(124,77,255,0.45)', marginBottom:16 }}>
            Hinweis: Bilder müssen danach neu hochgeladen werden.
          </div>
          <div style={{ display:'flex', gap:10, justifyContent:'center' }}>
            <button
              onClick={handleMigrate}
              style={{
                fontFamily:'var(--font-display)', fontSize:10, letterSpacing:'0.18em',
                textTransform:'uppercase', padding:'9px 20px', cursor:'pointer',
                background:'rgba(124,77,255,0.18)', border:'1px solid rgba(124,77,255,0.5)',
                borderRadius:3, color:'rgba(200,190,240,0.9)', transition:'all .2s',
              }}
            >Migrieren</button>
            <button
              onClick={() => setMigrationBanner(false)}
              style={{
                fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.18em',
                textTransform:'uppercase', padding:'9px 16px', cursor:'pointer',
                background:'transparent', border:'1px solid rgba(124,77,255,0.2)',
                borderRadius:3, color:'rgba(124,77,255,0.5)', transition:'all .2s',
              }}
            >Überspringen</button>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<MerMap/>);
</script>


</body></html>
