<script type="text/babel">

/* ── Tag chip used on cards (small) ── */
function CardTag({ label, hue }) {
  const c = `oklch(0.72 0.16 ${hue})`;
  return (
    <span style={{
      fontFamily:'var(--font-mono)', fontSize:7.5,
      padding:'2px 6px',

      color:c, letterSpacing:'0.14em',
      textTransform:'uppercase', borderRadius:2,
      whiteSpace:'nowrap', lineHeight:1.3,
    }}>{label}</span>
  );
}

/* Pick first 2-3 tags for a card display, in facet order */
function pickCardTags(entry) {
  const facets = (F2[entry.cat] || []).filter(f => f.key !== 'seltenheit');
  const entryTags = entry.tags || {};
  const picked = [];
  for (const f of facets) {
    const vals = entryTags[f.key];
    if (vals && vals.length) {
      picked.push(vals[0]);
      if (picked.length >= 3) break;
    }
  }
  return picked;
}

          <svg viewBox="0 0 100 100" width="56" height="56" fill="none" stroke={cMain} style={{ color:cMain, opacity:0.22, zIndex:1 }}>
            {IC[entry.icon] || CIC[entry.cat]}
          </svg>
        ) : (
          <div style={{ position:'relative', width:56, height:56, display:'flex', alignItems:'center', justifyContent:'center', zIndex:1 }}>
            <svg viewBox="0 0 100 100" width="56" height="56" fill="rgba(124,77,255,0.15)" stroke="rgba(124,77,255,0.28)" style={{ animation:'unknownDrift 4s ease-in-out infinite' }}>
              {CIC[entry.cat]}
            </svg>
            <span style={{
              position:'absolute', fontFamily:'var(--font-display)', fontSize:28, fontWeight:300,
              color:'rgba(160,140,255,0.5)', textShadow:'0 0 14px rgba(124,77,255,0.4)',
              animation:'pulseGlow 2.4s ease-in-out infinite',
            }}>?</span>
          </div>
        )}

        {/* ID badge */}
        <div style={{
          position:'absolute', top:6, left:7,
          fontFamily:'var(--font-mono)', fontSize:6.5,
          color: found ? cA(0.85) : 'rgba(124,77,255,0.35)',
          letterSpacing:'0.16em', textTransform:'uppercase',
        }}>№ {entry.id.toUpperCase()}</div>

        {/* progress / unknown badge top-right */}
        {found && (
          <div style={{ position:'absolute', top:5, right:6 }}>
            <StageBadge stage={stage} cMain={cMain} cA={cA} compact/>
          </div>
        )}
        {!found && !entry.obscuredName && (
          <div style={{
            position:'absolute', top:5, right:6,
            padding:'2px 6px',
            border:'1px solid rgba(124,77,255,0.18)',
            fontFamily:'var(--font-mono)', fontSize:6.5,
            color:'rgba(160,140,255,0.4)', letterSpacing:'0.2em', textTransform:'uppercase',
          }}>unbekannt</div>
        )}
        {!found && entry.obscuredName && (
          <div style={{
            position:'absolute', top:5, right:6,
            padding:'2px 6px',
            border:`1px solid ${cA(0.25)}`,
            fontFamily:'var(--font-mono)', fontSize:7,
            color: cA(0.5), letterSpacing:'0.12em',
          }}>◈ GESPERRT</div>
        )}
      </div>

      {/* Text area */}
      <div style={{ padding:'9px 11px 10px', display:'flex', flexDirection:'column', gap:5, flex:1 }}>
        {/* Name */}
        {found || !entry.obscuredName ? (
          <div style={{
            fontFamily:'var(--font-display)', fontWeight:400, fontSize:11,
            letterSpacing:'0.1em', textTransform:'uppercase',
            color: found ? '#f0eeff' : 'rgba(180,170,220,0.45)',
            lineHeight:1.25,
            fontStyle: found ? 'normal' : 'italic',
            overflowWrap:'anywhere',
          }}>
            {entry.name}
          </div>
        ) : (
          <div style={{
            fontFamily:'var(--font-mono)', fontSize:10,
            letterSpacing:'0.14em',
            color: cA(0.65),
            textShadow: `0 0 8px ${cA(0.4)}, 0 0 18px ${cA(0.2)}`,
            lineHeight:1.3,
            userSelect:'none',
            overflowWrap:'anywhere',
          }}>
            {entry.obscuredName}
          </div>
        )}

        {/* Rarity row (pips + label) — price on right */}
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:8, minHeight:14 }}>
          <div style={{ display:'flex', alignItems:'center', gap:5, minWidth:0 }}>
            <RarityPips rarity={entry.rarity} small/>
            <span style={{
              fontFamily:'var(--font-mono)', fontSize:7.5, letterSpacing:'0.1em',
              color: found ? `oklch(0.72 0.16 ${rarHue} / 0.95)` : 'rgba(160,140,255,0.4)',
              textTransform:'uppercase', whiteSpace:'nowrap',
            }}>{rarObj.label}</span>
          </div>
          {showPrice && (
            <span style={{
              fontFamily:'var(--font-mono)', fontSize:9.5, fontWeight:600,
              color: isMax ? GD : 'oklch(0.82 0.14 80)',
              letterSpacing:'0.02em',
              whiteSpace:'nowrap', flexShrink:0,
            }}>{entry.price}<span style={{ fontSize:7, opacity:0.65, marginLeft:2, letterSpacing:'0.08em' }}>HADE</span></span>
          )}
        </div>

        {/* Tags row */}
        {tags.length > 0 && (
          <div style={{ display:'flex', flexWrap:'wrap', gap:3, marginTop:1 }}>
            {tags.map(t => <CardTag key={t} label={t} hue={hue}/>)}
          </div>
        )}

        {/* Locked-hint row (only for found entries below tagsOnCard) */}
        {found && stage < FU.tagsOnCard && (
          <div style={{
            fontFamily:'var(--font-mono)', fontSize:6.5,
            color:'rgba(160,140,255,0.4)', letterSpacing:'0.16em',
            textTransform:'uppercase', fontStyle:'italic', marginTop:2,
          }}>◇ Mehr ab Stufe {FU.tagsOnCard}</div>
        )}
      </div>
    </div>
  );
}

/* ── Detail Overlay (right-sliding panel) ── */
function DetailPanel({ entry, onClose }) {
  uE2(() => {
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);
  if (!entry) return null;
  const found = entry.found;
  const cMain = `oklch(0.72 0.16 ${entry.hue})`;
  const cA = (a) => `oklch(0.72 0.16 ${entry.hue} / ${a})`;
  const catObj = CATS.find(c => c.id === entry.cat);

  return (
    <div style={{
      position:'fixed', inset:0, zIndex:600, display:'flex', justifyContent:'flex-end',
      background:'rgba(4,3,13,0.7)', backdropFilter:'blur(4px)',
      animation:'fadeIn 0.2s ease',
    }} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{
        width:'min(560px, 92vw)', height:'100%',
        background:'rgba(8,6,22,0.99)', borderLeft:`1px solid ${cA(0.33)}`,
        boxShadow:`-20px 0 60px rgba(0,0,0,0.7), -20px 0 80px ${cA(0.13)}`,
        animation:'overlayIn 0.32s cubic-bezier(.2,.85,.2,1)',
        overflowY:'auto',
      }}>
        {/* Header — close */}
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'14px 22px', borderBottom:`1px solid ${found?cMain+'33':'rgba(124,77,255,0.12)'}`, position:'sticky', top:0, background:'rgba(8,6,22,0.98)', zIndex:5 }}>
          <div style={{ fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.3em', color:'rgba(160,140,255,0.5)', textTransform:'uppercase' }}>
            № {entry.id.toUpperCase()} · {catObj.label}
          </div>
          <button onClick={onClose} style={{
            background:'transparent', border:'1px solid rgba(124,77,255,0.3)',
            color:'rgba(200,190,240,0.7)', cursor:'pointer',
            padding:'4px 10px', fontFamily:'var(--font-mono)', fontSize:9,
            letterSpacing:'0.2em', textTransform:'uppercase', borderRadius:2,
          }}
            onMouseEnter={e=>{e.currentTarget.style.color='#f0eeff';e.currentTarget.style.borderColor=cMain;e.currentTarget.style.background=cMain+'18';}}
            onMouseLeave={e=>{e.currentTarget.style.color='rgba(200,190,240,0.7)';e.currentTarget.style.borderColor='rgba(124,77,255,0.3)';e.currentTarget.style.background='transparent';}}
          >ESC ×</button>
        </div>

        {/* Hero icon area */}
        <div style={{
          position:'relative', height:240,
          background: found ? mkStripeBg(entry.hue, 0.16) : mkStripeBg(280, 0.04),
          display:'flex', alignItems:'center', justifyContent:'center',
          borderBottom:`1px solid ${found?cMain+'33':'rgba(124,77,255,0.1)'}`,
        }}>
          {found && (
            <div style={{ position:'absolute', inset:0, background:`radial-gradient(ellipse at 50% 50%, ${cA(0.2)} 0%, transparent 65%)` }}/>
          )}
          {found ? (
            <svg viewBox="0 0 100 100" width="148" height="148" fill="none" stroke={cMain} style={{ color:cMain, filter:`drop-shadow(0 0 22px ${cA(0.67)})`, zIndex:1 }}>
              {IC[entry.icon] || CIC[entry.cat]}
            </svg>
          ) : entry.obscuredName ? (
            <svg viewBox="0 0 100 100" width="148" height="148" fill="none" stroke={cMain} style={{ color:cMain, opacity:0.18, zIndex:1 }}>
              {IC[entry.icon] || CIC[entry.cat]}
            </svg>
          ) : (
            <div style={{ position:'relative', width:160, height:160, display:'flex', alignItems:'center', justifyContent:'center' }}>
              <svg viewBox="0 0 100 100" width="160" height="160" fill="rgba(124,77,255,0.13)" stroke="rgba(124,77,255,0.25)">
                {CIC[entry.cat]}
              </svg>
              <span style={{ position:'absolute', fontFamily:'var(--font-display)', fontSize:84, fontWeight:300, color:'rgba(160,140,255,0.5)', animation:'pulseGlow 2.4s ease-in-out infinite' }}>?</span>
            </div>
          )}
          {/* corners */}
          <span style={{position:'absolute',top:0,left:0,width:18,height:18,borderTop:`2px solid ${cA(0.67)}`,borderLeft:`2px solid ${cA(0.67)}`, opacity: found?1:0.4}}/>
          <span style={{position:'absolute',top:0,right:0,width:18,height:18,borderTop:`2px solid ${cA(0.67)}`,borderRight:`2px solid ${cA(0.67)}`, opacity: found?1:0.4}}/>
          <span style={{position:'absolute',bottom:0,left:0,width:18,height:18,borderBottom:`2px solid ${cA(0.67)}`,borderLeft:`2px solid ${cA(0.67)}`, opacity: found?1:0.4}}/>
          <span style={{position:'absolute',bottom:0,right:0,width:18,height:18,borderBottom:`2px solid ${cA(0.67)}`,borderRight:`2px solid ${cA(0.67)}`, opacity: found?1:0.4}}/>
        </div>

        {/* Title */}
        <div style={{ padding:'22px 26px 8px' }}>
          <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:8 }}>
            <RarityPips rarity={entry.rarity}/>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.2em', color:`oklch(0.72 0.16 ${RAR[entry.rarity].hue})`, textTransform:'uppercase' }}>
              {RAR[entry.rarity].label}
            </span>
          </div>
          {(!found && entry.obscuredName) && (
            <div style={{ marginBottom:8, fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.28em', color:cA(0.5), textTransform:'uppercase' }}>◈ GESPERRT · NICHT IDENTIFIZIERT</div>
          )}
          <h2 style={(!found && entry.obscuredName) ? {
            fontFamily:'var(--font-mono)', fontSize:20, letterSpacing:'0.16em', lineHeight:1.2,
            color: cA(0.7), textShadow:`0 0 10px ${cA(0.4)}, 0 0 22px ${cA(0.18)}`, userSelect:'none',
          } : {
            fontFamily:'var(--font-display)', fontWeight:400, fontSize:24, letterSpacing:'0.16em', color:'#f0eeff', textTransform:'uppercase', lineHeight:1.2, fontStyle: found ? 'normal' : 'italic', opacity: found ? 1 : 0.6,
          }}>
            {(!found && entry.obscuredName) ? entry.obscuredName : entry.name}
          </h2>
        </div>

        {/* Body */}
        {found ? (
          <div style={{ padding:'12px 26px 32px' }}>
            {/* Forschungsfortschritt */}
            <div style={{ marginBottom:22 }}>
              <StageProgress stage={entry.stage || 1} cMain={cMain} cA={cA}/>
            </div>

            {/* Description (locked until stage 4) */}
            {(entry.stage || 1) >= FU.desc ? (
              <p style={{ fontFamily:'var(--font-body)', fontWeight:300, fontSize:13.5, color:'var(--silver)', lineHeight:1.75, marginBottom:22 }}>
                {entry.desc}
              </p>
            ) : (
              <div style={{
                marginBottom:22, padding:'14px 16px',
                border:'1px dashed rgba(124,77,255,0.22)',
                background:'rgba(124,77,255,0.03)',
                fontFamily:'var(--font-body)', fontStyle:'italic', fontWeight:300, fontSize:12.5,
                color:'rgba(180,170,220,0.5)', lineHeight:1.7,
              }}>
                <span style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.22em', color:cA(0.6), textTransform:'uppercase', marginRight:8 }}>◇ Gesperrt</span>
                Weitere Beobachtungen erforderlich, um die vollständige Beschreibung zu enthüllen.
              </div>
            )}

            {/* Field table */}
            <div style={{ display:'grid', gridTemplateColumns:'auto 1fr', gap:'10px 18px', padding:'18px 0 4px', borderTop:`1px solid ${cA(0.13)}` }}>
              <Field label="Vorkommen"        value={entry.habitat}    unlocked={(entry.stage||1) >= FU.habitat}/>
              <Field label="Größe"            value={entry.size}       unlocked={(entry.stage||1) >= FU.size}/>
              <Field label="Verkaufspreis"    value={entry.price != null ? `${entry.price} Hade` : '—'} unlocked={(entry.stage||1) >= FU.price}/>
              <Field label="Erstmals"         value={entry.date}       unlocked={(entry.stage||1) >= FU.date}/>
              <Field label="Dokumentiert von" value={entry.by}         unlocked={(entry.stage||1) >= FU.by}/>
              <Field label="Kategorie"        value={catObj.label}     unlocked/>
            </div>

            {/* Reward list */}
            <RewardList category={entry.cat} stage={entry.stage || 1} cMain={cMain} cA={cA} isMax={entry.stage >= MS}/>

            {/* Footer stamp */}
            <div style={{ marginTop:24, padding:'12px 14px',
              border:`1px dashed ${entry.stage >= MS ? 'oklch(0.82 0.14 80 / 0.55)' : cA(0.33)}`,
              background: entry.stage >= MS ? 'oklch(0.82 0.14 80 / 0.06)' : `${cA(0.04)}`,
              fontFamily:'var(--font-mono)', fontSize:9,
              color: entry.stage >= MS ? GD : cMain,
              letterSpacing:'0.16em', textTransform:'uppercase',
              display:'flex', alignItems:'center', justifyContent:'space-between',
            }}>
              <span>{entry.stage >= MS ? '✓ Komplett erforscht' : '◈ In Forschung'}</span>
              <span style={{ opacity:0.6 }}>Kollektikon · Meruria</span>
            </div>
          </div>
        ) : (
          <div style={{ padding:'14px 26px 32px' }}>
            <p style={{ fontFamily:'var(--font-body)', fontStyle:'italic', fontWeight:300, fontSize:13, color:'rgba(180,170,220,0.55)', lineHeight:1.75, marginBottom:18 }}>
              Bisher keine bestätigte Sichtung. Berichte aus zweiter Hand existieren, sind aber unzureichend verifiziert. Belohnung für verlässliche Beobachtung: nach Verhandlung mit der Bergungsgarde.
            </p>
            <div style={{ display:'grid', gridTemplateColumns:'auto 1fr', gap:'10px 18px', padding:'18px 0 4px', borderTop:'1px solid rgba(124,77,255,0.18)' }}>
              <Field label="Status"    value="Unbekannt"/>
              <Field label="Kategorie" value={catObj.label}/>
              <Field label="Geschätzte Seltenheit" value={RAR[entry.rarity].label}/>
              <Field label="Eintragsnummer" value={entry.id.toUpperCase()}/>
            </div>
            <div style={{ marginTop:24, padding:'12px 14px', border:'1px dashed rgba(124,77,255,0.25)', background:'rgba(124,77,255,0.04)',
              fontFamily:'var(--font-mono)', fontSize:9, color:'rgba(160,140,255,0.55)', letterSpacing:'0.16em', textTransform:'uppercase',
              display:'flex', alignItems:'center', justifyContent:'space-between',
            }}>
              <span>◇ Sichtung anonym melden</span>
              <span style={{ opacity:0.6 }}>Bergungsgarde · Arkanheim</span>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function Field({ label, value, unlocked = true }) {
  return (
    <>
      <span style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.22em', color:'rgba(160,140,255,0.5)', textTransform:'uppercase', whiteSpace:'nowrap', paddingTop:2 }}>
        {label}
      </span>
      {unlocked ? (
        <span style={{ fontFamily:'var(--font-body)', fontWeight:300, fontSize:13, color:'#f0eeff' }}>
          {value}
        </span>
      ) : (
        <span style={{ fontFamily:'var(--font-mono)', fontSize:10, color:'rgba(160,140,255,0.35)', letterSpacing:'0.18em', textTransform:'uppercase', display:'inline-flex', alignItems:'center', gap:6 }}>
          <span style={{ width:6, height:6, border:'1px solid rgba(160,140,255,0.35)', display:'inline-block' }}/>
          Noch nicht freigeschaltet
        </span>
      )}
    </>
  );
}

/* ── Category tab ── */
function CatTab({ cat, active, onClick, foundCount, kompletteCount = 0, fullWidth }) {
  const [hov, setHov] = uS2(false);
  const cMain = `oklch(0.72 0.16 ${cat.hue})`;
  const cA = (a) => `oklch(0.72 0.16 ${cat.hue} / ${a})`;
  const pctFound    = cat.total ? foundCount / cat.total : 0;
  const pctKomplett = cat.total ? kompletteCount / cat.total : 0;
  return (
    <button
      onClick={onClick}
      onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{
        ...(fullWidth
          ? { width:'100%', flex:'1 1 100%' }
          : { flex:'1 1 100px', minWidth:0, maxWidth:240 }),
        background: active ? `${cA(0.09)}` : 'rgba(10,8,28,0.7)',
        border: active ? `1px solid ${cA(0.67)}` : `1px solid ${hov ? cMain+'55' : 'rgba(124,77,255,0.18)'}`,
        padding:'14px 16px 12px', borderRadius:3, cursor:'pointer',
        textAlign:'left', position:'relative', overflow:'hidden',
        transition:'all 0.2s',
        boxShadow: active ? `0 0 18px ${cA(0.2)}, inset 0 0 14px ${cA(0.07)}` : 'none',
      }}
    >
      <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:8 }}>
        <svg viewBox="0 0 100 100" width="22" height="22" fill="none" stroke={cMain} style={{ color:cMain, opacity: active ? 1 : 0.85, flexShrink:0 }}>{CIC[cat.id]}</svg>
        <span style={{
          fontFamily:'var(--font-display)', fontSize:11, letterSpacing:'0.2em', fontWeight:400,
          color: active ? '#f0eeff' : 'rgba(220,210,250,0.78)', textTransform:'uppercase',
          minWidth:0, flex:1, overflowWrap:'anywhere', lineHeight:1.2,
        }}>{cat.label}</span>
      </div>
      {/* two-layer progress: white = sighted (in Forschung), color = komplett erforscht */}
      <div style={{ position:'relative', height:4, marginBottom:6 }}>
        {/* outer glow halo for komplett bar (extends beyond track) */}
        {pctKomplett > 0 && (
          <div style={{ position:'absolute', left:0, top:0, bottom:0, width:`${pctKomplett*100}%`,
            boxShadow:`0 0 7px 1px ${cA(0.42)}, 0 0 14px 3px ${cA(0.18)}, 0 0 22px 6px ${cA(0.08)}`,
            borderRadius:2, pointerEvents:'none',
          }}/>
        )}
        {/* clipping track */}
        <div style={{ position:'absolute', inset:0, background:'rgba(124,77,255,0.08)', border:`1px solid ${cA(0.13)}`, borderRadius:2, overflow:'hidden' }}>
          {/* white layer — sighted in Forschung (subtle) */}
          <div style={{ position:'absolute', left:0, top:0, bottom:0, width:`${pctFound*100}%`,
            background:'linear-gradient(90deg, rgba(220,215,250,0.16), rgba(240,238,255,0.26))',
            transition:'width 0.6s cubic-bezier(.2,.85,.2,1)',
          }}/>
          {/* color layer on top — komplett erforscht (bold) */}
          <div style={{ position:'absolute', left:-1, top:-1, bottom:-1, width:`${pctKomplett*100}%`,
            background:`linear-gradient(90deg, ${cMain}, ${cA(0.85)})`,
            boxShadow:`inset 0 0 4px rgba(255,255,255,0.5)`,
            borderRadius:2,
            transition:'width 0.8s cubic-bezier(.2,.85,.2,1)',
          }}/>
        </div>
      </div>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', gap:6 }}>
        <span style={{ fontFamily:'var(--font-mono)', fontSize:9, color:'rgba(200,190,240,0.65)', letterSpacing:'0.1em', whiteSpace:'nowrap' }}>
          <span style={{ color:'#f0eeff' }}>{foundCount}</span>
          <span style={{ opacity:0.5 }}> / {cat.total}</span>
          {kompletteCount > 0 && (
            <span style={{ color:cMain, marginLeft:4 }}>· {kompletteCount} <span style={{ fontSize:7, opacity:0.75, letterSpacing:'0.16em' }}>KOMP</span></span>
          )}
        </span>
        <span style={{ fontFamily:'var(--font-mono)', fontSize:8, color:cMain, letterSpacing:'0.18em' }}>
          {cat.total ? `${Math.round(pctFound*100)} %` : '—'}
        </span>
      </div>
    </button>
  );
}

/* ── Filter chip ── */
function FilterChip({ label, count, active, onClick }) {
  return (
    <button className={`filter-chip${active ? ' active' : ''}`} onClick={onClick}>
      {label}
      {count !== undefined && <span style={{ marginLeft:5, opacity:0.55 }}>{count}</span>}
    </button>
  );
}

Object.assign(window, { EntryCard, DetailPanel, CatTab, FilterChip, RarityPips, mkStripeBg });

  return (
    <button onClick={onClick} style={{
      fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.22em',
      padding:'7px 12px', textTransform:'uppercase',
      background: active ? cA(0.18) : 'rgba(10,8,28,0.5)',
      border: active ? `1px solid ${c}` : `1px solid ${cA(0.3)}`,
      color: active ? '#f0eeff' : cA(0.85),
      cursor:'pointer', borderRadius:2, transition:'all 0.18s',
      display:'inline-flex', alignItems:'center', gap:8, position:'relative',
      boxShadow: active ? `0 0 14px ${cA(0.25)}` : 'none',
    }}
      onMouseEnter={e=>{ if(!active){ e.currentTarget.style.borderColor=c; e.currentTarget.style.color='#f0eeff'; } }}
      onMouseLeave={e=>{ if(!active){ e.currentTarget.style.borderColor=cA(0.3); e.currentTarget.style.color=cA(0.85); } }}
    >
      <svg viewBox="0 0 14 14" width="11" height="11" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round">
        <path d="M1 2 L 13 2 L 8.5 7.5 L 8.5 12.5 L 5.5 11 L 5.5 7.5 Z"/>
      </svg>
      <span>Filter</span>
      {count > 0 && (
        <span style={{
          minWidth:18, padding:'1px 5px', borderRadius:9,

          fontFamily:'var(--font-mono)', fontSize:8, lineHeight:1.2,
          fontWeight:600, letterSpacing:0, textAlign:'center',
        }}>{count}</span>
      )}
      <svg viewBox="0 0 10 10" width="8" height="8" fill="none" stroke="currentColor" strokeWidth="1.6" style={{ opacity:0.6, transform: active ? 'rotate(180deg)' : 'rotate(0)', transition:'transform 0.2s' }}>
        <path d="M1 3 L 5 7 L 9 3" strokeLinecap="round"/>
      </svg>
    </button>
  );
}

/* ── FilterPanel (expanded under filter row) ── */
function FilterPanel({ category, selected, onToggle, onReset, onResetFacet }) {
  const facets = window.FACETS[category] || [];
  const FG = window.FilterGroup;
  const totalActive = Object.values(selected || {}).reduce((s, arr) => s + (arr ? arr.length : 0), 0);
  if (!facets.length) return null;

  return (
    <div style={{
      background: 'rgba(8,6,22,0.85)',
      border: '1px solid rgba(124,77,255,0.3)',
      borderRadius: 3,
      padding: '12px 18px 16px',
      animation: 'slideDown 0.22s ease',
      boxShadow: '0 12px 36px rgba(0,0,0,0.5)',
    }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10, paddingBottom:8, borderBottom:'1px solid rgba(124,77,255,0.12)' }}>
        <span style={{ fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.3em', color:'rgba(124,77,255,0.6)', textTransform:'uppercase' }}>
          Filteroptionen
        </span>
        <button onClick={onReset} disabled={totalActive===0} style={{
          background:'transparent', border:`1px solid rgba(124,77,255,${totalActive?0.4:0.15})`,
          color: totalActive ? 'rgba(160,140,255,0.85)' : 'rgba(124,77,255,0.3)',
          cursor: totalActive ? 'pointer' : 'default',
          padding:'2px 9px', borderRadius:2,
          fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.2em', textTransform:'uppercase',
          transition:'all 0.15s',
        }}>Zurücksetzen {totalActive>0 && `(${totalActive})`}</button>
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(220px, 1fr))', gap:'2px 24px' }}>
        {facets.map(f => {
          const facetActive = (selected[f.key] || []).length > 0;
          return (
            <FG key={f.key} title={f.label} active={facetActive}
              onReset={() => onResetFacet && onResetFacet(f.key)} collapsible>
              <div style={{ display:'flex', flexWrap:'wrap', gap:4, marginBottom:4 }}>
                {f.options.map(opt => {
                  const sel = (selected[f.key] || []).includes(opt);
                  return <button key={opt} className={`filter-chip${sel?' active':''}`} onClick={()=>onToggle(f.key, opt)}>{opt}</button>;
                })}
              </div>
            </FG>
          );
        })}
      </div>
    </div>
  );
}

Object.assign(window, { FilterButton, FilterPanel });
</script>


<!-- ═══════════════════════════════════════════
     SCRIPT 3 — Nav + Page + Render
     ═══════════════════════════════════════════ -->
<script type="text/babel">
const { useState:uS3, useEffect:uE3, useRef:uR3, useMemo:uM3 } = React;
const { CATEGORIES:C3, CAT_ICONS:CI3, RARITY:R3, FACETS:F3, RAR_LABEL:RL3,
        EntryCard:ECard, DetailPanel:DPanel, CatTab:CTab, FilterChip:FChip, FilterButton:FBtn, FilterPanel:FPanel } = window;
const { useTweaks, TweaksPanel, TweakSection, TweakRadio, TweakToggle } = window;

/* ── Build Kollektikon entries from resource data + ressourcen_sichtbar ── */
const _FISH_ICONS     = ['f1','f2','f3','f4','f5','f6','f7','f8'];
const _PLANT_ICONS    = ['p1','p2','p3','p4','p5','p6','p7','p8'];
const _MIN_ICONS      = ['m1','m2','m3','m4','m5'];
const _CREATURE_ICONS = ['k1','k2','k3','k4'];
const _ICON_POOLS = { fische:_FISH_ICONS, pflanzen:_PLANT_ICONS, mineralien:_MIN_ICONS, kreaturen:_CREATURE_ICONS };

// Stable integer ID for a monster name — used as resource_id in ressourcen_sichtbar
function _monsterKolId(name) {
  let h = 5381;
  for (let i = 0; i < name.length; i++) h = (Math.imul(h, 33) ^ name.charCodeAt(i)) >>> 0;
  return h % 2000000000;
}

// Sci-fi scramble: same name → same output, preserves spaces/hyphens
const _GLYPHS = '░▒▓█▪◆◈⬡⬢⬤⬧⬨◉●○◇□■▾▸▿△▷▶▽▼◁◀';
function _scrambleName(name) {
  return name.split('').map((c, i) => {
    if (c === ' ' || c === '-') return c;
    const seed = (name.charCodeAt(0) * 17 + i * 31 + name.charCodeAt(i) * 7) % _GLYPHS.length;
    return _GLYPHS[Math.abs(seed)];
  }).join('');
}

function _rarFromSg(sg) {
  return sg <= 1 ? 'gewoehnlich' : sg === 2 ? 'selten' : sg === 3 ? 'sehrselten' : 'einzigartig';
}
function _rarFromStaerke(s) {
  return s <= 2 ? 'gewoehnlich' : s <= 4 ? 'selten' : s === 5 ? 'sehrselten' : 'einzigartig';
}
function _crLabel(cr) {
  if (cr === 0)     return 'HG 0';
  if (cr === 0.125) return 'HG 1/8';
  if (cr === 0.25)  return 'HG 1/4';
  if (cr === 0.5)   return 'HG 1/2';
  return `HG ${cr}`;
}
function _rarFromCr(cr) {
  if (cr <= 1) return 'gewoehnlich';
  if (cr <= 5) return 'selten';
  if (cr <= 10) return 'sehrselten';
  return 'einzigartig';
}
function _gefahrFromCr(cr) {
  if (cr <= 1) return 'Friedlich';
  if (cr <= 4) return 'Vorsichtig';
  if (cr <= 11) return 'Aggressiv';
  return 'Tödlich';
}
function _normalizeMonsterGroesse(g) {
  if (!g) return [];
  const map = { 'Winzig':'Klein','Klein':'Klein','Mittelgroß':'Mittel','Groß':'Groß','Riesig':'Riesig','Gigantisch':'Riesig' };
  return [map[g] || g];
}
function _umgebungToHabitat(umgebung) {
  const map = {
    'Wald':'Land','Grasland':'Land','Wüste':'Land','Gebirge':'Land','Arktis':'Land',
    'Küste':'Land','Hügel':'Land','Stadt':'Land','Ruinen':'Land','Dschungel':'Land','Feenwildnis':'Land',
    'Gewässer':'Wasser','Ozean':'Wasser','Sumpf':'Wasser',
    'Unterirdisch':'Höhle','Höhle':'Höhle',
    'Andere Ebenen':'Schleier',
  };
  const result = new Set();
  (umgebung || []).forEach(u => { if (map[u]) result.add(map[u]); });
  return [...result];
}
function _parsePrice(str) {
  if (!str) return 0;
  const m = String(str).match(/\d+/);
  return m ? parseInt(m[0]) : 0;
}
function _normalizeWasser(w) {
  if (!w) return [];
  const map = { süß:'Süßwasser', brack:'Brackwasser', salz:'Salzwasser', tief:'Tiefsee', meer:'Salzwasser' };
  return [map[(w||'').toLowerCase()] || w];
}
function _normalizeGroesse(g) {
  if (!g) return [];
  const map = { klein:'Klein', mittel:'Mittel', 'groß':'Groß', riesig:'Riesig' };
  return [map[(g||'').toLowerCase()] || g];
}

function buildKollektikonEntries(visibleMap, metaMap) {
  const ALL_PLANTS = [...(window.PFLANZEN_DB || []), ...(window.FANTASY_PLANT_DB || [])];
  const DB = { fische: window.FISH_DB || [], pflanzen: ALL_PLANTS, mineralien: window.MINERALIEN_DB || [] };
  const entries = [];
  for (const cat of C3) {
    // Kreaturen: show all monsters, DM-toggled visibility via ressourcen_sichtbar
    if (cat.id === 'kreaturen') {
      const monsters = window.MONSTER_DATA || [];
      const visKreaturen = visibleMap['kreaturen'] || new Set();
      monsters.forEach((mon, idx) => {
        const rid = _monsterKolId(mon.name);
        const isSeen = visKreaturen.has(rid);
        const meta = metaMap[`kreaturen:${rid}`] || {};
        const cr = mon.cr || 0;
        const entry = {
          id: `kreaturen-${rid}`, _rid: rid, cat: 'kreaturen', name: mon.name, hue: cat.hue,
          found: isSeen, stage: isSeen ? (meta.stage || 0) : 0, price: 0,
          icon: _CREATURE_ICONS[idx % _CREATURE_ICONS.length],
          rarity: _rarFromCr(cr),
        };
        entry.tags   = { cr: [_crLabel(cr)], art: [mon.art || ''], groesse: _normalizeMonsterGroesse(mon.groesse), habitat: _umgebungToHabitat(mon.umgebung) };
        if (isSeen) {
          entry.habitat = (mon.umgebung || []).join(', ');
          entry.size    = mon.groesse || '';
          entry.desc    = (mon.beschreibung && mon.beschreibung[0]) || '';
        } else {
          entry.obscuredName = _scrambleName(mon.name);
          entry.habitat = ''; entry.size = ''; entry.desc = '';
        }
        entries.push(entry);
      });
      continue;
    }

    const db = DB[cat.id];
    if (!db || db.length === 0) continue;
    const visIds = visibleMap[cat.id] || new Set();
    const pool = _ICON_POOLS[cat.id] || [];
    for (const res of db) {
      const rid = res.id;
      const isSeen = visIds.has(rid);
      const meta = metaMap[`${cat.id}:${rid}`] || {};
      let rarity, fullTags, habitat, size;
      if (cat.id === 'fische') {
        rarity = _rarFromStaerke(res.stärke || 2);
        fullTags = { groesse: _normalizeGroesse(res.größenkategorie), wasser: _normalizeWasser(res.wassersort), klima: res.klima || [] };
        habitat = (res.fundort || res.lebensraum || []).join(', ');
        size = res.größenkategorie || res.groesse || '';
      } else if (cat.id === 'pflanzen') {
        rarity = _rarFromSg(res.seltenheitsgrad || 1);
        const eg = res.eigenschaften || {};
        const eigenschaft = [];
        if (eg.essbar) eigenschaft.push('Roh essbar');
        if (eg.essbar_nach_zubereitung) eigenschaft.push('Zubereitet essbar');
        if (eg.giftig) eigenschaft.push('Giftig');
        fullTags = { typ: res.kategorie ? [res.kategorie] : [], fundort: res.fundort || [], klima: res.klima || [], eigenschaft };
        habitat = (res.fundort || []).join(', '); size = '';
      } else {
        rarity = _rarFromSg(res.seltenheitsgrad || 1);
        fullTags = { typ: res.kategorie ? [res.kategorie] : [], fundort: res.fundort || [] };
        habitat = (res.fundort || []).join(', '); size = '';
      }
      const entry = {
        id: `${cat.id}-${rid}`, _rid: rid, cat: cat.id, name: res.name_de, hue: cat.hue,
        found: isSeen, stage: isSeen ? (meta.stage || 0) : 0,
        price: isSeen ? _parsePrice(res.verkaufspreis) : 0,
        icon: pool.length ? pool[rid % pool.length] : null, rarity,
      };
      entry.tags = fullTags;
      if (isSeen) {
        entry.habitat = habitat; entry.size = size; entry.desc = res.desc_de || '';
      } else {
        entry.obscuredName = _scrambleName(res.name_de);
        entry.habitat = ''; entry.size = ''; entry.desc = '';
      }
      entries.push(entry);
    }
  }
  return entries;
}

// Populate facet options dynamically from the actual resource DBs
(function() {
  const F = window.FACETS;
  if (!F) return;

  function setOpts(cat, key, opts) {
    const f = F[cat] && F[cat].find(x => x.key === key);
    if (f) f.options = opts;
  }
  function unique(arr) { return [...new Set(arr.filter(Boolean))].sort(); }
  function flatUnique(arr, key) { return unique(arr.flatMap(x => x[key] || [])); }

  // kreaturen — CR and Monsterart
  const monsters = window.MONSTER_DATA || [];
  setOpts('kreaturen', 'cr',  [...new Set(monsters.map(m => m.cr || 0))].sort((a,b)=>a-b).map(_crLabel));
  setOpts('kreaturen', 'art', unique(monsters.map(m => m.art)));

  // fische
  const fish = window.FISH_DB || [];
  setOpts('fische', 'groesse', unique(fish.map(f => _normalizeGroesse(f.größenkategorie)[0])));
  setOpts('fische', 'wasser',  unique(fish.map(f => _normalizeWasser(f.wassersort)[0])));
  setOpts('fische', 'klima',   flatUnique(fish, 'klima'));

  // pflanzen
  const plants = [...(window.PFLANZEN_DB || []), ...(window.FANTASY_PLANT_DB || [])];
  setOpts('pflanzen', 'typ',     unique(plants.map(p => p.kategorie)));
  setOpts('pflanzen', 'fundort', flatUnique(plants, 'fundort'));
  setOpts('pflanzen', 'klima',   flatUnique(plants, 'klima'));
  const eigenOpts = new Set();
  plants.forEach(p => {
    if (!p.eigenschaften) return;
    if (p.eigenschaften.essbar) eigenOpts.add('Roh essbar');
    if (p.eigenschaften.essbar_nach_zubereitung) eigenOpts.add('Zubereitet essbar');
    if (p.eigenschaften.giftig) eigenOpts.add('Giftig');
  });
  setOpts('pflanzen', 'eigenschaft', [...eigenOpts].sort());

  // mineralien
  const minerals = window.MINERALIEN_DB || [];
  setOpts('mineralien', 'typ',     unique(minerals.map(m => m.kategorie)));
  setOpts('mineralien', 'fundort', flatUnique(minerals, 'fundort'));
})();

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{"density":"comfortable","showOnlyFound":false}/*EDITMODE-END*/;

const { SiteNav } = window;

/* ── Page ── */
function KollektikonPage() {
  const [activeCat, setActiveCat] = uS3('fische');
  const [filter, setFilter]       = uS3('alle'); // alle | entdeckt | unbekannt
  const [search, setSearch]       = uS3('');
  const [filterOpen, setFilterOpen] = uS3(false);
  const [filterTags, setFilterTags] = uS3({}); // { [catId]: { [facetKey]: [values] } }
  const [sel, setSel]             = uS3(null);
  const [tweaks, setTweak]        = useTweaks(TWEAK_DEFAULTS);
  const searchRef = uR3(null);

  // Visibility from ressourcen_sichtbar + stage meta from kollektikon_meta
  const [visibleMap, setVisibleMap] = uS3({});
  const [metaMap, setMetaMap]       = uS3({});

  uE3(() => {
    async function load() {
      const [visRes, metaRes] = await Promise.all([
        window._sb.from('ressourcen_sichtbar').select('cat, resource_id'),
        window._sb.from('kollektikon_meta').select('cat, resource_id, stage'),
      ]);
      if (visRes.data) {
        const vm = {};
        visRes.data.forEach(({ cat, resource_id }) => { if (!vm[cat]) vm[cat] = new Set(); vm[cat].add(resource_id); });
        setVisibleMap(vm);
      }
      if (metaRes.data) {
        const mm = {};
        metaRes.data.forEach(({ cat, resource_id, stage }) => { mm[`${cat}:${resource_id}`] = { stage }; });
        setMetaMap(mm);
      }
    }
    load();
    const ch = window._sb.channel('kol-res-vis')
      .on('postgres_changes', { event:'*', schema:'public', table:'ressourcen_sichtbar' }, payload => {
        setVisibleMap(prev => {
          const vm = Object.fromEntries(Object.entries(prev).map(([k,v]) => [k, new Set(v)]));
          if (payload.eventType === 'INSERT') { const { cat, resource_id } = payload.new; if (!vm[cat]) vm[cat] = new Set(); vm[cat].add(resource_id); }
          else if (payload.eventType === 'DELETE') { const { cat, resource_id } = payload.old; if (vm[cat]) vm[cat].delete(resource_id); }
          return vm;
        });
      })
      .subscribe();
    return () => window._sb.removeChannel(ch);
  }, []);

  const E3 = uM3(() => buildKollektikonEntries(visibleMap, metaMap), [visibleMap, metaMap]);

  function toggleTag(facetKey, value) {
    setFilterTags(prev => {
      const cur = (prev[activeCat]?.[facetKey] || []);
      const next = cur.includes(value) ? cur.filter(v => v !== value) : [...cur, value];
      return { ...prev, [activeCat]: { ...(prev[activeCat]||{}), [facetKey]: next } };
    });
  }
  function resetTagsForCat() {
    setFilterTags(prev => ({ ...prev, [activeCat]: {} }));
  }
  function resetFacet(key) {
    setFilterTags(prev => {
      const c = { ...(prev[activeCat] || {}) };
      delete c[key];
      return { ...prev, [activeCat]: c };
    });
  }
  function entryMatchesTags(e) {
    const sel = filterTags[e.cat] || {};
    for (const key of Object.keys(sel)) {
      const vals = sel[key];
      if (!vals || vals.length === 0) continue;
      let entryVals;
      if (key === 'seltenheit') entryVals = [RL3[e.rarity]];
      else entryVals = (e.tags && e.tags[key]) || [];
      if (!vals.some(v => entryVals.includes(v))) return false;
    }
    return true;
  }

  // counts
  const foundByCat = uM3(() => {
    const m = {};
    C3.forEach(c => m[c.id] = E3.filter(e => e.cat === c.id && e.found).length);
    return m;
  }, [E3]);
  const kompletteByCat = uM3(() => {
    const m = {};
    C3.forEach(c => m[c.id] = E3.filter(e => e.cat === c.id && e.found && (e.stage || 0) >= 8).length);
    return m;
  }, [E3]);
  const totalFound    = uM3(() => Object.values(foundByCat).reduce((s,n) => s+n, 0), [foundByCat]);
  const totalKomplett = uM3(() => Object.values(kompletteByCat).reduce((s,n) => s+n, 0), [kompletteByCat]);
  const totalAll      = uM3(() => C3.reduce((s,c) => s + c.total, 0), []);

  const catObj = C3.find(c => c.id === activeCat);
  const cMain = `oklch(0.72 0.16 ${catObj.hue})`;
  const cA = (a) => `oklch(0.72 0.16 ${catObj.hue} / ${a})`;
  const overallPct         = totalAll ? totalFound/totalAll : 0;
  const overallKomplettPct = totalAll ? totalKomplett/totalAll : 0;

  // entries for current cat + filter + search + tags
  const visibleEntries = uM3(() => {
    let arr = E3.filter(e => e.cat === activeCat);
    if (filter === 'entdeckt')  arr = arr.filter(e => e.found);
    if (filter === 'unbekannt') arr = arr.filter(e => !e.found);
    arr = arr.filter(entryMatchesTags);
    const q = search.trim().toLowerCase();
    if (q) {
      arr = arr.filter(e => {
        const hay = [e.name, e.id, e.habitat, e.desc, e.size].filter(Boolean).join(' • ').toLowerCase();
        return hay.includes(q);
      });
    }
    return arr;
  }, [E3, activeCat, filter, search, filterTags]);

  // active filter count for the current category
  const activeFilterCount = uM3(() => {
    const sel = filterTags[activeCat] || {};
    return Object.values(sel).reduce((s, arr) => s + (arr ? arr.length : 0), 0);
  }, [activeCat, filterTags]);

  // cap large grids unless search or tag filter is active
  const PAGE_LIMIT = 150;
  const renderedEntries = uM3(() => {
    if (visibleEntries.length <= PAGE_LIMIT) return visibleEntries;
    return (search.trim() || activeFilterCount > 0) ? visibleEntries : visibleEntries.slice(0, PAGE_LIMIT);
  }, [visibleEntries, search, activeFilterCount]);

  // global search hits (other categories) when querying
  const otherHits = uM3(() => {
    const q = search.trim().toLowerCase();
    if (!q) return [];
    return E3.filter(e => e.cat !== activeCat).filter(e => {
      const hay = [e.name, e.id, e.habitat, e.desc, e.size].filter(Boolean).join(' • ').toLowerCase();
      return hay.includes(q);
    });
  }, [E3, activeCat, search]);

  // Cmd/Ctrl-K shortcut
  uE3(() => {
    function onKey(e) {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        searchRef.current && searchRef.current.focus();
      }
      if (e.key === 'Escape' && document.activeElement === searchRef.current) {
        setSearch('');
        searchRef.current.blur();
      }
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const catFound   = E3.filter(e => e.cat === activeCat && e.found).length;
  const catUnknown = E3.filter(e => e.cat === activeCat && !e.found).length;

  const density = tweaks.density;
  const colMin = density === 'compact' ? 145 : density === 'spacious' ? 200 : 170;

  return (
    <div style={{ minHeight:'100vh', paddingTop:'var(--nav-h)' }}>
      <SiteNav/>
      <DPanel entry={sel} onClose={()=>setSel(null)}/>

      <TweaksPanel tweaks={tweaks} setTweak={setTweak}>
        <TweakSection label="Darstellung">
          <TweakRadio id="density" label="Dichte" options={[
            {label:'Eng',     value:'compact'},
            {label:'Normal',  value:'comfortable'},
            {label:'Weit',    value:'spacious'},
          ]}/>
        </TweakSection>
      </TweaksPanel>

      {/* Page title */}
      <div style={{ padding:'22px 28px 18px', borderBottom:'1px solid rgba(124,77,255,0.1)' }}>
        <div style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.32em', color:'rgba(124,77,255,0.55)', textTransform:'uppercase', marginBottom:8 }}>
          ◈ Meruria · Enzyklopädie · Kollektikon
        </div>
        <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', gap:24, flexWrap:'wrap' }}>
          <div>
            <h1 style={{ fontFamily:'var(--font-display)', fontWeight:300, fontSize:38, letterSpacing:'0.28em', color:'var(--white)', textTransform:'uppercase', lineHeight:1.1, textShadow:'0 0 30px rgba(124,77,255,0.3)' }}>
              Das Kollektikon
            </h1>
            <div style={{ marginTop:14, width:48, height:1, background:'linear-gradient(90deg, rgba(124,77,255,0.85), rgba(124,77,255,0.1))' }}/>
            <p style={{ marginTop:14, maxWidth:640, fontFamily:'var(--font-body)', fontWeight:300, fontSize:13.5, color:'var(--silver)', lineHeight:1.7 }}>
              Vollständige Übersicht über alle Ressourcen, Lebensformen und Materialien des Planeten Meruria. Einträge werden hinzugefügt, sobald die <em>Bergungsgarde</em>, die <em>Quellensucher</em> oder verifizierte Beobachtende eine gesicherte Sichtung melden.
            </p>
          </div>
          <div style={{ textAlign:'right', minWidth:200 }}>
            <div style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.28em', color:'rgba(124,77,255,0.55)', textTransform:'uppercase', marginBottom:8 }}>
              Gesamtfortschritt
            </div>
            <div style={{ fontFamily:'var(--font-display)', fontWeight:300, fontSize:42, color:'#f0eeff', lineHeight:1 }}>
              {totalFound}<span style={{ color:'rgba(160,140,255,0.4)', fontSize:24 }}> / {totalAll}</span>
            </div>
            <div style={{ marginTop:10, position:'relative', height:6 }}>
              {/* outer glow halo for komplett bar */}
              {overallKomplettPct > 0 && (
                <div style={{ position:'absolute', left:0, top:0, bottom:0, width:`${overallKomplettPct*100}%`,
                  boxShadow:'0 0 9px 1px rgba(160,140,255,0.55), 0 0 20px 5px rgba(160,140,255,0.22), 0 0 32px 10px rgba(160,140,255,0.09)',
                  borderRadius:2, pointerEvents:'none',
                }}/>
              )}
              {/* clipping track */}
              <div style={{ position:'absolute', inset:0, background:'rgba(124,77,255,0.08)', border:'1px solid rgba(124,77,255,0.22)', borderRadius:2, overflow:'hidden' }}>
                {/* white sighted layer (subtle) */}
                <div style={{ position:'absolute', left:0, top:0, bottom:0, width:`${overallPct*100}%`,
                  background:'linear-gradient(90deg, rgba(220,215,250,0.18), rgba(240,238,255,0.28))',
                  transition:'width 0.8s cubic-bezier(.2,.85,.2,1)',
                }}/>
                {/* colored komplett layer (bold) */}
                <div style={{ position:'absolute', left:-1, top:-1, bottom:-1, width:`${overallKomplettPct*100}%`,
                  background:'linear-gradient(90deg, rgba(140,100,255,1), rgba(200,180,255,1))',
                  boxShadow:'inset 0 0 4px rgba(255,255,255,0.45)',
                  borderRadius:2,
                  transition:'width 1s cubic-bezier(.2,.85,.2,1)',
                }}/>
              </div>
            </div>
            <div style={{ marginTop:6, display:'flex', justifyContent:'flex-end', gap:14, fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.18em', textTransform:'uppercase' }}>
              <span style={{ color:'rgba(240,238,255,0.7)' }}>
                <span style={{ display:'inline-block', width:8, height:8, background:'rgba(240,238,255,0.85)', marginRight:5, verticalAlign:'middle' }}/>
                {Math.round(overallPct*100)} % In Forschung
              </span>
              <span style={{ color:'rgba(190,170,255,0.95)' }}>
                <span style={{ display:'inline-block', width:8, height:8, background:'rgba(160,140,255,0.95)', marginRight:5, verticalAlign:'middle' }}/>
                {Math.round(overallKomplettPct*100)} % Komplett
              </span>
            </div>
          </div>
        </div>
      </div>

      {/* Category tabs (2-column grid, 4 rows) */}
      <div style={{ padding:'22px 28px 0' }}>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
          {['fische','insekten','pflanzen','mineralien','kreaturen','kreaturenteile','wal','lebensspeicher']
            .map(id => C3.find(c => c.id === id))
            .filter(Boolean)
            .map(c => (
              <CTab key={c.id} cat={c} active={c.id===activeCat} foundCount={foundByCat[c.id]} kompletteCount={kompletteByCat[c.id]} fullWidth
                onClick={()=>{ setActiveCat(c.id); setFilter('alle'); }}/>
            ))}
        </div>
      </div>

      {/* Filter row */}
      <div style={{ display:'flex', alignItems:'center', gap:18, padding:'22px 28px 18px', flexWrap:'wrap' }}>
        <div style={{ display:'flex', alignItems:'center', gap:14 }}>
          <svg viewBox="0 0 100 100" width="26" height="26" fill="none" stroke={cMain} style={{ color:cMain, opacity:0.85, filter:`drop-shadow(0 0 8px ${cA(0.53)})` }}>{CI3[activeCat]}</svg>
          <div>
            <div style={{ fontFamily:'var(--font-display)', fontSize:14, letterSpacing:'0.24em', color:'#f0eeff', textTransform:'uppercase' }}>{catObj.label}</div>
            <div style={{ fontFamily:'var(--font-mono)', fontSize:8.5, letterSpacing:'0.22em', color:cMain, textTransform:'uppercase', marginTop:3 }}>
              {catObj.short} · {catFound} von {catObj.total} dokumentiert
            </div>
          </div>
        </div>

        <div style={{ flex:1, minWidth:20 }}/>

        {/* Search + Chips (right column) */}
        <div style={{ display:'flex', flexDirection:'column', gap:10, alignItems:'flex-end' }}>
          {/* Search */}
          <div style={{ position:'relative', width:'min(380px, 80vw)' }}>
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke={cMain} strokeWidth="1.6" style={{ position:'absolute', left:10, top:'50%', transform:'translateY(-50%)', opacity:0.85, pointerEvents:'none' }}>
              <circle cx="7" cy="7" r="5"/><path d="M11 11 L 15 15" strokeLinecap="round"/>
            </svg>
            <input
              ref={searchRef}
              type="search"
              value={search}
              onChange={e => setSearch(e.target.value)}
              placeholder="Eintrag suchen …"
              style={{
                width:'100%', padding:'8px 36px 8px 30px',
                background: search ? cA(0.06) : 'rgba(10,8,28,0.55)',
                border: search ? `1px solid ${cA(0.7)}` : '1px solid rgba(124,77,255,0.22)',
                color:'#f0eeff', fontFamily:'var(--font-mono)', fontSize:10,
                letterSpacing:'0.12em', borderRadius:2, outline:'none',
                transition:'border-color 0.2s, box-shadow 0.2s, background 0.2s',
                boxShadow: search ? `0 0 14px ${cA(0.2)}, inset 0 0 10px ${cA(0.07)}` : 'none',
              }}
              onFocus={e => { if (!search) { e.currentTarget.style.borderColor = cA(0.45); e.currentTarget.style.background = 'rgba(10,8,28,0.85)'; } }}
              onBlur={e => { if (!search) { e.currentTarget.style.borderColor = 'rgba(124,77,255,0.22)'; e.currentTarget.style.background = 'rgba(10,8,28,0.55)'; } }}
            />
            {search ? (
              <button onClick={()=>{ setSearch(''); searchRef.current && searchRef.current.focus(); }} style={{
                position:'absolute', right:6, top:'50%', transform:'translateY(-50%)',
                background:'transparent', border:'none', cursor:'pointer',
                color:cMain, fontFamily:'var(--font-mono)', fontSize:14, lineHeight:1,
                padding:'2px 6px',
              }} title="Suche löschen (Esc)">×</button>
            ) : (
              <span style={{
                position:'absolute', right:8, top:'50%', transform:'translateY(-50%)',
                fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.12em',
                color:'rgba(160,140,255,0.4)', textTransform:'uppercase',
                border:'1px solid rgba(124,77,255,0.22)', padding:'1px 5px', borderRadius:2,
                pointerEvents:'none',
              }}>⌘K</span>
            )}
          </div>

          {/* Chips */}
          <div style={{ display:'flex', gap:8 }}>
            <FBtn active={filterOpen} count={activeFilterCount} onClick={()=>setFilterOpen(o=>!o)} hue={catObj.hue}/>
            <FChip label="Alle"       count={E3.filter(e => e.cat===activeCat).length} active={filter==='alle'}      onClick={()=>setFilter('alle')}      hue={catObj.hue}/>
            <FChip label="Entdeckt"   count={catFound}                                  active={filter==='entdeckt'}  onClick={()=>setFilter('entdeckt')}  hue={catObj.hue}/>
            <FChip label="Unbekannt"  count={catUnknown}                                active={filter==='unbekannt'} onClick={()=>setFilter('unbekannt')} hue={catObj.hue}/>
          </div>
        </div>
      </div>

      {/* Filter panel */}
      {filterOpen && (
        <div style={{ padding:'14px 28px 0' }}>
          <FPanel category={activeCat} selected={filterTags[activeCat]||{}} onToggle={toggleTag} onReset={resetTagsForCat} onResetFacet={resetFacet}/>
        </div>
      )}

      {/* Search summary */}
      {search.trim() && (
        <div style={{ padding:'4px 28px 0', display:'flex', alignItems:'center', gap:14, flexWrap:'wrap' }}>
          <span style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.22em', color:cMain, textTransform:'uppercase' }}>
            ◈ {visibleEntries.length} Treffer für „{search.trim()}"
          </span>
          {otherHits.length > 0 && (
            <span style={{ display:'inline-flex', alignItems:'center', gap:8, flexWrap:'wrap', fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.18em', color:'rgba(160,140,255,0.55)', textTransform:'uppercase' }}>
              <span>+ {otherHits.length} in anderen Kategorien:</span>
              {Array.from(new Set(otherHits.map(e=>e.cat))).map(cid => {
                const oc = C3.find(c=>c.id===cid);
                const oCount = otherHits.filter(e=>e.cat===cid).length;
                const oc_c = `oklch(0.72 0.16 ${oc.hue})`;
                return (
                  <button key={cid} onClick={()=>setActiveCat(cid)} style={{
                    background:'transparent', border:`1px solid ${oc_c}`,
                    color:oc_c, cursor:'pointer', padding:'3px 9px', borderRadius:2,
                    fontFamily:'var(--font-mono)', fontSize:8.5, letterSpacing:'0.18em', textTransform:'uppercase',
                  }}>{oc.label} · {oCount}</button>
                );
              })}
            </span>
          )}
        </div>
      )}

      {/* Grid */}
      <div style={{ padding:'14px 28px 36px' }}>
        {visibleEntries.length === 0 ? (
          <div style={{ padding:'60px 20px', textAlign:'center' }}>
            <div style={{ fontFamily:'var(--font-mono)', fontSize:10, letterSpacing:'0.22em', color:'rgba(160,140,255,0.55)', textTransform:'uppercase', marginBottom:10 }}>
              {search.trim() ? `Keine Treffer für „${search.trim()}" in dieser Kategorie.` : 'Keine Einträge in dieser Auswahl.'}
            </div>
            {search.trim() && otherHits.length > 0 && (
              <div style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.18em', color:'rgba(160,140,255,0.45)', textTransform:'uppercase' }}>
                Aber {otherHits.length} Treffer in anderen Kategorien — oben anklicken.
              </div>
            )}
          </div>
        ) : (
          <>
            <div style={{ display:'grid', gridTemplateColumns:`repeat(auto-fill, minmax(${colMin}px, 1fr))`, gap: density==='compact' ? 12 : density==='spacious' ? 22 : 16 }}>
              {renderedEntries.map((e, i) => (
                <ECard key={e.id} entry={e} idx={i} selected={sel && sel.id===e.id} onClick={()=>setSel(e)}/>
              ))}
            </div>
            {renderedEntries.length < visibleEntries.length && (
              <div style={{ marginTop:20, textAlign:'center', fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.2em', color:'rgba(160,140,255,0.5)', textTransform:'uppercase' }}>
                {renderedEntries.length} von {visibleEntries.length} · Suche oder Filter für vollständige Ansicht
              </div>
            )}
          </>
        )}
      </div>

      {/* Footer */}
      <div style={{ borderTop:'1px solid rgba(124,77,255,0.1)', padding:'14px 28px', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
        <span style={{ fontFamily:'var(--font-mono)', fontSize:9, color:'rgba(124,77,255,0.32)', letterSpacing:'0.18em', textTransform:'uppercase' }}>
          Meruria · Kollektikon · Geführt durch die Bergungsgarde
        </span>
        <span style={{ fontFamily:'var(--font-mono)', fontSize:8, color:'rgba(124,77,255,0.28)', letterSpacing:'0.15em' }}>
          {C3.length} Kategorien · {totalAll} Einträge · {totalFound} dokumentiert
        </span>
      </div>
    </div>
  );
}

const { SiteGate } = window;
ReactDOM.createRoot(document.getElementById('root')).render(<SiteGate><KollektikonPage/></SiteGate>);
</script>


</body></html>
