// ── SCROLL REVEAL ─────────────────────────────────────────
function useScrollReveal() {
  useEffect(() => {
    const revealed = new WeakSet();
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (!e.isIntersecting || revealed.has(e.target)) return;
        revealed.add(e.target);
        observer.unobserve(e.target);
        e.target.classList.add('visible');
      });
    }, { threshold: 0.05, rootMargin: '0px 0px -20px 0px' });
    const t = setTimeout(() => document.querySelectorAll('.reveal-up').forEach(el => observer.observe(el)), 100);
    return () => { clearTimeout(t); observer.disconnect(); };
  }, []);
}

// ── PARTICLES ─────────────────────────────────────────────
function ParticleField() {
  const canvasRef = useRef(null);
  const animRef   = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current; if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const resize = () => { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; };
    resize(); window.addEventListener('resize', resize);
    const particles = Array.from({length:40}, () => ({
      x: Math.random(), y: Math.random(),
      r: Math.random()*1.4+0.4,
      vx:(Math.random()-0.5)*0.04, vy:(Math.random()-0.5)*0.04,
      alpha: Math.random()*0.14+0.03,
    }));
    const tick = () => {
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0,0,w,h);
      particles.forEach(p => {
        p.x += p.vx/w*60; p.y += p.vy/h*60;
        if(p.x<0)p.x=1; if(p.x>1)p.x=0; if(p.y<0)p.y=1; if(p.y>1)p.y=0;
        ctx.beginPath(); ctx.arc(p.x*w, p.y*h, p.r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(160,140,255,${p.alpha})`; ctx.fill();
      });
      animRef.current = requestAnimationFrame(tick);
    };
    tick();
    return () => { cancelAnimationFrame(animRef.current); window.removeEventListener('resize', resize); };
  }, []);
  return <canvas ref={canvasRef} style={{ position:'fixed', inset:0, width:'100%', height:'100%', pointerEvents:'none', zIndex:0 }} />;
}

// ── CATEGORY BAR ─────────────────────────────────────────
function CategoryBar({ d, i, active, onClick }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { setVisible(true); io.unobserve(el); } }), { threshold:0.2 });
    io.observe(el); return () => io.disconnect();
  }, []);
  const pctFound = d.found / d.total;
  const pctKomp  = (d.komplett || 0) / d.total;
  const c  = `oklch(0.72 0.16 ${d.hue})`;
  const cA = a => `oklch(0.72 0.16 ${d.hue} / ${a})`;

  return (
    <div ref={ref} onClick={onClick} style={{
      background: active ? 'rgba(12,9,32,0.9)' : 'rgba(10,8,28,0.7)',
      border:`1px solid ${active ? cA(0.5) : cA(0.18)}`,
      padding:'14px 16px 12px', borderRadius:3, position:'relative', overflow:'hidden',
      cursor:'pointer', transition:'border-color 0.2s, background 0.2s',
      boxShadow: active ? `0 0 18px ${cA(0.18)}` : 'none',
    }}>
      {active && <div style={{ position:'absolute', inset:0, background:`${cA(0.06)}`, pointerEvents:'none' }} />}
      <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:8, position:'relative' }}>
        <svg viewBox="0 0 100 100" width="22" height="22" fill="none" stroke={c} style={{ color:c, opacity:0.9, flexShrink:0 }}>
          {d.icon}
        </svg>
        <span style={{ fontFamily:'var(--font-display)', fontSize:11, letterSpacing:'0.2em', fontWeight:400, color:'rgba(220,210,250,0.85)', textTransform:'uppercase', flex:1, lineHeight:1.2 }}>{d.label}</span>
        {active && <span style={{ fontFamily:'var(--font-mono)', fontSize:7, letterSpacing:'0.2em', color:cA(0.8), textTransform:'uppercase' }}>◈ aktiv</span>}
      </div>

        {pctKomp > 0 && (
          <div style={{ position:'absolute', left:0, top:0, bottom:0, width: visible ? `${pctKomp*100}%` : '0%',
            boxShadow:`0 0 7px 1px ${cA(0.42)}, 0 0 14px 3px ${cA(0.18)}`,
            borderRadius:2, pointerEvents:'none',
            transition:`width 1.2s cubic-bezier(.2,.85,.2,1) ${0.3+i*0.08}s`,
          }}/>
        )}

          <div style={{ position:'absolute', left:0, top:0, bottom:0,
            width: visible ? `${pctFound*100}%` : '0%',
            background:'linear-gradient(90deg, rgba(220,215,250,0.16), rgba(240,238,255,0.26))',
            transition:`width 1.0s cubic-bezier(.2,.85,.2,1) ${i*0.08}s` }}/>
          <div style={{ position:'absolute', left:-1, top:-1, bottom:-1,
            width: visible ? `${pctKomp*100}%` : '0%',
            background:`linear-gradient(90deg, ${c}, ${cA(0.85)})`,
            boxShadow:'inset 0 0 4px rgba(255,255,255,0.5)', borderRadius:2,
            transition:`width 1.2s cubic-bezier(.2,.85,.2,1) ${0.3+i*0.08}s` }}/>
        </div>

      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', gap:6, position:'relative' }}>
        <span style={{ fontFamily:'var(--font-mono)', fontSize:9, color:'rgba(200,190,240,0.65)', letterSpacing:'0.1em', whiteSpace:'nowrap' }}>

function CatalogRow({ entry, showCat, catLabel }) {
  const isKomp = entry.status === 'komplett';
  const c  = `oklch(0.72 0.16 ${entry.hue})`;
  const cA = a => `oklch(0.72 0.16 ${entry.hue} / ${a})`;
  const gA = a => `oklch(0.82 0.14 80 / ${a})`;
  return (
    <div style={{ display:'grid', gridTemplateColumns: showCat ? '28px 1fr auto auto auto' : '28px 1fr auto auto', gap:'12px', alignItems:'center', padding:'9px 14px', borderBottom:'1px solid rgba(160,140,255,0.07)', transition:'background 0.15s', cursor:'default' }}
      onMouseEnter={e => e.currentTarget.style.background = 'rgba(124,77,255,0.06)'}
      onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
      <svg viewBox="0 0 100 100" width="18" height="18" fill="none" stroke={isKomp ? 'oklch(0.82 0.14 80)' : c} style={{ color: isKomp ? 'oklch(0.82 0.14 80)' : c, opacity:0.85 }}>
        {entry.icon}
      </svg>
      <span style={{ fontFamily:'var(--font-display)', fontSize:11, letterSpacing:'0.12em', color:'rgba(240,238,255,0.88)' }}>{entry.name}</span>
      {showCat && <span style={{ fontFamily:'var(--font-mono)', fontSize:7.5, color:'rgba(160,140,255,0.45)', letterSpacing:'0.14em', textTransform:'uppercase', whiteSpace:'nowrap' }}>{catLabel}</span>}
      <span style={{ fontFamily:'var(--font-mono)', fontSize:7.5, letterSpacing:'0.2em', textTransform:'uppercase', color: isKomp ? 'oklch(0.82 0.14 80)' : cA(0.85), background: isKomp ? gA(0.1) : cA(0.08), border:`1px solid ${isKomp ? gA(0.4) : cA(0.3)}`, padding:'2px 7px', borderRadius:2, whiteSpace:'nowrap' }}>
        {isKomp ? '✓ Komplett' : '◈ Gesichtet'}
      </span>
      <span style={{ fontFamily:'var(--font-mono)', fontSize:8, color:'rgba(160,140,255,0.4)', letterSpacing:'0.12em', whiteSpace:'nowrap' }}>{entry.date}</span>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [selectedCat, setSelectedCat] = useState(null);
  useScrollReveal();

  const totalFound         = KOLLEKTIKON_DATA.reduce((s,d) => s+d.found,         0);
  const totalAll           = KOLLEKTIKON_DATA.reduce((s,d) => s+d.total,          0);
  const totalKomplett      = KOLLEKTIKON_DATA.reduce((s,d) => s+(d.komplett||0),  0);
  const overallPct         = totalFound / totalAll;
  const overallKomplettPct = totalKomplett / totalAll;

  const activeCatData  = selectedCat ? KOLLEKTIKON_DATA.find(d => d.id === selectedCat) : null;
  const filteredEntries = selectedCat ? CATALOG_ENTRIES.filter(e => e.cat === selectedCat) : CATALOG_ENTRIES;
  const catLabelMap     = Object.fromEntries(KOLLEKTIKON_DATA.map(d => [d.id, d.label]));

  const toggleCat = (id) => setSelectedCat(prev => prev === id ? null : id);

  return (
    <div className="page-root">
      {tweaks.showParticles && <ParticleField />}
      <SiteNav rightLabel="KOLLEKTIKON" />

      {/* ── HERO ── */}
      <div style={{ position:'relative', zIndex:5, width:'100%', padding:'48px 40px 40px', borderBottom:'1px solid rgba(160,140,255,0.12)', background:'linear-gradient(180deg, rgba(18,10,44,0.95) 0%, rgba(8,6,22,0.98) 100%)', overflow:'hidden' }}>
        <div style={{ position:'absolute', inset:0, background:'radial-gradient(ellipse at 15% 50%, rgba(124,77,255,0.14) 0%, transparent 55%), radial-gradient(ellipse at 85% 50%, rgba(45,100,255,0.1) 0%, transparent 55%)', pointerEvents:'none' }}/>
        <div style={{ position:'relative', maxWidth:'1100px', margin:'0 auto' }}>
          <div style={{ fontFamily:'var(--font-mono)', fontSize:'9px', letterSpacing:'0.42em', color:'rgba(124,77,255,0.6)', textTransform:'uppercase', marginBottom:'10px' }}>
            Ressourcen-Archiv · Erforschungsprotokoll · Meruria
          </div>
          <h1 style={{ fontFamily:'var(--font-display)', fontSize:'36px', fontWeight:'300', letterSpacing:'0.3em', color:'#f0eeff', textShadow:'0 0 40px rgba(124,77,255,0.5)', margin:'0 0 22px', lineHeight:1 }}>
            KOLLEKTIKON
          </h1>
          <div style={{ display:'flex', alignItems:'center', gap:'28px', flexWrap:'wrap' }}>
            {[
              { label:'Bekannte Einträge', value:`${totalFound} / ${totalAll}`,           c:'rgba(200,190,240,0.9)' },
              { label:'In Forschung',      value:`${Math.round(overallPct*100)} %`,        c:'rgba(200,190,240,0.6)' },
              { label:'Vollständig dok.',  value:`${totalKomplett} Einträge`,              c:'oklch(0.82 0.14 80)' },
              { label:'Kategorien',        value:`${KOLLEKTIKON_DATA.length}`,            c:'rgba(160,140,255,0.75)' },
            ].map(s => (
              <div key={s.label} style={{ display:'flex', flexDirection:'column', gap:'3px' }}>
                <span style={{ fontFamily:'var(--font-mono)', fontSize:'7.5px', letterSpacing:'0.28em', color:'rgba(160,140,255,0.5)', textTransform:'uppercase' }}>{s.label}</span>
                <span style={{ fontFamily:'var(--font-display)', fontSize:'17px', fontWeight:'400', letterSpacing:'0.18em', color:s.c }}>{s.value}</span>
              </div>
            ))}
            <div style={{ flex:1, minWidth:'140px' }}>
              <div style={{ position:'relative', height:5 }}>
                {overallKomplettPct > 0 && <div style={{ position:'absolute', left:0, top:0, bottom:0, width:`${overallKomplettPct*100}%`, boxShadow:'0 0 9px 1px rgba(160,140,255,0.55)', borderRadius:2, pointerEvents:'none' }}/>}
                <div style={{ position:'absolute', inset:0, background:'rgba(124,77,255,0.08)', borderRadius:2, overflow:'hidden', border:'1px solid rgba(124,77,255,0.2)' }}>
                  <div style={{ position:'absolute', left:0, top:0, bottom:0, width:`${overallPct*100}%`, background:'linear-gradient(90deg, rgba(220,215,250,0.18), rgba(240,238,255,0.28))' }}/>
                  <div style={{ position:'absolute', left:-1, top:-1, bottom:-1, width:`${overallKomplettPct*100}%`, background:'linear-gradient(90deg, rgba(140,100,255,1), rgba(200,180,255,1))', borderRadius:2 }}/>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* ── CONTENT ── */}
      <div style={{ position:'relative', zIndex:5, maxWidth:'1100px', margin:'0 auto', padding:'40px 40px 60px' }}>

        {/* Kategorien */}
        <div className="reveal-up" style={{ marginBottom:'48px' }}>
          <div style={{ display:'flex', alignItems:'baseline', gap:18, marginBottom:20 }}>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:'10px', letterSpacing:'0.35em', color:'rgba(124,77,255,0.65)', textTransform:'uppercase' }}>◈ Kategorien</span>
            <div style={{ flex:1, height:1, background:'linear-gradient(to right, rgba(124,77,255,0.5), rgba(124,77,255,0.05))' }}/>
            {selectedCat ? (
              <button onClick={() => setSelectedCat(null)} style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.22em', color:'rgba(160,140,255,0.6)', textTransform:'uppercase', background:'rgba(124,77,255,0.08)', border:'1px solid rgba(124,77,255,0.25)', borderRadius:2, padding:'3px 10px', cursor:'pointer' }}>
                × Filter aufheben
              </button>
            ) : (
              <span style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.22em', color:'rgba(160,140,255,0.3)', textTransform:'uppercase' }}>Klicken zum Filtern</span>
            )}
          </div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
            {KOLLEKTIKON_DATA.map((d,i) => (
              <CategoryBar key={d.id} d={d} i={i} active={selectedCat === d.id} onClick={() => toggleCat(d.id)} />
            ))}
          </div>
        </div>

        {/* Letzte Entdeckungen */}
        <div className="reveal-up" style={{ marginBottom:'48px', transitionDelay:'0.05s' }}>
          <div style={{ display:'flex', alignItems:'baseline', gap:18, marginBottom:20 }}>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:'10px', letterSpacing:'0.35em', color:'rgba(124,77,255,0.65)', textTransform:'uppercase' }}>◈ Letzte Entdeckungen</span>
            <div style={{ flex:1, height:1, background:'linear-gradient(to right, rgba(124,77,255,0.5), rgba(124,77,255,0.05))' }}/>
          </div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:36 }}>
            <div>
              <div style={{ display:'flex', alignItems:'baseline', gap:14, marginBottom:10 }}>
                <span style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.3em', color:'rgba(124,77,255,0.65)', textTransform:'uppercase' }}>◈ Neu gesichtet</span>
                <div style={{ flex:1, height:1, background:'linear-gradient(to right, rgba(124,77,255,0.45), rgba(124,77,255,0.04))' }}/>
                <span style={{ fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.25em', color:'rgba(160,140,255,0.4)', textTransform:'uppercase' }}>Letzte {RECENT_SIGHTED.length}</span>
              </div>
              <div style={{ display:'flex', alignItems:'flex-start', paddingTop:24, paddingBottom:18, paddingRight:24, overflow:'visible' }}>
                {RECENT_SIGHTED.map((item,i) => <RecentCard key={item.id} item={item} idx={i} gold={false}/>)}
              </div>
            </div>
            <div>
              <div style={{ display:'flex', alignItems:'baseline', gap:14, marginBottom:10 }}>
                <span style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.3em', color:'oklch(0.82 0.14 80)', textTransform:'uppercase' }}>✓ Kürzlich komplettiert</span>
                <div style={{ flex:1, height:1, background:'linear-gradient(to right, oklch(0.82 0.14 80 / 0.5), rgba(124,77,255,0.04))' }}/>
                <span style={{ fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.25em', color:'rgba(160,140,255,0.4)', textTransform:'uppercase' }}>Letzte {RECENT_KOMPLETT.length}</span>
              </div>
              <div style={{ display:'flex', alignItems:'flex-start', paddingTop:24, paddingBottom:18, paddingRight:24, overflow:'visible' }}>
                {RECENT_KOMPLETT.map((item,i) => <RecentCard key={item.id} item={item} idx={i} gold={true}/>)}
              </div>
            </div>
          </div>
        </div>

        {/* Bekannte Einträge */}
        <div className="reveal-up" style={{ transitionDelay:'0.1s' }}>
          <div style={{ display:'flex', alignItems:'baseline', gap:18, marginBottom:8 }}>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:'10px', letterSpacing:'0.35em', color:'rgba(124,77,255,0.65)', textTransform:'uppercase' }}>◈ Bekannte Einträge</span>
            <div style={{ flex:1, height:1, background:'linear-gradient(to right, rgba(124,77,255,0.5), rgba(124,77,255,0.05))' }}/>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:'9px', letterSpacing:'0.28em', color:'rgba(160,140,255,0.4)', textTransform:'uppercase' }}>
              {filteredEntries.length} {filteredEntries.length === 1 ? 'Eintrag' : 'Einträge'}
              {activeCatData && ` · ${activeCatData.label}`}
            </span>
          </div>
          <div style={{ background:'rgba(10,8,28,0.7)', border:'1px solid rgba(124,77,255,0.18)', borderRadius:3, overflow:'hidden', position:'relative' }}>
            <span style={{position:'absolute',top:-1,left:-1,width:12,height:12,borderTop:'1px solid rgba(124,77,255,0.55)',borderLeft:'1px solid rgba(124,77,255,0.55)'}}/>
            <span style={{position:'absolute',top:-1,right:-1,width:12,height:12,borderTop:'1px solid rgba(124,77,255,0.55)',borderRight:'1px solid rgba(124,77,255,0.55)'}}/>
            <span style={{position:'absolute',bottom:-1,left:-1,width:12,height:12,borderBottom:'1px solid rgba(124,77,255,0.55)',borderLeft:'1px solid rgba(124,77,255,0.55)'}}/>
            <span style={{position:'absolute',bottom:-1,right:-1,width:12,height:12,borderBottom:'1px solid rgba(124,77,255,0.55)',borderRight:'1px solid rgba(124,77,255,0.55)'}}/>
            <div style={{ display:'grid', gridTemplateColumns: !selectedCat ? '28px 1fr auto auto auto' : '28px 1fr auto auto', gap:'12px', alignItems:'center', padding:'8px 14px', borderBottom:'1px solid rgba(124,77,255,0.18)', background:'rgba(124,77,255,0.05)' }}>
              {['', 'Name', !selectedCat ? 'Kategorie' : null, 'Status', 'Datum'].filter(h => h !== null).map((h,i) => (
                <span key={i} style={{ fontFamily:'var(--font-mono)', fontSize:'7.5px', letterSpacing:'0.22em', color:'rgba(160,140,255,0.5)', textTransform:'uppercase' }}>{h}</span>
              ))}
            </div>
            {filteredEntries.length === 0 ? (
              <div style={{ padding:'28px 14px', textAlign:'center', fontFamily:'var(--font-mono)', fontSize:9, color:'rgba(160,140,255,0.35)', letterSpacing:'0.2em' }}>
                Keine bekannten Einträge in dieser Kategorie.
              </div>
            ) : (
              filteredEntries.map(entry => (
                <CatalogRow key={entry.id} entry={entry} showCat={!selectedCat} catLabel={catLabelMap[entry.cat]} />
              ))
            )}
          </div>
        </div>

      </div>

      <SiteFooter />

      <TweaksPanel>
        <TweakSection label="Darstellung" />
        <TweakToggle id="showParticles" label="Partikel" />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<SiteGate><App /></SiteGate>);
</script>
</body></html>
