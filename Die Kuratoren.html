// ── HEX SVG ─────────────────────────────────────────────
function hexPoints(s) {
  const cx = s/2, cy = s/2, r = s/2;
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = (Math.PI/180)*(60*i-30);
    pts.push(`${cx+r*Math.cos(a)},${cy+r*Math.sin(a)}`);
  }
  return pts.join(' ');
}
function OctSvg({ size=24, color='currentColor', fill='none', strokeWidth=1, opacity=1, style={} }) {
  const pts = hexPoints(size);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ display:'block', flexShrink:0, ...style }}>
      <polygon points={pts} fill={fill} stroke={color} strokeWidth={strokeWidth} opacity={opacity} />
    </svg>
  );
}

// ── FLOATING HEX FIELD ──────────────────────────────────

  { size:150, x:'42%', y:'85%', anim:'hexFloat2', dur:'8.3s', opacity:0.025,stroke:'#7c4dff', fill:'transparent', strokeW:0.8 },
  { size:50,  x:'92%', y:'80%', anim:'hexFloat3', dur:'6.0s', opacity:0.08, stroke:ACCENT,     fill:'transparent', strokeW:1 },

function FloatingHexField({ mouseX, mouseY }) {
  return (
    <div style={{ position:'fixed', inset:0, pointerEvents:'none', zIndex:1, overflow:'hidden', clipPath:'inset(232px 0 0 0)' }}>
      {HEX_DEFS.map((h, i) => {
        const px = hexPoints(h.size);
        const parallaxX = (mouseX - 0.5) * (i % 3 === 0 ? -12 : i % 3 === 1 ? -6 : -18);
        const parallaxY = (mouseY - 0.5) * (i % 3 === 0 ? -8  : i % 3 === 1 ? -4 : -14);
        return (
          <div key={i} style={{ position:'absolute', left:h.x, top:h.y, animation:`${h.anim} ${h.dur} ease-in-out infinite`, animationDelay:`${i*0.7}s`, transform:`translate(${parallaxX}px, ${parallaxY}px)`, transition:'transform 0.4s ease-out', willChange:'transform' }}>
            <svg width={h.size} height={h.size} viewBox={`0 0 ${h.size} ${h.size}`} style={{ display:'block', opacity:h.opacity, filter:`drop-shadow(0 0 ${h.size*0.08}px ${h.stroke})` }}>
              <polygon points={px} fill={h.fill} stroke={h.stroke} strokeWidth={h.strokeW} />
            </svg>
          </div>
        );
      })}
    </div>
  );
}

// ── SCROLL REVEAL ────────────────────────────────────────
function useScrollReveal() {
  useEffect(() => {
    let observer;
    const revealed = new WeakSet();
    const init = () => {
      observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          const el = entry.target;
          observer.unobserve(el);
          if (revealed.has(el)) return;
          revealed.add(el);
          setTimeout(() => el.classList.add('visible'), 0);
        });
      }, { threshold: 0.06, rootMargin: '0px 0px -24px 0px' });
      document.querySelectorAll('.reveal-up,.reveal-left').forEach(el => observer.observe(el));
    };
    const t = setTimeout(init, 120);
    return () => { clearTimeout(t); observer && observer.disconnect(); };
  }, []);
}

// ── TOC SIDEBAR ──────────────────────────────────────────

];

function TOCSidebar({ navHeight, headerBottom }) {
  const asideRef = React.useRef(null);
  const [activeId, setActiveId] = useState('uebersicht');

  useEffect(() => {
    const update = () => {
      const ideal = (headerBottom || 0) - window.scrollY;
      const val = Math.max(0, ideal);
      if (asideRef.current) { asideRef.current.style.top = val + 'px'; asideRef.current.style.height = `calc(100vh - ${val}px)`; }
    };
    update();
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update, { passive: true });
    return () => { window.removeEventListener('scroll', update); window.removeEventListener('resize', update); };
  }, [headerBottom, navHeight]);

  // Active section tracking
  useEffect(() => {
    const ids = TOC_SECTIONS.map(s => s.id);
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) setActiveId(entry.target.id);
      });
    }, { rootMargin: `-${navHeight + 20}px 0px -60% 0px`, threshold: 0 });
    ids.forEach(id => { const el = document.getElementById(id); if (el) observer.observe(el); });
    return () => observer.disconnect();
  }, [navHeight]);

  const scrollTo = (id) => {
    const el = document.getElementById(id);
    if (el) { const y = el.getBoundingClientRect().top + window.scrollY - navHeight - 16; window.scrollTo({ top: y, behavior: 'smooth' }); }
  };

  return (
    <aside ref={asideRef} style={{ width: 'var(--sidebar-w)', flexShrink: 0, position: 'fixed', top: `${navHeight}px`, left: 0, height: `calc(100vh - ${navHeight}px)`, borderRight: '1px solid rgba(61,191,140,0.1)', padding: '28px 0', background: 'rgba(3,10,7,0.88)', backdropFilter: 'blur(12px)', zIndex: 50, overflowY: 'auto' }}>

          <svg width="10" height="10" viewBox="0 0 10 10"><polygon points={hexPoints(10)} fill={`${ACCENT}22`} stroke={ACCENT} strokeWidth="0.8" /></svg>
          <div style={{ fontFamily: 'var(--font-mono)', fontSize: '7px', letterSpacing: '0.3em', color: `${ACCENT}55`, textTransform: 'uppercase' }}>Division I</div>
        </div>
        <div style={{ fontFamily: 'var(--font-display)', fontSize: '11px', fontWeight: '400', letterSpacing: '0.14em', color: `${ACCENT}cc`, lineHeight: 1.4 }}>Die Kuratoren</div>
      </div>

      {TOC_SECTIONS.map(entry => {
        const isActive = activeId === entry.id;
        return (
          <button key={entry.id} onClick={() => scrollTo(entry.id)}
            style={{ display: 'flex', alignItems: 'flex-start', gap: '8px', width: '100%', textAlign: 'left', padding: entry.indent ? '6px 20px 6px 28px' : '8px 20px', background: isActive ? 'rgba(61,191,140,0.07)' : 'transparent', border: 'none', borderLeft: isActive ? `2px solid ${ACCENT}` : '2px solid transparent', cursor: 'pointer', fontFamily: 'var(--font-body)', fontWeight: entry.indent ? '300' : '400', fontSize: '11px', letterSpacing: '0.1em', fontVariant: 'small-caps', color: isActive ? ACCENT : entry.indent ? 'rgba(180,240,210,0.5)' : 'rgba(200,240,220,0.7)', transition: 'all 0.15s', lineHeight: 1.55 }}
            onMouseEnter={e => { if (!isActive) { e.currentTarget.style.color = '#f0eeff'; e.currentTarget.style.borderLeftColor = `${ACCENT}55`; e.currentTarget.style.background = 'rgba(61,191,140,0.04)'; }}}
            onMouseLeave={e => { if (!isActive) { e.currentTarget.style.color = entry.indent ? 'rgba(180,240,210,0.5)' : 'rgba(200,240,220,0.7)'; e.currentTarget.style.borderLeftColor = 'transparent'; e.currentTarget.style.background = 'transparent'; }}}>
            <OctSvg size={entry.indent ? 4 : 6} color={isActive ? ACCENT : `${ACCENT}44`} fill={isActive ? `${ACCENT}44` : 'transparent'} strokeWidth={1} style={{ flexShrink: 0, marginTop: '3px' }} />
            <span style={{ display: 'block', minWidth: 0 }}>{entry.label}</span>
          </button>
        );

      {/* Divider + future divisions */}
      <div style={{ margin: '20px 20px 12px', borderTop: '1px solid rgba(61,191,140,0.08)' }} />
      <div style={{ fontFamily: 'var(--font-mono)', fontSize: '7px', letterSpacing: '0.25em', color: `${ACCENT}33`, textTransform: 'uppercase', padding: '0 20px', marginBottom: '8px' }}>Weitere Divisionen</div>
      {['II','III','IV','V','VI','VII','VIII'].map(n => (
        <div key={n} style={{ display: 'flex', alignItems: 'center', gap: '8px', padding: '5px 20px', opacity: 0.3 }}>

        </div>
      ))}
    </aside>
  );
}

                  {/* Bar + text */}
                  <div style={{ flex: 1, padding: '12px 18px', position: 'relative' }}>
                    <div style={{ position: 'absolute', left: 0, top: 0, bottom: 0, width: barW, background: `linear-gradient(90deg, ${accent}${isTop ? '10' : '07'}, transparent)`, pointerEvents: 'none' }} />
                    <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'baseline', gap: '12px', flexWrap: 'wrap' }}>
                      <span style={{ fontFamily: 'var(--font-display)', fontSize: '13px', fontWeight: '400', letterSpacing: '0.14em', color: `rgba(240,238,255,${dimAlpha + 0.1})`, textTransform: 'uppercase', flexShrink: 0 }}>{r.titel}</span>
                      <span style={{ fontFamily: 'var(--font-body)', fontWeight: '300', fontSize: '12px', lineHeight: 1.7, color: `rgba(200,240,220,${dimAlpha})`, letterSpacing: '0.01em' }}>{r.beschreibung}</span>
                    </div>
                  </div>
                  {isTop && <div style={{ position: 'absolute', left: 0, top: 0, bottom: 0, width: '2px', background: `linear-gradient(180deg, ${accent}99, ${accent}33)` }} />}
                </div>
              );
            })}
          </div>
        </section>

      </div>
    </div>
  );
}

// ── APP ──────────────────────────────────────────────────
function App() {
  const [mouse, setMouse] = useState({ x: 0.5, y: 0.5 });
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [headerBottom, setHeaderBottom] = useState(0);
  const heroRef = useRef(null);

  const handleMouseMove = useCallback(e => { setMouse({ x: e.clientX / window.innerWidth, y: e.clientY / window.innerHeight }); }, []);

  useEffect(() => {
    const measure = () => {
      if (heroRef.current) {
        const rect = heroRef.current.getBoundingClientRect();
        setHeaderBottom(rect.bottom + window.scrollY);
      }
    };
    measure();
    window.addEventListener('resize', measure, { passive: true });
    return () => window.removeEventListener('resize', measure);
  }, []);

  useScrollReveal();

  const division = DIVISIONS[0];

  return (
    <div onMouseMove={handleMouseMove} style={{ position: 'relative', minHeight: '100vh' }}>
      {tweaks.showParticles && <ParticleField mouseX={mouse.x} mouseY={mouse.y} accentR={61} accentG={191} accentB={140} clipTop={232} />}
      <FloatingHexField mouseX={mouse.x} mouseY={mouse.y} />

      {/* HEADER */}
      <PageHeader height={180} showHex />

      {/* NAV */}
      <SiteNav rightLabel="DIVISIONS-ARCHIV v1.0"/>

      {/* BODY */}
      <div style={{ display: 'flex', alignItems: 'flex-start', position: 'relative', zIndex: 5, minHeight: `calc(100vh - var(--nav-h))`, paddingLeft: 'var(--sidebar-w)' }}>
        <TOCSidebar navHeight={NAV_H} headerBottom={headerBottom} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <DivisionPage division={division} heroRef={heroRef} />
        </div>
      </div>

      {/* FOOTER */}
      <div style={{ position: 'relative', zIndex: 10, padding: '10px 32px', borderTop: '1px solid rgba(61,191,140,0.07)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div style={{ fontFamily: 'var(--font-mono)', fontSize: '7px', color: 'rgba(61,191,140,0.22)', letterSpacing: '0.2em' }}>◈ ARCHIV-STATUS: NOMINAL ◈ EPOCHE: UNBEKANNT</div>
        <div style={{ fontFamily: 'var(--font-mono)', fontSize: '7px', color: 'rgba(61,191,140,0.22)', letterSpacing: '0.2em' }}>MERURIA // DIE VERWOBENEN REICHE</div>
      </div>

      <TweaksPanel>
        <TweakSection label="Darstellung" />
        <TweakToggle id="showParticles" label="Partikel" />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>


</body></html>
