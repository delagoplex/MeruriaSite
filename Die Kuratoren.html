// ── HEX SVG ─────────────────────────────────────────────
function hexPoints(s) {
  const cx = s/2, cy = s/2, r = s/2;
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = (Math.PI/180)*(60*i-30);
    pts.push(`${cx+r*Math.cos(a)},${cy+r*Math.sin(a)}`);
  }
  return pts.join(' ');
}
function OctSvg({ size=24, color='currentColor', fill='none', strokeWidth=1, opacity=1, style={} }) {
  const pts = hexPoints(size);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ display:'block', flexShrink:0, ...style }}>
      <polygon points={pts} fill={fill} stroke={color} strokeWidth={strokeWidth} opacity={opacity} />
    </svg>
  );
}

// ── PARTICLES ───────────────────────────────────────────
function ParticleField({ mouseX, mouseY }) {
  const canvasRef = useRef(null);
  const animRef = useRef(null);
  const particles = useRef([]);
  const mouse = useRef({ x:0.5, y:0.5 });
  useEffect(() => { mouse.current = { x:mouseX, y:mouseY }; }, [mouseX, mouseY]);
  useEffect(() => {
    const canvas = canvasRef.current; if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const resize = () => { canvas.width=canvas.offsetWidth; canvas.height=canvas.offsetHeight; };
    resize(); window.addEventListener('resize', resize);
    particles.current = Array.from({length:50}, ()=>({ x:Math.random(), y:Math.random(), r:Math.random()*2.2+1.0, vx:(Math.random()-0.5)*0.03, vy:(Math.random()-0.5)*0.03, alpha:Math.random()*0.18+0.04 }));
    const tick = () => {
      const w=canvas.width, h=canvas.height;
      const shiftX=(mouse.current.x-0.5)*-14, shiftY=(mouse.current.y-0.5)*-14;
      ctx.clearRect(0,0,w,h);
      particles.current.forEach(p => {
        p.x+=p.vx/w*60; p.y+=p.vy/h*60;
        if(p.x<0)p.x=1; if(p.x>1)p.x=0; if(p.y<0)p.y=1; if(p.y>1)p.y=0;
        ctx.beginPath(); ctx.arc(p.x*w+shiftX, p.y*h+shiftY, p.r, 0, Math.PI*2);
        ctx.fillStyle=`rgba(61,191,140,${p.alpha})`; ctx.fill();
      });
      animRef.current = requestAnimationFrame(tick);
    };
    tick();
    return () => { cancelAnimationFrame(animRef.current); window.removeEventListener('resize', resize); };
  }, []);
  return <canvas ref={canvasRef} style={{ position:'fixed', inset:0, width:'100%', height:'100%', pointerEvents:'none', zIndex:0, clipPath:'inset(232px 0 0 0)' }} />;
}

// ── SCROLL REVEAL ────────────────────────────────────────
function useScrollReveal() {
  useEffect(() => {
    let observer;
    const revealed = new WeakSet();
    const init = () => {
      observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          const el = entry.target;
          observer.unobserve(el);
          if (revealed.has(el)) return;
          revealed.add(el);
          setTimeout(() => el.classList.add('visible'), 0);
        });
      }, { threshold: 0.06, rootMargin: '0px 0px -24px 0px' });
      document.querySelectorAll('.reveal-up,.reveal-left').forEach(el => observer.observe(el));
    };
    const t = setTimeout(init, 120);
    return () => { clearTimeout(t); observer && observer.disconnect(); };
  }, []);
}

function TOCSidebar({ navHeight, headerBottom }) {
  const [topOffset, setTopOffset] = useState(navHeight);
  const [activeId, setActiveId] = useState('uebersicht');

  useEffect(() => {
    const update = () => {
      const ideal = (headerBottom || 0) - window.scrollY;
      setTopOffset(Math.max(navHeight, ideal));
    };
    update();
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update, { passive: true });
    return () => { window.removeEventListener('scroll', update); window.removeEventListener('resize', update); };
  }, [headerBottom, navHeight]);

  // Active section tracking
  useEffect(() => {
    const ids = TOC_SECTIONS.map(s => s.id);

        if (entry.isIntersecting) setActiveId(entry.target.id);

  }, [navHeight]);

  const scrollTo = (id) => {
    const el = document.getElementById(id);

            <polygon points={hexPoints(200)} fill={`${accent}15`} stroke={accent} strokeWidth="1" />
          </svg>
        </div>
        {/* Small accent hex top-right */}
        <div style={{ position:'absolute', right:'3%', top:'10%', pointerEvents:'none', zIndex:2, opacity:0.12 }}>
          <svg width="60" height="60" viewBox="0 0 60 60">
            <polygon points={hexPoints(60)} fill="none" stroke="rgba(124,77,255,0.8)" strokeWidth="1" />
          </svg>
        </div>

        {/* Scan line */}
        <div style={{ position:'absolute', left:0, right:0, height:'2px', background:`linear-gradient(90deg, transparent 0%, ${accent}88 30%, rgba(200,255,230,0.9) 50%, ${accent}88 70%, transparent 100%)`, zIndex:4, pointerEvents:'none', animation:'heroScan 6s ease-in-out infinite' }} />

        {/* Placeholder art */}
        <div style={{ position:'absolute', left:'4%', top:'50%', transform:'translateY(-50%)', zIndex:4, pointerEvents:'none' }}>
          <div style={{ width:'240px', height:'200px', border:`1px dashed ${accent}28`, borderRadius:'3px', background:`repeating-linear-gradient(-45deg, transparent, transparent 8px, ${accent}05 8px, ${accent}05 9px)`, display:'flex', alignItems:'center', justifyContent:'center', position:'relative', overflow:'hidden' }}>
            <div style={{ position:'absolute', inset:0, background:`radial-gradient(ellipse at 50% 50%, ${accent}08 0%, transparent 70%)` }} />
            <span style={{ fontFamily:'var(--font-mono)', fontSize:'8px', color:`${accent}33`, letterSpacing:'0.1em', textAlign:'center', position:'relative', zIndex:1 }}>divisions-artwork<br />die kuratoren</span>
          </div>
        </div>

        {/* Big roman numeral bg — shifted right */}
        <div style={{ position:'absolute', right:'6%', top:'50%', transform:'translateY(-50%)', fontFamily:'var(--font-display)', fontSize:'260px', fontWeight:'300', letterSpacing:'-0.04em', color:`${accent}06`, lineHeight:1, userSelect:'none', pointerEvents:'none', whiteSpace:'nowrap', zIndex:3 }}>{division.nummer}</div>

        {/* Bottom fade + text */}
        <div style={{ position:'absolute', bottom:0, left:0, right:0, padding:'32px 40px', background:`linear-gradient(to top, #020d07 0%, #020d0799 55%, transparent 100%)`, zIndex:5, textAlign:'right' }}>
          <div className="reveal-left" style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.32em', color:`${accent}77`, textTransform:'uppercase', marginBottom:'7px' }}>Division {division.nummer} · {division.subtitle}</div>
          <h1 className="reveal-left" style={{ fontFamily:'var(--font-display)', fontSize:'clamp(32px,4vw,54px)', fontWeight:'300', letterSpacing:'0.16em', color:'#f0eeff', textShadow:`0 0 50px ${accent}55, 0 0 100px ${accent}22`, lineHeight:1.1 }}>{division.name}</h1>
          {/* Underline with hex dot */}
          <div className="reveal-left" style={{ display:'flex', alignItems:'center', gap:'8px', marginTop:'12px', justifyContent:'flex-end' }}>
            <div style={{ width:'24px', height:'1px', background:`linear-gradient(270deg, ${accent}44, transparent)` }} />
            <svg width="8" height="8" viewBox="0 0 8 8"><polygon points={hexPoints(8)} fill={`${accent}55`} stroke={accent} strokeWidth="0.8" /></svg>
            <div style={{ width:'48px', height:'1px', background:`linear-gradient(270deg, ${accent}99, transparent)`, animation:'pulse-glow 3s infinite' }} />
          </div>
        </div>
      </div>
      {/* Measurement anchor */}
      <div ref={heroRef} style={{ height: 0 }} />

      {/* Content */}
      <div style={{ padding: '48px 40px 80px', maxWidth: '760px', position: 'relative' }}>

        {/* Faint large hex watermark behind content */}
        <div style={{ position:'absolute', right:'-60px', top:'40px', pointerEvents:'none', zIndex:0, opacity:0.025, filter:`drop-shadow(0 0 30px ${accent})` }}>
          <svg width="300" height="300" viewBox="0 0 300 300">
            <polygon points={hexPoints(300)} fill="none" stroke={accent} strokeWidth="1" />
          </svg>
        </div>
        <div style={{ position:'absolute', left:'-40px', bottom:'120px', pointerEvents:'none', zIndex:0, opacity:0.03 }}>
          <svg width="180" height="180" viewBox="0 0 180 180">
            <polygon points={hexPoints(180)} fill="none" stroke="rgba(124,77,255,0.9)" strokeWidth="1" />
          </svg>
        </div>

        {/* Beschreibung */}
        <section id="beschreibung" style={{ marginBottom: '52px', scrollMarginTop: `${NAV_H + 16}px`, position:'relative', zIndex:1 }}>
          <div className="reveal-left" style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '18px' }}>
            <svg width="8" height="8" viewBox="0 0 8 8"><polygon points={hexPoints(8)} fill={`${accent}44`} stroke={accent} strokeWidth="0.8" /></svg>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: '8px', letterSpacing: '0.28em', color: `${accent}77`, textTransform: 'uppercase' }}>Beschreibung</div>
            <div style={{ flex: 1, height: '1px', background: `linear-gradient(90deg, ${accent}44, rgba(124,77,255,0.2), transparent)` }} />
            <svg width="5" height="5" viewBox="0 0 5 5"><polygon points={hexPoints(5)} fill="rgba(124,77,255,0.3)" stroke="rgba(124,77,255,0.5)" strokeWidth="0.6" /></svg>
          </div>
          <p className="reveal-up" style={{ fontFamily: 'var(--font-body)', fontWeight: '300', fontSize: '14px', lineHeight: 1.9, color: 'rgba(240,238,255,0.78)', letterSpacing: '0.02em', textWrap: 'pretty', borderLeft: `1px solid ${accent}22`, paddingLeft: '16px' }}>
            {division.beschreibung}
          </p>
        </section>

        {/* Auftragseindruck */}
        <section id="auftraege" style={{ marginBottom: '52px', scrollMarginTop: `${NAV_H + 16}px`, position:'relative', zIndex:1 }}>
          <div className="reveal-left" style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '22px' }}>
            <svg width="8" height="8" viewBox="0 0 8 8"><polygon points={hexPoints(8)} fill={`${accent}44`} stroke={accent} strokeWidth="0.8" /></svg>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: '8px', letterSpacing: '0.28em', color: `${accent}77`, textTransform: 'uppercase' }}>Auftragseindruck</div>
            <div style={{ flex: 1, height: '1px', background: `linear-gradient(90deg, ${accent}44, rgba(124,77,255,0.2), transparent)` }} />
            <svg width="5" height="5" viewBox="0 0 5 5"><polygon points={hexPoints(5)} fill="rgba(124,77,255,0.3)" stroke="rgba(124,77,255,0.5)" strokeWidth="0.6" /></svg>
          </div>
          <ul style={{ display: 'flex', flexDirection: 'column', gap: '10px', listStyle: 'none', padding: 0, margin: 0 }}>
            {division.auftraege.map((auftrag, i) => (
              <li key={i} className="reveal-up" style={{ display: 'flex', gap: '14px', alignItems: 'flex-start', padding: '14px 18px', border: `1px solid ${accent}18`, borderRadius: '3px', background: `linear-gradient(135deg, ${accent}06 0%, transparent 100%)`, borderLeft: `2px solid ${accent}55`, position:'relative', overflow:'hidden' }}>
                <div style={{ position:'absolute', right:'-8px', bottom:'-8px', opacity:0.06, pointerEvents:'none' }}>
                  <svg width="56" height="56" viewBox="0 0 56 56"><polygon points={hexPoints(56)} fill="none" stroke={accent} strokeWidth="1" /></svg>
                </div>
                <svg width="8" height="8" viewBox="0 0 8 8" style={{ flexShrink:0, marginTop:'5px' }}>
                  <polygon points={hexPoints(8)} fill={`${accent}44`} stroke={accent} strokeWidth="0.8" />
                </svg>
                <span style={{ fontFamily: 'var(--font-body)', fontWeight: '300', fontSize: '13px', lineHeight: 1.8, color: 'rgba(200,240,220,0.72)', letterSpacing: '0.02em', textWrap: 'pretty', position:'relative', zIndex:1 }}>{auftrag}</span>
              </li>
            ))}
          </ul>
        </section>

        {/* Rangsystem */}
        <section id="rangsystem" style={{ scrollMarginTop: `${NAV_H + 16}px`, position:'relative', zIndex:1 }}>
          <div className="reveal-left" style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '26px' }}>
            <svg width="8" height="8" viewBox="0 0 8 8"><polygon points={hexPoints(8)} fill={`${accent}44`} stroke={accent} strokeWidth="0.8" /></svg>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: '8px', letterSpacing: '0.28em', color: `${accent}77`, textTransform: 'uppercase' }}>Rangsystem</div>
            <div style={{ flex: 1, height: '1px', background: `linear-gradient(90deg, ${accent}44, rgba(124,77,255,0.2), transparent)` }} />
            <svg width="5" height="5" viewBox="0 0 5 5"><polygon points={hexPoints(5)} fill="rgba(124,77,255,0.3)" stroke="rgba(124,77,255,0.5)" strokeWidth="0.6" /></svg>
          </div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: '2px' }}>
            {division.raenge.map((r, i) => {
              const isTop = r.rang <= 3;
              const barW = `${100 - (r.rang - 1) * 8}%`;
              const dimAlpha = 0.35 + (10 - r.rang) * 0.065;
              return (
                <div key={r.rang} className="reveal-up" style={{ display: 'flex', alignItems: 'stretch', gap: '0', position: 'relative', borderRadius: '3px', overflow: 'hidden', background: isTop ? `linear-gradient(90deg, ${accent}12 0%, transparent 100%)` : 'transparent', border: `1px solid ${isTop ? accent + '28' : accent + '10'}` }}>
                  {/* Rank number column — hex shape */}
                  <div style={{ flexShrink: 0, width: '48px', display: 'flex', alignItems: 'center', justifyContent: 'center', borderRight: `1px solid ${accent}${isTop ? '30' : '14'}`, padding: '14px 0', background: isTop ? `${accent}0e` : 'transparent' }}>
                    <svg width="24" height="24" viewBox="0 0 24 24" style={{ filter: isTop ? `drop-shadow(0 0 4px ${accent}88)` : 'none' }}>
                      <polygon points={hexPoints(24)} fill={isTop ? `${accent}22` : 'transparent'} stroke={isTop ? `${accent}99` : `${accent}33`} strokeWidth="1" />
                      <text x="12" y="16" textAnchor="middle" fontFamily="var(--font-mono)" fontSize="8" fill={isTop ? `${accent}ee` : `${accent}66`}>{r.rang}</text>
                    </svg>
                  </div>
                  {/* Bar + text */}
                  <div style={{ flex: 1, padding: '12px 18px', position: 'relative' }}>
                    <div style={{ position: 'absolute', left: 0, top: 0, bottom: 0, width: barW, background: `linear-gradient(90deg, ${accent}${isTop ? '10' : '07'}, transparent)`, pointerEvents: 'none' }} />
                    <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'baseline', gap: '12px', flexWrap: 'wrap' }}>
                      <span style={{ fontFamily: 'var(--font-display)', fontSize: '13px', fontWeight: '400', letterSpacing: '0.14em', color: `rgba(240,238,255,${dimAlpha + 0.1})`, textTransform: 'uppercase', flexShrink: 0 }}>{r.titel}</span>
                      <span style={{ fontFamily: 'var(--font-body)', fontWeight: '300', fontSize: '12px', lineHeight: 1.7, color: `rgba(200,240,220,${dimAlpha})`, letterSpacing: '0.01em' }}>{r.beschreibung}</span>
                    </div>
                  </div>
                  {isTop && <div style={{ position: 'absolute', left: 0, top: 0, bottom: 0, width: '2px', background: `linear-gradient(180deg, ${accent}99, ${accent}33)` }} />}
                </div>
              );
            })}
          </div>
        </section>

      </div>
    </div>
  );
}

// ── APP ──────────────────────────────────────────────────
function App() {
  const [mouse, setMouse] = useState({ x: 0.5, y: 0.5 });
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [headerBottom, setHeaderBottom] = useState(0);
  const heroRef = useRef(null);

  const handleMouseMove = useCallback(e => { setMouse({ x: e.clientX / window.innerWidth, y: e.clientY / window.innerHeight }); }, []);

  useEffect(() => {
    const measure = () => {
      if (heroRef.current) {
        const rect = heroRef.current.getBoundingClientRect();
        setHeaderBottom(rect.bottom + window.scrollY);
      }
    };
    measure();
    window.addEventListener('resize', measure, { passive: true });
    return () => window.removeEventListener('resize', measure);
  }, []);

  useScrollReveal();

  const division = DIVISIONS[0];

  return (
    <div onMouseMove={handleMouseMove} style={{ position: 'relative', minHeight: '100vh' }}>
      {tweaks.showParticles && <ParticleField mouseX={mouse.x} mouseY={mouse.y} />}
      <FloatingHexField mouseX={mouse.x} mouseY={mouse.y} />

      {/* HEADER */}
      <div style={{ position: 'relative', zIndex: 10, width: '100%', height: '180px', background: 'linear-gradient(180deg,rgba(20,10,50,0.95) 0%,rgba(10,8,30,0.98) 100%)', borderBottom: '1px solid rgba(160,140,255,0.15)', overflow: 'hidden', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <div style={{ position: 'absolute', inset: 0, background: `radial-gradient(ellipse at 20% 50%, rgba(124,77,255,0.18) 0%, transparent 50%), radial-gradient(ellipse at 80% 50%, rgba(45,125,255,0.14) 0%, transparent 50%), repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(160,140,255,0.04) 60px, rgba(160,140,255,0.04) 61px)`, pointerEvents: 'none' }} />
        <div style={{ position: 'absolute', inset: 0, backgroundImage: `repeating-linear-gradient(135deg, transparent, transparent 18px, rgba(124,77,255,0.03) 18px, rgba(124,77,255,0.03) 19px)`, pointerEvents: 'none' }} />
        {/* Hex watermarks */}
        <div style={{ position: 'absolute', left: '3%', top: '50%', transform: 'translateY(-50%)', opacity: 0.06, pointerEvents: 'none' }}>
          <svg width="120" height="120" viewBox="0 0 120 120"><polygon points={hexPoints(120)} fill="none" stroke="rgba(124,77,255,0.9)" strokeWidth="1" /></svg>
        </div>
        <div style={{ position: 'absolute', right: '5%', top: '50%', transform: 'translateY(-50%)', opacity: 0.04, pointerEvents: 'none' }}>
          <svg width="160" height="160" viewBox="0 0 160 160"><polygon points={hexPoints(160)} fill="none" stroke="rgba(124,77,255,0.9)" strokeWidth="1" /></svg>
        </div>
        <div style={{ fontFamily: 'var(--font-mono)', fontSize: '9px', color: 'rgba(160,140,255,0.3)', letterSpacing: '0.3em', textTransform: 'uppercase', position: 'relative', zIndex: 1 }}>Kopfbild — Artwork hier ablegen</div>
      </div>

      {/* NAV */}
      <div style={{ position: 'sticky', top: 0, zIndex: 100, width: '100%', background: 'rgba(5,4,15,0.92)', borderBottom: '1px solid rgba(160,140,255,0.1)', backdropFilter: 'blur(16px)' }}>
        <div style={{ display: 'flex', alignItems: 'center', padding: '0 32px', height: '52px' }}>
          <a href="index.html" style={{ marginRight: '32px', whiteSpace: 'nowrap', flexShrink: 0, textDecoration: 'none' }}>
            <span style={{ fontFamily: 'var(--font-display)', fontSize: '20px', fontWeight: '300', letterSpacing: '0.3em', color: '#f0eeff', textShadow: '0 0 28px rgba(124,77,255,0.55)', animation: 'flicker-mid 9s infinite' }}>MERURIA</span>
          </a>
          <nav style={{ display: 'flex', gap: '6px', alignItems: 'center', flex: 1 }}>
            {NAV.map(tab => <NavItem key={tab.id} tab={tab} />)}
          </nav>
          <div style={{ fontFamily: 'var(--font-mono)', fontSize: '8px', color: 'rgba(160,140,255,0.35)', letterSpacing: '0.15em', flexShrink: 0 }}>DIVISIONS-ARCHIV v1.0</div>
        </div>
      </div>

      {/* BODY */}
      <div style={{ display: 'flex', alignItems: 'flex-start', position: 'relative', zIndex: 5, minHeight: `calc(100vh - var(--nav-h))`, paddingLeft: 'var(--sidebar-w)' }}>
        <TOCSidebar navHeight={NAV_H} headerBottom={headerBottom} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <DivisionPage division={division} heroRef={heroRef} />
        </div>
      </div>

      {/* FOOTER */}
      <div style={{ position: 'relative', zIndex: 10, padding: '10px 32px', borderTop: '1px solid rgba(61,191,140,0.07)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div style={{ fontFamily: 'var(--font-mono)', fontSize: '7px', color: 'rgba(61,191,140,0.22)', letterSpacing: '0.2em' }}>◈ ARCHIV-STATUS: NOMINAL ◈ EPOCHE: UNBEKANNT</div>
        <div style={{ fontFamily: 'var(--font-mono)', fontSize: '7px', color: 'rgba(61,191,140,0.22)', letterSpacing: '0.2em' }}>MERURIA // DIE VERWOBENEN REICHE</div>
      </div>

      <TweaksPanel>
        <TweakSection label="Darstellung" />
        <TweakToggle id="showParticles" label="Partikel" />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>


</body></html>
