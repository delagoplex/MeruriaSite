<html lang="de"><head>
<meta charset="UTF-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meruria — DM · Missionen</title>

<link rel="stylesheet" href="/assets/styles/global/base.css">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: calc(var(--vh, 1vh) * 100); display: flex; flex-direction: column; background: var(--bg); color: var(--white); }
#root { display: flex; flex-direction: column; min-height: calc(var(--vh, 1vh) * 100); }
input, textarea, select {
  font-family: var(--font-body); font-size: 13px; font-weight: 300;
  color: var(--white); background: rgba(var(--bg-rgb),0.6);
  border: 1px solid rgba(var(--purple-rgb),calc(0.25*var(--kp))); border-radius: 3px;
  padding: 7px 10px; outline: none; width: 100%;
  transition: border-color .15s;
}
input:focus, textarea:focus, select:focus { border-color: rgba(var(--purple-rgb),calc(0.6*var(--kp))); }
select option { background: rgb(var(--panel-rgb)); }
textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
label { display: block; font-family: var(--font-mono); font-size: 8px;
  letter-spacing: .22em; color: rgba(var(--purple-rgb),calc(0.55*var(--kp) + var(--tb))); text-transform: uppercase;
  margin-bottom: 5px; }
.field { margin-bottom: 14px; }
::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(var(--purple-rgb),calc(0.3*var(--kp))); border-radius: 2px; }
</style>
</head>
<body>
<div id="root"></div>

</body></html>
