// ── HEX ──────────────────────────────────────────────────
function hexPoints(s) {
  const cx = s / 2,cy = s / 2,r = s / 2,pts = [];
  for (let i = 0; i < 6; i++) {const a = Math.PI / 180 * (60 * i - 30);pts.push(`${cx + r * Math.cos(a)},${cy + r * Math.sin(a)}`);}
  return pts.join(' ');
}
function OctSvg({ size = 24, color = 'currentColor', fill = 'none', strokeWidth = 1, opacity = 1, style = {} }) {
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ display: 'block', flexShrink: 0, ...style }}>
      <polygon points={hexPoints(size)} fill={fill} stroke={color} strokeWidth={strokeWidth} opacity={opacity} />
    </svg>);

}

// ── PARTICLES ────────────────────────────────────────────
function ParticleField({ mouseX, mouseY }) {
  const canvasRef = useRef(null);
  const animRef = useRef(null);
  const particles = useRef([]);
  const mouse = useRef({ x: 0.5, y: 0.5 });
  useEffect(() => {mouse.current = { x: mouseX, y: mouseY };}, [mouseX, mouseY]);
  useEffect(() => {
    const canvas = canvasRef.current;if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const resize = () => {canvas.width = canvas.offsetWidth;canvas.height = canvas.offsetHeight;};
    resize();window.addEventListener('resize', resize);
    particles.current = Array.from({ length: 50 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 2.2 + 1.0, vx: (Math.random() - 0.5) * 0.03, vy: (Math.random() - 0.5) * 0.03, alpha: Math.random() * 0.22 + 0.05 }));
    const tick = () => {
      const w = canvas.width,h = canvas.height;
      const sx = (mouse.current.x - 0.5) * -14,sy = (mouse.current.y - 0.5) * -14;
      ctx.clearRect(0, 0, w, h);
      particles.current.forEach((p) => {
        p.x += p.vx / w * 60;p.y += p.vy / h * 60;
        if (p.x < 0) p.x = 1;if (p.x > 1) p.x = 0;if (p.y < 0) p.y = 1;if (p.y > 1) p.y = 0;
        ctx.beginPath();ctx.arc(p.x * w + sx, p.y * h + sy, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(160,140,255,${p.alpha})`;ctx.fill();
      });
      animRef.current = requestAnimationFrame(tick);
    };
    tick();
    return () => {cancelAnimationFrame(animRef.current);window.removeEventListener('resize', resize);};
  }, []);
  return <canvas ref={canvasRef} style={{ position: 'fixed', inset: 0, width: '100%', height: '100%', pointerEvents: 'none', zIndex: 0 }} />;
}

// ── SCROLL REVEAL ─────────────────────────────────────────
function useScrollReveal(dep) {
  useEffect(() => {
    document.querySelectorAll('.reveal-up,.reveal-left').forEach((el) => el.classList.remove('visible'));
    let observer;
    const revealed = new WeakSet();
    const revealEl = (el, delay) => {if (revealed.has(el)) return;revealed.add(el);setTimeout(() => el.classList.add('visible'), delay);};
    const init = () => {
      observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          const el = entry.target;observer.unobserve(el);
          revealEl(el, 0);
        });
      }, { threshold: 0.04, rootMargin: '0px 0px -16px 0px' });
      document.querySelectorAll('.reveal-up,.reveal-left').forEach((el) => {el.classList.remove('visible');observer.observe(el);});
    };
    const t = setTimeout(init, 80);
    return () => {clearTimeout(t);observer && observer.disconnect();};
  }, [dep]);
}

function RuestungTable({ title, rows, accent }) {
  const [expandedRow, setExpandedRow] = useState(null);
  return (
    <div className="reveal-up" style={{ marginBottom:'28px' }}>
      <div style={{ border:`1px solid ${accent}22`, borderRadius:'3px', overflow:'hidden', background:'rgba(10,8,28,0.6)' }}>
        <table className="eq-table" style={{ width:'100%' }}>
          <thead>
            <tr>
              <th style={{ background:`${accent}30`, textTransform:'lowercase', fontVariant:'small-caps' }}>{title}</th>
              <th style={{ background:`${accent}30`, width:'130px' }}>Kosten</th>
              <th style={{ background:`${accent}30`, width:'210px' }}>Rüstungsklasse (RK)</th>
              <th style={{ background:`${accent}30`, width:'80px' }}>Stärke</th>
              <th style={{ background:`${accent}30`, width:'110px' }}>Heimlichkeit</th>
              <th style={{ background:`${accent}30`, width:'70px' }}>Pfund</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r,i) => {
              const hasDesc = !!RUESTUNG_DESCS[r.name];
              const isOpen = expandedRow === i;
              return (
                <React.Fragment key={i}>
                  <tr style={{ cursor: hasDesc ? 'pointer' : 'default' }} onClick={() => hasDesc && setExpandedRow(isOpen ? null : i)}>
                    <td style={{ color:'rgba(220,210,255,0.85)', fontWeight:'400', display:'flex', alignItems:'center', gap:'6px' }}>
                      {hasDesc && <span style={{ display:'inline-block', width:'14px', height:'14px', lineHeight:'14px', textAlign:'center', borderRadius:'50%', border:`1px solid ${accent}44`, fontSize:'9px', color:`${accent}88`, flexShrink:0, fontFamily:'var(--font-mono)', transition:'transform 0.15s', transform: isOpen ? 'rotate(45deg)' : 'none' }}>+</span>}
                      {r.name}
                    </td>
                    <td className="cost">{r.kosten}</td>
                    <td style={{ color:`${accent}99`, fontFamily:'var(--font-mono)', fontSize:'11px' }}>{r.rk}</td>
                    <td style={{ color: r.staerke !== '—' ? 'rgba(255,180,100,0.8)' : 'rgba(200,190,240,0.35)', fontSize:'11px' }}>{r.staerke}</td>
                    <td style={{ color: r.heimlichkeit === 'Nachteil' ? 'rgba(255,100,100,0.7)' : 'rgba(200,190,240,0.35)', fontSize:'11px' }}>{r.heimlichkeit}</td>
                    <td className="weight">{r.pfund}</td>
                  </tr>
                  {isOpen && RUESTUNG_DESCS[r.name] && (
                    <tr>
                      <td colSpan={6} style={{ padding:'0 14px 12px 34px', background:`${accent}08`, borderBottom:`1px solid ${accent}10` }}>
                        <p style={{ fontFamily:'var(--font-body)', fontSize:'11px', fontWeight:'300', lineHeight:'1.8', color:'rgba(190,180,240,0.65)', letterSpacing:'0.02em', animation:'fadeInUp 0.2s ease forwards' }}>{RUESTUNG_DESCS[r.name]}</p>
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

    intro: 'Jemand, der sich auf den Umgang mit Glasbläserwerkzeugen versteht, kann nicht nur Glas formen, sondern bringt auch Fachwissen über die Herstellungstechniken von Glasgegenständen mit.',

      { titel: 'Arkane Kunde, Geschichte', text: 'Deine Kenntnisse der Glasherstellung erweisen sich auch als hilfreich, wenn du ein gläsernes Objekt untersuchst, etwa eine Trankphiole oder einen gläsernen Gegenstand, den du in einem Schatzhort gefunden hast. Du könntest zum Beispiel untersuchen, wie sich das Innere einer gläsernen Phiole durch den darin enthaltenen Trank verändert hat und so den Effekt des Tranks bestimmen.' },

      { titel: 'Schwachstellen entdecken', text: 'Wenn du ein Objekt aus Glas 1 Minute lang studierst, bist du in der Lage, die Schwachstellen des Objekts zu erkennen. Triffst du das Objekt an diesem Schwachpunkt, wird der verursachte Schaden verdoppelt.' },

  },
  'Holzschnitzwerkzeuge': {

  'Juwelierwerkzeuge': {

  'Kalligraphiewerkzeuge': {
    intro: 'Kalligraphie ist die filigrane Kunst des Schönschreibens. Kalligraphen fertigen Texte an, die wunderschön anzusehen sind, und ihr Stil lässt sich nur schwer imitieren. Ihre Werkzeuge eignen sich außerdem auch dazu, Texte auf ihre Echtheit hin zu überprüfen, denn schließlich verbringt der Kalligraph während seiner Ausbildung viele Stunden damit, Schriften zu studieren und ihren Stil und ihre Schreibweise nachzuahmen.',
    abschnitte: [
      { titel: 'Bestandteile', text: 'Die Kalligraphiewerkzeuge setzen sich zusammen aus Tinte, zwölf Bögen Pergament und drei Federkielen.' },
      { titel: 'Arkane Kunde', text: 'Auch wenn Kalligraphie nicht hilfreich ist, magische Schriften zu entziffern, sind diese Werkzeuge dennoch eine große Hilfe, wenn es darum geht, die Identität des Autors eines magischen Textes zu ermitteln.' },
      { titel: 'Geschichte', text: 'Durch deine Übung im Umgang mit Kalligraphiewerkzeugen erfährst du möglicherweise zusätzliche Informationen, wenn du erfolgreiche Würfe zur Untersuchung und Analyse von Schriftstücken, Schriftrollen oder anderen Texten durchführst.' },

    ],

  'Kartographenwerkzeuge': {
    intro: 'Mithilfe der Kartographenwerkzeuge kannst du akkurate Karten anfertigen, die dir und jenen, die nach dir kommen, eine angenehmere Reise bescheren. Diese Karten erfüllen das gesamte Spektrum von großmaßstäblichen Darstellungen von Gebirgen bis hin zu detaillierten Darstellungen von Gewölbeebenen.',

      { titel: 'Überlebenskunst', text: 'Dank deiner Geographiekenntnisse fällt es dir leichter, Wege zurück zur Zivilisation zu finden, vorherzusagen, in welchen Gebieten sich höchstwahrscheinlich Dörfer oder Städte befinden, und dich nicht zu verlaufen.' },

    sg: [

  'Kochutensilien': {
    intro: 'Das Leben eines Abenteurers ist hart. Wenn ein Koch dich auf deinen Reisen begleitet, werden deine Mahlzeiten wesentlich besser sein als die sonst übliche Mischung aus Zwieback und getrockneten Früchten.',

  'Schusterwerkzeuge': {

// ── TOOL ACCORDION ────────────────────────────────────────
function ToolAccordion({ name, accent }) {
  const [open, setOpen] = useState(false);
  const raw = WERKZEUG_DETAILS[name];
  if (!raw) return null;
  const data = raw.shared ? SHARED_DESCRIPTIONS[raw.shared] : raw;
  const isShared = !!raw.shared;

  return (
    <div style={{
      borderBottom: `1px solid ${accent}12`,
      overflow: 'hidden',
    }}>
      {/* Header row */}
      <button
        onClick={() => setOpen(o => !o)}
        style={{
          width: '100%', display: 'flex', alignItems: 'center', gap: '10px',
          padding: '9px 14px',
          background: open ? `${accent}10` : 'transparent',
          border: 'none', cursor: 'pointer', textAlign: 'left',
          transition: 'background 0.15s',
        }}
        onMouseEnter={e => { if (!open) e.currentTarget.style.background = `${accent}08`; }}
        onMouseLeave={e => { if (!open) e.currentTarget.style.background = 'transparent'; }}
      >
        <span style={{
          display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
          width: '14px', height: '14px', flexShrink: 0,
          border: `1px solid ${accent}44`, borderRadius: '2px',
          fontFamily: 'var(--font-mono)', fontSize: '9px', color: `${accent}99`,
          transition: 'transform 0.2s, color 0.15s',
          transform: open ? 'rotate(45deg)' : 'none',
        }}>+</span>
        <span style={{
          fontFamily: 'var(--font-body)', fontSize: '12px', fontWeight: open ? '500' : '300',
          color: open ? '#f0eeff' : 'rgba(200,190,240,0.8)',
          letterSpacing: '0.04em', flex: 1,
          transition: 'color 0.15s',
        }}>{name}</span>
        {data.placeholder && (
          <span style={{ fontFamily: 'var(--font-mono)', fontSize: '8px', letterSpacing: '0.15em', color: `${accent}44`, textTransform: 'uppercase' }}>bald verfügbar</span>
        )}
        {isShared && (
          <span style={{ fontFamily: 'var(--font-mono)', fontSize: '8px', letterSpacing: '0.15em', color: `${accent}55`, textTransform: 'uppercase' }}>gemeinsame Beschreibung</span>
        )}
      </button>

      {/* Expanded content */}
      {open && !data.placeholder && (
        <div style={{ padding: '0 14px 16px 38px', animation: 'fadeInUp 0.18s ease forwards' }}>
          {isShared && (
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: '8px', letterSpacing: '0.18em', color: `${accent}55`, textTransform: 'uppercase', marginBottom: '8px' }}>
              Alle {raw.shared === 'musikinstrument' ? 'Musikinstrumente' : 'Spielsets'} teilen diese Beschreibung
            </div>
          )}
          {data.intro && (
            <p style={{ fontFamily: 'var(--font-body)', fontSize: '11px', fontWeight: '300', lineHeight: '1.8', color: 'rgba(190,180,240,0.6)', marginBottom: '12px', letterSpacing: '0.02em' }}>
              {data.intro}
            </p>
          )}
          {data.abschnitte.map((s, i) => (
            <p key={i} style={{ fontFamily: 'var(--font-body)', fontSize: '11px', fontWeight: '300', lineHeight: '1.8', color: 'rgba(190,180,240,0.6)', marginBottom: '8px', letterSpacing: '0.02em' }}>
              <strong style={{ color: 'rgba(220,210,255,0.75)', fontWeight: '500' }}>{s.titel}. </strong>{s.text}
            </p>
          ))}
          {data.sg && data.sg.length > 0 && (
            <div style={{ marginTop: '12px', border: `1px solid ${accent}18`, borderRadius: '2px', overflow: 'hidden', maxWidth: '480px' }}>
              <table className="eq-table" style={{ width: '100%' }}>
                <thead>
                  <tr>
                    <th style={{ background: `${accent}28`, fontSize: '10px' }}>Aktivität</th>
                    <th style={{ background: `${accent}28`, width: '80px', fontSize: '10px' }}>SG</th>
                  </tr>
                </thead>
                <tbody>
                  {data.sg.map((row, i) => (
                    <tr key={i}>
                      <td style={{ fontSize: '11px', color: 'rgba(190,180,240,0.65)' }}>{row.aktivitaet}</td>
                      <td style={{ fontFamily: 'var(--font-mono)', fontSize: '11px', color: `${accent}99`, textAlign: 'center' }}>{row.sg}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      {open && data.placeholder && (
        <div style={{ padding: '10px 14px 14px 38px' }}>
          <span style={{ fontFamily: 'var(--font-mono)', fontSize: '9px', letterSpacing: '0.2em', color: `${accent}33`, textTransform: 'uppercase' }}>— Beschreibung wird vorbereitet —</span>
        </div>
      )}
    </div>
  );
}

// ── ROLL TABLE ────────────────────────────────────────────
function RollTable({ title, rows, accent }) {
  const [highlighted, setHighlighted] = useState(null);
  const [rolling, setRolling] = useState(false);
  const rowRefs = useRef([]);

  const handleRoll = () => {
    if (rolling) return;
    setRolling(true);
    let ticks = 0;
    const total = 14 + Math.floor(Math.random() * 8);
    const interval = setInterval(() => {
      setHighlighted(Math.floor(Math.random() * rows.length));
      ticks++;
      if (ticks >= total) {
        clearInterval(interval);
        const final = Math.floor(Math.random() * rows.length);
        setHighlighted(final);
        setRolling(false);
      }
    }, ticks < total * 0.6 ? 60 : ticks < total * 0.85 ? 110 : 190);
  };

  return (
    <div className="reveal-up" style={{ marginBottom: '36px' }}>
      {/* Sub-header */}
      <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '12px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '8px', flex: 1 }}>
          <OctSvg size={7} color={`${accent}55`} fill={`${accent}18`} strokeWidth={1} />
          <span style={{ fontFamily: 'var(--font-display)', fontSize: '14px', fontWeight: '300', letterSpacing: '0.18em', color: 'rgba(210,205,255,0.75)', textTransform: 'uppercase' }}>{title}</span>
        </div>
        <button
          onClick={handleRoll}
          disabled={rolling}
          style={{
            display: 'flex', alignItems: 'center', gap: '6px',
            padding: '5px 14px',
            background: rolling ? `${accent}18` : `${accent}22`,
            border: `1px solid ${accent}55`,
            borderRadius: '2px',
            color: rolling ? `${accent}77` : `${accent}cc`,
            fontFamily: 'var(--font-mono)',
            fontSize: '9px',
            letterSpacing: '0.2em',
            cursor: rolling ? 'not-allowed' : 'pointer',
            transition: 'all 0.15s',
            textTransform: 'uppercase',
          }}
          onMouseEnter={(e) => { if (!rolling) { e.currentTarget.style.background = `${accent}33`; e.currentTarget.style.color = '#f0eeff'; }}}
          onMouseLeave={(e) => { if (!rolling) { e.currentTarget.style.background = `${accent}22`; e.currentTarget.style.color = `${accent}cc`; }}}
        >
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none" style={{ flexShrink: 0, opacity: rolling ? 0.4 : 1 }}>
            <rect x="1" y="1" width="9" height="9" rx="1.5" stroke="currentColor" strokeWidth="1"/>
            <circle cx="3.5" cy="3.5" r="0.9" fill="currentColor"/>
            <circle cx="7.5" cy="7.5" r="0.9" fill="currentColor"/>
            <circle cx="7.5" cy="3.5" r="0.9" fill="currentColor"/>
            <circle cx="3.5" cy="7.5" r="0.9" fill="currentColor"/>
          </svg>
          Roll
        </button>
      </div>

      <div style={{ border: `1px solid ${accent}22`, borderRadius: '3px', overflow: 'hidden', background: 'rgba(10,8,28,0.6)' }}>
        <table className="eq-table" style={{ width: '100%' }}>
          <thead>
            <tr>
              <th style={{ background: `${accent}30` }}>Gegenstand</th>
              <th style={{ background: `${accent}30`, width: '160px' }}>Kosten</th>
              <th style={{ background: `${accent}30`, width: '90px' }}>Gewicht</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r, i) => {
              const isHit = highlighted === i;
              return (
                <tr
                  key={i}
                  ref={el => rowRefs.current[i] = el}
                  style={{
                    background: isHit ? `${accent}22` : 'transparent',
                    transition: 'background 0.08s',
                    outline: isHit ? `1px solid ${accent}55` : 'none',
                    outlineOffset: '-1px',
                  }}
                >
                  <td style={{ color: isHit ? '#f0eeff' : 'rgba(200,190,240,0.8)', fontWeight: isHit ? '500' : '300', transition: 'color 0.08s' }}>{r.name}</td>
                  <td className="cost" style={{ color: isHit ? `${accent}cc` : undefined }}>{r.kosten}</td>
                  <td className="weight" style={{ color: isHit ? '#f0eeff' : undefined }}>{r.pfund === '—' ? '—' : `${r.pfund} Pfd.`}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

        Der folgende Abschnitt geht im Detail auf die Werkzeuge ein, die im Players Handbook (Spielerhandbuch) vorgestellt werden, und gibt Tipps, wie du sie in einer Kampagne verwenden kannst.
      </p>
      <p className="reveal-up" style={{ fontFamily: 'var(--font-body)', fontWeight: '300', fontSize: '12px', lineHeight: '1.9', color: 'rgba(200,190,240,0.45)', letterSpacing: '0.04em', marginBottom: '10px', maxWidth: '680px' }}>
        <strong style={{ color: 'rgba(220,210,255,0.7)', fontWeight: '500' }}>Bestandteile.</strong> Der erste Absatz jeder Beschreibung ist den einzelnen Bestandteilen gewidmet, aus denen sich eine Ausrüstung oder ein Werkzeugsatz zusammensetzt. Ein Charakter, der im Umgang mit einem Werkzeug geübt ist, versteht es, alle Bestandteile einer Ausrüstung oder eines Werkzeugsatzes zu nutzen.
      </p>
      <p className="reveal-up" style={{ fontFamily: 'var(--font-body)', fontWeight: '300', fontSize: '12px', lineHeight: '1.9', color: 'rgba(200,190,240,0.45)', letterSpacing: '0.04em', marginBottom: '10px', maxWidth: '680px' }}>
        <strong style={{ color: 'rgba(220,210,255,0.7)', fontWeight: '500' }}>Fertigkeiten.</strong> Potenziell bist du dank Werkzeugen im Vorteil bei einem Wurf, wenn besagte Werkzeuge in Verbindung mit bestimmten Fertigkeiten eingesetzt werden. Dies gilt jedoch nur, wenn der Charakter sowohl den Umgang mit dem Werkzeug als auch mit der Fertigkeit beherrscht. Als SL kannst du dann bestimmen, dass ein Charakter bei einem Wurf mit der angegebenen Fertigkeit im Vorteil ist. Wenn zu Beginn eines Absatzes die Bezeichnung einer Fertigkeit steht, wird dort näher auf die hier beschriebenen Möglichkeiten eingegangen. Nur jemand, der mit dem jeweiligen Werkzeug geübt ist, kommt in den Genuss der im jeweiligen Absatz beschriebenen Vorzüge. Es genügt nicht, das Werkzeug lediglich zu besitzen.
      </p>
      <p className="reveal-up" style={{ fontFamily: 'var(--font-body)', fontWeight: '300', fontSize: '12px', lineHeight: '1.9', color: 'rgba(200,190,240,0.45)', letterSpacing: '0.04em', marginBottom: '10px', maxWidth: '680px' }}>

      </p>

// ── TAND ROLL TABLE ───────────────────────────────────────
function TandRollTable({ title, items, accent, diceLabel }) {
  const [open, setOpen] = useState(false);
  const [highlighted, setHighlighted] = useState(null);
  const [rolling, setRolling] = useState(false);
  const rowRefs = useRef([]);

  const handleRoll = (e) => {
    e.stopPropagation();
    if (rolling) return;
    if (!open) setOpen(true);
    setRolling(true);
    let ticks = 0;
    const total = 16 + Math.floor(Math.random() * 10);
    const interval = setInterval(() => {
      ticks++;
      setHighlighted(Math.floor(Math.random() * items.length));
      if (ticks >= total) {
        clearInterval(interval);
        const final = Math.floor(Math.random() * items.length);
        setHighlighted(final);
        setRolling(false);
        setTimeout(() => {
          const el = rowRefs.current[final];
          if (el) {
            const top = el.offsetTop - 120;
            el.closest('.tand-scroll-container') && el.closest('.tand-scroll-container').scrollTo({ top, behavior: 'smooth' });
          }
        }, 80);
      }
    }, ticks < total * 0.55 ? 55 : ticks < total * 0.8 ? 100 : 180);
  };

  return (
    <div className="reveal-up" style={{ marginBottom: '16px', border: `1px solid ${accent}22`, borderRadius: '4px', overflow: 'hidden', background: 'rgba(8,6,20,0.7)' }}>
      {/* Header — clickable to toggle */}
      <div
        onClick={() => setOpen(o => !o)}
        style={{
          display: 'flex', alignItems: 'center', gap: '12px',
          padding: '14px 18px', cursor: 'pointer',
          background: open ? `${accent}10` : 'transparent',
          transition: 'background 0.15s',
          userSelect: 'none',
        }}
        onMouseEnter={e => { if (!open) e.currentTarget.style.background = `${accent}08`; }}
        onMouseLeave={e => { if (!open) e.currentTarget.style.background = 'transparent'; }}
      >
        <span style={{
          display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
          width: '16px', height: '16px', flexShrink: 0,
          border: `1px solid ${accent}44`, borderRadius: '2px',
          fontFamily: 'var(--font-mono)', fontSize: '10px', color: `${accent}99`,
          transition: 'transform 0.2s',
          transform: open ? 'rotate(45deg)' : 'none',
        }}>+</span>
        <span style={{ fontFamily: 'var(--font-display)', fontSize: '14px', fontWeight: '300', letterSpacing: '0.18em', color: open ? '#f0eeff' : 'rgba(210,205,255,0.75)', textTransform: 'uppercase', flex: 1, transition: 'color 0.15s' }}>{title}</span>
        <span style={{ fontFamily: 'var(--font-mono)', fontSize: '9px', color: `${accent}55`, letterSpacing: '0.15em' }}>{diceLabel} · {items.length} Einträge</span>
        {/* Roll button */}
        <button
          onClick={handleRoll}
          disabled={rolling}
          style={{
            display: 'flex', alignItems: 'center', gap: '5px',
            padding: '4px 12px', marginLeft: '8px',
            background: rolling ? `${accent}18` : `${accent}22`,
            border: `1px solid ${accent}55`, borderRadius: '2px',
            color: rolling ? `${accent}77` : `${accent}cc`,
            fontFamily: 'var(--font-mono)', fontSize: '9px', letterSpacing: '0.2em',
            cursor: rolling ? 'not-allowed' : 'pointer', transition: 'all 0.15s',
            textTransform: 'uppercase', flexShrink: 0,
          }}
          onMouseEnter={e => { if (!rolling) { e.currentTarget.style.background = `${accent}33`; e.currentTarget.style.color = '#f0eeff'; }}}
          onMouseLeave={e => { if (!rolling) { e.currentTarget.style.background = `${accent}22`; e.currentTarget.style.color = `${accent}cc`; }}}
        >
          <svg width="10" height="10" viewBox="0 0 11 11" fill="none" style={{ flexShrink: 0, opacity: rolling ? 0.4 : 1 }}>
            <rect x="1" y="1" width="9" height="9" rx="1.5" stroke="currentColor" strokeWidth="1"/>
            <circle cx="3.5" cy="3.5" r="0.9" fill="currentColor"/>
            <circle cx="7.5" cy="7.5" r="0.9" fill="currentColor"/>
            <circle cx="7.5" cy="3.5" r="0.9" fill="currentColor"/>
            <circle cx="3.5" cy="7.5" r="0.9" fill="currentColor"/>
          </svg>
          Roll
        </button>
      </div>

      {/* Expanded table */}
      {open && (
        <div className="tand-scroll-container" style={{ maxHeight: '420px', overflowY: 'auto', borderTop: `1px solid ${accent}15` }}>
          <table className="eq-table" style={{ width: '100%' }}>
            <thead>
              <tr>
                <th style={{ background: `${accent}28`, width: '60px' }}>W{items.length}</th>
                <th style={{ background: `${accent}28` }}>Gegenstand</th>
              </tr>
            </thead>
            <tbody>
              {items.map((item, i) => {
                const isHit = highlighted === i;
                return (
                  <tr
                    key={i}
                    ref={el => rowRefs.current[i] = el}
                    style={{
                      background: isHit ? `${accent}22` : 'transparent',
                      transition: 'background 0.08s',
                      outline: isHit ? `1px solid ${accent}55` : 'none',
                      outlineOffset: '-1px',
                    }}
                  >
                    <td style={{ fontFamily: 'var(--font-mono)', fontSize: '11px', color: isHit ? `${accent}cc` : `${accent}55`, textAlign: 'center', width: '60px' }}>{i + 1}</td>
                    <td style={{ color: isHit ? '#f0eeff' : 'rgba(200,190,240,0.75)', fontWeight: isHit ? '500' : '300', fontSize: '12px', transition: 'color 0.08s' }}>{item}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

          <tbody>
            {[
              { w: '1', label: 'Tand', key: 'tand' },
              { w: '2', label: 'Schauriger Tand', key: 'schaurig' },
              { w: '3', label: 'Erstaunlicher Tand', key: 'erstaunlich' },
            ].map((r, i) => (
              <tr key={i} style={{ background: selectedTable === r.key ? `${accent}22` : 'transparent', transition: 'background 0.15s', outline: selectedTable === r.key ? `1px solid ${accent}55` : 'none', outlineOffset: '-1px' }}>
                <td style={{ fontFamily: 'var(--font-mono)', fontSize: '11px', color: selectedTable === r.key ? `${accent}cc` : `${accent}55`, textAlign: 'center' }}>{r.w}</td>
                <td style={{ color: selectedTable === r.key ? '#f0eeff' : 'rgba(200,190,240,0.75)', fontWeight: selectedTable === r.key ? '500' : '300' }}>{r.label}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* The three roll tables */}
      <TandRollTable title="Tand" items={TAND_ITEMS} accent={accent} diceLabel="W100" />
      <TandRollTable title="Schauriger Tand" items={SCHAURIGER_TAND_ITEMS} accent={accent} diceLabel="W100" />
      <TandRollTable title="Erstaunlicher Tand" items={ERSTAUNLICHER_TAND_ITEMS} accent={accent} diceLabel="W20" />
    </div>
  );
}

// ── PLACEHOLDER SECTION ───────────────────────────────────
function PlaceholderSection({ label, accent }) {
  return (
    <div className="reveal-up" style={{ padding: '40px 28px', border: `1px dashed ${accent}22`, borderRadius: '4px', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '10px', background: `${accent}05` }}>
      <OctSvg size={24} color={`${accent}33`} fill={`${accent}0a`} strokeWidth={1} />
      <span style={{ fontFamily: 'var(--font-mono)', fontSize: '9px', letterSpacing: '0.25em', color: `${accent}44`, textTransform: 'uppercase' }}>{label} — Daten werden vorbereitet</span>
    </div>);

}

// ── ABENTEUERAUSRÜSTUNG CONTENT ───────────────────────────
function AbenteuerContent({ accent }) {
  return (
    <div>
      <SectionHeader label="Abenteuerausrüstung" accent={accent} mono="Spielerhandbuch · Ausrüstung" />

      {/* Intro text */}
      <p className="reveal-up" style={{ fontFamily: 'var(--font-body)', fontWeight: '300', fontSize: '12px', lineHeight: '1.9', color: 'rgba(200,190,240,0.55)', letterSpacing: '0.04em', marginBottom: '28px', maxWidth: '680px' }}>Vom einfachen Seil bis zur magischen Phiole — die richtige Ausrüstung entscheidet über Leben und Tod. Hier findest du alles, was ein Abenteurer auf seinen Reisen durch die Neue Welt benötigt.

      </p>

      {/* Main table */}
      <div className="reveal-up" style={{ marginBottom: '36px', border: `1px solid rgba(124,77,255,0.15)`, borderRadius: '4px', overflow: 'hidden', background: 'rgba(10,8,28,0.6)' }}>
        <table className="eq-table" style={{ width: '100%' }}>
          <thead>
            <tr>
              <th style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                <span>Name</span>
                <OctSvg size={10} color="rgba(200,190,240,0.3)" strokeWidth={1} />
              </th>
              <th style={{ width: '160px' }}>Kosten</th>
              <th style={{ width: '90px' }}>Pfund</th>
            </tr>
          </thead>
          <tbody>
            {ABENTEUER_ITEMS.map((item, i) =>
            <ItemRow key={i} item={item} accent={accent} />
            )}
          </tbody>
        </table>
      </div>

      {/* Sub-tables */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '20px', marginBottom: '32px' }}>
        <SubTable title="Arkaner Fokus" rows={ARKANER_FOKUS} accent={accent} />
        <SubTable title="Druidischer Fokus" rows={DRUIDISCHER_FOKUS} accent={accent} />
        <SubTable title="Heiliges Symbol" rows={HEILIGES_SYMBOL} accent={accent} />
        <SubTable title="Geschosse" rows={GESCHOSSE} accent={accent} />
      </div>
      <SubTable title="Behälter" rows={BEHAELTER} accent={accent} hasKapazitaet={true} />

      {/* Ausrüstungspakete */}
      <div className="reveal-left" style={{ marginBottom: '22px', paddingBottom: '12px', borderBottom: `1px solid ${accent}22`, marginTop: '36px' }}>
        <div style={{ fontFamily: 'var(--font-mono)', fontSize: '8px', letterSpacing: '0.3em', color: `${accent}55`, textTransform: 'uppercase', marginBottom: '5px' }}>Spielerhandbuch · Ausrüstung</div>
        <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
          <OctSvg size={8} color={`${accent}66`} fill={`${accent}22`} strokeWidth={1} />
          <h2 style={{ fontFamily: 'var(--font-display)', fontSize: '18px', fontWeight: '300', letterSpacing: '0.2em', color: 'rgba(230,225,255,0.85)', textTransform: 'uppercase' }}>Ausrüstungspakete</h2>
        </div>
        <div style={{ width: '40px', height: '1px', background: `linear-gradient(90deg,${accent}77,transparent)`, marginTop: '10px', animation: 'pulse-glow 3s infinite' }} />
      </div>

      <p className="reveal-up" style={{ fontFamily: 'var(--font-body)', fontWeight: '300', fontSize: '12px', lineHeight: '1.9', color: 'rgba(200,190,240,0.55)', letterSpacing: '0.04em', marginBottom: '20px', maxWidth: '680px' }}>
        Die Anfangsausrüstung, die du durch deine Klasse erhältst, beinhaltet eine in einem Paket zusammmengefasste Sammlung nützlicher Abenteuerausrüstung. Die Inhalte dieser Pakete sind nachfolgend aufgelistet. Wenn du deine Anfangsausrüstung mit Geld selbst zusammenstellst, kannst du ein Paket für den angegebenen Preis erwerben, was möglicherweise günstiger ist, als alle Gegenstände einzeln zu kaufen.
      </p>

      <div className="reveal-up" style={{ border: `1px solid rgba(124,77,255,0.15)`, borderRadius: '4px', overflow: 'hidden', background: 'rgba(10,8,28,0.6)' }}>
        {AUSRUESTUNGSPAKETE.map((p, i) =>
        <div key={i} style={{ padding: '14px 18px', borderBottom: i < AUSRUESTUNGSPAKETE.length - 1 ? '1px solid rgba(124,77,255,0.08)' : 'none' }}>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: '10px', marginBottom: '4px', flexWrap: 'wrap' }}>
              <span style={{ fontFamily: 'var(--font-body)', fontWeight: '500', fontSize: '12px', color: 'rgba(220,210,255,0.9)', letterSpacing: '0.04em' }}>{p.name}</span>
              <span style={{ fontFamily: 'var(--font-mono)', fontSize: '9px', color: `${accent}77`, letterSpacing: '0.12em' }}>{p.kosten}</span>
            </div>
            <p style={{ fontFamily: 'var(--font-body)', fontWeight: '300', fontSize: '11px', lineHeight: '1.75', color: 'rgba(190,180,240,0.6)' }}>{p.inhalt}</p>
          </div>
        )}
      </div>
    </div>);

}

// ── SIDEBAR ───────────────────────────────────────────────
function Sidebar({ activeCategory, onSelect, accent }) {
  return (
    <aside style={{ width: 'var(--sidebar-w)', flexShrink: 0, position: 'sticky', top: '52px', height: 'calc(100vh - 52px)', borderRight: '1px solid rgba(160,140,255,0.1)', padding: '28px 0', background: 'rgba(5,4,15,0.85)', backdropFilter: 'blur(12px)', zIndex: 50, overflowY: 'auto', alignSelf: 'flex-start' }}>
      <div style={{ fontFamily: 'var(--font-mono)', fontSize: '8px', letterSpacing: '0.25em', color: 'rgba(160,140,255,0.4)', textTransform: 'uppercase', padding: '0 20px', marginBottom: '12px' }}>Ausrüstung</div>
      {CATEGORIES.map((cat) => {
        const isActive = cat.id === activeCategory;
        return (
          <button key={cat.id} onClick={() => onSelect(cat.id)}
          style={{ display: 'flex', alignItems: 'center', gap: '8px', width: '100%', textAlign: 'left', padding: '9px 20px', background: isActive ? `${accent}12` : 'transparent', border: 'none', borderLeft: isActive ? `2px solid ${accent}` : '2px solid transparent', cursor: 'pointer', fontFamily: 'var(--font-body)', fontWeight: isActive ? '500' : '400', fontSize: '12px', letterSpacing: '0.06em', color: isActive ? '#f0eeff' : 'rgba(200,190,240,0.6)', transition: 'all 0.15s' }}
          onMouseEnter={(e) => {if (!isActive) {e.currentTarget.style.color = '#f0eeff';e.currentTarget.style.borderLeftColor = `${accent}55`;e.currentTarget.style.background = `${accent}08`;}}}
          onMouseLeave={(e) => {if (!isActive) {e.currentTarget.style.color = 'rgba(200,190,240,0.6)';e.currentTarget.style.borderLeftColor = 'transparent';e.currentTarget.style.background = 'transparent';}}}>
            <OctSvg size={6} color={isActive ? accent : 'rgba(124,77,255,0.4)'} fill={isActive ? `${accent}44` : 'rgba(124,77,255,0.12)'} strokeWidth={1} style={{ flexShrink: 0 }} />
            <span>{cat.label}</span>
          </button>);

      })}
    </aside>);

}

// ── APP ───────────────────────────────────────────────────
function App() {
  const [mouse, setMouse] = useState({ x: 0.5, y: 0.5 });
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [activeCategory, setActiveCategory] = useState('abenteuer');

  const accent = tweaks.accentColor || '#7c4dff';
  const handleMouseMove = useCallback((e) => {setMouse({ x: e.clientX / window.innerWidth, y: e.clientY / window.innerHeight });}, []);
  useScrollReveal(activeCategory);

  const handleSelect = (id) => {
    setActiveCategory(id);
    // scroll content pane to top
    const content = document.getElementById('eq-content');
    if (content) content.parentElement.scrollTop = 0;
  };

  return (
    <div onMouseMove={handleMouseMove} style={{ position: 'relative', minHeight: '100vh' }}>
      {tweaks.showParticles && <ParticleField mouseX={mouse.x} mouseY={mouse.y} />}

      {/* NAV */}
      <div style={{ position: 'sticky', top: 0, zIndex: 100, width: '100%', background: 'rgba(5,4,15,0.92)', borderBottom: '1px solid rgba(160,140,255,0.1)', backdropFilter: 'blur(16px)' }}>
        <div style={{ display: 'flex', alignItems: 'center', padding: '0 32px', height: '52px' }}>
          <a href="Meruria.html" style={{ marginRight: '32px', whiteSpace: 'nowrap', flexShrink: 0, textDecoration: 'none' }}>
            <span style={{ fontFamily: 'var(--font-display)', fontSize: '20px', fontWeight: '300', letterSpacing: '0.3em', color: '#f0eeff', textShadow: '0 0 28px rgba(124,77,255,0.55)', animation: 'flicker-mid 9s infinite' }}>MERURIA</span>
          </a>
          <nav style={{ display: 'flex', gap: '6px', alignItems: 'center', flex: 1 }}>
            {NAV_ITEMS.map((tab) => <NavItem key={tab.id} tab={tab} />)}
          </nav>
          <div style={{ fontFamily: 'var(--font-mono)', fontSize: '8px', color: 'rgba(160,140,255,0.35)', letterSpacing: '0.15em', flexShrink: 0 }}>AUSRÜSTUNGS-ARCHIV v1.0</div>
        </div>
      </div>

      {/* BODY */}
      <div style={{ display: 'flex', alignItems: 'flex-start', position: 'relative', zIndex: 5, minHeight: 'calc(100vh - 52px)' }}>
        <Sidebar activeCategory={activeCategory} onSelect={handleSelect} accent={accent} />

        <div style={{ flex: 1, padding: '32px 36px 64px', minWidth: 0, maxWidth: '1100px' }}>

          {/* Page title */}
          <div style={{ marginBottom: '36px' }}>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: '8px', letterSpacing: '0.25em', color: 'rgba(160,140,255,0.4)', textTransform: 'uppercase', marginBottom: '6px' }}>Spielerhandbuch</div>
            <h1 className="reveal-left visible" style={{ fontFamily: 'var(--font-display)', fontSize: '42px', fontWeight: '300', letterSpacing: '0.18em', color: '#f0eeff', textShadow: '0 0 30px rgba(124,77,255,0.35)' }}>Ausrüstung</h1>
            <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginTop: '12px' }}>
              <div style={{ width: '50px', height: '1px', background: 'linear-gradient(90deg,rgba(124,77,255,0.8),transparent)', animation: 'pulse-glow 3s infinite' }} />
              <OctSvg size={8} color="rgba(124,77,255,0.5)" fill="rgba(124,77,255,0.2)" strokeWidth={1} />
            </div>
          </div>

          {/* Category tabs (breadcrumb-style) */}
          <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap', marginBottom: '32px' }}>
            {CATEGORIES.map((cat) => {
              const isActive = cat.id === activeCategory;
              return (
                <button key={cat.id} onClick={() => handleSelect(cat.id)}
                style={{ padding: '5px 14px', fontFamily: 'var(--font-body)', fontSize: '11px', fontWeight: isActive ? '500' : '300', letterSpacing: '0.08em', background: isActive ? `${accent}22` : 'transparent', border: `1px solid ${isActive ? accent + '66' : 'rgba(124,77,255,0.2)'}`, color: isActive ? '#f0eeff' : 'rgba(200,190,240,0.5)', borderRadius: '2px', cursor: 'pointer', transition: 'all 0.15s' }}
                onMouseEnter={(e) => {if (!isActive) {e.currentTarget.style.color = 'rgba(220,210,255,0.8)';e.currentTarget.style.borderColor = 'rgba(124,77,255,0.4)';}}}
                onMouseLeave={(e) => {if (!isActive) {e.currentTarget.style.color = 'rgba(200,190,240,0.5)';e.currentTarget.style.borderColor = 'rgba(124,77,255,0.2)';}}}>
                  {cat.label}
                </button>);

            })}
          </div>

          {/* Content area */}
          <div id="eq-content">
            {activeCategory === 'abenteuer' && <AbenteuerContent accent={accent} />}
            {activeCategory === 'waffen' && <WaffenContent accent={accent} />}
            {activeCategory === 'ruestung' && <RuestungContent accent={accent} />}
            {activeCategory === 'werkzeuge' && <WerkzeugeContent accent={accent} />}
            {activeCategory === 'reittiere' && <ReittiereContent accent={accent} />}
            {activeCategory === 'tand' && <TandContent accent={accent} />}
          </div>
        </div>
      </div>

      {/* FOOTER */}
      <div style={{ position: 'relative', zIndex: 10, padding: '10px 32px', borderTop: '1px solid rgba(160,140,255,0.07)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div style={{ fontFamily: 'var(--font-mono)', fontSize: '7px', color: 'rgba(160,140,255,0.22)', letterSpacing: '0.2em' }}>◈ ARCHIV-STATUS: NOMINAL ◈ EPOCHE: UNBEKANNT</div>
        <div style={{ fontFamily: 'var(--font-mono)', fontSize: '7px', color: 'rgba(160,140,255,0.22)', letterSpacing: '0.2em' }}>MERURIA // DIE VERWOBENEN REICHE</div>
      </div>

      {/* TWEAKS */}
      <TweaksPanel>
        <TweakSection label="Darstellung" />
        <TweakColor id="accentColor" label="Akzentfarbe" />
        <TweakToggle id="showParticles" label="Partikel" />
      </TweaksPanel>
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>


</body></html>
