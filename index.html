<script type="text/babel">
const { useEffect:uE, useRef:uR } = React;

// ── Particles ──
function ParticleField({ mouse }) {
  const bgRef = uR(null);
  const fgRef = uR(null);
  const bgP   = uR([]);
  const fgP   = uR([]);
  const mRef  = uR({x:0.5,y:0.5});
  uE(() => { mRef.current = mouse; }, [mouse]);

  uE(() => {
    const bg = bgRef.current, fg = fgRef.current;
    const bgCtx = bg.getContext('2d'), fgCtx = fg.getContext('2d');
    const resize = () => { bg.width = fg.width = bg.offsetWidth; bg.height = fg.height = bg.offsetHeight; };
    resize(); window.addEventListener('resize', resize);
    bgP.current = Array.from({length:60}, () => ({
      x:Math.random(), y:Math.random(),
      r:Math.random()*1.4+0.5,
      vx:(Math.random()-0.5)*0.05, vy:(Math.random()-0.5)*0.05,
      a:Math.random()*0.22+0.04,
    }));
    fgP.current = Array.from({length:16}, () => ({
      x:Math.random(), y:Math.random(),
      r:Math.random()*3+2,
      vx:(Math.random()-0.5)*0.09, vy:(Math.random()-0.5)*0.09,
      a:Math.random()*0.18+0.05,
    }));
    let raf;
    const tick = () => {
      const w = bg.width, h = bg.height, mx = mRef.current.x, my = mRef.current.y;
      bgCtx.clearRect(0,0,w,h);
      const bsx = (mx-0.5)*-14, bsy = (my-0.5)*-14;
      bgP.current.forEach(p => {
        p.x += p.vx/w*60; p.y += p.vy/h*60;
        if(p.x<0)p.x=1; if(p.x>1)p.x=0; if(p.y<0)p.y=1; if(p.y>1)p.y=0;
        bgCtx.beginPath();
        bgCtx.arc(p.x*w+bsx, p.y*h+bsy, p.r, 0, Math.PI*2);
        bgCtx.fillStyle = `rgba(160,140,255,${p.a})`;
        bgCtx.fill();
      });
      fgCtx.clearRect(0,0,w,h);
      const fsx = (mx-0.5)*26, fsy = (my-0.5)*26;
      fgP.current.forEach(p => {
        p.x += p.vx/w*55; p.y += p.vy/h*55;
        if(p.x<0)p.x=1; if(p.x>1)p.x=0; if(p.y<0)p.y=1; if(p.y>1)p.y=0;
        const px = p.x*w+fsx, py = p.y*h+fsy;
        const g = fgCtx.createRadialGradient(px,py,0,px,py,p.r*2.5);
        g.addColorStop(0,`rgba(190,170,255,${p.a})`);
        g.addColorStop(1,`rgba(120,100,255,0)`);
        fgCtx.beginPath(); fgCtx.arc(px,py,p.r*2.5,0,Math.PI*2); fgCtx.fillStyle = g; fgCtx.fill();
      });
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
  }, []);

  return (
    <React.Fragment>
      <canvas ref={bgRef} style={{position:'fixed',inset:0,width:'100%',height:'100%',pointerEvents:'none',zIndex:0}}/>
      <canvas ref={fgRef} style={{position:'fixed',inset:0,width:'100%',height:'100%',pointerEvents:'none',zIndex:0,opacity:0.7}}/>
    </React.Fragment>
  );
}

Object.assign(window, { ParticleField });
</script>

<script type="text/babel">
const { useState:uS3, useEffect:uE3, useRef:uR3 } = React;

function PortalCard({ p, index }) {
  const [hover, setHover] = uS3(false);
  const ref = uR3(null);

  // intersection reveal
  uE3(() => {
    const el = ref.current; if (!el) return;
    const io = new IntersectionObserver(es => {
      es.forEach(e => { if (e.isIntersecting) { el.classList.add('in'); io.unobserve(el); } });
    }, { threshold: 0.12 });
    io.observe(el);
    return () => io.disconnect();
  }, []);

  const ac        = `oklch(0.68 0.18 ${p.hue})`;
  const acSoft    = `oklch(0.78 0.14 ${p.hue})`;
  const acStripe  = `oklch(0.68 0.18 ${p.hue} / 0.07)`;
  const acBorder  = hover ? `oklch(0.68 0.18 ${p.hue} / 0.8)` : `oklch(0.68 0.18 ${p.hue} / 0.22)`;
  const acGlow    = `oklch(0.68 0.18 ${p.hue} / 0.4)`;

  return (
    <a
      ref={ref}
      href="#"
      className="reveal"
      style={{ transitionDelay:`${index*70}ms`, textDecoration:'none', color:'inherit' }}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
    >
      <div style={{
        position:'relative', overflow:'hidden',
        padding:'28px 22px 24px',
        background: `repeating-linear-gradient(-45deg, transparent, transparent 12px, ${acStripe} 12px, ${acStripe} 13px), linear-gradient(160deg, rgba(20,12,46,0.85) 0%, rgba(10,7,28,0.92) 100%)`,
        border: `1px solid ${acBorder}`,
        borderRadius:'4px',
        boxShadow: hover
          ? `0 0 0 1px ${acGlow}, 0 24px 60px rgba(0,0,0,0.55), 0 0 80px ${acGlow}`
          : `0 12px 32px rgba(0,0,0,0.4)`,
        transition: 'border-color 0.3s, box-shadow 0.3s, transform 0.3s',
        transform: hover ? 'translateY(-3px)' : 'translateY(0)',
        cursor:'pointer',
        minHeight: 260,
        display:'flex', flexDirection:'column', alignItems:'center',
        textAlign:'center',
      }}>
        {/* corner brackets */}
        <span style={{position:'absolute',top:-1,left:-1,width:14,height:14,borderTop:`1px solid ${ac}`,borderLeft:`1px solid ${ac}`,opacity:0.75}}/>
        <span style={{position:'absolute',top:-1,right:-1,width:14,height:14,borderTop:`1px solid ${ac}`,borderRight:`1px solid ${ac}`,opacity:0.75}}/>
        <span style={{position:'absolute',bottom:-1,left:-1,width:14,height:14,borderBottom:`1px solid ${ac}`,borderLeft:`1px solid ${ac}`,opacity:0.75}}/>
        <span style={{position:'absolute',bottom:-1,right:-1,width:14,height:14,borderBottom:`1px solid ${ac}`,borderRight:`1px solid ${ac}`,opacity:0.75}}/>

        {/* sweep on hover */}
        {hover && <div style={{
          position:'absolute', inset:0,
          background:`linear-gradient(90deg, transparent 0%, ${acGlow} 50%, transparent 100%)`,
          opacity:0.35, animation:'sweep 0.9s ease-out forwards', pointerEvents:'none',
        }}/>}

        {/* radial glow on hover */}
        <div style={{
          position:'absolute', inset:0,
          background:`radial-gradient(ellipse at 50% 38%, ${acGlow} 0%, transparent 55%)`,
          opacity: hover ? 1 : 0.18,
          transition:'opacity 0.7s ease-out',
          pointerEvents:'none',
        }}/>

        {/* ── BIG hex sigil with Roman numeral ── */}
        <div style={{
          position:'relative', width:96, height:96,
          marginBottom:18, marginTop:6,
          display:'flex', alignItems:'center', justifyContent:'center',
          zIndex:1,
        }}>
          <svg viewBox="0 0 100 100" style={{
            position:'absolute', inset:0, width:'100%', height:'100%',
            transition:'transform 0.6s ease',
            transform: hover ? 'rotate(60deg)' : 'rotate(0deg)',
          }}>
            <polygon points="50,3 92,27 92,73 50,97 8,73 8,27" fill="none" stroke={ac} strokeWidth="1.2" opacity="0.85"/>
            <polygon points="50,14 82,32 82,68 50,86 18,68 18,32" fill="none" stroke={ac} strokeWidth="0.6" opacity="0.5"/>
          </svg>
          {/* inner static glyph (counter-rotates so numeral stays upright is overkill — keep it still by being outside the rotating svg) */}
          <span style={{
            position:'relative', zIndex:2,
            fontFamily:'var(--font-display)', fontWeight:400,
            fontSize:'30px', letterSpacing:'0.04em',
            color: hover ? '#ffffff' : acSoft,
            textShadow: hover
              ? `0 0 24px ${acGlow}, 0 0 48px ${acGlow}`
              : `0 0 14px ${acGlow}`,
            transition:'color 0.3s, text-shadow 0.3s',
          }}>{p.n}</span>
        </div>

        {/* title */}
        <h3 style={{
          fontFamily:'var(--font-display)', fontWeight:400,
          fontSize:'21px', letterSpacing:'0.18em',
          color:'#f3eefe', textTransform:'uppercase',
          textShadow: hover ? `0 0 24px ${acGlow}` : 'none',
          transition:'text-shadow 0.3s',
          marginBottom:8, position:'relative', zIndex:1,
          whiteSpace:'nowrap',
        }}>{p.label}</h3>

        {/* tagline — one short line */}
        <div style={{
          fontFamily:'var(--font-body)', fontWeight:300,
          fontSize:'12px', letterSpacing:'0.04em',
          color:'rgba(200,190,240,0.62)',
          position:'relative', zIndex:1,
          maxWidth:'85%',
          marginBottom:'auto',
        }}>{p.tag}</div>

        {/* Hover-revealed peek bar */}
        <div style={{
          position:'relative', zIndex:1,
          width:'100%', marginTop:18,
          paddingTop:14,
          borderTop:`1px solid oklch(0.68 0.18 ${p.hue} / ${hover?0.35:0.12})`,
          transition:'border-color 0.3s',
          display:'flex', alignItems:'center', justifyContent:'center', gap:10,
        }}>
          <span style={{
            fontFamily:'var(--font-mono)', fontSize:'8.5px',
            letterSpacing:'0.28em', color: hover ? acSoft : 'rgba(160,140,255,0.4)',
            textTransform:'uppercase',
            transition:'color 0.3s',
          }}>
            {p.peek.length} Unterseiten
          </span>
          <span style={{
            fontFamily:'var(--font-display)', fontSize:'14px', fontWeight:300,
            color: hover ? '#ffffff' : acSoft,
            opacity: hover ? 1 : 0.55,
            transition:'all 0.3s',
            transform: hover ? 'translateX(4px)' : 'translateX(0)',
            display:'inline-block',
          }}>→</span>
        </div>
      </div>
    </a>
  );
}

Object.assign(window, { PortalCard });
</script>


<!-- ═══════════════════════════════════════════
     SCRIPT 4 — Carousel
     ═══════════════════════════════════════════ -->
<script type="text/babel">
const { useState:uS4, useEffect:uE4, useRef:uR4 } = React;

const CP_W=152, CP_H=200;
const CL_W=280, CL_H=200;
const CGAP=14;
const BASE_SPD=0.030, CFRIC=0.9984;

function imgDims(img){ return img.w==='l' ? {w:CL_W,h:CL_H} : {w:CP_W,h:CP_H}; }

function Carousel({ images }) {
  const trackRef = uR4(null);
  const phys     = uR4({ offset:0, vel:0, drag:false, lx:0, lt:0 }).current;
  const [hov, setHov] = uS4(null);

  const n = images.length;
  const singleW = images.reduce((s,im) => s + imgDims(im).w + CGAP, 0);
  const tripled = [...images, ...images, ...images];

  uE4(() => {
    phys.offset = singleW;
    let raf, last = performance.now();
    const tick = (now) => {
      const dt = Math.min(now - last, 50); last = now;
      if (!phys.drag) {
        if (Math.abs(phys.vel) > 0.002) phys.vel *= Math.pow(CFRIC, dt); else phys.vel = 0;
        phys.offset += (BASE_SPD + phys.vel) * dt;
        while (phys.offset >= singleW*2) phys.offset -= singleW;
        while (phys.offset <  singleW)   phys.offset += singleW;
        if (trackRef.current) trackRef.current.style.transform = `translateX(${-phys.offset}px)`;
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [singleW]);

  uE4(() => {
    const onMove = (e) => {
      if (!phys.drag) return;
      const now = performance.now(), dx = e.clientX - phys.lx, dt = now - phys.lt;
      if (dt > 0) phys.vel = -dx / dt;
      phys.offset -= dx;
      while (phys.offset >= singleW*2) phys.offset -= singleW;
      while (phys.offset <  singleW)   phys.offset += singleW;
      if (trackRef.current) trackRef.current.style.transform = `translateX(${-phys.offset}px)`;
      phys.lx = e.clientX; phys.lt = now;
    };
    const onUp = () => { phys.drag = false; document.body.style.cursor=''; };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup',   onUp);
    return () => { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
  }, [singleW]);

  function onDown(e){ e.preventDefault(); phys.drag=true; phys.lx=e.clientX; phys.lt=performance.now(); phys.vel=0; document.body.style.cursor='grabbing'; }

  function tileStyle(ii) {
    const isHov = hov === ii;
    const {w,h} = imgDims(images[ii]);
    let tx = 0;
    if (hov !== null && !isHov) {
      let d = ii - hov; if (d > n/2) d -= n; if (d < -n/2) d += n;
      if (Math.abs(d) <= 3) tx = (d > 0 ? 1 : -1) * 28 / Math.abs(d);
    }
    return {
      width:w, height:h, flexShrink:0, position:'relative', overflow:'hidden',
      borderRadius:3, alignSelf:'flex-end', cursor:'pointer',
      transform: isHov ? 'scale(1.16) translateY(-10px)' : (tx ? `translateX(${tx}px)` : 'none'),
      boxShadow: isHov ? '0 0 26px rgba(124,77,255,0.85), 0 0 56px rgba(124,77,255,0.3)' : 'none',
      border: isHov ? '1.5px solid rgba(124,77,255,0.85)' : '1.5px solid rgba(124,77,255,0.12)',
      zIndex: isHov ? 20 : 1,
      transition:'transform 0.22s ease, box-shadow 0.2s ease, border-color 0.2s ease',
    };
  }

  return (
    <div onMouseDown={onDown} style={{ position:'relative', overflow:'visible', height:CP_H+52, userSelect:'none', cursor:'grab' }}>
      <div ref={trackRef} style={{ position:'absolute', top:26, left:0, display:'flex', gap:CGAP, alignItems:'flex-start', height:CP_H, willChange:'transform' }}>
        {tripled.map((img, gi) => {
          const ii = gi % n;
          const im = images[ii];
          return (
            <div key={gi} style={tileStyle(ii)} onMouseEnter={() => setHov(ii)} onMouseLeave={() => setHov(null)}>
              <div style={{
                width:'100%', height:'100%', position:'relative',
                display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:6,
                background: `repeating-linear-gradient(-45deg, transparent, transparent 8px, oklch(0.65 0.18 ${im.hue} / 0.13) 8px, oklch(0.65 0.18 ${im.hue} / 0.13) 9px), linear-gradient(160deg, rgba(28,16,62,0.97) 0%, rgba(14,9,36,0.98) 100%)`,
              }}>
                <div style={{ position:'absolute', inset:0, background:`radial-gradient(ellipse at 50% 45%, oklch(0.65 0.18 ${im.hue} / 0.22) 0%, transparent 60%)` }}/>
                <svg viewBox="0 0 40 30" width={im.w==='l'?22:18} height={im.w==='l'?16:13} fill="none" style={{opacity:0.5,zIndex:1}}>
                  <rect x="1" y="1" width="38" height="28" rx="2" stroke={`oklch(0.65 0.18 ${im.hue})`} strokeWidth="1.3"/>
                  <circle cx="12" cy="11" r="4" stroke={`oklch(0.65 0.18 ${im.hue})`} strokeWidth="1" opacity="0.8"/>
                  <path d="M1 22 L10 15 L18 20 L26 13 L39 22" stroke={`oklch(0.65 0.18 ${im.hue})`} strokeWidth="1.1" opacity="0.8"/>
                </svg>
                <span style={{fontFamily:'var(--font-mono)',fontSize:7,letterSpacing:'0.18em',color:`oklch(0.65 0.18 ${im.hue} / 0.55)`,textTransform:'uppercase',zIndex:1,textAlign:'center',padding:'0 6px',lineHeight:1.3}}>
                  artwork
                </span>
              </div>
              <div style={{position:'absolute',bottom:0,left:0,right:0,padding:'5px 8px',background:'rgba(5,4,15,0.85)',borderTop:'1px solid rgba(124,77,255,0.13)'}}>
                <div style={{fontFamily:'var(--font-mono)',fontSize:9,color:'rgba(240,238,255,0.65)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{im.title}</div>
              </div>
            </div>
          );
        })}
      </div>
      <div style={{position:'absolute',top:0,left:0,bottom:0,width:120,background:'linear-gradient(to right,#05040f 30%,transparent)',pointerEvents:'none',zIndex:10}}/>
      <div style={{position:'absolute',top:0,right:0,bottom:0,width:120,background:'linear-gradient(to left,#05040f 30%,transparent)',pointerEvents:'none',zIndex:10}}/>
    </div>
  );
}

Object.assign(window, { Carousel });
</script>

/* ── Moon SVG (matches Kalender Interaktiv) ───── */
function MoonIcon({ phaseDay=14, cycleLen=28, vollmondDay=16, color='#d9b06b', size=26 }) {
  const D = phaseDay;
  let ill;
  if (D <= vollmondDay) ill = (D - 1) / Math.max(1, vollmondDay - 1);
  else ill = 1 - (D - vollmondDay) / (cycleLen - vollmondDay + 1);
  ill = Math.max(0, Math.min(1, ill));
  const waxing = D <= vollmondDay;
  const r = 9, cx = 11, cy = 11;
  let body;
  if (ill < 0.02) body = <circle cx={cx} cy={cy} r={r} fill="#0b0820" stroke={color} strokeWidth="1.1"/>;
  else if (ill > 0.98) body = <circle cx={cx} cy={cy} r={r} fill={color} stroke={color} strokeWidth="1.1"/>;
  else {
    const rx = r * Math.abs(1 - 2*ill);
    const outer = waxing ? 1 : 0;
    const inner = (ill < 0.5) ? (waxing ? 0 : 1) : (waxing ? 1 : 0);
    const path = `M${cx},${cy-r} A${r},${r} 0 0,${outer} ${cx},${cy+r} A${rx},${r} 0 0,${inner} ${cx},${cy-r} Z`;
    body = <React.Fragment>
      <circle cx={cx} cy={cy} r={r} fill="#0b0820" stroke={color} strokeWidth="1.1"/>
      <path d={path} fill={color}/>
    </React.Fragment>;
  }
  return <svg viewBox="0 0 22 22" width={size} height={size} style={{flexShrink:0,filter:`drop-shadow(0 0 6px ${color}66)`}}>{body}</svg>;
}

function heuteDoyFor(h) {
  let d = h.day;
  for (let m=0; m<h.monthIdx; m++) d += HEUTE_MONTHS[m].days;
  return d;
}
const HEUTE_HOLIDAY_DOYS = HEUTE_HOLIDAYS.map(h => ({ ...h, doy: heuteDoyFor(h) })).sort((a,b)=>a.doy-b.doy);

function heuteNextHoliday(doy) {
  for (const h of HEUTE_HOLIDAY_DOYS) {
    if (h.doy > doy) return { ...h, daysUntil: h.doy - doy };
  }
  const first = HEUTE_HOLIDAY_DOYS[0];
  return { ...first, daysUntil: HEUTE_YEAR_DAYS - doy + first.doy };
}

// Baseline: Aprel 14, 237 n.d.L., Eiru, Goldmond Tag 16 (Vollmond), Aschmond Tag 8
const HEUTE_BASE_DOY  = 19 + 18 + 19 + 14; // 70
const HEUTE_BASE_YEAR = 237;
const HEUTE_BASE_GOLD = 16;
const HEUTE_BASE_ASH  = 8;
const HEUTE_BASE_WD_IDX = 1; // Eiru

function heuteFromOffset(offset) {
  const total = HEUTE_BASE_DOY + offset;
  const yearShift = Math.floor((total - 1) / HEUTE_YEAR_DAYS);
  const doy = ((total - 1) % HEUTE_YEAR_DAYS + HEUTE_YEAR_DAYS) % HEUTE_YEAR_DAYS + 1;
  let d = doy, mi = 0;
  for (; mi < 12; mi++) {
    if (d <= HEUTE_MONTHS[mi].days) break;
    d -= HEUTE_MONTHS[mi].days;
  }
  const wd = HEUTE_WEEKDAYS[((HEUTE_BASE_WD_IDX + offset) % 7 + 7) % 7];
  const goldDay = ((HEUTE_BASE_GOLD - 1 + offset) % 28 + 28) % 28 + 1;
  const ashDay  = ((HEUTE_BASE_ASH  - 1 + offset) % 17 + 17) % 17 + 1;
  const next = heuteNextHoliday(doy);
  return {
    weekday: wd,
    day: d,
    monthIdx: mi,
    month: HEUTE_MONTHS[mi].name,
    monthRoman: HEUTE_MONTHS[mi].roman,
    sign: HEUTE_MONTHS[mi].sign,
    vibe: HEUTE_MONTHS[mi].vibe,
    year: `${HEUTE_BASE_YEAR + yearShift} n.d.L.`,
    goldDay, ashDay,
    nextHoliday: next.name,
    daysUntil: next.daysUntil,
  };
}

function MissionsterminalSection() {
  const [filter, setFilter] = uSx('alle');
  const [search, setSearch] = uSx('');
  const [selectedId, setSelectedId] = uSx(() => {
    const firstNew = MT_QUESTS.find(q => q.status === 'neu');
    return firstNew ? firstNew.id : MT_QUESTS[0].id;
  });
  const [view, setView] = uSx('details');
  const [acceptedIds, setAcceptedIds] = uSx(() => new Set());
  const [progress, setProgress] = uSx(() => {
    const init = {};
    MT_QUESTS.forEach(q => { init[q.id] = q.anweisungen.map(s => s.n); });
    return init;
  });

  const stepClick = (questId, stepIdx, max) => {
    setProgress(prev => {
      const cur = prev[questId] ? [...prev[questId]] : [];
      const n = cur[stepIdx] ?? 0;
      if (max <= 1) cur[stepIdx] = n >= 1 ? 0 : 1;
      else cur[stepIdx] = n >= max ? 0 : n + 1;
      return { ...prev, [questId]: cur };
    });
  };

  const counts = uMx(() => ({
    alle: MT_QUESTS.length,
    Suche: MT_QUESTS.filter(q=>q.kategorie==='Suche').length,
    Gespraech: MT_QUESTS.filter(q=>q.kategorie==='Gespraech').length,
    Jagd: MT_QUESTS.filter(q=>q.kategorie==='Jagd').length,
  }), []);

  const filtered = uMx(() => {
    const s = search.trim().toLowerCase();
    const rank = q => q.status === 'neu' ? 0 : q.status === 'empfohlen' ? 1 : 2;
    return MT_QUESTS.filter(x => {
      if (filter !== 'alle' && x.kategorie !== filter) return false;
      if (s && !(x.name.toLowerCase().includes(s) || x.auftraggeber.toLowerCase().includes(s))) return false;
      return true;
    }).sort((a, b) => rank(a) - rank(b));
  }, [filter, search]);

  uEx(() => {
    if (filtered.length && !filtered.find(q => q.id === selectedId)) {
      setSelectedId(filtered[0].id);
    }
  }, [filtered, selectedId]);

  const selected = MT_QUESTS.find(q => q.id === selectedId) || MT_QUESTS[0];

  const handleAccept = () => {
    setAcceptedIds(prev => {
      const next = new Set(prev);
      next.add(selected.id);
      return next;
    });
  };

  return (
    <div>
      {/* Eyebrow row */}
      <div style={{ display:'flex', alignItems:'baseline', gap:18, marginBottom:24 }}>
        <span style={{
          fontFamily:'var(--font-mono)', fontSize:'10px',
          letterSpacing:'0.35em', color:'rgba(124,77,255,0.65)',
          textTransform:'uppercase',
        }}>◈ Missionsterminal</span>
        <div style={{ flex:1, height:1, background:'linear-gradient(to right, rgba(124,77,255,0.5), rgba(124,77,255,0.05))' }}/>
        <div style={{
          display:'flex', alignItems:'center', gap:'12px',
          fontFamily:'var(--font-mono)', fontSize:'9px',
          color:'rgba(200,190,240,0.55)', letterSpacing:'0.22em',
          textTransform:'uppercase',
        }}>
          <span style={{ display:'inline-flex', alignItems:'center', gap:'7px' }}>
            <span style={{
              width:'7px', height:'7px', borderRadius:'50%',
              background:'#7fb8ff', boxShadow:'0 0 8px #7fb8ff',
              animation:'pulse-glow 2s ease infinite'
            }}/>
            {MT_QUESTS.filter(q=>q.status==='neu').length} neue Aufträge
          </span>
          <span style={{ width:'1px', height:'14px', background:'rgba(160,140,255,0.2)' }}/>
          <span>{filtered.length} / {MT_QUESTS.length} gesamt</span>
        </div>
      </div>

      {/* Two-panel grid */}
      <div style={{
        display:'grid', gridTemplateColumns:'1fr 1fr', gap:'18px',
        height:'540px',
      }}>
        {/* LEFT — quest list */}
        <MTPanel>
          <MTPanelHeader>

          </MTPanelHeader>

          <div style={{
            padding:'12px 18px', display:'flex', alignItems:'center', gap:'8px',

function KollektikonBar({ d, i }) {
  const ref = uRx(null);
  const [visible, setVisible] = uSx(false);
  uEx(() => {
    const el = ref.current; if (!el) return;
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { setVisible(true); io.unobserve(el); } }), { threshold:0.25 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  const pctFound = d.total ? d.found / d.total : 0;
  const pctKomp  = d.total ? (d.komplett || 0) / d.total : 0;
  const c = `oklch(0.72 0.16 ${d.hue})`;
  const cA = a => `oklch(0.72 0.16 ${d.hue} / ${a})`;

  return (
    <div ref={ref} style={{
      background:'rgba(10,8,28,0.7)',
      border:`1px solid ${cA(0.18)}`,
      padding:'14px 16px 12px', borderRadius:3,
      position:'relative', overflow:'hidden',

      <div style={{ position:'relative', height:4, marginBottom:6 }}>
        {pctKomp > 0 && (
          <div style={{ position:'absolute', left:0, top:0, bottom:0,
            width: visible ? `${pctKomp*100}%` : '0%',
            boxShadow:`0 0 7px 1px ${cA(0.42)}, 0 0 14px 3px ${cA(0.18)}, 0 0 22px 6px ${cA(0.08)}`,
            borderRadius:2, pointerEvents:'none',
            transition:`width 1.2s cubic-bezier(.2,.85,.2,1) ${0.3+i*0.08}s`,
          }}/>

            transition:`width 1.0s cubic-bezier(.2,.85,.2,1) ${i*0.08}s`,

            borderRadius:2,
            transition:`width 1.2s cubic-bezier(.2,.85,.2,1) ${0.3+i*0.08}s`,

function NeuerCharakterButton() {
  const [hov, setHov]                 = uSx(false);

  const [glitchActive, setGlitchActive] = uSx(false);
  const intervalRef = uRx(null);
  const timeoutRef  = uRx(null);
  const dur = '1.8s';

  const fireGlitch = () => {
    setGlitchActive(false);
    clearTimeout(timeoutRef.current);
    timeoutRef.current = setTimeout(() => { setGlitchKey(k=>k+1); setGlitchActive(true); }, 20);
  };

  uEx(() => {
    if (hov) {
      clearInterval(intervalRef.current); clearTimeout(timeoutRef.current);
      timeoutRef.current = setTimeout(() => { fireGlitch(); intervalRef.current = setInterval(fireGlitch, 2400); }, 80);
    } else {
      clearInterval(intervalRef.current); clearTimeout(timeoutRef.current);
      setGlitchActive(false);
    }
    return () => { clearInterval(intervalRef.current); clearTimeout(timeoutRef.current); };
  }, [hov]);

  const hexPts = (size) => {
    const cx = size/2, cy = size/2, r = size/2;
    return [0,1,2,3,4,5].map(i => {
      const a = Math.PI/3 * i - Math.PI/2;
      return `${cx + r*Math.cos(a)},${cy + r*Math.sin(a)}`;
    }).join(' ');
  };

  return (

function Tageskarte() {
  const [flipped, setFlipped] = uSx(false);
  const [cardIdx, setCardIdx] = uSx(() => Math.floor(Math.random()*TAGESKARTE_MAJORS.length));
  const cardRef = uRx(null);
  const card = TAGESKARTE_MAJORS[cardIdx];

  // ── Star burst (ported from Tarot.html spawnStarBurst) ──
  const spawnStarBurst = (cx, cy) => {
    // Central flash
    const flash = document.createElement('div');
    flash.className = 'tk-burst-flash';
    flash.style.left = cx + 'px';
    flash.style.top  = cy + 'px';
    flash.style.transform = 'translate(-50%, -50%) scale(0.2)';
    document.body.appendChild(flash);
    flash.animate([
      { transform:'translate(-50%, -50%) scale(0.2)', opacity:0 },
      { transform:'translate(-50%, -50%) scale(1.0)', opacity:1, offset:0.2 },
      { transform:'translate(-50%, -50%) scale(2.4)', opacity:0 }
    ], { duration:750, easing:'cubic-bezier(.2,.7,.3,1)', fill:'forwards' }).onfinish = () => flash.remove();

    // Two expanding rings
    [0, 220].forEach((delay, k) => {
      setTimeout(() => {
        const ring = document.createElement('div');
        ring.className = 'tk-burst-ring';
        ring.style.left = cx + 'px';
        ring.style.top  = cy + 'px';
        document.body.appendChild(ring);
        ring.animate([
          { transform:'translate(-50%, -50%) scale(0.1)', opacity:0.95, borderWidth:'3px' },
          { transform:`translate(-50%, -50%) scale(${k===0?4:6})`, opacity:0, borderWidth:'1px' }
        ], { duration:1100, easing:'cubic-bezier(.2,.8,.3,1)', fill:'forwards' }).onfinish = () => ring.remove();
      }, delay);
    });

    // Particle storm
    const N = 64;
    for (let i = 0; i < N; i++) {
      const angle = (i/N)*Math.PI*2 + (Math.random()-0.5)*0.45;
      const dist  = 110 + Math.random()*280;
      const dx = Math.cos(angle)*dist;
      const dy = Math.sin(angle)*dist*0.85;
      const dur = 1000 + Math.random()*1100;
      const r = Math.random();
      let cls = 'tk-spark';
      if (r < 0.14) cls += ' cross';
      else if (r < 0.32) cls += ' big';
      if (Math.random() < 0.32) cls += ' alt';
      const el = document.createElement('div');
      el.className = cls;
      el.style.left = cx + 'px';
      el.style.top  = cy + 'px';
      document.body.appendChild(el);
      const swirl = angle + (Math.random()-0.5)*0.7;
      const mx = Math.cos(swirl)*dist*0.45;
      const my = Math.sin(swirl)*dist*0.4;
      const peakScale = cls.includes('big') ? 1.9 : (cls.includes('cross') ? 1.6 : 1.3);
      el.animate([
        { transform:'translate(-50%, -50%) scale(0.1) rotate(0deg)', opacity:0 },
        { transform:`translate(calc(-50% + ${mx}px), calc(-50% + ${my}px)) scale(${peakScale}) rotate(180deg)`, opacity:1, offset:0.28 },
        { transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0) rotate(420deg)`, opacity:0, offset:1 }
      ], { duration:dur, easing:'cubic-bezier(.15,.85,.3,1)', fill:'forwards' }).onfinish = () => el.remove();
    }
  };

  const burstAtCard = () => {
    const el = cardRef.current; if (!el) return;
    const r = el.getBoundingClientRect();
    spawnStarBurst(r.left + r.width/2, r.top + r.height/2);
  };

  const draw = (e) => {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    if (!flipped) {
      burstAtCard();
      setFlipped(true);
      return;
    }
    setFlipped(false);
    setTimeout(() => {
      setCardIdx((idx) => {
        let next = Math.floor(Math.random()*TAGESKARTE_MAJORS.length);
        if (next === idx) next = (next+1) % TAGESKARTE_MAJORS.length;
        return next;
      });
      burstAtCard();
      setFlipped(true);
    }, 320);
  };

  const clear = (e) => {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    setFlipped(false);
  };

  return (
    <div>
      <div style={{ display:'flex', alignItems:'baseline', gap:18, marginBottom:24 }}>
        <span style={{
          fontFamily:'var(--font-mono)', fontSize:'10px',
          letterSpacing:'0.35em', color:'rgba(124,77,255,0.65)',
          textTransform:'uppercase',
        }}>◈ Tageskarte</span>
        <div style={{ flex:1, height:1, background:'linear-gradient(to right, rgba(124,77,255,0.5), rgba(124,77,255,0.05))' }}/>
        <span style={{
          fontFamily:'var(--font-mono)', fontSize:'9px',
          letterSpacing:'0.28em', color:'rgba(160,140,255,0.4)',
          textTransform:'uppercase',
        }}>Große Arkana · 22 Karten</span>
      </div>

      <div style={{
        display:'grid', gridTemplateColumns:'1fr auto 1fr', gap:56,
        alignItems:'center', padding:'30px 36px',
        background:'radial-gradient(ellipse at center, rgba(20,12,46,0.55) 0%, transparent 70%)',
      }}>
        {/* Left text */}
        <div style={{ textAlign:'right' }}>
          <h3 style={{
            fontFamily:'var(--font-display)', fontWeight:400,
            fontSize:'34px', letterSpacing:'0.1em',
            color:'#f3eefe', textTransform:'uppercase',
            lineHeight:1.05, marginBottom:14,
            textShadow:'0 0 28px rgba(124,77,255,0.35)',
          }}>Was hält<br/>der Tag<br/>bereit?</h3>
          <div style={{ width:42, height:1, background:'rgba(124,77,255,0.6)', marginLeft:'auto', marginBottom:18 }}/>
          <p style={{
            fontFamily:'var(--font-body)', fontWeight:300,
            fontSize:'12.5px', lineHeight:1.85,
            color:'rgba(200,190,240,0.65)',
            maxWidth:'280px', marginLeft:'auto',
            textWrap:'pretty',
          }}>
            Ziehe eine Karte aus der großen Arkana. Lass sie auf dich wirken,
            bevor du das volle Deck erkundest.
          </p>
        </div>

        {/* Card */}
        <div style={{ perspective:1400 }}>
          <div ref={cardRef} className={`tarot-card-3d${flipped ? ' flipped' : ''}`} onClick={draw}>
            {/* Back */}
            <div className="tarot-card-face tarot-card-back"
                 dangerouslySetInnerHTML={{ __html: TAROT_BACK_SVG }}/>
            {/* Front */}
            <div className="tarot-card-face tarot-card-front">

            letterSpacing:'0.22em', padding:'10px 20px',
            background:'transparent',
            border:'1px solid rgba(160,140,255,0.22)',

            textTransform:'uppercase',

}

function CTAButton({ href, label, glyph='◈' }) {
  return (

}
