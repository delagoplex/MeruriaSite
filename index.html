<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meruria</title>
<link rel="stylesheet" href="assets/styles/fonts.css">
<link rel="stylesheet" href="assets/styles/base.css">
<link rel="stylesheet" href="assets/styles/index.css">
<script>
  // Ensure React loads as browser globals (not CommonJS)
  if (typeof module !== 'undefined') {
    window.module = undefined;
  }
  if (typeof exports !== 'undefined') {
    window.exports = undefined;
  }
</script>
<script src="assets/scripts/vendor/react.development.js"></script>
<script src="assets/scripts/vendor/react-dom.development.js"></script>
<script src="assets/scripts/vendor/babel-standalone.js"></script>
<script src="assets/components/nav.jsx" type="text/babel"></script>
<script src="assets/components/page-header.jsx" type="text/babel"></script>
<script src="assets/components/tweaks-panel-6.jsx" type="text/babel"></script>
<script src="assets/components/particle-field.jsx" type="text/babel"></script>
<script src="assets/components/footer.jsx" type="text/babel"></script>

</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const { useTweaks, TweaksPanel, TweakSection, TweakSlider, TweakToggle, ParticleFieldEnhanced } = window;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showParticles": true,
  "headerHeight": 180
}/*EDITMODE-END*/;

// ── APP ────────────────────────────────────────────────
function App() {
  const [mouse, setMouse] = useState({x:0.5,y:0.5});
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const handleMouseMove = useCallback(e => {
    setMouse({x: e.clientX/window.innerWidth, y: e.clientY/window.innerHeight});
  }, []);

  return (
    <div onMouseMove={handleMouseMove} style={{position:'relative', minHeight:'100vh'}}>
      {tweaks.showParticles && <ParticleFieldEnhanced mouseX={mouse.x} mouseY={mouse.y}/>}

      {/* HEADER */}
      <PageHeader height={tweaks.headerHeight} />

      {/* ── NAV BAR ── */}
      <SiteNav rightLabel="PANTHEON ARCHIVE v2.7"/>

      {/* ── MAIN CONTENT (homepage placeholder) ── */}
      <div style={{
        position:'relative', zIndex:5,
        padding:'80px 64px', minHeight:'calc(100vh - 52px)',
        display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
      }}>
        <div style={{
          textAlign:'center',
          maxWidth:'600px',
        }}>
          <div style={{
            fontFamily:'var(--font-mono)', fontSize:'9px',
            letterSpacing:'0.3em', color:'rgba(124,77,255,0.6)',
            textTransform:'uppercase', marginBottom:'20px',
          }}>
            Willkommen in
          </div>
          <h1 style={{
            fontFamily:'var(--font-display)',
            fontSize:'clamp(48px,7vw,96px)', fontWeight:'300',
            letterSpacing:'0.25em', color:'#f0eeff',
            textShadow:'0 0 60px rgba(124,77,255,0.5)',
            animation:'flicker-mid 11s infinite',
            marginBottom:'24px',
          }}>
            MERURIA
          </h1>
          <p style={{
            fontFamily:'var(--font-body)', fontWeight:'300',
            fontSize:'13px', lineHeight:1.9,
            color:'rgba(200,190,240,0.55)', letterSpacing:'0.06em',
            marginBottom:'40px',
          }}>
            Erkunde die Welten, Götter und Geheimnisse des Meruria-Universums.<br/>
            Navigiere über das Menü oben.
          </p>
          <div style={{ display:'flex', gap:'12px', justifyContent:'center', flexWrap:'wrap' }}>
            <a href="Gottheiten.html" style={{
              fontFamily:'var(--font-display)', fontSize:'11px',
              letterSpacing:'0.2em', padding:'12px 28px',
              border:'1px solid rgba(124,77,255,0.5)',
              color:'#c9b8ff', textDecoration:'none',
              borderRadius:'3px', textTransform:'uppercase',
              background:'rgba(124,77,255,0.1)',
              transition:'all 0.2s',
              display:'inline-block',
            }}
            onMouseEnter={e => {e.currentTarget.style.background='rgba(124,77,255,0.22)'; e.currentTarget.style.borderColor='rgba(124,77,255,0.8)'; e.currentTarget.style.color='#f0eeff';}}
            onMouseLeave={e => {e.currentTarget.style.background='rgba(124,77,255,0.1)'; e.currentTarget.style.borderColor='rgba(124,77,255,0.5)'; e.currentTarget.style.color='#c9b8ff';}}
            >
              Gottheiten
            </a>
          </div>
        </div>
      </div>

      <SiteFooter left="◈ ARCHIVE STATUS: NOMINAL ◈ EPOCH: UNKNOWN" right="MERURIA // THE WOVEN REALMS" />

      <TweaksPanel>
        <TweakSection label="Layout"/>
        <TweakSlider id="headerHeight" label="Header height" min={80} max={320} step={10}/>
        <TweakSection label="Atmosphere"/>
        <TweakToggle id="showParticles" label="Particles"/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>


</body></html>
