project_id = "MeruriaSite"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[auth]
enabled = true
site_url = "https://meruria.de"
additional_redirect_urls = ["https://meruria.de"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false

[auth.email]
# Im CLI schaltet das den E-Mail-Provider komplett an/aus (ohne = kein Login möglich).
# Neue Registrierungen sperrt weiterhin `enable_signup = false` im [auth]-Block oben.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
