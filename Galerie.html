/* ── Tag chip ─────────────────────────────────── */

<script type="text/babel">
const { useState: useS2, useEffect: useE2, useRef: useR2 } = React;
const { mkBg: mkB2, Tag: TagC, ImgPlaceholder: ImgPH } = window;

/* ── CollectionCard — race-card-inspired ──────── */
function CollectionCard({ collection, onClick }) {
  const [hov, setHov] = useS2(false);
  return (
    <div
      onClick={onClick}
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      style={{
        position:'relative', height:128, borderRadius:4,
        cursor:'pointer', overflow:'hidden',
        border: hov ? '1px solid rgba(124,77,255,0.65)' : '1px solid rgba(124,77,255,0.2)',
        boxShadow: hov ? '0 10px 40px rgba(0,0,0,0.65),0 0 22px rgba(124,77,255,0.18)' : '0 2px 14px rgba(0,0,0,0.45)',
        transform: hov ? 'translateY(-3px) scale(1.01)' : 'translateY(0) scale(1)',
        transition: hov ? 'all 0.09s linear' : 'all 0.45s cubic-bezier(0.23,1,0.32,1)',
      }}
    >
      {/* BG pattern */}
      <div style={{ position:'absolute', inset:0, background: mkB2(collection.hue), filter: hov ? 'brightness(0.6)' : 'brightness(0.38)', transition:'filter 0.4s ease' }} />
      {/* Bottom gradient */}
      <div style={{ position:'absolute', inset:0, background:'linear-gradient(to top,rgba(4,2,14,0.92) 0%,rgba(4,2,14,0.5) 55%,rgba(4,2,14,0.1) 100%)', opacity: hov ? 0.6 : 1, transition:'opacity 0.4s ease' }} />
      {/* Radial glow on hover */}
      <div style={{ position:'absolute', inset:0, background:'radial-gradient(ellipse at 50% 40%,rgba(124,77,255,0.18) 0%,transparent 65%)', opacity: hov ? 1 : 0, transition:'opacity 0.3s ease', pointerEvents:'none' }} />
      {/* Wedge */}
      <div style={{ position:'absolute', bottom:0, left:0, right:0, height:50, background:'linear-gradient(to top,rgba(2,1,10,0.9) 0%,transparent 100%)', clipPath:'polygon(0% 45%,100% 0%,100% 100%,0% 100%)', opacity: hov ? 1 : 0, transition:'opacity 0.3s ease', pointerEvents:'none' }} />
      {/* Content */}
      <div style={{ position:'absolute', inset:0, padding:'12px 15px', display:'flex', flexDirection:'column', justifyContent:'flex-end' }}>
        <div style={{ display:'flex', alignItems:'flex-end', justifyContent:'space-between' }}>
          <div>
            <div style={{ fontFamily:'var(--font-display)', fontSize:12, fontWeight:400, letterSpacing:'0.16em', color:'#f0eeff', textTransform:'uppercase', textShadow:'0 2px 12px rgba(0,0,0,0.8)' }}>
              {collection.name}
            </div>
            <div style={{ fontFamily:'var(--font-mono)', fontSize:8, color: hov ? 'rgba(180,155,255,0.9)' : 'rgba(124,77,255,0.55)', marginTop:3, letterSpacing:'0.12em', transition:'color 0.2s' }}>
              {collection.images.length} Bilder
            </div>
          </div>
          <div style={{ fontFamily:'var(--font-mono)', fontSize:13, color:'rgba(124,77,255,0.85)', opacity: hov ? 1 : 0, transform: hov ? 'translateX(0)' : 'translateX(6px)', transition:'all 0.2s ease' }}>→</div>
        </div>
      </div>
    </div>
  );
}

/* ── Image card inside overlay ────────────────── */
function OverlayImageCard({ image, onSelect }) {
  const [hov, setHov] = useS2(false);
  return (
    <div
      onClick={onSelect}
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      style={{
        borderRadius:4, overflow:'hidden', cursor:'pointer',
        border: hov ? '1px solid rgba(124,77,255,0.55)' : '1px solid rgba(124,77,255,0.16)',
        boxShadow: hov ? '0 8px 32px rgba(0,0,0,0.6),0 0 16px rgba(124,77,255,0.12)' : '0 2px 12px rgba(0,0,0,0.4)',
        transform: hov ? 'translateY(-2px)' : 'none',
        transition: hov ? 'all 0.1s linear' : 'all 0.4s cubic-bezier(0.23,1,0.32,1)',
        background:'rgba(8,6,22,0.9)',
      }}
    >
      <ImgPH label={image.title} height={175} hue={image.hue} />
      <div style={{ padding:'12px 14px 13px' }}>
        <div style={{ fontFamily:'var(--font-display)', fontSize:11, fontWeight:400, letterSpacing:'0.14em', color:'rgba(240,238,255,0.92)', textTransform:'uppercase', marginBottom:4 }}>
          {image.title}
        </div>
        <div style={{ fontFamily:'var(--font-mono)', fontSize:9, color:'rgba(124,77,255,0.6)', marginBottom:7 }}>
          {image.date}
        </div>
        <p style={{ fontFamily:'var(--font-body)', fontSize:11, fontWeight:300, color:'rgba(200,192,232,0.65)', lineHeight:1.65, marginBottom:8, display:'-webkit-box', WebkitLineClamp:2, WebkitBoxOrient:'vertical', overflow:'hidden' }}>
          {image.desc}
        </p>
        <div style={{ display:'flex', flexWrap:'wrap', gap:4 }}>
          {image.tags.map(t => <TagC key={t} label={t} small />)}
        </div>
      </div>
    </div>
  );
}

/* ── CollectionOverlay — full-screen panel ────── */
function CollectionOverlay({ collection, onClose, onSelectImage }) {
  useE2(() => {
    document.body.style.overflow = 'hidden';
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => { document.body.style.overflow = ''; window.removeEventListener('keydown', onKey); };
  }, []);

  return (
    <div style={{ position:'fixed', inset:0, zIndex:600, overflowY:'auto', background:'rgba(4,3,13,0.98)', backdropFilter:'blur(6px)', animation:'overlayIn 0.22s ease' }}>
      {/* Sticky header */}
      <div style={{ position:'sticky', top:0, zIndex:10, display:'flex', alignItems:'center', gap:18, padding:'13px 28px', background:'rgba(5,4,15,0.97)', borderBottom:'1px solid rgba(124,77,255,0.14)', backdropFilter:'blur(12px)' }}>
        <button
          onClick={onClose}
          style={{ display:'inline-flex', alignItems:'center', gap:8, fontFamily:'var(--font-body)', fontWeight:300, fontSize:11, letterSpacing:'0.12em', color:'rgba(200,192,232,0.55)', background:'rgba(124,77,255,0.07)', border:'1px solid rgba(124,77,255,0.2)', padding:'7px 14px', borderRadius:3, cursor:'pointer', transition:'all 0.2s', textDecoration:'none', flexShrink:0 }}
          onMouseEnter={e => { e.currentTarget.style.color='#f0eeff'; e.currentTarget.style.background='rgba(124,77,255,0.15)'; e.currentTarget.style.borderColor='rgba(124,77,255,0.48)'; }}
          onMouseLeave={e => { e.currentTarget.style.color='rgba(200,192,232,0.55)'; e.currentTarget.style.background='rgba(124,77,255,0.07)'; e.currentTarget.style.borderColor='rgba(124,77,255,0.2)'; }}
        >
          <svg width="12" height="10" viewBox="0 0 12 10" fill="none" style={{ opacity:0.7 }}>
            <path d="M11 5H1M1 5L5 1M1 5L5 9" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
          </svg>
          Zurück zur Galerie
        </button>
        <div style={{ flex:1 }}>
          <div style={{ fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.25em', color:'rgba(124,77,255,0.5)', textTransform:'uppercase', marginBottom:3 }}>
            Sammlung
          </div>
          <h2 style={{ fontFamily:'var(--font-display)', fontSize:16, fontWeight:300, letterSpacing:'0.22em', color:'var(--white)', textTransform:'uppercase' }}>
            {collection.name}
          </h2>
        </div>
        <span style={{ fontFamily:'var(--font-mono)', fontSize:9, color:'rgba(124,77,255,0.4)' }}>
          {collection.images.length} Bilder
        </span>
      </div>

      {/* Breadcrumb / divider */}
      <div style={{ padding:'20px 28px 4px' }}>
        <div style={{ width:40, height:1, background:'linear-gradient(90deg,rgba(124,77,255,0.7),transparent)' }} />
      </div>

      {/* Image grid */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(250px,1fr))', gap:18, padding:'12px 28px 48px' }}>
        {collection.images.map(img => (
          <OverlayImageCard
            key={img.id}
            image={img}
            onSelect={() => onSelectImage({...img, collectionName: collection.name})}
          />
        ))}
      </div>
    </div>
  );
}

/* ── Carousel ─────────────────────────────────── */
const CP_W=152, CP_H=196; // portrait
const CL_W=272, CL_H=196; // landscape — same height, wider
const CGAP=14;
const BASE_SPD=0.036, CFRIC=0.9984;

function imgDims(img) { return img.landscape ? {w:CL_W,h:CL_H} : {w:CP_W,h:CP_H}; }

function Carousel({ images, reverse }) {
  const trackRef = useR2(null);
  const revRef   = useR2(reverse);
  revRef.current = reverse;
  const phys     = useR2({ offset:0, vel:0, drag:false, lx:0, lt:0 }).current;
  const [hovIdx, setHovIdx] = useS2(null);
  const n = images.length;
  // singleW = sum of (width + gap) for all images in one copy
  const singleW = images.reduce((s, img) => s + imgDims(img).w + CGAP, 0);
  const tripled = [...images, ...images, ...images];

  useE2(() => {
    phys.offset = singleW;
    let raf, last = performance.now();
    function tick(now) {
      const dt = Math.min(now - last, 50); last = now;
      if (!phys.drag) {
        if (Math.abs(phys.vel) > 0.002) phys.vel *= Math.pow(CFRIC, dt); else phys.vel = 0;
        phys.offset += ((revRef.current ? -1 : 1) * BASE_SPD + phys.vel) * dt;
        while (phys.offset >= singleW * 2) phys.offset -= singleW;
        while (phys.offset < singleW)     phys.offset += singleW;
        if (trackRef.current) trackRef.current.style.transform = `translateX(${-phys.offset}px)`;
      }
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [singleW]);

  useE2(() => {
    function onMove(e) {
      if (!phys.drag) return;
      const now = performance.now(), dx = e.clientX - phys.lx, dt = now - phys.lt;
      if (dt > 0) phys.vel = -dx / dt;
      phys.offset -= dx;
      while (phys.offset >= singleW * 2) phys.offset -= singleW;
      while (phys.offset < singleW)     phys.offset += singleW;
      if (trackRef.current) trackRef.current.style.transform = `translateX(${-phys.offset}px)`;
      phys.lx = e.clientX; phys.lt = now;
    }
    function onUp() { phys.drag = false; }
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup',   onUp);
    return () => { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
  }, [singleW]);

  function onDown(e) { e.preventDefault(); phys.drag=true; phys.lx=e.clientX; phys.lt=performance.now(); phys.vel=0; }

  function iStyle(ii) {
    const hov = hovIdx === ii;
    const {w,h} = imgDims(images[ii]);
    let tx = 0;
    if (hovIdx !== null && !hov) {
      let d = ii - hovIdx; if (d > n/2) d -= n; if (d < -n/2) d += n;
      if (Math.abs(d) <= 3) tx = (d > 0 ? 1 : -1) * 28 / Math.abs(d);
    }
    return {
      width:w, height:h, flexShrink:0, borderRadius:4, overflow:'hidden', position:'relative', cursor:'pointer',
      alignSelf:'flex-end',
      transform: hov ? `scale(1.18) translateY(-12px)` : tx ? `translateX(${tx}px)` : undefined,
      boxShadow: hov ? '0 0 26px rgba(124,77,255,0.88),0 0 52px rgba(124,77,255,0.28)' : 'none',
      border: hov ? '1.5px solid rgba(124,77,255,0.88)' : '1.5px solid rgba(124,77,255,0.12)',
      zIndex: hov ? 20 : 1,
      transition:'transform 0.22s ease,box-shadow 0.2s ease,border-color 0.2s ease',
    };
  }

  return (
    <div onMouseDown={onDown} style={{ position:'relative', overflow:'visible', height:CP_H+52, userSelect:'none', cursor:'grab' }}>
      <div ref={trackRef} style={{ position:'absolute', top:26, left:0, display:'flex', gap:CGAP, alignItems:'flex-start', height:CP_H, willChange:'transform' }}>
        {tripled.map((img, gi) => {
          const ii = gi % n;
          return (
            <div key={gi} style={iStyle(ii)} onMouseEnter={() => setHovIdx(ii)} onMouseLeave={() => setHovIdx(null)}>
              {/* Aurelia-style placeholder */}
              <div style={{ width:'100%', height:'100%', position:'relative', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:6,
                background:`repeating-linear-gradient(-45deg,transparent,transparent 8px,oklch(0.65 0.18 ${images[ii%n].hue||270} / 0.13) 8px,oklch(0.65 0.18 ${images[ii%n].hue||270} / 0.13) 9px),linear-gradient(160deg,rgba(28,16,62,0.97) 0%,rgba(14,9,36,0.98) 100%)`,
              }}>
                <div style={{ position:'absolute', inset:0, background:`radial-gradient(ellipse at 50% 45%,oklch(0.65 0.18 ${images[ii%n].hue||270} / 0.2) 0%,transparent 60%)` }} />
                <svg viewBox="0 0 40 30" width={images[ii%n].landscape?22:18} height={images[ii%n].landscape?16:13} fill="none" style={{ opacity:0.55, zIndex:1, flexShrink:0 }}>
                  <rect x="1" y="1" width="38" height="28" rx="2" stroke={`oklch(0.65 0.18 ${images[ii%n].hue||270})`} strokeWidth="1.3"/>
                  <circle cx="12" cy="11" r="4" stroke={`oklch(0.65 0.18 ${images[ii%n].hue||270})`} strokeWidth="1" opacity="0.8"/>
                  <path d="M1 22 L10 15 L18 20 L26 13 L39 22" stroke={`oklch(0.65 0.18 ${images[ii%n].hue||270})`} strokeWidth="1.1" opacity="0.8"/>
                </svg>
                <span style={{ fontFamily:'var(--font-mono)', fontSize:7, letterSpacing:'0.18em', color:`oklch(0.65 0.18 ${images[ii%n].hue||270} / 0.52)`, textTransform:'uppercase', zIndex:1, textAlign:'center', padding:'0 6px', lineHeight:1.3 }}>
                  artwork
                </span>
              </div>
              <div style={{ position:'absolute', bottom:0, left:0, right:0, padding:'5px 7px', background:'rgba(5,4,15,0.83)', borderTop:'1px solid rgba(124,77,255,0.12)' }}>
                <div style={{ fontFamily:'var(--font-mono)', fontSize:9, color:'rgba(240,238,255,0.6)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{images[ii%n].title}</div>
              </div>
            </div>
          );
        })}
      </div>
      <div style={{ position:'absolute', top:0, left:0, bottom:0, width:100, background:'linear-gradient(to right,#05040f 40%,transparent)', pointerEvents:'none', zIndex:10 }} />
      <div style={{ position:'absolute', top:0, right:0, bottom:0, width:100, background:'linear-gradient(to left,#05040f 40%,transparent)', pointerEvents:'none', zIndex:10 }} />
    </div>
  );
}

Object.assign(window, { CollectionCard, CollectionOverlay, Carousel });
</script>


<!-- ═══════════════════════════════════════════
     SCRIPT 3 — Nav + GalleryPage + render
     ═══════════════════════════════════════════ -->
<script type="text/babel">
const { useState: useS3, useEffect: useE3, useRef: useR3 } = React;
const { COLLECTIONS:COLS, ALL_IMAGES:ALL_IMGS, DEFAULT_FEATURED, FeaturedDisplay:FeatDisp, CollectionCard:ColCard, CollectionOverlay:ColOverlay, Carousel:Car } = window;
const { useTweaks, TweaksPanel, TweakSection, TweakToggle } = window;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{"carouselReverse":false}/*EDITMODE-END*/;

/* ── Nav ──────────────────────────────────────── */
const NAV_LINKS = [
  {id:'hb',label:'Spielerhandbuch',    links:[{l:'Charaktererstellung',h:'Charaktererstellung.html'},{l:'Ausrüstung',h:'Ausrüstung.html'},{l:'Realismus',h:'Realismus.html'}]},
  {id:'ch',label:'Charaktererstellung',links:[{l:'Rassen',h:'Rassen.html'},{l:'Klassen',h:'Klassen.html'},{l:'Talente',h:'Talente.html'},{l:'Hintergründe',h:'Hintergruende.html'},{l:'Zauber',h:'Zauber.html'}]},
  {id:'ek',label:'Enzyklopädie',       links:[{l:'Gottheiten',h:'Gottheiten.html'},{l:'Galerie',h:'Galerie.html'}]},
  {id:'dv',label:'Divisionen',         links:[{l:'Die Kuratoren',h:'Bergungsgarde.html'},{l:'Die Sturmritter',h:'Sturmritter.html'},{l:'Die Sentinels',h:'Sentinels.html'},{l:'Pathfinders',h:'Pathfinders.html'}]},
];

function NavItem({ tab }) {
  const [open, setOpen] = useS3(false);
  const t = useR3(null);
  const show = () => { clearTimeout(t.current); setOpen(true); };
  const hide = () => { t.current = setTimeout(() => setOpen(false), 260); };
  return (
    <div style={{ position:'relative' }} onMouseEnter={show} onMouseLeave={hide}>
      <button style={{ fontFamily:'var(--font-display)', fontSize:11, fontWeight:400, letterSpacing:'0.16em', padding:'10px 15px', background:'transparent', border:'1px solid rgba(160,140,255,0.12)', color:'rgba(200,190,240,0.7)', cursor:'pointer', borderRadius:3, transition:'all 0.18s', textTransform:'uppercase', whiteSpace:'nowrap' }}
        onMouseEnter={e=>{e.currentTarget.style.color='#f0eeff';e.currentTarget.style.borderColor='rgba(160,140,255,0.42)';e.currentTarget.style.background='rgba(124,77,255,0.1)';}}
        onMouseLeave={e=>{e.currentTarget.style.color='rgba(200,190,240,0.7)';e.currentTarget.style.borderColor='rgba(160,140,255,0.12)';e.currentTarget.style.background='transparent';}}
      >{tab.label}</button>
      {open && (
        <div onMouseEnter={show} onMouseLeave={hide} style={{ position:'absolute', top:'calc(100% + 4px)', left:0, minWidth:185, background:'rgba(8,6,22,0.97)', border:'1px solid rgba(160,140,255,0.2)', borderRadius:4, boxShadow:'0 10px 36px rgba(0,0,0,0.65)', animation:'slideDown 0.15s ease', zIndex:200, backdropFilter:'blur(12px)' }}>
          {tab.links.map((lk,i) => (
            <a key={i} href={lk.h} style={{ display:'block', padding:'9px 16px', fontFamily:'var(--font-body)', fontSize:12, fontWeight:300, color:'rgba(200,190,240,0.75)', textDecoration:'none', borderBottom:i<tab.links.length-1?'1px solid rgba(124,77,255,0.07)':'none', transition:'all 0.13s' }}
              onMouseEnter={e=>{e.currentTarget.style.color='#f0eeff';e.currentTarget.style.background='rgba(124,77,255,0.1)';e.currentTarget.style.paddingLeft='20px';}}
              onMouseLeave={e=>{e.currentTarget.style.color='rgba(200,190,240,0.75)';e.currentTarget.style.background='transparent';e.currentTarget.style.paddingLeft='16px';}}
            >{lk.l}</a>
          ))}
        </div>
      )}
    </div>
  );
}

function Nav() {
  return (
    <nav style={{ position:'fixed', top:0, left:0, right:0, height:'var(--nav-h)', display:'flex', alignItems:'center', gap:4, padding:'0 24px', background:'rgba(5,4,15,0.96)', backdropFilter:'blur(20px)', borderBottom:'1px solid rgba(124,77,255,0.12)', zIndex:100 }}>
      <a href="Meruria.html" style={{ fontFamily:'var(--font-display)', fontSize:14, fontWeight:300, letterSpacing:'0.38em', color:'var(--white)', textDecoration:'none', marginRight:14, textTransform:'uppercase', textShadow:'0 0 22px rgba(124,77,255,0.4)' }}>Meruria</a>
      {NAV_LINKS.map(tab => <NavItem key={tab.id} tab={tab} />)}
    </nav>
  );
}

/* ── GalleryPage ──────────────────────────────── */
function GalleryPage() {
  const [featured,     setFeatured] = useS3(DEFAULT_FEATURED);
  const [openCol,      setOpenCol]  = useS3(null);
  const [tweaks, setTweak]          = useTweaks(TWEAK_DEFAULTS);

  function selectImage(img) {
    setFeatured(img);
    setOpenCol(null);
  }

  const leftCols  = COLS.slice(0, 3);
  const rightCols = COLS.slice(3, 6);

  return (
    <div style={{ minHeight:'100vh', paddingTop:'var(--nav-h)' }}>
      <Nav />

      {/* Overlay */}
      {openCol && (
        <ColOverlay
          collection={openCol}
          onClose={() => setOpenCol(null)}
          onSelectImage={selectImage}
        />
      )}

      {/* Tweaks */}
      <TweaksPanel tweaks={tweaks} setTweak={setTweak}>
        <TweakSection label="Karussell">
          <TweakToggle id="carouselReverse" label="Umgekehrt drehen" />
        </TweakSection>
      </TweaksPanel>

      {/* Page title */}
      <div style={{ padding:'18px 28px 14px', borderBottom:'1px solid rgba(124,77,255,0.1)' }}>
        <div style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.3em', color:'rgba(124,77,255,0.5)', textTransform:'uppercase', marginBottom:5 }}>
          Meruria · Enzyklopädie
        </div>
        <h1 style={{ fontFamily:'var(--font-display)', fontWeight:300, fontSize:22, letterSpacing:'0.28em', color:'var(--white)', textTransform:'uppercase' }}>
          Galerie
        </h1>
        <div style={{ marginTop:8, width:36, height:1, background:'rgba(124,77,255,0.55)' }} />
      </div>

      {/* 3-column layout */}
      <div style={{ display:'grid', gridTemplateColumns:'240px 1fr 240px', gap:18, padding:'18px 24px', alignItems:'start' }}>

        {/* Left C */}
        <div style={{ display:'flex', flexDirection:'column', gap:11 }}>
          <div style={{ fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.2em', color:'rgba(124,77,255,0.38)', textTransform:'uppercase', padding:'0 2px 6px', borderBottom:'1px solid rgba(124,77,255,0.1)' }}>
            Sammlungen
          </div>
          {leftCols.map(col => (
            <ColCard key={col.id} collection={col} onClick={() => setOpenCol(col)} />
          ))}
        </div>

        {/* Center A + B */}
        <FeatDisp image={featured} />

        {/* Right C */}
        <div style={{ display:'flex', flexDirection:'column', gap:11 }}>
          <div style={{ fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.2em', color:'rgba(124,77,255,0.38)', textTransform:'uppercase', padding:'0 2px 6px', borderBottom:'1px solid rgba(124,77,255,0.1)' }}>
            Sammlungen
          </div>
          {rightCols.map(col => (
            <ColCard key={col.id} collection={col} onClick={() => setOpenCol(col)} />
          ))}
        </div>
      </div>

      {/* Carousel D */}
      <div style={{ marginTop:16, borderTop:'1px solid rgba(124,77,255,0.12)' }}>
        <div style={{ display:'flex', alignItems:'center', gap:12, padding:'13px 28px 6px' }}>
          <span style={{ fontFamily:'var(--font-display)', fontSize:9, letterSpacing:'0.35em', color:'rgba(124,77,255,0.5)', textTransform:'uppercase' }}>Alle Bilder</span>
          <div style={{ flex:1, height:1, background:'rgba(124,77,255,0.12)' }} />
          <span style={{ fontFamily:'var(--font-mono)', fontSize:8, color:'rgba(124,77,255,0.3)' }}>
            {ALL_IMGS.length} Einträge · Klicken &amp; Ziehen zum Drehen
          </span>
        </div>
        <Car images={ALL_IMGS} reverse={tweaks.carouselReverse} />
      </div>

      {/* Footer */}
      <div style={{ borderTop:'1px solid rgba(124,77,255,0.07)', padding:'13px 28px', display:'flex', justifyContent:'space-between' }}>
        <span style={{ fontFamily:'var(--font-mono)', fontSize:9, color:'rgba(124,77,255,0.26)', letterSpacing:'0.1em' }}>Meruria — Galerie</span>
        <span style={{ fontFamily:'var(--font-mono)', fontSize:8, color:'rgba(124,77,255,0.22)' }}>{COLS.length} Sammlungen · {ALL_IMGS.length} Bilder</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<GalleryPage />);
</script>
