// ── Fundort colours ────────────────────────────────────────────────────────────

  'Höhle':         '#9070b8',
  'Unterreich':    '#5840a0',
  'Vulkan':        '#e85020',

  'Wüste':         '#c8a840',

  'Ebene':         '#80a870',
  'Arktis':        '#90d0f0',
  'Dschungel':     '#2a9040',
  'Arkane Stätte': '#c060e8',
  'Andere Ebenen': '#4848d8',
  'Himmelsfall':   '#ffd040',
  'Schmiede':      '#c09050',
  'Ruinen':        '#908060',

const RES_RARITY_TIERS = [
  { label:'Gewöhnlich',   color:'#8888aa', val:1 },
  { label:'Ungewöhnlich', color:'#4caf50', val:2 },
  { label:'Selten',       color:'#4488ee', val:3 },

];
function resRarity(item) {

}
const RES_SORT_OPTIONS = [
  { id:'name-az',         label:'Name A – Z'   },
  { id:'name-za',         label:'Name Z – A'   },
  { id:'seltenheit-asc',  label:'Seltenheit ↑' },
  { id:'seltenheit-desc', label:'Seltenheit ↓' },
  { id:'preis-asc',       label:'Preis ↑'      },
  { id:'preis-desc',      label:'Preis ↓'      },
];

// ── Klima colours ─────────────────────────────────────────────────────────────
const KLIMA_COLOR = {
  'Gemäßigt':    '#4db6e8',
  'Kalt':        '#90d8f8',
  'Warm':        '#ffaa44',
  'Trocken':     '#d4b260',
  'Feucht':      '#3aa0d8',
  'Tiefsee':     '#3a6abf',
  'Stürmisch':   '#9898c0',
  'Sumpfig':     '#58b870',
  'Toxisch':     '#70e028',
  'Magisch':     '#c060e8',
  'Vulkanisch':  '#e85020',
  'Schattenhaft':'#9050c8',
  'Kosmisch':    '#5050e0',
  'Dunkel':      '#5848a0',
  'Hell':        '#ffd870',
  'Tag':         '#ffc850',
  'Nacht':       '#3848a0',
  'Windig':      '#a0c0e0',
};

const GRÖSSE_ORDER = ['Winzig','Klein','Mittelgroß','Groß','Riesig'];

// Stärke is a D&D ability score; modifier = floor((score - 10) / 2)
// Ranges map to modifier bands: 1–5 → −5 to −3, 6–9 → −2/−1, 10–11 → ±0, 12+ → +1 or more
const STÄRKE_GROUPS = [
  { label:'−5 bis −3', min:1,  max:5  },
  { label:'−2 bis −1', min:6,  max:9  },
  { label:'±0',        min:10, max:11 },
  { label:'+1 oder mehr', min:12, max:99 },
];

const RARITY_KLIMA_BONUS = {
  'Vulkanisch':3,'Magisch':3,'Kosmisch':3,'Schattenhaft':2,'Toxisch':2,'Tiefsee':2,
};

const RARITY_TIERS = [
  { label:'Gewöhnlich',   color:'#8888aa' },
  { label:'Ungewöhnlich', color:'#4caf50' },
  { label:'Selten',       color:'#4488ee' },
  { label:'Sehr selten',  color:'#c060e8' },
  { label:'Legendär',     color:'#ffaa44' },
];

const LEGENDARY_NAMES = new Set([
  'Taniwha','Kleiner Leviathan','Syldra','Riesenkrake','Titansägerochen',
  'Dunkleosteus','Tiefsee-Dunkleosteus','Hyphalosaurus','Elasmosaurus',
  'Gharlichthys','Calibanschuppe','Lapisdrache','Gigahai','Schiffshenker',
  'Tiefenwächter','Tausend-Jahre-Wels','Coccosteus','Fallskipper',
  'Oktoboss','Thavnairsaurus','Priosaurus','Radzsaurus','Spektralsaurier',
  'Anomalocaris Saron','Aithons Colt','Tintenkrake','Mondschnapper',
  'Erstgenuss','Mogul-Mogpom','La Reale','Mogryseele','Bergkrake',
  'Mehr-Falten-Matamata','Saphirwächter',
]);

function fishRarityScore(fish) {
  const base = Math.pow(((fish.sg ?? 10) - 10) / 25, 2) * 10;
  const bonus = (fish.klima || []).reduce((s, k) => s + (RARITY_KLIMA_BONUS[k] || 0) * 0.6, 0);
  return base + bonus;
}

function fishRarityIdx(fish) {
  if (LEGENDARY_NAMES.has(fish.name_de)) return 4;
  const s = fishRarityScore(fish);
  if (s < 3)   return 0;
  if (s < 5.5) return 1;
  if (s < 8)   return 2;
  return 3;
}

function fishRarity(fish) {
  return RARITY_TIERS[fishRarityIdx(fish)];
}

// Price comes from the data file (computed by update-fish-rarity.mjs)
function fishPrice(fish) { return fish.verkaufspreis || '–'; }

const SORT_OPTIONS = [
  { id:'name-az',          label:'Name A – Z'     },
  { id:'name-za',          label:'Name Z – A'     },
  { id:'seltenheit-asc',   label:'Seltenheit ↑'   },
  { id:'seltenheit-desc',  label:'Seltenheit ↓'   },
  { id:'preis-asc',        label:'Preis ↑'        },
  { id:'preis-desc',       label:'Preis ↓'        },
  { id:'staerke-desc',     label:'Stärke ↓'       },
  { id:'staerke-asc',     label:'Stärke ↑'       },
  { id:'gewicht-desc',    label:'Gewicht ↓'      },
  { id:'gewicht-asc',     label:'Gewicht ↑'      },
];

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{ "showParticles": true }/*EDITMODE-END*/;

// ── Tabs ──────────────────────────────────────────────────────────────────────
const TABS = [
  { id:'fische',      label:'Fische'      },
  { id:'pflanzen',    label:'Pflanzen'    },
  { id:'mineralien',  label:'Mineralien'  },
  { id:'monsterteile',label:'Monsterteile'},
];

// ── Parse helpers ─────────────────────────────────────────────────────────────
function parseGewicht(s) {
  if (!s) return 0;
  const m = s.match(/([\d.,]+)\s*Pfd\./);
  if (!m) return 0;
  // German format: "." = Tausendertrenner, "," = Dezimalzeichen
  return parseFloat(m[1].replace(/\./g, '').replace(',', '.'));
}
function parsePreis(s) {
  if (!s) return 0;
  return parseInt(s.replace(/\./g, '').split(' ')[0]) || 0;
}

// ── Stärke / modifier helpers ─────────────────────────────────────────────────
function dndMod(score) { return Math.floor((score - 10) / 2); }
function modStr(m) { return (m >= 0 ? '+' : '') + m; }

// 11-bar bipolar display: indices 0–4 = mods −5 to −1, index 5 = ±0, indices 6–10 = +1 to +5
// Bars fill from center outward (adjacent to center = smallest magnitude)
function modBarColor(mod, barIdx) {
  const barMod = barIdx - 5; // −5 to +5
  if (barIdx === 5) return 'rgba(255,255,255,0.22)';          // center reference
  if (mod < 0 && barMod < 0 && barMod >= mod) return 'rgba(200,70,70,0.72)';  // negative filled
  if (mod > 0 && barMod > 0 && barMod <= mod) return '#26c6da';               // positive filled
  return 'rgba(255,255,255,0.06)';                            // empty
}

// ── Fish Detail Modal ─────────────────────────────────────────────────────────

  const rarity = fishRarity(fish);

  useEffect(() => {
    const handle = e => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', handle);

    { icon:'⚗️', label:'Alchemie', name:'Unbekannte Zutat' },
    { icon:'🧵', label:'Handwerk', name:'Unbekannte Verarbeitung' },

  return (
    <div className="fish-modal-overlay" onClick={onClose}>
      <div className="fish-modal" onClick={e => e.stopPropagation()}>
        <button className="fish-modal-close" onClick={onClose}>✕</button>

        {/* ── Left: Fish Info ── */}
        <div className="fish-modal-left">
          <div className="fish-modal-header">
            <div className="fish-modal-icon">
              {imgOk
                ? <img src={fish.icon} alt="" onError={() => setImgOk(false)} />

              }
            </div>
            <div style={{ minWidth:0 }}>
              <div className="fish-modal-name">{fish.name_de}</div>
              <div style={{ fontFamily:'var(--font-mono)', fontSize:'10px', letterSpacing:'0.18em', color: rarity.color, marginTop:'5px' }}>
                {rarity.label}
              </div>
            </div>
          </div>

          <div className="fish-modal-divider" />

          {/* Badges */}
          <div className="fish-modal-section">
            <div style={{ display:'flex', gap:'6px', flexWrap:'wrap' }}>
              <span className="fish-size-badge">{fish.größenkategorie}</span>
              {fish.wassersort && (
                <span className="fish-size-badge" style={{ borderColor: fish.wassersort==='salz' ? 'rgba(38,198,218,0.4)' : 'rgba(100,180,255,0.4)', color: fish.wassersort==='salz' ? '#26c6da' : '#88bbff' }}>

          {/* Stärke */}
          <div className="fish-modal-section">
            <div className="fish-modal-label">Stärke</div>
            <div style={{ display:'flex', alignItems:'center', gap:'5px' }}>
              <div className="staerke-bars">
                {Array.from({length:5},(_,i) => (
                  <div key={i} className="staerke-bar" style={{ background:modBarColor(mod,i), width:'5px', height:'13px' }} />
                ))}
              </div>
              <div className="staerke-bar" style={{ background:'rgba(255,255,255,0.22)', height:'16px', width:'2px' }} />
              <div className="staerke-bars">
                {Array.from({length:5},(_,i) => (
                  <div key={i} className="staerke-bar" style={{ background:modBarColor(mod,i+6), width:'5px', height:'13px' }} />
                ))}
              </div>
              <span style={{ fontFamily:'var(--font-mono)', fontSize:'14px', letterSpacing:'0.04em', marginLeft:'6px',
                color: mod > 0 ? '#26c6da' : mod < 0 ? 'rgba(200,100,100,0.85)' : 'rgba(var(--text-rgb),0.5)' }}>
                {modStr(mod)}
              </span>
              <span style={{ fontFamily:'var(--font-mono)', fontSize:'9px', color:'rgba(var(--text-rgb),0.28)', marginLeft:'3px' }}>
                STR {s}
              </span>
            </div>
          </div>

          {/* Weight + Price */}
          <div className="fish-modal-section" style={{ display:'flex', gap:'32px' }}>
            <div>
              <div className="fish-modal-label">Gewicht</div>
              <div style={{ fontFamily:'var(--font-mono)', fontSize:'13px', color:'rgba(var(--text-rgb),0.75)', letterSpacing:'0.06em' }}>{fish.gewicht || '–'}</div>
            </div>
            <div>
              <div className="fish-modal-label">Verkaufspreis</div>
              <div style={{ fontFamily:'var(--font-mono)', fontSize:'13px', color:'rgba(255,214,0,0.88)', letterSpacing:'0.06em' }}>{fish.verkaufspreis || '–'}</div>
            </div>

          {/* Lebensraum */}

            Rezepte werden<br />noch ergänzt
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Fish Card ─────────────────────────────────────────────────────────────────
function FishCard({ fish, onSelect }) {
  const [imgOk, setImgOk] = useState(true);
  const s = fish.stärke ?? 0;
  const mod = dndMod(s);
  const rarity = fishRarity(fish);
  return (
    <div className="fish-card" onClick={() => onSelect(fish)} style={{ cursor:'pointer' }}>
      <div style={{ display:'flex', alignItems:'flex-start', gap:'9px', marginBottom:'2px' }}>
        <div className="fish-icon">
          {imgOk
            ? <img src={fish.icon} alt="" loading="lazy" onError={() => setImgOk(false)} />
            : <div className="fish-icon-missing"><PlaceholderIcon kind="fish" /></div>
          }
        </div>
        <div style={{ minWidth:0, flex:1 }}>
          <div className="fish-name">{fish.name_de}</div>
          <div className="fish-level" style={{ color: rarity.color }}>{rarity.label}</div>
        </div>
      </div>

      <div className="fish-divider" />

      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:'4px', marginBottom:'6px' }}>
        <span className="fish-size-badge">{fish.größenkategorie}</span>
        <div style={{ display:'flex', alignItems:'center', gap:'4px' }} title={`STR ${s} (${modStr(mod)})`}>
          {/* negative zone: mods −5 to −1 */}
          <div className="staerke-bars">
            {Array.from({length:5},(_,i) => (
              <div key={i} className="staerke-bar" style={{ background: modBarColor(mod, i) }} />
            ))}
          </div>
          {/* center bar: modifier ±0 reference */}
          <div className="staerke-bar" style={{ background:'rgba(255,255,255,0.22)', height:'12px' }} />
          {/* positive zone: mods +1 to +5 */}
          <div className="staerke-bars">
            {Array.from({length:5},(_,i) => (
              <div key={i} className="staerke-bar" style={{ background: modBarColor(mod, i + 6) }} />
            ))}
          </div>
          <span style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.08em', whiteSpace:'nowrap',
            color: mod > 0 ? '#26c6da' : mod < 0 ? 'rgba(200,100,100,0.75)' : 'rgba(var(--text-rgb),0.5)' }}>
            {modStr(mod)}
          </span>
        </div>
      </div>

      <div className="fish-klima">
        {(fish.klima||[]).map(k => {
          const col = KLIMA_COLOR[k] || '#8888cc';
          return (
            <span key={k} className="fish-klima-chip" style={{ background:col+'1e', border:`1px solid ${col}44`, color:col }}>
              {k}
            </span>
          );
        })}
      </div>

      <div className="fish-stats">
        <span className="fish-weight">{fish.gewicht}</span>
        <span className="fish-price">{fishPrice(fish)}</span>
      </div>

      {fish.desc_de && <p className="fish-desc">{fish.desc_de}</p>}
    </div>
  );
}

// ── Filter Chip ───────────────────────────────────────────────────────────────
function Chip({ label, active, onClick, accentColor }) {
  const style = accentColor && active
    ? { borderColor:accentColor+'77', background:accentColor+'1a', color:'var(--white)' }
    : accentColor
    ? { borderColor:accentColor+'33', color:accentColor+'bb' }
    : {};
  return (
    <button className={`filter-chip${active?' active':''}`} style={style} onClick={onClick}>{label}</button>
  );
}

// ── Fish Filter Sidebar ───────────────────────────────────────────────────────
function FishSidebar({ filters, setFilters, total, filtered, isOpen, onClose }) {
  const allKlimas = useMemo(() => {
    const s = new Set();
    ALL_FISH.forEach(f => (f.klima||[]).forEach(k => s.add(k)));
    return [...s].sort();
  }, []);

  const set = (key, val) => setFilters(f => ({...f, [key]:val}));
  const toggle = (key, val) => setFilters(f => {
    const arr = f[key]||[];
    return {...f, [key]: arr.includes(val) ? arr.filter(x=>x!==val) : [...arr,val]};
  });
  const resetAll = () => setFilters({ search:'', größe:[], klima:[], stärke:[], seltenheit:[], wassersort:'', sort:'name-az' });
  const hasAny = filters.search || filters.größe.length || filters.klima.length ||
                 filters.stärke.length || filters.seltenheit.length || filters.wassersort || filters.sort!=='name-az';

  return (
    <aside className={`res-sidebar${isOpen ? ' res-sidebar--open' : ''}`}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'14px' }}>
        <span style={{ fontFamily:'var(--font-display)', fontSize:'10px', letterSpacing:'0.25em', color:'rgba(38,198,218,0.6)', textTransform:'uppercase' }}>Filter</span>
        <div style={{ display:'flex', gap:'6px', alignItems:'center' }}>
          {hasAny && <XBtn onClick={resetAll} />}
          <button className="res-sidebar-close" onClick={onClose} title="Schließen">✕</button>
        </div>
      </div>

      {/* Search */}
      <div style={{ position:'relative', marginBottom:'16px' }}>
        <input type="text" placeholder="Fisch suchen…"
          value={filters.search} onChange={e => set('search', e.target.value)} />
        {filters.search
          ? <button onClick={()=>set('search','')} style={{ position:'absolute', right:'8px', top:'50%', transform:'translateY(-50%)', background:'none', border:'none', color:'rgba(var(--text-rgb),0.45)', cursor:'pointer', padding:0, fontSize:'10px', lineHeight:1 }}>✕</button>
          : <svg style={{ position:'absolute', right:'9px', top:'50%', transform:'translateY(-50%)', opacity:0.28, pointerEvents:'none' }} width="12" height="12" viewBox="0 0 12 12" fill="none">
              <circle cx="5" cy="5" r="3.5" stroke="rgba(38,198,218,1)" strokeWidth="1.2"/>
              <line x1="8" y1="8" x2="11" y2="11" stroke="rgba(38,198,218,1)" strokeWidth="1.2"/>
            </svg>
        }
      </div>

      <FilterGroup title="Größe" active={filters.größe.length>0} onReset={()=>set('größe',[])} collapsible>
        <div style={{ display:'flex', flexWrap:'wrap', gap:'4px' }}>
          {GRÖSSE_ORDER.map(g => <Chip key={g} label={g} active={filters.größe.includes(g)} onClick={()=>toggle('größe',g)} />)}
        </div>
      </FilterGroup>

      <FilterGroup title="Klima" active={filters.klima.length>0} onReset={()=>set('klima',[])} collapsible>
        <div style={{ display:'flex', flexWrap:'wrap', gap:'4px' }}>
          {allKlimas.map(k => <Chip key={k} label={k} active={filters.klima.includes(k)} accentColor={KLIMA_COLOR[k]} onClick={()=>toggle('klima',k)} />)}
        </div>

<FilterGroup title="Wasserart" active={!!filters.wassersort} onReset={()=>set('wassersort','')} collapsible>
        <div style={{ display:'flex', gap:'4px' }}>
          <Chip label="Salzwasser" active={filters.wassersort==='salz'} onClick={()=>set('wassersort', filters.wassersort==='salz' ? '' : 'salz')} accentColor="#26c6da" />
          <Chip label="Süßwasser"  active={filters.wassersort==='süß'}  onClick={()=>set('wassersort', filters.wassersort==='süß'  ? '' : 'süß')}  accentColor="#88bbff" />
        </div>
      </FilterGroup>

      <FilterGroup title="Seltenheitsgrad" active={filters.seltenheit.length>0} onReset={()=>set('seltenheit',[])} collapsible>
        <div style={{ display:'flex', flexDirection:'column', gap:'3px' }}>
          {RARITY_TIERS.map(t => (
            <button key={t.label} className={`sort-btn${filters.seltenheit.includes(t.label)?' active':''}`}
              onClick={()=>toggle('seltenheit', t.label)}
              style={filters.seltenheit.includes(t.label) ? { color:t.color, borderColor:t.color+'55' } : {}}>
              {t.label}
            </button>
          ))}
        </div>
      </FilterGroup>

      <FilterGroup title="Sortierung" active={filters.sort!=='name-az'} onReset={()=>set('sort','name-az')} collapsible>
        <div style={{ display:'flex', flexDirection:'column', gap:'2px' }}>
          {SORT_OPTIONS.map(o => (
            <button key={o.id} className={`sort-btn${filters.sort===o.id?' active':''}`} onClick={()=>set('sort',o.id)}>{o.label}</button>
          ))}
        </div>
      </FilterGroup>

      {hasAny && (
        <div style={{ marginTop:'auto', paddingTop:'14px', borderTop:'1px solid rgba(38,198,218,0.08)' }}>

            style={{ width:'100%', padding:'6px', background:'rgba(200,60,60,0.08)', border:'1px solid rgba(200,60,60,0.25)', borderRadius:'2px', color:'rgba(230,90,90,0.65)', fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.18em', cursor:'pointer', transition:'all 0.15s', textTransform:'uppercase' }}

            Filter löschen
          </button>
        </div>
      )}
    </aside>
  );
}

function ResourceTab({ data, fallbackIcon, searchPlaceholder, onCount }) {
  const [filters, setFilters] = useState({ search:'', fundort:[], kategorie:[], seltenheit:[], sort:'name-az' });
  const [filterOpen, setFilterOpen] = useState(false);
  const [selectedItem, setSelectedItem] = useState(null);

  const allFundorte = useMemo(() => {
    const s = new Set();
    data.forEach(d => (d.fundort||[]).forEach(f => s.add(f)));
    return [...s].sort();
  }, [data]);

  const allKategorien = useMemo(() => {
    const s = new Set();
    data.forEach(d => s.add(d.kategorie));
    return [...s].sort();
  }, [data]);

  const hasActiveFilters = filters.search || filters.fundort.length || filters.kategorie.length || filters.seltenheit.length || filters.sort !== 'name-az';

  const filtered = useMemo(() => {
    let r = data;
    if (filters.search) {
      const q = filters.search.toLowerCase();
      r = r.filter(d => d.name_de.toLowerCase().includes(q) || (d.desc_de||'').toLowerCase().includes(q));
    }
    if (filters.fundort.length)
      r = r.filter(d => (d.fundort||[]).some(f => filters.fundort.includes(f)));
    if (filters.kategorie.length)
      r = r.filter(d => filters.kategorie.includes(d.kategorie));
    if (filters.seltenheit.length)
      r = r.filter(d => filters.seltenheit.includes(resRarity(d).label));

    r = [...r];
    switch (filters.sort) {
      case 'name-az':         r.sort((a,b)=>a.name_de.localeCompare(b.name_de,'de')); break;
      case 'name-za':         r.sort((a,b)=>b.name_de.localeCompare(a.name_de,'de')); break;
      case 'seltenheit-asc':  r.sort((a,b)=>a.seltenheitsgrad-b.seltenheitsgrad); break;
      case 'seltenheit-desc': r.sort((a,b)=>b.seltenheitsgrad-a.seltenheitsgrad); break;
      case 'preis-asc':       r.sort((a,b)=>parsePreis(a.verkaufspreis)-parsePreis(b.verkaufspreis)); break;
      case 'preis-desc':      r.sort((a,b)=>parsePreis(b.verkaufspreis)-parsePreis(a.verkaufspreis)); break;
    }
    return r;
  }, [data, filters]);

  useEffect(() => { onCount({ filtered: filtered.length, total: data.length }); }, [filtered.length, data.length]);

  return (
    <div className="res-layout">
      {filterOpen && <div className="res-filter-overlay" onClick={() => setFilterOpen(false)} />}
      <ResourceSidebar
        filters={filters} setFilters={setFilters}
        isOpen={filterOpen} onClose={() => setFilterOpen(false)}
        allFundorte={allFundorte} allKategorien={allKategorien}
        searchPlaceholder={searchPlaceholder}
      />
      <main className="res-main">
        <button className="res-mobile-filter-btn" onClick={() => setFilterOpen(true)}>
          {hasActiveFilters && <span className="filter-active-dot" />}
          Filter
        </button>
        {filtered.length > 0
          ? <div className="fish-grid">{filtered.map(d => <ResourceCard key={d.id} item={d} onSelect={setSelectedItem} fallbackIcon={fallbackIcon} />)}</div>
          : <div className="res-empty">Keine Treffer</div>
        }
      </main>
      {selectedItem && <ResourceDetailModal item={selectedItem} onClose={() => setSelectedItem(null)} fallbackIcon={fallbackIcon} />}
    </div>
  );
}

// ── Fish Tab content ──────────────────────────────────────────────────────────
function FishTab({ onCount, onSelect }) {
  const [filters, setFilters] = useState({ search:'', größe:[], klima:[], stärke:[], seltenheit:[], wassersort:'', sort:'name-az' });
  const [filterOpen, setFilterOpen] = useState(false);
  const hasActiveFilters = filters.search || filters.größe.length || filters.klima.length ||
    filters.stärke.length || filters.seltenheit.length || filters.wassersort || filters.sort !== 'name-az';

  const filtered = useMemo(() => {
    let r = ALL_FISH;
    if (filters.search) {
      const q = filters.search.toLowerCase();
      r = r.filter(f => f.name_de.toLowerCase().includes(q) || (f.desc_de||'').toLowerCase().includes(q));
    }
    if (filters.größe.length)
      r = r.filter(f => filters.größe.includes(f.größenkategorie));
    if (filters.klima.length)
      r = r.filter(f => (f.klima||[]).some(k => filters.klima.includes(k)));
    if (filters.stärke.length)
      r = r.filter(f => filters.stärke.some(g => {
        const grp = STÄRKE_GROUPS.find(x=>x.label===g);
        return grp && f.stärke>=grp.min && f.stärke<=grp.max;
      }));
    if (filters.seltenheit.length)
      r = r.filter(f => filters.seltenheit.includes(fishRarity(f).label));
    if (filters.wassersort)
      r = r.filter(f => f.wassersort === filters.wassersort);

    r = [...r];
    switch (filters.sort) {
      case 'name-az':         r.sort((a,b)=>a.name_de.localeCompare(b.name_de,'de')); break;
      case 'name-za':         r.sort((a,b)=>b.name_de.localeCompare(a.name_de,'de')); break;
      case 'seltenheit-asc':  r.sort((a,b)=>{ const ta=fishRarityIdx(a),tb=fishRarityIdx(b); return ta!==tb ? ta-tb : fishRarityScore(a)-fishRarityScore(b); }); break;
      case 'seltenheit-desc': r.sort((a,b)=>{ const ta=fishRarityIdx(a),tb=fishRarityIdx(b); return ta!==tb ? tb-ta : fishRarityScore(b)-fishRarityScore(a); }); break;
      case 'preis-asc':       r.sort((a,b)=>parsePreis(a.verkaufspreis)-parsePreis(b.verkaufspreis)); break;
      case 'preis-desc':      r.sort((a,b)=>parsePreis(b.verkaufspreis)-parsePreis(a.verkaufspreis)); break;
      case 'staerke-desc':    r.sort((a,b)=>(b.stärke||0)-(a.stärke||0)); break;
      case 'staerke-asc':     r.sort((a,b)=>(a.stärke||0)-(b.stärke||0)); break;
      case 'gewicht-desc':    r.sort((a,b)=>parseGewicht(b.gewicht)-parseGewicht(a.gewicht)); break;
      case 'gewicht-asc':     r.sort((a,b)=>parseGewicht(a.gewicht)-parseGewicht(b.gewicht)); break;
    }
    return r;
  }, [filters]);

  useEffect(() => { onCount({ filtered: filtered.length, total: ALL_FISH.length }); }, [filtered.length]);

  return (
    <div className="res-layout">
      {filterOpen && <div className="res-filter-overlay" onClick={() => setFilterOpen(false)} />}
      <FishSidebar filters={filters} setFilters={setFilters} total={ALL_FISH.length} filtered={filtered.length} isOpen={filterOpen} onClose={() => setFilterOpen(false)} />
      <main className="res-main">
        <button className="res-mobile-filter-btn" onClick={() => setFilterOpen(true)}>
          {hasActiveFilters && <span className="filter-active-dot" />}
          Filter
        </button>
        {filtered.length > 0
          ? <div className="fish-grid">{filtered.map(f => <FishCard key={f.id} fish={f} onSelect={onSelect} />)}</div>
          : <div className="res-empty">Keine Treffer</div>
        }
      </main>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [mouse, setMouse] = useState({ x:0.5, y:0.5 });
  const [tweaks] = useTweaks(TWEAK_DEFAULTS);
  const [activeTab, setActiveTab] = useState('fische');
  const [tabCount, setTabCount] = useState(null);
  const [selectedFish, setSelectedFish] = useState(null);

  const handleMouseMove = useCallback(e => setMouse({ x:e.clientX/window.innerWidth, y:e.clientY/window.innerHeight }), []);
  const handleTabChange = useCallback(id => { setActiveTab(id); if (id !== activeTab) setTabCount(null); }, [activeTab]);

  return (
    <div onMouseMove={handleMouseMove} style={{ display:'flex', flexDirection:'column', height:'100vh', overflow:'hidden', position:'relative' }}>
      {tweaks.showParticles && <ParticleField mouseX={mouse.x} mouseY={mouse.y} />}
      <SiteNav rightLabel="RESSOURCEN" />

      {/* Tab bar */}
      <nav className="res-tabbar">
        <div className="res-tabbar-left">
          {tabCount && <span className="res-tabbar-count">Anzahl: {tabCount.filtered} / {tabCount.total}</span>}
        </div>
        <div className="res-tabbar-tabs">
          {TABS.map(tab => (
            <button key={tab.id} className={`res-tab${activeTab===tab.id?' active':''}`} onClick={()=>handleTabChange(tab.id)}>
              <span className="res-tab-dot" />
              {tab.label}
            </button>
          ))}
        </div>
      </nav>

      {/* Tab content */}
      {activeTab === 'fische'       && <FishTab onCount={setTabCount} onSelect={setSelectedFish} />}
      {selectedFish && <FishDetailModal fish={selectedFish} onClose={() => setSelectedFish(null)} />}
      {activeTab === 'pflanzen'   && <ResourceTab data={ALL_PFLANZEN}   fallbackIcon="🌿" searchPlaceholder="Pflanze suchen…"  onCount={setTabCount} />}
      {activeTab === 'mineralien' && <ResourceTab data={ALL_MINERALIEN} fallbackIcon="💎" searchPlaceholder="Mineral suchen…"  onCount={setTabCount} />}
      {activeTab === 'monsterteile' && <PlaceholderTab id="monsterteile" label="Monsterteile" />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<SiteGate><App /></SiteGate>);
</script>
</body></html>
