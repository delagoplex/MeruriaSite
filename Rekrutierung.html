<!DOCTYPE html>
<html lang="de"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/images/favicon/favicon-m.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/images/favicon/favicon-m-180.png">
<title>Rekrutierung · Meruria</title>
<link rel="stylesheet" href="assets/styles/global/fonts.css">
<link rel="stylesheet" href="assets/styles/global/base.css">
<script src="assets/scripts/vendor/react.production.min.js"></script>
<script src="assets/scripts/vendor/react-dom.production.min.js"></script>
<script src="assets/scripts/vendor/supabase.min.js"></script>
<script src="assets/scripts/supabase-client.js"></script>
<script src="assets/components/nav.js"></script>
<script src="assets/components/site-gate.js"></script>
<script src="assets/scripts/data/divisions-data.js"></script>
<script src="assets/components/nsc-statblock.js"></script>
<script src="assets/components/rekrutierungsrechner.js"></script>
<script src="assets/components/page-hero.js"></script>
</head>
<body>
<div id="root"></div>
<script>
(function () {
const h        = React.createElement;
const useState = React.useState;

const { SiteNav, SiteGate, NscStatblock, Rekrutierungsrechner, PageHero } = window;
const DIVS = window.DIVISIONS_DATA || [];

// ── Styles ──────────────────────────────────────────────────
const PAGE_BG    = '#05040f';

// ── DivisionTab ─────────────────────────────────────────────
function DivisionTab(props) {
  var div    = props.div;
  var active = props.active;
  var onClick = props.onClick;
  var r = parseInt(div.accent.slice(1,3), 16);
  var g = parseInt(div.accent.slice(3,5), 16);
  var b = parseInt(div.accent.slice(5,7), 16);
  var cA = function(a) { return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; };

  return h('button', {
    onClick: onClick,
    style: {
      display:       'flex',
      alignItems:    'center',
      gap:           8,
      padding:       '8px 14px',
      background:    active ? cA(0.18) : 'rgba(10,8,28,0.5)',
      border:        '1px solid ' + (active ? div.accent : 'rgba(124,77,255,0.15)'),
      borderRadius:  3,
      cursor:        'pointer',
      flexShrink:    0,
      transition:    'all 0.15s',
      boxShadow:     active ? ('0 0 14px ' + cA(0.25)) : 'none',
    },
  },
    h('img', {
      src:    div.logo,
      width:  22, height: 22,
      style:  { objectFit: 'contain', flexShrink: 0, opacity: active ? 1 : 0.55 },
      alt:    div.name,
    }),
    h('span', {
      style: {
        fontFamily:    'var(--font-mono)',
        fontSize:      9,
        letterSpacing: '0.18em',
        textTransform: 'uppercase',
        color:         active ? div.accent : 'rgba(180,170,220,0.5)',
        whiteSpace:    'nowrap',
      },
    }, div.name.replace(/^Die\s+/, ''))
  );
}

// ── App ─────────────────────────────────────────────────────
function App() {
  var _divIdx = useState(0);
  var divIdx  = _divIdx[0];
  var setDivIdx = _divIdx[1];
  var _rang   = useState(5);
  var selectedRang = _rang[0];
  var setRang = _rang[1];

  var division = DIVS[divIdx] || DIVS[0];

  return h(SiteGate, null,
    h('div', {
      className: 'page-root',
      style: { background: PAGE_BG, minHeight: '100vh' },
    },
      h(SiteNav, null),

      // Header
      h(PageHero, {
        kicker: 'Division · Rekrutierung',
        title:  'Rekrutierung',
        sub:    'Wähle eine Division und einen Rang, um den Statblock des zugehörigen NSC einzusehen. Der Rechner zeigt dir, was eine Rekrutierung kostet — oder einbringt.',
      }),

      // ── Page content ──────────────────────────────────────
      h('div', {
        style: {
          maxWidth:  860,
          margin:    '0 auto',
          padding:   '40px 24px 80px',
        },
      },

        // Divider
        h('div', {
          style: {
            height:     1,
            background: 'linear-gradient(to right, rgba(124,77,255,0.4), transparent)',
            marginBottom: 28,
          },
        }),

        // Division picker
        h('div', {
          style: {
            fontFamily:    'var(--font-mono)',
            fontSize:      8.5,
            letterSpacing: '0.22em',
            textTransform: 'uppercase',
            color:         'rgba(124,77,255,0.5)',
            marginBottom:  12,
          },
        }, 'Division'),
        h('div', {
          style: {
            display:    'flex',
            flexWrap:   'wrap',
            gap:        8,
            marginBottom: 32,
          },
        },
          DIVS.map(function(div, i) {
            return h(DivisionTab, {
              key:     div.id,
              div:     div,
              active:  i === divIdx,
              onClick: function() { setDivIdx(i); setRang(5); },
            });
          })
        ),

        // Two-column layout
        h('div', {
          style: {
            display:             'grid',
            gridTemplateColumns: '1fr 1fr',
            gap:                 28,
            alignItems:          'start',
          },
        },

          // Left: Statblock
          h('div', null,
            h('div', {
              style: {
                fontFamily:    'var(--font-mono)',
                fontSize:      8.5,
                letterSpacing: '0.22em',
                textTransform: 'uppercase',
                color:         'rgba(124,77,255,0.5)',
                marginBottom:  12,
              },
            }, 'NSC Statblock'),
            h(NscStatblock, {
              division:      division,
              selectedRang:  selectedRang,
              onRangChange:  setRang,
            })
          ),

          // Right: Calculator
          h('div', null,
            h('div', {
              style: {
                fontFamily:    'var(--font-mono)',
                fontSize:      8.5,
                letterSpacing: '0.22em',
                textTransform: 'uppercase',
                color:         'rgba(124,77,255,0.5)',
                marginBottom:  12,
              },
            }, 'Rekrutierungsrechner'),
            h('div', {
              style: {
                fontFamily:    'var(--font-body)',
                fontSize:      11,
                fontWeight:    300,
                color:         'rgba(160,140,255,0.45)',
                lineHeight:    1.5,
                marginBottom:  14,
              },
            }, 'Basierend auf dem links gewählten NSC-Rang.'),
            h(Rekrutierungsrechner, {
              division: division,
              nscRang:  selectedRang,
            })
          )
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App, null));
})();
</script>
</body>
</html>
