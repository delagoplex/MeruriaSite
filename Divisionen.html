// ── HELPERS ──────────────────────────────────────────────
function hexPoints(s) {
  const cx = s/2, cy = s/2, r = s/2;
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = (Math.PI/180)*(60*i - 30);
    pts.push(`${cx + r*Math.cos(a)},${cy + r*Math.sin(a)}`);
  }
  return pts.join(' ');
}

function FloatingHexField({ mouseX, mouseY }) {
  return (
    <div style={{ position:'fixed', inset:0, pointerEvents:'none', zIndex:1, overflow:'hidden', clipPath:'inset(232px 0 0 0)' }}>
      {HEX_DEFS.map((h, i) => {
        const px = hexPoints(h.size);
        const parallaxX = (mouseX - 0.5) * (i % 3 === 0 ? -12 : i % 3 === 1 ? -6 : -18);
        const parallaxY = (mouseY - 0.5) * (i % 3 === 0 ? -8  : i % 3 === 1 ? -4 : -14);
        return (
          <div key={i} style={{ position:'absolute', left:h.x, top:h.y, animation:`${h.anim} ${h.dur} ease-in-out infinite`, animationDelay:`${i*0.7}s`, transform:`translate(${parallaxX}px,${parallaxY}px)`, transition:'transform 0.4s ease-out', willChange:'transform' }}>
            <svg width={h.size} height={h.size} viewBox={`0 0 ${h.size} ${h.size}`} style={{ display:'block', opacity:h.opacity, filter:`drop-shadow(0 0 ${h.size*0.06}px ${h.stroke})` }}>
              <polygon points={px} fill="transparent" stroke={h.stroke} strokeWidth="1" />
            </svg>
          </div>
        );
      })}
    </div>
  );
}

// ── PARTICLES ─────────────────────────────────────────────
function ParticleField({ mouseX, mouseY }) {
  const canvasRef = useRef(null);
  const animRef = useRef(null);
  const particles = useRef([]);
  const mouse = useRef({ x:0.5, y:0.5 });
  useEffect(() => { mouse.current = { x: mouseX, y: mouseY }; }, [mouseX, mouseY]);
  useEffect(() => {
    const canvas = canvasRef.current; if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const resize = () => { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; };
    resize(); window.addEventListener('resize', resize);
    particles.current = Array.from({length:55}, () => ({
      x: Math.random(), y: Math.random(),
      r: Math.random()*1.6+0.5,
      vx:(Math.random()-0.5)*0.05, vy:(Math.random()-0.5)*0.05,
      alpha: Math.random()*0.2+0.05,
    }));
    const tick = () => {
      const w = canvas.width, h = canvas.height;
      const shiftX = (mouse.current.x - 0.5)*-14, shiftY = (mouse.current.y - 0.5)*-14;
      ctx.clearRect(0,0,w,h);
      particles.current.forEach(p => {
        p.x += p.vx/w*60; p.y += p.vy/h*60;
        if(p.x<0)p.x=1; if(p.x>1)p.x=0; if(p.y<0)p.y=1; if(p.y>1)p.y=0;
        ctx.beginPath(); ctx.arc(p.x*w+shiftX, p.y*h+shiftY, p.r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(160,140,255,${p.alpha})`; ctx.fill();
      });
      animRef.current = requestAnimationFrame(tick);
    };
    tick();
    return () => { cancelAnimationFrame(animRef.current); window.removeEventListener('resize', resize); };
  }, []);
  return <canvas ref={canvasRef} style={{ position:'fixed', inset:0, width:'100%', height:'100%', pointerEvents:'none', zIndex:0, clipPath:'inset(232px 0 0 0)' }} />;
}

// ── SCROLL REVEAL ─────────────────────────────────────────
function useScrollReveal() {
  useEffect(() => {
    const revealed = new WeakSet();
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting || revealed.has(entry.target)) return;
        revealed.add(entry.target);
        observer.unobserve(entry.target);
        entry.target.classList.add('visible');
      });
    }, { threshold: 0.05, rootMargin: '0px 0px -20px 0px' });
    const t = setTimeout(() => {
      document.querySelectorAll('.reveal-up').forEach(el => observer.observe(el));
    }, 100);
    return () => { clearTimeout(t); observer.disconnect(); };
  }, []);
}

// ── NAV ITEM ──────────────────────────────────────────────
function NavItem({ tab }) {
  const [open, setOpen] = useState(false);
  const [glitchKey, setGlitchKey] = useState(0);
  const [glitchActive, setGlitchActive] = useState(false);
  const timer = useRef(null);
  const glitchInterval = useRef(null);
  const glitchTimeout = useRef(null);
  const isActive = tab.id === 'divisionen';
  const dur = '1.4s';

  const fireGlitch = () => {
    setGlitchActive(false);
    clearTimeout(glitchTimeout.current);
    glitchTimeout.current = setTimeout(() => { setGlitchKey(k=>k+1); setGlitchActive(true); }, 20);
  };
  const show = () => {
    clearTimeout(timer.current);
    if (!open) {
      setOpen(true);
      clearInterval(glitchInterval.current); clearTimeout(glitchTimeout.current);
      glitchTimeout.current = setTimeout(() => { fireGlitch(); glitchInterval.current = setInterval(fireGlitch, 2800); }, 400);
    }
  };
  const hide = () => {
    timer.current = setTimeout(() => { setOpen(false); setGlitchActive(false); clearInterval(glitchInterval.current); }, 300);
  };
  useEffect(() => () => { clearTimeout(timer.current); clearTimeout(glitchTimeout.current); clearInterval(glitchInterval.current); }, []);

  return (
    <div onMouseEnter={show} onMouseLeave={hide} style={{ position:'relative' }}>
      <button
        style={{ fontFamily:'var(--font-display)', fontSize:'11px', fontWeight:'400', letterSpacing:'0.18em', padding:'10px 20px', background: isActive ? 'rgba(124,77,255,0.1)' : 'transparent', border: isActive ? '1px solid rgba(160,140,255,0.45)' : '1px solid rgba(160,140,255,0.15)', color: isActive ? '#c9b8ff' : 'rgba(200,190,240,0.7)', cursor:'pointer', borderRadius:'3px', transition:'all 0.2s', textTransform:'uppercase', whiteSpace:'nowrap' }}

        {tab.label}
      </button>
      {open && (
        <div onMouseEnter={show} onMouseLeave={hide} style={{ position:'absolute', top:'calc(100% + 6px)', left:0, minWidth:'210px', background:'rgba(8,6,22,0.96)', border:'1px solid rgba(160,140,255,0.2)', borderRadius:'4px', boxShadow:'0 8px 32px rgba(0,0,0,0.6)', animation:'slideDown 0.18s ease forwards', zIndex:200, backdropFilter:'blur(12px)', overflow:'hidden' }}>
          {tab.items.map((item, i) => (

                <polygon points={hexPoints(34)} fill={`${acc}1a`} stroke={acc} strokeWidth="0.7" opacity="0.9" />
                <text x="17" y="21" textAnchor="middle" fontFamily="var(--font-mono)" fontSize="8" fill={acc} opacity="0.95">{div.leiter.kuerzel}</text>
              </svg>
            </div>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ display:'flex', alignItems:'baseline', gap:'8px', marginBottom:'3px', flexWrap:'wrap' }}>
                <span style={{ fontFamily:'var(--font-display)', fontSize:'11px', fontWeight:'400', letterSpacing:'0.13em', color:`${acc}ee` }}>{div.leiter.name}</span>
                <span style={{ fontFamily:'var(--font-mono)', fontSize:'6.5px', letterSpacing:'0.2em', color:`${acc}55`, textTransform:'uppercase' }}>{div.leiter.titel}</span>
              </div>
              <p style={{ fontFamily:'var(--font-body)', fontWeight:'300', fontSize:'11.5px', lineHeight:1.65, color:'rgba(200,190,240,0.45)', letterSpacing:'0.01em', fontStyle:'italic', textWrap:'pretty' }}>{div.leiter.note}</p>
            </div>
          </div>

          {/* Zur Division cue */}
          <div style={{ display:'flex', justifyContent:'flex-end', marginTop:'16px', position:'relative', zIndex:1 }}>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:'7.5px', letterSpacing:'0.22em',
              color: hov ? acc : `${acc}44`,
              textTransform:'uppercase', transition:'color 0.3s' }}>Zur Division →</span>
          </div>

        </div>
      </a>
    </div>
  );
}
