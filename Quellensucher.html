<script type="text/babel">

const { useState, useEffect, useRef, useCallback } = React;
const { useTweaks, TweaksPanel, TweakSection, TweakToggle, SiteNav, ParticleField, FloatingHexField } = window;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showParticles": true
}/*EDITMODE-END*/;

const NAV_H = 52;
const ACCENT = '#1aacb8';
const ACCENT_R = 181, ACCENT_G = 131, ACCENT_B = 42;


const DIVISION = window.DIVISIONS_DATA.find(d => d.id === 'quellensucher');

// ── HEX HELPER ──────────────────────────────────────────
function hexPoints(s) {
  const cx = s/2, cy = s/2, r = s/2;
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = (Math.PI/180)*(60*i-30);
    pts.push(`${cx+r*Math.cos(a)},${cy+r*Math.sin(a)}`);
  }
  return pts.join(' ');
}
function OctSvg({ size=24, color='currentColor', fill='none', strokeWidth=1, style={} }) {
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ display:'block', flexShrink:0, ...style }}>
      <polygon points={hexPoints(size)} fill={fill} stroke={color} strokeWidth={strokeWidth} />
    </svg>
  );
}

// ── SCROLL REVEAL ────────────────────────────────────────
function useScrollReveal() {
  useEffect(() => {
    let observer;
    const revealed = new WeakSet();
    const init = () => {
      observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          const el = entry.target;
          observer.unobserve(el);
          if (revealed.has(el)) return;
          revealed.add(el);
          setTimeout(() => el.classList.add('visible'), 0);
        });
      }, { threshold: 0.06, rootMargin: '0px 0px -24px 0px' });
      document.querySelectorAll('.reveal-up,.reveal-left').forEach(el => observer.observe(el));
    };
    const t = setTimeout(init, 120);
    return () => { clearTimeout(t); observer && observer.disconnect(); };
  }, []);
}

// ── TOC SIDEBAR ──────────────────────────────────────────
const TOC_SECTIONS = [
  { id: 'uebersicht',   label: 'Übersicht',       indent: false },
  { id: 'beschreibung', label: 'Beschreibung',     indent: true  },
  { id: 'auftraege',    label: 'Auftragseindruck', indent: true  },
  { id: 'rangsystem',   label: 'Rangsystem',       indent: true  },
];

function TOCSidebar({ navHeight, headerBottom }) {
  const asideRef = React.useRef(null);
  const [activeId, setActiveId] = useState('uebersicht');

  useEffect(() => {
    const update = () => { const ideal = (headerBottom || 0) - window.scrollY; const val = Math.max(0, ideal); if (asideRef.current) { asideRef.current.style.top = val + 'px'; asideRef.current.style.height = `calc(100vh - ${val}px)`; } };
    update();
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update, { passive: true });
    return () => { window.removeEventListener('scroll', update); window.removeEventListener('resize', update); };
  }, [headerBottom, navHeight]);

  useEffect(() => {
    const ids = TOC_SECTIONS.map(s => s.id);
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) setActiveId(entry.target.id); });
    }, { rootMargin: `-${navHeight + 20}px 0px -60% 0px`, threshold: 0 });
    ids.forEach(id => { const el = document.getElementById(id); if (el) observer.observe(el); });
    return () => observer.disconnect();
  }, [navHeight]);

  const scrollTo = (id) => {
    const el = document.getElementById(id);
    if (el) { const y = el.getBoundingClientRect().top + window.scrollY - navHeight - 16; window.scrollTo({ top: y, behavior: 'smooth' }); }
  };

  return (
    <aside ref={asideRef} style={{ width:'var(--sidebar-w)', flexShrink:0, position:'fixed', top:`${navHeight}px`, left:0, height:`calc(100vh - ${navHeight}px)`, borderRight:`1px solid ${ACCENT}18`, padding:'28px 0', background:'rgba(10,3,3,0.90)', backdropFilter:'blur(12px)', zIndex:50, overflowY:'auto' }}>

      <div style={{ padding:'0 20px 16px', borderBottom:`1px solid ${ACCENT}12`, marginBottom:'8px' }}>
        <div style={{ display:'flex', alignItems:'center', gap:'6px', marginBottom:'6px' }}>
          <svg width="10" height="10" viewBox="0 0 10 10"><polygon points={hexPoints(10)} fill={`${ACCENT}22`} stroke={ACCENT} strokeWidth="0.8" /></svg>
          <div style={{ fontFamily:'var(--font-mono)', fontSize:'7px', letterSpacing:'0.3em', color:`${ACCENT}55`, textTransform:'uppercase' }}>Division VII</div>
        </div>
        <div style={{ fontFamily:'var(--font-display)', fontSize:'11px', fontWeight:'400', letterSpacing:'0.14em', color:`${ACCENT}cc`, lineHeight:1.4 }}>Die Quellensucher</div>
      </div>

      {TOC_SECTIONS.map(entry => {
        const isActive = activeId === entry.id;
        return (
          <button key={entry.id} onClick={() => scrollTo(entry.id)}
            style={{ display:'flex', alignItems:'flex-start', gap:'8px', width:'100%', textAlign:'left', padding: entry.indent ? '6px 20px 6px 28px' : '8px 20px', background: isActive ? `${ACCENT}0e` : 'transparent', border:'none', borderLeft: isActive ? `2px solid ${ACCENT}` : '2px solid transparent', cursor:'pointer', fontFamily:'var(--font-body)', fontWeight: entry.indent ? '300' : '400', fontSize:'11px', letterSpacing:'0.1em', fontVariant:'small-caps', color: isActive ? ACCENT : entry.indent ? 'rgba(140,230,240,0.45)' : 'rgba(160,235,242,0.65)', transition:'all 0.15s', lineHeight:1.55 }}
            onMouseEnter={e => { if (!isActive) { e.currentTarget.style.color='#f0eeff'; e.currentTarget.style.borderLeftColor=`${ACCENT}55`; e.currentTarget.style.background=`${ACCENT}07`; }}}
            onMouseLeave={e => { if (!isActive) { e.currentTarget.style.color = entry.indent ? 'rgba(255,200,190,0.45)' : 'rgba(255,210,200,0.65)'; e.currentTarget.style.borderLeftColor='transparent'; e.currentTarget.style.background='transparent'; }}}>
            <OctSvg size={entry.indent ? 4 : 6} color={isActive ? ACCENT : `${ACCENT}44`} fill={isActive ? `${ACCENT}44` : 'transparent'} strokeWidth={1} style={{ flexShrink:0, marginTop:'3px' }} />
            <span style={{ display:'block', minWidth:0 }}>{entry.label}</span>
          </button>
        );
      })}

      <div style={{ margin:'20px 20px 12px', borderTop:`1px solid ${ACCENT}10` }} />
      <div style={{ fontFamily:'var(--font-mono)', fontSize:'7px', letterSpacing:'0.25em', color:`${ACCENT}33`, textTransform:'uppercase', padding:'0 20px', marginBottom:'8px' }}>Weitere Divisionen</div>
      {[{ n:'I', label:'Die Kuratoren', href:'Divisionen.html' }, { n:'II', label:'Die Sturmritter', href:'Sturmritter.html' }, { n:'III', label:'Die Sentinels', href:'Sentinels.html' }, { n:'IV', label:'Die Friedenshüter', href:'Friedenshueter.html' }, { n:'V', label:'Die Outfitters', href:'Outfitters.html' }, { n:'VI', label:'Die Pathfinders', href:'Pathfinders.html' },   { n:'VIII', label:'???', href:'#' }].map(({ n, label, href }) => (
        <a key={n} href={href} style={{ display:'flex', alignItems:'center', gap:'8px', padding:'5px 20px', opacity:0.35, textDecoration:'none', transition:'opacity 0.15s' }}
          onMouseEnter={e=>e.currentTarget.style.opacity='0.7'} onMouseLeave={e=>e.currentTarget.style.opacity='0.35'}>
          <OctSvg size={4} color={`${ACCENT}44`} fill="transparent" strokeWidth={1} />
          <span style={{ fontFamily:'var(--font-mono)', fontSize:'9px', letterSpacing:'0.15em', color:`${ACCENT}55` }}>{n} — {label}</span>
        </a>
      ))}
    </aside>
  );
}

// ── DIVISION PAGE ────────────────────────────────────────
function DivisionPage({ division, heroRef }) {
  const accent = division.accent;
  const pal = division.palette;

  const SectionHeader = ({ label }) => (
    <div className="reveal-left" style={{ display:'flex', alignItems:'center', gap:'10px', marginBottom:'22px' }}>
      <svg width="8" height="8" viewBox="0 0 8 8"><polygon points={hexPoints(8)} fill={`${accent}44`} stroke={accent} strokeWidth="0.8" /></svg>
      <div style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.28em', color:`${accent}77`, textTransform:'uppercase' }}>{label}</div>
      <div style={{ flex:1, height:'1px', background:`linear-gradient(90deg, ${accent}44, rgba(124,77,255,0.2), transparent)` }} />
      <svg width="5" height="5" viewBox="0 0 5 5"><polygon points={hexPoints(5)} fill="rgba(124,77,255,0.3)" stroke="rgba(124,77,255,0.5)" strokeWidth="0.6" /></svg>
    </div>
  );

  return (
    <div>
      {/* Hero — full bleed */}
      <div id="uebersicht" style={{ width:'calc(100% + var(--sidebar-w))', marginLeft:'calc(-1 * var(--sidebar-w))', position:'relative', height:'340px', background:`linear-gradient(150deg, ${pal[0]} 0%, ${pal[1]}dd 45%, ${pal[0]} 100%)`, borderBottom:`1px solid ${accent}28`, overflow:'hidden', scrollMarginTop:`${NAV_H}px` }}>

        {/* Diagonal texture */}
        <div style={{ position:'absolute', inset:0, backgroundImage:`repeating-linear-gradient(135deg, transparent, transparent 18px, ${accent}06 18px, ${accent}06 19px)`, pointerEvents:'none', zIndex:1 }} />
        {/* Hex dot grid */}
        <div style={{ position:'absolute', inset:0, backgroundImage:`radial-gradient(circle, ${accent}15 1px, transparent 1px)`, backgroundSize:'32px 28px', pointerEvents:'none', zIndex:1, opacity:0.6 }} />
        {/* Purple glow right */}
        <div style={{ position:'absolute', inset:0, background:'radial-gradient(ellipse at 105% 50%, rgba(124,77,255,0.15) 0%, transparent 55%)', pointerEvents:'none', zIndex:2 }} />
        {/* Red glow center */}
        <div style={{ position:'absolute', inset:0, background:`radial-gradient(ellipse at 45% 40%, ${accent}1e 0%, transparent 55%)`, pointerEvents:'none', zIndex:2 }} />

        {/* Hex watermarks left */}
        <div style={{ position:'absolute', left:'-2%', top:'50%', transform:'translateY(-52%)', pointerEvents:'none', zIndex:2, opacity:0.04, filter:`drop-shadow(0 0 40px ${accent})` }}>
          <svg width="340" height="340" viewBox="0 0 340 340"><polygon points={hexPoints(340)} fill="none" stroke={accent} strokeWidth="1.5" /></svg>
        </div>
        <div style={{ position:'absolute', left:'5%', top:'50%', transform:'translateY(-50%)', pointerEvents:'none', zIndex:2, opacity:0.06, filter:`drop-shadow(0 0 20px ${accent})` }}>
          <svg width="200" height="200" viewBox="0 0 200 200"><polygon points={hexPoints(200)} fill={`${accent}12`} stroke={accent} strokeWidth="1" /></svg>
        </div>
        <div style={{ position:'absolute', right:'3%', top:'10%', pointerEvents:'none', zIndex:2, opacity:0.10 }}>
          <svg width="60" height="60" viewBox="0 0 60 60"><polygon points={hexPoints(60)} fill="none" stroke="rgba(124,77,255,0.8)" strokeWidth="1" /></svg>
        </div>

        {/* Scan line */}
        <div style={{ position:'absolute', left:0, right:0, height:'2px', background:`linear-gradient(90deg, transparent 0%, ${accent}77 30%, rgba(140,240,245,0.85) 50%, ${accent}77 70%, transparent 100%)`, zIndex:4, pointerEvents:'none', animation:'heroScan 6s ease-in-out infinite' }} />

        {/* Placeholder art left */}
        <div style={{ position:'absolute', left:'4%', top:'50%', transform:'translateY(-50%)', zIndex:4, pointerEvents:'none' }}>
          <div style={{ width:'240px', height:'200px', border:`1px dashed ${accent}25`, borderRadius:'3px', background:`repeating-linear-gradient(-45deg, transparent, transparent 8px, ${accent}04 8px, ${accent}04 9px)`, display:'flex', alignItems:'center', justifyContent:'center', position:'relative', overflow:'hidden' }}>
            <div style={{ position:'absolute', inset:0, background:`radial-gradient(ellipse at 50% 50%, ${accent}07 0%, transparent 70%)` }} />
            <span style={{ fontFamily:'var(--font-mono)', fontSize:'8px', color:`${accent}30`, letterSpacing:'0.1em', textAlign:'center', position:'relative', zIndex:1 }}>divisions-artwork<br />die quellensucher</span>
          </div>
        </div>

        {/* Roman numeral watermark right */}
        <div style={{ position:'absolute', right:'6%', top:'50%', transform:'translateY(-50%)', fontFamily:'var(--font-display)', fontSize:'260px', fontWeight:'300', letterSpacing:'-0.04em', color:`${accent}05`, lineHeight:1, userSelect:'none', pointerEvents:'none', whiteSpace:'nowrap', zIndex:3 }}>{division.nummer}</div>

        {/* Text — right aligned */}
        <div style={{ position:'absolute', bottom:0, left:0, right:0, padding:'32px 40px', background:`linear-gradient(to top, ${pal[0]}f0 0%, ${pal[0]}88 55%, transparent 100%)`, zIndex:5, textAlign:'right' }}>
          <div className="reveal-left" style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.32em', color:`${accent}77`, textTransform:'uppercase', marginBottom:'7px' }}>Division {division.nummer} · {division.subtitle}</div>
          <h1 className="reveal-left" style={{ fontFamily:'var(--font-display)', fontSize:'clamp(32px,4vw,54px)', fontWeight:'300', letterSpacing:'0.16em', color:'#f0eeff', textShadow:`0 0 50px ${accent}44, 0 0 100px ${accent}1e`, lineHeight:1.1 }}>{division.name}</h1>
          <div className="reveal-left" style={{ display:'flex', alignItems:'center', gap:'8px', marginTop:'12px', justifyContent:'flex-end' }}>
            <div style={{ width:'24px', height:'1px', background:`linear-gradient(270deg, ${accent}44, transparent)` }} />
            <svg width="8" height="8" viewBox="0 0 8 8"><polygon points={hexPoints(8)} fill={`${accent}55`} stroke={accent} strokeWidth="0.8" /></svg>
            <div style={{ width:'48px', height:'1px', background:`linear-gradient(270deg, ${accent}99, transparent)`, animation:'pulse-glow 3s infinite' }} />
          </div>
        </div>
      </div>
      <div ref={heroRef} style={{ height:0 }} />

      {/* Content */}
      <div style={{ padding:'48px 40px 80px', maxWidth:'760px', position:'relative' }}>

        {/* Watermarks behind content */}
        <div style={{ position:'absolute', right:'-60px', top:'40px', pointerEvents:'none', zIndex:0, opacity:0.02, filter:`drop-shadow(0 0 30px ${accent})` }}>
          <svg width="300" height="300" viewBox="0 0 300 300"><polygon points={hexPoints(300)} fill="none" stroke={accent} strokeWidth="1" /></svg>
        </div>
        <div style={{ position:'absolute', left:'-40px', bottom:'120px', pointerEvents:'none', zIndex:0, opacity:0.025 }}>
          <svg width="180" height="180" viewBox="0 0 180 180"><polygon points={hexPoints(180)} fill="none" stroke="rgba(124,77,255,0.9)" strokeWidth="1" /></svg>
        </div>

        {/* Beschreibung */}
        <section id="beschreibung" style={{ marginBottom:'52px', scrollMarginTop:`${NAV_H+16}px`, position:'relative', zIndex:1 }}>
          <SectionHeader label="Beschreibung" />
          <p className="reveal-up" style={{ fontFamily:'var(--font-body)', fontWeight:'300', fontSize:'14px', lineHeight:1.9, color:'rgba(240,238,255,0.78)', letterSpacing:'0.02em', textWrap:'pretty', borderLeft:`1px solid ${accent}22`, paddingLeft:'16px' }}>
            {division.beschreibung}
          </p>
        </section>

        {/* Auftragseindruck */}
        <section id="auftraege" style={{ marginBottom:'52px', scrollMarginTop:`${NAV_H+16}px`, position:'relative', zIndex:1 }}>
          <SectionHeader label="Auftragseindruck" />
          <ul style={{ display:'flex', flexDirection:'column', gap:'10px', listStyle:'none', padding:0, margin:0 }}>
            {division.auftraege.map((auftrag, i) => (
              <li key={i} className="reveal-up" style={{ display:'flex', gap:'14px', alignItems:'flex-start', padding:'14px 18px', border:`1px solid ${accent}18`, borderRadius:'3px', background:`linear-gradient(135deg, ${accent}06 0%, transparent 100%)`, borderLeft:`2px solid ${accent}55`, position:'relative', overflow:'hidden' }}>
                <div style={{ position:'absolute', right:'-8px', bottom:'-8px', opacity:0.06, pointerEvents:'none' }}>
                  <svg width="56" height="56" viewBox="0 0 56 56"><polygon points={hexPoints(56)} fill="none" stroke={accent} strokeWidth="1" /></svg>
                </div>
                <svg width="8" height="8" viewBox="0 0 8 8" style={{ flexShrink:0, marginTop:'5px' }}>
                  <polygon points={hexPoints(8)} fill={`${accent}44`} stroke={accent} strokeWidth="0.8" />
                </svg>
                <span style={{ fontFamily:'var(--font-body)', fontWeight:'300', fontSize:'13px', lineHeight:1.8, color:'rgba(200,245,250,0.72)', letterSpacing:'0.02em', textWrap:'pretty', position:'relative', zIndex:1 }}>{auftrag}</span>
              </li>
            ))}
          </ul>
        </section>

        {/* Rangsystem */}
        <section id="rangsystem" style={{ scrollMarginTop:`${NAV_H+16}px`, position:'relative', zIndex:1 }}>
          <SectionHeader label="Rangsystem" />
          <div style={{ display:'flex', flexDirection:'column', gap:'2px' }}>
            {division.raenge.map((r) => {
              const isTop = r.rang <= 3;
              const barW = `${100 - (r.rang - 1) * 8}%`;
              const dimAlpha = 0.35 + (10 - r.rang) * 0.065;
              return (
                <div key={r.rang} className="reveal-up" style={{ display:'flex', alignItems:'stretch', position:'relative', borderRadius:'3px', overflow:'hidden', background: isTop ? `linear-gradient(90deg, ${accent}10 0%, transparent 100%)` : 'transparent', border:`1px solid ${isTop ? accent+'28' : accent+'10'}` }}>
                  <div style={{ flexShrink:0, width:'48px', display:'flex', alignItems:'center', justifyContent:'center', borderRight:`1px solid ${accent}${isTop?'30':'14'}`, padding:'14px 0', background: isTop ? `${accent}0e` : 'transparent' }}>
                    <svg width="24" height="24" viewBox="0 0 24 24" style={{ filter: isTop ? `drop-shadow(0 0 4px ${accent}88)` : 'none' }}>
                      <polygon points={hexPoints(24)} fill={isTop ? `${accent}22` : 'transparent'} stroke={isTop ? `${accent}99` : `${accent}33`} strokeWidth="1" />
                      <text x="12" y="16" textAnchor="middle" fontFamily="var(--font-mono)" fontSize="8" fill={isTop ? `${accent}ee` : `${accent}66`}>{r.rang}</text>
                    </svg>
                  </div>
                  <div style={{ flex:1, padding:'12px 18px', position:'relative' }}>
                    <div style={{ position:'absolute', left:0, top:0, bottom:0, width:barW, background:`linear-gradient(90deg, ${accent}${isTop?'10':'07'}, transparent)`, pointerEvents:'none' }} />
                    <div style={{ position:'relative', zIndex:1, display:'flex', alignItems:'baseline', gap:'12px', flexWrap:'wrap' }}>
                      <span style={{ fontFamily:'var(--font-display)', fontSize:'13px', fontWeight:'400', letterSpacing:'0.14em', color:`rgba(240,238,255,${dimAlpha+0.1})`, textTransform:'uppercase', flexShrink:0 }}>{r.titel}</span>
                      <span style={{ fontFamily:'var(--font-body)', fontWeight:'300', fontSize:'12px', lineHeight:1.7, color:`rgba(195,240,245,${dimAlpha})`, letterSpacing:'0.01em' }}>{r.beschreibung}</span>
                    </div>
                  </div>
                  {isTop && <div style={{ position:'absolute', left:0, top:0, bottom:0, width:'2px', background:`linear-gradient(180deg, ${accent}99, ${accent}33)` }} />}
                </div>
              );
            })}
          </div>
        </section>

      </div>
    </div>
  );
}

// ── APP ──────────────────────────────────────────────────
function App() {
  const [mouse, setMouse] = useState({ x:0.5, y:0.5 });
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [headerBottom, setHeaderBottom] = useState(0);
  const heroRef = useRef(null);

  const handleMouseMove = useCallback(e => { setMouse({ x: e.clientX/window.innerWidth, y: e.clientY/window.innerHeight }); }, []);

  useEffect(() => {
    const measure = () => {
      if (heroRef.current) {
        const rect = heroRef.current.getBoundingClientRect();
        setHeaderBottom(rect.bottom + window.scrollY);
      }
    };
    measure();
    window.addEventListener('resize', measure, { passive:true });
    return () => window.removeEventListener('resize', measure);
  }, []);

  useScrollReveal();

  return (
    <div onMouseMove={handleMouseMove} style={{ position:'relative', minHeight:'100vh' }}>
      {tweaks.showParticles && <ParticleField mouseX={mouse.x} mouseY={mouse.y} accentR={ACCENT_R} accentG={ACCENT_G} accentB={ACCENT_B} clipTop={232} />}
      <FloatingHexField mouseX={mouse.x} mouseY={mouse.y} accent={ACCENT} />

      {/* HEADER */}
      <PageHeader height={180} showHex />

      {/* NAV */}
      <SiteNav rightLabel="DIVISIONS-ARCHIV v1.0" />

      {/* BODY */}
      <div style={{ display:'flex', alignItems:'flex-start', position:'relative', zIndex:5, minHeight:'calc(100vh - var(--nav-h))', paddingLeft:'var(--sidebar-w)' }}>
        <TOCSidebar navHeight={NAV_H} headerBottom={headerBottom} />
        <div style={{ flex:1, minWidth:0 }}>
          <DivisionPage division={DIVISION} heroRef={heroRef} />
        </div>
      </div>

      {/* FOOTER */}
      <div style={{ position:'relative', zIndex:10, padding:'10px 32px', borderTop:`1px solid ${ACCENT}0a`, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
        <div style={{ fontFamily:'var(--font-mono)', fontSize:'7px', color:`${ACCENT}22`, letterSpacing:'0.2em' }}>◈ ARCHIV-STATUS: NOMINAL ◈ EPOCHE: UNBEKANNT</div>
        <div style={{ fontFamily:'var(--font-mono)', fontSize:'7px', color:`${ACCENT}22`, letterSpacing:'0.2em' }}>MERURIA // DIE VERWOBENEN REICHE</div>
      </div>

      <TweaksPanel>
        <TweakSection label="Darstellung" />
        <TweakToggle id="showParticles" label="Partikel" />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>


</body></html>
