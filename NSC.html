<!DOCTYPE html>
<html lang="de"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meruria — NSC</title>
<link rel="stylesheet" href="assets/styles/global/fonts.css">
<link rel="stylesheet" href="assets/styles/global/base.css">
<script src="assets/scripts/vendor/react.development.js"></script>
<script src="assets/scripts/vendor/react-dom.development.js"></script>
<script src="assets/scripts/vendor/babel-standalone.js"></script>
<script src="assets/components/nav.jsx" type="text/babel"></script>
<script src="assets/scripts/vendor/supabase.min.js"></script>
<script src="assets/scripts/supabase-client.js"></script>
<script src="assets/components/site-gate.jsx" type="text/babel"></script>
</head>
<body>
<div id="root"></div>

<!-- ═══════════════════════════════════════════
     SCRIPT 1 — Steckbrief-Hilfsfunktionen
     ═══════════════════════════════════════════ -->
<script type="text/babel">
const { useState, useRef } = React;
function mod(v)        { return Math.floor((v-10)/2); }
function fmtMod(n)     { return (n>=0?"+":"")+n; }
function attrKey(a)    { return {Stä:"str",Ges:"dex",Kon:"con",Int:"int",Wei:"wis",Cha:"cha"}[a]||"str"; }
function skillBonus(s,stats,pb) { return mod(stats[attrKey(s.attr)])+s.prof*pb; }
function SecTitle({ label }) {
  return (
    <div style={{marginBottom:10}}>
      <span style={{fontFamily:"var(--font-mono)",fontSize:8,letterSpacing:".28em",color:"rgba(124,77,255,0.5)",textTransform:"uppercase"}}>{label}</span>
      <div style={{width:24,height:1,background:"linear-gradient(90deg,rgba(124,77,255,0.65),transparent)",marginTop:4}} />
    </div>
  );
}
function Card({children,style}) {
  return <div style={{background:"rgba(7,4,18,0.92)",border:"1px solid rgba(124,77,255,0.2)",borderRadius:4,padding:"13px 14px",position:"relative",...style}}>{children}</div>;
}
function Corners({op=0.4,sz=14}) {
  const b=`1.5px solid rgba(124,77,255,${op})`;
  return (<>
    <div style={{position:"absolute",top:0,left:0,  width:sz,height:sz,borderTop:b,borderLeft:b,  pointerEvents:"none"}}/>
    <div style={{position:"absolute",top:0,right:0, width:sz,height:sz,borderTop:b,borderRight:b, pointerEvents:"none"}}/>
    <div style={{position:"absolute",bottom:0,left:0,  width:sz,height:sz,borderBottom:b,borderLeft:b,  pointerEvents:"none"}}/>
    <div style={{position:"absolute",bottom:0,right:0, width:sz,height:sz,borderBottom:b,borderRight:b, pointerEvents:"none"}}/>
  </>);
}
function IRow({label,value}) {
  return (
    <div style={{display:"flex",alignItems:"baseline",gap:6,padding:"3.5px 0",borderBottom:"1px solid rgba(124,77,255,0.06)"}}>
      <span style={{fontFamily:"var(--font-mono)",fontSize:7.5,letterSpacing:".12em",color:"rgba(124,77,255,0.4)",textTransform:"uppercase",flex:"0 0 80px"}}>{label}</span>
      <span style={{fontFamily:"var(--font-body)",fontSize:11.5,fontWeight:300,color:"var(--silver)",flex:1}}>{value}</span>
    </div>
  );
}
function ImageSlot({ height=72, hue=270 }) {
  return <div style={{width:"100%",height,borderRadius:3,background:`hsla(${hue},40%,18%,0.5)`,border:"1px solid rgba(124,77,255,0.15)"}} />;
}
Object.assign(window, { mod, fmtMod, attrKey, skillBonus, SecTitle, Card, Corners, IRow, ImageSlot });
</script>

<!-- ═══════════════════════════════════════════
     SCRIPT 2 — Externe Steckbrief-Komponenten
     ═══════════════════════════════════════════ -->
<script src="assets/components/steckbrief-components.jsx" type="text/babel"></script>

<!-- ═══════════════════════════════════════════
     SCRIPT 3 — Haupt-App
     ═══════════════════════════════════════════ -->
<script type="text/babel">
const { useState: uSt, useEffect: uEx, useRef: uRx, useMemo: uM3 } = React;
const { SiteNav, SiteGate } = window;
const { buildChar, CombatCompact, AttributeGrid, SkillPills, PersonalitySection,
        DivisionRank, DeityCard, CompanionCard, KontakteTablet, FbCard } = window;
const { SecTitle, Card, Corners, IRow } = window;

const INPUT_STYLE = {
  width:"100%", boxSizing:"border-box",
  background:"rgba(7,4,18,0.85)", border:"1px solid rgba(124,77,255,0.25)",
  borderRadius:3, padding:"7px 10px",
  fontFamily:"var(--font-body)", fontSize:12, fontWeight:300,
  color:"var(--white)", outline:"none",
};

/* ── Charakter aus DB-Zeile aufbauen ─────────── */
function charFromRow(row) {
  const d = row.char_data;
  if (d && d.hp !== undefined) return { ...d };
  return buildChar(d || row);
}

/* ── Neu-NSC-Modal ────────────────────────────── */
function NewNscModal({ onClose, onCreated }) {
  const [name, setName]         = uSt("");
  const [race, setRace]         = uSt("");
  const [role, setRole]         = uSt("");
  const [division, setDivision] = uSt("");
  const [notes, setNotes]       = uSt("");
  const [saving, setSaving]     = uSt(false);
  const [err, setErr]           = uSt(null);
  const ref = uRx(null);

  uEx(() => {
    const onKey = e => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, []);

  async function handleSave() {
    if (!name.trim()) { setErr("Name ist erforderlich."); return; }
    setSaving(true); setErr(null);
    const char_data = {
      name: name.trim(),
      race: race.trim() || undefined,
      class: role.trim() || undefined,
      division: division.trim() || undefined,
      story: notes.trim() || undefined,
    };
    const { data, error } = await window._sb
      .from("characters")
      .insert({ name: name.trim(), type: "nsc", visible: false, char_data })
      .select()
      .single();
    setSaving(false);
    if (error) { setErr(error.message); return; }
    onCreated(data);
    onClose();
  }

  const labelStyle = { fontFamily:"var(--font-mono)", fontSize:7.5, letterSpacing:".15em",
    color:"rgba(124,77,255,0.5)", textTransform:"uppercase", display:"block", marginBottom:5 };

  return ReactDOM.createPortal(
    <div ref={ref}
      onClick={e => { if (e.target === ref.current) onClose(); }}
      style={{ position:"fixed", inset:0, zIndex:600,
        background:"rgba(5,4,15,0.88)", backdropFilter:"blur(8px)",
        display:"flex", alignItems:"center", justifyContent:"center", padding:24 }}>
      <div style={{ width:"100%", maxWidth:480, background:"rgba(8,5,22,0.98)",
        border:"1px solid rgba(124,77,255,0.3)", borderRadius:6, padding:28, position:"relative" }}>
        <Corners />
        <div style={{ fontFamily:"var(--font-display)", fontSize:14, letterSpacing:".22em",
          color:"#f0eeff", textTransform:"uppercase", marginBottom:24 }}>
          Neuer NSC
        </div>
        {err && <div style={{ fontFamily:"var(--font-body)", fontSize:11.5, color:"#f44",
          marginBottom:14, padding:"6px 10px", background:"rgba(255,60,60,0.08)",
          border:"1px solid rgba(255,60,60,0.2)", borderRadius:3 }}>{err}</div>}
        <div style={{ display:"grid", gap:14 }}>
          <div>
            <label style={labelStyle}>Name *</label>
            <input style={INPUT_STYLE} value={name} onChange={e => setName(e.target.value)}
              onKeyDown={e => { if (e.key === "Enter") handleSave(); }} autoFocus />
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
            <div>
              <label style={labelStyle}>Rasse</label>
              <input style={INPUT_STYLE} value={race} onChange={e => setRace(e.target.value)} placeholder="z.B. Mensch" />
            </div>
            <div>
              <label style={labelStyle}>Klasse / Rolle</label>
              <input style={INPUT_STYLE} value={role} onChange={e => setRole(e.target.value)} placeholder="z.B. Händler" />
            </div>
          </div>
          <div>
            <label style={labelStyle}>Division / Fraktion</label>
            <input style={INPUT_STYLE} value={division} onChange={e => setDivision(e.target.value)} placeholder="z.B. Die Kuratoren" />
          </div>
          <div>
            <label style={labelStyle}>Notizen</label>
            <textarea style={{ ...INPUT_STYLE, resize:"vertical", minHeight:72 }}
              value={notes} onChange={e => setNotes(e.target.value)}
              placeholder="Hintergrund, Beschreibung, Funktion…" />
          </div>
        </div>
        <div style={{ display:"flex", justifyContent:"flex-end", gap:10, marginTop:22 }}>
          <button onClick={onClose}
            style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:".15em",
              background:"transparent", border:"1px solid rgba(124,77,255,0.2)",
              borderRadius:3, padding:"7px 16px", cursor:"pointer",
              color:"rgba(124,77,255,0.5)", textTransform:"uppercase" }}>
            Abbrechen
          </button>
          <button onClick={handleSave} disabled={saving}
            style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:".15em",
              background:"rgba(124,77,255,0.15)", border:"1px solid rgba(124,77,255,0.4)",
              borderRadius:3, padding:"7px 20px", cursor:saving?"wait":"pointer",
              color:"rgba(200,190,240,0.9)", textTransform:"uppercase",
              opacity: saving ? 0.6 : 1 }}>
            {saving ? "Speichern…" : "Erstellen"}
          </button>
        </div>
      </div>
    </div>,
    document.body
  );
}

/* ── NSC-Karte ────────────────────────────────── */
function NscCard({ row, isDM, onToggle, onDelete, onOpen }) {
  const [hov, setHov] = uSt(false);
  const char = charFromRow(row);
  const hidden = !row.visible;
  const dimmed = isDM && hidden;

  return (
    <div style={{ position:"relative", borderRadius:5, overflow:"hidden",
      border:`1px solid rgba(124,77,255,${hov ? 0.55 : dimmed ? 0.12 : 0.25})`,
      background: dimmed ? "rgba(5,4,12,0.85)" : "rgba(8,5,22,0.92)",
      transition:"all .22s", opacity: dimmed ? 0.65 : 1 }}
      onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}>

      <Corners op={hov ? 0.6 : dimmed ? 0.15 : 0.35} sz={11} />

      {/* DM-Aktionen */}
      {isDM && (
        <div style={{ position:"absolute", top:8, right:8, zIndex:10, display:"flex", gap:5 }}>
          <button onClick={e => { e.stopPropagation(); onToggle(row.id, row.visible); }}
            title={hidden ? "Für Spieler sichtbar machen" : "Verbergen"}
            style={{ background:"transparent", border:`1px solid rgba(124,77,255,${hidden?0.2:0.4})`,
              borderRadius:3, padding:"3px 7px", cursor:"pointer",
              fontFamily:"var(--font-mono)", fontSize:10,
              color: hidden ? "rgba(124,77,255,0.35)" : "rgba(124,77,255,0.75)",
              transition:"all .18s" }}
            onMouseEnter={e => { e.currentTarget.style.borderColor="rgba(124,77,255,0.7)"; e.currentTarget.style.color="rgba(160,140,255,0.9)"; }}
            onMouseLeave={e => { e.currentTarget.style.borderColor=hidden?"rgba(124,77,255,0.2)":"rgba(124,77,255,0.4)"; e.currentTarget.style.color=hidden?"rgba(124,77,255,0.35)":"rgba(124,77,255,0.75)"; }}>
            {hidden ? "◯" : "◉"}
          </button>
          <button onClick={e => { e.stopPropagation(); onDelete(row); }}
            title="NSC löschen"
            style={{ background:"transparent", border:"1px solid rgba(255,80,80,0.2)",
              borderRadius:3, padding:"3px 7px", cursor:"pointer",
              fontFamily:"var(--font-mono)", fontSize:10, color:"rgba(255,80,80,0.35)",
              transition:"all .18s" }}
            onMouseEnter={e => { e.currentTarget.style.borderColor="rgba(255,80,80,0.6)"; e.currentTarget.style.color="rgba(255,120,120,0.8)"; }}
            onMouseLeave={e => { e.currentTarget.style.borderColor="rgba(255,80,80,0.2)"; e.currentTarget.style.color="rgba(255,80,80,0.35)"; }}>
            ✕
          </button>
        </div>
      )}

      {/* Verborgen-Badge */}
      {dimmed && (
        <div style={{ position:"absolute", top:8, left:8,
          fontFamily:"var(--font-mono)", fontSize:6.5, letterSpacing:".2em",
          color:"rgba(124,77,255,0.4)", textTransform:"uppercase",
          background:"rgba(124,77,255,0.08)", border:"1px solid rgba(124,77,255,0.18)",
          padding:"2px 6px", borderRadius:2, zIndex:5 }}>
          Verborgen
        </div>
      )}

      {/* Klickbarer Bereich */}
      <button onClick={() => onOpen(row)}
        style={{ display:"block", width:"100%", background:"transparent",
          border:"none", cursor:"pointer", textAlign:"left",
          padding: isDM ? "22px 16px 16px" : "16px" }}>

        <div style={{ marginBottom:8 }}>
          <div style={{ fontFamily:"var(--font-display)", fontSize:14, letterSpacing:".18em",
            color: hov ? "#f0eeff" : "rgba(220,210,250,0.9)",
            textTransform:"uppercase", lineHeight:1.2, marginBottom:4,
            transition:"color .2s" }}>
            {char.name || row.name}
          </div>
          <div style={{ fontFamily:"var(--font-mono)", fontSize:7, letterSpacing:".15em",
            color:"rgba(124,77,255,0.4)", textTransform:"uppercase" }}>
            NSC
          </div>
        </div>

        {/* Tags */}
        <div style={{ display:"flex", gap:5, flexWrap:"wrap" }}>
          {[char.race, char.class, char.division].filter(v => v && v !== "—").map((t,i) => (
            <span key={i} style={{ fontFamily:"var(--font-mono)", fontSize:7.5, padding:"2px 8px",
              background:"rgba(124,77,255,0.1)", border:"1px solid rgba(124,77,255,0.25)",
              borderRadius:2, color:"rgba(200,190,240,0.7)", letterSpacing:".06em" }}>{t}</span>
          ))}
        </div>

        {/* Kurzbeschreibung */}
        {char.story && (
          <p style={{ fontFamily:"var(--font-body)", fontSize:11, fontWeight:300,
            color:"rgba(200,190,240,0.45)", lineHeight:1.6, margin:"10px 0 0",
            display:"-webkit-box", WebkitLineClamp:2, WebkitBoxOrient:"vertical",
            overflow:"hidden" }}>
            {char.story}
          </p>
        )}
      </button>
    </div>
  );
}

/* ── Read-only Steckbrief-Overlay ─────────────── */
function SteckbriefOverlay({ row, onClose }) {
  const char = charFromRow(row);
  const overlayRef = uRx(null);

  uEx(() => {
    const onKey = e => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, []);

  return (
    <div ref={overlayRef}
      onClick={e => { if (e.target === overlayRef.current) onClose(); }}
      style={{ position:"fixed", inset:0, zIndex:500,
        background:"rgba(5,4,15,0.88)", backdropFilter:"blur(8px)",
        overflowY:"auto", display:"flex", justifyContent:"center", padding:"24px 16px 60px" }}>

      <div style={{ width:"100%", maxWidth:860, position:"relative" }}>

        <button onClick={onClose}
          style={{ position:"fixed", top:20, right:28, zIndex:600,
            fontFamily:"var(--font-mono)", fontSize:18, lineHeight:1,
            background:"rgba(8,5,22,0.95)", border:"1px solid rgba(124,77,255,0.3)",
            borderRadius:4, padding:"6px 13px", cursor:"pointer",
            color:"rgba(160,140,255,0.6)", transition:"all .18s" }}
          onMouseEnter={e => { e.currentTarget.style.color="rgba(200,190,240,0.9)"; e.currentTarget.style.borderColor="rgba(124,77,255,0.6)"; }}
          onMouseLeave={e => { e.currentTarget.style.color="rgba(160,140,255,0.6)"; e.currentTarget.style.borderColor="rgba(124,77,255,0.3)"; }}>
          ×
        </button>

        <div style={{ marginBottom:28, paddingTop:8 }}>
          <div style={{ fontFamily:"var(--font-mono)", fontSize:8, letterSpacing:".32em",
            color:"rgba(124,77,255,0.5)", textTransform:"uppercase", marginBottom:8 }}>
            Meruria · NSC
          </div>
          <div style={{ fontFamily:"var(--font-display)", fontSize:"clamp(22px,4vw,34px)",
            fontWeight:300, letterSpacing:".22em", color:"#f0eeff",
            textTransform:"uppercase", textShadow:"0 0 40px rgba(124,77,255,0.3)",
            marginBottom:6 }}>
            {char.name}
          </div>
          <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
            {[char.race, char.class, char.background, char.division].filter(v => v && v !== "—").map((t,i) => (
              <span key={i} style={{ fontFamily:"var(--font-mono)", fontSize:8, padding:"2px 10px",
                background:"rgba(124,77,255,0.12)", border:"1px solid rgba(124,77,255,0.3)",
                borderRadius:2, color:"rgba(200,190,240,0.8)", letterSpacing:".08em" }}>{t}</span>
            ))}
          </div>
        </div>

        {/* Identität */}
        <Card style={{ marginBottom:16 }}>
          <SecTitle label="Identität" />
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"0 24px" }}>
            <IRow label="Rang"       value={char.rank || "—"} />
            <IRow label="Stufe"      value={char.level || "—"} />
            <IRow label="Gesinnung"  value={char.alignment || "—"} />
            <IRow label="Gottheit"   value={char.deity || "—"} />
            <IRow label="Geschlecht" value={char.gender || "—"} />
            <IRow label="Alter"      value={char.age || "—"} />
          </div>
        </Card>

        {/* Kampf + Division */}
        {(char.hp || char.ac) && (
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16, marginBottom:16 }}>
            <CombatCompact char={char} />
            <DivisionRank  char={char} />
          </div>
        )}

        {/* Attribute + Skills (nur wenn vorhanden) */}
        {char.stats && Object.values(char.stats).some(v => v && v !== 10) && (
          <>
            <AttributeGrid char={char} />
            <SkillPills    char={char} />
          </>
        )}

        {/* Beschreibung / Geschichte */}
        {char.story && (
          <Card style={{ marginBottom:16 }}>
            <SecTitle label="Beschreibung" />
            <p style={{ fontFamily:"var(--font-body)", fontSize:12, fontWeight:300,
              color:"var(--silver)", lineHeight:1.82, margin:0 }}>{char.story}</p>
          </Card>
        )}

        <PersonalitySection char={char} />
        <DeityCard char={char} />

        {char.companions && char.companions.length > 0 && (
          <Card style={{ marginBottom:16 }}>
            <SecTitle label="Begleiter" />
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))", gap:10 }}>
              {char.companions.map((c,i) => <CompanionCard key={i} comp={c} />)}
            </div>
          </Card>
        )}

        {char.contacts && char.contacts.length > 0 && (
          <Card style={{ marginBottom:16 }}>
            <KontakteTablet char={char} />
          </Card>
        )}
      </div>
    </div>
  );
}

/* ── Lösch-Bestätigung ────────────────────────── */
function DeleteConfirm({ row, onConfirm, onCancel }) {
  const char = charFromRow(row);
  return ReactDOM.createPortal(
    <div style={{ position:"fixed", inset:0, zIndex:700,
      background:"rgba(5,4,15,0.88)", backdropFilter:"blur(8px)",
      display:"flex", alignItems:"center", justifyContent:"center", padding:24 }}>
      <div style={{ width:"100%", maxWidth:380, background:"rgba(8,5,22,0.98)",
        border:"1px solid rgba(255,80,80,0.3)", borderRadius:6, padding:28, position:"relative" }}>
        <div style={{ fontFamily:"var(--font-display)", fontSize:13, letterSpacing:".18em",
          color:"#f0eeff", textTransform:"uppercase", marginBottom:12 }}>
          NSC löschen
        </div>
        <p style={{ fontFamily:"var(--font-body)", fontSize:12, fontWeight:300,
          color:"var(--silver)", lineHeight:1.7, margin:"0 0 20px" }}>
          „{char.name || row.name}" wirklich löschen? Diese Aktion kann nicht rückgängig gemacht werden.
        </p>
        <div style={{ display:"flex", justifyContent:"flex-end", gap:10 }}>
          <button onClick={onCancel}
            style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:".15em",
              background:"transparent", border:"1px solid rgba(124,77,255,0.2)",
              borderRadius:3, padding:"7px 16px", cursor:"pointer",
              color:"rgba(124,77,255,0.5)", textTransform:"uppercase" }}>
            Abbrechen
          </button>
          <button onClick={onConfirm}
            style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:".15em",
              background:"rgba(255,60,60,0.12)", border:"1px solid rgba(255,80,80,0.4)",
              borderRadius:3, padding:"7px 20px", cursor:"pointer",
              color:"rgba(255,140,140,0.9)", textTransform:"uppercase" }}>
            Löschen
          </button>
        </div>
      </div>
    </div>,
    document.body
  );
}

/* ── App ──────────────────────────────────────── */
function App() {
  const isDM = window.SITE_USER?.role === "dm";
  const [nscs, setNscs]         = uSt([]);
  const [loading, setLoading]   = uSt(true);
  const [search, setSearch]     = uSt("");
  const [openRow, setOpenRow]   = uSt(null);
  const [showNew, setShowNew]   = uSt(false);
  const [deleteRow, setDeleteRow] = uSt(null);

  uEx(() => { load(); }, []);

  async function load() {
    setLoading(true);
    const q = window._sb.from("characters").select("*").eq("type", "nsc").order("name");
    const { data } = await q;
    setNscs(data || []);
    setLoading(false);
  }

  async function toggleVisible(id, current) {
    await window._sb.from("characters").update({ visible: !current }).eq("id", id);
    setNscs(prev => prev.map(c => c.id === id ? { ...c, visible: !current } : c));
  }

  async function confirmDelete() {
    if (!deleteRow) return;
    await window._sb.from("characters").delete().eq("id", deleteRow.id);
    setNscs(prev => prev.filter(c => c.id !== deleteRow.id));
    setDeleteRow(null);
  }

  const filtered = uM3(() => {
    const q = search.trim().toLowerCase();
    if (!q) return nscs;
    return nscs.filter(row => {
      const char = charFromRow(row);
      const name = (char.name || row.name || "").toLowerCase();
      const tags = [char.race, char.class, char.division].filter(Boolean).join(" ").toLowerCase();
      return name.includes(q) || tags.includes(q);
    });
  }, [nscs, search]);

  if (openRow) {
    return <SteckbriefOverlay row={openRow} onClose={() => setOpenRow(null)} />;
  }

  return (
    <div style={{ minHeight:"100vh", paddingTop:"var(--nav-h)" }}>
      <SiteNav />

      {showNew && isDM && (
        <NewNscModal
          onClose={() => setShowNew(false)}
          onCreated={row => setNscs(prev => [...prev, row].sort((a,b) => (a.name||"").localeCompare(b.name||"", "de")))}
        />
      )}

      {deleteRow && isDM && (
        <DeleteConfirm
          row={deleteRow}
          onConfirm={confirmDelete}
          onCancel={() => setDeleteRow(null)}
        />
      )}

      <div style={{ maxWidth:1100, margin:"0 auto", padding:"48px 28px 80px" }}>

        {/* Seitenüberschrift */}
        <div style={{ marginBottom:40 }}>
          <div style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:".35em",
            color:"rgba(124,77,255,0.5)", textTransform:"uppercase", marginBottom:10 }}>
            Meruria · Kampagne
          </div>
          <div style={{ display:"flex", alignItems:"flex-end", justifyContent:"space-between", flexWrap:"wrap", gap:16 }}>
            <div>
              <h1 style={{ fontFamily:"var(--font-display)", fontSize:"clamp(20px,3.5vw,32px)",
                fontWeight:300, letterSpacing:".22em", color:"#f0eeff",
                textTransform:"uppercase", margin:0,
                textShadow:"0 0 48px rgba(124,77,255,0.25)" }}>
                NSC
              </h1>
              <div style={{ width:48, height:1, background:"rgba(124,77,255,0.55)", marginTop:14 }} />
            </div>
            {isDM && (
              <button onClick={() => setShowNew(true)}
                style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:".18em",
                  background:"rgba(124,77,255,0.12)", border:"1px solid rgba(124,77,255,0.35)",
                  borderRadius:3, padding:"8px 18px", cursor:"pointer",
                  color:"rgba(200,190,240,0.85)", textTransform:"uppercase",
                  transition:"all .18s" }}
                onMouseEnter={e => { e.currentTarget.style.background="rgba(124,77,255,0.2)"; e.currentTarget.style.borderColor="rgba(124,77,255,0.6)"; }}
                onMouseLeave={e => { e.currentTarget.style.background="rgba(124,77,255,0.12)"; e.currentTarget.style.borderColor="rgba(124,77,255,0.35)"; }}>
                + Neuer NSC
              </button>
            )}
          </div>
        </div>

        {/* Suchzeile */}
        {nscs.length > 0 && (
          <div style={{ marginBottom:32, maxWidth:360 }}>
            <input
              style={{ ...INPUT_STYLE, padding:"8px 12px" }}
              placeholder="Suchen…"
              value={search}
              onChange={e => setSearch(e.target.value)}
            />
          </div>
        )}

        {/* Ladeindikator */}
        {loading && (
          <div style={{ fontFamily:"var(--font-mono)", fontSize:9, letterSpacing:".3em",
            color:"rgba(124,77,255,0.35)", textTransform:"uppercase" }}>
            Lade NSC…
          </div>
        )}

        {/* Leer-Zustand */}
        {!loading && nscs.length === 0 && (
          <div style={{ fontFamily:"var(--font-body)", fontSize:13, fontWeight:300,
            color:"rgba(200,190,240,0.35)", lineHeight:1.8 }}>
            {isDM
              ? 'Noch keine NSC angelegt. Klicke auf "+ Neuer NSC" um einen zu erstellen.'
              : "Noch keine NSC sichtbar. Der Spielleiter schaltet sie frei."}
          </div>
        )}

        {/* Keine Suchtreffer */}
        {!loading && nscs.length > 0 && filtered.length === 0 && (
          <div style={{ fontFamily:"var(--font-body)", fontSize:13, fontWeight:300,
            color:"rgba(200,190,240,0.35)" }}>
            Keine NSC gefunden für „{search}".
          </div>
        )}

        {/* NSC-Grid */}
        {!loading && filtered.length > 0 && (
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))", gap:16 }}>
            {filtered.map(row => (
              <NscCard key={row.id} row={row} isDM={isDM}
                onToggle={toggleVisible}
                onDelete={row => setDeleteRow(row)}
                onOpen={row => setOpenRow(row)}
              />
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <SiteGate><App /></SiteGate>
);
</script>
</body></html>
