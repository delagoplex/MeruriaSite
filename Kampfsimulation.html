      <path d="M3 2l4 3-4 3" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

const RATINGS = [
  { key: 'crushing-win',  label: 'Haushoch gewonnen', cls: 'rat-cwin'  },
  { key: 'win',           label: 'Gewonnen',           cls: 'rat-win'   },
  { key: 'narrow-win',    label: 'Knapp gewonnen',     cls: 'rat-nwin'  },
  { key: 'draw',          label: 'Unentschieden',      cls: 'rat-draw'  },
  { key: 'narrow-loss',   label: 'Knapp verloren',     cls: 'rat-nloss' },
  { key: 'loss',          label: 'Verloren',           cls: 'rat-loss'  },
  { key: 'crushing-loss', label: 'Haushoch verloren',  cls: 'rat-closs' },
];
function rateRun(run) {
  if (run.winner === 'draw') return RATINGS.find(r => r.key === 'draw');
  const winners = run.winner === 1 ? run.survivors1 : run.survivors2;
  const alive   = winners.filter(c => !c.dead && c.currentHp > 0);
  const maxHpSum = winners.reduce((s, c) => s + c.maxHp, 0);
  const curHpSum = alive.reduce((s, c) => s + c.currentHp, 0);
  const pct = maxHpSum > 0 ? curHpSum / maxHpSum : 0;
  const won = run.winner === 1;
  if (pct > 0.6) return RATINGS.find(r => r.key === (won ? 'crushing-win'  : 'crushing-loss'));
  if (pct > 0.25) return RATINGS.find(r => r.key === (won ? 'win'           : 'loss'));
  return          RATINGS.find(r => r.key === (won ? 'narrow-win'    : 'narrow-loss'));
}

// ── Combat Results (multi-run) ────────────────────────────────────────────────
function CombatResults({ runs, group1Name, group2Name, onReset, onRerun, runCount, onRunCountChange }) {
  const [openLogs, setOpenLogs] = useState(new Set());

  const wins1   = runs.filter(r => r.winner === 1).length;
  const wins2   = runs.filter(r => r.winner === 2).length;
  const draws   = runs.length - wins1 - wins2;
  const avgRounds = (runs.reduce((s, r) => s + r.roundCount, 0) / runs.length).toFixed(1);

  function toggleLog(i) {
    setOpenLogs(s => { const n = new Set(s); n.has(i) ? n.delete(i) : n.add(i); return n; });
  }

  function aggSurvivors(key) {
    const names = runs[0][key].map(s => s.name);
    return names.map(name => {
      const entries = runs.map(r => r[key].find(s => s.name === name)).filter(Boolean);
      const alive    = entries.filter(e => !e.dead && e.currentHp > 0);
      const avgHp    = alive.length ? Math.round(alive.reduce((s, e) => s + e.currentHp, 0) / alive.length) : 0;
      const avgMaxHp = alive.length ? Math.round(alive.reduce((s, e) => s + e.maxHp, 0) / alive.length) : (entries[0]?.staticTp ?? 0);
      return { name, survived: alive.length, total: runs.length, avgHp, avgMaxHp };
    });
  }
  const agg1 = aggSurvivors('survivors1');
  const agg2 = aggSurvivors('survivors2');

  const runRatings = runs.map(rateRun);
  const ratingDist = RATINGS.map(r => ({ ...r, count: runRatings.filter(x => x.key === r.key).length })).filter(r => r.count > 0);

  const dominant = wins1 > wins2 ? 1 : wins2 > wins1 ? 2 : 'draw';
  const badgeText = dominant === 1 ? `${group1Name} gewinnt öfter` : dominant === 2 ? `${group2Name} gewinnt öfter` : 'Ausgeglichen';
  const badgeCls  = dominant === 1 ? 'sim-winner-1' : dominant === 2 ? 'sim-winner-2' : 'sim-winner-draw';

  return (
    <div className="sim-results">
      <div className="sim-results-header">
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <button className="sim-btn sim-btn-ghost" style={{ padding: '4px 12px', fontSize: '0.7rem' }} onClick={onReset}>← Zurück</button>
          <button className="sim-btn sim-btn-ghost" style={{ padding: '4px 12px', fontSize: '0.7rem' }} onClick={onRerun}>↺ Wiederholen</button>
          <input type="number" min={1} max={500} value={runCount}
            onChange={e => onRunCountChange(Math.max(1, Math.min(500, +e.target.value)))}
            className="sim-session-input" style={{ width: 44 }} title="Anzahl Durchläufe" />
        </div>
        <span className={`sim-winner-badge ${badgeCls}`}>{badgeText}</span>
      </div>

      {/* Win-rate bar */}
      <div className="sim-agg">
        <div className="sim-agg-bar">
          {wins1 > 0 && <div className="sim-agg-seg seg-1" style={{ flex: wins1 }}>{wins1}</div>}
          {draws > 0  && <div className="sim-agg-seg seg-draw" style={{ flex: draws }}>{draws}</div>}
          {wins2 > 0 && <div className="sim-agg-seg seg-2" style={{ flex: wins2 }}>{wins2}</div>}
        </div>
        <div className="sim-agg-labels">
          <span className="sim-agg-g1">{group1Name}</span>
          <span className="sim-agg-rounds">Ø {avgRounds} Runden</span>
          <span className="sim-agg-g2">{group2Name}</span>
        </div>
      </div>

      {/* Survivor aggregate */}
      <div className="sim-survivor-list">
        {[{ name: group1Name, agg: agg1 }, { name: group2Name, agg: agg2 }].map(({ name, agg }) => (
          <div key={name} className="sim-survivor-group">
            {agg.map((s, i) => (
              <div key={i} className="sim-survivor-row">
                <span className={s.survived === 0 ? 'sim-survivor-dead' : ''}>{s.name}</span>
                {s.survived === 0
                  ? <span style={{ color: 'rgba(255,60,60,0.5)', fontSize: '0.7rem' }}>besiegt</span>
                  : <span className="sim-survivor-hp">{s.survived}/{s.total} Durchläufen überlebt · Ø {s.avgHp}/{s.avgMaxHp} TP</span>
                }
              </div>
            ))}
          </div>
        ))}
      </div>

      {/* Rating distribution */}
      <div className="sim-rating-dist">
        {ratingDist.map(r => (
          <div key={r.key} className="sim-rating-row">
            <span className={`sim-rating-label ${r.cls}`}>{r.label}</span>
            <span className="sim-rating-bar-wrap">
              <span className={`sim-rating-bar ${r.cls}`} style={{ width: `${Math.round(r.count / runs.length * 100)}%` }} />
            </span>
            <span className="sim-rating-count">{r.count}×</span>
          </div>
        ))}
      </div>

      {/* Individual run logs */}
      <div className="sim-runs">
        {runs.map((r, i) => {
          const rating    = runRatings[i];
          const runOpen  = openLogs.has(`r${i}`);
          const totalEntries = r.rounds.reduce((s, rd) => s + rd.entries.length, 0);
          return (
            <div key={i} className="sim-run">
              <button className="sim-log-toggle" onClick={() => toggleLog(`r${i}`)}>
                <Chevron open={runOpen} />
                <span>Durchlauf {i + 1}</span>
                <span className={`sim-run-badge ${rating.cls}`}>{rating.label}</span>
                <span className="sim-run-meta">{r.roundCount} Runden · {totalEntries} Einträge</span>
              </button>
              {runOpen && (
                <div className="sim-run-rounds">
                  {r.rounds.map((rd, j) => {
                    const rdOpen = openLogs.has(`r${i}:${j}`);
                    return (
                      <div key={j} className="sim-round-row">
                        <button className="sim-round-header" onClick={() => toggleLog(`r${i}:${j}`)}>
                          <Chevron open={rdOpen} />
                          <span className="sim-round-label">{rd.label}</span>
                          {rd.hpSnapshot && (
                            <span className="sim-round-hp">
                              {[1, 2].map(team => [
                                team === 2 && <span key="sep" className="sim-hp-sep">|</span>,
                                ...rd.hpSnapshot.filter(c => c.team === team).map((c, k) => {
                                  const dead = c.dead || c.currentHp <= 0;
                                  const pct  = dead ? 0 : Math.min(100, Math.round(c.currentHp / c.maxHp * 100));
                                  const short = c.name.length > 10 ? c.name.slice(0, 9) + '…' : c.name;
                                  const barColor = dead ? 'transparent'
                                    : pct > 60 ? (team === 1 ? 'rgba(80,160,255,0.75)' : 'rgba(255,100,80,0.75)')
                                    : pct > 30 ? 'rgba(255,190,60,0.85)'
                                    : 'rgba(255,60,60,0.85)';
                                  return (
                                    <span key={k} className={`sim-hp-chip sim-hp-t${team}${dead ? ' sim-hp-dead' : ''}`}
                                      title={dead ? `${c.name} ☠` : `${c.name}: ${c.currentHp}/${c.maxHp} TP`}>
                                      <span className="sim-hp-name">{short}{dead ? ' ☠' : ''}</span>
                                      <span className="sim-hp-bar">
                                        <span className="sim-hp-bar-fill" style={{ width: `${pct}%`, background: barColor }} />
                                      </span>
                                      {rd.hits?.[c.uid] && (
                                        <span className="sim-hit-dots">
                                          {Array.from({ length: rd.hits[c.uid].h }, (_, di) => <span key={`h${di}`} className="sim-hit-dot sim-hit-h" />)}
                                          {Array.from({ length: rd.hits[c.uid].m }, (_, di) => <span key={`m${di}`} className="sim-hit-dot sim-hit-m" />)}
                                          {Array.from({ length: rd.hits[c.uid].heal || 0 }, (_, di) => <span key={`heal${di}`} className="sim-hit-dot sim-hit-heal">✚</span>)}
                                        </span>
                                      )}
                                    </span>
                                  );
                                })
                              ])}
                            </span>
                          )}
                        </button>
                        {rdOpen && (
                          <div className="sim-log sim-log-inner">
                            {rd.entries.map((entry, k) => <div key={k} className={entry.cls}>{entry.text}</div>)}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>

    </div>
  );
}

// ── Password Gate ─────────────────────────────────────────────────────────────
function SimPasswordGate({ onUnlock }) {
  const [value, setValue] = useState('');
  const [error, setError] = useState(false);
  const [shake, setShake] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(value));
    const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    if (hash === '5882a49f496cb2a3235c03b6b2c377760888e91281bf3c29cbf33fe1ef32a559') {
      localStorage.setItem('monster_auth', JSON.stringify({ ts: Date.now() }));
      onUnlock();
    } else {
      setError(true); setShake(true); setValue('');
      setTimeout(() => setShake(false), 400);
    }
  }

  return (
    <div style={{ position:'fixed', inset:0, background:'#05040f', display:'flex', alignItems:'center', justifyContent:'center', zIndex:9999 }}>
      <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:'28px', animation:'fadeInUp 0.4s ease' }}>
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:'14px' }}>
          <svg width="40" height="40" viewBox="0 0 40 40">
            <polygon points="20,2.6 35.6,11.3 35.6,28.7 20,37.4 4.4,28.7 4.4,11.3" fill="rgba(var(--accent-rgb),0.08)" stroke="rgba(var(--accent-rgb),0.35)" strokeWidth="1.2"/>
            <text x="20" y="25" textAnchor="middle" fontFamily="var(--font-mono)" fontSize="14" fill="rgba(var(--accent-rgb),0.8)">⚿</text>
          </svg>
          <div style={{ fontFamily:'var(--font-display)', fontSize:'11px', letterSpacing:'0.45em', color:'rgba(var(--text-rgb),0.45)', textTransform:'uppercase' }}>Meruria — Kampfsimulation</div>
        </div>
        <form onSubmit={handleSubmit} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:'12px' }}>
          <div style={{ position:'relative', animation: shake ? 'pulse-glow 0.4s ease' : 'none' }}>
            <input type="password" value={value}
              onChange={e => { setValue(e.target.value); setError(false); }}
              placeholder="Passwort" autoFocus
              style={{ fontFamily:'var(--font-mono)', fontSize:'13px', letterSpacing:'0.15em', padding:'10px 16px', width:'220px', background:'rgba(var(--accent-rgb),0.05)', border:`1px solid ${error ? 'rgba(220,80,80,0.6)' : 'rgba(var(--accent-rgb),0.25)'}`, borderRadius:'3px', color:'var(--white)', outline:'none', transition:'border-color 0.2s', textAlign:'center' }}
              onFocus={e => { if (!error) e.target.style.borderColor='rgba(var(--accent-rgb),0.55)'; }}
              onBlur={e => { if (!error) e.target.style.borderColor='rgba(var(--accent-rgb),0.25)'; }}
            />
          </div>
          {error && <div style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.22em', color:'rgba(220,80,80,0.8)', textTransform:'uppercase', animation:'fadeIn 0.15s ease' }}>Falsches Passwort</div>}
          <button type="submit" style={{ fontFamily:'var(--font-mono)', fontSize:'9px', letterSpacing:'0.28em', padding:'8px 24px', background:'rgba(var(--accent-rgb),0.1)', border:'1px solid rgba(var(--accent-rgb),0.3)', borderRadius:'3px', color:'rgba(var(--text-rgb),0.75)', cursor:'pointer', textTransform:'uppercase', transition:'all 0.15s' }}
            onMouseEnter={e => { e.currentTarget.style.background='rgba(var(--accent-rgb),0.2)'; e.currentTarget.style.borderColor='rgba(var(--accent-rgb),0.6)'; e.currentTarget.style.color='var(--white)'; }}
            onMouseLeave={e => { e.currentTarget.style.background='rgba(var(--accent-rgb),0.1)'; e.currentTarget.style.borderColor='rgba(var(--accent-rgb),0.3)'; e.currentTarget.style.color='rgba(var(--text-rgb),0.75)'; }}>
            Eintreten
          </button>
        </form>
        <a href="index.html" style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.22em', color:'rgba(var(--accent-rgb),0.35)', textDecoration:'none', textTransform:'uppercase', transition:'color 0.15s' }}
          onMouseEnter={e => { e.currentTarget.style.color='rgba(var(--accent-rgb),0.7)'; }}
          onMouseLeave={e => { e.currentTarget.style.color='rgba(var(--accent-rgb),0.35)'; }}>
          ← Zurück
        </a>
      </div>
    </div>
  );
}

// ── Session persistence helpers ───────────────────────────────────────────────
const SS_KEY = 'sim_groups';
function loadGroups() {
  try {
    const raw = sessionStorage.getItem(SS_KEY);
    if (!raw) return [[], []];
    const { g1, g2 } = JSON.parse(raw);
    return [g1 || [], g2 || []];
  } catch { return [[], []]; }
}
function saveGroups(g1, g2) {
  try { sessionStorage.setItem(SS_KEY, JSON.stringify({ g1, g2 })); } catch {}
}

// ── App ───────────────────────────────────────────────────────────────────────
function SimApp() {
  const [group1, setGroup1] = useState(() => loadGroups()[0]);
  const [group2, setGroup2] = useState(() => loadGroups()[1]);
  const [group2Snapshot, setGroup2Snapshot] = useState(null);
  const [modal, setModal] = useState(null); // null | { type: 'monster'|'player', target: 1|2 }
  const [savedPlayers, setSavedPlayers] = useState(loadPlayers);
  const [result, setResult] = useState(null);
  const [runCount, setRunCount] = useState(50);
  const [difficulty, setDifficulty] = useState('normal');
  const [monsterFilter, setMonsterFilter] = useState({ art: '', unterart: '', umgebung: '' });
  const [coherent, setCoherent] = useState(true);
  useEffect(() => { saveGroups(group1, group2); }, [group1, group2]);
  const [detailMonster, setDetailMonster] = useState(null);
  const selectedForModal = useMemo(() => {
    if (!modal) return new Map();
    const grp = modal.target === 1 ? group1 : group2;
    const map = new Map();
    grp.filter(c => c._kind === 'monster').forEach(c => {
      const key = c.name + (c.source || '');
      map.set(key, (map.get(key) || 0) + 1);
    });
    return map;
  }, [modal, group1, group2]);

  function addToGroup(setter, item) {
    setter(g => [...g, { ...item, _uid: uid() }]);
  }
  function updateGroupMember(setter, _uid, field, val) {
    setter(g => g.map(c => {
      if (c._uid !== _uid) return c;
      if (val === undefined) { const n = { ...c }; delete n[field]; return n; }
      return { ...c, [field]: val };
    }));
  }
  function removeFromGroup(setter, idx) {
    setter(g => g.filter((_, i) => i !== idx));
  }

  function handleSavePlayer(player) {
    const updated = savedPlayers.find(p => p.id === player.id)
      ? savedPlayers.map(p => p.id === player.id ? player : p)
      : [...savedPlayers, player];
    setSavedPlayers(updated);
    savePlayers(updated);
    const target = modal?.target;
    const setter = target === 1 ? setGroup1 : setGroup2;
    if (modal?.initial?._uid) {
      // Editing existing group member — replace in place
      const origUid = modal.initial._uid;
      setter(g => g.map(c => c._uid === origUid ? { ...player, _uid: origUid } : c));
    } else {
      addToGroup(setter, player);
    }
  }

  function handleDeletePlayer(id) {
    const updated = savedPlayers.filter(p => p.id !== id);
    setSavedPlayers(updated);
    savePlayers(updated);
  }

  function saveGroup2Snapshot() { setGroup2Snapshot(group2); }
  function revertGroup2() { if (group2Snapshot !== null) { setGroup2(group2Snapshot); setGroup2Snapshot(null); } }

  function openModal2(type, opts = {}) {
    saveGroup2Snapshot();
    setModal({ type, target: 2, ...opts });
  }

  function handleMatch(fromGroup, setter) {
    saveGroup2Snapshot();
    const opponents = generateMatchingOpponents(fromGroup, difficulty, monsterFilter, coherent);
    setter(opponents.map(m => ({ ...m, _uid: uid() })));
  }

  function handleAddOpponent() {
    saveGroup2Snapshot();
    const pick = findOneAdditionalOpponent(group1, group2, difficulty, monsterFilter, coherent);
    if (pick) addToGroup(setGroup2, pick);
  }

  function runSimulation() {
    if (!group1.length || !group2.length) return;
    const runs = Array.from({ length: runCount }, () => simulateCombat(group1, group2));
    setResult(runs);
  }

  const canRun = group1.length > 0 && group2.length > 0;

  return (
    <div className="sim-root">
      <SiteNav />
      <div className="sim-body">
        {!result && (
          <>
            <div className="sim-groups">
              <GroupPanel
                label="Gruppe 1"
                group={group1}
                onAdd={() => setModal({ type: 'monster', target: 1 })}
                onAddPlayer={() => setModal({ type: 'player', target: 1 })}
                onRemove={i => removeFromGroup(setGroup1, i)}
                onAddClone={m => addToGroup(setGroup1, m)}
                onDetail={setDetailMonster}
                onEditPlayer={p => setModal({ type: 'player', target: 1, initial: p })}
                onSessionChange={(_uid, field, val) => updateGroupMember(setGroup1, _uid, field, val)}
                showMatch={false}
              />
              <div className="sim-vs">VS</div>
              <GroupPanel
                label="Gruppe 2"
                group={group2}
                onAdd={() => openModal2('monster')}
                onAddPlayer={() => openModal2('player')}
                onRemove={i => removeFromGroup(setGroup2, i)}
                onAddClone={m => { saveGroup2Snapshot(); addToGroup(setGroup2, m); }}
                onDetail={setDetailMonster}
                onEditPlayer={p => setModal({ type: 'player', target: 2, initial: p })}
                onSessionChange={(_uid, field, val) => updateGroupMember(setGroup2, _uid, field, val)}
                showMatch={true}
                matchEnabled={group1.length > 0}
                onMatch={() => handleMatch(group1, setGroup2)}
                onAddOpponent={handleAddOpponent}
                canRevert={group2Snapshot !== null}
                onRevert={revertGroup2}
                difficulty={difficulty}
                onDifficulty={setDifficulty}
                monsterFilter={monsterFilter}
                onMonsterFilter={setMonsterFilter}
                coherent={coherent}
                onCoherent={setCoherent}
              />
            </div>
            <EncounterRating group1={group1} group2={group2} />
            <div className="sim-run-bar">
              <button className="sim-btn-run" disabled={!canRun} onClick={runSimulation}>
                ⚔ Kampf simulieren
              </button>
            </div>
            {!canRun && (
              <p style={{ textAlign: 'center', color: 'rgba(160,140,255,0.3)', fontSize: '0.75rem', marginTop: 8 }}>
                Mindestens ein Kämpfer pro Gruppe benötigt
              </p>
            )}
          </>
        )}

        {result && (
          <>
            <CombatResults
              runs={result}
              group1Name={group1.map(c => c.name).join(', ') || 'Gruppe 1'}
              group2Name={group2.map(c => c.name).join(', ') || 'Gruppe 2'}
              onReset={() => setResult(null)}
              runCount={runCount}
              onRunCountChange={setRunCount}
              onRerun={() => setResult(Array.from({ length: runCount }, () => simulateCombat(group1, group2)))}
            />
          </>
        )}
      </div>

      {modal?.type === 'monster' && (
        <MonsterPicker
          onAdd={m => addToGroup(modal.target === 1 ? setGroup1 : setGroup2, m)}
          onClose={() => setModal(null)}
          selected={selectedForModal}
          monsterFilter={monsterFilter}
          onMonsterFilter={setMonsterFilter}
          onDetail={setDetailMonster}
        />
      )}
      {detailMonster && (
        <MonsterDetailPopup monster={detailMonster} onClose={() => setDetailMonster(null)} />
      )}
      {modal?.type === 'player' && (
        <PlayerModal
          initial={modal.initial || null}
          savedPlayers={savedPlayers}
          currentGroup={modal.target === 1 ? group1 : group2}
          onSave={handleSavePlayer}
          onAddExisting={p => { addToGroup(modal.target === 1 ? setGroup1 : setGroup2, p); }}
          onDelete={handleDeletePlayer}
          onClose={() => setModal(null)}
        />
      )}
    </div>
  );
}

function App() {
  const [authed, setAuthed] = useState(() => {
    try {
      const raw = localStorage.getItem('monster_auth');
      if (!raw) return false;
      const { ts } = JSON.parse(raw);
      return Date.now() - ts < 24 * 60 * 60 * 1000;
    } catch { return false; }
  });
  if (!authed) return <SimPasswordGate onUnlock={() => setAuthed(true)} />;
  return <SimApp />;
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <SiteGate><App /></SiteGate>
);
</script>
</body>
</html>
