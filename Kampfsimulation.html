<!-- ═══════════════════════════════════════════════════════════════════
     COMBAT ENGINE  (plain JS, no JSX)
═══════════════════════════════════════════════════════════════════ -->
<script>
// ── Dice ─────────────────────────────────────────────────────────────────────
function d(sides) { return Math.floor(Math.random() * sides) + 1; }

function rollExpr(expr) {
  if (!expr) return { total: 0, text: '0' };
  const s = String(expr).trim();
  const m = s.match(/^(\d+)[Ww](\d+)([+-]\d+)?$/);
  if (!m) { const n = parseInt(s); return { total: isNaN(n) ? 1 : n, text: s }; }
  const count = parseInt(m[1]), sides = parseInt(m[2]), mod = m[3] ? parseInt(m[3]) : 0;
  let total = mod, parts = [];
  for (let i = 0; i < count; i++) { const r = d(sides); total += r; parts.push(r); }
  return { total: Math.max(0, total), text: `[${parts.join('+')}]${mod !== 0 ? (mod > 0 ? '+' : '') + mod : ''}` };
}

function rollD20(adv, dis) {
  const a = d(20), b = d(20);
  if (adv && !dis) return { roll: Math.max(a, b), both: [a, b], adv: true };
  if (dis && !adv) return { roll: Math.min(a, b), both: [a, b], dis: true };
  return { roll: a, both: [a] };
}

// ── Attack parser ─────────────────────────────────────────────────────────────
const SAVE_ATTR_MAP = {
  'stärke': 'STR', 'stärke-': 'STR', 'str': 'STR',
  'geschicklichkeit': 'GES', 'geschicklichkeits': 'GES', 'ges': 'GES',
  'konstitution': 'KON', 'konstitutions': 'KON', 'kon': 'KON',
  'intelligenz': 'INT', 'int': 'INT',
  'weisheit': 'WEI', 'weisheits': 'WEI', 'wei': 'WEI',
  'charisma': 'CHA', 'cha': 'CHA',
};

function parseSaveAttr(text) {
  const low = text.toLowerCase();
  for (const [k, v] of Object.entries(SAVE_ATTR_MAP)) {
    if (low.includes(k + 'rettungs') || low.includes(k + '-rettungs') ||
        (k.length === 3 && new RegExp('\\b' + k + '\\b', 'i').test(low))) return v;
  }
  return null;
}

function parseDamage(text) {
  // "(2W6+5) Hiebschaden" or "7 (2W6+5)" or just "2W6+5"
  const m1 = text.match(/\((\d+[Ww]\d+[+-]?\d*)\)/);
  if (m1) return m1[1];
  const m2 = text.match(/\b(\d+[Ww]\d+(?:[+-]\d+)?)\b/i);
  if (m2) return m2[1];
  return null;
}

function parseRecharge(name) {
  const m = name.match(/Auflade(?:zeit|ung)?\s*(\d+)(?:\s*[-–]\s*(\d+))?/i);
  if (!m) return null;
  return parseInt(m[2] || m[1]); // recharge on this roll or higher
}

function parseActions(monster) {
  const actions = [];
  const allActions = [
    ...(monster.aktionen || []).map(a => ({ ...a, _type: 'action' })),
    ...(monster.bonusaktionen || []).map(a => ({ ...a, _type: 'bonus' })),
    ...(monster.legendaere_aktionen || []).map(a => ({ ...a, _type: 'legendary' })),
  ];

  // Find Mehrfachangriff
  const multi = allActions.find(a => /mehrfachangriff/i.test(a.name));
  let multiCount = 1, multiNames = [];
  if (multi) {
    const desc = multi.beschreibung || '';
    // Count total attacks from words
    const numWords = { 'einen': 1, 'eine': 1, 'ein': 1, 'zwei': 2, 'zweimal': 2, 'drei': 3, 'dreimal': 3, 'vier': 4, 'viermal': 4, 'fünf': 5 };
    // "drei Angriffe", "zwei Klauenangriffe", "zweimal"
    const totalM = desc.match(/\b(einen|eine|ein|zwei|zweimal|drei|dreimal|vier|viermal|fünf)\b\s+(?:angriffe?|mal|\w+angriffe?)/i);
    if (totalM) multiCount = numWords[totalM[1].toLowerCase()] || 2;
    else {
      // count distinct attack name references (commas + "und")
      const parts = desc.split(/,|und/i).filter(p => p.trim().length > 2);
      multiCount = Math.max(2, parts.length);
    }
    // Try to extract named attacks
    for (const act of allActions) {
      if (/mehrfachangriff/i.test(act.name)) continue;
      if (new RegExp(act.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i').test(desc)) {
        multiNames.push(act.name);
      }
    }
  }

  for (const action of allActions) {
    if (/mehrfachangriff/i.test(action.name)) continue;
    const desc = action.beschreibung || '';
    const name = action.name || '';
    const recharge = parseRecharge(name);

    // Weapon or spell attack
    if (/nahkampf[- ]?waffenangriff|fernkampf[- ]?waffenangriff|nahkampf- oder fernkampf|fernkampf[- ]?zauberangriff|nahkampf[- ]?zauberangriff/i.test(desc)) {
      const bonusM = desc.match(/\+(\d+) zum Treffen/i);
      const bonus = bonusM ? parseInt(bonusM[1]) : 0;
      const dmg = parseDamage(desc);
      const dmgTypeM = desc.match(/(\w+schaden)/i);
      const isFern = /fernkampf[- ]?(?:waffen|zauber)angriff/i.test(desc) && !/nahkampf/i.test(desc.substring(0, desc.search(/fernkampf/i)));
      actions.push({
        name, type: 'attack', isFern, bonus,
        damage: dmg || '1W6', damageType: dmgTypeM ? dmgTypeM[1] : '',
        isMultiTarget: false, recharge,
        isMultiAttack: multiNames.includes(name),
        multiCount: multiNames.includes(name) ? Math.max(1, Math.round(multiCount / Math.max(1, multiNames.length))) : 1,
        _type: action._type,
      });
      continue;
    }

    // Saving throw / AoE
    const saveAttr = parseSaveAttr(desc);
    const saveDCM = desc.match(/(?:gegen\s+)?SG\s*(\d+)/i);
    if (saveAttr && saveDCM) {
      const dmg = parseDamage(desc);
      const halfOnSave = /halb(?:en)?|bei Erfolg die Hälfte|halben Schaden/i.test(desc);
      actions.push({
        name, type: 'save', saveAttr, saveDC: parseInt(saveDCM[1]),
        damage: dmg || '1W6', damageType: '',
        halfOnSave, isAoE: true, recharge,
        _type: action._type,
      });
      continue;
    }
  }

  // Healing spell actions (tagged with "Heilzauber:" prefix in beschreibung)
  for (const action of allActions) {
    const desc = action.beschreibung || '';
    if (/^Heilzauber:/i.test(desc)) {
      const diceM = desc.match(/(\d+[Ww]\d+(?:[+-]\d+)?)/i);
      if (diceM) actions.push({ name: action.name, type: 'heal', healDice: diceM[1], recharge: null, _type: action._type });
    }
  }

  // If no attacks parsed but multiCount > 1, use the first parsed attack multiCount times
  if (multi && actions.length > 0) {
    // mark first non-legendary as multi if nothing was named
    if (multiNames.length === 0) {
      const first = actions.find(a => a.type === 'attack');
      if (first) { first.isMultiAttack = true; first.multiCount = multiCount; }
    }
  }

  return { actions, multiCount, multiNames };
}

function extractHealingDice(beschreibung) {
  const text = (beschreibung || []).filter(b => typeof b === 'string').join(' ');
  const m1 = text.match(/höhe\s+von\s+(\d+[Ww]\d+(?:[+-]\d+)?)/i);
  if (m1) return m1[1];
  const m2 = text.match(/(\d+[Ww]\d+(?:[+-]\d+)?)\s+trefferpunkte[n]?\s+wieder\s+her/i);
  if (m2) return m2[1];
  return null;
}

function isHealingSpell(z) {
  const text = (z.beschreibung || []).filter(b => typeof b === 'string').join(' ');
  return /trefferpunkte[n]?\s+zurück\s+in\s+höhe/i.test(text)
      || /\d+[Ww]\d+\s+trefferpunkte[n]?\s+wieder\s+her/i.test(text)
      || /stellt\s+\d+\s+trefferpunkt/i.test(text);
}

// ── Combatant builder ─────────────────────────────────────────────────────────
function buildCombatant(data, team, uid) {
  const isMonster = data._kind === 'monster';
  const { actions, multiCount, multiNames } = parseActions(data);
  const dex = data.attribute?.DEX ?? 10;
  const con = data.attribute?.CON ?? 10;
  const wis = data.attribute?.WIS ?? 10;
  const baseHp = data.currentTp !== undefined ? data.currentTp
    : isMonster ? (rollExpr(data.tp_wuerfel).total || data.tp)
    : (data.maxTp || data.tp || 10);
  const maxHp = baseHp + (!isMonster && data.tempTp ? data.tempTp : 0);

  const legActions = (data.legendaere_aktionen || []).filter(a => {
    const d = a.beschreibung || '';
    return /waffenangriff|rettungswurf/i.test(d);
  });
  const legPerRound = data.legendary_actions_count || (data.legendaere_aktionen?.length ? 3 : 0);

  return {
    uid, name: data.name, team, _kind: data._kind || 'monster',
    hasInspiration: !!(data.inspiration),
    data,
    // Stats
    rk: data.rk || 10,
    maxHp, currentHp: maxHp,
    dexMod: Math.floor((dex - 10) / 2),
    conMod: Math.floor((con - 10) / 2),
    wisMod: Math.floor((wis - 10) / 2),
    saveBonuses: buildSaves(data),
    // Actions
    actions, multiCount, multiNames,
    legActions, legPerRound, legActionsLeft: 0,
    rechargeStatus: {}, // name -> available bool
    // Combat state
    conditions: new Set(),
    deathSucc: 0, deathFail: 0, stable: false, dead: false,
    initiative: 0,
  };
}

function buildSaves(data) {
  const attr = data.attribute || {};
  const listed = data.rettungswuerfe || {};
  const base = {};
  const map = { STR: 'STR', GES: 'DEX', KON: 'CON', INT: 'INT', WEI: 'WIS', CHA: 'CHA' };
  for (const [saveKey, attrKey] of Object.entries(map)) {
    const raw = attr[attrKey] ?? 10;
    base[saveKey] = listed[saveKey] !== undefined ? listed[saveKey] : Math.floor((raw - 10) / 2);
  }
  return base;
}

// ── Condition helpers ─────────────────────────────────────────────────────────
function hasCondition(c, name) { return c.conditions.has(name); }
function addCondition(c, name) { c.conditions.add(name); }
function removeCondition(c, name) { c.conditions.delete(name); }

function isIncapacitated(c) {
  return hasCondition(c, 'Betäubt') || hasCondition(c, 'Gelähmt') ||
         hasCondition(c, 'Bewusstlos') || hasCondition(c, 'Versteinert');
}

// ── Simulation ────────────────────────────────────────────────────────────────
function simulateCombat(rawGroup1, rawGroup2) {
  const allRounds = [];
  let curEntries = [];
  let curHits = {};
  const push = (cls, text) => curEntries.push({ cls, text });
  function trackHit(uid, hit) {
    if (!curHits[uid]) curHits[uid] = { h: 0, m: 0, heal: 0 };
    if (hit) curHits[uid].h++; else curHits[uid].m++;
  }
  function trackHeal(uid) {
    if (!curHits[uid]) curHits[uid] = { h: 0, m: 0, heal: 0 };
    curHits[uid].heal++;
  }

  let uid = 0;
  const g1 = rawGroup1.map(m => buildCombatant(m, 1, uid++));
  const g2 = rawGroup2.map(m => buildCombatant(m, 2, uid++));
  const all = [...g1, ...g2];

  // Initiative
  all.forEach(c => {
    c.initiative = d(20) + c.dexMod;
    push('log-init', `${c.name}: Initiative ${c.initiative} (W20${c.dexMod >= 0 ? '+' : ''}${c.dexMod})`);
  });
  all.sort((a, b) => b.initiative - a.initiative || b.dexMod - a.dexMod);
  allRounds.push({
    label: 'Initiative',
    entries: curEntries.splice(0),
    hpSnapshot: all.map(c => ({ uid: c.uid, name: c.name, team: c.team, currentHp: c.currentHp, maxHp: c.maxHp, dead: false })),
  });

  // Initialize legendary action pools & recharge
  all.forEach(c => {
    c.legActionsLeft = c.legPerRound;
    c.actions.forEach(a => { c.rechargeStatus[a.name] = true; });
  });

  function aliveIn(team) { return all.filter(c => c.team === team && !c.dead && !(c._kind === 'player' && c.currentHp <= 0 && c.stable)); }
  function combatOver() { return !aliveIn(1).filter(c => c.currentHp > 0).length || !aliveIn(2).filter(c => c.currentHp > 0).length; }
  function enemies(c) { return aliveIn(c.team === 1 ? 2 : 1); }

  function pickTarget(c) {
    const e = enemies(c);
    if (!e.length) return null;
    const conscious = e.filter(t => t.currentHp > 0);
    const pool = conscious.length ? conscious : e;
    return pool.reduce((a, b) => a.currentHp < b.currentHp ? a : b);
  }

  function doSave(target, attr, dc) {
    const bonus = target.saveBonuses[attr] ?? 0;
    const roll = d(20);
    const total = roll + bonus;
    return { success: total >= dc, roll, total, dc };
  }

  function applyDamage(target, dmgExpr) {
    const res = rollExpr(dmgExpr);
    const real = Math.max(0, res.total);
    target.currentHp = Math.max(-999, target.currentHp - real);
    push('log-damage', `  ↳ Schaden: ${real} ${res.text} → ${target.name} hat noch ${Math.max(0, target.currentHp)} TP`);
    return real;
  }

  function checkDeath(c) {
    if (c.dead || c.currentHp > 0) return;
    if (c._kind === 'player') {
      if (!hasCondition(c, 'Bewusstlos')) {
        addCondition(c, 'Bewusstlos');
        push('log-death', `  💀 ${c.name} wird bewusstlos (0 TP)!`);
      }
    } else {
      c.dead = true;
      push('log-death', `  ☠ ${c.name} ist besiegt!`);
    }
  }

  function doDeathSave(c) {
    if (c.dead || c.currentHp > 0 || c.stable) return;
    const roll = d(20);
    if (roll === 20) {
      c.currentHp = 1; removeCondition(c, 'Bewusstlos'); c.deathSucc = 0; c.deathFail = 0;
      push('log-stabilize', `  ✦ ${c.name} erholt sich mit einer 20! (1 TP)`);
    } else if (roll === 1) {
      c.deathFail += 2;
      push('log-death', `  ✦ ${c.name} Todesrettungswurf: 1 (kritisch) — 2 Fehlschläge (${c.deathFail}/3)`);
    } else if (roll >= 10) {
      c.deathSucc++;
      push('log-stabilize', `  ✦ ${c.name} Todesrettungswurf: ${roll} — Erfolg ${c.deathSucc}/3`);
      if (c.deathSucc >= 3) { c.stable = true; push('log-stabilize', `  ✦ ${c.name} ist stabilisiert.`); }
    } else {
      c.deathFail++;
      push('log-death', `  ✦ ${c.name} Todesrettungswurf: ${roll} — Fehlschlag ${c.deathFail}/3`);
    }
    if (c.deathFail >= 3) { c.dead = true; push('log-death', `  ☠ ${c.name} stirbt!`); }
  }

  function rechargeCheck(c) {
    c.actions.forEach(a => {
      if (a.recharge === null || c.rechargeStatus[a.name]) return;
      const roll = d(6);
      if (roll >= a.recharge) { c.rechargeStatus[a.name] = true; push('log-recharge', `  ↺ ${c.name}: "${a.name}" aufgeladen (W6=${roll})`); }
    });
  }

  function avgDmg(expr) {
    if (!expr) return 0;
    const m = String(expr).match(/(\d+)[Ww](\d+)([+-]\d+)?/);
    if (!m) return parseInt(expr) || 0;
    return parseInt(m[1]) * (parseInt(m[2]) + 1) / 2 + (m[3] ? parseInt(m[3]) : 0);
  }

  function pickActions(c) {
    const usable = c.actions.filter(a => !(a.recharge !== null && !c.rechargeStatus[a.name]) && a._type !== 'legendary');
    const healAct = usable.find(a => a.type === 'heal');
    if (healAct) {
      const allies = all.filter(t => t.team === c.team && t !== c && !t.dead);
      const urgentHeal = allies.some(t => t.currentHp <= 0);
      const woundedHeal = allies.some(t => t.currentHp < t.maxHp * 0.4);
      if (urgentHeal || woundedHeal) return [healAct];
    }
    const aoe = usable.find(a => a.type === 'save' && a.isAoE);
    if (aoe && enemies(c).length >= 2) return [aoe];
    const multiBase = usable.filter(a => a.type === 'attack' && a.isMultiAttack);
    if (multiBase.length > 0) {
      const expanded = [];
      if (c.multiNames.length > 0) {
        c.multiNames.forEach(n => { const act = usable.find(a => a.name === n && a.type === 'attack'); if (act) expanded.push(act); });
        while (expanded.length > 0 && expanded.length < c.multiCount) expanded.push(expanded[expanded.length - 1]);
      }
      if (expanded.length === 0 && multiBase[0]) for (let i = 0; i < c.multiCount; i++) expanded.push(multiBase[0]);
      if (expanded.length > 0) return expanded;
    }
    const attacks = usable.filter(a => a.type === 'attack' || a.type === 'save');
    if (!attacks.length) return [];
    attacks.sort((a, b) => avgDmg(b.damage) - avgDmg(a.damage));
    return [attacks[0]];
  }

  function executeAction(attacker, action, allCombatants) {
    if (action.type === 'attack') {
      const target = pickTarget(attacker);
      if (!target) return;
      const inspAdv = attacker.hasInspiration ? (attacker.hasInspiration = false, true) : false;
      const adv = inspAdv || (hasCondition(target, 'Liegend') && !action.isFern);
      const dis = hasCondition(attacker, 'Vergiftet') || hasCondition(attacker, 'Liegend') || hasCondition(attacker, 'Verängstigt');
      const { roll, both, adv: wasAdv, dis: wasDis } = rollD20(adv, dis);
      const advNote = wasAdv ? ' (Vorteil)' : wasDis ? ' (Nachteil)' : '';
      const total = roll + action.bonus;
      const isCrit = roll === 20, isFumble = roll === 1;
      if (isFumble || (!isCrit && total < target.rk)) {
        trackHit(attacker.uid, false);
        push('log-miss', `  ${attacker.name} → ${target.name}: ${action.name} — W20=${roll}${both.length > 1 ? `(${both.join(',')})` : ''}${advNote} +${action.bonus}=${total} vs RK${target.rk} VERFEHLT`);
      } else {
        trackHit(attacker.uid, true);
        push('log-hit', `  ${attacker.name} → ${target.name}: ${action.name} — W20=${roll}${both.length > 1 ? `(${both.join(',')})` : ''}${advNote} +${action.bonus}=${total} vs RK${target.rk} GETROFFEN${isCrit ? ' ✦ KRITISCH' : ''}`);
        let dmgExpr = action.damage;
        if (isCrit) { const m = dmgExpr.match(/^(\d+)([Ww]\d+)(.*)$/); if (m) dmgExpr = (parseInt(m[1]) * 2) + m[2] + (m[3] || ''); }
        applyDamage(target, dmgExpr);
        checkDeath(target);
        if (/vergiftet|gift/i.test(action.damageType) && !target.dead) {
          const sv = doSave(target, 'KON', 13);
          if (!sv.success) { addCondition(target, 'Vergiftet'); push('log-condition', `  ${target.name} ist vergiftet! (Rettungswurf ${sv.total} vs SG13)`); }
        }
      }
      if (action.recharge !== null) attacker.rechargeStatus[action.name] = false;
    } else if (action.type === 'heal') {
      const allies = all.filter(t => t.team === attacker.team && !t.dead && (t.currentHp < t.maxHp || (t._kind === 'player' && t.currentHp <= 0)));
      if (!allies.length) return;
      allies.sort((a, b) => (a.currentHp / a.maxHp) - (b.currentHp / b.maxHp));
      const target = allies[0];
      const healRoll = rollExpr(action.healDice);
      const healed = Math.min(target.maxHp - target.currentHp, healRoll.total);
      target.currentHp += healed;
      trackHeal(attacker.uid);
      if (hasCondition(target, 'Bewusstlos') && target.currentHp > 0) {
        removeCondition(target, 'Bewusstlos');
        target.deathSucc = 0; target.deathFail = 0;
        push('log-heal', `  💚 ${attacker.name} heilt ${target.name} mit ${action.name}: +${healed} TP ${healRoll.text} → aufgewacht (${target.currentHp}/${target.maxHp} TP)`);
      } else {
        push('log-heal', `  💚 ${attacker.name} heilt ${target.name} mit ${action.name}: +${healed} TP ${healRoll.text} (${target.currentHp}/${target.maxHp} TP)`);
      }
    } else if (action.type === 'save') {
      const targets = allCombatants.filter(t => t.team !== attacker.team && !t.dead);
      if (!targets.length) return;
      trackHit(attacker.uid, true);
      push('log-hit', `  ${attacker.name}: ${action.name} (SG ${action.saveDC} ${action.saveAttr}-Rettungswurf)`);
      if (action.recharge !== null) attacker.rechargeStatus[action.name] = false;
      targets.forEach(target => {
        const sv = doSave(target, action.saveAttr, action.saveDC);
        if (sv.success) {
          push('log-save-ok', `  ${target.name}: Rettungswurf ${sv.total} vs SG${sv.dc} — ERFOLG${action.halfOnSave ? ' (halber Schaden)' : ' (kein Schaden)'}`);
          if (action.halfOnSave) applyDamage(target, action.damage);
        } else {
          push('log-save-fail', `  ${target.name}: Rettungswurf ${sv.total} vs SG${sv.dc} — FEHLSCHLAG`);
          applyDamage(target, action.damage);
        }
        checkDeath(target);
      });
    }
  }

  function doLegendaryActions(legendaryCreature, allCombatants) {
    if (!legendaryCreature.legActionsLeft || legendaryCreature.dead) return;
    const legUsable = legendaryCreature.legActions.filter(a => legendaryCreature.rechargeStatus[a.name] !== false);
    if (!legUsable.length || !enemies(legendaryCreature).length) return;
    const act = legUsable[0];
    const desc = act.beschreibung || '';
    const bonusM = desc.match(/\+(\d+) zum Treffen/i);
    const dmg = parseDamage(desc);
    if (bonusM) {
      const fakeAction = { name: act.name, type: 'attack', isFern: false, bonus: parseInt(bonusM[1]), damage: dmg || '1W6', damageType: '', recharge: null, isMultiAttack: false };
      push('log-legendary', `  ⬟ Legendäre Aktion: ${legendaryCreature.name} — ${act.name}`);
      executeAction(legendaryCreature, fakeAction, allCombatants);
    }
    legendaryCreature.legActionsLeft--;
  }

  // ── Main loop ──
  const MAX_ROUNDS = 50;
  let roundNum = 0;

  while (roundNum < MAX_ROUNDS) {
    roundNum++;
    all.forEach(c => { c.legActionsLeft = c.legPerRound; });

    for (const combatant of all) {
      if (combatant.dead) continue;
      if (combatOver()) break;
      if (combatant._kind === 'player' && combatant.currentHp <= 0 && !combatant.dead && !combatant.stable) {
        push('log-turn', `▸ ${combatant.name} (Ini ${combatant.initiative})`);
        doDeathSave(combatant);
        continue;
      }
      if (isIncapacitated(combatant)) {
        push('log-turn', `▸ ${combatant.name} ist handlungsunfähig und überspringt seinen Zug.`);
        continue;
      }
      push('log-turn', `▸ ${combatant.name} (Ini ${combatant.initiative}, ${combatant.currentHp}/${combatant.maxHp} TP)`);
      rechargeCheck(combatant);
      const acts = pickActions(combatant);
      if (!acts.length) {
        push('log-misc', `  ${combatant.name} hat keine nutzbaren Aktionen.`);
      } else {
        if (acts.length > 1) push('log-misc', `  Mehrfachangriff (${acts.length}×)`);
        for (const act of acts) {
          if (enemies(combatant).length === 0) break;
          executeAction(combatant, act, all);
        }
      }
      if (hasCondition(combatant, 'Vergiftet')) push('log-condition', `  ${combatant.name} leidet an Vergiftung (Nachteil auf Würfe).`);
      all.filter(c => c.team !== combatant.team && !c.dead && c.legPerRound > 0 && c.legActionsLeft > 0)
        .forEach(leg => doLegendaryActions(leg, all));
    }

    // Save round with end-of-round HP snapshot
    allRounds.push({
      label: `Runde ${roundNum}`,
      entries: curEntries.splice(0),
      hpSnapshot: all.map(c => ({ uid: c.uid, name: c.name, team: c.team, currentHp: Math.max(0, c.currentHp), maxHp: c.maxHp, dead: c.dead })),
      hits: curHits,
    });
    curHits = {};

    if (combatOver()) break;
  }

  // Result — append finale to last round
  const standing1 = all.filter(c => c.team === 1 && !c.dead && c.currentHp > 0);
  const standing2 = all.filter(c => c.team === 2 && !c.dead && c.currentHp > 0);
  let winner = 'draw';
  if (standing1.length && !standing2.length) winner = 1;
  else if (!standing1.length && standing2.length) winner = 2;

  push('log-round', '── KAMPF ENDE ──');
  if (winner === 'draw') push('log-misc', 'Beide Gruppen wurden vernichtet oder der Kampf endete unentschieden.');
  else push('log-misc', `Gruppe ${winner} gewinnt nach ${roundNum} Runden!`);
  if (allRounds.length > 0) allRounds[allRounds.length - 1].entries.push(...curEntries.splice(0));

  return {
    winner,
    roundCount: roundNum,
    rounds: allRounds,
    survivors1: g1.map(c => ({ name: c.name, uid: c.uid, currentHp: c.currentHp, maxHp: c.maxHp, dead: c.dead })),
    survivors2: g2.map(c => ({ name: c.name, uid: c.uid, currentHp: c.currentHp, maxHp: c.maxHp, dead: c.dead })),
  };
}

// ── Matching opponents ────────────────────────────────────────────────────────
// XP thresholds per character level [trivial, easy, medium, hard, deadly, epic]
const XP_THRESHOLDS = [
  null,
  [12,   25,   50,   75,   100,   200],
  [25,   50,   100,  150,  200,   400],
  [37,   75,   150,  225,  400,   800],
  [62,   125,  250,  375,  500,   1000],
  [125,  250,  500,  750,  1100,  2200],
  [150,  300,  600,  900,  1400,  2800],
  [175,  350,  750,  1100, 1700,  3400],
  [225,  450,  900,  1400, 2100,  4200],
  [275,  550,  1100, 1600, 2400,  4800],
  [300,  600,  1200, 1900, 2800,  5600],
  [400,  800,  1600, 2400, 3600,  7200],
  [500,  1000, 2000, 3000, 4500,  9000],
  [550,  1100, 2200, 3400, 5100,  10200],
  [625,  1250, 2500, 3800, 5700,  11400],
  [700,  1400, 2800, 4300, 6400,  12800],
  [800,  1600, 3200, 4800, 7200,  14400],
  [1000, 2000, 3900, 5900, 8800,  17600],
  [1050, 2100, 4200, 6300, 9500,  19000],
  [1200, 2400, 4900, 7300, 11000, 22000],
  [1400, 2800, 5700, 8500, 12700, 25400],
];

function encXpMult(count) {
  if (count === 1)  return 1;
  if (count === 2)  return 1.5;
  if (count <= 6)   return 2;
  if (count <= 10)  return 2.5;
  if (count <= 14)  return 3;
  return 4;
}

function calcEncounterDifficulty(party, enemies) {
  if (!party.length || !enemies.length) return null;
  const sums = [0, 0, 0, 0, 0, 0];
  for (const m of party) {
    const lvl = m._kind === 'player'
      ? Math.max(1, Math.min(20, m.stufe || 1))
      : Math.max(1, Math.min(20, Math.round(m.cr || 1)));
    const t = XP_THRESHOLDS[lvl];
    for (let i = 0; i < 6; i++) sums[i] += t[i];
  }
  const [t0, t1, t2, t3, t4, t5] = sums;
  const adjXP = enemies.reduce((s, m) => s + (m.xp || 0), 0) * encXpMult(enemies.length);

  // Main zone (always one of the 5 fixed labels)
  const ZONES = [
    { label: 'Trivial',  cls: 'enc-trivial', lo: 0,  hi: t1 },
    { label: 'Leicht',   cls: 'enc-easy',    lo: t1, hi: t2 },
    { label: 'Normal',   cls: 'enc-medium',  lo: t2, hi: t3 },
    { label: 'Schwer',   cls: 'enc-hard',    lo: t3, hi: t4 },
    { label: 'Tödlich',  cls: 'enc-deadly',  lo: t4, hi: t5 },
  ];
  const zIdx = adjXP >= t4 ? 4 : adjXP >= t3 ? 3 : adjXP >= t2 ? 2 : adjXP >= t1 ? 1 : 0;
  const { label, cls, lo, hi } = ZONES[zIdx];
  const ratio = hi > lo ? Math.max(0, Math.min(1, (adjXP - lo) / (hi - lo))) : 0.5;

  // Sub-text: directional hint within the zone
  let sub = null;
  if (zIdx === 0) {
    if (adjXP < t0 * 0.4)   sub = 'Kaum eine Bedrohung';
    else if (ratio > 0.65)  sub = 'Fühlt sich eher leicht an';
  } else if (zIdx === 4) {
    if (ratio < 0.35)        sub = 'Fühlt sich eher schwer an';
    else if (ratio > 0.65)   sub = 'Äußerst tödlich';
  } else {
    if (ratio < 0.35)        sub = `Fühlt sich eher ${ZONES[zIdx - 1].label.toLowerCase()} an`;
    else if (ratio > 0.65)   sub = `Fühlt sich eher ${ZONES[zIdx + 1].label.toLowerCase()} an`;
  }

  return { label, cls, sub, adjXP };
}

// Coherence: narrow pool to monsters sharing art/unterart/umgebung with the anchor
function coherentPool(anchor, xpPool) {
  const hasUmg = (m, u) => Array.isArray(m.umgebung) ? m.umgebung.includes(u) : m.umgebung === u;
  const byUnterart = anchor.unterart ? xpPool.filter(m => m.unterart === anchor.unterart) : [];
  if (byUnterart.length >= 2) return byUnterart;
  const anchorUmg = Array.isArray(anchor.umgebung) ? anchor.umgebung : (anchor.umgebung ? [anchor.umgebung] : []);
  const byArtUmg = xpPool.filter(m => m.art === anchor.art && anchorUmg.some(u => hasUmg(m, u)));
  if (byArtUmg.length >= 2) return byArtUmg;
  return xpPool.filter(m => m.art === anchor.art);
}

function applyMonsterFilter(pool, monsterFilter) {
  if (monsterFilter?.art)      pool = pool.filter(m => m.art === monsterFilter.art);
  if (monsterFilter?.unterart) pool = pool.filter(m => m.unterart === monsterFilter.unterart);
  if (monsterFilter?.umgebung) pool = pool.filter(m =>
    Array.isArray(m.umgebung) ? m.umgebung.includes(monsterFilter.umgebung) : m.umgebung === monsterFilter.umgebung
  );
  return pool;
}

function partyBudget(group1, iLow, iHigh) {
  let lo = 0, hi = 0;
  for (const m of group1) {
    const lvl = m._kind === 'player'
      ? Math.max(1, Math.min(20, m.stufe || 1))
      : Math.max(1, Math.min(20, Math.ceil(m.cr || 1)));
    const t = XP_THRESHOLDS[lvl];
    lo += t[iLow]; hi += t[iHigh];
  }
  return [lo, hi];
}

function findOneAdditionalOpponent(group1, group2, difficulty, monsterFilter, coherent) {
  let pool = applyMonsterFilter(
    (window.MONSTER_DATA || []).filter(m => m.xp > 0 && m.tp > 0),
    monsterFilter
  );
  if (!pool.length || !group1.length) return null;

  // Exclude types already in group2
  const existingKeys = new Set(
    group2.filter(c => c._kind === 'monster').map(c => c.name + (c.source || ''))
  );
  pool = pool.filter(m => !existingKeys.has(m.name + (m.source || '')));
  if (!pool.length) return null;

  // Party budget upper bound for selected difficulty
  const brackets = { trivial: [0, 1], leicht: [1, 2], normal: [2, 3], schwer: [3, 4], toedlich: [4, 5] };
  const [, iHigh] = brackets[difficulty] ?? [2, 3];
  const [, budgetHigh] = partyBudget(group1, 0, iHigh);

  // Current state of group2
  const monsters2 = group2.filter(c => c._kind === 'monster');
  const rawXP2 = monsters2.reduce((s, c) => s + (c.xp || 0), 0);
  const newCount = monsters2.length + 1;
  const newMult = encXpMult(newCount);
  // Max XP the new monster can have without exceeding budget
  const maxMonsterXP = budgetHigh / newMult - rawXP2;

  // Apply coherence relative to existing group2 monsters
  let eligible = pool;
  if (coherent && monsters2.length > 0) {
    const anchor = monsters2[0];
    const cp = coherentPool(anchor, pool);
    if (cp.length) eligible = cp;
  }

  if (maxMonsterXP > 0) {
    const fitting = eligible.filter(m => m.xp <= maxMonsterXP * 1.15);
    if (fitting.length) {
      fitting.sort((a, b) => Math.abs(b.xp - maxMonsterXP) - Math.abs(a.xp - maxMonsterXP));
      const top = fitting.slice(0, Math.min(8, fitting.length));
      return { ...top[Math.floor(Math.random() * top.length)], _kind: 'monster' };
    }
  }

  // Budget exceeded → weakest available monster
  const fallback = coherent && monsters2.length > 0
    ? coherentPool(monsters2[0], pool)
    : pool;
  const sorted = (fallback.length ? fallback : pool).slice().sort((a, b) => a.xp - b.xp);
  return sorted[0] ? { ...sorted[0], _kind: 'monster' } : null;
}

function generateMatchingOpponents(group1, difficulty, monsterFilter, coherent) {
  let pool = applyMonsterFilter(
    (window.MONSTER_DATA || []).filter(m => m.xp > 0 && m.tp > 0),
    monsterFilter
  );
  if (!pool.length || !group1.length) return [];

  const brackets = { trivial: [0, 1], leicht: [1, 2], normal: [2, 3], schwer: [3, 4], toedlich: [4, 5] };
  const [iLow, iHigh] = brackets[difficulty] ?? [2, 3];
  const [budgetLow, budgetHigh] = partyBudget(group1, iLow, iHigh);

  // Try random builds (1–5 monsters, varied count)
  for (let attempt = 0; attempt < 500; attempt++) {
    const count   = Math.floor(Math.random() * 5) + 1;
    const mult    = encXpMult(count);
    const rawLow  = budgetLow  / mult;
    const rawHigh = budgetHigh / mult;
    const perLow  = rawLow  / count;
    const perHigh = rawHigh / count;

    const eligible = pool.filter(m => m.xp >= perLow * 0.55 && m.xp <= perHigh * 1.55);
    if (!eligible.length) continue;

    // Pick anchor first, then constrain remaining picks if coherent mode is on
    const anchor = eligible[Math.floor(Math.random() * eligible.length)];
    const rest   = coherent && count > 1 ? coherentPool(anchor, eligible) : eligible;
    if (coherent && count > 1 && !rest.length) continue;

    const picks = [anchor, ...Array.from({ length: count - 1 }, () =>
      rest[Math.floor(Math.random() * rest.length)]
    )];
    const adjusted = picks.reduce((s, m) => s + m.xp, 0) * mult;

    if (adjusted >= budgetLow * 0.7 && adjusted <= budgetHigh * 1.3) {
      return picks.map(m => ({ ...m, _kind: 'monster' }));
    }
  }

  // Fallback: single monster closest to budget midpoint
  const target = (budgetLow + budgetHigh) / 2;
  const best = [...pool].sort((a, b) => Math.abs(a.xp - target) - Math.abs(b.xp - target))[0];
  return [{ ...best, _kind: 'monster' }];
}
</script>

<script type="text/babel">

  if (cr === 0.125) return '1/8';
  if (cr === 0.25) return '1/4';
  if (cr === 0.5) return '1/2';
  return String(cr);
}
function getModStr(val) {
  const m = Math.floor(((val || 10) - 10) / 2);
  return (m >= 0 ? '+' : '') + m;
}
const LS_PLAYERS = 'sim_saved_players';

      )}

  );
}

// ── Monster Picker ────────────────────────────────────────────────────────────
function MonsterPicker({ onAdd, onClose, selected, monsterFilter, onMonsterFilter, onDetail }) {
  const [q, setQ] = useState('');
  const all = useMemo(() => (window.MONSTER_DATA || []).filter(m => m.name && m.tp), []);

  const allArts      = useMemo(() => [...new Set(all.map(m => m.art).filter(Boolean))].sort((a,b) => a.localeCompare(b,'de')), [all]);
  const allUnterarts = useMemo(() => [...new Set(all.map(m => m.unterart).filter(Boolean))].sort((a,b) => a.localeCompare(b,'de')), [all]);
  const allUmgebungen = useMemo(() => [...new Set(all.flatMap(m => Array.isArray(m.umgebung) ? m.umgebung : m.umgebung ? [m.umgebung] : []))].sort((a,b) => a.localeCompare(b,'de')), [all]);

  const setF = (key, val) => onMonsterFilter(f => ({ ...f, [key]: val }));

  const results = useMemo(() => {
    let list = all;
    if (monsterFilter?.art)      list = list.filter(m => m.art === monsterFilter.art);
    if (monsterFilter?.unterart) list = list.filter(m => m.unterart === monsterFilter.unterart);
    if (monsterFilter?.umgebung) list = list.filter(m =>
      Array.isArray(m.umgebung) ? m.umgebung.includes(monsterFilter.umgebung) : m.umgebung === monsterFilter.umgebung
    );
    if (q.trim()) { const low = q.toLowerCase(); list = list.filter(m => m.name.toLowerCase().includes(low)); }
    return list.slice(0, 100);
  }, [q, all, monsterFilter]);

  const activeFilters = [monsterFilter?.art, monsterFilter?.unterart, monsterFilter?.umgebung].filter(Boolean).length;

  return (
    <div className="sim-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="sim-modal">
        <div className="sim-modal-header">
          <h3>Monster hinzufügen</h3>
          <button className="sim-modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="sim-modal-body">
          <input className="sim-search" placeholder="Monster suchen…" value={q}
            onChange={e => setQ(e.target.value)} autoFocus style={{ marginBottom: 8 }} />
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 6, marginBottom: 8 }}>
            <select className="sim-form-select" value={monsterFilter?.art || ''} onChange={e => setF('art', e.target.value)}>
              <option value="">Alle Arten</option>
              {allArts.map(a => <option key={a} value={a}>{a}</option>)}
            </select>
            <select className="sim-form-select" value={monsterFilter?.unterart || ''} onChange={e => setF('unterart', e.target.value)}>
              <option value="">Alle Unterarten</option>
              {allUnterarts.map(a => <option key={a} value={a}>{a}</option>)}
            </select>
            <select className="sim-form-select" value={monsterFilter?.umgebung || ''} onChange={e => setF('umgebung', e.target.value)}>
              <option value="">Alle Umgebungen</option>
              {allUmgebungen.map(a => <option key={a} value={a}>{a}</option>)}
            </select>
          </div>
          <div style={{ fontSize: '0.68rem', color: 'rgba(160,140,255,0.35)', marginBottom: 8, fontFamily: 'var(--font-mono)', display: 'flex', justifyContent: 'space-between' }}>
            <span>{results.length} Monster{activeFilters > 0 ? ` · ${activeFilters} Filter aktiv` : ''}</span>
            {activeFilters > 0 && <button style={{ background:'none', border:'none', color:'rgba(160,140,255,0.5)', cursor:'pointer', fontSize:'0.68rem', padding:0 }} onClick={() => onMonsterFilter({ art:'', unterart:'', umgebung:'' })}>Filter leeren</button>}
          </div>
          <div className="sim-monster-list">
            {results.map(m => {
              const key = m.name + (m.source || '');
              const count = selected?.get(key) || 0;
              return (
                <div key={key} className="sim-monster-row"
                  onClick={() => onAdd({ ...m, _kind: 'monster' })}>
                  {m.bild
                    ? <img src={m.bild} alt={m.name} className="sim-monster-row-img" onError={e => { e.target.style.display='none'; }} />
                    : <div className="sim-monster-row-img" style={{ display:'flex', alignItems:'center', justifyContent:'center', fontSize:'0.6rem', color:'rgba(160,140,255,0.3)' }}>?</div>
                  }
                  <span className="sim-monster-row-name">
                    {count > 0 && <span className="sim-picker-count">×{count}</span>}
                    {m.name}
                    <span className="sim-tags">
                      {m.art && <span className="sim-tag">{m.art}</span>}
                      {m.unterart && m.unterart !== 'NPC' && <span className="sim-tag sim-tag-sub">{m.unterart}</span>}
                    </span>
                  </span>
                  <span className="sim-monster-row-meta">CR {formatCR(m.cr)} · {m.tp} TP</span>
                  {onDetail && (
                    <button className="sim-monster-row-info" title="Details" onClick={e => { e.stopPropagation(); onDetail(m); }}>i</button>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Spell Picker ─────────────────────────────────────────────────────────────
function SpellPicker({ onAdd, onClose }) {
  const [q, setQ] = useState('');
  const [filterKlasse, setFilterKlasse] = useState('');
  const [mode, setMode] = useState('schaden');

  const allDmg = useMemo(() => (window.ZAUBER_DATA || [])
    .filter(z => z.schaden && (z.rettungswurfAttribut || z.istAngriff))
    .sort((a, b) => a.name.localeCompare(b.name, 'de')), []);

  const allHeal = useMemo(() => (window.ZAUBER_DATA || [])
    .filter(z => isHealingSpell(z))
    .map(z => ({ ...z, _heilungsDice: extractHealingDice(z.beschreibung) }))
    .filter(z => z._heilungsDice)
    .sort((a, b) => a.name.localeCompare(b.name, 'de')), []);

  const all = mode === 'heilung' ? allHeal : allDmg;

  const results = useMemo(() => {
    let list = all;
    if (filterKlasse) list = list.filter(z => z.klassen?.includes(filterKlasse));
    if (q.trim()) {
      const low = q.toLowerCase();
      list = list.filter(z => z.name.toLowerCase().includes(low));
    }
    return list.slice(0, 120);
  }, [q, filterKlasse, all, mode]);

  const TYPE_COLORS = {
    Feuer:'#f97316', Blitz:'#a78bfa', Kälte:'#38bdf8', Eis:'#7dd3fc',
    Gift:'#4ade80', Säure:'#84cc16', Nekrotisch:'#818cf8', Psychisch:'#e879f9',
    Energie:'#fbbf24', Schall:'#fb923c', Strahlung:'#fde68a', Gleißend:'#fef08a',
    Heilig:'#fcd34d', Wucht:'#94a3b8', Stich:'#94a3b8', Hieb:'#94a3b8',
    Variabel:'#c084fc', Strahlend:'#fde68a',
  };

  return (
    <div className="sim-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="sim-modal">
        <div className="sim-modal-header">
          <h3>Zauber hinzufügen</h3>
          <button className="sim-modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="sim-modal-body">
          <div className="sim-tabs" style={{ marginBottom: 10 }}>
            <button className={`sim-tab ${mode === 'schaden' ? 'active' : ''}`} onClick={() => setMode('schaden')}>Schadenszauber</button>
            <button className={`sim-tab ${mode === 'heilung' ? 'active' : ''}`} onClick={() => setMode('heilung')}>Heilzauber</button>
          </div>
          <div style={{ display: 'flex', gap: 8, marginBottom: 10 }}>
            <input className="sim-search" style={{ marginBottom: 0, flex: 1 }}
              placeholder="Zauber suchen…" value={q} onChange={e => setQ(e.target.value)} autoFocus />
            <select className="sim-form-select" style={{ width: 140, flexShrink: 0 }}
              value={filterKlasse} onChange={e => setFilterKlasse(e.target.value)}>
              <option value="">Alle Klassen</option>
              {KLASSEN.map(k => <option key={k} value={k}>{k}</option>)}
            </select>
          </div>
          <div style={{ fontSize: '0.68rem', color: 'rgba(160,140,255,0.35)', marginBottom: 8, fontFamily: 'var(--font-mono)' }}>
            {results.length} Zauber · {mode === 'heilung' ? 'Heilzauber' : 'nur Schadenszauber'}
          </div>
          <div className="sim-monster-list">
            {mode === 'heilung' ? results.map(z => (
              <div key={z.name} className="sim-monster-row" onClick={() => { onAdd(z); onClose(); }}>
                <div style={{ width: 28, height: 28, borderRadius: '50%', background: 'rgba(80,200,120,0.08)', border: '1px solid rgba(80,200,120,0.2)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '0.75rem', flexShrink: 0 }}>💚</div>
                <span className="sim-monster-row-name">{z.name}</span>
                <span className="sim-monster-row-meta">Grad {z.grad} · {z._heilungsDice} TP</span>
              </div>
            )) : results.map(z => (
              <div key={z.name} className="sim-monster-row" onClick={() => { onAdd(z); onClose(); }}>
                <div style={{ width: 28, height: 28, borderRadius: '50%', background: 'rgba(160,140,255,0.06)', border: '1px solid rgba(160,140,255,0.12)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '0.6rem', color: TYPE_COLORS[z.schadenTyp] || 'rgba(160,140,255,0.4)', flexShrink: 0, fontWeight: 700 }}>
                  {(z.schadenTyp||'?').substring(0, 2)}
                </div>
                <span className="sim-monster-row-name">{z.name}</span>
                <span className="sim-monster-row-meta">
                  Grad {z.grad} · {z.schaden} · {z.schadenTyp || '?'}
                  {z.rettungswurfAttribut ? ` · ${z.rettungswurfAttribut}-Save SG?` : ' · Angriff'}
                  {z.halbiert ? ' · ½' : ''}
                </span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Player Form ───────────────────────────────────────────────────────────────
function PlayerModal({ initial, savedPlayers, currentGroup, onSave, onAddExisting, onDelete, onClose }) {
  const [tab, setTab] = useState('new');
  const isNew = !initial;
  const initData = initial ? { ...EMPTY_PLAYER, ...initial, zauber: initial.zauber || [] } : { ...EMPTY_PLAYER };
  const [form, setForm] = useState(() => {
    if (isNew) {
      const draft = loadDraft();
      if (draft) return draft;
    }
    return { ...initData, id: initData.id || uid() };
  });
  // Track whether klasse is custom (not in predefined list)
  const [customKlasse, setCustomKlasse] = useState(
    !!(form.klasse && !KLASSEN.includes(form.klasse))
  );
  // Autosave draft on every change (new players only)
  useEffect(() => { if (isNew) saveDraft(form); }, [form]);

  function set(path, val) {
    setForm(f => {
      const copy = JSON.parse(JSON.stringify(f));
      const parts = path.split('.');
      let obj = copy;
      for (let i = 0; i < parts.length - 1; i++) obj = obj[parts[i]];
      obj[parts[parts.length - 1]] = val;
      return copy;
    });
  }

  function addAttack() {
    setForm(f => ({ ...f, angriffe: [...f.angriffe, { id: uid(), name: '', bonus: 3, schaden: '1W6+2', schadenstyp: '', isFern: false }] }));
  }
  function removeAttack(id) {
    setForm(f => ({ ...f, angriffe: f.angriffe.filter(a => a.id !== id) }));
  }
  function setAttack(id, key, val) {
    setForm(f => ({ ...f, angriffe: f.angriffe.map(a => a.id === id ? { ...a, [key]: val } : a) }));
  }

  const [showSpellPicker, setShowSpellPicker] = useState(false);

  function addSpellFromPicker(z) {
    const isHeil = !!z._heilungsDice;
    setForm(f => ({ ...f, zauber: [...(f.zauber||[]), isHeil ? {
      id: uid(), name: z.name,
      istHeilung: true, heilung: z._heilungsDice,
      schaden: null, schadenTyp: null, halbiert: false, istAngriff: false, attr: null, sg: 0,
    } : {
      id: uid(), name: z.name,
      attr: z.rettungswurfAttribut || 'GES',
      sg: z.istAngriff ? 5 : 13,
      schaden: z.schaden, halbiert: z.halbiert, schadenTyp: z.schadenTyp, istAngriff: z.istAngriff,
    }] }));
  }
  function removeSpell(id) {
    setForm(f => ({ ...f, zauber: f.zauber.filter(z => z.id !== id) }));
  }
  function setSpell(id, key, val) {
    setForm(f => ({ ...f, zauber: f.zauber.map(z => z.id === id ? { ...z, [key]: val } : z) }));
  }

  const attrs = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];
  const attrLabels = { STR: 'STR', DEX: 'GES', CON: 'KON', INT: 'INT', WIS: 'WEI', CHA: 'CHA' };

  const ATTR_LABEL_MAP = { GES: 'Geschicklichkeit', KON: 'Konstitution', STR: 'Stärke', INT: 'Intelligenz', WEI: 'Weisheit', CHA: 'Charisma' };

  function buildAktionen() {
    const n = form.angriffeProRunde || 1;
    const attackActions = form.angriffe.filter(a => a.name).map(a => ({
      name: a.name,
      beschreibung: `Nahkampf-Waffenangriff: +${a.bonus} zum Treffen, Reichweite 1,5 m, ein Ziel. Treffer: (${a.schaden}) ${a.schadenstyp}schaden.`,
    }));
    const spellActions = (form.zauber || []).filter(z => z.name && !z.istHeilung).map(z => ({
      name: z.name,
      beschreibung: z.istAngriff
        ? `Fernkampf-Zauberangriff: +${z.sg} zum Treffen, Reichweite 18 m, ein Ziel. Treffer: (${z.schaden}) ${z.schadenTyp || ''}schaden.`
        : `${ATTR_LABEL_MAP[z.attr] || z.attr}srettungswurf gegen SG ${z.sg}. Treffer: (${z.schaden}) Schaden${z.halbiert ? ', halb so viel bei Erfolg' : ''}.`,
    }));
    const healActions = (form.zauber || []).filter(z => z.name && z.istHeilung && z.heilung).map(z => ({
      name: z.name,
      beschreibung: `Heilzauber: Stellt ${z.heilung} Trefferpunkte wieder her bei einem Verbündeten.`,
    }));
    const result = [];
    if (n > 1 && attackActions.length > 0) {
      const names = attackActions.map(a => a.name).join(' und ');
      const multiDesc = n === attackActions.length
        ? `Der Charakter führt ${n} Angriffe durch: ${names}.`
        : `Der Charakter führt ${n} Angriffe durch.`;
      result.push({ name: 'Mehrfachangriff', beschreibung: multiDesc });
    }
    return [...result, ...attackActions, ...spellActions, ...healActions];
  }

  return (
    <div className="sim-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="sim-modal">
        <div className="sim-modal-header">
          <h3>{initial ? `${initial.name} bearbeiten` : 'Spielercharakter'}</h3>
          <button className="sim-modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="sim-modal-body">
          <div className="sim-tabs">
            <button className={`sim-tab ${tab === 'new' ? 'active' : ''}`} onClick={() => setTab('new')}>Neuer Charakter</button>
            <button className={`sim-tab ${tab === 'npc' ? 'active' : ''}`} onClick={() => setTab('npc')}>NPC</button>
            <button className={`sim-tab ${tab === 'encyclopedia' ? 'active' : ''}`} onClick={() => setTab('encyclopedia')}>Spielercharakter</button>
            <button className={`sim-tab ${tab === 'load' ? 'active' : ''}`} onClick={() => setTab('load')}>Gespeichert ({savedPlayers.length})</button>
          </div>

          {tab === 'load' && (
            <div>
              {savedPlayers.length === 0 && <p style={{ color: 'rgba(160,140,255,0.4)', fontSize: '0.8rem' }}>Keine gespeicherten Charaktere.</p>}
              <div className="sim-saved-chars">
                {savedPlayers.map(p => {
                  const inGroup = (currentGroup || []).some(c => c.id === p.id);
                  return (
                  <div key={p.id} className={`sim-saved-char-row${inGroup ? ' sim-saved-char-row-dimmed' : ''}`}>
                    <div className="sim-saved-char-name">{p.name}{inGroup && <span style={{ fontSize:'0.62rem', color:'rgba(160,140,255,0.4)', marginLeft:6 }}>✓</span>}</div>
                    <div className="sim-saved-char-meta">{p.klasse} Stufe {p.stufe} · {p.maxTp} TP · RK {p.rk}</div>
                    <button className="sim-btn sim-btn-ghost" style={{ padding: '5px 10px', fontSize: '0.68rem' }} onClick={() => { onAddExisting(p); onClose(); }}>Hinzufügen</button>
                    <button className="sim-btn sim-btn-danger" style={{ padding: '5px 8px', fontSize: '0.68rem' }} onClick={() => onDelete(p.id)}>✕</button>
                  </div>
                  );
                })}
              </div>
            </div>
          )}

          {tab === 'npc' && (
            <div style={{ padding: '32px 20px', textAlign: 'center', color: 'rgba(160,140,255,0.3)', fontSize: '0.8rem' }}>
              NPC-Erstellung folgt noch.
            </div>
          )}

          {tab === 'encyclopedia' && (
            <div style={{ padding: '32px 20px', textAlign: 'center', color: 'rgba(160,140,255,0.3)', fontSize: '0.8rem' }}>
              Vorgefertigte Charaktere aus der Enzyklopädie folgen noch.
            </div>
          )}

          {tab === 'new' && (
            <div className="sim-form">
              {/* ── Name + Klasse ── */}
              <div className="sim-form-row">
                <div>
                  <div className="sim-form-label">Name</div>
                  <input className="sim-form-input" value={form.name} onChange={e => set('name', e.target.value)} placeholder="Charakter Name" autoFocus />
                </div>
                <div>
                  <div className="sim-form-label">Klasse</div>
                  <select
                    className="sim-form-select"
                    value={customKlasse ? '__custom' : (form.klasse || '')}
                    onChange={e => {
                      if (e.target.value === '__custom') { setCustomKlasse(true); set('klasse', ''); }
                      else { setCustomKlasse(false); set('klasse', e.target.value); }
                    }}
                  >
                    <option value="">— Klasse wählen —</option>
                    {KLASSEN.map(k => <option key={k} value={k}>{k}</option>)}
                    <option value="__custom">Andere…</option>
                  </select>
                  {customKlasse && (
                    <input className="sim-form-input" style={{ marginTop: 4 }} value={form.klasse}
                      onChange={e => set('klasse', e.target.value)} placeholder="Klassenname" autoFocus />
                  )}
                </div>
              </div>

              {/* ── Stufe / TP / RK / Angriffe/Runde ── */}
              <div className="sim-form-row" style={{ gridTemplateColumns: '1fr 1fr 1fr 1fr' }}>
                <div>
                  <div className="sim-form-label">Stufe</div>
                  <input className="sim-form-input" type="number" min={1} max={20} value={form.stufe} onChange={e => set('stufe', +e.target.value)} />
                </div>
                <div>
                  <div className="sim-form-label">Trefferpunkte</div>
                  <input className="sim-form-input" type="number" min={1} value={form.maxTp} onChange={e => set('maxTp', +e.target.value)} />
                </div>
                <div>
                  <div className="sim-form-label">Rüstungsklasse</div>
                  <input className="sim-form-input" type="number" min={1} max={30} value={form.rk} onChange={e => set('rk', +e.target.value)} />
                </div>
                <div>
                  <div className="sim-form-label">Angriffe/Runde</div>
                  <input className="sim-form-input" type="number" min={1} max={10} value={form.angriffeProRunde || 1} onChange={e => set('angriffeProRunde', +e.target.value)} title="Extra Attack: 2, …" />
                </div>
              </div>

              {/* ── Attribute ── */}
              <div className="sim-form-section">Attribute</div>
              <div className="sim-form-row-6">
                {attrs.map(a => (
                  <div key={a}>
                    <div className="sim-form-label">{attrLabels[a]}</div>
                    <input className="sim-form-input" type="number" min={1} max={30}
                      value={form.attribute[a]}
                      onChange={e => set(`attribute.${a}`, +e.target.value)}
                      style={{ textAlign: 'center' }}
                    />
                  </div>
                ))}
              </div>

              {/* ── Rettungswürfe ── */}
              <div className="sim-form-section">Rettungswürfe (Bonus inkl. Übung)</div>
              <div className="sim-form-row-6">
                {[['STR','STR'],['GES','DEX'],['KON','CON'],['INT','INT'],['WEI','WIS'],['CHA','CHA']].map(([label, key]) => (
                  <div key={key}>
                    <div className="sim-form-label">{label}</div>
                    <input className="sim-form-input" type="number" min={-5} max={20}
                      value={form.rettungswuerfe[key] ?? Math.floor(((form.attribute[key] || 10) - 10) / 2)}
                      onChange={e => set(`rettungswuerfe.${key}`, +e.target.value)}
                      style={{ textAlign: 'center' }}
                    />
                  </div>
                ))}
              </div>

              {/* ── Angriffe ── */}
              <div className="sim-form-section">Angriffe
                <span style={{ fontFamily: 'var(--font-body)', fontSize: '0.65rem', color: 'rgba(160,140,255,0.3)', marginLeft: 8, textTransform: 'none', letterSpacing: 0 }}>
                  Name · +Bonus · Würfel · Schadenstyp
                </span>
              </div>
              <div className="sim-attack-list">
                {form.angriffe.map(atk => (
                  <div key={atk.id} className="sim-attack-row">
                    <input className="sim-form-input" placeholder="Name" value={atk.name} onChange={e => setAttack(atk.id, 'name', e.target.value)} />
                    <input className="sim-form-input" type="number" placeholder="+Bon" value={atk.bonus} onChange={e => setAttack(atk.id, 'bonus', +e.target.value)} title="Angriffsbonus" />
                    <input className="sim-form-input" placeholder="1W8+3" value={atk.schaden} onChange={e => setAttack(atk.id, 'schaden', e.target.value)} title="Schadenswürfel" />
                    <input className="sim-form-input" placeholder="Typ (opt.)" value={atk.schadenstyp} onChange={e => setAttack(atk.id, 'schadenstyp', e.target.value)} />
                    <button className="sim-combatant-remove" onClick={() => removeAttack(atk.id)} title="Angriff entfernen">✕</button>
                  </div>
                ))}
                <button className="sim-btn sim-btn-ghost" style={{ alignSelf: 'flex-start', marginTop: 4 }} onClick={addAttack}>+ Angriff</button>
              </div>

              {/* ── Zauber ── */}
              <div className="sim-form-section">Zauber
                <span style={{ fontFamily: 'var(--font-body)', fontSize: '0.65rem', color: 'rgba(160,140,255,0.3)', marginLeft: 8, textTransform: 'none', letterSpacing: 0 }}>
                  SG = dein Zauber-Rettungswurf-SG
                </span>
              </div>
              <div className="sim-attack-list">
                {(form.zauber || []).map(z => z.istHeilung ? (
                  <div key={z.id} style={{ display: 'grid', gridTemplateColumns: '1fr auto 28px', gap: 6, alignItems: 'center' }}>
                    <div style={{ fontSize: '0.8rem', fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                      💚 {z.name}
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                      <span style={{ fontSize: '0.68rem', color: 'rgba(160,140,255,0.4)' }}>Heilung</span>
                      <input className="sim-form-input" type="text" value={z.heilung || ''}
                        onChange={e => setSpell(z.id, 'heilung', e.target.value)}
                        style={{ width: 72 }} title="Heilungswürfel (z.B. 1W8+3)" />
                    </div>
                    <button className="sim-combatant-remove" onClick={() => removeSpell(z.id)} title="Zauber entfernen">✕</button>
                  </div>
                ) : (
                  <div key={z.id} style={{ display: 'grid', gridTemplateColumns: '1fr auto 60px 28px', gap: 6, alignItems: 'center' }}>
                    <div style={{ fontSize: '0.8rem', fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                      {z.name}
                      <span style={{ fontSize: '0.68rem', color: 'rgba(160,140,255,0.45)', marginLeft: 6, fontFamily: 'var(--font-mono)' }}>
                        {z.schaden} {z.schadenTyp} {z.halbiert ? '· ½' : ''} {z.istAngriff ? '(Angriff)' : '(Save ' + z.attr + ')'}
                      </span>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                      <span style={{ fontSize: '0.68rem', color: 'rgba(160,140,255,0.4)' }}>{z.istAngriff ? 'Bonus' : 'SG'}</span>
                      <input className="sim-form-input" type="number" min={-5} max={30} value={z.sg}
                        onChange={e => setSpell(z.id, 'sg', +e.target.value)}
                        style={{ width: 52 }} title={z.istAngriff ? 'Zauberangriffs-Bonus' : 'Dein Zauber-SG'} />
                    </div>
                    <div style={{ fontSize: '0.68rem', color: 'rgba(160,140,255,0.35)', fontFamily: 'var(--font-mono)', textAlign: 'right' }}>
                      {z.attr || 'Angriff'}
                    </div>
                    <button className="sim-combatant-remove" onClick={() => removeSpell(z.id)} title="Zauber entfernen">✕</button>
                  </div>
                ))}
                <button className="sim-btn sim-btn-ghost" style={{ alignSelf: 'flex-start', marginTop: 4 }} onClick={() => setShowSpellPicker(true)}>+ Zauber suchen</button>
              </div>
              {showSpellPicker && <SpellPicker onAdd={addSpellFromPicker} onClose={() => setShowSpellPicker(false)} />}

              <div style={{ display: 'flex', gap: 10, marginTop: 12, alignItems: 'center' }}>
                <button className="sim-btn sim-btn-primary" onClick={() => {
                  if (!form.name.trim()) return;
                  clearDraft();
                  const p = { ...form, _kind: 'player', tp: form.maxTp, aktionen: buildAktionen() };
                  onSave(p);
                  onClose();
                }}>Speichern & Hinzufügen</button>
                {isNew && loadDraft() && (
                  <button className="sim-btn sim-btn-ghost" style={{ fontSize: '0.68rem', opacity: 0.6 }} onClick={() => {
                    clearDraft();
                    const blank = { ...EMPTY_PLAYER, id: uid() };
                    setForm(blank);
                    setCustomKlasse(false);
                  }}>Entwurf verwerfen</button>
                )}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── Group Panel ───────────────────────────────────────────────────────────────
function GroupPanel({ label, group, onAdd, onRemove, onAddClone, onAddOpponent, onAddPlayer, onDetail, onEditPlayer, onSessionChange, showMatch, matchEnabled, onMatch, difficulty, onDifficulty, monsterFilter, onMonsterFilter, coherent, onCoherent, canRevert, onRevert }) {
  const totalXP = group.filter(c => c._kind === 'monster').reduce((s, c) => s + (c.xp || 0), 0);
  // Group identical monsters, keep players individual
  const displayGroups = useMemo(() => {
    const result = [];
    const monsterIdx = new Map();
    for (let i = 0; i < group.length; i++) {
      const c = group[i];
      if (c._kind !== 'monster') { result.push({ c, indices: [i], members: [c] }); continue; }
      const key = c.name + (c.source || '');
      if (monsterIdx.has(key)) { result[monsterIdx.get(key)].indices.push(i); result[monsterIdx.get(key)].members.push(c); }
      else { monsterIdx.set(key, result.length); result.push({ c, indices: [i], members: [c] }); }
    }
    return result;
  }, [group]);
  const all = useMemo(() => (window.MONSTER_DATA || []).filter(m => m.name && m.tp), []);
  const allArts      = useMemo(() => [...new Set(all.map(m => m.art).filter(Boolean))].sort((a,b) => a.localeCompare(b,'de')), [all]);
  const allUnterarts = useMemo(() => [...new Set(all.map(m => m.unterart).filter(Boolean))].sort((a,b) => a.localeCompare(b,'de')), [all]);
  const allUmgebungen = useMemo(() => [...new Set(all.flatMap(m => Array.isArray(m.umgebung) ? m.umgebung : m.umgebung ? [m.umgebung] : []))].sort((a,b) => a.localeCompare(b,'de')), [all]);
  const setF = (key, val) => onMonsterFilter(f => ({ ...f, [key]: val }));
  const activeFilters = [monsterFilter?.art, monsterFilter?.unterart, monsterFilter?.umgebung].filter(Boolean).length;
  const DIFF_OPTS = [
    { val: 'trivial',  label: 'Trivial' },
    { val: 'leicht',   label: 'Leicht' },
    { val: 'normal',   label: 'Normal' },
    { val: 'schwer',   label: 'Schwer' },
    { val: 'toedlich', label: 'Tödlich' },
  ];
  return (
    <div className="sim-group">
      <div className="sim-group-header">
        <h2>{label}</h2>
        <span className="sim-group-xp">{group.length} Kämpfer{totalXP > 0 ? ` · ${totalXP} XP` : ''}</span>
      </div>
      <div className="sim-combatant-list">
        {group.length === 0 && (
          <div style={{ color: 'rgba(160,140,255,0.25)', fontSize: '0.75rem', textAlign: 'center', padding: '20px 0' }}>
            Noch keine Kämpfer
          </div>
        )}
        {displayGroups.map(({ c, indices, members }) => (
          <CombatantCard
            key={c._uid || c.name + indices[0]}
            c={c}
            members={members}
            count={indices.length}
            onRemove={() => onRemove(indices[indices.length - 1])}
            onAddOne={c._kind === 'monster' && onAddClone ? () => onAddClone(c) : undefined}
            onDetail={c._kind === 'monster' ? () => onDetail && onDetail(c) : undefined}
            onEdit={c._kind === 'player' ? () => onEditPlayer && onEditPlayer(c) : undefined}
            onSessionChange={onSessionChange || undefined}
          />
        ))}
      </div>
      <div className="sim-group-actions">
        <button className="sim-btn sim-btn-ghost" onClick={onAdd}>+ Monster</button>
        <button className="sim-btn sim-btn-ghost" onClick={onAddPlayer}>+ Spieler</button>
        {group.length > 0 && <button className="sim-btn sim-btn-danger" onClick={() => { for (let i = group.length - 1; i >= 0; i--) onRemove(i); }}>Leeren</button>}
        {canRevert && <button className="sim-btn sim-btn-revert" onClick={onRevert} title="Zur vorherigen Aufstellung zurückkehren">↩ Rückgängig</button>}
        {showMatch && (
          <div className="sim-match-bar">
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 4 }}>
              <select className="sim-form-select sim-filter-select" value={monsterFilter?.art || ''} onChange={e => setF('art', e.target.value)} title="Art filtern">
                <option value="">Alle Arten</option>
                {allArts.map(a => <option key={a} value={a}>{a}</option>)}
              </select>
              <select className="sim-form-select sim-filter-select" value={monsterFilter?.unterart || ''} onChange={e => setF('unterart', e.target.value)} title="Unterart filtern">
                <option value="">Alle Unterarten</option>
                {allUnterarts.map(a => <option key={a} value={a}>{a}</option>)}
              </select>
              <select className="sim-form-select sim-filter-select" value={monsterFilter?.umgebung || ''} onChange={e => setF('umgebung', e.target.value)} title="Umgebung filtern">
                <option value="">Alle Umgebungen</option>
                {allUmgebungen.map(a => <option key={a} value={a}>{a}</option>)}
              </select>
            </div>
            {activeFilters > 0 && (
              <div style={{ fontSize: '0.64rem', color: 'rgba(160,140,255,0.4)', display: 'flex', justifyContent: 'space-between', padding: '2px 1px' }}>
                <span>{activeFilters} Filter aktiv</span>
                <button style={{ background:'none', border:'none', color:'rgba(160,140,255,0.45)', cursor:'pointer', fontSize:'0.64rem', padding:0 }} onClick={() => onMonsterFilter({ art:'', unterart:'', umgebung:'' })}>Filter leeren</button>
              </div>
            )}
            <div className="sim-diff-toggle">
              {DIFF_OPTS.map(o => (
                <button key={o.val}
                  className={`sim-diff-btn ${difficulty === o.val ? 'active' : ''}`}
                  onClick={() => onDifficulty(o.val)}>
                  {o.label}
                </button>
              ))}
              <label className="sim-coherence-row" title="Gegner teilen Art / Unterart / Umgebung">
                <span className="sim-coherence-label">Kohärenz</span>
                <span className={`sim-toggle${coherent ? ' on' : ''}`} onClick={() => onCoherent(v => !v)}>
                  <span className="sim-toggle-thumb" />
                </span>
              </label>
            </div>
            <div style={{ display: 'flex', gap: 6 }}>
              <button className="sim-btn sim-btn-match" disabled={!matchEnabled} onClick={onMatch}
                title={matchEnabled ? '' : 'Zuerst Gruppe 1 befüllen'}>
                ⚔ Passende Gegner
              </button>
              <button className="sim-btn sim-btn-addone" disabled={!matchEnabled} onClick={onAddOpponent}
                title={matchEnabled ? '+ 1 passenden Gegner hinzufügen' : 'Zuerst Gruppe 1 befüllen'}>
                + 1 Gegner
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function EncounterRating({ group1, group2 }) {
  const rating = useMemo(() => calcEncounterDifficulty(group1, group2), [group1, group2]);
  if (!rating) return null;
  const DIFF_NAMES = ['Trivial','Leicht','Normal','Schwer','Tödlich'];
  const pips = ['enc-trivial','enc-easy','enc-medium','enc-hard','enc-deadly'];
  const activePip = pips.indexOf(rating.cls);
  return (
    <div className="enc-rating">
      <div className="enc-rating-main">
        <div className="enc-pips">
          {pips.map((cls, i) => (
            <span key={cls} className={`enc-pip ${cls}${i <= activePip ? ' lit' : ''}`} title={DIFF_NAMES[i]} />
          ))}
        </div>
        <span className={`enc-label ${rating.cls}`}>{rating.label}</span>
        <span className="enc-xp">{Math.round(rating.adjXP).toLocaleString('de')} XP</span>
      </div>
      {rating.sub && <div className="enc-sub">{rating.sub}</div>}
    </div>
  );
}

function Chevron({ open }) {
