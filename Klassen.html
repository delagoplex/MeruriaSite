// ── HEXAGON helper ─────────────────────────────────────
function hexPoints(s) {
  const cx = s/2, cy = s/2, r = s/2;
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = (Math.PI/180)*(60*i-30);
    pts.push(`${cx+r*Math.cos(a)},${cy+r*Math.sin(a)}`);
  }
  return pts.join(' ');
}
function OctSvg({ size=24, color='currentColor', fill='none', strokeWidth=1, opacity=1, style={} }) {
  const pts = hexPoints(size);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ display:'block', flexShrink:0, ...style }}>
      <polygon points={pts} fill={fill} stroke={color} strokeWidth={strokeWidth} opacity={opacity} />
    </svg>
  );
}

// ── SCROLL REVEAL ──────────────────────────────────────
function useScrollReveal(dep) {
  useEffect(() => {
    document.querySelectorAll('.reveal-up.visible,.reveal-left.visible').forEach(el => el.classList.remove('visible'));
    let observer;
    const revealedEls = new WeakSet();
    const revealEl = (el, delay) => {
      if (revealedEls.has(el)) return;
      revealedEls.add(el);
      setTimeout(() => el.classList.add('visible'), delay);
    };
    const init = () => {
      observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          const el = entry.target;
          observer.unobserve(el);
          if (el.classList.contains('reveal-left')) { revealEl(el, 0); return; }
          const parent = el.parentElement;
          if (!parent) { revealEl(el, 0); return; }
          const siblings = Array.from(parent.querySelectorAll('.reveal-up'));
          const rowMap = new Map();
          siblings.forEach(sib => {
            const top = Math.round(sib.getBoundingClientRect().top);
            if (!rowMap.has(top)) rowMap.set(top, []);
            rowMap.get(top).push(sib);
          });
          const sortedTops = Array.from(rowMap.keys()).sort((a,b)=>a-b);
          const elTop = Math.round(el.getBoundingClientRect().top);
          const rowIndex = sortedTops.indexOf(elTop);
          const rowDelay = Math.max(0, rowIndex)*80;
          const rowEls = rowMap.get(elTop)||[el];
          rowEls.forEach(rowEl => { observer.unobserve(rowEl); revealEl(rowEl, rowDelay); });
        });
      }, { threshold: 0.06, rootMargin: '0px 0px -24px 0px' });
      document.querySelectorAll('.reveal-up,.reveal-left').forEach(el => { el.classList.remove('visible'); observer.observe(el); });
    };
    const t = setTimeout(init, 120);
    return () => { clearTimeout(t); observer && observer.disconnect(); };
  }, [dep]);
}

// ── CLASS CARD ─────────────────────────────────────────
function KlasseCard({ klasse, onClick }) {

    const y = (e.clientY-rect.top)/rect.height;
    cancelAnimationFrame(frameRef.current);
    frameRef.current = requestAnimationFrame(() => setTilt({ rx:(y-0.5)*-16, ry:(x-0.5)*16 }));
  }, []);

  const handleMouseLeave = () => { setHov(false); cancelAnimationFrame(frameRef.current); setTilt({ rx:0, ry:0 }); };

            {/* Accent tint */}

          </div>

// ── TOC SIDEBAR ────────────────────────────────────────
function TOCSidebar({ navHeight, headerBottom, cols }) {
  const asideRef = React.useRef(null);

  useEffect(() => {
    const update = () => {
      const ideal = (headerBottom || 0) - window.scrollY;
      const val = Math.max(navHeight, ideal);
      if (asideRef.current) { asideRef.current.style.top = val + 'px'; asideRef.current.style.height = `calc(100vh - ${val}px)`; }
    };
    update();
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update, { passive: true });
    return () => { window.removeEventListener('scroll', update); window.removeEventListener('resize', update); };
  }, [headerBottom, navHeight]);

  const scrollTo = (id) => {
    const el = document.getElementById(id);
    if (el) { const y = el.getBoundingClientRect().top+window.scrollY-navHeight-8; window.scrollTo({ top:y, behavior:'smooth' }); }
  };

  const entries = [];
  for (let i=0; i<klassen.length; i+=cols) {
    const row = klassen.slice(i, i+cols);
    const rowId = `klassen-row-${Math.floor(i/cols)}`;
    entries.push({ id:rowId, label:row.map(k=>k.name).join(' ● '), isSection:true });
  }

  return (
    <aside ref={asideRef} style={{ width:'var(--sidebar-w)', flexShrink:0, position:'fixed', top:`275px`, left:0, height:`calc(100vh - ${navHeight}px)`, borderRight:'1px solid rgba(160,140,255,0.1)', padding:'28px 0', background:'rgba(5,4,15,0.85)', backdropFilter:'blur(12px)', zIndex:50, overflowY:'auto' }}>
      <div style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.25em', color:'rgba(160,140,255,0.4)', textTransform:'uppercase', padding:'0 20px', marginBottom:'4px' }}>Klassen</div>
      {entries.map(entry => (
        <button key={entry.id} onClick={()=>scrollTo(entry.id)}
          style={{ display:'flex', alignItems:'flex-start', gap:'8px', width:'100%', textAlign:'left', padding:'7px 20px', background:'transparent', border:'none', cursor:'pointer', fontFamily:'var(--font-body)', fontWeight:'400', fontSize:'11px', letterSpacing:'0.1em', fontVariant:'small-caps', color:entry.isSection?'rgba(200,190,240,0.75)':'rgba(200,190,240,0.6)', borderLeft:'2px solid transparent', transition:'all 0.15s', lineHeight:1.55 }}
          onMouseEnter={e=>{ e.currentTarget.style.color='#f0eeff'; e.currentTarget.style.borderLeftColor='rgba(124,77,255,0.6)'; e.currentTarget.style.background='rgba(124,77,255,0.06)'; }}
          onMouseLeave={e=>{ e.currentTarget.style.color=entry.isSection?'rgba(200,190,240,0.75)':'rgba(200,190,240,0.6)'; e.currentTarget.style.borderLeftColor='transparent'; e.currentTarget.style.background='transparent'; }}>
          <OctSvg size={entry.isSection?6:4} color={entry.isSection?'rgba(124,77,255,0.6)':'rgba(124,77,255,0.3)'} fill={entry.isSection?'rgba(124,77,255,0.3)':'transparent'} strokeWidth={1} style={{ flexShrink:0, marginTop:'3px' }} />
          <span style={{ display:'block', minWidth:0, wordBreak:'normal', overflowWrap:'anywhere', fontWeight:entry.isSection?'500':'400' }}>{entry.label}</span>
        </button>
      ))}
    </aside>
  );
}

// ── APP ────────────────────────────────────────────────
function App() {
  const [selectedKlasse, setSelectedKlasse] = useState(null);
  const [mouse, setMouse] = useState({ x:0.5, y:0.5 });
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [headerBottom, setHeaderBottom] = useState(0);
  const sideNavRef = useRef(null);

  const handleMouseMove = useCallback(e => { setMouse({ x:e.clientX/window.innerWidth, y:e.clientY/window.innerHeight }); }, []);

  useEffect(() => {
    const measure = () => {
      if (sideNavRef.current) {
        const rect = sideNavRef.current.getBoundingClientRect();
        setHeaderBottom(rect.bottom + window.scrollY + 32);
      }
    };
    measure();
    window.addEventListener('resize', measure, { passive: true });
    return () => window.removeEventListener('resize', measure);
  }, [tweaks.headerHeight]);

  useScrollReveal(tweaks.columns);

  const cols = tweaks.columns || 3;

  const renderGrid = () => {
    const rows = [];
    for (let i=0; i<klassen.length; i+=cols) {
      const rowItems = klassen.slice(i, i+cols);
      const rowId = `klassen-row-${Math.floor(i/cols)}`;
      rows.push(
        <div key={rowId} id={rowId} style={{ display:'grid', gridTemplateColumns:`repeat(${cols},1fr)`, gap:'16px', marginBottom:'16px', scrollMarginTop:`${NAV_H+8}px`, overflow:'visible' }}>
          {rowItems.map(k => <KlasseCard key={k.id} klasse={k} onClick={setSelectedKlasse} />)}
        </div>
      );
    }
    return rows;
  };

  return (
    <div onMouseMove={handleMouseMove} className="page-root">
      {tweaks.showParticles && <ParticleField mouseX={mouse.x} mouseY={mouse.y} />}
      <FloatingHexField mouseX={mouse.x} mouseY={mouse.y} />

      {/* HEADER */}
      <PageHeader height={tweaks.headerHeight} />

      {/* NAV */}
      <div ref={sideNavRef}>
        <SiteNav rightLabel="KLASSEN-ARCHIV v1.0" />
      </div>

      {/* BODY */}
      <div className="page-body">
        <TOCSidebar navHeight={NAV_H} headerBottom={headerBottom} cols={cols} />

        <div style={{ flex:1, padding:'32px 28px 64px', minWidth:0 }}>

          {/* Page title */}
          <div style={{ marginBottom:'32px' }}>
            <div style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.25em', color:'rgba(160,140,255,0.4)', textTransform:'uppercase', marginBottom:'6px' }}>Charaktererstellung</div>
            <h1 className="reveal-left" style={{ fontFamily:'var(--font-display)', fontSize:'42px', fontWeight:'300', letterSpacing:'0.18em', color:'#f0eeff', textShadow:'0 0 30px rgba(124,77,255,0.35)' }}>Klassen</h1>
            <div style={{ display:'flex', alignItems:'center', gap:'8px', marginTop:'12px' }}>
              <div style={{ width:'50px', height:'1px', background:'linear-gradient(90deg,rgba(124,77,255,0.8),transparent)', animation:'pulse-glow 3s infinite' }} />
              <OctSvg size={8} color="rgba(124,77,255,0.5)" fill="rgba(124,77,255,0.2)" strokeWidth={1} />
            </div>
          </div>

          {/* Klassen section */}
          <div id="klassen-section" style={{ marginBottom:'48px', scrollMarginTop:`${NAV_H+8}px` }}>
            <div style={{ marginTop:'20px', overflow:'visible' }}>
              {renderGrid()}
            </div>
          </div>

        </div>
      </div>

      {/* FOOTER */}
      <SiteFooter />

      {/* DETAIL OVERLAY */}
      {selectedKlasse && <KlasseDetail klasse={selectedKlasse} onBack={()=>setSelectedKlasse(null)} />}

      <FloatNav />
      <TweaksPanel>
        <TweakSection label="Layout" />
        <TweakSlider id="columns" label="Spalten" min={2} max={4} step={1} />
        <TweakSlider id="headerHeight" label="Kopfzeile Höhe" min={80} max={320} step={10} />
        <TweakSection label="Darstellung" />
        <TweakToggle id="showParticles" label="Partikel" />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>


</body></html>
