<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg:#05040f; --bg2:#0a0820; --white:#f0eeff;
  --purple:#7c4dff; --border:rgba(160,140,255,0.13);
  --silver:rgba(200,190,240,0.65);
  --glyph:rgba(150,140,210,0.5);
  --font-display:'Cinzel',serif; --font-body:'Raleway',sans-serif; --font-mono:'Share Tech Mono',monospace;
}
html,body { width:100%; min-height:100%; background:var(--bg); color:var(--white); font-family:var(--font-body); overflow-x:hidden; }
#root { width:100%; min-height:100vh; }
body::before {
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(60% 46% at 50% 12%, rgba(58,40,128,0.22), transparent 72%),
    radial-gradient(64% 56% at 82% 90%, rgba(28,64,112,0.13), transparent 74%);
}
body::after { content:''; position:fixed; inset:0; pointer-events:none; z-index:9999; background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px); }
::-webkit-scrollbar{width:4px;height:4px} ::-webkit-scrollbar-track{background:transparent} ::-webkit-scrollbar-thumb{background:rgba(124,77,255,0.28);border-radius:2px} ::-webkit-scrollbar-thumb:hover{background:rgba(124,77,255,0.45)}
::selection { background:rgba(124,77,255,0.4); color:#fff; }

@keyframes backdropIn { from{opacity:0} to{opacity:1} }
@keyframes panelIn { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)} }
@keyframes lockPulse { 0%,100%{opacity:0.82} 50%{opacity:0.5} }
@keyframes pulseGlow { 0%,100%{opacity:0.4} 50%{opacity:0.95} }

/* ── opener ── */
.stage { position:relative; z-index:1; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 18px; }
.opener { display:flex; flex-direction:column; align-items:center; gap:18px; text-align:center; animation:panelIn 0.5s ease both; }
.opener .kick { font-family:var(--font-mono); font-size:9px; letter-spacing:0.34em; color:rgba(124,77,255,0.6); text-transform:uppercase; }
.opener h2 { font-family:var(--font-display); font-weight:300; font-size:25px; letter-spacing:0.22em; color:var(--white); text-transform:uppercase; }
.opener p { font-family:var(--font-body); font-weight:300; font-size:13.5px; color:var(--silver); max-width:430px; line-height:1.8; }
.open-btn { margin-top:6px; cursor:pointer; background:rgba(124,77,255,0.06); border:1px solid rgba(124,77,255,0.3); color:var(--white); font-family:var(--font-mono); font-size:10px; letter-spacing:0.26em; text-transform:uppercase; padding:13px 26px; border-radius:3px; transition:all 0.2s; display:flex; align-items:center; gap:10px; }
.open-btn:hover { border-color:rgba(124,77,255,0.65); background:rgba(124,77,255,0.12); }

/* ── modal ── */
.backdrop { position:fixed; inset:0; z-index:50; display:flex; align-items:flex-start; justify-content:center; padding:40px 18px; overflow-y:auto; background:rgba(3,2,10,0.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); animation:backdropIn 0.3s ease both; }

.panel {
  position:relative; width:100%; max-width:760px; margin:auto;
  background:linear-gradient(180deg, #0c0a22 0%, var(--bg2) 40%, #07060f 100%);
  border:1px solid var(--border);
  box-shadow:0 30px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(160,140,255,0.05);
  animation:panelIn 0.42s cubic-bezier(0.2,0.8,0.25,1) both;
}
/* top accent rail */
.panel::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg, transparent, rgba(124,77,255,0.85) 28%, rgba(124,77,255,0.85) 72%, transparent); }

.close { position:absolute; top:14px; right:14px; z-index:6; width:26px; height:26px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-family:var(--font-mono); font-size:13px; color:rgba(200,190,240,0.5); background:rgba(124,77,255,0.06); border:1px solid var(--border); border-radius:3px; transition:all 0.18s; }
.close:hover { color:var(--white); border-color:rgba(124,77,255,0.5); background:rgba(124,77,255,0.16); }

/* ── header ── */
.head { display:flex; align-items:center; gap:22px; padding:26px 28px 22px; border-bottom:1px solid var(--border); }
.head-main { flex:1; min-width:0; }
.kicker { font-family:var(--font-mono); font-size:8.5px; letter-spacing:0.3em; color:rgba(124,77,255,0.6); text-transform:uppercase; margin-bottom:9px; }
.title-row { display:flex; align-items:flex-start; gap:11px; }
.title-row .hx { margin-top:7px; flex:none; }
.r-title { font-family:var(--font-display); font-weight:400; font-size:clamp(19px,2.4vw,25px); line-height:1.28; letter-spacing:0.1em; color:#eee9ff; text-transform:uppercase; text-wrap:balance; }
.cat-line { display:flex; align-items:center; gap:9px; margin-top:13px; flex-wrap:wrap; }
.cat-dot { width:7px; height:7px; border-radius:50%; flex:none; }
.cat-txt { font-family:var(--font-mono); font-size:9px; letter-spacing:0.18em; text-transform:uppercase; }
.cat-sep { color:rgba(160,140,255,0.3); font-size:10px; }
.under { width:46px; height:1px; background:linear-gradient(90deg, rgba(124,77,255,0.8), transparent); margin-top:16px; animation:pulseGlow 3.2s infinite; }

/* illustration plate */
.plate-col { display:flex; flex-direction:column; margin-top:30px; }
.plate { position:relative; width:168px; height:168px; flex:none; }
.plate image-slot { display:block; width:100%; height:100%; border:1px solid rgba(160,140,255,0.2); background:linear-gradient(135deg, rgba(124,77,255,0.05) 25%, transparent 25%, transparent 50%, rgba(124,77,255,0.05) 50%, rgba(124,77,255,0.05) 75%, transparent 75%); background-size:12px 12px; }
.plate .ptick { position:absolute; width:11px; height:11px; pointer-events:none; opacity:0.8; }
.plate .ptick.a { top:-2px; left:-2px; border-top:1px solid var(--purple); border-left:1px solid var(--purple); }
.plate .ptick.b { top:-2px; right:-2px; border-top:1px solid var(--purple); border-right:1px solid var(--purple); }
.plate .ptick.c { bottom:-2px; left:-2px; border-bottom:1px solid var(--purple); border-left:1px solid var(--purple); }
.plate .ptick.d { bottom:-2px; right:-2px; border-bottom:1px solid var(--purple); border-right:1px solid var(--purple); }
.plate-cap { font-family:var(--font-mono); font-size:7.5px; letter-spacing:0.16em; text-transform:uppercase; color:rgba(124,77,255,0.5); text-align:center; margin-top:7px; }

/* body */
.body { padding:22px 28px 26px; }

/* meta grid */
.meta { display:flex; align-items:center; gap:22px; padding:16px 20px; background:rgba(124,77,255,0.045); border:1px solid rgba(160,140,255,0.09); border-radius:3px; }
.meta-grid { flex:1; display:grid; grid-template-columns:1fr 1fr; gap:13px 22px; }
.meta-sg { flex:none; padding-left:22px; border-left:1px solid rgba(160,140,255,0.12); }
.meta-item .ml { font-family:var(--font-mono); font-size:8px; letter-spacing:0.22em; text-transform:uppercase; color:rgba(124,77,255,0.6); margin-bottom:4px; }
.meta-item .mv { font-family:var(--font-body); font-weight:300; font-size:13px; color:rgba(216,208,248,0.82); letter-spacing:0.02em; }

/* description */
.desc { font-family:var(--font-body); font-weight:300; font-style:italic; font-size:13.5px; line-height:1.85; color:rgba(204,194,240,0.72); letter-spacing:0.02em; margin:20px 0 0; text-wrap:pretty; padding-left:16px; border-left:1px solid rgba(124,77,255,0.22); }

/* reveal bar */
.reveal-bar { width:100%; margin-top:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:11px; font-family:var(--font-mono); font-size:10px; letter-spacing:0.22em; text-transform:uppercase; padding:12px; color:rgba(170,150,255,0.9); background:rgba(124,77,255,0.06); border:1px solid rgba(124,77,255,0.3); border-radius:3px; transition:all 0.2s; }
.reveal-bar:hover { border-color:rgba(124,77,255,0.6); background:rgba(124,77,255,0.12); color:var(--white); }
.reveal-bar.done { color:rgba(120,230,180,0.92); border-color:rgba(80,200,150,0.45); background:rgba(80,200,150,0.06); }
.reveal-bar.done:hover { border-color:rgba(80,200,150,0.7); }

/* section header */
.sh { margin:30px 0 16px; }
.sh .sh-kick { font-family:var(--font-mono); font-size:8px; letter-spacing:0.3em; color:rgba(124,77,255,0.5); text-transform:uppercase; margin-bottom:7px; }
.sh .sh-title-row { display:flex; align-items:center; gap:11px; }
.sh h3 { font-family:var(--font-display); font-size:18px; font-weight:300; letter-spacing:0.2em; color:rgba(232,225,255,0.94); text-transform:uppercase; }
.sh .sh-under { width:40px; height:1px; background:linear-gradient(90deg,rgba(124,77,255,0.77),transparent); margin-top:11px; }

/* ingredient table */
.ztable { border:1px solid rgba(124,77,255,0.18); border-radius:3px; overflow:hidden; background:rgba(10,8,28,0.5); }
.zhead, .zrow { display:grid; grid-template-columns:118px 1fr auto; align-items:center; gap:14px; }
.zhead { background:rgba(124,77,255,0.18); padding:9px 16px; }
.zhead span { font-family:var(--font-display); font-size:9.5px; font-weight:400; letter-spacing:0.14em; text-transform:uppercase; color:rgba(240,238,255,0.9); }
.zhead span:last-child { text-align:right; }
.zrow { padding:11px 16px; border-top:1px solid rgba(124,77,255,0.07); transition:background 0.18s; }
.zrow:hover { background:rgba(124,77,255,0.05); }
.zamt { font-family:var(--font-mono); font-size:12px; letter-spacing:0.02em; color:rgba(154,172,228,0.78); white-space:nowrap; }
.zname { font-family:var(--font-body); font-weight:400; font-size:15px; color:#e0e7f4; }
.zcat { justify-self:end; display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:9px; letter-spacing:0.12em; text-transform:uppercase; padding:3px 9px; border-radius:2px; white-space:nowrap; }
.zcat .cd { width:5px; height:5px; border-radius:50%; }

/* result box */
.result-box { padding:18px 20px; background:rgba(124,77,255,0.045); border:1px solid rgba(160,140,255,0.1); border-radius:3px; }
.result-name { font-family:var(--font-display); font-weight:400; font-size:18px; line-height:1.42; letter-spacing:0.05em; color:#dcd6f6; text-transform:uppercase; }
.sg-hex { position:relative; width:74px; height:82px; flex:none; }
.sg-hex svg { position:absolute; inset:0; width:100%; height:100%; }
.sg-overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.sg-overlay .sl { font-family:var(--font-mono); font-size:7.5px; letter-spacing:0.26em; color:rgba(170,150,255,0.7); margin-bottom:1px; }
.sg-overlay .sn { font-family:var(--font-display); font-weight:600; font-size:30px; line-height:1; color:#c9bcff; text-shadow:0 0 14px rgba(124,77,255,0.4); }

/* effect callout */
.eff { border:1px solid rgba(80,200,150,0.4); border-left:2px solid rgba(80,200,150,0.6); background:rgba(80,200,150,0.06); padding:14px 18px; border-radius:0 3px 3px 0; }
.eff .et { font-family:var(--font-mono); font-size:8.5px; letter-spacing:0.2em; text-transform:uppercase; color:rgba(120,230,180,0.9); margin-bottom:8px; }
.eff .etext { font-family:var(--font-body); font-weight:300; font-size:14px; line-height:1.7; color:rgba(214,224,232,0.88); text-wrap:pretty; }

/* footer */
.foot { display:flex; align-items:center; gap:10px; margin-top:24px; padding-top:14px; border-top:1px solid var(--border); font-family:var(--font-mono); font-size:8.5px; letter-spacing:0.18em; text-transform:uppercase; color:rgba(124,77,255,0.5); flex-wrap:wrap; }
.foot .fs { color:rgba(160,140,255,0.28); }

/* scramble */
.scr { transition:color 0.2s, text-shadow 0.2s; }
.scr.locked { cursor:pointer; color:var(--glyph); animation:lockPulse 4.5s ease-in-out infinite; }
.scr.locked:hover { color:rgba(184,170,242,0.9); text-shadow:0 0 12px rgba(124,77,255,0.4); }
.scr.decoding { color:rgba(176,200,238,0.92); }

@media (max-width:580px){
  .head { flex-direction:column-reverse; align-items:flex-start; }
  .plate-col { width:100%; }
  .plate { width:100%; flex:none; min-height:0; height:170px; }
  .meta { flex-direction:column; align-items:stretch; }
  .meta-grid { grid-template-columns:1fr; }
  .meta-sg { padding-left:0; border-left:none; padding-top:14px; border-top:1px solid rgba(160,140,255,0.12); display:flex; justify-content:center; }
  .zhead, .zrow { grid-template-columns:92px 1fr; }
  .zcat { grid-column:2; justify-self:start; margin-top:2px; }
  .zhead span:last-child { display:none; }
  .result-box { flex-direction:column; align-items:flex-start; }
}
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── hexagon ── */
function hexPts(size){ const c=size/2, p=[]; for(let i=0;i<6;i++){ const a=Math.PI/180*(60*i-30); p.push(`${c+c*Math.cos(a)},${c+c*Math.sin(a)}`);} return p.join(' '); }
function Oct({ size=10, color='rgba(124,77,255,0.6)', fill='rgba(124,77,255,0.18)', sw=1, style={} }){
  return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:'block',flexShrink:0,...style}}><polygon points={hexPts(size)} fill={fill} stroke={color} strokeWidth={sw}/></svg>;
}

/* ── glyph scrambler ── */
const GLYPHS = '▪▫□■◇◆▮▯•◦▬│┃⬚'.split('');
const randGlyph = () => GLYPHS[(Math.random()*GLYPHS.length)|0];
const scrambleString = (t) => { let o=''; for(const c of t) o += (c===' '||c==='\n') ? c : randGlyph(); return o; };

function Scramble({ text, revealed, onReveal, tag='span', className='', style }){
  const Tag = tag;
  const [display, setDisplay] = useState(() => revealed ? text : scrambleString(text));
  const [phase, setPhase] = useState(revealed ? 'revealed' : 'locked');
  const rafRef = useRef(null);
  useEffect(() => () => cancelAnimationFrame(rafRef.current), []);
  useEffect(() => {
    if (revealed && phase!=='revealed' && phase!=='decoding') runDecode();
    else if (!revealed && phase==='revealed'){ cancelAnimationFrame(rafRef.current); setDisplay(scrambleString(text)); setPhase('locked'); }
    // eslint-disable-next-line
  }, [revealed]);
  function runDecode(){
    setPhase('decoding');
    const chars=[...text]; const total=460+Math.min(chars.length*20,760); const start=performance.now(); let last=0;
    const step=(now)=>{ const t=now-start;
      if (now-last>32 || t>=total){ last=now; let o='';
        for(let i=0;i<chars.length;i++){ const c=chars[i]; if(c===' '||c==='\n'){o+=c;continue;} const settle=(i/chars.length)*total*0.62+total*0.32; o += (t>=settle)?c:randGlyph(); }
        setDisplay(o);
      }
      if (t<total) rafRef.current=requestAnimationFrame(step); else { setDisplay(text); setPhase('revealed'); }
    };
    rafRef.current=requestAnimationFrame(step);
  }
  const cls = 'scr '+(phase==='revealed'?'revealed':phase)+(className?' '+className:'');
  return <Tag className={cls} style={style}
    role={phase==='locked'?'button':undefined} tabIndex={phase==='locked'?0:undefined}
    title={phase==='locked'?'Klicken zum Entschlüsseln':undefined}
    onClick={phase==='locked'?onReveal:undefined}
    onKeyDown={phase==='locked'?(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();onReveal();}}:undefined}
  >{display}</Tag>;
}

/* ── category colors ── */
const CAT = {
  Fisch:   { c:'rgba(110,170,255,0.92)', bg:'rgba(110,170,255,0.08)', bd:'rgba(110,170,255,0.32)' },
  Pflanze: { c:'rgba(120,220,160,0.9)',  bg:'rgba(120,220,160,0.07)', bd:'rgba(120,220,160,0.3)' },
  Mineral: { c:'rgba(190,190,210,0.9)',  bg:'rgba(190,190,210,0.07)', bd:'rgba(190,190,210,0.3)' },
};

/* ── recipe data (from Bild 1) ── */
const RECIPE = {
  title: 'Geschmorter Zotteliger Seedrache auf Algenbett',
  desc: 'Ein uraltes Küstenrezept der Meereshexen – der Zottelige Seedrache gilt als scheues Wesen der Tiefsee, dessen Fleisch nach Salzwind und wildem Ozean schmeckt. Nur die geduldigen Jäger kommen in den Genuss dieser Delikatesse.',
  meta: [
    { l:'Disziplin', v:'Kochen' },
    { l:'Probe', v:'Weisheit (WEI)' },
    { l:'Zubereitung', v:'1 Stunde' },
    { l:'Portionen', v:'2 Portionen' },
  ],
  zutaten: [
    { amt:'1400 Gramm',  name:'Zotteliger Seedrache', cat:'Fisch' },
    { amt:'300 Gramm',   name:'Adamant-Alge',         cat:'Pflanze' },
    { amt:'4 Zehe',      name:'Flammenknoblauch',     cat:'Pflanze' },
    { amt:'2 Teelöffel', name:'Nordsteinsalz',        cat:'Mineral' },
    { amt:'1 Teelöffel', name:'Cachuga-Pfeffer',      cat:'Pflanze' },
  ],
  ergebnis: 'Geschmorter Zotteliger Seedrache auf Algenbett',
  sg: '14',
  effekt: 'Du erhältst für 8 Stunden +2 auf Konstitutions-Rettungswürfe.',
};
const BLOCK_IDS = ['title','desc', ...RECIPE.zutaten.map((_,i)=>'ing'+i), 'result','sg','effect'];

function SH({ kick, title }){
  return (
    <div className="sh">
      <div className="sh-kick">{kick}</div>
      <div className="sh-title-row"><Oct size={9}/><h3>{title}</h3></div>
      <div className="sh-under"></div>
    </div>
  );
}

function RecipeCard({ onClose }){
  const [revealed, setRevealed] = useState({});
  const reveal = (id) => setRevealed(r => ({ ...r, [id]:true }));
  const allRevealed = BLOCK_IDS.every(id => revealed[id]);
  const toggleAll = () => { if (allRevealed) setRevealed({}); else { const a={}; BLOCK_IDS.forEach(id=>a[id]=true); setRevealed(a); } };

  return (
    <div className="panel" onClick={(e)=>e.stopPropagation()}>
      <button className="close" onClick={onClose} aria-label="Schließen">✕</button>

      {/* header */}
      <div className="head">
        <div className="head-main">
          <div className="kicker">Rezeptkodex · Meereshexen-Küche</div>
          <div className="title-row">
            <span className="hx"><Oct size={12}/></span>
            <Scramble tag="h1" className="r-title" text={RECIPE.title} revealed={!!revealed.title} onReveal={()=>reveal('title')} />
          </div>
          <div className="cat-line">
            <span className="cat-dot" style={{background:CAT.Fisch.c}}></span>
            <span className="cat-txt" style={{color:CAT.Fisch.c}}>Fisch</span>
            <span className="cat-sep">·</span>
            <span className="cat-txt" style={{color:'rgba(180,165,255,0.7)'}}>Geschmort</span>
            <span className="cat-sep">·</span>
            <span className="cat-txt" style={{color:'rgba(180,165,255,0.7)'}}>Delikatesse</span>
          </div>
          <Scramble tag="p" className="desc" text={RECIPE.desc} revealed={!!revealed.desc} onReveal={()=>reveal('desc')} />
        </div>
        <div className="plate-col">
          <div className="plate">
            <image-slot id="rezept-seedrache-bild" shape="rect" fit="cover"
              placeholder="Bild ablegen" style={{ color:'rgba(208,198,240,0.6)' }}></image-slot>
            <span className="ptick a"></span><span className="ptick b"></span>
            <span className="ptick c"></span><span className="ptick d"></span>
          </div>
          <div className="plate-cap">Illustration</div>
        </div>
      </div>

      <div className="body">
        {/* meta */}
        <div className="meta">
          <div className="meta-grid">
            {RECIPE.meta.map((m,i)=>(
              <div className="meta-item" key={i}>
                <div className="ml">{m.l}</div>
                <div className="mv">{m.v}</div>
              </div>
            ))}
          </div>
          <div className="meta-sg">
            <div className="sg-hex"
              role={revealed.sg?undefined:'button'} tabIndex={revealed.sg?undefined:0}
              title={revealed.sg?undefined:'Klicken zum Entschlüsseln'}
              onClick={revealed.sg?undefined:()=>reveal('sg')}
              style={{cursor:revealed.sg?'default':'pointer'}}>
              <svg viewBox="0 0 100 110">
                <polygon points="50,4 92,28 92,82 50,106 8,82 8,28" fill="rgba(124,77,255,0.08)" stroke="rgba(124,77,255,0.5)" strokeWidth="1.5"/>
                <polygon points="50,12 85,32 85,78 50,98 15,78 15,32" fill="none" stroke="rgba(124,77,255,0.18)" strokeWidth="1"/>
              </svg>
              <div className="sg-overlay">
                <span className="sl">SG</span>
                <Scramble tag="span" className="sn" text={RECIPE.sg} revealed={!!revealed.sg} onReveal={()=>reveal('sg')} />
              </div>
            </div>
          </div>
        </div>

        {/* Zutaten */}
        <SH kick="Bestandteile" title="Zutaten" />
        <div className="ztable">
          <div className="zhead"><span>Menge</span><span>Zutat</span><span>Kategorie</span></div>
          {RECIPE.zutaten.map((z,i)=>{
            const k = CAT[z.cat] || CAT.Mineral;
            return (
              <div className="zrow" key={i}>
                <div className="zamt">{z.amt}</div>
                <Scramble tag="div" className="zname" text={z.name} revealed={!!revealed['ing'+i]} onReveal={()=>reveal('ing'+i)} />
                <span className="zcat" style={{ color:k.c, background:k.bg, border:`1px solid ${k.bd}` }}>
                  <span className="cd" style={{background:k.c}}></span>{z.cat}
                </span>
              </div>
            );
          })}
        </div>

        {/* Ergebnis */}
        <SH kick="Resultat" title="Ergebnis" />
        <div className="result-box">
          <Scramble tag="div" className="result-name" text={RECIPE.ergebnis} revealed={!!revealed.result} onReveal={()=>reveal('result')} />
        </div>

        {/* Effekte */}
        <SH kick="Verzehr-Wirkung" title="Effekte" />
        <div className="eff">
          <div className="et">◆ Temporärer Effekt</div>
          <Scramble tag="div" className="etext" text={RECIPE.effekt} revealed={!!revealed.effect} onReveal={()=>reveal('effect')} />
        </div>
      </div>
    </div>
  );
}

function App(){
  const [open, setOpen] = useState(true);
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);
  return (
    <div className="stage">
      <div className="opener">
        <div className="kick">◇ Rezeptkodex der Meereshexen ◇</div>
        <h2>Verschlüsselte Kochkunst</h2>
        <p>Ein Datenblatt aus Merurias Kochkodex. Öffne den Eintrag und entschlüssele Name, Zutaten, Resultat, Schwierigkeit und Wirkung Block für Block.</p>
        <button className="open-btn" onClick={()=>setOpen(true)}><Oct size={10}/> Eintrag öffnen</button>
      </div>
      {open && (
        <div className="backdrop" onClick={()=>setOpen(false)}>
          <RecipeCard onClose={()=>setOpen(false)} />
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>


</body></html>
