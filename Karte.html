<!-- ═══════════════════════════════════════════════════
     Script 1 — Hex math + Supabase (read-only)
     ═══════════════════════════════════════════════════ -->
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ── Hex constants (pointy-top axial) ─────────────────────────
const HEX_SIZE = 96;
const HEX_W    = Math.sqrt(3) * HEX_SIZE;
const HEX_H    = 2 * HEX_SIZE;

const NEIGHBORS = [
  { dq:  1, dr:  0, ang:   0 },
  { dq:  1, dr: -1, ang:  60 },
  { dq:  0, dr: -1, ang: 120 },
  { dq: -1, dr:  0, ang: 180 },
  { dq: -1, dr:  1, ang: 240 },
  { dq:  0, dr:  1, ang: 300 },
];

const APOTHEM = (Math.sqrt(3) / 2) * HEX_SIZE;

function axialToPixel(q, r) {
  return { x: HEX_SIZE * Math.sqrt(3) * (q + r / 2), y: HEX_SIZE * 1.5 * r };
}
function hexKey(q, r) { return `${q},${r}`; }

const TERRAIN_COLORS = {
  'Ebene':      'oklch(0.84 0.14 140)',
  'Wald':       'oklch(0.45 0.17 145)',
  'Sumpf':      'oklch(0.42 0.06 110)',
  'Hügelland':  'oklch(0.72 0.11 105)',
  'Wüste':      'oklch(0.88 0.13 90)',
  'Steppe':     'oklch(0.80 0.13 80)',
  'Kolonie':    'oklch(0.73 0.15 65)',
  'Vulkan':        'oklch(0.58 0.22 28)',
  'Aschenöde':      'oklch(0.65 0.20 42)',
  'Tundra':        'oklch(0.92 0.04 230)',
  'Küste':      'oklch(0.80 0.12 195)',
  'See':        'oklch(0.65 0.15 230)',
  'Ozean':      'oklch(0.40 0.17 255)',
  'Gebirge':    'oklch(0.62 0.04 65)',
  'Hochland':   'oklch(0.72 0.06 285)',
  'Höhle':      'oklch(0.58 0.13 335)',
  'Dschungel':  'oklch(0.52 0.13 155)',
  'Insel':      'oklch(0.78 0.14 185)',
  'Gletscher':  'oklch(0.93 0.06 210)',
  'Magisch':    'oklch(0.72 0.28 310)',
  'Sonstiges':  'oklch(0.65 0.18 295)',
};
const DEFAULT_HEX_COLOR = 'oklch(0.70 0.15 285)';
function terrainColor(t) { return TERRAIN_COLORS[t] || DEFAULT_HEX_COLOR; }

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

// ── Supabase: load only visible hexes ────────────────────────
function rowToHex(h) {
  return {
    id: h.id, q: h.q, r: h.r,
    name: h.name || '', terrain: h.terrain || '',
    features: h.features || '', beschreibung: h.beschreibung || '',
    bild_url: h.bild_url || '', bild_pos: h.bild_pos || null, banner_url: h.banner_url || '',
    has_submap: !!h.has_submap, submap_id: h.submap_id || null,
    tags: h.tags || [],
    datensonde: !!h.datensonde,
    kolonie: h.kolonie || null,
    ressourcen: h.ressourcen || {},
    bevoelkerung: h.bevoelkerung || '',
    kolonien: h.kolonien || '',
    erkundung: h.erkundung || [],
  };
}

const MAP_COLS = 'id, name, bg_url, bg_transform, kind, ebene, floors';

// Feste Hierarchie: Welt → Region → Gebiet (Hex) → Ort (Bild)
const EBENEN = ['Welt', 'Region', 'Gebiet', 'Ort'];
function depthEbene(depth) { return EBENEN[Math.min(depth, 3)]; }

async function loadRootMap() {
  const { data } = await window._sb.from('karte_maps')
    .select(MAP_COLS)
    .is('parent_hex_id', null)
    .order('created_at', { ascending: true })
    .limit(1)
    .maybeSingle();
  return data; // null if no map exists yet
}

async function loadMap(mapId) {
  const { data } = await window._sb.from('karte_maps')
    .select(MAP_COLS).eq('id', mapId).single();
  return data;
}

async function loadVisibleHexes(mapId) {
  const { data } = await window._sb.from('karte_hexes')
    .select('*').eq('map_id', mapId).eq('visible', true);
  return Object.fromEntries(
    (data || []).map(h => [hexKey(h.q, h.r), rowToHex(h)])
  );
}

Object.assign(window, {
  HEX_SIZE, HEX_W, HEX_H, NEIGHBORS, APOTHEM,
  axialToPixel, hexKey, TERRAIN_COLORS, terrainColor, DEFAULT_HEX_COLOR,
  easeInOutCubic, rowToHex, loadRootMap, loadMap, loadVisibleHexes,
  EBENEN, depthEbene,
});
</script>


<!-- ═══════════════════════════════════════════════════
     Script 2 — Hex tile components (read-only)
     ═══════════════════════════════════════════════════ -->
<script type="text/babel">
const { useState: uS2 } = React;

function HexBorder({ selected, hovered, color = DEFAULT_HEX_COLOR }) {
  const w = HEX_W, h = HEX_H;
  const points = `${w/2},0 ${w},${h/4} ${w},${h*3/4} ${w/2},${h} 0,${h*3/4} 0,${h/4}`;
  const strokeColor = selected
    ? `color-mix(in oklch, white 40%, ${color})`
    : (hovered ? `color-mix(in oklch, white 18%, ${color})` : color);
  const opacity = selected ? 1 : (hovered ? 0.9 : 0.6);
  const sw = selected ? 2.2 : 1.4;
  return (
    <svg className="mk-hex-border" viewBox={`0 0 ${w} ${h}`} width={w} height={h} preserveAspectRatio="none" style={{ overflow:'visible' }}>
      <polygon points={points} fill="none" style={{ stroke: strokeColor, strokeOpacity: opacity }} strokeWidth={sw} strokeLinejoin="miter"/>
      <polygon
        points={`${w/2},6 ${w-5},${h/4+2} ${w-5},${h*3/4-2} ${w/2},${h-6} 5,${h*3/4-2} 5,${h/4+2}`}
        fill="none" style={{ stroke: strokeColor }} strokeWidth="0.5" strokeOpacity={selected ? 0.45 : 0.2}
      />
    </svg>
  );
}

// Read-only hex tile: no grip, no edit overlay — just click to open info panel
function HexTile({ hex, selected, hovered, onSelect, onHoverChange }) {
  const { x, y } = axialToPixel(hex.q, hex.r);
  const tcolor = terrainColor(hex.terrain);

  return (
    <div
      className={`mk-hex${selected ? ' is-selected' : ''}${hovered && !selected ? ' is-hovered' : ''}`}
      style={{
        width: HEX_W, height: HEX_H,
        left: x - HEX_W/2, top: y - HEX_H/2,
        pointerEvents: 'auto',
        zIndex: selected ? 12 : (hovered ? 8 : 1),
        '--hex-color': tcolor,
      }}
      onMouseEnter={() => onHoverChange(hexKey(hex.q, hex.r), true)}
      onMouseLeave={() => onHoverChange(hexKey(hex.q, hex.r), false)}
    >
      <div className="mk-hex-inner">
        <div className="mk-hex-clip"/>
        <div className="mk-slot-clip mk-slot-clip-canvas">
          {hex.bild_url ? (
            <img src={hex.bild_url} style={{ width:'100%', height:'100%', objectFit:'cover', objectPosition: hex.bild_pos ? `${hex.bild_pos.x}% ${hex.bild_pos.y}%` : '50% 50%', display:'block' }} alt=""/>
          ) : null}
        </div>
        <HexBorder selected={selected} hovered={hovered} color={tcolor}/>
        {/* Click target */}
        <div
          className="mk-hex-overlay"
          onMouseDown={(e) => e.stopPropagation()}
          onClick={(e) => { e.stopPropagation(); onSelect(hex.q, hex.r); }}
        />
      </div>
    </div>
  );
}

Object.assign(window, { HexBorder, HexTile });
</script>


<!-- ═══════════════════════════════════════════════════
     Script 3 — Camera, pan/zoom, animation
     ═══════════════════════════════════════════════════ -->
<script type="text/babel">
const { useState: uS3, useEffect: uE3, useRef: uR3, useCallback: uC3 } = React;

function useCameraAnimator(camera, setCamera) {
  const animRef = uR3(null);
  const animateTo = uC3((target, duration = 650) => {
    if (animRef.current) cancelAnimationFrame(animRef.current.raf);
    const start = { ...camera };
    const t0 = performance.now();
    const tick = (now) => {
      const k = Math.min(1, (now - t0) / duration);
      const e = easeInOutCubic(k);
      setCamera({
        x:    start.x    + (target.x    - start.x)    * e,
        y:    start.y    + (target.y    - start.y)    * e,
        zoom: start.zoom + (target.zoom - start.zoom) * e,
      });
      if (k < 1) { animRef.current.raf = requestAnimationFrame(tick); }
      else { animRef.current = null; }
    };
    animRef.current = { raf: requestAnimationFrame(tick) };
  }, [camera, setCamera]);

  const cancelAnim = uC3(() => {
    if (animRef.current) { cancelAnimationFrame(animRef.current.raf); animRef.current = null; }
  }, []);
  uE3(() => () => cancelAnim(), [cancelAnim]);
  return { animateTo, cancelAnim };
}

Object.assign(window, { useCameraAnimator });
</script>


<!-- ═══════════════════════════════════════════════════
     Script 4 — Info panel (read-only drawer)
     ═══════════════════════════════════════════════════ -->
<script type="text/babel">
const { useState: uS4, useEffect: uE4 } = React;

// ── Fortschrittsbalken im Prototyp-Stil (Icon + Doppelfüllung + Glow) ──
function barIcon(kind) {
  const h = React.createElement;
  const I = {
    fische: h('g', { key: 'i' },
      h('path', { d: 'M70 50 C 60 35, 30 35, 20 50 C 30 65, 60 65, 70 50 Z', fill: 'none', strokeWidth: '2' }),
      h('path', { d: 'M70 50 L 85 38 L 85 62 Z', fill: 'none', strokeWidth: '2' }),
      h('circle', { cx: '32', cy: '48', r: '2.4', fill: 'currentColor' })),
    insekten: h('g', { key: 'i' },
      h('ellipse', { cx: '50', cy: '50', rx: '3.5', ry: '22', fill: 'currentColor', stroke: 'none' }),
      h('path', { d: 'M50 38 C 36 22 16 24 18 42 C 24 50 38 48 50 50 Z', fill: 'none', strokeWidth: '1.6' }),
      h('path', { d: 'M50 38 C 64 22 84 24 82 42 C 76 50 62 48 50 50 Z', fill: 'none', strokeWidth: '1.6' }),
      h('path', { d: 'M50 50 C 38 56 22 60 22 72 C 30 76 44 70 50 64 Z', fill: 'none', strokeWidth: '1.4' }),
      h('path', { d: 'M50 50 C 62 56 78 60 78 72 C 70 76 56 70 50 64 Z', fill: 'none', strokeWidth: '1.4' }),
      h('path', { d: 'M48 30 L 42 22 M52 30 L 58 22', strokeWidth: '1.4' })),
    pflanzen: h('g', { key: 'i' },
      h('path', { d: 'M50 86 L 50 30', strokeWidth: '2' }),
      h('path', { d: 'M50 50 C 30 46, 18 30, 22 18 C 36 22, 50 36, 50 50 Z', fill: 'none', strokeWidth: '1.8' }),
      h('path', { d: 'M50 62 C 70 58, 82 42, 78 30 C 64 34, 50 48, 50 62 Z', fill: 'none', strokeWidth: '1.8' }),
      h('path', { d: 'M50 76 C 42 72, 38 64, 42 58 C 48 60, 52 68, 50 76 Z', fill: 'none', strokeWidth: '1.6' })),
    gewaesser: h('g', { key: 'i' },
      h('path', { d: 'M20 42 C 30 34 40 34 50 42 C 60 50 70 50 80 42', fill: 'none', strokeWidth: '2' }),
      h('path', { d: 'M20 58 C 30 50 40 50 50 58 C 60 66 70 66 80 58', fill: 'none', strokeWidth: '2' }),
      h('path', { d: 'M20 74 C 30 66 40 66 50 74 C 60 82 70 82 80 74', fill: 'none', strokeWidth: '1.4', opacity: '0.6' })),
    poi: h('g', { key: 'i' },
      h('path', { d: 'M50 14 L 78 38 L 64 82 L 36 82 L 22 38 Z', fill: 'none', strokeWidth: '2' }),
      h('path', { d: 'M50 14 L 50 82 M22 38 L 78 38 M36 82 L 50 38 L 64 82', strokeWidth: '1.2', opacity: '0.6' })),
    boss: h('g', { key: 'i' },
      h('path', { d: 'M28 32 L 22 18 L 38 26 L 50 14 L 62 26 L 78 18 L 72 32 L 80 50 L 70 70 L 50 84 L 30 70 L 20 50 Z', fill: 'none', strokeWidth: '1.8' }),
      h('circle', { cx: '40', cy: '44', r: '3', fill: 'currentColor' }),
      h('circle', { cx: '60', cy: '44', r: '3', fill: 'currentColor' }),
      h('path', { d: 'M38 62 Q 50 70 62 62', strokeWidth: '1.6', fill: 'none' })),
    sonst: h('g', { key: 'i' },
      h('circle', { cx: '50', cy: '50', r: '26', fill: 'none', strokeWidth: '2' }),
      h('path', { d: 'M50 24 L 50 76 M24 50 L 76 50 M32 32 L 68 68 M68 32 L 32 68', strokeWidth: '1.1', opacity: '0.55' }),
      h('circle', { cx: '50', cy: '50', r: '6.5', fill: 'none', strokeWidth: '1.6' }),
      h('circle', { cx: '50', cy: '50', r: '1.6', fill: 'currentColor' })),
  };
  return I[kind] || I.sonst;
}

function barKind(label) {
  const l = (label || '').toLowerCase();
  if (l.includes('fisch')) return { kind: 'fische', hue: 200 };
  if (l.includes('insekt')) return { kind: 'insekten', hue: 95 };
  if (l.includes('biom') || l.includes('pflanz') || l.includes('flora')) return { kind: 'pflanzen', hue: 140 };
  if (l.includes('gewässer') || l.includes('wasser') || l.includes('see') || l.includes('fluss')) return { kind: 'gewaesser', hue: 210 };
  if (l.includes('gebiete')) return { kind: 'poi', hue: 285 };
  if (l.includes('poi') || l.includes('mineral') || l.includes('ort')) return { kind: 'poi', hue: 60 };
  if (l.includes('boss') || l.includes('kreatur') || l.includes('monster') || l.includes('besiegt')) return { kind: 'boss', hue: 285 };
  return { kind: 'sonst', hue: 45 };
}

function barLabel(kat) {
  const M = { 'Biome': 'Erforschte Biome', 'Gewässer': 'Erforschte Gewässer', 'POI': 'Erforschte Orte', 'Gebietsbosse': 'Besiegte Gebietsbosse' };
  return M[kat] || kat;
}

// opts: { color: '#rrggbb' (Colorpicker-Override), iconPath: SVG-Pfad ODER komplettes SVG-Markup }
function makeBar(label, entdeckt, komplettiert, opts) {
  const o = opts || {};
  const { kind, hue } = barKind(label);
  const c = o.color || `oklch(0.72 0.16 ${hue})`;
  const cA = a => o.color
    ? `color-mix(in srgb, ${o.color} ${Math.round(a * 100)}%, transparent)`
    : `oklch(0.72 0.16 ${hue} / ${a})`;
  const parsed = o.iconPath ? window.karteParseIcon(o.iconPath) : null;
  let icon = barIcon(kind), viewBox = '0 0 100 100';
  if (parsed) {
    viewBox = parsed.viewBox;
    const vbW = (parsed.viewBox.split(/\s+/).map(Number)[2]) || 100;
    const sw = vbW <= 50 ? 1.5 : 2;
    icon = parsed.paths.map((d, i) =>
      React.createElement('path', { key: i, d, fill: 'none', strokeWidth: sw, strokeLinecap: 'round', strokeLinejoin: 'round' })
    );
  }
  return {
    label, c, icon, viewBox,
    trackBorder: cA(0.13),
    wA: (entdeckt || 0) + '%', wB: (komplettiert || 0) + '%',
    glow: (komplettiert || 0) > 0 ? `0 0 7px 1px ${cA(0.42)}, 0 0 14px 3px ${cA(0.18)}, 0 0 22px 6px ${cA(0.08)}` : 'none',
    fillGrad: `linear-gradient(90deg, ${c}, ${cA(0.85)})`,
    pct: (entdeckt || 0) + ' %',
  };
}

function FancyBar({ b }) {
  return (
    <div style={{ marginBottom:12 }}>
      <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:5 }}>
        <svg viewBox={b.viewBox || '0 0 100 100'} width="16" height="16" fill="none" style={{ color: b.c, stroke: b.c, opacity:0.9, flexShrink:0 }}>{b.icon}</svg>
        <span style={{ fontFamily:'var(--font-display)', fontSize:10, letterSpacing:'0.18em', fontWeight:400, color:'rgba(220,210,250,0.85)', textTransform:'uppercase', minWidth:0, flex:1, lineHeight:1.2 }}>{b.label}</span>
        <span style={{ fontFamily:'var(--font-mono)', fontSize:8, color: b.c, letterSpacing:'0.18em', flexShrink:0 }}>{b.pct}</span>
      </div>
      <div style={{ position:'relative', height:4 }}>
        <div style={{ position:'absolute', left:0, top:0, bottom:0, width: b.wB, boxShadow: b.glow, borderRadius:2, pointerEvents:'none' }}/>
        <div style={{ position:'absolute', inset:0, background:'rgba(124,77,255,0.08)', border:`1px solid ${b.trackBorder}`, borderRadius:2, overflow:'hidden' }}>
          <div style={{ position:'absolute', left:0, top:0, bottom:0, width: b.wA, background:'linear-gradient(90deg, rgba(220,215,250,0.16), rgba(240,238,255,0.26))', transition:'width 1s cubic-bezier(.2,.85,.2,1)' }}/>
          <div style={{ position:'absolute', left:-1, top:-1, bottom:-1, width: b.wB, background: b.fillGrad, boxShadow:'inset 0 0 4px rgba(255,255,255,0.5)', borderRadius:2, transition:'width 1.2s cubic-bezier(.2,.85,.2,1)' }}/>
        </div>
      </div>
    </div>
  );
}

const POOL_BAR_LABELS = { fische: 'Gefangene Fische', insekten: 'Gefangene Insekten', pflanzen: 'Gesammelte Pflanzen', mineralien: 'Abgebaute Mineralien' };

function InfoPanel({ hex, nodeType, onClose, onExploreSubmap, isSubmap, objectives, poolRows, kollStatus, childEbene }) {
  if (!hex) return null;
  const isArea = nodeType === 'area';
  const tcolor = isArea ? (hex.typ === 'eingang' ? 'oklch(0.78 0.1 80)' : 'oklch(0.7 0.15 285)') : terrainColor(hex.terrain);
  const [tab, setTab] = uS4('details');
  const [stats, setStats] = uS4(null);
  const [statsLoading, setStatsLoading] = uS4(false);
  const [fullImg, setFullImg] = uS4(false);

  // Rollup über Unterkarten direkt beim Öffnen laden (speist die Fortschrittsbalken im Details-Tab)
  uE4(() => {
    if (!hex.has_submap || !hex.submap_id) { setStats([]); return; }
    setStatsLoading(true);
    karteCollectSubtreeStats(
      { hexId: isArea ? null : hex.id, areaId: isArea ? hex.id : null, submapId: hex.submap_id },
      { onlyVisible: true }
    ).then(s => { setStats(s); setStatsLoading(false); })
     .catch(() => { setStats([]); setStatsLoading(false); });
  }, [hex.id]);

  const objList = (objectives || []).filter(o => o.freigeschaltet);

  // Ressourcen: Pools werden pro Ort gepflegt und hier über den Teilbaum aggregiert.
  // Bis die Aggregation geladen ist, dienen die eigenen Pool-Zeilen als Startwert.
  const [aggPools, setAggPools] = uS4(null);
  uE4(() => {
    if (!hex.has_submap || !hex.submap_id) { setAggPools(poolRows || []); return; }
    karteCollectSubtreePools(
      { hexId: isArea ? null : hex.id, areaId: isArea ? hex.id : null, submapId: hex.submap_id },
      { onlyVisible: true }
    ).then(setAggPools).catch(() => setAggPools(poolRows || []));
  }, [hex.id]);

  const nodePools = aggPools || poolRows || [];
  const hasPoolData = nodePools.length > 0;

  // Fortschrittsbalken: Objectives-Rollup nach Tags + Pool-Fangquoten + Legacy-Erkundung
  const bars = [];
  (stats || []).forEach(s => bars.push(makeBar(barLabel(s.kat), s.entdeckt, s.komplettiert)));
  (window.KARTE_POOL_TYPES || []).forEach(pt => {
    const items = nodePools.filter(r => r.cat === pt.key);
    if (!items.length) return;
    const caught = items.filter(r => ((kollStatus && kollStatus.counts) || {})[`${pt.key}:${r.resource_id}`] > 0).length;
    const pct = Math.round(caught / items.length * 100);
    bars.push(makeBar(POOL_BAR_LABELS[pt.key] || pt.label, pct, pct));
  });
  if (!isArea) (hex.erkundung || []).forEach(e => {
    const opts = { color: e.farbe || null, iconPath: e.icon || null };
    const total = +e.total || 0;
    if (total > 0) {
      const gefunden = Math.min(+e.gefunden || 0, total);
      const pct = Math.round(gefunden / total * 100);
      bars.push(makeBar(`${e.name} · ${gefunden}/${total}`, pct, pct, opts));
    } else {
      bars.push(makeBar(e.name, e.entdeckt || 0, e.komplettiert || 0, opts));
    }
  });

  const TabBtn = ({ id, label, accent }) => (
    <button
      onClick={() => setTab(id)}
      style={{
        flex:1, padding:'11px 0', background:'transparent', border:'none', cursor:'pointer',
        fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.24em', textTransform:'uppercase',
        color: tab === id ? (accent || '#f3eefe') : 'rgba(160,140,255,0.55)',
        borderBottom: `2px solid ${tab === id ? (accent || 'rgba(160,140,255,0.85)') : 'transparent'}`,
        transition:'all 0.15s',
      }}
    >{label}</button>
  );

  const tags = hex.tags || [];
  const topBild = isArea ? hex.bild_url : (hex.banner_url || hex.bild_url);

  // Kolonien: strukturierte Liste [{name, rassen:[]}] (Fallback: alter Freitext)
  const kolonien = Array.isArray(hex.kolonie) ? hex.kolonie : [];

  // Fakten-Zeilen für den Details-Tab
  const facts = [];
  if (isSubmap && !isArea && hex.features) facts.push(['Besonderheiten', hex.features]);
  if (isSubmap && !isArea) facts.push(['Datensonde', hex.datensonde ? '✓ installiert' : '✗ nicht installiert']);

              onMouseLeave={e => { e.currentTarget.style.background='linear-gradient(135deg, rgba(124,77,255,0.16) 0%, rgba(124,77,255,0.06) 100%)'; e.currentTarget.style.borderColor='rgba(160,140,255,0.45)'; e.currentTarget.style.boxShadow='none'; }}

              <span style={{ fontFamily:'var(--font-display)', fontSize:12, letterSpacing:'0.18em', textTransform:'uppercase', color:'#f3eefe' }}>

<script type="text/babel">
const { useState: uS5, useEffect: uE5, useRef: uR5, useCallback: uC5, useMemo: uM5 } = React;

const MIN_ZOOM = 0.35;
const MAX_ZOOM = 5;
const PANEL_W  = 440;
const FOCUS_ZOOM = 3.2;

function HexLabel({ hex }) {
  if (!hex.name && !hex.terrain) return null;
  const { x, y } = axialToPixel(hex.q, hex.r);
  const tcolor = terrainColor(hex.terrain);
  return (
    <div
      className="mk-hex-label-floating"
      style={{ left: x, top: y + HEX_H * 0.30, '--hex-color': tcolor }}
    >
      {hex.terrain ? <div className="mk-hex-label-terr" style={{ color: tcolor }}>◈ {hex.terrain}</div> : null}
      {hex.name ? <div className="mk-hex-label-name">{hex.name}</div> : null}
    </div>
  );
}

function MerMapPlayer() {
  const [currentMapId, setCurrentMapId]     = uS5(null);
  const [currentMapName, setCurrentMapName] = uS5('');
  const [mapStack, setMapStack]             = uS5([]);

  const [hexes, setHexes]     = uS5({});
  const [camera, setCamera]   = uS5({ x: 0, y: 0, zoom: 1 });
  const [selectedKey, setSel] = uS5(null);
  const [hoveredKey, setHov]  = uS5(null);
  const [isLoading, setIsLoading] = uS5(true);
  const [noMap, setNoMap]     = uS5(false);
  const [labelsVisible, setLabelsVisible] = uS5(true);

  const stageRef = uR5(null);
  const worldRef = uR5(null);
  const willChangeTimer = uR5(null);
  const setWorldAnimating = (on) => {
    clearTimeout(willChangeTimer.current);
    if (on) {
      worldRef.current?.classList.add('is-animating');
    } else {
      willChangeTimer.current = setTimeout(() => worldRef.current?.classList.remove('is-animating'), 150);
    }
  };
  const [vp, setVp] = uS5({ w: window.innerWidth, h: window.innerHeight });
  const drag = uR5({ active: false, lx: 0, ly: 0 });
  const [isDragging, setIsDragging] = uS5(false);
  const [bgUrl, setBgUrl] = uS5(null);
  const [bgTransform, setBgTransform] = uS5({ x: 0, y: 0, scale: 1 });

  // ─── Karte v2: Bild-Karten, Objectives, Pools ─────────
  const [mapMeta, setMapMeta]     = uS5({ kind: 'hex', ebene: '', floors: [] });
  const [floorIdx, setFloorIdx]   = uS5(0);
  const [areas, setAreas]         = uS5([]);
  const [selectedAreaId, setSelAreaId] = uS5(null);
  const [objectives, setObjectives] = uS5([]);
  const [poolRows, setPoolRows]   = uS5([]);
  const [kollStatus, setKollStatus] = uS5(null);
  const mapMetaRef = uR5(mapMeta);
  uE5(() => { mapMetaRef.current = mapMeta; }, [mapMeta]);
  const floorIdxRef = uR5(0);
  uE5(() => { floorIdxRef.current = floorIdx; }, [floorIdx]);

  // ─── Initial load ─────────────────────────────────────
  uE5(() => {
    async function init() {
      const rootMap = await loadRootMap();
      if (!rootMap) { setNoMap(true); setIsLoading(false); return; }
      setCurrentMapId(rootMap.id);
      setCurrentMapName(rootMap.name || 'Karte');
      setBgUrl(rootMap.bg_url || null);
      setBgTransform(rootMap.bg_transform || { x: 0, y: 0, scale: 1 });
      setMapMeta({ kind: rootMap.kind || 'hex', ebene: rootMap.ebene || '', floors: rootMap.floors || [] });
      karteLoadKollektikonStatus().then(setKollStatus).catch(() => {});
    }
    init();
  }, []);

  // ─── Reload hexes/areas when map changes ──────────────
  const [hexesMapId, setHexesMapId] = uS5(null);
  uE5(() => {
    if (!currentMapId || currentMapId === hexesMapId) return;
    setHexesMapId(currentMapId);
    setIsLoading(true);
    setSel(null); setSelAreaId(null); setFloorIdx(0);
    Promise.all([loadVisibleHexes(currentMapId), loadAreas(currentMapId, true)]).then(async ([h, areaList]) => {
      setHexes(h);
      setAreas(areaList);
      const hexIds = Object.values(h).map(x => x.id);
      const areaIds = areaList.map(a => a.id);
      const [objs, pools] = await Promise.all([
        loadObjectives(hexIds, areaIds),
        loadPools(hexIds, areaIds),
      ]);
      setObjectives(objs);
      setPoolRows(pools);
      setIsLoading(false);
    });
  }, [currentMapId, hexesMapId]);

  // ─── Viewport ─────────────────────────────────────────
  uE5(() => {
    const onResize = () => setVp({ w: window.innerWidth, h: window.innerHeight });
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  // ─── Camera animator ──────────────────────────────────
  const { animateTo, cancelAnim } = useCameraAnimator(camera, setCamera);

  // ─── Pan (middle mouse) ───────────────────────────────
  uE5(() => {
    const onDown = (e) => {
      if (e.button !== 1) return;
      if (!stageRef.current?.contains(e.target)) return;
      e.preventDefault();
      drag.current.active = true; drag.current.lx = e.clientX; drag.current.ly = e.clientY;
      setIsDragging(true); cancelAnim(); setWorldAnimating(true);
    };
    const onMove = (e) => {
      if (!drag.current.active) return;
      const dx = e.clientX - drag.current.lx, dy = e.clientY - drag.current.ly;
      drag.current.lx = e.clientX; drag.current.ly = e.clientY;
      setCamera((c) => ({ ...c, x: c.x - dx / c.zoom, y: c.y - dy / c.zoom }));
    };
    const onUp = () => { drag.current.active = false; setIsDragging(false); setWorldAnimating(false); };
    window.addEventListener('pointerdown', onDown, { capture: true, passive: false });
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    return () => {
      window.removeEventListener('pointerdown', onDown, true);
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
    };
  }, [cancelAnim]);

  // ─── Zoom ─────────────────────────────────────────────
  const panelOpen = !!selectedKey || !!selectedAreaId;
  const onWheel = (e) => {
    e.preventDefault(); cancelAnim(); setWorldAnimating(true); setWorldAnimating(false);
    const factor = Math.exp(-e.deltaY * 0.0015);
    setCamera((c) => {
      const minZoom = mapMetaRef.current.kind === 'image' ? 0.05 : MIN_ZOOM;
      const nextZoom = Math.max(minZoom, Math.min(MAX_ZOOM, c.zoom * factor));
      const rect = stageRef.current.getBoundingClientRect();
      const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
      const cx = panelOpen ? (rect.width - PANEL_W) / 2 : rect.width / 2;
      const cy = rect.height / 2;
      const wx = c.x + (sx - cx) / c.zoom, wy = c.y + (sy - cy) / c.zoom;
      return { x: wx - (sx - cx) / nextZoom, y: wy - (sy - cy) / nextZoom, zoom: nextZoom };
    });
  };
  uE5(() => {
    const el = stageRef.current; if (!el) return;
    const handler = (e) => onWheel(e);
    el.addEventListener('wheel', handler, { passive: false });
    return () => el.removeEventListener('wheel', handler);
  }, [panelOpen, camera]);

  // ─── Hex selection ────────────────────────────────────
  const onHexClick = uC5((q, r) => {
    const k = hexKey(q, r);
    setSelAreaId(null);
    if (selectedKey === k) { setSel(null); return; }
    setSel(k);
    const { x, y } = axialToPixel(q, r);
    animateTo({ x, y, zoom: Math.max(camera.zoom, FOCUS_ZOOM) }, 650);
  }, [selectedKey, animateTo, camera.zoom]);

  const onAreaClick = uC5((a) => {
    if (selectedAreaId === a.id) { setSelAreaId(null); return; }
    setSel(null);
    setSelAreaId(a.id);
    let x = 0, y = 0;
    (a.points || []).forEach(p => { x += p[0]; y += p[1]; });
    const n = (a.points || []).length || 1;
    animateTo({ x: x / n, y: y / n, zoom: Math.max(camera.zoom, 1) }, 550);
  }, [selectedAreaId, animateTo, camera.zoom]);

  const onHexHover = uC5((k, isEnter) => {
    setHov((cur) => isEnter ? k : (cur === k ? null : cur));
  }, []);

  const closePanel = uC5(() => { setSel(null); setSelAreaId(null); }, []);

  // Esc key
  uE5(() => {
    const onKey = (e) => { if (e.key === 'Escape') { setSel(null); setSelAreaId(null); } };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  // ─── Submap navigation ────────────────────────────────
  const navigateInto = uC5(async (node) => {
    if (!node.submap_id) return;
    setSel(null); setSelAreaId(null);
    setMapStack((s) => [...s, { id: currentMapId, name: currentMapName, bgUrl, bgTransform, mapMeta }]);
    const subMap = await loadMap(node.submap_id);
    setCurrentMapId(node.submap_id);
    setCurrentMapName(node.name || subMap?.name || 'Subkarte');
    setBgUrl(subMap?.bg_url || null);
    setBgTransform(subMap?.bg_transform || { x: 0, y: 0, scale: 1 });
    setMapMeta({ kind: subMap?.kind || 'hex', ebene: subMap?.ebene || '', floors: subMap?.floors || [] });
  }, [currentMapId, currentMapName, bgUrl, bgTransform, mapMeta]);

  const navigateUp = uC5((i) => {
    const target = mapStack[i]; if (!target) return;
    setMapStack((s) => s.slice(0, i));
    setSel(null); setSelAreaId(null);
    setCurrentMapId(target.id);
    setCurrentMapName(target.name);
    setBgUrl(target.bgUrl || null);
    setBgTransform(target.bgTransform || { x: 0, y: 0, scale: 1 });
    setMapMeta(target.mapMeta || { kind: 'hex', ebene: '', floors: [] });
  }, [mapStack]);

  // ─── Camera controls ──────────────────────────────────
  const imageFitCam = uC5(() => {
    const fl = (mapMetaRef.current.floors || [])[floorIdxRef.current];
    if (!fl) return { x: 0, y: 0, zoom: 1 };
    const z = Math.min(window.innerWidth / fl.w, (window.innerHeight - 56) / fl.h) * 0.86;
    return { x: fl.w / 2, y: fl.h / 2, zoom: Math.max(0.05, z) };
  }, []);

  const resetView = () => {
    if (mapMeta.kind === 'image') animateTo(imageFitCam(), 550);
    else animateTo({ x: 0, y: 0, zoom: 1 }, 550);
  };
  const zoomBy = (factor) => {
    cancelAnim();
    setCamera((c) => {
      const minZoom = mapMetaRef.current.kind === 'image' ? 0.05 : MIN_ZOOM;
      return { ...c, zoom: Math.max(minZoom, Math.min(MAX_ZOOM, c.zoom * factor)) };
    });
  };

  // Kamera beim Betreten einer Bild-Karte / Etagenwechsel einpassen
  uE5(() => {
    if (mapMeta.kind === 'image') setCamera(imageFitCam());
    else setCamera({ x: 0, y: 0, zoom: 1 });
  }, [hexesMapId, floorIdx, mapMeta.kind, imageFitCam]);

  const switchFloor = (dir) => {
    setFloorIdx(f => {
      const count = (mapMetaRef.current.floors || []).length;
      const nf = Math.max(0, Math.min(count - 1, f + dir));
      if (nf !== f) { setSel(null); setSelAreaId(null); }
      return nf;
    });
  };

  // ─── World transform ──────────────────────────────────
  const centerX = panelOpen ? (vp.w - PANEL_W) / 2 : vp.w / 2;
  const centerY = (vp.h - 56) / 2;
  const worldTx = `translate(${centerX}px, ${centerY}px) scale(${camera.zoom}) translate(${-camera.x}px, ${-camera.y}px)`;

  const hexList = Object.values(hexes);
  const selectedHex = selectedKey ? hexes[selectedKey] : null;
  const isImageMap = mapMeta.kind === 'image';
  const floors = mapMeta.floors || [];
  const floor = floors[floorIdx] || null;
  const floorAreas = areas.filter(a => (a.floor || 0) === floorIdx);
  const selectedArea = selectedAreaId ? areas.find(a => a.id === selectedAreaId) : null;
  const selectedNode = selectedArea || selectedHex;
  const nodeObjectives = selectedNode
    ? objectives.filter(o => selectedArea ? o.area_id === selectedArea.id : o.hex_id === selectedNode.id)
    : [];
  const nodePoolRows = selectedNode
    ? poolRows.filter(r => selectedArea ? r.area_id === selectedArea.id : r.hex_id === selectedNode.id)
    : [];

  // ─── Loading / empty states ───────────────────────────
  if (isLoading && !currentMapId) {
    return (
      <div style={{
        position:'fixed', inset:0, display:'flex', alignItems:'center', justifyContent:'center',
        background:'#05040f', fontFamily:'var(--font-mono)', fontSize:10,
        letterSpacing:'0.28em', color:'rgba(124,77,255,0.6)', textTransform:'uppercase',
      }}>◈ Lade Karte …</div>
    );
  }

  if (noMap) {
    return (
      <div style={{
        position:'fixed', inset:0, display:'flex', alignItems:'center', justifyContent:'center',
        flexDirection:'column', gap:12, background:'#05040f',
        fontFamily:'var(--font-mono)', letterSpacing:'0.18em', textTransform:'uppercase',
      }}>
        <div style={{ fontSize:10, color:'rgba(124,77,255,0.5)' }}>◈ Keine Karte verfügbar</div>
        <div style={{ fontSize:8, color:'rgba(124,77,255,0.3)' }}>Der DM hat noch keine Karte angelegt</div>
      </div>
    );
  }

  return (
    <React.Fragment>
      {/* Top bar */}
      <header className="mk-topbar">
        <a className="mk-back" href="index.html">◂ Meruria</a>
        <span className="mk-title">KARTE</span>
        <span className="mk-subtitle">◈ Die neue Welt</span>
        <span style={{
          marginLeft:10, padding:'3px 9px', borderRadius:3,
          background: isImageMap ? 'rgba(217,176,107,0.08)' : 'rgba(124,77,255,0.08)',
          border: `1px solid ${isImageMap ? 'rgba(217,176,107,0.35)' : 'rgba(124,77,255,0.3)'}`,
          fontFamily:'var(--font-mono)', fontSize:8.5, letterSpacing:'0.18em', textTransform:'uppercase',
          color: isImageMap ? 'rgba(240,220,170,0.85)' : 'rgba(160,140,255,0.8)',
        }}>
          {isImageMap ? '▦' : '⬡'} {depthEbene(mapStack.length)}
        </span>
        {/* Breadcrumb */}
        {mapStack.length > 0 && (
          <div style={{
            display:'flex', alignItems:'center', gap:6, marginLeft:14,
            fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.18em',
            textTransform:'uppercase',
          }}>
            {mapStack.map((m, i) => (
              <React.Fragment key={m.id}>
                <button
                  onClick={() => navigateUp(i)}
                  style={{
                    background:'transparent', border:'none', cursor:'pointer',
                    fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.18em',
                    color:'rgba(124,77,255,0.6)', textTransform:'uppercase', padding:'2px 4px',
                    transition:'color 0.15s',
                  }}
                  onMouseEnter={e => e.currentTarget.style.color='rgba(200,190,240,0.9)'}
                  onMouseLeave={e => e.currentTarget.style.color='rgba(124,77,255,0.6)'}
                >{m.name || 'Karte'}</button>
                <span style={{ color:'rgba(124,77,255,0.3)' }}>›</span>
              </React.Fragment>
            ))}
            <span style={{ color:'rgba(160,140,255,0.7)' }}>{currentMapName}</span>
          </div>
        )}
        <div style={{ flex: 1 }}/>
        {isLoading && (
          <span style={{ fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.22em', color:'rgba(124,77,255,0.5)', textTransform:'uppercase' }}>
            ◈ lade …
          </span>
        )}
      </header>

      {/* Stage */}
      <div
        ref={stageRef}
        className={`mk-stage${isDragging ? ' is-dragging' : ''}`}
        style={{ top: 56 }}
        onClick={closePanel}
      >
        {!isLoading && !isImageMap && (
          <div ref={worldRef} className={`mk-world${bgUrl ? ' has-bg' : ''}`} style={{ transform: worldTx, '--zoom': camera.zoom, '--label-scale': 1 / Math.pow(camera.zoom, 0.25) }}>
            {bgUrl && (
              <img
                src={bgUrl}
                style={{
                  position:'absolute', left:0, top:0,
                  transform:`translate(${bgTransform.x}px,${bgTransform.y}px) scale(${bgTransform.scale}) translate(-50%,-50%)`,
                  transformOrigin:'0 0',
                  maxWidth:'none', zIndex:0, pointerEvents:'none', userSelect:'none', opacity:0.9,
                }}
                alt=""
                draggable={false}
              />
            )}
            {hexList.map((h) => (
              <HexTile
                key={hexKey(h.q, h.r)}
                hex={h}
                selected={hexKey(h.q, h.r) === selectedKey}
                hovered={hexKey(h.q, h.r) === hoveredKey}
                onSelect={onHexClick}
                onHoverChange={onHexHover}
              />
            ))}
            {labelsVisible && (
              <div className="mk-labels-layer">
                {hexList.map((h) => <HexLabel key={`lbl-${h.id}`} hex={h}/>)}
              </div>
            )}
          </div>
        )}

        {/* ── Bild-Karte ── */}
        {!isLoading && isImageMap && floor && (
          <div ref={worldRef} className="mk-world" style={{ transform: worldTx, '--zoom': camera.zoom, '--label-scale': 1 / Math.pow(camera.zoom, 0.25) }}>
            <img
              src={floor.bg}
              style={{ position:'absolute', left:0, top:0, width:floor.w, height:floor.h, maxWidth:'none', pointerEvents:'none', userSelect:'none', opacity:0.95 }}
              alt="" draggable={false}
            />
            <svg
              width={floor.w} height={floor.h} viewBox={`0 0 ${floor.w} ${floor.h}`}
              style={{ position:'absolute', left:0, top:0, overflow:'visible' }}
            >
              {floorAreas.map(a => {
                const sel = a.id === selectedAreaId;
                const accent = a.typ === 'eingang' ? '217,176,107' : '160,140,255';
                return (
                  <polygon
                    key={a.id}
                    points={a.points.map(p => p.join(',')).join(' ')}
                    style={{
                      fill: sel ? `rgba(${accent},0.3)` : `rgba(${accent},0.1)`,
                      stroke: sel ? 'rgba(220,210,255,0.95)' : `rgba(${accent},0.7)`,
                      strokeWidth: 2 / Math.max(camera.zoom, 0.01),
                      strokeDasharray: '14 8',
                      cursor: 'pointer',
                    }}
                    onClick={(e) => { e.stopPropagation(); onAreaClick(a); }}
                  />
                );
              })}
            </svg>
            {labelsVisible && (
              <div className="mk-labels-layer">
                {floorAreas.map(a => {
                  let cx = 0, cy = 0;
                  (a.points || []).forEach(p => { cx += p[0]; cy += p[1]; });
                  const n = (a.points || []).length || 1;
                  return (
                    <div
                      key={`albl-${a.id}`}
                      className="mk-hex-label-floating"
                      style={{ left: cx / n, top: cy / n, '--hex-color': a.typ === 'eingang' ? 'oklch(0.78 0.1 80)' : 'oklch(0.7 0.15 285)' }}
                    >
                      <div className="mk-hex-label-terr" style={{ color: a.typ === 'eingang' ? 'rgba(217,176,107,0.85)' : 'rgba(160,140,255,0.8)' }}>
                        {a.typ === 'eingang' ? '⬡ Betretbar' : '◈ POI'}
                      </div>
                      {a.name ? <div className="mk-hex-label-name">{a.name}</div> : null}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {/* Etagen-Umschalter */}
        {isImageMap && floors.length > 1 && (
          <div style={{
            position:'absolute', top:16, right: panelOpen ? PANEL_W + 16 : 16, zIndex:55,
            display:'flex', alignItems:'center', gap:8,
            background:'rgba(8,6,22,0.9)', border:'1px solid rgba(124,77,255,0.3)',
            borderRadius:4, padding:'6px 10px',
          }}>
            <button className="mk-tool-btn" style={{ width:26, height:26, opacity: floorIdx >= floors.length - 1 ? 0.35 : 1 }} disabled={floorIdx >= floors.length - 1} onClick={() => switchFloor(1)} title="Etage höher">▲</button>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.14em', color:'rgba(160,140,255,0.8)', textTransform:'uppercase' }}>
              Ebene {floorIdx + 1}/{floors.length} · {floor?.label || ''}
            </span>
            <button className="mk-tool-btn" style={{ width:26, height:26, opacity: floorIdx <= 0 ? 0.35 : 1 }} disabled={floorIdx <= 0} onClick={() => switchFloor(-1)} title="Etage tiefer">▼</button>
          </div>
        )}

        {!isLoading && (isImageMap ? !floor && floorAreas.length === 0 : hexList.length === 0) && (
          <div className="mk-empty-map-hint">
            <div className="h">{isImageMap ? 'Noch nichts enthüllt' : 'Noch keine Gebiete enthüllt'}</div>
            <div className="s">Der DM wird neue Bereiche nach und nach freischalten</div>
          </div>
        )}
      </div>

      {/* Bottom-right tools */}
      <div className="mk-tools">
        <button
          className={`mk-tool-btn${!labelsVisible ? ' is-active' : ''}`}
          title={labelsVisible ? 'Beschriftungen ausblenden' : 'Beschriftungen einblenden'}
          onClick={() => setLabelsVisible((v) => !v)}
        >
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="1.4" style={{display:'block'}}>
            <rect x="2" y="5" width="14" height="8" rx="1.5"/>
            <line x1="5" y1="9" x2="13" y2="9" strokeWidth="1.8"/>
            <line x1="5" y1="12" x2="10" y2="12"/>
            {!labelsVisible && <line x1="1" y1="17" x2="17" y2="1" strokeWidth="1.6" stroke="currentColor"/>}
          </svg>
        </button>
        <button className="mk-tool-btn" title="Vergrößern" onClick={() => zoomBy(1.25)}>+</button>
        <button className="mk-tool-btn" title="Verkleinern" onClick={() => zoomBy(0.8)}>−</button>
        <button className="mk-tool-btn" title="Ansicht zurücksetzen" onClick={resetView}>
          <span className="lbl">⌖</span>
        </button>
      </div>

      {/* HUD */}
      <div className="mk-hud">
        <div className="mk-hud-row"><span>◇ Zoom</span><span>{(camera.zoom * 100).toFixed(0)}%</span></div>
        <div className="mk-hud-row" style={{ marginTop:4, paddingTop:8, borderTop:'1px solid rgba(124,77,255,0.18)', color:'rgba(160,140,255,0.55)' }}>
          <span>◇ Mittel-Maustaste</span><span>Karte ziehen</span>
        </div>
        <div className="mk-hud-row" style={{ color:'rgba(160,140,255,0.55)' }}>
          <span>◇ Mausrad</span><span>Zoom</span>
        </div>
        <div className="mk-hud-row" style={{ color:'rgba(160,140,255,0.55)' }}>
          <span>◇ Klick</span><span>Info anzeigen</span>
        </div>
      </div>

      {/* Info panel */}
      {selectedNode && (
        <InfoPanel
          key={selectedNode.id}
          hex={selectedNode}
          nodeType={selectedArea ? 'area' : 'hex'}
          onClose={closePanel}
          onExploreSubmap={() => navigateInto(selectedNode)}
          isSubmap={mapStack.length > 0}
          objectives={nodeObjectives}
          poolRows={nodePoolRows}
          kollStatus={kollStatus}
          childEbene={selectedArea ? 'Ort' : depthEbene(mapStack.length + 1)}
        />
      )}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<MerMapPlayer/>);
</script>


</body></html>
