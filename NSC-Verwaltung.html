// ── Meruria birthday picker ────────────────────────────────
const MONTHS_M = [
  {name:"Janvar",days:19},{name:"Fevorn",days:18},{name:"Mareth",days:19},
  {name:"Aprel",days:19},{name:"Mairen",days:18},{name:"Junvar",days:19},
  {name:"Juval",days:19},{name:"Auvar",days:19},{name:"Septhar",days:19},
  {name:"Oktar",days:18},{name:"Novren",days:18},{name:"Derath",days:19},
];
const MS_M = MONTHS_M.reduce((a,m,i)=>{a.push(i===0?1:a[i-1]+MONTHS_M[i-1].days);return a;},[]);
function doyText(doy) {
  for (let i=MONTHS_M.length-1;i>=0;i--)
    if (doy>=MS_M[i]) return `${doy-MS_M[i]+1}. ${MONTHS_M[i].name}`;
  return '—';
}
function NscBirthdayPicker({ doy, onChange }) {
  const initMo = () => { if (!doy) return 0; for (let i=MONTHS_M.length-1;i>=0;i--) if (doy>=MS_M[i]) return i; return 0; };
  const [open, setOpen] = dmUS(false);
  const [mo, setMo] = dmUS(initMo);
  const ref = dmUR(null);
  dmUE(() => {
    if (!open) return;
    const h = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [open]);
  function pick(mi, d) { onChange(MS_M[mi]+d-1); setOpen(false); }
  const M = MONTHS_M[mo];
  const selDay = doy && MS_M[mo]<=doy && doy<MS_M[mo]+M.days ? doy-MS_M[mo]+1 : null;
  return (
    <div ref={ref} style={{position:'relative'}}>
      <button type="button" onClick={()=>{if(!open){setMo(initMo());setOpen(true);}else setOpen(false);}}
        style={{...iSt, textAlign:'left', cursor:'pointer', color: doy ? '#f0eeff' : 'rgba(160,140,255,0.4)'}}>
        {doy ? doyText(doy) : 'Kein Datum'} <span style={{opacity:.4,fontSize:10}}>▾</span>
      </button>
      {open && (
        <div style={{position:'absolute',top:'calc(100% + 3px)',left:0,zIndex:1500,
          background:'rgba(11,8,28,0.99)',border:'1px solid rgba(124,77,255,0.4)',borderRadius:4,
          boxShadow:'0 18px 48px rgba(0,0,0,0.75)',width:'min(320px,90vw)',overflow:'hidden'}}>
          <div style={{display:'flex',flexWrap:'wrap',gap:2,padding:'7px 7px 5px',
            borderBottom:'1px solid rgba(124,77,255,0.12)'}}>
            {MONTHS_M.map((m,i)=>(
              <button key={i} type="button" onClick={()=>setMo(i)}
                style={{fontFamily:'var(--font-mono)',fontSize:8,letterSpacing:'.1em',padding:'3px 6px',cursor:'pointer',
                  background:mo===i?'rgba(124,77,255,0.28)':'transparent',
                  border:`1px solid ${mo===i?'rgba(124,77,255,0.55)':'rgba(124,77,255,0.12)'}`,
                  borderRadius:2,color:mo===i?'#f0eeff':'rgba(200,190,240,0.45)'}}>
                {m.name}
              </button>
            ))}
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,padding:'7px'}}>
            {Array.from({length:M.days},(_,i)=>i+1).map(d=>(
              <button key={d} type="button" onClick={()=>pick(mo,d)}
                style={{fontFamily:'var(--font-mono)',fontSize:11,padding:'6px 2px',cursor:'pointer',textAlign:'center',
                  background:selDay===d?'rgba(124,77,255,0.42)':'rgba(124,77,255,0.05)',
                  border:`1px solid ${selDay===d?'rgba(124,77,255,0.75)':'rgba(124,77,255,0.12)'}`,
                  borderRadius:2,color:selDay===d?'#f0eeff':'rgba(200,190,240,0.8)'}}>
                {d}
              </button>
            ))}
          </div>
          <div style={{padding:'4px 7px 7px',borderTop:'1px solid rgba(124,77,255,0.1)'}}>
            <button type="button" onClick={()=>{onChange(null);setOpen(false);}}
              style={{fontFamily:'var(--font-mono)',fontSize:7.5,letterSpacing:'.18em',textTransform:'uppercase',
                color:'rgba(200,190,240,0.3)',background:'transparent',border:'none',cursor:'pointer',padding:'2px 0'}}>
              Datum entfernen
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Empty / to-draft converters ────────────────────────────
function emptyDraft() {
  return {
    name:'', titel:'', vollerName:[], rasse:'', geschlecht:'', alter:'',
    lebensphase:'', beruf:'', division:'Keine', rang:'', organisation:'', kapsel:'',
    wohnort:'', gottheit:'', habe:0, unvergesslich:'', eigenschaften:[], status:['Lebendig'],
    talente:[], makel:'', routine:[], ausruestung:[], begleiter:{ name:'', art:'' },
    motivationen:[], geheimnisse:[], kontakte:{ familie:[], freunde:[], rivalen:[] },
    bild:'', visible: false,
    geburtstag_doy: null,
  };
}
function nscToDraft(nsc) {
  return {
    name: nsc.name || '', titel: nsc.titel || '',
    vollerName: nsc.vollerName || [],
    rasse: nsc.rasse || '', geschlecht: nsc.geschlecht || '',
    alter: nsc.alter != null ? String(nsc.alter) : '',
    lebensphase: nsc.lebensphase || '', beruf: nsc.beruf || '',
    division: nsc.division || 'Keine', rang: nsc.rang || '',
    organisation: nsc.organisation || '', kapsel: nsc.kapsel || '',
    wohnort: nsc.wohnort || '', gottheit: nsc.gottheit || '', habe: nsc.habe ?? 0,
    unvergesslich: nsc.unvergesslich || '',
    eigenschaften: nsc.eigenschaften || [],
    status: nsc.status || [],
    talente: nsc.talente || [],
    makel: nsc.makel || '',
    routine: nsc.routine || [],
    ausruestung: nsc.ausruestung || [],
    begleiter: nsc.begleiter || { name:'', art:'' },
    motivationen: nsc.motivationen || [],
    geheimnisse: nsc.geheimnisse || [],
    kontakte: {
      familie: nsc.kontakte?.familie || [],
      freunde: nsc.kontakte?.freunde || [],
      rivalen: nsc.kontakte?.rivalen || [],
    },
    bild: nsc.bild || '',
    visible: !!nsc.visible,
    geburtstag_doy: nsc.geburtstag_doy || null,
  };
}
function draftToPayload(d, existingName, currentNsc) {
  return {
    name: d.name.trim() || existingName || 'Unbenannt',
    titel: d.titel.trim() || null,
    voller_name: d.vollerName.filter(s=>s.trim()),
    rasse: d.rasse.trim() || null,
    geschlecht: d.geschlecht.trim() || null,
    alter_jahre: d.alter ? parseInt(d.alter)||null : null,
    lebensphase: d.lebensphase.trim() || null,
    beruf: d.beruf.trim() || null,
    division: d.division || null,
    rang: d.rang.trim() || null,
    organisation: d.organisation.trim() || null,
    kapsel: d.kapsel.trim() || null,
    wohnort: d.wohnort.trim() || null,
    gottheit: d.gottheit.trim() || null,
    habe: parseInt(d.habe) || 0,
    unvergesslich: d.unvergesslich.trim() || null,
    eigenschaften: d.eigenschaften.filter(s=>s.trim()),
    status: d.status,
    talente: d.talente.filter(s=>s.trim()),
    makel: d.makel.trim() || null,
    routine: d.routine.filter(e=>e.tat?.trim()),
    ausruestung: d.ausruestung.filter(e=>e.name?.trim()),
    begleiter: d.begleiter?.name?.trim() ? {name:d.begleiter.name.trim(),art:d.begleiter.art?.trim()||''} : null,
    motivationen: d.motivationen.filter(s=>s.trim()),
    geheimnisse: d.geheimnisse.filter(s=>s.trim()),
    kontakte: {
      familie: (d.kontakte.familie||[]).filter(e=>e.name?.trim()).map(e=>({name:e.name.trim(),rolle:e.rolle?.trim()||'',verstorben:!!e.verstorben})),
      freunde: (d.kontakte.freunde||[]).filter(e=>e.name?.trim()).map(e=>({name:e.name.trim(),rolle:e.rolle?.trim()||'',verstorben:!!e.verstorben})),
      rivalen: (d.kontakte.rivalen||[]).filter(e=>e.name?.trim()).map(e=>({name:e.name.trim(),rolle:e.rolle?.trim()||'',verstorben:!!e.verstorben})),
    },
    bild: d.bild.trim() || null,
    visible: currentNsc ? currentNsc.visible : d.visible,
    geburtstag_doy: d.geburtstag_doy || null,
  };
}

// ── NSC list row ───────────────────────────────────────────

            {DIVISION_THEME[nsc.division]?.roman || '—'}

}

// ── Contact name input with NSC/char picker ────────────────
function ContactNameInput({ value, onChange, nscs, charPersp, excludeId }) {
  const [open, setOpen] = dmUS(false);
  const [query, setQuery] = dmUS('');
  const ref = dmUR(null);

  dmUE(() => {
    if (!open) return;
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [open]);

  const q = query.trim().toLowerCase();
  const charOptions = charPersp.map(p => ({
    key: 'char-' + p.id,
    name: p.label.replace(/^Als /, ''),
    sub: 'Spielercharakter',
  }));
  const nscOptions = nscs
    .filter(n => n.id !== excludeId && n.name)
    .map(n => ({ key: 'nsc-' + n.id, name: n.name, sub: n.beruf || (n.division !== 'Keine' ? n.division : '') || '' }));

  const all = [...charOptions, ...nscOptions];
  const filtered = q ? all.filter(x => x.name.toLowerCase().includes(q)) : all;
  const charF = filtered.filter(x => x.key.startsWith('char-'));
  const nscF  = filtered.filter(x => x.key.startsWith('nsc-'));

  const pick = (name) => { onChange(name); setOpen(false); setQuery(''); };

  const groupLabel = (title) => (
    <div style={{ padding:'5px 10px 3px', fontFamily:'var(--font-mono)', fontSize:7.5,
      letterSpacing:'0.24em', color:'rgba(160,140,255,0.4)', textTransform:'uppercase',
      borderTop: '1px solid rgba(160,140,255,0.08)', marginTop:2 }}>
      {title}
    </div>
  );
  const optBtn = (x) => (
    <button key={x.key} type="button" onClick={() => pick(x.name)} style={{
      display:'flex', alignItems:'baseline', gap:8,
      width:'100%', padding:'6px 12px',
      background:'transparent', border:'none', borderBottom:'1px solid rgba(160,140,255,0.06)',
      textAlign:'left', cursor:'pointer', transition:'background 0.1s',
    }}
    onMouseEnter={e => e.currentTarget.style.background='rgba(124,77,255,0.14)'}
    onMouseLeave={e => e.currentTarget.style.background='transparent'}>
      <span style={{ fontFamily:'var(--font-body)', fontSize:12, color:'rgba(220,210,255,0.85)' }}>{x.name}</span>
      {x.sub && <span style={{ fontFamily:'var(--font-mono)', fontSize:8, color:'rgba(160,140,255,0.4)',
        textTransform:'uppercase', letterSpacing:'0.12em' }}>{x.sub}</span>}
    </button>
  );

  return (
    <div ref={ref} style={{ position:'relative' }}>
      <div style={{ display:'flex', gap:3 }}>
        <input value={value} onChange={e => onChange(e.target.value)} placeholder="Name"
          style={{ ...iSt, flex:1 }}/>
        <button type="button" title="Aus NSC- oder Charakterliste wählen"
          onClick={() => { setOpen(v => !v); setQuery(''); }}
          style={{
            padding:'4px 8px', flexShrink:0, cursor:'pointer',
            background: open ? 'rgba(124,77,255,0.20)' : 'rgba(124,77,255,0.08)',
            border:`1px solid ${open ? 'rgba(124,77,255,0.7)' : 'rgba(124,77,255,0.35)'}`,
            borderRadius:2, color: open ? '#c9b8ff' : 'rgba(160,140,255,0.6)',
            fontFamily:'var(--font-mono)', fontSize:10, transition:'all 0.15s',
          }}>◈</button>
      </div>
      {open && (
        <div style={{
          position:'absolute', top:'calc(100% + 3px)', left:0, right:0, zIndex:60,
          background:'rgba(8,6,22,0.99)', border:'1px solid rgba(124,77,255,0.35)',
          borderRadius:3, boxShadow:'0 8px 32px rgba(0,0,0,0.65)',
          overflow:'hidden', maxHeight:280, display:'flex', flexDirection:'column',
        }}>
          <div style={{ padding:'6px 8px', borderBottom:'1px solid rgba(160,140,255,0.12)', flexShrink:0 }}>
            <input autoFocus value={query} onChange={e => setQuery(e.target.value)}
              placeholder="Suchen …" style={{ ...iSt, fontSize:11, padding:'4px 7px' }}/>
          </div>
          <div style={{ overflowY:'auto', flex:1 }}>
            {filtered.length === 0 ? (
              <div style={{ padding:'12px', fontFamily:'var(--font-body)', fontSize:12,
                color:'rgba(160,140,255,0.4)', fontStyle:'italic', textAlign:'center' }}>Kein Treffer</div>
            ) : <>
              {charF.length > 0 && <>{groupLabel('Spielercharaktere')}{charF.map(optBtn)}</>}
              {nscF.length  > 0 && <>{groupLabel('NSC')}{nscF.map(optBtn)}</>}
            </>}
          </div>
        </div>
      )}
    </div>
  );
}

function NscEditForm({ nsc, onSaved, nscs = [], charPersp = [] }) {
  const isNew = !nsc;
  const [draft, setDraft] = dmUS(() => isNew ? emptyDraft() : nscToDraft(nsc));
  const [saving, setSaving] = dmUS(false);
  const [saveError, setSaveError] = dmUS(null);

  dmUE(() => {
    setDraft(nsc ? nscToDraft(nsc) : emptyDraft());
    setSaveError(null);
  }, [nsc?.id]);

  const set = (k, v) => setDraft(p => ({...p, [k]: v}));
  const updArr = (k, i, field, v) => setDraft(p => { const a=[...p[k]]; a[i]={...a[i],[field]:v}; return {...p,[k]:a}; });
  const addArr = (k, v) => setDraft(p => ({...p,[k]:[...p[k],v]}));
  const rmArr  = (k, i) => setDraft(p => ({...p,[k]:p[k].filter((_,j)=>j!==i)}));
  const updK   = (sub, i, f, v) => setDraft(p => { const a=[...(p.kontakte[sub]||[])]; a[i]={...a[i],[f]:v}; return {...p,kontakte:{...p.kontakte,[sub]:a}}; });
  const addK   = (sub) => setDraft(p => ({...p,kontakte:{...p.kontakte,[sub]:[...(p.kontakte[sub]||[]),{name:'',rolle:'',verstorben:false}]}}));
  const rmK    = (sub, i) => setDraft(p => ({...p,kontakte:{...p.kontakte,[sub]:(p.kontakte[sub]||[]).filter((_,j)=>j!==i)}}));

  const handleSave = async () => {
    setSaving(true); setSaveError(null);
    const payload = draftToPayload(draft, nsc?.name, isNew ? null : nsc);
    let data, error;
    if (isNew) {
      ({ data, error } = await window._sb.from('nscs').insert(payload).select().single());
    } else {
      ({ data, error } = await window._sb.from('nscs').update(payload).eq('id', nsc.id).select().single());
    }
    setSaving(false);
    if (error) { setSaveError(error.message); return; }
    onSaved(mapNscRow(data), isNew);
  };

  // Summaries für geschlossene Sektionen
  const IMG_BASE      = 'assets/images/npc/';
  const sumBild       = draft.bild ? (draft.bild.startsWith(IMG_BASE) ? draft.bild.slice(IMG_BASE.length) : draft.bild).slice(0,40) : null;
  const sumIdentitaet = [draft.titel, draft.name].filter(Boolean).join(' · ') || null;
  const sumBasis      = [draft.rasse, draft.alter ? `${draft.alter} J` : null, draft.beruf].filter(Boolean).join(' · ') || null;
  const sumRolle      = [draft.division !== 'Keine' ? draft.division.replace(/^Die /,'') : null, draft.rang, draft.wohnort].filter(Boolean).join(' · ') || null;
  const sumStatus     = draft.status.join(', ') || null;
  const sumErschein   = (draft.unvergesslich || draft.eigenschaften.filter(s=>s.trim())[0] || null)?.slice(0,50);
  const nRoutine      = draft.routine.filter(e=>e.tat?.trim()).length;
  const nAusruestung  = draft.ausruestung.filter(e=>e.name?.trim()).length;
  const sumBegleiter  = draft.begleiter?.name?.trim() || null;
  const nMotiv        = draft.motivationen.filter(s=>s.trim()).length;
  const nKontakte     = [...(draft.kontakte.familie||[]),...(draft.kontakte.freunde||[]),...(draft.kontakte.rivalen||[])].filter(e=>e.name?.trim()).length;
  const nGeheimnisse  = draft.geheimnisse.filter(s=>s.trim()).length;

  const F = ({ label, children, full }) => (
    <div style={full ? {} : {}}>
      <label style={lbSt}>{label}</label>
      {children}
    </div>
  );

  return (
    <div style={{ padding:'16px 18px 60px' }}>

      {/* Save */}
      <div style={{ display:'flex', gap:8, marginBottom:14 }}>
        <button type="button" onClick={handleSave} disabled={saving} style={{
          flex:1, padding:'9px', background: saving ? 'rgba(124,77,255,0.04)' : 'rgba(124,77,255,0.16)',
          border:`1px solid ${saving ? 'rgba(124,77,255,0.25)' : 'rgba(124,77,255,0.75)'}`,
          borderRadius:2, color: saving ? 'rgba(124,77,255,0.4)' : '#c9b8ff',
          fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.22em', textTransform:'uppercase',
          cursor: saving ? 'default' : 'pointer',
        }}>{saving ? '◈ Speichern …' : isNew ? '＋ NSC anlegen' : '✓ Änderungen speichern'}</button>
      </div>
      {saveError && (
        <div style={{ marginBottom:12, padding:'8px 12px', background:'rgba(227,103,96,0.12)',
          border:'1px solid rgba(227,103,96,0.5)', borderRadius:2,
          fontFamily:'var(--font-mono)', fontSize:9, color:'#e36760', letterSpacing:'0.12em' }}>
          ✕ {saveError}
        </div>
      )}

      <Sektion title="Bild" summary={sumBild}>
        {(() => {
          const BASE = 'assets/images/npc/';
          const filename = draft.bild?.startsWith(BASE) ? draft.bild.slice(BASE.length) : (draft.bild || '');
          const isExternal = draft.bild && !draft.bild.startsWith(BASE);
          return (
            <>
              <div style={{ display:'flex', alignItems:'stretch' }}>
                <span style={{
                  padding:'5px 8px', flexShrink:0,
                  background:'rgba(5,3,15,0.8)', border:'1px solid rgba(124,77,255,0.3)',
                  borderRight:'none', borderRadius:'2px 0 0 2px',
                  fontFamily:'var(--font-mono)', fontSize:9.5, color:'rgba(160,140,255,0.45)',
                  letterSpacing:'0.08em', display:'flex', alignItems:'center', userSelect:'none',
                }}>assets/images/npc/</span>
                <input
                  style={{ ...iSt, borderRadius:'0 2px 2px 0', flex:1,
                    borderColor: isExternal ? 'rgba(255,180,80,0.5)' : 'rgba(124,77,255,0.4)' }}
                  value={filename}
                  onChange={e => set('bild', e.target.value ? BASE + e.target.value : '')}
                  placeholder="name.png"
                />
              </div>
              {isExternal && (
                <div style={{ marginTop:5, fontFamily:'var(--font-mono)', fontSize:8,
                  color:'rgba(255,180,80,0.7)', letterSpacing:'0.12em' }}>
                  ⚠ Externer Pfad gespeichert: {draft.bild}
                </div>
              )}
              {draft.bild && (
                <div style={{ marginTop:8, display:'flex', alignItems:'center', gap:10 }}>
                  <img src={draft.bild} alt="" style={{ width:48, height:48, objectFit:'cover',
                    objectPosition:'top', borderRadius:2, border:'1px solid rgba(124,77,255,0.3)',
                    background:'rgba(10,6,28,0.8)', flexShrink:0 }}
                    onError={e => { e.target.style.opacity=0.3; }}/>
                  <span style={{ fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.1em',
                    color:'rgba(160,140,255,0.4)', wordBreak:'break-all' }}>{draft.bild}</span>
                </div>
              )}
            </>
          );
        })()}
      </Sektion>

      <Sektion title="Identität" summary={sumIdentitaet} defaultOpen={true}>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:10 }}>
          <F label="Name *"><input style={iSt} value={draft.name} onChange={e=>set('name',e.target.value)}/></F>
          <F label="Titel"><input style={iSt} value={draft.titel} onChange={e=>set('titel',e.target.value)}/></F>
        </div>
        <F label="Voller Name (ein Namensteil pro Zeile)">
          <textarea style={taSt} value={draft.vollerName.join('\n')}
            onChange={e=>set('vollerName',e.target.value.split('\n'))}
            placeholder="z.B. Velira&#10;Von Ashenmoor"/>
        </F>
      </Sektion>

      <Sektion title="Basis" summary={sumBasis}>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:10 }}>
          <F label="Rasse"><input style={iSt} value={draft.rasse} onChange={e=>set('rasse',e.target.value)}/></F>
          <F label="Geschlecht"><input style={iSt} value={draft.geschlecht} onChange={e=>set('geschlecht',e.target.value)}/></F>
          <F label="Alter (Jahre)"><input style={iSt} type="number" value={draft.alter} onChange={e=>set('alter',e.target.value)}/></F>
          <F label="Geburtstag"><NscBirthdayPicker doy={draft.geburtstag_doy} onChange={v=>set('geburtstag_doy',v)}/></F>
          <F label="Lebensphase"><input style={iSt} value={draft.lebensphase} onChange={e=>set('lebensphase',e.target.value)}/></F>
          <F label="Beruf"><input style={iSt} value={draft.beruf} onChange={e=>set('beruf',e.target.value)}/></F>
          <F label="Gottheit"><input style={iSt} value={draft.gottheit} onChange={e=>set('gottheit',e.target.value)}/></F>
          <F label="Habe (Hade)">
            <div style={{ display:'flex', alignItems:'center', gap:5 }}>
              <input style={iSt} type="number" min="0" value={draft.habe} onChange={e=>set('habe', Math.max(0, parseInt(e.target.value)||0))}/>
              <span style={{ fontFamily:'var(--font-mono)', fontSize:8, color:'rgba(210,175,60,0.5)', letterSpacing:'.1em', flexShrink:0 }}>Hade</span>
            </div>
          </F>
        </div>
      </Sektion>

      <Sektion title="Rolle" summary={sumRolle}>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
          <F label="Division">
            <select style={iSt} value={draft.division} onChange={e=>set('division',e.target.value)}>
              {['Keine','Die Kuratoren','Die Sturmritter','Die Sentinels','Die Friedenshüter','Die Outfitters','Die Pathfinders','Die Quellensucher','Die Bergungsgarde'].map(d=><option key={d} value={d}>{d}</option>)}
            </select>
          </F>
          <F label="Rang"><input style={iSt} value={draft.rang} onChange={e=>set('rang',e.target.value)}/></F>
          <F label="Organisation"><input style={iSt} value={draft.organisation} onChange={e=>set('organisation',e.target.value)}/></F>
          <F label="Kapsel"><input style={iSt} value={draft.kapsel} onChange={e=>set('kapsel',e.target.value)}/></F>
          <div style={{ gridColumn:'span 2' }}>
            <F label="Wohnort"><input style={iSt} value={draft.wohnort} onChange={e=>set('wohnort',e.target.value)}/></F>
          </div>
        </div>
      </Sektion>

      <Sektion title="Status" summary={sumStatus}>
        <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
          {STATUS_ORDER.map(s => {
            const on = draft.status.includes(s);
            const def = STATUS_DEF[s] || {};
            return <button key={s} type="button"
              onClick={()=>set('status', on ? draft.status.filter(x=>x!==s) : [...draft.status,s])}
              style={{ padding:'5px 12px', fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.14em',
                background: on ? hexA(def.color||'#7c4dff',0.20) : 'transparent',
                border:`1px solid ${on ? hexA(def.color||'#7c4dff',0.7) : 'rgba(160,140,255,0.22)'}`,
                color: on ? '#f0eeff' : 'rgba(200,190,240,0.5)',
                borderRadius:2, cursor:'pointer', textTransform:'uppercase' }}>{def.glyph||''} {s}</button>;
          })}
        </div>
      </Sektion>

      <Sektion title="Erscheinung & Persönlichkeit" summary={sumErschein}>
        <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
          <F label="Unvergessliches Merkmal"><textarea style={taSt} value={draft.unvergesslich} onChange={e=>set('unvergesslich',e.target.value)}/></F>
          <F label="Eigenschaften (eine pro Zeile)"><textarea style={taSt} value={draft.eigenschaften.join('\n')} onChange={e=>set('eigenschaften',e.target.value.split('\n'))}/></F>
          <F label="Talente (eines pro Zeile)"><textarea style={taSt} value={draft.talente.join('\n')} onChange={e=>set('talente',e.target.value.split('\n'))}/></F>
          <F label="Makel"><textarea style={taSt} value={draft.makel} onChange={e=>set('makel',e.target.value)}/></F>
        </div>
      </Sektion>

      <Sektion title="Routine" summary={nRoutine ? `${nRoutine} Einträge` : null}>
        {draft.routine.map((e,i)=>(
          <div key={i} style={{ display:'grid', gridTemplateColumns:'80px 110px 1fr auto', gap:6, marginBottom:6 }}>
            <input placeholder="Zeit" value={e.zeit||''} onChange={ev=>{const a=[...draft.routine];a[i]={...a[i],zeit:ev.target.value};set('routine',a);}} style={iSt}/>
            <input placeholder="Ort"  value={e.ort||''}  onChange={ev=>{const a=[...draft.routine];a[i]={...a[i],ort:ev.target.value};set('routine',a);}}  style={iSt}/>
            <input placeholder="Tätigkeit" value={e.tat||''} onChange={ev=>{const a=[...draft.routine];a[i]={...a[i],tat:ev.target.value};set('routine',a);}} style={iSt}/>
            <button onClick={()=>rmArr('routine',i)} style={rmBt}>×</button>
          </div>
        ))}
        <button onClick={()=>addArr('routine',{zeit:'',ort:'',tat:''})} style={addBt}>+ Eintrag</button>
      </Sektion>

      <Sektion title="Ausrüstung" summary={nAusruestung ? `${nAusruestung} Gegenstände` : null}>
        {draft.ausruestung.map((it,i)=>(
          <div key={i} style={{ display:'grid', gridTemplateColumns:'1fr 2fr auto', gap:6, marginBottom:6 }}>
            <input placeholder="Name" value={it.name||''} onChange={ev=>{const a=[...draft.ausruestung];a[i]={...a[i],name:ev.target.value};set('ausruestung',a);}} style={iSt}/>
            <input placeholder="Beschreibung" value={it.beschreibung||''} onChange={ev=>{const a=[...draft.ausruestung];a[i]={...a[i],beschreibung:ev.target.value};set('ausruestung',a);}} style={iSt}/>
            <button onClick={()=>rmArr('ausruestung',i)} style={rmBt}>×</button>
          </div>
        ))}
        <button onClick={()=>addArr('ausruestung',{name:'',beschreibung:''})} style={addBt}>+ Gegenstand</button>
      </Sektion>

      <Sektion title="Begleiter" summary={sumBegleiter}>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
          <F label="Name"><input style={iSt} value={draft.begleiter?.name||''} onChange={e=>set('begleiter',{...(draft.begleiter||{}),name:e.target.value})}/></F>
          <F label="Art"><input style={iSt} value={draft.begleiter?.art||''} onChange={e=>set('begleiter',{...(draft.begleiter||{}),art:e.target.value})} placeholder="z.B. Tier, Vertrauter"/></F>
        </div>
      </Sektion>

      <Sektion title="Motivationen" summary={nMotiv ? `${nMotiv} Einträge` : null}>
        {draft.motivationen.map((m,i)=>(
          <div key={i} style={{ display:'flex', gap:6, marginBottom:6 }}>
            <input value={m} onChange={ev=>{const a=[...draft.motivationen];a[i]=ev.target.value;set('motivationen',a);}} style={iSt} placeholder="Motivation …"/>
            <button onClick={()=>rmArr('motivationen',i)} style={rmBt}>×</button>
          </div>
        ))}
        <button onClick={()=>addArr('motivationen','')} style={addBt}>+ Motivation</button>
      </Sektion>

      <Sektion title="Kontakte" summary={nKontakte ? `${nKontakte} Kontakte` : null}>
        {[['Familie','familie'],['Freunde','freunde'],['Rivalen','rivalen']].map(([title,sub])=>(
          <div key={sub} style={{ marginBottom:16 }}>
            <div style={{ fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.26em',
              color:'rgba(160,140,255,0.5)', textTransform:'uppercase', marginBottom:8 }}>{title}</div>
            {(draft.kontakte[sub]||[]).map((p,i)=>(
              <div key={i} style={{ display:'grid', gridTemplateColumns:'2fr 2fr auto auto', gap:6, marginBottom:6, alignItems:'center' }}>
                <ContactNameInput value={p.name||''} onChange={v=>updK(sub,i,'name',v)} nscs={nscs} charPersp={charPersp} excludeId={nsc?.id}/>
                <input placeholder="Rolle" value={p.rolle||''} onChange={ev=>updK(sub,i,'rolle',ev.target.value)} style={iSt}/>
                <label style={{ display:'flex', alignItems:'center', gap:4, color:'rgba(160,140,255,0.55)', fontSize:10, cursor:'pointer', whiteSpace:'nowrap' }}>
                  <input type="checkbox" checked={p.verstorben||false} onChange={ev=>updK(sub,i,'verstorben',ev.target.checked)}/> ✝
                </label>
                <button onClick={()=>rmK(sub,i)} style={rmBt}>×</button>
              </div>
            ))}
            <button onClick={()=>addK(sub)} style={addBt}>+ {title.slice(0,-1)} hinzufügen</button>
          </div>
        ))}
      </Sektion>

      <Sektion title="Geheimnisse" summary={nGeheimnisse ? `${nGeheimnisse} Geheimnisse` : null}>
        {draft.geheimnisse.map((g,i)=>(
          <div key={i} style={{ display:'flex', gap:6, marginBottom:6, alignItems:'flex-start' }}>
            <textarea value={g} onChange={ev=>{const a=[...draft.geheimnisse];a[i]=ev.target.value;set('geheimnisse',a);}} style={{...taSt,minHeight:52}}/>
            <button onClick={()=>rmArr('geheimnisse',i)} style={rmBt}>×</button>
          </div>
        ))}
        <button onClick={()=>addArr('geheimnisse','')} style={addBt}>+ Geheimnis</button>
      </Sektion>

      <div style={{ marginTop:14 }}>
        <button type="button" onClick={handleSave} disabled={saving} style={{
          width:'100%', padding:'9px', background: saving ? 'rgba(124,77,255,0.04)' : 'rgba(124,77,255,0.16)',
          border:`1px solid ${saving ? 'rgba(124,77,255,0.25)' : 'rgba(124,77,255,0.75)'}`,
          borderRadius:2, color: saving ? 'rgba(124,77,255,0.4)' : '#c9b8ff',
          fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.22em', textTransform:'uppercase',
          cursor: saving ? 'default' : 'pointer',
        }}>{saving ? '◈ Speichern …' : isNew ? '＋ NSC anlegen' : '✓ Änderungen speichern'}</button>
      </div>
    </div>
  );
}

// ── NSC Ansicht Tab ────────────────────────────────────────
function NscAnsichtTab({ nsc }) {
  const acc = accentOf(nsc, true);
  const accDim = hexA(acc, 0.18);

  const SecHead = ({ label }) => (
    <div style={{ display:'flex', alignItems:'center', gap:8, margin:'22px 0 10px' }}>
      <span style={{ fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.30em',
        color: hexA(acc, 0.6), textTransform:'uppercase' }}>◇ {label}</span>
      <div style={{ flex:1, height:1, background: hexA(acc, 0.18) }}/>
    </div>
  );

  const gridSt = { display:'grid', gridTemplateColumns:'110px 1fr', gap:'6px 14px', alignItems:'baseline' };
  const keySt  = { fontFamily:'var(--font-mono)', fontSize:8.5, letterSpacing:'0.16em',
    color:'rgba(160,140,255,0.5)', textTransform:'uppercase' };
  const valSt  = { fontFamily:'var(--font-body)', fontSize:12.5, color:'rgba(228,222,255,0.88)' };

  const KV = ({ k, v }) => !v && v !== 0 ? null : (
    <><span style={keySt}>{k}</span><span style={valSt}>{v}</span></>
  );

  const Pill = ({ text, color }) => (
    <span style={{ fontFamily:'var(--font-mono)', fontSize:8.5, letterSpacing:'0.12em',
      textTransform:'uppercase', padding:'3px 8px',
      background: hexA(color || acc, 0.12), border:`1px solid ${hexA(color || acc, 0.35)}`,
      borderRadius:2, color: hexA(color || acc, 0.9) }}>{text}</span>
  );

  const hasRolle = (nsc.division && nsc.division !== 'Keine') || nsc.rang || nsc.organisation || nsc.kapsel || nsc.wohnort;
  const hasErscheinung = nsc.unvergesslich || nsc.eigenschaften?.length > 0 || nsc.talente?.length > 0 || nsc.makel;
  const hasKontakte = nsc.kontakte && (nsc.kontakte.familie?.length > 0 || nsc.kontakte.freunde?.length > 0 || nsc.kontakte.rivalen?.length > 0);

  return (
    <div style={{ padding:'20px 24px 60px' }}>

      {/* ── Kopf ── */}
      <div style={{ display:'flex', gap:18, alignItems:'flex-start', padding:'16px', borderRadius:3,
        background: hexA(acc, 0.05), border:`1px solid ${hexA(acc, 0.2)}` }}>
        {nsc.bild && (
          <div style={{ width:88, height:88, flexShrink:0, borderRadius:2, overflow:'hidden',
            border:`1px solid ${hexA(acc, 0.4)}` }}>
            <img src={nsc.bild} style={{ width:'100%', height:'100%', objectFit:'cover', objectPosition:'top' }} alt=""/>
          </div>
        )}
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ display:'flex', alignItems:'center', gap:8, flexWrap:'wrap', marginBottom:5 }}>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.18em',
              textTransform:'uppercase', color: nsc.visible ? '#5fe39a' : 'rgba(160,140,255,0.4)' }}>
              {nsc.visible ? '◆ Sichtbar' : '○ Verborgen'}
            </span>
            {nsc.division && nsc.division !== 'Keine' && (
              <span style={{ fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.14em',
                textTransform:'uppercase', color: hexA(acc, 0.65) }}>
                · {nsc.division.replace(/^Die /, '')}{romanFor(nsc) ? ` ${romanFor(nsc)}` : ''}
              </span>
            )}
            {nsc.beruf && (
              <span style={{ fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.14em',
                textTransform:'uppercase', color:'rgba(160,140,255,0.5)' }}>· {nsc.beruf}</span>
            )}
          </div>
          {nsc.titel && (
            <div style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.18em',
              color: hexA(acc, 0.75), textTransform:'uppercase', marginBottom:3 }}>{nsc.titel}</div>
          )}
          <div style={{ fontFamily:'var(--font-display)', fontSize:20, fontWeight:400,
            letterSpacing:'0.07em', color:'#f0eeff', marginBottom:4,
            textShadow:`0 0 18px ${hexA(acc, 0.3)}` }}>{nsc.name}</div>
          {nsc.vollerName && nsc.vollerName.filter(s => s.trim()).length > 0 && (
            <div style={{ fontFamily:'var(--font-body)', fontSize:11.5, color:'rgba(200,190,240,0.5)',
              fontStyle:'italic', marginBottom:6 }}>
              {nsc.vollerName.filter(s => s.trim()).join(' ')}
            </div>
          )}
          <StatusPills status={nsc.status} />
        </div>
      </div>

      {/* ── Basis ── */}
      <SecHead label="Basis" />
      <div style={gridSt}>
        <KV k="Rasse"       v={nsc.rasse} />
        <KV k="Geschlecht"  v={nsc.geschlecht} />
        <KV k="Alter"       v={nsc.alter != null ? `${nsc.alter} Jahre` : null} />
        <KV k="Geburtstag"  v={nsc.geburtstag_doy ? doyText(nsc.geburtstag_doy) : null} />
        <KV k="Lebensphase" v={nsc.lebensphase} />
        <KV k="Beruf"       v={nsc.beruf} />
        <KV k="Gottheit"    v={nsc.gottheit} />
        {nsc.habe > 0 && <KV k="Habe" v={<span style={{ color:'rgba(210,175,60,0.85)' }}>{nsc.habe.toLocaleString('de-DE')} Hade</span>} />}
      </div>

      {/* ── Rolle ── */}
      {hasRolle && (
        <>
          <SecHead label="Rolle" />
          <div style={gridSt}>
            {nsc.division && nsc.division !== 'Keine' && <KV k="Division" v={nsc.division} />}
            <KV k="Rang"         v={nsc.rang} />
            <KV k="Organisation" v={nsc.organisation} />
            <KV k="Kapsel"       v={nsc.kapsel} />
            <KV k="Wohnort"      v={nsc.wohnort} />
          </div>
        </>
      )}

      {/* ── Erscheinung & Persönlichkeit ── */}
      {hasErscheinung && (
        <>
          <SecHead label="Erscheinung & Persönlichkeit" />
          {nsc.unvergesslich && (
            <div style={{ padding:'8px 12px', borderLeft:`2px solid ${hexA(acc, 0.55)}`,
              background: hexA(acc, 0.06), marginBottom:10, borderRadius:'0 2px 2px 0',
              fontFamily:'var(--font-body)', fontSize:12.5, fontStyle:'italic',
              color:'rgba(230,225,255,0.85)', lineHeight:1.65 }}>
              {nsc.unvergesslich}
            </div>
          )}
          {nsc.eigenschaften?.filter(s => s.trim()).length > 0 && (
            <div style={{ marginBottom:10 }}>
              <div style={{ ...keySt, marginBottom:6 }}>Eigenschaften</div>
              <div style={{ display:'flex', flexWrap:'wrap', gap:5 }}>
                {nsc.eigenschaften.filter(s => s.trim()).map((e,i) => <Pill key={i} text={e} />)}
              </div>
            </div>
          )}
          {nsc.talente?.filter(s => s.trim()).length > 0 && (
            <div style={{ marginBottom:10 }}>
              <div style={{ ...keySt, marginBottom:6 }}>Talente</div>
              <div style={{ display:'flex', flexWrap:'wrap', gap:5 }}>

          {nsc.makel && (
            <div style={gridSt}><KV k="Makel" v={nsc.makel} /></div>

        </>
      )}

      {/* ── Routine ── */}
      {nsc.routine?.length > 0 && (
        <>
          <SecHead label="Routine" />
          <div style={{ display:'flex', flexDirection:'column', gap:3 }}>
            {nsc.routine.map((e,i) => (
              <div key={i} style={{ display:'grid', gridTemplateColumns:'70px 90px 1fr', gap:10,
                padding:'6px 10px', borderRadius:2,
                background:'rgba(124,77,255,0.04)', border:'1px solid rgba(124,77,255,0.1)' }}>
                <span style={{ fontFamily:'var(--font-mono)', fontSize:9, color: hexA(acc, 0.75),
                  letterSpacing:'0.12em' }}>{e.zeit || '—'}</span>
                <span style={{ fontFamily:'var(--font-mono)', fontSize:9, color:'rgba(160,140,255,0.5)',
                  letterSpacing:'0.1em' }}>{e.ort || ''}</span>
                <span style={valSt}>{e.tat || ''}</span>
              </div>
            ))}
          </div>
        </>
      )}

      {/* ── Ausrüstung ── */}
      {nsc.ausruestung?.length > 0 && (
        <>
          <SecHead label="Ausrüstung" />
          <div style={{ display:'flex', flexDirection:'column', gap:3 }}>
            {nsc.ausruestung.map((it,i) => (
              <div key={i} style={{ display:'flex', gap:14, padding:'6px 10px',
                background:'rgba(124,77,255,0.04)', border:'1px solid rgba(124,77,255,0.1)', borderRadius:2 }}>
                <span style={{ fontFamily:'var(--font-mono)', fontSize:9.5, color: hexA(acc, 0.85),
                  letterSpacing:'0.1em', flexShrink:0, minWidth:100 }}>{it.name}</span>
                {it.beschreibung && (
                  <span style={{ fontFamily:'var(--font-body)', fontSize:12,
                    color:'rgba(200,190,240,0.6)' }}>{it.beschreibung}</span>
                )}
              </div>
            ))}
          </div>
        </>
      )}

      {/* ── Begleiter ── */}
      {nsc.begleiter?.name && (
        <>
          <SecHead label="Begleiter" />
          <div style={{ display:'flex', gap:10, alignItems:'baseline' }}>
            <span style={valSt}>{nsc.begleiter.name}</span>
            {nsc.begleiter.art && <span style={keySt}>{nsc.begleiter.art}</span>}
          </div>
        </>
      )}

      {/* ── Motivationen ── */}
      {nsc.motivationen?.filter(s => s.trim()).length > 0 && (
        <>
          <SecHead label="Motivationen" />
          <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
            {nsc.motivationen.filter(s => s.trim()).map((m,i) => (
              <div key={i} style={{ display:'flex', gap:8, alignItems:'baseline',
                padding:'7px 10px', borderRadius:2,
                background: hexA(acc, 0.05), border:`1px solid ${hexA(acc, 0.15)}` }}>
                <span style={{ color: hexA(acc, 0.5), fontSize:9, flexShrink:0 }}>◇</span>
                <span style={valSt}>{m}</span>
              </div>
            ))}
          </div>
        </>
      )}

      {/* ── Kontakte ── */}
      {hasKontakte && (
        <>
          <SecHead label="Kontakte" />
          {[['Familie', nsc.kontakte.familie], ['Freunde', nsc.kontakte.freunde], ['Rivalen', nsc.kontakte.rivalen]].map(([title, list]) =>
            list?.length > 0 ? (
              <div key={title} style={{ marginBottom:12 }}>
                <div style={{ ...keySt, marginBottom:5 }}>{title}</div>
                <div style={{ display:'flex', flexDirection:'column', gap:3 }}>
                  {list.map((p,i) => (
                    <div key={i} style={{ display:'flex', gap:10, alignItems:'baseline',
                      padding:'5px 10px', borderRadius:2,
                      background:'rgba(124,77,255,0.04)', border:'1px solid rgba(124,77,255,0.1)' }}>
                      <span style={{ ...valSt,
                        color: p.verstorben ? 'rgba(160,140,255,0.4)' : 'rgba(228,222,255,0.88)',
                        textDecoration: p.verstorben ? 'line-through' : 'none' }}>{p.name}</span>
                      {p.rolle && <span style={keySt}>{p.rolle}</span>}
                      {p.verstorben && <span style={{ color:'rgba(160,140,255,0.4)', fontSize:9 }}>✝</span>}
                    </div>
                  ))}
                </div>
              </div>
            ) : null
          )}
        </>
      )}

      {/* ── Geheimnisse ── */}
      {nsc.geheimnisse?.filter(s => s.trim()).length > 0 && (
        <>
          <SecHead label="Geheimnisse" />
          <div style={{ display:'flex', flexDirection:'column', gap:5 }}>
            {nsc.geheimnisse.filter(s => s.trim()).map((g,i) => (
              <div key={i} style={{ padding:'10px 14px', borderRadius:2,
                background:'rgba(227,103,96,0.07)', border:'1px solid rgba(227,103,96,0.25)' }}>
                <span style={{ fontFamily:'var(--font-body)', fontSize:12.5,
                  color:'rgba(255,210,200,0.85)', lineHeight:1.65 }}>{g}</span>
              </div>
            ))}
          </div>
        </>
      )}

    </div>
  );
}

// ── Fact value preview helper ──────────────────────────────
function getFactPreview(nsc, k) {
  if (k.startsWith('namestueck-')) return (nsc.vollerName||[])[parseInt(k.split('-')[1])] || '?';
  if (k.startsWith('routine-')) { const e=(nsc.routine||[])[parseInt(k.split('-')[1])]; return e ? `${e.zeit||''} ${e.tat||''}`.trim() : '?'; }
  if (k.startsWith('ausruestung-')) return (nsc.ausruestung||[])[parseInt(k.split('-')[1])]?.name || '?';
  if (k.startsWith('motivation-')) { const v=(nsc.motivationen||[])[parseInt(k.split('-')[1])]; return v ? v.slice(0,50) : '?'; }
  if (k.startsWith('familie-')) { const p=(nsc.kontakte?.familie||[])[parseInt(k.split('-')[1])]; return p ? p.name : '?'; }
  if (k.startsWith('freunde-')) { const p=(nsc.kontakte?.freunde||[])[parseInt(k.split('-')[1])]; return p ? p.name : '?'; }
  if (k.startsWith('rivalen-')) { const p=(nsc.kontakte?.rivalen||[])[parseInt(k.split('-')[1])]; return p ? p.name : '?'; }
  if (k.startsWith('geheimnis-')) { const v=(nsc.geheimnisse||[])[parseInt(k.split('-')[1])]; return v ? v.slice(0,60)+'…' : '?'; }
  const v = nsc[k];
  if (Array.isArray(v)) return v.slice(0,3).join(', ') || '—';
  if (typeof v === 'object' && v !== null) return v.name || '—';
  return v != null ? String(v) : '—';
}

// ── Character multiselect dropdown ────────────────────────
function CharPickerDropdown({ options, selected, onToggle, players = [] }) {
  const [open, setOpen] = dmUS(false);
  const [search, setSearch] = dmUS('');
  const ref = dmUR(null);

  dmUE(() => {
    if (!open) return;
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [open]);

  const q = search.trim().toLowerCase();
  const filtered = q ? options.filter(p => p.label.toLowerCase().includes(q)) : options;

  const label = selected.length === 0            ? 'Keiner ausgewählt'
              : selected.length === options.length ? 'Alle Charaktere'
              : selected.length === 1              ? (options.find(p => p.id === selected[0])?.label || '1 Charakter')
              : `${selected.length} Charaktere`;

  // Toggle all chars of a player
  function togglePlayer(playerCharIds) {
    const allOn = playerCharIds.every(id => selected.includes(id));
    playerCharIds.forEach(id => {
      const on = selected.includes(id);
      if (allOn && on) onToggle(id);       // all on → turn off
      else if (!allOn && !on) onToggle(id); // not all on → turn on missing
    });
  }

  // Build grouped list: players with their chars, then ungrouped chars
  const [collapsed, setCollapsed] = dmUS({});
  const toggleCollapse = (id) => setCollapsed(prev => ({ ...prev, [id]: !prev[id] }));
  const groupedPlayerIds = new Set(players.flatMap(p => p.charIds));
  const ungrouped = filtered.filter(c => !groupedPlayerIds.has(c.id));
  const filteredPlayers = q
    ? players.filter(p => p.label.toLowerCase().includes(q) || p.charIds.some(id => options.find(o => o.id === id)?.label.toLowerCase().includes(q)))
    : players;

  return (
    <div ref={ref} style={{ position:'relative', marginBottom:8 }}>
      <button type="button" onClick={() => { setOpen(v => !v); setSearch(''); }} style={{
        width:'100%', display:'flex', alignItems:'center', justifyContent:'space-between',
        padding:'6px 10px',
        background: open ? 'rgba(124,77,255,0.10)' : 'rgba(124,77,255,0.05)',
        border:`1px solid ${open ? 'rgba(124,77,255,0.65)' : 'rgba(124,77,255,0.30)'}`,
        borderRadius:2,
        color: selected.length > 0 ? '#c9b8ff' : 'rgba(124,77,255,0.38)',
        fontFamily:'var(--font-mono)', fontSize:9.5, letterSpacing:'0.14em',
        textTransform:'uppercase', cursor:'pointer', transition:'all 0.15s',
      }}>
        <span>{label}</span>
        <span style={{ fontSize:8, opacity:0.65 }}>{open ? '▲' : '▼'}</span>
      </button>

      {open && (
        <div style={{
          position:'absolute', top:'calc(100% + 3px)', left:0, right:0, zIndex:50,
          background:'rgba(8,6,22,0.99)', border:'1px solid rgba(124,77,255,0.35)',
          borderRadius:3, boxShadow:'0 8px 32px rgba(0,0,0,0.65)', overflow:'hidden',
        }}>
          <div style={{ padding:'7px 9px', borderBottom:'1px solid rgba(160,140,255,0.12)' }}>
            <input autoFocus value={search} onChange={e => setSearch(e.target.value)}
              placeholder="Spieler oder Charakter …"
              style={{ ...iSt, fontSize:11, padding:'5px 8px' }}/>
          </div>
          <div style={{ maxHeight:280, overflowY:'auto' }}>
            {filteredPlayers.length === 0 && ungrouped.length === 0 ? (
              <div style={{ padding:'10px 12px', fontFamily:'var(--font-body)', fontSize:12,
                color:'rgba(160,140,255,0.4)', fontStyle:'italic' }}>Kein Treffer</div>
            ) : <>
              {filteredPlayers.map(player => {
                const playerChars = player.charIds
                  .map(id => options.find(o => o.id === id))
                  .filter(Boolean)
                  .filter(c => !q || c.label.toLowerCase().includes(q) || player.label.toLowerCase().includes(q));
                if (playerChars.length === 0 && !player.label.toLowerCase().includes(q)) return null;
                const allOn = player.charIds.every(id => selected.includes(id));
                const someOn = player.charIds.some(id => selected.includes(id));
                return (
                  <div key={player.id}>
                    {/* Player row */}
                    <div style={{
                      display:'flex', alignItems:'center', background:'rgba(124,77,255,0.06)',
                      borderBottom:'1px solid rgba(160,140,255,0.08)',
                    }}>
                      <label style={{ display:'flex', alignItems:'center', gap:10, padding:'8px 12px 5px', cursor:'pointer', flex:1 }}>
                        <input type="checkbox" checked={allOn} ref={el => { if (el) el.indeterminate = someOn && !allOn; }}
                          onChange={() => togglePlayer(player.charIds)}
                          style={{ accentColor:'#c9b8ff', cursor:'pointer', flexShrink:0 }}/>
                        <span style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.2em',
                          color: someOn ? 'rgba(200,190,240,0.9)' : 'rgba(160,140,255,0.55)', textTransform:'uppercase' }}>
                          {player.label}
                        </span>
                      </label>
                      <button type="button" onClick={() => toggleCollapse(player.id)}
                        style={{ background:'none', border:'none', cursor:'pointer', padding:'0 12px',
                          color:'rgba(160,140,255,0.4)', fontSize:9, flexShrink:0 }}>
                        {collapsed[player.id] ? '▶' : '▼'}
                      </button>
                    </div>
                    {/* Char rows */}
                    {!collapsed[player.id] && playerChars.map(c => {
                      const checked = selected.includes(c.id);
                      return (
                        <label key={c.id} style={{
                          display:'flex', alignItems:'center', gap:10, padding:'6px 12px 6px 32px',
                          cursor:'pointer',
                          background: checked ? 'rgba(124,77,255,0.07)' : 'transparent',
                          borderBottom:'1px solid rgba(160,140,255,0.05)',
                          transition:'background 0.12s',
                        }}>
                          <input type="checkbox" checked={checked} onChange={() => onToggle(c.id)}
                            style={{ accentColor:'#c9b8ff', cursor:'pointer', flexShrink:0 }}/>
                          <span style={{ fontFamily:'var(--font-body)', fontSize:11,
                            color: checked ? '#c9b8ff' : 'rgba(180,170,220,0.65)' }}>
                            {c.label}
                          </span>
                        </label>
                      );
                    })}
                  </div>
                );
              })}
              {ungrouped.map(c => {
                const checked = selected.includes(c.id);
                return (
                  <label key={c.id} style={{
                    display:'flex', alignItems:'center', gap:10, padding:'7px 12px',
                    cursor:'pointer',
                    background: checked ? 'rgba(124,77,255,0.08)' : 'transparent',
                    borderBottom:'1px solid rgba(160,140,255,0.06)',
                  }}>
                    <input type="checkbox" checked={checked} onChange={() => onToggle(c.id)}
                      style={{ accentColor:'#c9b8ff', cursor:'pointer', flexShrink:0 }}/>
                    <span style={{ fontFamily:'var(--font-mono)', fontSize:9.5, letterSpacing:'0.14em',
                      color: checked ? '#c9b8ff' : 'rgba(200,190,240,0.72)', textTransform:'uppercase' }}>
                      {c.label}
                    </span>
                  </label>
                );
              })}
            </>}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Visibility Panel ───────────────────────────────────────
function VisibilityPanel({ nsc, unlocks, charPersp, players = [], onNscUpdated }) {
  const [dmTarget, setDmTarget] = dmUS(() => charPersp.map(p => p.id));
  const [saving, setSaving] = dmUS(false);

  const toggleTarget = (pid) =>
    setDmTarget(prev => prev.includes(pid) ? prev.filter(id => id !== pid) : [...prev, pid]);

  const toggleVisible = async () => {
    setSaving(true);
    const { data, error } = await window._sb.from('nscs').update({ visible: !nsc.visible }).eq('id', nsc.id).select().single();
    setSaving(false);
    if (!error && data) onNscUpdated?.(mapNscRow(data));
  };

  const allKeys = factsOf(nsc);

  const GROUPS = [
    { title:'Identität',     keys: allKeys.filter(k => ['titel','rasse','geschlecht','alter','lebensphase','gottheit'].includes(k) || k.startsWith('namestueck-')) },
    { title:'Rolle',         keys: allKeys.filter(k => ['beruf','division','rang','organisation','kapsel','wohnort'].includes(k)) },
    { title:'Erscheinung',   keys: allKeys.filter(k => ['unvergesslich','eigenschaften','talente','makel','begleiter'].includes(k)) },
    { title:'Routine',       keys: allKeys.filter(k => k.startsWith('routine-')) },
    { title:'Ausrüstung',    keys: allKeys.filter(k => k.startsWith('ausruestung-')) },
    { title:'Motivationen',  keys: allKeys.filter(k => k.startsWith('motivation-')) },
    { title:'Kontakte',      keys: allKeys.filter(k => k.startsWith('familie-') || k.startsWith('freunde-') || k.startsWith('rivalen-')) },
    { title:'Geheimnisse',   keys: allKeys.filter(k => k.startsWith('geheimnis-')) },
  ].filter(g => g.keys.length > 0);

  const unlockedCount = allKeys.filter(k => unlocks.unlockStateForPids(nsc.id, k, charPersp.map(p => p.id)) !== 'none').length;

  return (
    <div style={{ padding:'18px 24px 60px' }}>

      {/* ── NSC-Sichtbarkeit ── */}
      <button type="button" onClick={toggleVisible} disabled={saving} style={{
        width:'100%', padding:'10px 14px', marginBottom:20, textAlign:'left',
        cursor: saving ? 'default' : 'pointer',
        background: nsc.visible ? 'rgba(95,227,154,0.1)' : 'rgba(160,140,255,0.06)',
        border: `1px solid ${nsc.visible ? 'rgba(95,227,154,0.45)' : 'rgba(160,140,255,0.22)'}`,
        borderRadius:3, display:'flex', alignItems:'center', gap:10, transition:'all 0.15s',
      }}>
        <span style={{ fontFamily:'var(--font-mono)', fontSize:13, lineHeight:1,
          color: nsc.visible ? '#5fe39a' : 'rgba(160,140,255,0.35)' }}>
          {nsc.visible ? '◆' : '○'}
        </span>
        <span style={{ fontFamily:'var(--font-mono)', fontSize:9.5, letterSpacing:'0.18em',
          textTransform:'uppercase', color: nsc.visible ? '#5fe39a' : 'rgba(200,190,240,0.45)', flex:1 }}>
          {nsc.visible ? 'Für Spieler sichtbar' : 'Für Spieler verborgen'}
        </span>
        {saving && <span style={{ fontFamily:'var(--font-mono)', fontSize:7, color:'rgba(160,140,255,0.4)' }}>◈ …</span>}
      </button>

      {/* Charakter-Picker */}
      <div style={{ padding:'12px 16px', background:'rgba(124,77,255,0.04)', borderRadius:3,
        border:'1px solid rgba(124,77,255,0.2)', marginBottom:18 }}>
        <div style={{ fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.28em', color:'rgba(124,77,255,0.7)',
          textTransform:'uppercase', marginBottom:8 }}>◈ Freischalten für</div>
        <CharPickerDropdown options={charPersp} selected={dmTarget} onToggle={toggleTarget} players={players}/>
        <div style={{ display:'flex', gap:8, alignItems:'center' }}>
          <button type="button" onClick={() => setDmTarget(charPersp.map(p => p.id))} style={{
            padding:'2px 10px', background:'transparent',
            border:'1px solid rgba(124,77,255,0.35)', borderRadius:2,
            color:'rgba(124,77,255,0.55)', fontFamily:'var(--font-mono)', fontSize:8,
            letterSpacing:'0.18em', textTransform:'uppercase', cursor:'pointer',
          }}>Alle</button>
          <button type="button" onClick={() => setDmTarget([])} style={{
            padding:'2px 10px', background:'transparent',
            border:'1px solid rgba(160,140,255,0.25)', borderRadius:2,
            color:'rgba(160,140,255,0.5)', fontFamily:'var(--font-mono)', fontSize:8,
            letterSpacing:'0.18em', textTransform:'uppercase', cursor:'pointer',
          }}>Keiner</button>
          <div style={{ flex:1 }}/>
          <button type="button"
            onClick={() => {
              if (dmTarget.length === 0) return;
              if (confirm(`Alle Freischaltungen für „${nsc.name}" zurücksetzen (${dmTarget.map(id => charPersp.find(p => p.id === id)?.label || id).join(', ')})?`))
                unlocks.resetForPids(nsc.id, dmTarget);
            }}
            disabled={dmTarget.length === 0}
            style={{
              padding:'3px 10px', background:'transparent',
              border:'1px solid rgba(227,103,96,0.35)', borderRadius:2,
              color: dmTarget.length === 0 ? 'rgba(227,103,96,0.3)' : 'rgba(227,103,96,0.65)',
              fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.16em',
              textTransform:'uppercase', cursor: dmTarget.length === 0 ? 'default' : 'pointer',
            }}>↺ Reset</button>
        </div>
      </div>

      {/* Gesamt-Progress */}
      <div style={{ marginBottom:18, fontFamily:'var(--font-mono)', fontSize:8.5, letterSpacing:'0.18em',
        color:'rgba(160,140,255,0.55)', textTransform:'uppercase' }}>
        {unlockedCount} / {allKeys.length} Fakten haben mindestens eine Freischaltung
      </div>

      {/* Fakten-Gruppen */}
      {GROUPS.map(group => (
        <div key={group.title} style={{ marginBottom:20 }}>
          <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:8 }}>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:8.5, letterSpacing:'0.30em',
              color:'rgba(124,77,255,0.55)', textTransform:'uppercase' }}>◇ {group.title}</span>
            <div style={{ flex:1, height:1, background:'rgba(124,77,255,0.12)' }}/>
          </div>
          <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
            {group.keys.map(k => {
              const state = unlocks.unlockStateForPids(nsc.id, k, dmTarget);
              const stateAll = unlocks.unlockStateForPids(nsc.id, k, charPersp.map(p => p.id));
              return (
                <div key={k} style={{
                  display:'flex', alignItems:'center', gap:10,
                  padding:'6px 10px',
                  background: stateAll === 'all' ? 'rgba(124,77,255,0.05)' : stateAll === 'some' ? 'rgba(124,77,255,0.04)' : 'transparent',
                  border:`1px solid ${stateAll === 'all' ? 'rgba(124,77,255,0.18)' : stateAll === 'some' ? 'rgba(124,77,255,0.15)' : 'rgba(160,140,255,0.08)'}`,
                  borderRadius:2,
                }}>
                  <span style={{ fontFamily:'var(--font-mono)', fontSize:8.5, letterSpacing:'0.16em',
                    color:'rgba(200,190,240,0.6)', textTransform:'uppercase', flexShrink:0, minWidth:110 }}>
                    {factLabel(k)}
                  </span>
                  <span style={{ flex:1, fontFamily:'var(--font-body)', fontSize:11.5,
                    color:'rgba(200,190,240,0.5)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                    {getFactPreview(nsc, k)}
                  </span>
                  <UnlockToggle state={state} onClick={() => unlocks.toggleForPids(nsc.id, k, dmTarget)} size="sm"/>
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

// ── App ────────────────────────────────────────────────────
function App() {
  const { nscs: rawNscs, perspectives, charPids, players, loading } = useNSCData();
  const [nscs, setNscs] = dmUS([]);
  dmUE(() => { setNscs(rawNscs); }, [rawNscs]);

  const charPersp = dmUM(() => perspectives.filter(p => p.id !== 'alle'), [perspectives]);
  const unlocks = useUnlocks(nscs, charPids, 'alle', players);

  const [selectedId, setSelectedId] = dmUS(null);
  const [activeTab, setActiveTab] = dmUS('bearbeiten');
  const [newMode, setNewMode] = dmUS(false);
  const [search, setSearch] = dmUS('');
  const [visFilter, setVisFilter] = dmUS('alle'); // 'alle' | 'sichtbar' | 'verborgen'

  const selectedNsc = nscs.find(n => n.id === selectedId) || null;

  const handleSaved = (updated, isNew) => {
    if (isNew) {
      setNscs(prev => [updated, ...prev]);
    } else {
      setNscs(prev => prev.map(n => n.id === updated.id ? updated : n));
    }
    setSelectedId(updated.id);
    setNewMode(false);
    setActiveTab('bearbeiten');
  };

  const filteredNscs = dmUM(() => {
    const q = search.trim().toLowerCase();
    return nscs.filter(n => {
      if (visFilter === 'sichtbar'  && !n.visible) return false;
      if (visFilter === 'verborgen' && n.visible)  return false;
      if (q) {
        const hay = [n.name, n.beruf, n.division, n.rasse, ...(n.eigenschaften||[])].filter(Boolean).join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }, [nscs, search, visFilter]);

  const startNew = () => { setSelectedId(null); setNewMode(true); setActiveTab('bearbeiten'); };
  const selectNsc = (nsc) => { setSelectedId(nsc.id); setNewMode(false); setActiveTab(t => t === 'bearbeiten' ? 'bearbeiten' : 'ansicht'); };

  // Tab config
  const tabs = [
    { id:'ansicht',      label:'Ansicht',         disabled: newMode },
    { id:'bearbeiten',   label:'Daten bearbeiten' },
    { id:'sichtbarkeit', label:'Sichtbarkeit',     disabled: newMode },
  ];

  if (loading) return (
    <div style={{ position:'fixed', inset:0, background:'#05040f', display:'flex', alignItems:'center', justifyContent:'center' }}>
      <div style={{ fontFamily:'var(--font-mono)', fontSize:10, letterSpacing:'0.3em', color:'rgba(160,140,255,0.5)', textTransform:'uppercase' }}>
        ◈ Lade NSC-Verwaltung …
      </div>
    </div>
  );

  const PANEL_BG = 'linear-gradient(160deg, rgba(14,8,32,0.92), rgba(8,5,22,0.96))';

  return (
    <div style={{ minHeight:'100vh', position:'relative', paddingTop:52 }}>
      <PageHeader />
      <SiteNav rightLabel="NSC-VERWALTUNG" />

      {/* Two-column layout */}
      <div style={{ display:'grid', gridTemplateColumns:'340px 1fr', height:'calc(100vh - 52px)', overflow:'hidden' }}>

        {/* LEFT — NSC list */}
        <aside style={{ background: PANEL_BG, borderRight:'1px solid rgba(160,140,255,0.15)',
          display:'flex', flexDirection:'column', overflow:'hidden' }}>

          {/* List header */}
          <div style={{ padding:'14px 16px', borderBottom:'1px solid rgba(160,140,255,0.12)', flexShrink:0 }}>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10 }}>
              <span style={{ fontFamily:'var(--font-display)', fontSize:13, letterSpacing:'0.22em',
                color:'#f0eeff', textTransform:'uppercase' }}>NSC-Register</span>
              <button type="button" onClick={startNew} style={{
                padding:'4px 12px', background:'rgba(124,77,255,0.14)',
                border:'1px solid rgba(124,77,255,0.65)', borderRadius:2,
                color:'#c9b8ff', fontFamily:'var(--font-mono)', fontSize:9,
                letterSpacing:'0.18em', textTransform:'uppercase', cursor:'pointer',
              }}>＋ Neu</button>
            </div>

            {/* Search */}
            <div style={{ position:'relative', marginBottom:8 }}>
              <input value={search} onChange={e => setSearch(e.target.value)}
                placeholder="Name, Beruf, …"
                style={{ ...iSt, padding:'7px 28px 7px 10px', fontSize:11 }}
                onFocus={e => e.target.style.borderColor='rgba(124,77,255,0.7)'}
                onBlur={e => e.target.style.borderColor='rgba(124,77,255,0.4)'}/>
              <svg width="11" height="11" viewBox="0 0 12 12" style={{ position:'absolute', right:9, top:'50%', transform:'translateY(-50%)', opacity:0.45 }}>
                <circle cx="5" cy="5" r="3.5" fill="none" stroke="#7c4dff" strokeWidth="1"/>
                <line x1="7.5" y1="7.5" x2="10.5" y2="10.5" stroke="#7c4dff" strokeWidth="1"/>
              </svg>
            </div>

            {/* Visibility filter chips */}
            <div style={{ display:'flex', gap:5 }}>
              {[['alle','Alle'],['sichtbar','◆ Sichtbar'],['verborgen','○ Verborgen']].map(([v,l]) => (
                <button key={v} type="button" onClick={() => setVisFilter(v)} style={{
                  flex:1, padding:'3px 6px', fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.14em',
                  background: visFilter===v ? 'rgba(124,77,255,0.22)' : 'transparent',
                  border:`1px solid ${visFilter===v ? 'rgba(160,140,255,0.6)' : 'rgba(160,140,255,0.2)'}`,
                  color: visFilter===v ? '#f0eeff' : 'rgba(200,190,240,0.5)',
                  borderRadius:2, cursor:'pointer', textTransform:'uppercase', textAlign:'center',
                }}>{l}</button>
              ))}
            </div>
          </div>

          {/* List count */}
          <div style={{ padding:'6px 16px', flexShrink:0, borderBottom:'1px solid rgba(160,140,255,0.08)',
            fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.18em', color:'rgba(160,140,255,0.4)', textTransform:'uppercase' }}>
            {filteredNscs.length} / {nscs.length} NSC
          </div>

          {/* Scrollable list */}
          <div style={{ flex:1, overflowY:'auto' }}>
            {filteredNscs.length === 0 ? (
              <div style={{ padding:'32px 20px', textAlign:'center',
                fontFamily:'var(--font-body)', fontSize:12, color:'rgba(160,140,255,0.4)', fontStyle:'italic' }}>
                Keine NSC gefunden.
              </div>
            ) : filteredNscs.map(nsc => (
              <NscListRow key={nsc.id} nsc={nsc}
                selected={!newMode && selectedId === nsc.id}
                onClick={selectNsc}/>
            ))}
          </div>
        </aside>

        {/* RIGHT — Editor / Visibility */}
        <div style={{ display:'flex', flexDirection:'column', overflow:'hidden', background: PANEL_BG }}>

          {/* Right panel header */}
          <div style={{ padding:'14px 22px', borderBottom:'1px solid rgba(124,77,255,0.18)',
            background:'rgba(124,77,255,0.03)', flexShrink:0,
            display:'flex', alignItems:'center', gap:12 }}>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:8, letterSpacing:'0.28em',
              color:'rgba(124,77,255,0.55)', textTransform:'uppercase' }}>◈ SPIELLEITUNG</span>
            <div style={{ height:14, width:1, background:'rgba(124,77,255,0.25)' }}/>
            <span style={{ fontFamily:'var(--font-display)', fontSize:17, letterSpacing:'0.08em', color:'#f0eeff', flex:1, minWidth:0,
              overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
              {newMode ? 'Neuer NSC' : (selectedNsc?.name || <span style={{ color:'rgba(160,140,255,0.4)', fontStyle:'italic' }}>Keinen NSC ausgewählt</span>)}
            </span>
            {selectedNsc && !newMode && (
              <span style={{ fontFamily:'var(--font-mono)', fontSize:9, letterSpacing:'0.14em',
                color: selectedNsc.visible ? '#5fe39a' : 'rgba(160,140,255,0.4)', textTransform:'uppercase', flexShrink:0 }}>
                {selectedNsc.visible ? '◆ Sichtbar' : '○ Verborgen'}
              </span>
            )}
          </div>

          {/* Tab bar */}
          <div style={{ display:'flex', borderBottom:'1px solid rgba(160,140,255,0.15)', flexShrink:0 }}>
            {tabs.map(tab => (
              <button key={tab.id} type="button"
                onClick={() => !tab.disabled && setActiveTab(tab.id)}
                disabled={tab.disabled}
                style={{
                  padding:'10px 22px', background:'transparent', border:'none',
                  borderBottom: activeTab === tab.id ? '2px solid #c9b8ff' : '2px solid transparent',
                  color: tab.disabled ? 'rgba(160,140,255,0.25)'
                       : activeTab === tab.id ? '#c9b8ff' : 'rgba(200,190,240,0.65)',
                  fontFamily:'var(--font-mono)', fontSize:9.5, letterSpacing:'0.20em',
                  textTransform:'uppercase', cursor: tab.disabled ? 'default' : 'pointer',
                  transition:'color 0.15s, border-color 0.15s',
                }}
              >{tab.label}</button>
            ))}
          </div>

          {/* Tab content */}
          <div style={{ flex:1, overflowY:'auto' }}>
            {(newMode || selectedNsc) ? (
              selectedNsc && activeTab === 'ansicht' ? (
                <NscAnsichtTab nsc={selectedNsc} />
              ) : activeTab === 'bearbeiten' ? (
                <NscEditForm key={newMode ? 'new' : selectedNsc?.id} nsc={newMode ? null : selectedNsc} onSaved={handleSaved} nscs={nscs} charPersp={charPersp}/>
              ) : selectedNsc && activeTab === 'sichtbarkeit' ? (
                <VisibilityPanel nsc={selectedNsc} unlocks={unlocks} charPersp={charPersp} players={players}
                onNscUpdated={updated => setNscs(prev => prev.map(n => n.id === updated.id ? updated : n))}/>
              ) : null
            ) : (
              <div style={{ padding:'60px 30px', textAlign:'center',
                fontFamily:'var(--font-body)', fontSize:13, color:'rgba(160,140,255,0.4)', fontStyle:'italic' }}>
                NSC aus der Liste auswählen oder einen neuen anlegen.
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

const { SiteGate } = window;
ReactDOM.createRoot(document.getElementById('root')).render(<SiteGate><App /></SiteGate>);
</script>
</body></html>
