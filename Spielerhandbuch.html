// ── HELPERS ──────────────────────────────────────────────
function hexPoints(s) {
  const cx = s/2, cy = s/2, r = s/2;
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = (Math.PI/180)*(60*i - 30);
    pts.push(`${cx + r*Math.cos(a)},${cy + r*Math.sin(a)}`);
  }
  return pts.join(' ');
}

function FloatingHexField({ mouseX, mouseY }) {
  return (
    <div style={{ position:'fixed', inset:0, pointerEvents:'none', zIndex:1, overflow:'hidden', clipPath:'inset(212px 0 0 0)' }}>
      {HEX_DEFS.map((h, i) => {
        const px = hexPoints(h.size);
        const parallaxX = (mouseX - 0.5) * (i % 3 === 0 ? -12 : i % 3 === 1 ? -6 : -18);
        const parallaxY = (mouseY - 0.5) * (i % 3 === 0 ? -8  : i % 3 === 1 ? -4 : -14);
        return (
          <div key={i} style={{ position:'absolute', left:h.x, top:h.y, animation:`${h.anim} ${h.dur} ease-in-out infinite`, animationDelay:`${i*0.7}s`, transform:`translate(${parallaxX}px,${parallaxY}px)`, transition:'transform 0.4s ease-out', willChange:'transform' }}>
            <svg width={h.size} height={h.size} viewBox={`0 0 ${h.size} ${h.size}`} style={{ display:'block', opacity:h.opacity, filter:`drop-shadow(0 0 ${h.size*0.06}px #7c4dff)` }}>
              <polygon points={px} fill="transparent" stroke="#7c4dff" strokeWidth="1" />
            </svg>
          </div>
        );
      })}
    </div>
  );
}

// ── PARTICLES ────────────────────────────────────────────
function ParticleField({ mouseX, mouseY }) {
  const canvasRef = useRef(null);
  const animRef = useRef(null);
  const particles = useRef([]);
  const mouse = useRef({ x:0.5, y:0.5 });
  useEffect(() => { mouse.current = { x: mouseX, y: mouseY }; }, [mouseX, mouseY]);
  useEffect(() => {
    const canvas = canvasRef.current; if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const resize = () => { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; };
    resize(); window.addEventListener('resize', resize);
    particles.current = Array.from({length:55}, () => ({
      x: Math.random(), y: Math.random(),
      r: Math.random()*1.6+0.5,
      vx:(Math.random()-0.5)*0.05, vy:(Math.random()-0.5)*0.05,
      alpha: Math.random()*0.2+0.05,
    }));
    const tick = () => {
      const w = canvas.width, h = canvas.height;
      const shiftX = (mouse.current.x - 0.5)*-14, shiftY = (mouse.current.y - 0.5)*-14;
      ctx.clearRect(0,0,w,h);
      particles.current.forEach(p => {
        p.x += p.vx/w*60; p.y += p.vy/h*60;
        if(p.x<0)p.x=1; if(p.x>1)p.x=0; if(p.y<0)p.y=1; if(p.y>1)p.y=0;
        ctx.beginPath(); ctx.arc(p.x*w+shiftX, p.y*h+shiftY, p.r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(160,140,255,${p.alpha})`; ctx.fill();
      });
      animRef.current = requestAnimationFrame(tick);
    };
    tick();
    return () => { cancelAnimationFrame(animRef.current); window.removeEventListener('resize', resize); };
  }, []);
  return <canvas ref={canvasRef} style={{ position:'fixed', inset:0, width:'100%', height:'100%', pointerEvents:'none', zIndex:0, clipPath:'inset(212px 0 0 0)' }} />;
}

// ── SCROLL REVEAL ────────────────────────────────────────
function useScrollReveal() {
  useEffect(() => {
    const revealed = new WeakSet();
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting || revealed.has(entry.target)) return;
        revealed.add(entry.target);
        observer.unobserve(entry.target);
        entry.target.classList.add('visible');
      });
    }, { threshold: 0.05, rootMargin: '0px 0px -20px 0px' });
    const t = setTimeout(() => {
      document.querySelectorAll('.reveal-up').forEach(el => observer.observe(el));
    }, 100);
    return () => { clearTimeout(t); observer.disconnect(); };
  }, []);
}

          <div style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.32em', color:'rgba(160,140,255,0.45)', textTransform:'uppercase', marginBottom:'14px' }}>
            Meruria · Codex
          </div>
          <h1 style={{ fontFamily:'var(--font-display)', fontSize:'clamp(30px,4vw,50px)', fontWeight:'300', letterSpacing:'0.22em', color:'#f0eeff', textShadow:'0 0 50px rgba(124,77,255,0.4)', marginBottom:'18px', lineHeight:1.15, textTransform:'uppercase' }}>
            Spielerhandbuch
          </h1>
          <div style={{ display:'flex', alignItems:'center', gap:'12px', justifyContent:'center', marginBottom:'22px' }}>
            <div style={{ width:'60px', height:'1px', background:'linear-gradient(270deg, rgba(124,77,255,0.6), transparent)' }} />
            <svg width="8" height="8" viewBox="0 0 8 8"><polygon points={hexPoints(8)} fill="rgba(124,77,255,0.35)" stroke="rgba(160,140,255,0.6)" strokeWidth="0.8" /></svg>
            <div style={{ width:'8px', height:'1px', background:'rgba(124,77,255,0.4)', animation:'pulse-glow 2s infinite' }} />
            <svg width="5" height="5" viewBox="0 0 5 5"><polygon points={hexPoints(5)} fill="rgba(160,140,255,0.2)" stroke="rgba(160,140,255,0.4)" strokeWidth="0.6" /></svg>
            <div style={{ width:'8px', height:'1px', background:'rgba(124,77,255,0.4)', animation:'pulse-glow 2s infinite 0.4s' }} />
            <svg width="8" height="8" viewBox="0 0 8 8"><polygon points={hexPoints(8)} fill="rgba(124,77,255,0.35)" stroke="rgba(160,140,255,0.6)" strokeWidth="0.8" /></svg>
            <div style={{ width:'60px', height:'1px', background:'linear-gradient(90deg, rgba(124,77,255,0.6), transparent)' }} />
          </div>
          <p style={{ fontFamily:'var(--font-body)', fontWeight:'300', fontSize:'13px', lineHeight:1.9, color:'rgba(220,210,255,0.5)', letterSpacing:'0.05em', maxWidth:'580px', margin:'0 auto', textWrap:'pretty' }}>
            Die Regeln, die Welt­logik und das gesellschaft­liche Gerüst Merurias — alles, was abseits des eigenen Charakters zu wissen ist, bevor das erste Würfelpaar fällt.
          </p>
        </div>

        {/* Codex header strip */}
        <div className="reveal-up" style={{ transitionDelay:'0.04s', display:'flex', alignItems:'center', gap:'14px', marginBottom:'22px' }}>
          <div style={{ display:'flex', alignItems:'center', gap:'10px' }}>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:'9px', letterSpacing:'0.28em', color:'rgba(160,140,255,0.7)', textTransform:'uppercase' }}>Inhalt</span>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:'9px', letterSpacing:'0.18em', color:'rgba(160,140,255,0.4)' }}>·</span>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:'9px', letterSpacing:'0.18em', color:'rgba(160,140,255,0.45)' }}>{`${SECTIONS.length.toString().padStart(2,'0')} Sektionen`}</span>
          </div>
          <div style={{ flex:1, height:'1px', background:'linear-gradient(90deg, rgba(160,140,255,0.25) 0%, transparent 100%)' }}/>
          <div style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.3em', color:'rgba(160,140,255,0.35)', textTransform:'uppercase' }}>
            Spielerhandbuch
          </div>
        </div>

        {/* Ribbon stack with vertical spine */}
        <div style={{ display:'flex', flexDirection:'column', gap:'14px', position:'relative' }}>
          {SECTIONS.map((sec, i) => (
            <RibbonCard
              key={sec.id}
              sec={sec}
              index={i}
              isFirst={i === 0}
              isLast={i === SECTIONS.length - 1}
              delay={0.06 + i * 0.06}
            />
          ))}
        </div>

        {/* Closing flourish */}
        <div className="reveal-up" style={{ transitionDelay:'0.4s', display:'flex', alignItems:'center', gap:'14px', marginTop:'34px', justifyContent:'center' }}>
          <div style={{ width:'80px', height:'1px', background:'linear-gradient(270deg, rgba(124,77,255,0.5), transparent)' }} />
          <svg width="6" height="6" viewBox="0 0 6 6"><polygon points={hexPoints(6)} fill="rgba(124,77,255,0.4)" stroke="rgba(160,140,255,0.5)" strokeWidth="0.5" /></svg>
          <div style={{ width:'80px', height:'1px', background:'linear-gradient(90deg, rgba(124,77,255,0.5), transparent)' }} />
        </div>

      </div>

      {/* ── FOOTER ── */}
      <div style={{ position:'relative', zIndex:10, padding:'10px 32px', borderTop:'1px solid rgba(160,140,255,0.07)', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
        <div style={{ fontFamily:'var(--font-mono)', fontSize:'7px', color:'rgba(160,140,255,0.22)', letterSpacing:'0.2em' }}>◈ ARCHIV-STATUS: NOMINAL ◈ EPOCHE: UNBEKANNT</div>
        <div style={{ fontFamily:'var(--font-mono)', fontSize:'7px', color:'rgba(160,140,255,0.22)', letterSpacing:'0.2em' }}>MERURIA // CHARAKTER-ARCHIV</div>
      </div>

      <TweaksPanel>
        <TweakSection label="Atmosphäre"/>
        <TweakToggle id="showParticles" label="Partikel"/>
        <TweakToggle id="showHexes" label="Hexagone"/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<SiteGate><App/></SiteGate>);
</script>
