name: Check build

# Build-Fehler sollen vor dem Merge auffallen, nicht erst beim Deploy auf master.
on:
  pull_request:
  push:
    branches: [devel]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/generate-galerie-data.mjs
      - run: npm run build
      - run: node tools/check-font-sizes.mjs
