name: Galerie-Daten generieren

on:
  push:
    branches: [master]
    paths:
      - 'assets/images/monster/**'
      - 'tools/generate-galerie-data.mjs'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Galerie-Daten generieren
        run: node tools/generate-galerie-data.mjs

      - name: Änderungen committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/scripts/data/galerie-data.js
          git diff --staged --quiet || git commit -m "auto: galerie-data.js neu generiert"
          git push
