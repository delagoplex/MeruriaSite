  { name: '— Unbekannt —', rolle: 'Name noch nicht festgelegt', beschreibung: 'Dieser Eintrag ist für einen bekannten Aasimar in Meruria reserviert.' },
  { name: '— Unbekannt —', rolle: 'Name noch nicht festgelegt', beschreibung: 'Dieser Eintrag ist für einen bekannten Aasimar in Meruria reserviert.' },
];

// ── HOOKS ─────────────────────────────────────────────────
function useScrollReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal,.reveal-left,.reveal-right');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
    }, { threshold: 0.06, rootMargin: '0px 0px -20px 0px' });
    els.forEach(el => observer.observe(el));
    return () => observer.disconnect();
  }, []);
}

function useParallax() {
  useEffect(() => {
    const hero = document.getElementById('hero-bg');
    if (!hero) return;
    const onScroll = () => { hero.style.transform = `translateY(${window.scrollY * 0.35}px)`; };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
}

// ── CELESTISCHES MERKMAL WÜRFELN ──────────────────────────
function CelestialRoller() {
  const [result, setResult] = useState(null);
  const [rolling, setRolling] = useState(false);
  const [roll, setRoll] = useState(null);

  const rollDice = () => {
    if (rolling) return;
    setRolling(true); setResult(null);
    let count = 0;
    const iv = setInterval(() => {
      setResult(CELESTISCHE_MERKMALE[Math.floor(Math.random()*6)]);
      count++;
      if (count > 12) {
        clearInterval(iv);
        const idx = Math.floor(Math.random()*6);
        setRoll(idx+1); setResult(CELESTISCHE_MERKMALE[idx]); setRolling(false);
      }
    }, 70);
  };

  return (
    <div>
      <p className="body-text" style={{ marginBottom:'20px' }}>
        Diese Tabelle enthält Beispiele für celestische Merkmale. Würfle oder wähle ein Merkmal, das zu deinem Aasimar passt.
      </p>
      <button className="dice-btn" onClick={rollDice} style={{ marginBottom:'20px' }}>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="1.5" style={{ animation:rolling?'dice-spin 0.4s linear infinite':'none', transformOrigin:'center' }}>
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/>
          <circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"/>
          <circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"/>
          <circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/>
          <circle cx="12" cy="12" r="1.2" fill="currentColor"/>
        </svg>
        Würfeln
      </button>

      {/* Tabelle */}
      <div style={{ border:'1px solid rgba(124,77,255,0.15)', borderRadius:'4px', overflow:'hidden', background:'rgba(var(--bg2-rgb),0.7)', marginBottom: result ? '16px' : '0' }}>
        <table className="celestial-table" style={{ width:'100%' }}>
          <thead>
            <tr>
              <th>1W6</th>
              <th>Celestisches Merkmal</th>
            </tr>
          </thead>
          <tbody>
            {CELESTISCHE_MERKMALE.map((m, i) => (
              <tr key={i} className={result === m ? 'highlight' : ''} style={{ background: result === m ? 'rgba(124,77,255,0.1)' : 'transparent', cursor:'pointer', transition:'background 0.2s' }}
                onClick={() => { setResult(m); setRoll(i+1); }}>
                <td>{i+1}</td>
                <td>{m}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {result && (
        <div style={{ animation:rolling?'none':'result-pop 0.35s cubic-bezier(0.23,1,0.32,1) forwards', padding:'16px 20px', background:'rgba(124,77,255,0.1)', border:'1px solid rgba(124,77,255,0.3)', borderRadius:'4px', marginTop:'16px' }}>
          <div style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.22em', color:'rgba(124,77,255,0.5)', textTransform:'uppercase', marginBottom:'6px' }}>Ergebnis: {roll}</div>
          <div style={{ fontFamily:'var(--font-body)', fontWeight:'400', fontSize:'14px', color:'var(--white)', lineHeight:'1.5' }}>{result}</div>
        </div>
      )}
    </div>
  );
}

// ── CHARACTER GENERATOR ───────────────────────────────────
function CharacterGenerator() {
  const [chars, setChars] = useState(null);
  const [rolling, setRolling] = useState(false);
  const rollD = (n) => Math.floor(Math.random()*n)+1;

  const generate = () => {
    if (rolling) return;
    setRolling(true);
    setTimeout(() => {
      const geschlecht = Math.random() < 0.5 ? 'männlich' : 'weiblich';
      const alter = Math.floor(Math.random()*140)+18;
      const augen = ['leuchtend blau','golden','silbern','violett','perlweiß','tiefschwarz'][Math.floor(Math.random()*6)];
      const haut = ['hell mit Goldschimmer','dunkel mit Silberglanz','blass mit Perlmutt','bronzefarben','obsidianfarben','opalschimmernd'][Math.floor(Math.random()*6)];
      const haar = ['weißblond','silbern','goldblond','schwarz mit Glanz','leuchtend kupfer','tintenschwarz'][Math.floor(Math.random()*6)];
      const merkmal = CELESTISCHE_MERKMALE[Math.floor(Math.random()*6)];
      const offenbarung = ['Gleißende Seele','Gleißendes Verzehren','Nekrotische Spukgestalt'][Math.floor(Math.random()*3)];
      setChars({ geschlecht, alter, augen, haut, haar, merkmal, offenbarung });
      setRolling(false);
    }, 350);
  };

  return (
    <div className="reveal">
      <p className="body-text" style={{ marginBottom:'20px' }}>
        Lass dir die Merkmale deines Aasimar-Charakters auswürfeln.
      </p>
      <button className="dice-btn" onClick={generate} style={{ marginBottom:'20px' }}>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="1.5" style={{ animation:rolling?'dice-spin 0.5s linear infinite':'none', transformOrigin:'center' }}>
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
        Charakter würfeln
      </button>
      {chars && (
        <div style={{ animation:'result-pop 0.35s cubic-bezier(0.23,1,0.32,1) forwards', display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))', gap:'10px' }}>
          {[
            ['Geschlecht', chars.geschlecht],
            ['Alter', `${chars.alter} Jahre`],
            ['Augenfarbe', chars.augen],
            ['Hautfarbe', chars.haut],
            ['Haarfarbe', chars.haar],
            ['Celestisches Merkmal', chars.merkmal],
            ['Offenbarung (ab Stufe 3)', chars.offenbarung],
          ].map(([k,v]) => (
            <div key={k} style={{ padding:'12px 14px', background:'rgba(124,77,255,0.07)', border:'1px solid rgba(124,77,255,0.14)', borderRadius:'4px' }}>
              <div style={{ fontFamily:'var(--font-mono)', fontSize:'7px', letterSpacing:'0.2em', color:'rgba(124,77,255,0.5)', textTransform:'uppercase', marginBottom:'5px' }}>{k}</div>
              <div style={{ fontFamily:'var(--font-display)', fontSize:'13px', fontWeight:'300', letterSpacing:'0.05em', color:'var(--white)', lineHeight:'1.4' }}>{v}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── RASSEN RADAR ──────────────────────────────────────────
function RassenRadar() {
  const traits = [
    { label: 'Mobilität',   val: 50 },
    { label: 'Kampf',       val: 58 },
    { label: 'Magie',       val: 82 },
    { label: 'Soziales',    val: 88 },
    { label: 'Überleben',   val: 60 },
    { label: 'Weisheit',    val: 75 },
  ];
  const cx = 155, cy = 155, r = 100;
  const n = traits.length;
  const angle = (i) => (Math.PI * 2 * i) / n - Math.PI / 2;
  const pt = (i, radius) => ({ x: cx + radius * Math.cos(angle(i)), y: cy + radius * Math.sin(angle(i)) });
  const rings = [0.25, 0.5, 0.75, 1.0];
  const ringPts = (s) => traits.map((_, i) => pt(i, r * s)).map(p => `${p.x},${p.y}`).join(' ');
  const valuePts = traits.map((t, i) => pt(i, r * (t.val / 100))).map(p => `${p.x},${p.y}`).join(' ');
  const labelPt = (i) => {
    if (i === 4 || i === 5) return pt(i, r + 32);
    return pt(i, r + 26);
  };

  return (
    <Section label="Charaktererstellung" title="Merkmals-Profil">
      <div className="reveal" style={{ display:'grid', gridTemplateColumns:'310px 1fr', gap:'40px', alignItems:'center' }}>
        <div style={{ display:'flex', justifyContent:'center' }}>
          <svg viewBox="-10 0 330 320" width="320" height="310">
            {rings.map((s, ri) => <polygon key={ri} points={ringPts(s)} fill="none" stroke={`rgba(124,77,255,${0.07 + ri * 0.06})`} strokeWidth="1"/>)}
            {traits.map((_, i) => { const p = pt(i, r); return <line key={i} x1={cx} y1={cy} x2={p.x} y2={p.y} stroke="rgba(124,77,255,0.14)" strokeWidth="1"/>; })}
            <polygon points={valuePts} fill="rgba(124,77,255,0.14)" stroke="rgba(168,124,255,0.65)" strokeWidth="1.5"/>
            {traits.map((t, i) => { const p = pt(i, r * (t.val / 100)); return <circle key={i} cx={p.x} cy={p.y} r="3.5" fill="#a87cff" stroke="rgba(var(--bg-rgb),0.8)" strokeWidth="1.5"/>; })}
            {traits.map((t, i) => { const p = labelPt(i); const anchor = p.x < cx - 5 ? 'end' : p.x > cx + 5 ? 'start' : 'middle'; return <text key={i} x={p.x} y={p.y + 4} textAnchor={anchor} fontSize="9" fill="rgba(var(--text2-rgb),0.6)" fontFamily="'Share Tech Mono', monospace" letterSpacing="0.1em">{t.label.toUpperCase()}</text>; })}
            <circle cx={cx} cy={cy} r="3" fill="rgba(124,77,255,0.5)"/>
          </svg>
        </div>
        <div style={{ display:'flex', flexDirection:'column', gap:'14px' }}>
          <p className="body-text" style={{ marginBottom:'8px' }}>
            Aasimar sind sozial begabt und magisch stark — ihr celestisches Erbe macht sie zu natürlichen Anführern und Heilern.
          </p>
          {traits.map((t) => (
            <div key={t.label}>
              <div style={{ display:'flex', justifyContent:'space-between', marginBottom:'5px' }}>
                <span style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.18em', color:'rgba(var(--text2-rgb),0.5)', textTransform:'uppercase' }}>{t.label}</span>
                <span style={{ fontFamily:'var(--font-mono)', fontSize:'8px', color:'rgba(124,77,255,0.7)' }}>{t.val}</span>
              </div>
              <div style={{ height:'3px', background:'rgba(124,77,255,0.1)', borderRadius:'2px', overflow:'hidden' }}>
                <div style={{ height:'100%', width:`${t.val}%`, background:'linear-gradient(90deg,rgba(124,77,255,0.5),rgba(168,124,255,0.85))', borderRadius:'2px' }}/>
              </div>
            </div>
          ))}
        </div>
      </div>
    </Section>
  );
}

  'Druide':      'Das Natürliche und das Celestische sind nicht so verschieden, wie man denkt. Du lebst an der Kreuzung.',

function AasimarQuiz() {
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState([]);
  const [result, setResult] = useState(null);
  const [selected, setSelected] = useState(null);

  const choose = (opt) => {
    setSelected(opt);
    setTimeout(() => {
      const newAnswers = [...answers, ...opt.tags];
      if (step < AASIMAR_QUIZ_STEPS.length - 1) {
        setAnswers(newAnswers); setStep(s => s + 1); setSelected(null);
      } else {
        const count = {};
        newAnswers.forEach(t => { count[t] = (count[t] || 0) + 1; });
        const sorted = Object.entries(count).sort((a,b) => b[1]-a[1]);
        setResult(sorted[0][0]);
      }
    }, 280);
  };
  const reset = () => { setStep(0); setAnswers([]); setResult(null); setSelected(null); };

  return (
    <Section label="Charaktererstellung" title="Kenne deinen Charakter">
      <p className="body-text reveal" style={{ marginBottom:'28px' }}>
        Vier kurze Fragen — und du bekommst eine Klassenempfehlung, die zu deinem Aasimar passt.
      </p>
      <div className="reveal" style={{ maxWidth:'560px' }}>
        {!result ? (
          <div>
            <div style={{ display:'flex', gap:'6px', marginBottom:'24px' }}>
              {AASIMAR_QUIZ_STEPS.map((_, i) => <div key={i} style={{ flex:1, height:'2px', borderRadius:'1px', background: i <= step ? 'rgba(124,77,255,0.7)' : 'rgba(124,77,255,0.14)', transition:'background 0.3s' }}/>)}
            </div>
            <div style={{ fontFamily:'var(--font-display)', fontSize:'15px', fontWeight:'300', letterSpacing:'0.1em', color:'var(--white)', marginBottom:'20px', lineHeight:'1.5' }}>
              {AASIMAR_QUIZ_STEPS[step].frage}
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:'10px' }}>
              {AASIMAR_QUIZ_STEPS[step].optionen.map((opt, i) => (
                <button key={i} onClick={() => choose(opt)}
                  style={{ textAlign:'left', padding:'14px 18px', background: selected===opt ? 'rgba(124,77,255,0.2)' : 'rgba(124,77,255,0.06)', border:`1px solid ${selected===opt ? 'rgba(124,77,255,0.6)' : 'rgba(124,77,255,0.18)'}`, borderRadius:'4px', color: selected===opt ? 'var(--white)' : 'rgba(var(--text2-rgb),0.7)', fontFamily:'var(--font-body)', fontWeight:'300', fontSize:'12px', lineHeight:'1.5', letterSpacing:'0.04em', cursor:'pointer', transition:'all 0.15s' }}
                  onMouseEnter={e=>{ if(selected!==opt){ e.currentTarget.style.background='rgba(124,77,255,0.1)'; e.currentTarget.style.borderColor='rgba(124,77,255,0.35)'; e.currentTarget.style.color='var(--white)'; }}}
                  onMouseLeave={e=>{ if(selected!==opt){ e.currentTarget.style.background='rgba(124,77,255,0.06)'; e.currentTarget.style.borderColor='rgba(124,77,255,0.18)'; e.currentTarget.style.color='rgba(var(--text2-rgb),0.7)'; }}}>
                  {opt.text}
                </button>
              ))}
            </div>
            <div style={{ marginTop:'14px', fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.2em', color:'rgba(124,77,255,0.28)', textTransform:'uppercase' }}>Frage {step+1} / {AASIMAR_QUIZ_STEPS.length}</div>
          </div>
        ) : (
          <div style={{ animation:'result-pop 0.4s cubic-bezier(0.23,1,0.32,1) forwards' }}>
            <div style={{ padding:'28px', border:'1px solid rgba(124,77,255,0.28)', borderRadius:'6px', background:'linear-gradient(135deg,rgba(124,77,255,0.09) 0%,rgba(var(--panel-rgb),0.92) 100%)' }}>
              <div style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.28em', color:'rgba(124,77,255,0.5)', textTransform:'uppercase', marginBottom:'10px' }}>Empfohlene Klasse</div>
              <div style={{ fontFamily:'var(--font-display)', fontSize:'30px', fontWeight:'300', letterSpacing:'0.14em', color:'var(--white)', textTransform:'uppercase', marginBottom:'12px', textShadow:'0 0 28px rgba(124,77,255,0.4)' }}>{result}</div>
              <div style={{ width:'36px', height:'1px', background:'linear-gradient(90deg,rgba(124,77,255,0.8),transparent)', marginBottom:'16px' }}/>
              <p style={{ fontFamily:'var(--font-body)', fontWeight:'300', fontSize:'13px', lineHeight:'1.8', color:'rgba(var(--text2-rgb),0.65)' }}>
                {AASIMAR_KLASSEN_DESC[result] || 'Eine starke Wahl für einen Aasimar-Charakter.'}
              </p>
            </div>
            <button onClick={reset} style={{ marginTop:'16px', display:'inline-flex', alignItems:'center', gap:'8px', background:'none', border:'none', cursor:'pointer', fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.22em', color:'rgba(124,77,255,0.5)', textTransform:'uppercase', padding:'0', transition:'color 0.2s' }}
              onMouseEnter={e=>e.currentTarget.style.color='rgba(168,124,255,0.85)'}
              onMouseLeave={e=>e.currentTarget.style.color='rgba(124,77,255,0.5)'}>
              <svg viewBox="0 0 14 14" width="11" height="11" fill="none" stroke="currentColor" strokeWidth="1.4"><path d="M2 7 A5 5 0 1 1 5 11.2" strokeLinecap="round"/><path d="M2 4v3h3" strokeLinecap="round" strokeLinejoin="round"/></svg>
              Nochmal spielen
            </button>
          </div>
        )}
      </div>
    </Section>
  );
}

                <div style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.2em', color:'rgba(124,77,255,0.5)', textTransform:'uppercase', marginBottom:'12px' }}>Körperliche Werte</div>
                <table style={{ width:'100%', borderCollapse:'collapse' }}>
                  <tbody>
                    {[
                      ['Bewegungsrate', '9 m'],
                      ['Volljährigkeit', 'wie Ursprungsrasse'],
                      ['Lebenserwartung', 'älter als Ursprungsrasse\n(160 bei Mensch)'],
                      ['Größe', 'wie Ursprungsrasse'],
                      ['Augenfarbe', 'wie Ursprungsrasse'],
                      ['Hautfarbe', 'wie Ursprungsrasse'],
                    ].map(([k,v]) => (
                      <tr key={k} style={{ borderBottom:'1px solid rgba(124,77,255,0.08)' }}>
                        <td style={{ padding:'10px 14px', fontFamily:'var(--font-mono)', fontSize:'9px', letterSpacing:'0.1em', color:'rgba(124,77,255,0.5)', textTransform:'uppercase', width:'44%' }}>{k}</td>
                        <td style={{ padding:'10px 14px', fontFamily:'var(--font-body)', fontWeight:'300', fontSize:'12px', color:'rgba(var(--text-rgb),0.85)', whiteSpace:'pre-line' }}>{v}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <CharacterGenerator />
            </div>
          </div>
        </Section>

        {/* Lebensraum */}
        <Section label="Lore · Meruria" title="Verbreitung in Meruria">
          <p className="body-text reveal" style={{ marginBottom:'24px' }}>
            Aasimar tauchen überall in Meruria auf — es gibt keinen festgelegten Lebensraum. Ziehe eine Karte in den Bereich unten, um zu zeigen, wo Aasimar in deiner Welt besonders häufig auftreten.
          </p>
          <div className="reveal" style={{ position:'relative', width:'100%', aspectRatio:'16/9', border:'1px dashed rgba(124,77,255,0.25)', borderRadius:'4px', overflow:'hidden', background:'repeating-linear-gradient(-45deg,transparent,transparent 10px,rgba(124,77,255,0.04) 10px,rgba(124,77,255,0.04) 11px), linear-gradient(160deg,rgba(12,8,32,0.97) 0%,rgba(var(--bg-rgb),0.99) 100%)' }}>
            <image-slot slot-id="aasimar-map" placeholder="Verbreitungskarte hier ablegen" shape="rect" style={{ display:'block', width:'100%', height:'100%' }} />
            <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'14px', pointerEvents:'none', zIndex:0 }}>
              <svg viewBox="0 0 48 48" width="40" height="40" fill="none" style={{ opacity:0.2 }}>
                <path d="M6 38L18 14l8 16 6-8 10 16" stroke="#a87cff" strokeWidth="1.4" strokeLinejoin="round"/>
                <circle cx="36" cy="12" r="4" stroke="#a87cff" strokeWidth="1.2"/>
                <rect x="3" y="3" width="42" height="42" rx="3" stroke="#a87cff" strokeWidth="1"/>
              </svg>
              <span style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.28em', color:'rgba(124,77,255,0.3)', textTransform:'uppercase' }}>Verbreitungskarte</span>
              <span style={{ fontFamily:'var(--font-body)', fontWeight:'300', fontSize:'11px', color:'rgba(124,77,255,0.2)', letterSpacing:'0.06em' }}>Bild hierher ziehen</span>
            </div>
          </div>
        </Section>

        {/* Beziehungen */}
        <Section label="Lore · Meruria" title="Beziehungen zu anderen Gesellschaften">
          <p className="body-text reveal" style={{ marginBottom:'24px' }}>
            Aasimar werden je nach Volk und Ort sehr unterschiedlich wahrgenommen — als Gesandte der Götter, als Kuriositäten oder als Bedrohung.
          </p>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))', gap:'14px' }}>
            {[
              { volk:'Menschen', relation:'Ehrfurcht', text:'Viele Menschen sehen in Aasimar Gesandte der Götter. Das bringt Erwartungen mit sich, die manchem Aasimar schwer werden.' },
              { volk:'Elfen', relation:'Neugier', text:'Elfen interessiert die Frage, ob das celestische Erbe eines Aasimar über den Tod hinaus wirkt. Philosophische Gespräche sind garantiert.' },
              { volk:'Zwerge', relation:'Respekt', text:'Zwerge respektieren Stärke — und ein Aasimar, der kämpft oder heilt, verdient sich diesen Respekt schnell.' },
              { volk:'Tieflinge', relation:'Ambivalenz', text:'Die Beziehung zwischen Aasimar und Tieflinge ist komplex: Beide tragen ein übernatürliches Erbe, aber in entgegengesetzte Richtungen.' },
              { volk:'Kleriker', relation:'Verbundenheit', text:'Kleriker jeder Gottheit fühlen eine natürliche Verbindung zu Aasimar — unabhängig davon, welcher Gottheit der Aasimar dient.' },
              { volk:'Druiden', relation:'Skepsis', text:'Das celestische ist weit vom Natürlichen entfernt. Druiden sind neugierig, aber vorsichtig.' },
            ].map((r,i) => (
              <div key={i} className="reveal insp-card">
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'10px' }}>
                  <div style={{ fontFamily:'var(--font-display)', fontSize:'12px', fontWeight:'400', letterSpacing:'0.14em', color:'var(--white)', textTransform:'uppercase' }}>{r.volk}</div>
                  <span className="relation-pill">{r.relation}</span>
                </div>
                <p style={{ fontFamily:'var(--font-body)', fontWeight:'300', fontSize:'12px', lineHeight:'1.7', color:'var(--muted)' }}>{r.text}</p>
              </div>
            ))}
          </div>
        </Section>

        {/* Bekannte */}
        <BekannteSection />

        {/* Namen */}
        <Section label="Charaktererstellung" title="Namen der Aasimar">
          <div style={{ padding:'24px', border:'1px solid rgba(124,77,255,0.14)', borderRadius:'4px', background:'rgba(var(--panel-rgb),0.6)' }}>
            <div className="reveal">
              <div style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.25em', color:'rgba(124,77,255,0.5)', textTransform:'uppercase', marginBottom:'14px' }}>Über Aasimar-Namen</div>
              <p className="body-text">
                Aasimar tragen den Namen, den sie vor ihrer Verwandlung hatten — oder den Namen der jeweiligen Kultur, in der sie aufwachsen. Es gibt keinen eigenen Aasimar-Namensstil; schaue dir die Namenstabelle der jeweiligen Ursprungsrasse an.
              </p>
              <p className="body-text" style={{ marginTop:'12px' }}>
                Manche Aasimar nehmen mit der Zeit einen zweiten Namen an — einen celestischen Beinamen, der ihre göttliche Natur widerspiegelt. Dieser Name ist kein offizieller Teil ihrer Identität, sondern ein innerer Name, den nur enge Vertraute kennen.
              </p>
            </div>
          </div>
        </Section>

        {/* Merkmals-Profil */}
        <RassenRadar />

        {/* Charakter-Quiz */}
        <AasimarQuiz />

        {/* Statblock */}
        <Section id="statblock" label="Regelwerk · PHB" title="Statblock">
          <div className="reveal"><StatBlock /></div>
        </Section>

        {/* Footer */}
        <div style={{ borderTop:'1px solid rgba(124,77,255,0.1)', paddingTop:'28px', display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:'14px' }}>
          <div style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.2em', color:'rgba(124,77,255,0.25)', textTransform:'uppercase' }}>Meruria · Charaktererstellung · Rassen · Aasimar</div>
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<SiteGate><App /></SiteGate>);
</script>


</body></html>
