<!DOCTYPE html>
<html lang="de"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meruria — Fischverzeichnis</title>
<link rel="stylesheet" href="assets/styles/global/fonts.css">
<link rel="stylesheet" href="assets/styles/global/base.css">
<link rel="stylesheet" href="assets/styles/pages/Fische.css">
<script src="assets/scripts/vendor/react.development.js"></script>
<script src="assets/scripts/vendor/react-dom.development.js"></script>
<script src="assets/scripts/vendor/babel-standalone.js"></script>
<script src="assets/scripts/data/resources/ff14_fish-data.js"></script>
<script src="assets/components/nav.jsx" type="text/babel"></script>
<script src="assets/components/site-gate.jsx" type="text/babel"></script>
<script src="assets/components/particle-field.jsx" type="text/babel"></script>
<script src="assets/components/tweaks-panel-8.jsx" type="text/babel"></script>
<script src="assets/components/filter-utils.jsx" type="text/babel"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useEffect, useRef, useCallback, useMemo } = React;
const { useTweaks, TweaksPanel, TweakSection, TweakToggle, SiteNav, ParticleField } = window;
const { FilterGroup, XBtn } = window;

const ALL_FISH = window.FISH_DB;

// ── Klima colours ─────────────────────────────────────────────────────────────
const KLIMA_COLOR = {
  'Gemäßigt':    '#4db6e8',
  'Kalt':        '#90d8f8',
  'Warm':        '#ffaa44',
  'Trocken':     '#d4b260',
  'Tiefsee':     '#3a6abf',
  'Stürmisch':   '#9898c0',
  'Sumpfig':     '#58b870',
  'Toxisch':     '#70e028',
  'Magisch':     '#c060e8',
  'Vulkanisch':  '#e85020',
  'Schattenhaft':'#9050c8',
  'Kosmisch':    '#5050e0',
};

const GRÖSSE_ORDER = ['Winzig','Klein','Mittelgroß','Groß','Riesig'];

const STÄRKE_GROUPS = [
  { label: '1 – 4',   min:1,  max:4  },
  { label: '5 – 8',   min:5,  max:8  },
  { label: '9 – 12',  min:9,  max:12 },
  { label: '13 – 16', min:13, max:16 },
];

const LEVEL_GROUPS = [
  { label: '1 – 10',  min:1,  max:10  },
  { label: '11 – 30', min:11, max:30  },
  { label: '31 – 60', min:31, max:60  },
  { label: '61 – 90', min:61, max:90  },
  { label: '91+',     min:91, max:999 },
];

const SORT_OPTIONS = [
  { id:'name-az',    label:'Name A – Z'   },
  { id:'name-za',    label:'Name Z – A'   },
  { id:'level-asc',  label:'Level ↑'      },
  { id:'level-desc', label:'Level ↓'      },
  { id:'preis-asc',  label:'Preis ↑'      },
  { id:'preis-desc', label:'Preis ↓'      },
  { id:'staerke',    label:'Stärke ↓'     },
  { id:'gewicht',    label:'Gewicht ↓'    },
];

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showParticles": true
}/*EDITMODE-END*/;

// ── Parsing helpers ───────────────────────────────────────────────────────────
function parseGewicht(s) {
  if (!s) return 0;
  const m = s.match(/([\d,]+)\s*(g|kg)/);
  if (!m) return 0;
  const v = parseFloat(m[1].replace(',', '.'));
  return m[2] === 'kg' ? v * 1000 : v;
}
function parsePreis(s) {
  if (!s) return 0;
  return parseInt(s.split(' ')[0]) || 0;
}

// ── Stärke bar colour ─────────────────────────────────────────────────────────
function barColor(stärke, i) {
  if (i >= stärke) return 'rgba(255,255,255,0.07)';
  if (stärke >= 13) return '#ffd700';
  if (stärke >= 9)  return '#e85020';
  if (stärke >= 5)  return '#26c6da';
  return 'rgba(38,198,218,0.6)';
}

// ── Fish Card ─────────────────────────────────────────────────────────────────
function FishCard({ fish }) {
  const s = fish.stärke ?? 0;
  return (
    <div className="fish-card">
      {/* Header: icon + name */}
      <div style={{ display:'flex', alignItems:'flex-start', gap:'9px', marginBottom:'2px' }}>
        <div className="fish-icon">
          <img src={fish.icon} alt="" loading="lazy" />
        </div>
        <div style={{ minWidth:0, flex:1 }}>
          <div className="fish-name">{fish.name_de}</div>
          <div className="fish-level">LVL {fish.level[0]}</div>
        </div>
      </div>

      <div className="fish-divider" />

      {/* Größe + Stärke */}
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:'4px', marginBottom:'6px' }}>
        <span className="fish-size-badge">{fish.größenkategorie}</span>
        <div className="staerke-bars" title={`Stärke ${s}/16`}>
          {Array.from({length:16},(_,i)=>(
            <div key={i} className="staerke-bar" style={{ background: barColor(s,i) }} />
          ))}
        </div>
      </div>

      {/* Klima */}
      <div className="fish-klima">
        {(fish.klima||[]).map(k => {
          const col = KLIMA_COLOR[k] || '#8888cc';
          return (
            <span key={k} className="fish-klima-chip" style={{ background:col+'1e', border:`1px solid ${col}44`, color:col }}>
              {k}
            </span>
          );
        })}
      </div>

      {/* Weight + Price */}
      <div className="fish-stats">
        <span className="fish-weight">{fish.gewicht}</span>
        <span className="fish-price">{fish.verkaufspreis}</span>
      </div>

      {/* Description snippet */}
      {fish.desc_de && (
        <p className="fish-desc">{fish.desc_de}</p>
      )}
    </div>
  );
}

// ── Filter Chip ───────────────────────────────────────────────────────────────
function Chip({ label, active, onClick, accentColor }) {
  const cls = ['filter-chip', active ? (accentColor ? 'active-klima' : 'active') : ''].filter(Boolean).join(' ');
  const style = accentColor && active
    ? { borderColor: accentColor+'77', background: accentColor+'1a', color:'#f0eeff' }
    : accentColor
    ? { borderColor: accentColor+'33', color: accentColor+'cc' }
    : {};
  return (
    <button className={cls} style={style} onClick={onClick}>{label}</button>
  );
}

// ── Filter Sidebar ────────────────────────────────────────────────────────────
function FilterSidebar({ filters, setFilters, total, filtered }) {
  const allKlimas = useMemo(() => {
    const s = new Set();
    ALL_FISH.forEach(f => (f.klima||[]).forEach(k => s.add(k)));
    return [...s].sort();
  }, []);

  const set = (key, val) => setFilters(f => ({...f, [key]: val}));
  const toggle = (key, val) => setFilters(f => {
    const arr = f[key]||[];
    return {...f, [key]: arr.includes(val) ? arr.filter(x=>x!==val) : [...arr,val]};
  });
  const resetAll = () => setFilters({ search:'', größe:[], klima:[], stärke:[], level:[], sort:'name-az' });
  const hasAny = filters.search || filters.größe.length || filters.klima.length ||
                 filters.stärke.length || filters.level.length || filters.sort !== 'name-az';

  return (
    <aside className="fish-sidebar">
      {/* Header */}
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'16px' }}>
        <div style={{ fontFamily:'var(--font-display)', fontSize:'10px', letterSpacing:'0.25em', color:'rgba(38,198,218,0.65)', textTransform:'uppercase' }}>Filter</div>
        {hasAny && <XBtn onClick={resetAll} />}
      </div>

      {/* Search */}
      <div style={{ position:'relative', marginBottom:'18px' }}>
        <input type="text" placeholder="Fisch suchen…"
          value={filters.search}
          onChange={e => set('search', e.target.value)} />
        <svg style={{ position:'absolute', right:'8px', top:'50%', transform:'translateY(-50%)', opacity:0.3, pointerEvents:'none' }} width="12" height="12" viewBox="0 0 12 12" fill="none">
          <circle cx="5" cy="5" r="3.5" stroke="rgba(38,198,218,1)" strokeWidth="1.2"/>
          <line x1="8" y1="8" x2="11" y2="11" stroke="rgba(38,198,218,1)" strokeWidth="1.2"/>
        </svg>
        {filters.search && (
          <button onClick={() => set('search','')} style={{ position:'absolute', right:'8px', top:'50%', transform:'translateY(-50%)', background:'none', border:'none', color:'rgba(200,190,240,0.5)', cursor:'pointer', padding:'0', fontSize:'10px', lineHeight:1 }}>✕</button>
        )}
      </div>

      {/* Größe */}
      <FilterGroup title="Größe" active={filters.größe.length>0} onReset={()=>set('größe',[])} collapsible>
        <div style={{ display:'flex', flexWrap:'wrap', gap:'4px' }}>
          {GRÖSSE_ORDER.map(g => (
            <Chip key={g} label={g} active={filters.größe.includes(g)} onClick={()=>toggle('größe',g)} />
          ))}
        </div>
      </FilterGroup>

      {/* Klima */}
      <FilterGroup title="Klima" active={filters.klima.length>0} onReset={()=>set('klima',[])} collapsible>
        <div style={{ display:'flex', flexWrap:'wrap', gap:'4px' }}>
          {allKlimas.map(k => (
            <Chip key={k} label={k} active={filters.klima.includes(k)} accentColor={KLIMA_COLOR[k]} onClick={()=>toggle('klima',k)} />
          ))}
        </div>
      </FilterGroup>

      {/* Stärke */}
      <FilterGroup title="Stärke" active={filters.stärke.length>0} onReset={()=>set('stärke',[])} collapsible>
        <div style={{ display:'flex', flexWrap:'wrap', gap:'4px' }}>
          {STÄRKE_GROUPS.map(g => (
            <Chip key={g.label} label={g.label} active={filters.stärke.includes(g.label)} onClick={()=>toggle('stärke',g.label)} />
          ))}
        </div>
      </FilterGroup>

      {/* Level */}
      <FilterGroup title="Level" active={filters.level.length>0} onReset={()=>set('level',[])} collapsible>
        <div style={{ display:'flex', flexWrap:'wrap', gap:'4px' }}>
          {LEVEL_GROUPS.map(g => (
            <Chip key={g.label} label={g.label} active={filters.level.includes(g.label)} onClick={()=>toggle('level',g.label)} />
          ))}
        </div>
      </FilterGroup>

      {/* Sortierung */}
      <FilterGroup title="Sortierung" active={filters.sort!=='name-az'} onReset={()=>set('sort','name-az')} collapsible>
        <div style={{ display:'flex', flexDirection:'column', gap:'2px' }}>
          {SORT_OPTIONS.map(opt => (
            <button key={opt.id} className={`sort-btn${filters.sort===opt.id?' active':''}`} onClick={()=>set('sort',opt.id)}>
              {opt.label}
            </button>
          ))}
        </div>
      </FilterGroup>

      {/* Count */}
      <div style={{ marginTop:'auto', paddingTop:'16px', borderTop:'1px solid rgba(38,198,218,0.08)' }}>
        <div className="fish-count">{filtered} / {total} Fische</div>
        {hasAny && (
          <button onClick={resetAll} style={{ width:'100%', padding:'6px', background:'rgba(200,60,60,0.08)', border:'1px solid rgba(200,60,60,0.25)', borderRadius:'2px', color:'rgba(230,90,90,0.7)', fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.18em', cursor:'pointer', transition:'all 0.15s', textTransform:'uppercase' }}
            onMouseEnter={e=>{e.currentTarget.style.background='rgba(200,60,60,0.18)';e.currentTarget.style.borderColor='rgba(230,90,90,0.55)';}}
            onMouseLeave={e=>{e.currentTarget.style.background='rgba(200,60,60,0.08)';e.currentTarget.style.borderColor='rgba(200,60,60,0.25)';}}>
            Filter löschen
          </button>
        )}
      </div>
    </aside>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [mouse, setMouse] = useState({ x:0.5, y:0.5 });
  const [tweaks] = useTweaks(TWEAK_DEFAULTS);
  const [filters, setFilters] = useState({ search:'', größe:[], klima:[], stärke:[], level:[], sort:'name-az' });

  const handleMouseMove = useCallback(e => setMouse({ x:e.clientX/window.innerWidth, y:e.clientY/window.innerHeight }), []);

  const filtered = useMemo(() => {
    let r = ALL_FISH;

    if (filters.search) {
      const q = filters.search.toLowerCase();
      r = r.filter(f => f.name_de.toLowerCase().includes(q) || f.desc_de.toLowerCase().includes(q));
    }
    if (filters.größe.length)
      r = r.filter(f => filters.größe.includes(f.größenkategorie));
    if (filters.klima.length)
      r = r.filter(f => (f.klima||[]).some(k => filters.klima.includes(k)));
    if (filters.stärke.length)
      r = r.filter(f => filters.stärke.some(g => {
        const grp = STÄRKE_GROUPS.find(x=>x.label===g);
        return grp && f.stärke>=grp.min && f.stärke<=grp.max;
      }));
    if (filters.level.length)
      r = r.filter(f => filters.level.some(g => {
        const grp = LEVEL_GROUPS.find(x=>x.label===g);
        return grp && f.level[0]>=grp.min && f.level[0]<=grp.max;
      }));

    r = [...r];
    switch (filters.sort) {
      case 'name-az':    r.sort((a,b)=>a.name_de.localeCompare(b.name_de,'de')); break;
      case 'name-za':    r.sort((a,b)=>b.name_de.localeCompare(a.name_de,'de')); break;
      case 'level-asc':  r.sort((a,b)=>a.level[0]-b.level[0]); break;
      case 'level-desc': r.sort((a,b)=>b.level[0]-a.level[0]); break;
      case 'preis-asc':  r.sort((a,b)=>parsePreis(a.verkaufspreis)-parsePreis(b.verkaufspreis)); break;
      case 'preis-desc': r.sort((a,b)=>parsePreis(b.verkaufspreis)-parsePreis(a.verkaufspreis)); break;
      case 'staerke':    r.sort((a,b)=>(b.stärke||0)-(a.stärke||0)); break;
      case 'gewicht':    r.sort((a,b)=>parseGewicht(b.gewicht)-parseGewicht(a.gewicht)); break;
    }
    return r;
  }, [filters]);

  return (
    <div onMouseMove={handleMouseMove} style={{ display:'flex', flexDirection:'column', height:'100vh', overflow:'hidden', position:'relative' }}>
      {tweaks.showParticles && <ParticleField mouseX={mouse.x} mouseY={mouse.y} />}
      <SiteNav rightLabel="FISCHVERZEICHNIS v1.0" />

      <div className="fish-layout">
        <FilterSidebar filters={filters} setFilters={setFilters} total={ALL_FISH.length} filtered={filtered.length} />

        <main className="fish-main">
          {/* Page title */}
          <div style={{ marginBottom:'22px' }}>
            <div style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.28em', color:'rgba(38,198,218,0.35)', textTransform:'uppercase', marginBottom:'5px' }}>Ressourcen</div>
            <h1 style={{ fontFamily:'var(--font-display)', fontSize:'32px', fontWeight:'300', letterSpacing:'0.18em', color:'#f0eeff', textShadow:'0 0 28px rgba(38,198,218,0.3)', lineHeight:1 }}>Fischverzeichnis</h1>
            <div style={{ display:'flex', alignItems:'center', gap:'8px', marginTop:'8px' }}>
              <div style={{ width:'38px', height:'1px', background:'linear-gradient(90deg,rgba(38,198,218,0.65),transparent)', animation:'pulse-glow 3s infinite' }} />
              <span style={{ fontFamily:'var(--font-mono)', fontSize:'8px', letterSpacing:'0.18em', color:'rgba(38,198,218,0.3)' }}>{filtered.length} Einträge</span>
            </div>
          </div>

          {/* Grid */}
          {filtered.length > 0
            ? <div className="fish-grid">{filtered.map(f=><FishCard key={f.id} fish={f}/>)}</div>
            : <div className="fish-empty">Keine Treffer</div>
          }
        </main>
      </div>

      <TweaksPanel>
        <TweakSection label="Darstellung" />
        <TweakToggle id="showParticles" label="Partikel" />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<SiteGate><App /></SiteGate>);
</script>
</body></html>
